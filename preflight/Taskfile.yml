version: '3'

vars:
  REPO_ROOT:
    sh: 'if [ -n "${REPO_ROOT:-}" ]; then printf "%s" "$REPO_ROOT"; else git rev-parse --show-toplevel; fi'
  PREFLIGHT_SOURCE_ROOT:
    sh: 'if [ -n "${PREFLIGHT_SOURCE_ROOT:-}" ]; then printf "%s" "$PREFLIGHT_SOURCE_ROOT"; else printf "%s" "{{.REPO_ROOT}}"; fi'
  DOCKER: '{{default "docker" .DOCKER}}'
  SCCACHE_S3_MODE: '{{default "external" .SCCACHE_S3_MODE}}'
  SCCACHE_ENDPOINT: '{{default "https://sccache.dev.nokey.sh" .SCCACHE_ENDPOINT}}'
  SCCACHE_BUCKET: '{{default "nook-sccache" .SCCACHE_BUCKET}}'
  SCCACHE_S3_ACCESS_KEY_FILE:
    sh: >-
      if [ -n "${SCCACHE_S3_ACCESS_KEY_FILE:-}" ]; then
        printf '%s' "$SCCACHE_S3_ACCESS_KEY_FILE";
      else
        printf '%s' "${HOME}/.nook/cache/sccache-access-key";
      fi
  SCCACHE_S3_SECRET_KEY_FILE:
    sh: >-
      if [ -n "${SCCACHE_S3_SECRET_KEY_FILE:-}" ]; then
        printf '%s' "$SCCACHE_S3_SECRET_KEY_FILE";
      else
        printf '%s' "${HOME}/.nook/cache/sccache-secret-key";
      fi
  SCCACHE_S3_BUILD_SECRETS:
    sh: >-
      access_file="{{.SCCACHE_S3_ACCESS_KEY_FILE}}";
      secret_file="{{.SCCACHE_S3_SECRET_KEY_FILE}}";
      secrets="";
      if [ -n "$access_file" ] && [ -r "$access_file" ] &&
         [ -n "$secret_file" ] && [ -r "$secret_file" ]; then
        secrets="--allow=fs.read=$access_file --allow=fs.read=$secret_file";
        secrets="$secrets --set '*.secrets=id=sccache_s3_access_key,src=$access_file'";
        secrets="$secrets --set '*.secrets+=id=sccache_s3_secret_key,src=$secret_file'";
      fi;
      printf '%s' "$secrets"
  PREFLIGHT_BAKE_FILES: >-
    --allow=fs.read={{.REPO_ROOT}}
    --allow=fs.read={{.PREFLIGHT_SOURCE_ROOT}}
    {{.SCCACHE_S3_BUILD_SECRETS}}
    -f {{.REPO_ROOT}}/nook-app/docker-bake.hcl
    -f {{.REPO_ROOT}}/nook-app/nook-platform/docker/rust/docker-bake.hcl
    -f {{.REPO_ROOT}}/preflight/docker-bake.hcl
    --set '*.context={{.REPO_ROOT}}'
    --set '*.args.SCCACHE_S3_MODE={{.SCCACHE_S3_MODE}}'
    --set '*.args.SCCACHE_ENDPOINT={{.SCCACHE_ENDPOINT}}'
    --set '*.args.SCCACHE_BUCKET={{.SCCACHE_BUCKET}}'

tasks:
  preflight:
    desc: Run all repository-wide invariant tests.
    cmds:
      - task: preflight:test

  preflight:test:
    desc: Run the Rust preflight test suite in Docker.
    dir: '{{.REPO_ROOT}}'
    deps:
      - sccache:ensure
    cmds:
      # rust-base is restored via Bake contexts; never let this target write it.
      - >-
        PREFLIGHT_SOURCE_CONTEXT="{{.PREFLIGHT_SOURCE_ROOT}}"
        bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh"
        "preflight:test"
        {{.DOCKER}} buildx bake
        {{.PREFLIGHT_BAKE_FILES}}
        preflight-test

  preflight:export:
    desc: Export the static Rust preflight reporter for downstream CI jobs.
    dir: '{{.REPO_ROOT}}'
    deps:
      - sccache:ensure
    requires:
      vars: [PREFLIGHT_OUTPUT_DIR]
    vars:
      # Nested local outputs need fs.write on the parent so Bake can create the
      # tools directory under an already-populated CI artifact root.
      PREFLIGHT_OUTPUT_PARENT:
        sh: 'dirname "{{.PREFLIGHT_OUTPUT_DIR}}"'
    cmds:
      - mkdir -p '{{.PREFLIGHT_OUTPUT_DIR}}'
      - >-
        bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh"
        "preflight:export"
        {{.DOCKER}} buildx bake
        {{.PREFLIGHT_BAKE_FILES}}
        --allow="fs.write={{.PREFLIGHT_OUTPUT_PARENT}}"
        --allow="fs.write={{.PREFLIGHT_OUTPUT_DIR}}"
        --set "preflight-cli-export.output=type=local,dest={{.PREFLIGHT_OUTPUT_DIR}}"
        preflight-cli-export

  preflight:dependency-policy:
    desc: Run cargo-deny and cargo-audit for the preflight workspace.
    cmds:
      - task: docker:ecosystem:dependency-policy:run
        vars: { WORKSPACE: preflight }

  preflight:source-architecture:
    desc: Enforce source architecture and repository language boundaries.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - >-
        cargo test
        --locked
        --manifest-path preflight/Cargo.toml
        --test source_file_size
      - >-
        cargo test
        --locked
        --manifest-path preflight/Cargo.toml
        --test repository_languages

  preflight:typescript-state:
    desc: Enforce authored TypeScript absence, enum, and state-modeling invariants.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - >-
        cargo test
        --locked
        --manifest-path preflight/Cargo.toml
        --test core_ownership
        typescript_

  preflight:loom-contracts:
    desc: Enforce Loom ESLint max-params and verify-script wiring.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - >-
        cargo test
        --locked
        --manifest-path preflight/Cargo.toml
        --test loom_contracts

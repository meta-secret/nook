version: "3"

vars:
  REPO_ROOT:
    sh: 'if [ -n "${REPO_ROOT:-}" ]; then printf "%s" "$REPO_ROOT"; else git rev-parse --show-toplevel; fi'
  PREFLIGHT_SOURCE_ROOT:
    sh: 'if [ -n "${PREFLIGHT_SOURCE_ROOT:-}" ]; then printf "%s" "$PREFLIGHT_SOURCE_ROOT"; else printf "%s" "{{.REPO_ROOT}}"; fi'
  DOCKER: '{{default "docker" .DOCKER}}'
  SCCACHE_S3_MODE: '{{default "external" .SCCACHE_S3_MODE}}'
  SCCACHE_ENDPOINT: '{{default "https://sccache.dev.nokey.sh" .SCCACHE_ENDPOINT}}'
  SCCACHE_BUCKET: '{{default "nook-sccache" .SCCACHE_BUCKET}}'
  SCCACHE_S3_ACCESS_KEY_FILE:
    sh: >-
      if [ -n "${SCCACHE_S3_ACCESS_KEY_FILE:-}" ]; then
        printf '%s' "$SCCACHE_S3_ACCESS_KEY_FILE";
      else
        printf '%s' "${HOME}/.nook/cache/sccache-access-key";
      fi
  SCCACHE_S3_SECRET_KEY_FILE:
    sh: >-
      if [ -n "${SCCACHE_S3_SECRET_KEY_FILE:-}" ]; then
        printf '%s' "$SCCACHE_S3_SECRET_KEY_FILE";
      else
        printf '%s' "${HOME}/.nook/cache/sccache-secret-key";
      fi
  SCCACHE_S3_BUILD_SECRETS:
    sh: >-
      access_file="{{.SCCACHE_S3_ACCESS_KEY_FILE}}";
      secret_file="{{.SCCACHE_S3_SECRET_KEY_FILE}}";
      secrets="";
      if [ -n "$access_file" ] && [ -r "$access_file" ] &&
         [ -n "$secret_file" ] && [ -r "$secret_file" ]; then
        secrets="--allow=fs.read=$access_file --allow=fs.read=$secret_file";
        secrets="$secrets --set '*.secrets=id=sccache_s3_access_key,src=$access_file'";
        secrets="$secrets --set '*.secrets+=id=sccache_s3_secret_key,src=$secret_file'";
      fi;
      printf '%s' "$secrets"
  PREFLIGHT_BAKE_FILES: >-
    --allow=fs.read={{.REPO_ROOT}}
    --allow=fs.read={{.PREFLIGHT_SOURCE_ROOT}}
    {{.SCCACHE_S3_BUILD_SECRETS}}
    -f {{.REPO_ROOT}}/nook-app/docker-bake.hcl
    -f {{.REPO_ROOT}}/nook-app/nook-platform/docker/rust/docker-bake.hcl
    -f {{.REPO_ROOT}}/preflight/docker-bake.hcl
    --set '*.context={{.REPO_ROOT}}'
    --set '*.args.SCCACHE_S3_MODE={{.SCCACHE_S3_MODE}}'
    --set '*.args.SCCACHE_ENDPOINT={{.SCCACHE_ENDPOINT}}'
    --set '*.args.SCCACHE_BUCKET={{.SCCACHE_BUCKET}}'

tasks:
  preflight:
    desc: Run all repository-wide invariant tests with the independent 90% line floor.
    cmds:
      - task: preflight:test

  preflight:test:
    desc: Run the Rust preflight test suite and coverage floor in Docker.
    dir: "{{.REPO_ROOT}}"
    deps:
      - sccache:ensure
    cmds:
      # rust-base is restored via Bake contexts; never let this target write it.
      - >-
        PREFLIGHT_SOURCE_CONTEXT="{{.PREFLIGHT_SOURCE_ROOT}}"
        bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh"
        "preflight:test"
        {{.DOCKER}} buildx bake
        {{.PREFLIGHT_BAKE_FILES}}
        preflight-test

  preflight:format-contract:
    desc: Verify shared formatter and Dockerized CI contracts.
    dir: "{{.REPO_ROOT}}"
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/format-host-apply.test.sh"
      - test -f "{{.REPO_ROOT}}/.github/scripts/dockerized-rust.test.ts"
      - bun test ./.github/scripts/dockerized-rust.test.ts

  preflight:export:
    desc: Export the static Rust preflight reporter for downstream CI jobs.
    dir: "{{.REPO_ROOT}}"
    deps:
      - sccache:ensure
    requires:
      vars: [PREFLIGHT_OUTPUT_DIR]
    vars:
      # Nested local outputs need fs.write on the parent so Bake can create the
      # tools directory under an already-populated CI artifact root.
      PREFLIGHT_OUTPUT_PARENT:
        sh: 'dirname "{{.PREFLIGHT_OUTPUT_DIR}}"'
    cmds:
      - mkdir -p '{{.PREFLIGHT_OUTPUT_DIR}}'
      - >-
        bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh"
        "preflight:export"
        {{.DOCKER}} buildx bake
        {{.PREFLIGHT_BAKE_FILES}}
        --allow="fs.write={{.PREFLIGHT_OUTPUT_PARENT}}"
        --allow="fs.write={{.PREFLIGHT_OUTPUT_DIR}}"
        --set "preflight-cli-export.output=type=local,dest={{.PREFLIGHT_OUTPUT_DIR}}"
        preflight-cli-export

  preflight:dependency-policy:
    desc: Run cargo-deny and cargo-audit for the preflight workspace.
    cmds:
      - task: docker:ecosystem:dependency-policy:run
        vars: { WORKSPACE: preflight }

  preflight:policy:run:
    internal: true
    desc: Execute the selected Rust policy stage through BuildKit.
    dir: "{{.REPO_ROOT}}"
    requires:
      vars: [POLICY_STAGE]
    cmds:
      - |
        set -euo pipefail
        metadata="$(mktemp -d)"
        trap 'rm -rf "$metadata"' EXIT
        # Reconstruct portable Git metadata without checkout credentials, hooks,
        # alternates, or absolute worktree pointers from the runner.
        git clone --quiet --no-local --no-checkout --depth 1 '{{.REPO_ROOT}}' "$metadata/repository"
        test "$(git -C "$metadata/repository" rev-parse HEAD)" = "$(git -C '{{.REPO_ROOT}}' rev-parse HEAD)"
        git -C "$metadata/repository" remote remove origin
        git -C "$metadata/repository" read-tree HEAD
        printf '{}' > "$metadata/event.json"
        case '{{.POLICY_STAGE}}' in
          repository-policy|repository-policy-untrusted)
            baseline="$(git -C '{{.REPO_ROOT}}' rev-parse refs/remotes/origin/main)"
            git -C "$metadata/repository" fetch --quiet --no-tags --depth 1 '{{.REPO_ROOT}}' "$baseline:refs/remotes/origin/main"
            if [ -n "${GITHUB_EVENT_PATH:-}" ]; then
              jq '{pull_request: {base: {sha: .pull_request.base.sha}}, before: .before}' "$GITHUB_EVENT_PATH" > "$metadata/event.json"
              event_base="$(jq -r '.pull_request.base.sha // .before // empty' "$metadata/event.json")"
              if [ -n "$event_base" ] && [ "$event_base" != 0000000000000000000000000000000000000000 ]; then
                git -C "$metadata/repository" fetch --quiet --no-tags --depth 1 '{{.REPO_ROOT}}' "$event_base"
              fi
            fi
            ;;
        esac
        mv "$metadata/repository/.git" "$metadata/git"
        rmdir "$metadata/repository"
        PREFLIGHT_SOURCE_CONTEXT="{{.PREFLIGHT_SOURCE_ROOT}}" \
          {{.DOCKER}} buildx bake \
          {{.PREFLIGHT_BAKE_FILES}} \
          --allow="fs.read=$metadata" \
          --set "preflight-{{.POLICY_STAGE}}.contexts.repository-git=$metadata" \
          preflight-{{.POLICY_STAGE}}

  preflight:repository-policy:
    desc: Verify preflight, formatter contracts, and Loom inside Docker.
    cmds:
      - task: preflight:policy:run
        vars: { POLICY_STAGE: repository-policy }

  preflight:repository-policy-untrusted:
    desc: Verify targeted preflight contracts and Loom inside secret-free Docker.
    cmds:
      - task: preflight:policy:run
        vars: { POLICY_STAGE: repository-policy-untrusted }

  preflight:loom-verify:
    desc: Verify Loom with pinned Docker Rust, Bun, Task, and Vale.
    cmds:
      - task: preflight:policy:run
        vars: { POLICY_STAGE: loom-verify }

  preflight:source-architecture:
    desc: Enforce source architecture and repository language boundaries in Docker.
    cmds:
      - task: preflight:policy:run
        vars: { POLICY_STAGE: source-architecture }

  preflight:typescript-state:
    desc: Enforce authored TypeScript state-modeling invariants in Docker.
    cmds:
      - task: preflight:policy:run
        vars: { POLICY_STAGE: typescript-state }

  preflight:loom-contracts:
    desc: Enforce hosted Loom and skill-authority contracts in Docker.
    cmds:
      - task: preflight:policy:run
        vars: { POLICY_STAGE: loom-contracts }

[package]
name = "nook-preflight"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", features = ["full", "visit"] }
tree-sitter = "0.27.1"
tree-sitter-svelte-next = "0.1.1"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
anyhow = "1.0.104"
ignore = "0.4.34"
regex = "1.13.1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
absolute_paths = "deny"
expect_used = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"
indexing_slicing = "deny"
string_slice = "deny"

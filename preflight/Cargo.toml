[package]
name = "nook-preflight"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
serde_json = "1.0.149"
syn = { version = "3.0.3", features = ["full", "visit"] }
tree-sitter = "0.26.12"
tree-sitter-svelte-next = "0.1.1"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
anyhow = "1.0.104"
ignore = "0.4.33"
json5 = "1.3.1"
regex = "1.13.1"
serde = "1.0.229"
serde-value = "0.7.0"
serde_yaml_ng = "0.10.0"
toml = "1.1.4"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

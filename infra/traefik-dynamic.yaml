tcp:
  routers:
    redis:
      entryPoints:
        - redis
      rule: HostSNI(`redis-ovh-borg-1.bynull.link`)
      service: redis
      tls:
        certResolver: letsencrypt

  services:
    redis:
      loadBalancer:
        servers:
          - address: 127.0.0.1:6379

http:
  routers:
    registry:
      entryPoints:
        - websecure
      rule: Host(`registry.nokey.sh`)
      service: registry
      tls:
        certResolver: letsencrypt

  services:
    registry:
      loadBalancer:
        servers:
          - url: http://10.96.90.10:5000

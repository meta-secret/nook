name: nook-infra

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.03@sha256:d24be3bc1d6e8e305c095c446cb9a00d40e3afdac82fb2a1cc96f2d42c4a8e80
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master.port=9333
      # Avoid host :8080 — kube-router already listens there.
      - -volume.port=18080
      - -filer
      - -filer.port=8888
      - -s3
      - -s3.port=8333
      - -s3.ip.bind=127.0.0.1
      - -s3.config=/etc/seaweedfs/s3.json
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/lib/nook/seaweedfs:/data
      - ./secrets/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Anonymous S3 correctly returns 403; treat that as healthy listener proof.
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/); case $$code in 200|401|403) exit 0;; *) exit 1;; esac",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    mem_limit: 4g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  traefik:
    image: traefik:v3.7.1@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    command:
      - --entryPoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=true
      - --certificatesResolvers.letsencrypt.acme.email=admin@bynull.link
      - --certificatesResolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesResolvers.letsencrypt.acme.tlsChallenge=true
      - --accesslog=true
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - traefik-data:/data
    depends_on:
      seaweedfs:
        condition: service_healthy
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  traefik-data:

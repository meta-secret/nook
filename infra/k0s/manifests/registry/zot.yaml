apiVersion: v1
kind: ConfigMap
metadata:
  name: nook-zot
  namespace: hive-data
  labels:
    app.kubernetes.io/name: nook-zot
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": true,
        "gc": true,
        "gcDelay": "24h",
        "gcInterval": "24h",
        "retention": {
          "dryRun": false,
          "delay": "24h",
          "policies": [
            {
              "repositories": ["nook/remote-buildcache/**"],
              "deleteReferrers": true,
              "deleteUntagged": true,
              "keepTags": [{"pushedWithin": "168h"}]
            },
            {
              "repositories": ["**"],
              "deleteReferrers": false,
              "deleteUntagged": true,
              "keepTags": [{"patterns": [".*"]}]
            }
          ]
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "compat": ["docker2s2"],
        "readTimeout": "15m",
        "writeTimeout": "15m",
        "auth": {
          "htpasswd": {
            "path": "/etc/zot/htpasswd"
          }
        },
        "accessControl": {
          "repositories": {
            "nook/buildcache/**": {
              "policies": [
                {
                  "users": ["__NOOK_REGISTRY_REMOTE_USERNAME__"],
                  "actions": ["read"]
                }
              ]
            },
            "nook/remote-buildcache/**": {
              "policies": [
                {
                  "users": ["__NOOK_REGISTRY_REMOTE_USERNAME__"],
                  "actions": ["read", "create", "update"]
                }
              ]
            },
            "nook-hive": {
              "policies": [
                {
                  "users": ["__NOOK_REGISTRY_USERNAME__"],
                  "actions": ["read", "create", "update", "delete"]
                }
              ]
            },
            "**": {
              "anonymousPolicy": ["read"]
            }
          },
          "adminPolicy": {
            "users": ["__NOOK_REGISTRY_USERNAME__"],
            "actions": ["read", "create", "update", "delete"]
          }
        }
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "sync": {
          "enable": true,
          "registries": [
            {
              "urls": ["https://index.docker.io"],
              "onDemand": true,
              "tlsVerify": true,
              "preserveDigest": true,
              "maxRetries": 6,
              "retryDelay": "5s",
              "maxRetryDelay": "30s",
              "syncTimeout": "15m"
            }
          ]
        }
      }
    }
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nook-zot-local-retain
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nook-zot-data
  labels:
    app.kubernetes.io/name: nook-zot
spec:
  capacity:
    storage: 1Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nook-zot-local-retain
  local:
    path: /var/lib/hive/zot
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: hive.nook.sh/storage
              operator: In
              values: ["local"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nook-zot-data
  namespace: hive-data
  labels:
    app.kubernetes.io/name: nook-zot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
  storageClassName: nook-zot-local-retain
  volumeName: nook-zot-data
---
apiVersion: v1
kind: Service
metadata:
  name: nook-zot
  namespace: hive-data
  labels:
    app.kubernetes.io/name: nook-zot
spec:
  type: ClusterIP
  clusterIP: 10.96.90.10
  selector:
    app.kubernetes.io/name: nook-zot
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nook-zot
  namespace: hive-data
  labels:
    app.kubernetes.io/name: nook-zot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nook-zot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nook-zot
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        hive.nook.sh/storage: local
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64@sha256:95a837a0afacf5b7edc0c92493f04beee6891989b8d2fd50a00cf65a1e6d4fd5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /startupz
              port: registry
            periodSeconds: 5
            # A restart rebuilds Zot metadata across thousands of immutable
            # cache repositories. Do not kill that bounded recovery scan.
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /readyz
              port: registry
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: registry
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 12Gi
          volumeMounts:
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
              readOnly: true
            - name: htpasswd
              mountPath: /etc/zot/htpasswd
              subPath: htpasswd
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: nook-zot
        - name: htpasswd
          secret:
            secretName: nook-zot-htpasswd
        - name: data
          persistentVolumeClaim:
            claimName: nook-zot-data
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nook-zot
  namespace: hive-data
  labels:
    app.kubernetes.io/name: nook-zot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nook-zot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 5000
      from:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
  egress:
    - {}

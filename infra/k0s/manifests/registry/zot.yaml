apiVersion: v1
kind: ConfigMap
metadata:
  name: nook-zot
  namespace: hive-data
  labels:
    app.kubernetes.io/name: nook-zot
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": true,
        "gc": true,
        "gcDelay": "24h",
        "gcInterval": "24h"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "compat": ["docker2s2"],
        "readTimeout": "5m",
        "writeTimeout": "5m"
      },
      "log": {
        "level": "info"
      }
    }
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nook-zot-local-retain
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nook-zot-data
  labels:
    app.kubernetes.io/name: nook-zot
spec:
  capacity:
    storage: 1Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nook-zot-local-retain
  local:
    path: /var/lib/hive/zot
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: hive.nook.sh/storage
              operator: In
              values: ["local"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nook-zot-data
  namespace: hive-data
  labels:
    app.kubernetes.io/name: nook-zot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
  storageClassName: nook-zot-local-retain
  volumeName: nook-zot-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nook-zot
  namespace: hive-data
  labels:
    app.kubernetes.io/name: nook-zot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nook-zot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nook-zot
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        hive.nook.sh/storage: local
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64@sha256:34f18f783037f967dba10df02f9d4086c4d626f5643ef9f5e51e4a4547280a0b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /startupz
              port: registry
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: registry
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: registry
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: config
          configMap:
            name: nook-zot
        - name: data
          persistentVolumeClaim:
            claimName: nook-zot-data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nook-zot-default-deny
  namespace: hive-data
  labels:
    app.kubernetes.io/name: nook-zot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nook-zot
  policyTypes:
    - Ingress
    - Egress

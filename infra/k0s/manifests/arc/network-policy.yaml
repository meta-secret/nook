apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arc-runner-default-deny-ingress
  namespace: arc-runners
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arc-runner-to-buildkit
  namespace: arc-runners
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nook-buildkit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: nook.nokey.sh/role
                operator: In
                values: ["arc-runner", "arc-hive-runner", "arc-buildkit-benchmark"]
      ports:
        - protocol: TCP
          port: 1234
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arc-controller-default-deny-ingress
  namespace: arc-systems
spec:
  podSelector: {}
  policyTypes:
    - Ingress

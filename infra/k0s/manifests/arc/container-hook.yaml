apiVersion: v1
kind: ConfigMap
metadata:
  name: nook-arc-container-hook
  namespace: arc-runners
data:
  content.yaml: |
    apiVersion: v1
    kind: PodTemplate
    metadata:
      labels:
        nook.nokey.sh/role: arc-job-container
        nook.nokey.sh/arc-spread-group: container
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # kubernetes-novolume creates the repository workspace as uid 1001 with
      # mode 2755. The sealed browser image runs as root with every capability
      # dropped, so root intentionally cannot bypass that mode. Preserve the
      # hook's mounts and make its generated work tree group-writable instead.
      initContainers:
        - name: install-docker-client
          image: registry.dev.nokey.sh/library/docker:29.2.1-cli@sha256:cab69e2d0a1a2ea9a1ce1060252f439e83483ae41ec09317aecb33b08a0656a5
          command:
            - sh
            - -ceu
            - |
              cp /usr/local/bin/docker /docker-client/docker
              cp /usr/local/libexec/docker/cli-plugins/docker-buildx /docker-client/docker-buildx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: docker-client
              mountPath: /docker-client
        - name: fs-init
          image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
          command:
            - sh
            - -c
            - >-
              mkdir -p /mnt/externals /mnt/work /mnt/github
              && mv /home/runner/externals/* /mnt/externals/
              && mkdir -p /mnt/work/nook/nook
              && chmod -R g+rwX /mnt/work/nook
          securityContext:
            runAsGroup: 1001
            runAsUser: 1001
          volumeMounts:
            - name: externals
              mountPath: /mnt/externals
            - name: work
              mountPath: /mnt/work
            - name: github
              mountPath: /mnt/github
      nodeSelector:
        nook.nokey.sh/arc-build: "true"
        nook.nokey.sh/arc-container-job: "true"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nook.nokey.sh/arc-tier
                    operator: In
                    values: [primary]
            - weight: 50
              preference:
                matchExpressions:
                  - key: nook.nokey.sh/arc-tier
                    operator: In
                    values: [secondary]
            - weight: 1
              preference:
                matchExpressions:
                  - key: nook.nokey.sh/arc-tier
                    operator: In
                    values: [overflow]
      topologySpreadConstraints:
        # Match the regular runner's soft, primary-dominant placement intent.
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              nook.nokey.sh/arc-spread-group: container
      containers:
        - name: "$job"
          env:
            - name: NOOK_ARC_RUNNER
              value: "1"
            - name: NOOK_BUILDKIT_REMOTE
              value: "1"
            - name: NOOK_BUILDKIT_ADDR
              value: tcp://nook-buildkit.arc-runners.svc.cluster.local:1234
          volumeMounts:
            # Composite-action expressions resolve against the runner-side
            # workspace path. Mount the same work volume at that alias so
            # local action scripts and their helper modules stay reachable.
            - name: work
              mountPath: /home/runner/_work
            - name: docker-client
              mountPath: /usr/local/bin/docker
              subPath: docker
              readOnly: true
            - name: docker-client
              mountPath: /usr/local/libexec/docker/cli-plugins/docker-buildx
              subPath: docker-buildx
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: docker-client
          emptyDir:
            sizeLimit: 128Mi

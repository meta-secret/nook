apiVersion: v1
kind: ConfigMap
metadata:
  name: nook-arc-container-hook
  namespace: arc-runners
data:
  content.yaml: |
    apiVersion: v1
    kind: PodTemplate
    metadata:
      labels:
        nook.nokey.sh/role: arc-job-container
        nook.nokey.sh/arc-spread-group: container
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # kubernetes-novolume creates the repository workspace as uid 1001 with
      # mode 2755. The sealed browser image runs as root with every capability
      # dropped, so root intentionally cannot bypass that mode. Preserve the
      # hook's mounts and make its generated work tree group-writable instead.
      initContainers:
        - name: fs-init
          image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
          command:
            - sh
            - -c
            - >-
              mkdir -p /mnt/externals /mnt/work /mnt/github
              && mv /home/runner/externals/* /mnt/externals/
              && mkdir -p /mnt/work/nook/nook
              && chmod -R g+rwX /mnt/work
          securityContext:
            runAsGroup: 1001
            runAsUser: 1001
          volumeMounts:
            - name: externals
              mountPath: /mnt/externals
            - name: work
              mountPath: /mnt/work
            - name: github
              mountPath: /mnt/github
      nodeSelector:
        nook.nokey.sh/arc-build: "true"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nook.nokey.sh/arc-tier
                    operator: In
                    values: [primary]
            - weight: 50
              preference:
                matchExpressions:
                  - key: nook.nokey.sh/arc-tier
                    operator: In
                    values: [secondary]
            - weight: 1
              preference:
                matchExpressions:
                  - key: nook.nokey.sh/arc-tier
                    operator: In
                    values: [overflow]
      topologySpreadConstraints:
        - maxSkew: 5
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              nook.nokey.sh/arc-spread-group: container
      containers:
        - name: "$job"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "4"
              memory: 6Gi
              ephemeral-storage: 32Gi

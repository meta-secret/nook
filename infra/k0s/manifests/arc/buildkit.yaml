apiVersion: apps/v1
kind: Deployment
metadata:
  name: nook-arc-buildkit
  namespace: arc-runners
  labels:
    nook.nokey.sh/role: arc-buildkit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      nook.nokey.sh/role: arc-buildkit
  template:
    metadata:
      labels:
        nook.nokey.sh/role: arc-buildkit
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: buildkit
          image: moby/buildkit:v0.32.2-rootless@sha256:504731e577c20559c00f968f33219f30115e70be29ab96728d1d06e963fc494b
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            - --oci-worker-snapshotter
            - native
            - --oci-worker-gc
            - --oci-worker-gc-keepstorage
            - "80000"
          ports:
            - name: buildkit
              containerPort: 1234
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          readinessProbe:
            exec:
              command:
                - buildctl
                - --addr
                - tcp://127.0.0.1:1234
                - debug
                - workers
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: "8"
              memory: 24Gi
              ephemeral-storage: 100Gi
            limits:
              cpu: "24"
              memory: 64Gi
              ephemeral-storage: 400Gi
          volumeMounts:
            - name: buildkit-state
              mountPath: /home/user/.local/share/buildkit
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: buildkit-state
          emptyDir:
            sizeLimit: 400Gi
        - name: temporary
          emptyDir:
            sizeLimit: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nook-arc-buildkit
  namespace: arc-runners
spec:
  selector:
    nook.nokey.sh/role: arc-buildkit
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arc-runner-to-buildkit
  namespace: arc-runners
spec:
  podSelector:
    matchLabels:
      nook.nokey.sh/role: arc-buildkit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              nook.nokey.sh/role: arc-runner
      ports:
        - protocol: TCP
          port: 1234

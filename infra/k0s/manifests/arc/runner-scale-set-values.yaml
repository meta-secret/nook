githubConfigUrl: https://github.com/meta-secret/nook
githubConfigSecret: nook-arc-github

runnerScaleSetName: nook-k0s
minRunners: 0
maxRunners: 35

controllerServiceAccount:
  namespace: arc-systems
  name: nook-arc-gha-rs-controller

listenerTemplate:
  spec:
    nodeSelector:
      nook.nokey.sh/node-role: control-storage
    tolerations:
      - key: nook.nokey.sh/arc-build
        operator: Equal
        value: preparing
        effect: NoSchedule
    containers:
      - name: listener
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi

template:
  metadata:
    labels:
      nook.nokey.sh/role: arc-runner
      nook.nokey.sh/arc-spread-group: general
  spec:
    nodeSelector:
      nook.nokey.sh/arc-build: "true"
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: nook.nokey.sh/arc-tier
                  operator: In
                  values: [primary]
          - weight: 50
            preference:
              matchExpressions:
                - key: nook.nokey.sh/arc-tier
                  operator: In
                  values: [secondary]
          - weight: 1
            preference:
              matchExpressions:
                - key: nook.nokey.sh/arc-tier
                  operator: In
                  values: [overflow]
    topologySpreadConstraints:
      # Prefer balanced primary placement without forcing weaker tiers toward
      # an equal share during bursts. Tier affinity expresses primary order.
      - maxSkew: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            nook.nokey.sh/arc-spread-group: general
    securityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    automountServiceAccountToken: false
    enableServiceLinks: false
    terminationGracePeriodSeconds: 60
    initContainers:
      - name: install-docker-client
        image: registry.dev.nokey.sh/library/docker:29.2.1-cli@sha256:cab69e2d0a1a2ea9a1ce1060252f439e83483ae41ec09317aecb33b08a0656a5
        command:
          - /bin/sh
          - -ceu
          - |
            install -m 0755 /usr/local/bin/docker /docker-client/docker
            install -m 0755 \
              /usr/local/libexec/docker/cli-plugins/docker-buildx \
              /docker-client/docker-buildx
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: docker-client
            mountPath: /docker-client
          - name: temporary
            mountPath: /tmp
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 256Mi
    containers:
      - name: runner
        image: ghcr.io/meta-secret/nook-arc-runner@sha256:64dc2f6c9e51f560165bacf3b21e87875be70271830924dae3fe0dae4407e10b
        command: ["/home/runner/run.sh"]
        env:
          - name: NOOK_ARC_RUNNER
            value: "1"
          - name: NOOK_BUILDKIT_REMOTE
            value: "1"
          - name: NOOK_BUILDKIT_ADDR
            value: tcp://nook-buildkit.arc-runners.svc.cluster.local:1234
          - name: KUBERNETES_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: docker-config
            mountPath: /home/runner/.docker
          - name: docker-client
            mountPath: /usr/local/bin/docker
            subPath: docker
            readOnly: true
          - name: docker-client
            mountPath: /usr/local/libexec/docker/cli-plugins/docker-buildx
            subPath: docker-buildx
            readOnly: true
          - name: temporary
            mountPath: /tmp
          - name: tool-cache
            mountPath: /opt/hostedtoolcache
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 32Gi
      - name: docker-config
        emptyDir:
          sizeLimit: 64Mi
      - name: docker-client
        emptyDir:
          sizeLimit: 128Mi
      - name: temporary
        emptyDir:
          sizeLimit: 16Gi
      - name: tool-cache
        emptyDir:
          sizeLimit: 2Gi

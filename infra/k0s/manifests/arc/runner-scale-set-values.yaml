githubConfigUrl: https://github.com/meta-secret/nook
githubConfigSecret: nook-arc-github

runnerScaleSetName: nook-k0s
minRunners: 0
maxRunners: 35

controllerServiceAccount:
  namespace: arc-systems
  name: nook-arc-gha-rs-controller

listenerTemplate:
  spec:
    nodeSelector:
      nook.nokey.sh/node-role: control-storage
    tolerations:
      - key: nook.nokey.sh/arc-build
        operator: Equal
        value: preparing
        effect: NoSchedule
    containers:
      - name: listener
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi

template:
  metadata:
    labels:
      nook.nokey.sh/role: arc-runner
      nook.nokey.sh/arc-spread-group: general
  spec:
    nodeSelector:
      nook.nokey.sh/arc-build: "true"
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: nook.nokey.sh/arc-tier
                  operator: In
                  values: [primary]
          - weight: 50
            preference:
              matchExpressions:
                - key: nook.nokey.sh/arc-tier
                  operator: In
                  values: [secondary]
          - weight: 1
            preference:
              matchExpressions:
                - key: nook.nokey.sh/arc-tier
                  operator: In
                  values: [overflow]
    topologySpreadConstraints:
      - maxSkew: 5
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            nook.nokey.sh/arc-spread-group: general
    securityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    automountServiceAccountToken: false
    enableServiceLinks: false
    terminationGracePeriodSeconds: 60
    initContainers:
      - name: install-docker-client
        image: registry.dev.nokey.sh/library/docker:29.1.3-cli@sha256:4fa0ee1f3a7e4354c4ea34558b6d4ee32859baf4973d4c8ccc8e7fe3dd730c04
        command:
          - /bin/sh
          - -ceu
          - |
            install -m 0755 /usr/local/bin/docker /docker-client/docker
            install -m 0755 \
              /usr/local/libexec/docker/cli-plugins/docker-buildx \
              /docker-client/docker-buildx
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: docker-client
            mountPath: /docker-client
          - name: temporary
            mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
        command: ["/home/runner/run.sh"]
        env:
          - name: NOOK_ARC_RUNNER
            value: "1"
          - name: NOOK_BUILDKIT_REMOTE
            value: "1"
          - name: NOOK_BUILDKIT_ADDR
            value: tcp://nook-buildkit.arc-runners.svc.cluster.local:1234
          - name: KUBERNETES_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: docker-config
            mountPath: /home/runner/.docker
          - name: docker-client
            mountPath: /usr/local/bin/docker
            subPath: docker
            readOnly: true
          - name: docker-client
            mountPath: /usr/local/libexec/docker/cli-plugins/docker-buildx
            subPath: docker-buildx
            readOnly: true
          - name: temporary
            mountPath: /tmp
          - name: tool-cache
            mountPath: /opt/hostedtoolcache
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 4Gi
          limits:
            cpu: "4"
            memory: 6Gi
            ephemeral-storage: 32Gi
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 32Gi
      - name: docker-config
        emptyDir:
          sizeLimit: 64Mi
      - name: docker-client
        emptyDir:
          sizeLimit: 128Mi
      - name: temporary
        emptyDir:
          sizeLimit: 16Gi
      - name: tool-cache
        emptyDir:
          sizeLimit: 2Gi

githubConfigUrl: https://github.com/meta-secret/nook
githubConfigSecret: nook-arc-github

runnerScaleSetName: nook-k0s-container
minRunners: 0
maxRunners: 20

# Container jobs become ordinary pods through runner-container-hooks. The
# lifecycle-hook variant needs neither a Docker daemon nor shared RWX storage.
containerMode:
  type: kubernetes-novolume

controllerServiceAccount:
  namespace: arc-systems
  name: nook-arc-gha-rs-controller

listenerTemplate:
  spec:
    nodeSelector:
      nook.nokey.sh/node-role: control-storage
    tolerations:
      - key: nook.nokey.sh/arc-build
        operator: Equal
        value: preparing
        effect: NoSchedule
    containers:
      - name: listener
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi

template:
  metadata:
    labels:
      nook.nokey.sh/role: arc-container-runner
  spec:
    nodeSelector:
      nook.nokey.sh/arc-build: "true"
    # The novolume container hook creates and watches the per-job pod through
    # the chart-owned, namespace-scoped service account.
    automountServiceAccountToken: true
    enableServiceLinks: false
    terminationGracePeriodSeconds: 60
    containers:
      - name: runner
        image: ghcr.io/meta-secret/nook-arc-runner@sha256:6ffe620a5f1124526cb0c8b94962109a459b60b8d08c41d2aba1d397b8a03d5a
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "true"
          - name: ACTIONS_RUNNER_KUBERNETES_NAMESPACE
            value: arc-runners
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /etc/nook-arc-hook/content.yaml
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: nook-arc-hook
            mountPath: /etc/nook-arc-hook
            readOnly: true
    volumes:
      - name: nook-arc-hook
        configMap:
          name: nook-arc-container-hook

  local:
    path: /var/lib/nook/argo-events/jetstream-default
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["nook-rise-s-1"]
---

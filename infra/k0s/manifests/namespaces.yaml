apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    nook.nokey.sh/role: arc-controller
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    nook.nokey.sh/role: arc-runners
    # Rootless BuildKit needs unconfined seccomp/AppArmor so newuidmap can
    # establish its user namespace. Repository contracts still prohibit
    # privileged containers, Docker daemons, host sockets, and host paths.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: hive-system
  labels:
    hive.nook.sh/role: workers
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: hive-data
  labels:
    hive.nook.sh/role: data
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

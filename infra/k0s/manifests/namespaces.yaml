apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    nook.nokey.sh/role: arc-controller
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    nook.nokey.sh/role: arc-runners
    # BuildKit needs build privileges inside the Kata guest. Repository
    # contracts require every workload Pod in this namespace to select the
    # kata-dragonball runtime and prohibit Docker daemons and host sockets.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: hive-system
  labels:
    hive.nook.sh/role: workers
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: hive-data
  labels:
    hive.nook.sh/role: data
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

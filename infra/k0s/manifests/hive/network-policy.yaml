apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hive-default-deny
  namespace: hive-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hive-worker-egress
  namespace: hive-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hive
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              hive.nook.sh/role: data
      ports:
        - protocol: TCP
          port: 7687
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 22

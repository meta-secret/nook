apiVersion: v1
kind: ServiceAccount
metadata:
  name: hive-reaper
  namespace: hive-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-reaper
  namespace: hive-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-reaper
  namespace: hive-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-reaper
subjects:
  - kind: ServiceAccount
    name: hive-reaper
    namespace: hive-system

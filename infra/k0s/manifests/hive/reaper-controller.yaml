apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-reaper-controller
  namespace: hive-system
  labels:
    app.kubernetes.io/name: hive-reaper-controller
spec:
  replicas: 0
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-reaper-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-reaper-controller
    spec:
      nodeSelector:
        nook.nokey.sh/node-role: control-storage
      serviceAccountName: hive-reaper-controller
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: nook-registry
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: HIVE_IMAGE
          imagePullPolicy: Always
          command:
            - /usr/local/bin/bun
            - /usr/local/share/nook/hive-reaper-controller.ts
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: reaper-auth
              mountPath: /run/reaper-auth
              readOnly: true
            - name: kubernetes-api
              mountPath: /run/kubernetes
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: reaper-auth
          secret:
            secretName: hive-reaper-auth
            defaultMode: 0440
        - name: kubernetes-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: hive-reaper
  namespace: hive-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hive-reaper-controller
  ports:
    - name: http
      port: 8080
      targetPort: http

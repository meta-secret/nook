apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-reaper-controller
  namespace: hive-system
  labels:
    app.kubernetes.io/name: hive-reaper-controller
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-reaper-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-reaper-controller
    spec:
      serviceAccountName: hive-reaper-controller
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: nook-registry
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: HIVE_IMAGE
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -ceu
            - |
              exec python3 - <<'PY'
              import hmac
              import http.server
              import ipaddress
              import json
              import re
              import ssl
              import sys
              import threading
              import time
              import urllib.error
              import urllib.request

              namespace = "hive-system"
              api = "https://kubernetes.default.svc"
              context = ssl.create_default_context(cafile="/run/kubernetes/ca.crt")

              def token(path):
                  with open(path, encoding="utf-8") as handle:
                      return handle.read().strip()

              def api_request(method, path, payload=None):
                  body = None if payload is None else json.dumps(payload).encode()
                  request = urllib.request.Request(
                      f"{api}{path}",
                      method=method,
                      data=body,
                      headers={
                          "Authorization": (
                              f"Bearer {token('/run/kubernetes/token')}"
                          ),
                          "Content-Type": "application/merge-patch+json",
                      },
                  )
                  with urllib.request.urlopen(request, context=context, timeout=10) as response:
                      return response.read()

              def json_request(method, path, payload=None):
                  return json.loads(api_request(method, path, payload))

              def reconcile_neo4j_policy():
                  service = json_request(
                      "GET",
                      "/api/v1/namespaces/hive-data/services/hive-neo4j",
                  )
                  endpoints = json_request(
                      "GET",
                      "/api/v1/namespaces/hive-data/endpoints/hive-neo4j",
                  )
                  service_ip = str(
                      ipaddress.ip_address(service["spec"]["clusterIP"])
                  )
                  endpoint_ips = sorted(
                      str(ipaddress.ip_address(address["ip"]))
                      for subset in endpoints.get("subsets", [])
                      for address in subset.get("addresses", [])
                  )
                  destinations = [
                      {"ipBlock": {"cidr": f"{service_ip}/32"}},
                  ]
                  if endpoint_ips:
                      destinations.append(
                          {"ipBlock": {"cidr": f"{endpoint_ips[0]}/32"}}
                      )
                  for policy_name in (
                      "hive-worker-egress",
                      "hive-dispatcher-reaper",
                      "hive-observer-egress",
                  ):
                      reconcile_neo4j_policy_path(policy_name, destinations)

              def reconcile_neo4j_policy_path(policy_name, destinations):
                  policy_path = (
                      "/apis/networking.k8s.io/v1/namespaces/hive-system/"
                      f"networkpolicies/{policy_name}"
                  )
                  for _ in range(3):
                      policy = json_request("GET", policy_path)
                      egress = policy["spec"]["egress"]
                      matched = False
                      conflict = False
                      for rule in egress:
                          if any(
                              port.get("protocol") == "TCP"
                              and port.get("port") == 7687
                              for port in rule.get("ports", [])
                          ) and any(
                              "ipBlock" in target for target in rule.get("to", [])
                          ):
                              matched = True
                              if rule["to"] == destinations:
                                  return
                              rule["to"] = destinations
                              try:
                                  api_request(
                                      "PATCH",
                                      policy_path,
                                      {
                                          "metadata": {
                                              "resourceVersion": policy["metadata"][
                                                  "resourceVersion"
                                              ]
                                          },
                                          "spec": {"egress": egress},
                                      },
                                  )
                                  return
                              except urllib.error.HTTPError as error:
                                  if error.code != 409:
                                      raise
                                  conflict = True
                                  break
                      if not matched:
                          raise RuntimeError("Neo4j endpoint egress rule is missing")
                      if conflict:
                          continue
                  raise RuntimeError(
                      f"Neo4j NetworkPolicy {policy_name} changed during reconciliation"
                  )

              def reconcile_loop():
                  while True:
                      try:
                          reconcile_neo4j_policy()
                      except Exception as error:
                          print(
                              f"Neo4j NetworkPolicy reconciliation failed: {error}",
                              file=sys.stderr,
                              flush=True,
                          )
                      time.sleep(10)

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_POST(self):
                      supplied = self.headers.get("Authorization", "").removeprefix("Bearer ")
                      match = re.fullmatch(r"/reap/(hive-[a-z0-9-]+)", self.path)
                      expected = token("/run/reaper-auth/token")
                      if not hmac.compare_digest(supplied, expected) or match is None:
                          self.send_error(403)
                          return
                      pod_name = match.group(1)
                      pod_path = f"/api/v1/namespaces/{namespace}/pods/{pod_name}"
                      try:
                          pod = json.loads(api_request("GET", pod_path))
                          labels = pod.get("metadata", {}).get("labels", {})
                          if labels.get("app.kubernetes.io/name") != "hive":
                              self.send_error(403)
                              return
                          api_request("DELETE", pod_path)
                          for _ in range(60):
                              try:
                                  api_request("GET", pod_path)
                              except urllib.error.HTTPError as error:
                                  if error.code == 404:
                                      break
                                  raise
                              time.sleep(2)
                          else:
                              self.send_error(504)
                              return
                      except urllib.error.HTTPError as error:
                          if error.code != 404:
                              self.send_error(502)
                              return
                      self.send_response(204)
                      self.end_headers()

                  def log_message(self, _format, *_args):
                      return

              if __name__ == "__main__":
                  threading.Thread(target=reconcile_loop, daemon=True).start()
                  http.server.ThreadingHTTPServer(
                      ("0.0.0.0", 8080),
                      Handler,
                  ).serve_forever()
              PY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: reaper-auth
              mountPath: /run/reaper-auth
              readOnly: true
            - name: kubernetes-api
              mountPath: /run/kubernetes
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: reaper-auth
          secret:
            secretName: hive-reaper-auth
            defaultMode: 0440
        - name: kubernetes-api
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: hive-reaper
  namespace: hive-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hive-reaper-controller
  ports:
    - name: http
      port: 8080
      targetPort: http

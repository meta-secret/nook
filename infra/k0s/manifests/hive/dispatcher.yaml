apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-workbench-dispatcher
  namespace: hive-system
  labels:
    app.kubernetes.io/name: hive-workbench-dispatcher
spec:
  replicas: 0
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-workbench-dispatcher
  template:
    metadata:
      annotations:
        hive.nook.sh/neo4j-ca-sha256: HIVE_NEO4J_CA_CHECKSUM
        hive.nook.sh/neo4j-client-sha256: HIVE_NEO4J_CLIENT_CHECKSUM
      labels:
        app.kubernetes.io/name: hive-workbench-dispatcher
    spec:
      nodeSelector:
        nook.nokey.sh/node-role: compute
      runtimeClassName: kata-qemu-runtime-rs
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: nook-registry
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: neo4j-trust
          image: HIVE_IMAGE
          command:
            - /bin/bash
            - -ceu
            - |
              rm -f /trust/ca-certificates.crt
              cat /etc/ssl/certs/ca-certificates.crt /run/neo4j/ca.crt \
                > /trust/ca-certificates.crt
              chmod 0444 /trust/ca-certificates.crt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: neo4j-ca
              mountPath: /run/neo4j
              readOnly: true
            - name: trust-bundle
              mountPath: /trust
      containers:
        - name: dispatcher
          image: HIVE_IMAGE
          imagePullPolicy: Always
          args: ["workbench-dispatcher"]
          env:
            - name: HIVE_WORKBENCH_REPOSITORY_URL
              value: https://github.com/meta-secret/nook-workbench.git
            - name: HIVE_WORKBENCH_CHECKOUT
              value: /tmp/nook-workbench
            - name: HIVE_WORKBENCH_POLL_SECONDS
              value: "120"
            - name: HIVE_WORKBENCH_HEALTH_PATH
              value: /tmp/hive-workbench-dispatcher-health
            - name: HIVE_WORKBENCH_HEALTH_MAX_AGE_SECONDS
              value: "600"
            - name: NEO4J_URI
              value: neo4j+s://hive-neo4j.hive-data.svc.cluster.local:7687
            - name: SSL_CERT_FILE
              value: /trust/ca-certificates.crt
            - name: NEO4J_USERNAME
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hive-neo4j-client
                  key: NEO4J_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: trust-bundle
              mountPath: /trust
              readOnly: true
            - name: temporary
              mountPath: /tmp
            - name: reaper-auth
              mountPath: /run/reaper-auth
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - /usr/local/bin/hive
                - workbench-dispatcher-health
                - --progress
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/hive
                - workbench-dispatcher-health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/hive
                - workbench-dispatcher-health
                - --progress
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: trust-bundle
          emptyDir:
            sizeLimit: 2Mi
        - name: temporary
          emptyDir:
            sizeLimit: 1Gi
        - name: neo4j-ca
          secret:
            secretName: hive-neo4j-ca
            defaultMode: 0400
        - name: reaper-auth
          secret:
            secretName: hive-reaper-auth
            defaultMode: 0400

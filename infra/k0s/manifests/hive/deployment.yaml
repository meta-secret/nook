apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  namespace: hive-system
  labels:
    app.kubernetes.io/name: hive
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive
    spec:
      runtimeClassName: kata-qemu-runtime-rs
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: codex-auth
          image: HIVE_IMAGE
          command:
            - /usr/bin/install
            - -m
            - "0600"
            - /run/secrets/codex/auth.json
            - /codex-home/auth.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: codex-auth-source
              mountPath: /run/secrets/codex
              readOnly: true
            - name: codex-home
              mountPath: /codex-home
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: hive
          image: HIVE_IMAGE
          imagePullPolicy: Always
          args: ["worker"]
          env:
            - name: HIVE_AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HIVE_REPOSITORY_URL
              value: https://github.com/meta-secret/nook.git
            - name: HIVE_WORKSPACE
              value: /workspace
            - name: HIVE_LEASE_SECONDS
              value: "300"
            - name: HIVE_HEARTBEAT_SECONDS
              value: "60"
            - name: HIVE_TASK_TIMEOUT_SECONDS
              value: "3600"
            - name: HIVE_POLL_MIN_SECONDS
              value: "5"
            - name: HIVE_POLL_MAX_SECONDS
              value: "15"
            - name: HIVE_CODEX_REASONING_EFFORT
              value: medium
            - name: CODEX_HOME
              value: /home/hive/.codex
            - name: HOME
              value: /home/hive
            - name: NEO4J_URI
              value: neo4j://hive-neo4j.hive-data.svc.cluster.local:7687
            - name: NEO4J_USERNAME
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hive-neo4j-client
                  key: NEO4J_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: codex-home
              mountPath: /home/hive/.codex
            - name: home
              mountPath: /home/hive
            - name: temporary
              mountPath: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
              ephemeral-storage: 20Gi
            limits:
              cpu: "4"
              memory: 12Gi
              ephemeral-storage: 100Gi
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 100Gi
        - name: codex-home
          emptyDir:
            sizeLimit: 512Mi
        - name: home
          emptyDir:
            sizeLimit: 1Gi
        - name: temporary
          emptyDir:
            sizeLimit: 2Gi
        - name: codex-auth-source
          secret:
            secretName: hive-codex-auth
            defaultMode: 0400

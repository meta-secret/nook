version: '3'

vars:
  INFRA_SSH_TARGET: '{{default "debian@ssh-ovh-borg-1.bynull.link" .INFRA_SSH_TARGET}}'
  INFRA_REMOTE_DIR: '{{default "/home/debian/.local/share/nook-infra" .INFRA_REMOTE_DIR}}'
  INFRA_MESH_SSH_TARGET: '{{default "ssh.bynull.link" .INFRA_MESH_SSH_TARGET}}'
  INFRA_MESH_NODE_NAME: '{{default "nook-servo" .INFRA_MESH_NODE_NAME}}'
  INFRA_CLOUDFLARE_ACCOUNT_ID: '{{default "8a84df74d5bcf7b212980e6f51979731" .INFRA_CLOUDFLARE_ACCOUNT_ID}}'
  K0S_VERSION: v1.36.2+k0s.0
  K0S_AMD64_SHA256: 8b5d985f803df27acb44f900b2574a5b48e600bd2f87a3335d2a853b888e9298
  HELM_VERSION: v3.21.3
  HELM_AMD64_SHA256: 15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0
  KATA_VERSION: 4.0.0
  KATA_CHART_SHA256: 68ee406af84761d85ddd6942bd3f0b11ba4f19ce19bf46ec2a4ea29f93926a4b
  NEO4J_VERSION: 2026.6.0
  NEO4J_CHART_SHA256: 62de9ecce52cc0078742a7b98649719cdb55c0458df69ee16230e26b010aedd9

tasks:
  k0s:manifests:check:
    desc: Validate Hive isolation and TLS invariants in repository manifests.
    cmds:
      - ruby .github/scripts/hive-manifest-contract.rb

  mesh:node:add:
    desc: Idempotently add a Linux server as a distinct Cloudflare Mesh node.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail

        ssh_target="{{.INFRA_MESH_SSH_TARGET}}"
        node_name="{{.INFRA_MESH_NODE_NAME}}"
        account_id="{{.INFRA_CLOUDFLARE_ACCOUNT_ID}}"

        ssh -n -o BatchMode=yes "$ssh_target" 'set -eu
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$(uname -m)" = x86_64
          for command in /usr/bin/apt-get /usr/bin/tee; do
            test -x "$command"
          done
          if ! sudo -n true >/dev/null 2>&1; then
            echo "infra mesh: $USER needs passwordless sudo" >&2
            exit 77
          fi
          if systemctl --type=service --state=running --no-pager --no-legend |
            grep -Eiq "(tailscale|wireguard|openvpn|dnsmasq|named|bind|unbound)"; then
            echo "infra mesh: refusing to install alongside another VPN or DNS service" >&2
            exit 78
          fi'

        INFRA_MESH_SSH_TARGET="$ssh_target" \
        INFRA_MESH_NODE_NAME="$node_name" \
        INFRA_CLOUDFLARE_ACCOUNT_ID="$account_id" \
          node --input-type=module <<'NODE'
        "use strict";

        import { execFileSync, spawnSync } from "node:child_process";

        const sshTarget = process.env.INFRA_MESH_SSH_TARGET;
        const nodeName = process.env.INFRA_MESH_NODE_NAME;
        const accountId = process.env.INFRA_CLOUDFLARE_ACCOUNT_ID;
        const apiRoot = `https://api.cloudflare.com/client/v4/accounts/${accountId}`;
        const auth = JSON.parse(
          execFileSync("wrangler", ["auth", "token", "--json"], { encoding: "utf8" }),
        );

        async function cloudflare(path, options = {}) {
          const response = await fetch(`${apiRoot}${path}`, {
            ...options,
            headers: {
              Authorization: `Bearer ${auth.token}`,
              "Content-Type": "application/json",
              ...options.headers,
            },
          });
          const payload = await response.json();
          if (!response.ok || !payload.success) {
            throw new Error(
              `Cloudflare Mesh API request failed (${response.status}): ${JSON.stringify(payload.errors)}`,
            );
          }
          return payload.result;
        }

        let nodes = await cloudflare("/warp_connector");
        let node = nodes.find((candidate) => candidate.name === nodeName);
        let created = false;
        if (!node) {
          node = await cloudflare("/warp_connector", {
            method: "POST",
            body: JSON.stringify({ name: nodeName, ha: false }),
          });
          created = true;
        }

        const remoteScript = `set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo -n apt-get update -qq
        sudo -n apt-get install -y -qq ca-certificates curl gpg
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg |
          sudo -n gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        . /etc/os-release
        printf '%s\n' "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $VERSION_CODENAME main" |
          sudo -n tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
        sudo -n apt-get update -qq
        sudo -n apt-get install -y -qq cloudflare-warp
        `;

        async function requireSuccess(result, operation) {
          if (!result.error && result.status === 0) return;
          if (created) {
            await cloudflare(`/warp_connector/${node.id}`, { method: "DELETE" });
          }
          throw result.error || new Error(`${operation} failed with status ${result.status}`);
        }

        const install = spawnSync(
          "ssh",
          ["-o", "BatchMode=yes", sshTarget, "bash -s"],
          { input: remoteScript, encoding: "utf8", stdio: ["pipe", "inherit", "inherit"] },
        );
        await requireSuccess(install, "Mesh node package installation");

        const registration = spawnSync(
          "ssh",
          ["-o", "BatchMode=yes", sshTarget, "sudo -n /usr/bin/warp-cli registration show"],
          { stdio: "ignore" },
        );

        if (registration.status !== 0) {
          let connectorToken = node.token;
          if (!connectorToken) {
            const tokenResult = await cloudflare(`/warp_connector/${node.id}/token`);
            connectorToken = typeof tokenResult === "string" ? tokenResult : tokenResult.token;
          }
          if (typeof connectorToken !== "string" || connectorToken.length < 20) {
            throw new Error("Cloudflare Mesh did not return a usable connector token");
          }

          const enrollmentHelper = String.raw`#!/usr/bin/env bash
        set -euo pipefail

        if systemctl is-active --quiet auditd; then
          echo "infra mesh: refusing connector enrollment while auditd is active" >&2
          exit 79
        fi
        if command -v auditctl >/dev/null 2>&1 &&
          auditctl -s 2>/dev/null | grep -Eq '^enabled[[:space:]]+[12]$'; then
          echo "infra mesh: refusing connector enrollment while kernel auditing is enabled" >&2
          exit 79
        fi

        original_hidepid="$(findmnt -n -o OPTIONS /proc | tr ',' '\n' | sed -n 's/^hidepid=//p' | tail -1)"
        if test -z "$original_hidepid"; then original_hidepid=0; fi
        restore_proc() {
          connector_token=
          mount -o remount,hidepid="$original_hidepid" /proc
        }
        trap restore_proc EXIT
        trap 'exit 130' HUP INT TERM
        mount -o remount,hidepid=2 /proc

        IFS= read -r connector_token
        token_length="$(printf '%s' "$connector_token" | wc -c)"
        test "$token_length" -ge 20
        /usr/bin/warp-cli connector new "$connector_token"
        connector_token=
        `;

          const helperInstall = spawnSync(
            "ssh",
            [
              "-o",
              "BatchMode=yes",
              sshTarget,
              "sudo -n tee /run/nook-warp-enroll >/dev/null && sudo -n chmod 0700 /run/nook-warp-enroll",
            ],
            { input: enrollmentHelper, encoding: "utf8", stdio: ["pipe", "inherit", "inherit"] },
          );
          await requireSuccess(helperInstall, "Mesh enrollment helper installation");

          const enroll = spawnSync(
            "ssh",
            ["-o", "BatchMode=yes", sshTarget, "sudo -n /run/nook-warp-enroll"],
            {
              input: `${connectorToken}\n`,
              encoding: "utf8",
              stdio: ["pipe", "inherit", "inherit"],
            },
          );
          connectorToken = "";
          spawnSync(
            "ssh",
            ["-o", "BatchMode=yes", sshTarget, "sudo -n rm -f /run/nook-warp-enroll"],
            { stdio: "ignore" },
          );
          await requireSuccess(enroll, "Mesh connector enrollment");
        }

        const connectScript = `set -euo pipefail
        sudo -n warp-cli connect
        for _ in $(seq 1 30); do
          if sudo -n warp-cli status 2>/dev/null | grep -q 'Status update: Connected'; then
            break
          fi
          sleep 1
        done
        sudo -n warp-cli status
        ip -brief address | grep CloudflareWARP
        `;

        const connect = spawnSync(
          "ssh",
          ["-o", "BatchMode=yes", sshTarget, "bash -s"],
          { input: connectScript, encoding: "utf8", stdio: ["pipe", "inherit", "inherit"] },
        );
        await requireSuccess(connect, "Mesh connection");

        const connections = await cloudflare(`/warp_connector/${node.id}/connections`);
        if (!Array.isArray(connections) || connections.length === 0) {
          throw new Error("Cloudflare Mesh node installed but has no active connection");
        }
        process.stdout.write(`Cloudflare Mesh node ${nodeName} is online\n`);
        NODE
        BASH

  mesh:status:
    desc: Show Cloudflare Mesh status and addresses on a Linux server.
    cmds:
      - >-
        ssh -o BatchMode=yes "{{.INFRA_MESH_SSH_TARGET}}"
        'sudo -n warp-cli status && ip -brief address | grep CloudflareWARP'

  deploy:
    desc: Deploy Nook services and the complete k0s/Kata/Neo4j/Hive platform.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail

        repo_root="$(git rev-parse --show-toplevel)"
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        compose_file="$repo_root/infra/compose.yaml"
        traefik_file="$repo_root/infra/traefik-dynamic.yaml"
        remote_next="$remote_dir/compose.yaml.next"
        remote_compose="$remote_dir/compose.yaml"
        remote_traefik_next="$remote_dir/traefik-dynamic.yaml.next"
        remote_traefik="$remote_dir/traefik-dynamic.yaml"
        remote_secrets="$remote_dir/secrets"

        case "$remote_dir" in
          /home/*/.local/share/nook-infra) ;;
          *)
            echo "infra deploy: refusing unexpected remote directory: $remote_dir" >&2
            exit 2
            ;;
        esac

        docker compose -f "$compose_file" config --quiet
        ssh -n -o BatchMode=yes "$ssh_target" \
          "set -eu; \
           install -d -m 0750 '$remote_dir'; \
           install -d -m 0700 '$remote_secrets'; \
           if [ ! -s '$remote_secrets/redis-password' ]; then \
             umask 077; \
             openssl rand -hex 32 > '$remote_secrets/redis-password'; \
           fi; \
           chmod 0600 '$remote_secrets/redis-password'"
        scp -q -o BatchMode=yes "$compose_file" "$ssh_target:$remote_next"
        scp -q -o BatchMode=yes "$traefik_file" "$ssh_target:$remote_traefik_next"

        ssh -n -o BatchMode=yes "$ssh_target" \
          "set -eu; \
           docker compose -f '$remote_next' config --quiet; \
           mv '$remote_traefik_next' '$remote_traefik'; \
           mv '$remote_next' '$remote_compose'; \
           docker compose -f '$remote_compose' pull; \
           docker compose -f '$remote_compose' up -d --remove-orphans --wait"

        ssh -n -o BatchMode=yes "$ssh_target" \
          "set -eu; \
           test \"\$(docker compose -f '$remote_compose' exec -T redis sh -ec 'export REDISCLI_AUTH=\"\$(cat /run/secrets/redis-password)\"; exec redis-cli ping')\" = PONG; \
           docker compose -f '$remote_compose' ps --services --filter status=running | grep -qx traefik; \
           curl --fail --silent --show-error http://127.0.0.1:5000/v2/ >/dev/null; \
           docker compose -f '$remote_compose' ps"
        BASH
      - task: k0s:install
      - task: kata:install
      - task: kata:verify
      - task: neo4j:deploy
      - task: hive:deploy

  k0s:sync:
    internal: true
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel)"
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        case "$remote_dir" in
          /home/*/.local/share/nook-infra) ;;
          *)
            echo "infra k0s sync: refusing unexpected remote directory: $remote_dir" >&2
            exit 2
            ;;
        esac
        ssh -n -o BatchMode=yes "$ssh_target" \
          "install -d -m 0750 '$remote_dir'; \
           if test -d '$remote_dir/agentic-ai/minds'; then \
             find '$remote_dir/agentic-ai/minds' \
               -type d -name target -prune -exec rm -rf -- {} +; \
           fi"
        tar -C "$repo_root" \
          --exclude='agentic-ai/minds/target' \
          --exclude='agentic-ai/minds/*/target' \
          -cf - infra/k0s agentic-ai/minds |
          ssh -o BatchMode=yes "$ssh_target" \
            "tar -xf - -C '$remote_dir'"
        BASH

  kvm:verify:
    desc: Verify the Hive host, nested virtualization, KVM modules, and firewall.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        . /etc/os-release
        test "$ID" = debian
        test "$VERSION_ID" = 13
        test "$(uname -m)" = x86_64
        test -c /dev/kvm
        grep -Eq "(vmx|svm)" /proc/cpuinfo
        sudo -n modprobe vhost_vsock
        sudo -n modprobe vhost_net
        test -c /dev/vhost-vsock
        sudo -n test -r /dev/kvm
        sudo -n nft list chain inet bynull_filter input |
          grep -Eq "policy drop"
        printf 'KVM available: '
        ls -l /dev/kvm
        printf 'Virtualization flags: '
        grep -Eo "(vmx|svm)" /proc/cpuinfo | sort -u | tr "\n" " "
        printf '\n'
        REMOTE

  k0s:install:
    desc: Idempotently install the pinned single-node k0s cluster and Helm.
    deps: [kvm:verify, k0s:sync]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        k0s_version="{{.K0S_VERSION}}"
        k0s_sha="{{.K0S_AMD64_SHA256}}"
        helm_version="{{.HELM_VERSION}}"
        helm_sha="{{.HELM_AMD64_SHA256}}"
        download_dir="$remote_dir/downloads"
        install -d -m 0750 "$download_dir"
        sudo -n apt-get update -qq
        sudo -n apt-get install -y -qq --no-install-recommends jq python3

        k0s_asset="k0s-${k0s_version}-amd64"
        k0s_url="https://github.com/k0sproject/k0s/releases/download/${k0s_version//+/%2B}/$k0s_asset"
        curl -fsSL --retry 3 -o "$download_dir/$k0s_asset.next" "$k0s_url"
        printf '%s  %s\n' "$k0s_sha" "$download_dir/$k0s_asset.next" | sha256sum -c -
        chmod 0755 "$download_dir/$k0s_asset.next"
        sudo -n install -m 0755 "$download_dir/$k0s_asset.next" /usr/local/bin/k0s
        mv "$download_dir/$k0s_asset.next" "$download_dir/$k0s_asset"

        helm_asset="helm-${helm_version}-linux-amd64.tar.gz"
        curl -fsSL --retry 3 -o "$download_dir/$helm_asset.next" \
          "https://get.helm.sh/$helm_asset"
        printf '%s  %s\n' "$helm_sha" "$download_dir/$helm_asset.next" | sha256sum -c -
        tar -xzf "$download_dir/$helm_asset.next" -C "$download_dir"
        sudo -n install -m 0755 "$download_dir/linux-amd64/helm" /usr/local/bin/helm
        mv "$download_dir/$helm_asset.next" "$download_dir/$helm_asset"

        sudo -n install -d -m 0755 /etc/k0s/containerd.d/certs.d/127.0.0.1:5000
        sudo -n install -d -m 0700 /var/lib/hive/k0s-recovery
        if ! sudo -n test -s /var/lib/k0s/pki/hive-encryption-provider.yaml &&
          sudo -n test -s /var/lib/hive/k0s-recovery/encryption-provider.yaml; then
          sudo -n install -D -m 0600 \
            /var/lib/hive/k0s-recovery/encryption-provider.yaml \
            /var/lib/k0s/pki/hive-encryption-provider.yaml
        fi
        if ! sudo -n test -s /var/lib/k0s/pki/hive-encryption-provider.yaml; then
          encryption_key="$(openssl rand -base64 32)"
          encryption_config="$(mktemp)"
          trap 'rm -f "$encryption_config"' EXIT
          umask 077
          cat > "$encryption_config" <<EOF
        apiVersion: apiserver.config.k8s.io/v1
        kind: EncryptionConfiguration
        resources:
          - resources:
              - secrets
            providers:
              - aesgcm:
                  keys:
                    - name: hive-key-1
                      secret: $encryption_key
              - identity: {}
        EOF
          sudo -n install -D -m 0600 \
            "$encryption_config" \
            /var/lib/k0s/pki/hive-encryption-provider.yaml
          rm -f "$encryption_config"
          trap - EXIT
        fi
        sudo -n install -m 0644 "$remote_dir/infra/k0s/config/k0s.yaml" /etc/k0s/k0s.yaml
        sudo -n install -m 0644 \
          "$remote_dir/infra/k0s/config/cri-registry.toml" \
          /etc/k0s/containerd.d/cri-registry.toml
        sudo -n install -m 0644 \
          "$remote_dir/infra/k0s/config/registry-hosts.toml" \
          /etc/k0s/containerd.d/certs.d/127.0.0.1:5000/hosts.toml

        if ! systemctl cat k0scontroller >/dev/null 2>&1; then
          sudo -n k0s install controller \
            --enable-worker \
            --no-taints \
            --config /etc/k0s/k0s.yaml
        fi
        if sudo -n systemctl is-active --quiet k0scontroller; then
          sudo -n systemctl restart k0scontroller
        else
          sudo -n systemctl enable --now k0scontroller
        fi
        for _ in $(seq 1 120); do
          if sudo -n k0s kubectl get --raw=/readyz >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        sudo -n k0s kubectl get --raw=/readyz >/dev/null
        sudo -n k0s kubectl wait node --all --for=condition=Ready --timeout=5m
        for namespace in hive-data hive-system; do
          sudo -n k0s kubectl create namespace "$namespace" \
            --dry-run=client \
            -o yaml |
            sudo -n k0s kubectl apply -f -
        done
        if sudo -n test -e /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.enc; then
          sudo -n test -s /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.enc
          sudo -n test -s /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.hmac
          recovery_key="$(mktemp)"
          encrypted_backup="$(mktemp)"
          expected_mac="$(mktemp)"
          trap 'rm -f "$recovery_key" "$encrypted_backup" "$expected_mac"' EXIT
          umask 077
          sudo -n awk '/secret:/ {print $2; exit}' \
            /var/lib/k0s/pki/hive-encryption-provider.yaml > "$recovery_key"
          sudo -n cat /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.enc \
            > "$encrypted_backup"
          sudo -n cat /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.hmac \
            > "$expected_mac"
          test -s "$recovery_key"
          python3 - "$recovery_key" "$encrypted_backup" "$expected_mac" <<'PY'
        import hashlib
        import hmac
        import pathlib
        import sys

        master = pathlib.Path(sys.argv[1]).read_bytes().strip()
        ciphertext = pathlib.Path(sys.argv[2]).read_bytes()
        expected = pathlib.Path(sys.argv[3]).read_text().strip()
        mac_key = hmac.new(
            master,
            b"nook-hive-recovery-hmac-v1",
            hashlib.sha256,
        ).digest()
        actual = hmac.new(mac_key, ciphertext, hashlib.sha256).hexdigest()
        if not hmac.compare_digest(actual, expected):
            raise SystemExit("Neo4j recovery snapshot authentication failed")
        PY
          sudo -n openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass "file:$recovery_key" \
            -in "$encrypted_backup" |
            sudo -n k0s kubectl apply -f -
          sudo -n rm -f \
            /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.enc \
            /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.hmac
          rm -f "$recovery_key" "$encrypted_backup" "$expected_mac"
          trap - EXIT
        fi
        sudo -n k0s kubectl get secrets --all-namespaces -o json |
          sudo -n k0s kubectl replace -f -
        sudo -n k0s kubectl label node --all \
          hive.nook.sh/storage=local \
          hive.nook.sh/kata=enabled \
          --overwrite
        sudo -n k0s status
        sudo -n k0s kubectl get nodes -o wide
        REMOTE

  k0s:status:
    desc: Show k0s, node, runtime, storage, and Hive workload state.
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        sudo -n k0s status
        sudo -n k0s kubectl get nodes -o wide
        sudo -n k0s kubectl get runtimeclasses
        sudo -n k0s kubectl get pv,pvc --all-namespaces
        sudo -n k0s kubectl get pods --all-namespaces -o wide
        sudo -n nft list chain inet bynull_filter input | grep -Eq "policy drop"
        REMOTE

  k0s:uninstall:
    desc: Uninstall k0s only when K0S_UNINSTALL_FORCE=1; preserve Neo4j data.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        if test "${K0S_UNINSTALL_FORCE:-}" != 1; then
          echo "Refusing destructive uninstall; set K0S_UNINSTALL_FORCE=1" >&2
          exit 64
        fi
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        recovery_dir=/var/lib/hive/k0s-recovery
        sudo -n install -d -m 0700 "$recovery_dir"
        sudo -n install -m 0600 \
          /var/lib/k0s/pki/hive-encryption-provider.yaml \
          "$recovery_dir/encryption-provider.yaml"
        secret_backup="$(mktemp)"
        trap 'rm -f "$secret_backup"' EXIT
        found_secret=false
        for secret in \
          hive-data/hive-neo4j-auth \
          hive-data/hive-neo4j-tls \
          hive-system/hive-neo4j-client \
          hive-system/hive-neo4j-ca; do
          namespace="${secret%%/*}"
          name="${secret#*/}"
          if sudo -n k0s kubectl get secret "$name" \
            --namespace "$namespace" >/dev/null 2>&1; then
            if test "$found_secret" = true; then
              printf '%s\n' '---' >> "$secret_backup"
            fi
            sudo -n k0s kubectl get secret "$name" \
              --namespace "$namespace" \
              -o json |
              jq 'del(
                .metadata.uid,
                .metadata.resourceVersion,
                .metadata.creationTimestamp,
                .metadata.managedFields,
                .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"
              )' >> "$secret_backup"
            found_secret=true
          fi
        done
        if test "$found_secret" = true; then
          encrypted_backup="$(mktemp)"
          backup_mac="$(mktemp)"
          recovery_key="$(mktemp)"
          trap 'rm -f "$secret_backup" "$encrypted_backup" "$backup_mac" "$recovery_key"' EXIT
          umask 077
          sudo -n awk '/secret:/ {print $2; exit}' \
            /var/lib/k0s/pki/hive-encryption-provider.yaml > "$recovery_key"
          test -s "$recovery_key"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass "file:$recovery_key" \
            -in "$secret_backup" \
            -out "$encrypted_backup"
          python3 - "$recovery_key" "$encrypted_backup" "$backup_mac" <<'PY'
        import hashlib
        import hmac
        import pathlib
        import sys

        master = pathlib.Path(sys.argv[1]).read_bytes().strip()
        ciphertext = pathlib.Path(sys.argv[2]).read_bytes()
        mac_key = hmac.new(
            master,
            b"nook-hive-recovery-hmac-v1",
            hashlib.sha256,
        ).digest()
        pathlib.Path(sys.argv[3]).write_text(
            hmac.new(mac_key, ciphertext, hashlib.sha256).hexdigest() + "\n"
        )
        PY
          sudo -n install -m 0600 \
            "$encrypted_backup" \
            "$recovery_dir/neo4j-secrets.yaml.enc"
          sudo -n install -m 0600 \
            "$backup_mac" \
            "$recovery_dir/neo4j-secrets.yaml.hmac"
        fi
        sudo -n k0s stop
        sudo -n k0s reset
        test -d /var/lib/hive/neo4j
        echo "k0s removed; retained /var/lib/hive/neo4j"
        REMOTE
        BASH

  kata:install:
    desc: Install the pinned Kata runtime-rs chart on k0s.
    deps: [kvm:verify, k0s:sync]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        version="{{.KATA_VERSION}}"
        chart="$remote_dir/downloads/kata-deploy-$version.tgz"
        curl -fsSL --retry 3 -o "$chart.next" \
          "https://github.com/kata-containers/kata-containers/releases/download/$version/kata-deploy-$version.tgz"
        printf '%s  %s\n' "{{.KATA_CHART_SHA256}}" "$chart.next" | sha256sum -c -
        mv "$chart.next" "$chart"
        kubeconfig="$(mktemp)"
        trap 'rm -f "$kubeconfig"' EXIT
        sudo -n k0s kubeconfig admin > "$kubeconfig"
        chmod 0600 "$kubeconfig"
        export KUBECONFIG="$kubeconfig"
        kubectl() { sudo -n k0s kubectl "$@"; }
        helm upgrade --install kata-deploy "$chart" \
          --namespace kube-system \
          --values "$remote_dir/infra/k0s/manifests/kata/values.yaml" \
          --wait \
          --timeout 15m
        kubectl rollout status daemonset/kata-deploy \
          --namespace kube-system \
          --timeout=10m
        kubectl get runtimeclasses
        kubectl get runtimeclass kata-qemu-runtime-rs
        REMOTE

  kata:verify:
    desc: Prove a smoke Pod uses the Kata guest kernel and never runc.
    deps: [k0s:sync]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        kubectl() { sudo -n k0s kubectl "$@"; }
        kubectl apply -f "$remote_dir/infra/k0s/manifests/namespaces.yaml"
        kubectl get runtimeclass kata-qemu-runtime-rs
        kubectl delete pod hive-kata-smoke \
          --namespace hive-system \
          --ignore-not-found \
          --wait=true
        kubectl apply -f "$remote_dir/infra/k0s/manifests/kata/smoke-test.yaml"
        kubectl wait pod/hive-kata-smoke \
          --namespace hive-system \
          --for=jsonpath='{.status.phase}'=Succeeded \
          --timeout=5m
        runtime_class="$(kubectl get pod hive-kata-smoke \
          --namespace hive-system \
          -o jsonpath='{.spec.runtimeClassName}')"
        test "$runtime_class" = kata-qemu-runtime-rs
        host_kernel="$(uname -r)"
        guest_kernel="$(kubectl logs hive-kata-smoke --namespace hive-system)"
        test -n "$guest_kernel"
        test "$guest_kernel" != "$host_kernel"
        printf 'Kata guest kernel %s differs from host kernel %s\n' \
          "$guest_kernel" "$host_kernel"
        REMOTE

  neo4j:deploy:
    desc: Deploy persistent, cluster-internal Neo4j with generated credentials.
    deps: [k0s:sync]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        version="{{.NEO4J_VERSION}}"
        chart="$remote_dir/downloads/neo4j-$version.tgz"
        kubectl() { sudo -n k0s kubectl "$@"; }
        sudo -n install -d -m 0750 /var/lib/hive/neo4j
        kubectl apply -f "$remote_dir/infra/k0s/manifests/namespaces.yaml"
        kubectl apply -f "$remote_dir/infra/k0s/manifests/neo4j/storage.yaml"

        secret_dir="$(mktemp -d)"
        trap 'rm -rf "$secret_dir"' EXIT
        umask 077
        reuse_tls=false
        tls_changed=false
        if kubectl get secret hive-neo4j-tls \
          --namespace hive-data >/dev/null 2>&1 &&
          kubectl get secret hive-neo4j-ca \
            --namespace hive-system >/dev/null 2>&1; then
          kubectl get secret hive-neo4j-tls \
            --namespace hive-data \
            -o jsonpath='{.data.private\.key}' |
            base64 --decode > "$secret_dir/private.key"
          kubectl get secret hive-neo4j-tls \
            --namespace hive-data \
            -o jsonpath='{.data.public\.crt}' |
            base64 --decode > "$secret_dir/public.crt"
          kubectl get secret hive-neo4j-ca \
            --namespace hive-system \
            -o jsonpath='{.data.ca\.crt}' |
            base64 --decode > "$secret_dir/ca.crt"
          if openssl pkey -check -noout \
            -in "$secret_dir/private.key" >/dev/null 2>&1 &&
            openssl x509 -checkend 2592000 -noout \
              -in "$secret_dir/public.crt" &&
            openssl verify -CAfile "$secret_dir/ca.crt" \
              "$secret_dir/public.crt" >/dev/null; then
            reuse_tls=true
          fi
        fi
        if test "$reuse_tls" = false; then
          tls_changed=true
          openssl req -x509 -newkey rsa:3072 -nodes \
            -days 3650 \
            -subj "/CN=Nook Hive Neo4j CA" \
            -keyout "$secret_dir/ca.key" \
            -out "$secret_dir/ca.crt"
          openssl req -newkey rsa:3072 -nodes \
            -subj "/CN=hive-neo4j.hive-data.svc.cluster.local" \
            -keyout "$secret_dir/private.key" \
            -out "$secret_dir/server.csr"
          cat > "$secret_dir/server.ext" <<'EOF'
        basicConstraints=critical,CA:FALSE
        keyUsage=critical,digitalSignature,keyEncipherment
        extendedKeyUsage=serverAuth
        subjectAltName=DNS:hive-neo4j,DNS:hive-neo4j.hive-data,DNS:hive-neo4j.hive-data.svc,DNS:hive-neo4j.hive-data.svc.cluster.local
        EOF
          openssl x509 -req \
            -days 825 \
            -in "$secret_dir/server.csr" \
            -CA "$secret_dir/ca.crt" \
            -CAkey "$secret_dir/ca.key" \
            -CAcreateserial \
            -extfile "$secret_dir/server.ext" \
            -out "$secret_dir/public.crt"
        fi
        # Legacy prototypes persisted signing and server keys on the host.
        # Kubernetes Secrets are encrypted at rest by the k0s AES-GCM provider,
        # so remove those plaintext copies after the Secret-backed migration.
        sudo -n rm -f \
          /var/lib/hive/neo4j-tls/ca.key \
          /var/lib/hive/neo4j-tls/private.key

        kubectl create secret generic hive-neo4j-tls \
          --namespace hive-data \
          --from-file=private.key="$secret_dir/private.key" \
          --from-file=public.crt="$secret_dir/public.crt" \
          --dry-run=client \
          -o yaml |
          kubectl apply -f -
        kubectl create secret generic hive-neo4j-ca \
          --namespace hive-system \
          --from-file=ca.crt="$secret_dir/ca.crt" \
          --dry-run=client \
          -o yaml |
          kubectl apply -f -

        auth_exists=false
        client_exists=false
        if kubectl get secret hive-neo4j-auth --namespace hive-data >/dev/null 2>&1; then
          auth_exists=true
        fi
        if kubectl get secret hive-neo4j-client --namespace hive-system >/dev/null 2>&1; then
          client_exists=true
        fi

        if test "$auth_exists" = false && test "$client_exists" = false; then
          openssl rand -hex 32 > "$secret_dir/password"
        elif test "$auth_exists" = true; then
          kubectl get secret hive-neo4j-auth \
            --namespace hive-data \
            -o jsonpath='{.data.NEO4J_AUTH}' |
            base64 --decode |
            sed 's|^neo4j/||' > "$secret_dir/password"
        else
          kubectl get secret hive-neo4j-client \
            --namespace hive-system \
            -o jsonpath='{.data.NEO4J_PASSWORD}' |
            base64 --decode > "$secret_dir/password"
        fi

        if test "$auth_exists" = false; then
          {
            printf 'neo4j/'
            cat "$secret_dir/password"
          } > "$secret_dir/NEO4J_AUTH"
          kubectl create secret generic hive-neo4j-auth \
            --namespace hive-data \
            --from-file=NEO4J_AUTH="$secret_dir/NEO4J_AUTH"
        fi
        if test "$client_exists" = false; then
          cp "$secret_dir/password" "$secret_dir/NEO4J_PASSWORD"
          kubectl create secret generic hive-neo4j-client \
            --namespace hive-system \
            --from-file=NEO4J_PASSWORD="$secret_dir/NEO4J_PASSWORD"
        fi
        rm -rf "$secret_dir"
        trap - EXIT

        curl -fsSL --retry 3 -o "$chart.next" \
          "https://helm.neo4j.com/neo4j/neo4j-$version.tgz"
        printf '%s  %s\n' "{{.NEO4J_CHART_SHA256}}" "$chart.next" | sha256sum -c -
        mv "$chart.next" "$chart"
        kubeconfig="$(mktemp)"
        trap 'rm -f "$kubeconfig"' EXIT
        sudo -n k0s kubeconfig admin > "$kubeconfig"
        chmod 0600 "$kubeconfig"
        export KUBECONFIG="$kubeconfig"
        helm upgrade --install hive-neo4j "$chart" \
          --namespace hive-data \
          --values "$remote_dir/infra/k0s/manifests/neo4j/values.yaml" \
          --wait \
          --timeout 15m
        if test "$tls_changed" = true; then
          kubectl rollout restart statefulset/hive-neo4j \
            --namespace hive-data
        fi
        kubectl apply -f "$remote_dir/infra/k0s/manifests/neo4j/network-policy.yaml"
        kubectl rollout status statefulset/hive-neo4j \
          --namespace hive-data \
          --timeout=10m
        test "$(kubectl get service hive-neo4j \
          --namespace hive-data \
          -o jsonpath='{.spec.type}')" = ClusterIP
        kubectl get service,pod,pvc --namespace hive-data -o wide
        REMOTE

  hive:image:
    desc: Build and publish the exact Hive source to the target loopback registry.
    deps: [k0s:sync]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        curl -fsSL http://127.0.0.1:5000/v2/ >/dev/null
        source_id="$(find \
          "$remote_dir/agentic-ai/minds/hive" \
          "$remote_dir/agentic-ai/minds/lace" \
          -type f -print0 |
          sort -z |
          xargs -0 sha256sum |
          sha256sum |
          cut -c1-16)"
        manifest_id="$(sha256sum \
          "$remote_dir/agentic-ai/minds/Cargo.lock" \
          "$remote_dir/agentic-ai/minds/Cargo.toml" |
          sha256sum |
          cut -c1-16)"
        image="127.0.0.1:5000/nook-hive:$source_id-$manifest_id"
        docker build \
          --platform linux/amd64 \
          --tag "$image" \
          --file "$remote_dir/agentic-ai/minds/hive/Dockerfile" \
          "$remote_dir/agentic-ai/minds"
        push_output="$(docker push "$image")"
        digest="$(printf '%s\n' "$push_output" |
          awk '{for (field = 1; field <= NF; field++) if ($field == "digest:") print $(field + 1)}' |
          tail -1)"
        case "$digest" in
          sha256:????????????????????????????????????????????????????????????????) ;;
          *)
            echo "Hive image push did not return a sha256 digest" >&2
            exit 1
            ;;
        esac
        printf '%s@%s\n' "${image%:*}" "$digest" > "$remote_dir/hive-image"
        chmod 0640 "$remote_dir/hive-image"
        cat "$remote_dir/hive-image"
        REMOTE

  hive:auth:sync:
    internal: true
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        auth_file="${HIVE_CODEX_AUTH_FILE:-}"
        if test -n "$auth_file"; then
          test -f "$auth_file"
          jq -e '
            type == "object" and
            .auth_mode == "chatgpt" and
            (.tokens.access_token | type == "string" and length > 0) and
            (.tokens.refresh_token | type == "string" and length > 0) and
            (.tokens.account_id | type == "string" and length > 0)
          ' "$auth_file" >/dev/null
          ssh -n -o BatchMode=yes "$ssh_target" \
            "install -d -m 0700 '$remote_dir/secrets'"
          remote_auth_file="$remote_dir/secrets/codex-auth.json.next"
          cleanup_auth() {
            ssh -n -o BatchMode=yes "$ssh_target" \
              "rm -f '$remote_auth_file'" >/dev/null 2>&1 || true
          }
          trap cleanup_auth EXIT
          scp -q -o BatchMode=yes "$auth_file" \
            "$ssh_target:$remote_auth_file"
          ssh -o BatchMode=yes "$ssh_target" 'bash -s' <<REMOTE
        set -euo pipefail
        remote_dir="$remote_dir"
        auth_file="\$remote_dir/secrets/codex-auth.json.next"
        trap 'rm -f "\$auth_file"' EXIT
        chmod 0600 "\$auth_file"
        sudo -n k0s kubectl create secret generic hive-codex-auth \
          --namespace hive-system \
          --from-file=auth.json="\$auth_file" \
          --dry-run=client \
          -o yaml |
          sudo -n k0s kubectl apply -f -
        REMOTE
          trap - EXIT
          cleanup_auth
        else
          ssh -o BatchMode=yes "$ssh_target" \
            "sudo -n k0s kubectl get secret hive-codex-auth --namespace hive-system >/dev/null"
        fi
        BASH

  hive:deploy:
    desc: Publish and deploy the four-replica Kata-backed Hive warm pool.
    deps: [k0s:sync]
    silent: true
    cmds:
      - task: hive:image
      - task: hive:auth:sync
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        kubectl() { sudo -n k0s kubectl "$@"; }
        image="$(cat "$remote_dir/hive-image")"
        auth_checksum="$(
          kubectl get secret hive-codex-auth \
            --namespace hive-system \
            -o jsonpath='{.data.auth\\.json}' |
            sha256sum |
            cut -d' ' -f1
        )"
        neo4j_ca_checksum="$(
          kubectl get secret hive-neo4j-ca \
            --namespace hive-system \
            -o jsonpath='{.data.ca\\.crt}' |
            sha256sum |
            cut -d' ' -f1
        )"
        case "$auth_checksum" in
          ????????????????????????????????????????????????????????????????) ;;
          *)
            echo "Codex authentication checksum is invalid" >&2
            exit 1
            ;;
        esac
        case "$neo4j_ca_checksum" in
          ????????????????????????????????????????????????????????????????) ;;
          *)
            echo "Neo4j CA checksum is invalid" >&2
            exit 1
            ;;
        esac
        case "$image" in
          127.0.0.1:5000/nook-hive@sha256:*) ;;
          *)
            echo "Refusing unpinned Hive image: $image" >&2
            exit 1
            ;;
        esac
        rendered="$(mktemp)"
        trap 'rm -f "$rendered"' EXIT
        sed \
          -e "s|HIVE_IMAGE|$image|g" \
          -e "s|HIVE_AUTH_CHECKSUM|$auth_checksum|g" \
          -e "s|HIVE_NEO4J_CA_CHECKSUM|$neo4j_ca_checksum|g" \
          "$remote_dir/infra/k0s/manifests/hive/deployment.yaml" > "$rendered"
        kubectl apply -f "$remote_dir/infra/k0s/manifests/namespaces.yaml"
        kubectl apply -f "$remote_dir/infra/k0s/manifests/hive/network-policy.yaml"
        kubectl apply -f "$remote_dir/infra/k0s/manifests/hive/lifecycle-rbac.yaml"
        kubectl apply -f "$rendered"
        kubectl rollout status deployment/hive \
          --namespace hive-system \
          --timeout=15m
        test "$(kubectl get deployment hive \
          --namespace hive-system \
          -o jsonpath='{.status.readyReplicas}')" = 4
        test "$(kubectl get deployment hive \
          --namespace hive-system \
          -o jsonpath='{.spec.template.spec.runtimeClassName}')" = kata-qemu-runtime-rs
        test "$(kubectl get deployment hive \
          --namespace hive-system \
          -o jsonpath='{.spec.template.spec.automountServiceAccountToken}')" = false
        deployment_json="$(kubectl get deployment hive --namespace hive-system -o json)"
        if printf '%s' "$deployment_json" | jq -e \
          '[.spec.template.spec.containers[], .spec.template.spec.initContainers[]]
           | any(.securityContext.privileged == true)' >/dev/null; then
          echo "Hive deployment contains a privileged container" >&2
          exit 1
        fi
        if printf '%s' "$deployment_json" | jq -e \
          '.spec.template.spec.volumes // [] | any(has("hostPath"))' >/dev/null; then
          echo "Hive deployment contains a hostPath volume" >&2
          exit 1
        fi
        test "$(
          printf '%s' "$deployment_json" |
            jq -r '.spec.template.spec.containers[]
              | select(.name == "hive")
              | .env[]
              | select(.name == "NEO4J_URI")
              | .value'
        )" = neo4j+s://hive-neo4j.hive-data.svc.cluster.local:7687

        old_pod="$(kubectl get pods \
          --namespace hive-system \
          -l app.kubernetes.io/name=hive \
          -o jsonpath='{.items[0].metadata.name}')"
        old_uid="$(kubectl get pod "$old_pod" \
          --namespace hive-system \
          -o jsonpath='{.metadata.uid}')"
        kubectl exec "$old_pod" \
          --namespace hive-system \
          --container hive \
          -- /usr/bin/touch /workspace/.hive-task-finished
        kubectl wait "pod/$old_pod" \
          --namespace hive-system \
          --for=delete \
          --timeout=5m
        kubectl rollout status deployment/hive \
          --namespace hive-system \
          --timeout=10m
        test "$(kubectl get deployment hive \
          --namespace hive-system \
          -o jsonpath='{.status.readyReplicas}')" = 4
        if kubectl get pods \
          --namespace hive-system \
          -l app.kubernetes.io/name=hive \
          -o jsonpath='{range .items[*]}{.metadata.uid}{"\n"}{end}' |
          grep -Fx "$old_uid"; then
          echo "Hive lifecycle verification reused the terminated Pod" >&2
          exit 1
        fi
        kubectl get pods --namespace hive-system \
          -l app.kubernetes.io/name=hive \
          -o wide
        REMOTE

  status:
    desc: Show the remote infrastructure service state.
    cmds:
      - >-
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}"
        docker compose -f "{{.INFRA_REMOTE_DIR}}/compose.yaml" ps

  logs:
    desc: Show recent remote infrastructure logs.
    cmds:
      - >-
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}"
        docker compose -f "{{.INFRA_REMOTE_DIR}}/compose.yaml" logs --tail=100

  redis:ping:
    desc: Verify the remote Redis compiler-cache service.
    silent: true
    cmds:
      - >-
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}"
        'docker compose -f "{{.INFRA_REMOTE_DIR}}/compose.yaml" exec -T redis
        sh -ec '\''export REDISCLI_AUTH="$(cat /run/secrets/redis-password)"; exec redis-cli ping'\'''

  redis:credential:sync:
    desc: Copy the remote Redis password into the ignored local cache credential file.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel)"
        credential_dir="$repo_root/.nook/cache"
        credential_file="$credential_dir/redis-password"
        install -d -m 0700 "$credential_dir"
        umask 077
        ssh -n -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
          "cat '{{.INFRA_REMOTE_DIR}}/secrets/redis-password'" > "$credential_file"
        test -s "$credential_file"
        chmod 0600 "$credential_file"
        echo "Redis credential synchronized to .nook/cache/redis-password"
        BASH

  redis:stats:
    desc: Show remote Redis cache size, memory, hits, misses, and evictions.
    silent: true
    cmds:
      - >-
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}"
        'set -eu;
        compose="{{.INFRA_REMOTE_DIR}}/compose.yaml";
        docker compose -f "$compose" exec -T redis sh -ec '\''export REDISCLI_AUTH="$(cat /run/secrets/redis-password)"; redis-cli DBSIZE; redis-cli INFO memory | grep -E "^(used_memory_human|maxmemory_human|maxmemory_policy):"; redis-cli INFO stats | grep -E "^(keyspace_hits|keyspace_misses|evicted_keys):"'\'''

  registry:check:
    desc: Verify the loopback-only Hive image registry API.
    cmds:
      - >-
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}"
        curl --fail --silent --show-error http://127.0.0.1:5000/v2/

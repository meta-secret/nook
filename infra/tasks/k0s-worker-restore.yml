version: '3'

# Existing-worker restoration owns safe runner drain, service convergence, and activation.
tasks:
  k0s:worker:install:
    internal: true
    deps: [k0s:worker:sync]
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        controller_target="{{.INFRA_SSH_TARGET}}"
        worker_target="{{.INFRA_WORKER_SSH_TARGET}}"
        worker_mesh_address="{{.INFRA_WORKER_MESH_ADDRESS}}"
        remote_dir="{{.INFRA_WORKER_REMOTE_DIR}}"
        worker_arc_tier="{{.INFRA_WORKER_ARC_TIER}}"
        worker_ssh_user="$(ssh -n -o BatchMode=yes -J "$controller_target" \
          "$worker_target" 'id -un')"
        if ! [[ "$worker_ssh_user" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
          echo "k0s worker: refusing invalid SSH user" >&2
          exit 2
        fi
        if ! [[ "$worker_arc_tier" =~ ^(primary|secondary|overflow)$ ]]; then
          echo "k0s worker: refusing invalid ARC tier" >&2
          exit 2
        fi
        ssh -o BatchMode=yes "$controller_target" bash -s -- \
          "$worker_mesh_address" <<'REMOTE'
        set -euo pipefail
        worker_mesh_address="$1"
        kubectl() { sudo -n k0s kubectl "$@"; }
        node="$(kubectl get nodes -o json | jq -r \
          --arg address "$worker_mesh_address" \
          '.items[] | select(any(.status.addresses[]; .type == "InternalIP" and .address == $address)) | .metadata.name')"
        test "$(printf '%s\n' "$node" | sed '/^$/d' | wc -l | tr -d ' ')" -le 1
        node="$(printf '%s\n' "$node" | sed '/^$/d')"
        if test -n "$node"; then
          kubectl taint node "$node" \
            nook.nokey.sh/arc-build=preparing:NoSchedule --overwrite >/dev/null
          deadline="$(( $(date +%s) + 7200 ))"
          while :; do
            active_workloads="$(kubectl get pods --namespace arc-runners \
              --field-selector "spec.nodeName=$node" \
              -o json | jq '[.items[] | select(
                (.metadata.labels["actions.github.com/scale-set-name"] != null or
                 .metadata.labels["nook.nokey.sh/role"] == "arc-job-container") and
                .metadata.deletionTimestamp == null and
                (.status.phase == "Pending" or .status.phase == "Running")
              )] | length')"
            if test "$active_workloads" = 0; then
              break
            fi
            if test "$(date +%s)" -ge "$deadline"; then
              echo "Timed out waiting for $active_workloads ARC workload(s) on $node" >&2
              exit 1
            fi
            echo "Waiting for $active_workloads ARC workload(s) to finish on $node" >&2
            sleep 30
          done
        fi
        REMOTE
        ssh -o BatchMode=yes -J "$controller_target" "$worker_target" bash -s -- \
          "$remote_dir" "{{.K0S_VERSION}}" "{{.K0S_AMD64_SHA256}}" <<'REMOTE'
        set -euo pipefail
        remote_dir="$1"
        version="$2"
        sha="$3"
        . /etc/os-release
        case "$ID:$VERSION_ID" in
          debian:13|ubuntu:26.04) ;;
          *) echo "Unsupported k0s worker OS: $ID $VERSION_ID" >&2; exit 1 ;;
        esac
        test "$(uname -m)" = x86_64
        test -c /dev/kvm
        sudo -n systemctl is-active --quiet wg-quick@wg-nook.service
        sudo -n apt-get update -qq
        sudo -n apt-get install -y -qq --no-install-recommends \
          acl btrfs-progs ca-certificates curl e2fsprogs jq nftables ruby util-linux
        asset="k0s-${version}-amd64"
        url="https://github.com/k0sproject/k0s/releases/download/${version//+/%2B}/$asset"
        download="$(mktemp)"
        trap 'rm -f "$download"' EXIT
        curl -fsSL --retry 3 -o "$download" "$url"
        printf '%s  %s\n' "$sha" "$download" | sha256sum -c -
        sudo -n install -m 0755 "$download" /usr/local/bin/k0s
        sudo -n install -d -m 0755 \
          /etc/k0s/containerd.d/certs.d/registry.dev.nokey.sh
        sudo -n install -m 0644 \
          "$remote_dir/infra/k0s/config/cri-registry.toml" \
          /etc/k0s/containerd.d/cri-registry.toml
        sudo -n install -m 0644 \
          "$remote_dir/infra/k0s/config/registry-hosts.toml" \
          /etc/k0s/containerd.d/certs.d/registry.dev.nokey.sh/hosts.toml
        rm -f "$remote_dir/infra/k0s/config/registry-auth.toml"
        sudo -n rm -f /etc/k0s/containerd.d/registry-auth.toml
        sudo -n install -d -m 0755 /etc/systemd/system/k0sworker.service.d
        drop_in="$(mktemp)"
        cat > "$drop_in" <<'EOF'
        [Unit]
        Requires=wg-quick@wg-nook.service
        After=wg-quick@wg-nook.service
        EOF
        sudo -n install -m 0644 "$drop_in" \
          /etc/systemd/system/k0sworker.service.d/10-nook-mesh.conf
        REMOTE

        worker_service_state="$(
          ssh -o BatchMode=yes -J "$controller_target" "$worker_target" \
            'set -euo pipefail
            if sudo -n systemctl cat k0sworker.service >/dev/null 2>&1; then
              if sudo -n systemctl is-active --quiet k0sworker.service; then
                printf active
              else
                sudo -n systemctl daemon-reload
                sudo -n systemctl start k0sworker.service
                sudo -n systemctl is-active --quiet k0sworker.service
                printf resumed
              fi
            else
              if sudo -n systemctl is-active --quiet k0sworker.service; then
                echo "k0s worker: active service has no installed unit" >&2
                exit 1
              fi
              printf fresh
            fi'
        )"
        case "$worker_service_state" in active|resumed|fresh) ;; *) exit 1 ;; esac

        ssh -o BatchMode=yes "$controller_target" bash -s -- \
          "$worker_mesh_address" "$worker_service_state" <<'REMOTE'
        set -euo pipefail
        worker_mesh_address="$1"
        worker_service_state="$2"
        kubectl() { sudo -n k0s kubectl "$@"; }
        node="$(kubectl get nodes -o json | jq -r \
          --arg address "$worker_mesh_address" \
          '.items[] | select(any(.status.addresses[]; .type == "InternalIP" and .address == $address)) | .metadata.name')"
        test "$(printf '%s\n' "$node" | sed '/^$/d' | wc -l | tr -d ' ')" -le 1
        node="$(printf '%s\n' "$node" | sed '/^$/d')"
        if test "$worker_service_state" = fresh && test -z "$node"; then
          exit 0
        fi
        test -n "$node"
        node_json="$(kubectl get node "$node" -o json)"
        test "$(jq -r '.metadata.labels["nook.nokey.sh/node-role"]' <<<"$node_json")" = compute
        test "$(jq -r '.metadata.labels["nook.nokey.sh/arc-build"]' <<<"$node_json")" = true
        preparing_taint_state="$(jq -r '[.spec.taints[]? |
          select(.key == "nook.nokey.sh/arc-build")] |
          [length, map(select(
            .value == "preparing" and .effect == "NoSchedule"
          )) | length] | @tsv' <<<"$node_json")"
        test "$preparing_taint_state" = $'1\t1'
        if test "$worker_service_state" != fresh; then
          kubectl wait "node/$node" --for=condition=Ready --timeout=5m
        fi
        deadline="$(( $(date +%s) + 900 ))"
        while :; do
          active_workloads="$(kubectl get pods --namespace arc-runners \
            --field-selector "spec.nodeName=$node" \
            -o json | jq '[.items[] | select(
              (.metadata.labels["actions.github.com/scale-set-name"] != null or
               .metadata.labels["nook.nokey.sh/role"] == "arc-job-container") and
              (.status.phase == "Pending" or .status.phase == "Running")
            )] | length')"
          if test "$active_workloads" = 0; then
            break
          fi
          if test "$(date +%s)" -ge "$deadline"; then
            echo "Timed out waiting for $active_workloads terminating ARC workload(s) on $node" >&2
            exit 1
          fi
          echo "Waiting for $active_workloads terminating ARC workload(s) to disappear on $node" >&2
          sleep 15
        done
        REMOTE

        token="$(ssh -n -o BatchMode=yes "$controller_target" \
          'sudo -n k0s token create --role worker --expiry 15m')"
        test "${#token}" -gt 100
        {
          printf '%s\n' "$worker_mesh_address" "$worker_arc_tier" "$worker_service_state"
          printf '%s' "$token"
        } | ssh -o BatchMode=yes -J "$controller_target" "$worker_target" \
          'set -euo pipefail
          IFS= read -r worker_mesh_address
          IFS= read -r worker_arc_tier
          IFS= read -r worker_service_state
          token_temp="$(mktemp)"
          cleanup_worker_token() {
            original_status="$?"
            trap - EXIT
            cleanup_status=0
            rm -f "$token_temp" || cleanup_status=1
            sudo -n rm -f /etc/k0s/worker-token || cleanup_status=1
            sudo -n test ! -e /etc/k0s/worker-token || cleanup_status=1
            if test "$cleanup_status" -ne 0; then
              echo "k0s worker: token cleanup failed after command status $original_status" >&2
              test "$original_status" -ne 0 && exit "$original_status"
              exit 1
            fi
            exit "$original_status"
          }
          trap cleanup_worker_token EXIT
          cat > "$token_temp"
          test -s "$token_temp"
          sudo -n install -m 0600 "$token_temp" /etc/k0s/worker-token
          sudo -n k0s install worker \
            --force \
            --token-file /etc/k0s/worker-token \
            --kubelet-extra-args="--node-ip=$worker_mesh_address --register-with-taints=nook.nokey.sh/arc-build=preparing:NoSchedule" \
            --labels="nook.nokey.sh/arc-build=true,nook.nokey.sh/node-role=compute,nook.nokey.sh/arc-tier=$worker_arc_tier"
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable k0sworker
          if test "$worker_service_state" = fresh; then
            sudo -n systemctl start k0sworker.service
          else
            sudo -n systemctl restart k0sworker.service
          fi
          sudo -n systemctl is-active --quiet k0sworker.service'
        token=

        ssh -o BatchMode=yes "$controller_target" bash -s -- \
          "$worker_mesh_address" "$worker_ssh_user" "$worker_arc_tier" "$remote_dir" <<'REMOTE'
        set -euo pipefail
        worker_mesh_address="$1"
        worker_ssh_user="$2"
        worker_arc_tier="$3"
        remote_dir="$4"
        for _ in $(seq 1 150); do
          node="$(sudo -n k0s kubectl get nodes -o json 2>/dev/null | jq -r \
            --arg address "$worker_mesh_address" \
            '.items[] | select(any(.status.addresses[]; .type == "InternalIP" and .address == $address)) | .metadata.name' || true)"
          test -z "$node" || break
          sleep 2
        done
        test -n "$node"
        worker_pod_cidr="$(
          sudo -n k0s kubectl get "node/$node" -o jsonpath='{.spec.podCIDR}'
        )"
        if ! [[ "$worker_pod_cidr" =~ ^10\.244\.[0-9]{1,3}\.0/24$ ]]; then
          echo "k0s worker received an invalid Pod CIDR: $worker_pod_cidr" >&2
          exit 1
        fi
        peer_file="/etc/wireguard/nook-peers/$worker_mesh_address.conf"
        test "$(sudo -n stat -c '%F:%u:%g:%h' -- "$peer_file")" = \
          "regular file:0:0:1"
        peer_next="$(mktemp)"
        config="$(mktemp)"
        private_key="$(sudo -n cat /etc/wireguard/nook-private.key)"
        cleanup() {
          private_key=
          rm -f "$peer_next" "$config"
          sudo -n rm -f /etc/wireguard/.nook-syncconf
        }
        trap cleanup EXIT
        sudo -n sed \
          "s|^AllowedIPs = .*|AllowedIPs = $worker_mesh_address/32,$worker_pod_cidr|" \
          "$peer_file" > "$peer_next"
        sudo -n install -m 0600 "$peer_next" "$peer_file"
        cat > "$config" <<EOF
        [Interface]
        Address = 10.202.0.1/24
        ListenPort = 51820
        PrivateKey = $private_key
        EOF
        while IFS= read -r persisted_peer; do
          printf '\n' >> "$config"
          sudo -n cat "$persisted_peer" >> "$config"
        done < <(sudo -n find /etc/wireguard/nook-peers -maxdepth 1 -type f -name '*.conf' -print | sort)
        sudo -n install -m 0600 "$config" /etc/wireguard/wg-nook.conf
        private_key=
        sudo -n wg-quick strip wg-nook > "$peer_next"
        sudo -n install -m 0600 "$peer_next" /etc/wireguard/.nook-syncconf
        sudo -n wg syncconf wg-nook /etc/wireguard/.nook-syncconf
        sudo -n rm -f /etc/wireguard/.nook-syncconf
        sudo -n ip route replace "$worker_pod_cidr" dev wg-nook
        sudo -n k0s kubectl wait "node/$node" --for=condition=Ready --timeout=5m
        test "$(sudo -n k0s kubectl get "node/$node" -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')" = "$worker_mesh_address"
        sudo -n k0s kubectl annotate "node/$node" \
          "nook.nokey.sh/ssh-target=$worker_ssh_user@$worker_mesh_address" \
          "nook.nokey.sh/infra-remote-dir=$remote_dir" \
          --overwrite
        sudo -n k0s kubectl label "node/$node" \
          "nook.nokey.sh/arc-tier=$worker_arc_tier" --overwrite
        REMOTE
        ssh -n -o BatchMode=yes -J "$controller_target" \
          "$worker_target" 'bash -s' <<'REMOTE'
        set -euo pipefail
        sudo -n test ! -e /etc/k0s/containerd.d/registry-auth.toml
        invocation="$(sudo -n systemctl show k0sworker.service \
          --property=InvocationID --value)"
        [[ "$invocation" =~ ^[0-9a-f]{32}$ ]]
        marker_next="$(mktemp)"
        trap 'rm -f "$marker_next"' EXIT
        printf '%s\n' "$invocation" > "$marker_next"
        sudo -n install -m 0600 "$marker_next" \
          /var/lib/k0s/nook-containerd-auth-clean-invocation
        REMOTE
        BASH

  k0s:worker:restore:
    desc: Restore an existing k0s worker without reconciling the wider fleet.
    cmds:
      - task: k0s:worker:install
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" bash -s -- \
          "{{.INFRA_WORKER_MESH_ADDRESS}}" <<'REMOTE'
        set -euo pipefail
        worker_mesh_address="$1"
        kubectl() { sudo -n k0s kubectl "$@"; }
        node="$(kubectl get nodes -o json | jq -r \
          --arg address "$worker_mesh_address" \
          '.items[] | select(any(.status.addresses[]; .type == "InternalIP" and .address == $address)) | .metadata.name')"
        test "$(printf '%s\n' "$node" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
        node="$(printf '%s\n' "$node" | sed '/^$/d')"
        node_json="$(kubectl get node "$node" -o json)"
        test "$(jq -r '.status.conditions[] | select(.type == "Ready") | .status' <<<"$node_json")" = True
        test "$(jq -r '.metadata.labels["nook.nokey.sh/node-role"]' <<<"$node_json")" = compute
        test "$(jq -r '.metadata.labels["nook.nokey.sh/arc-build"]' <<<"$node_json")" = true
        preparing_taint_state="$(jq -r '[.spec.taints[]? |
          select(.key == "nook.nokey.sh/arc-build")] |
          [length, map(select(
            .value == "preparing" and .effect == "NoSchedule"
          )) | length] | @tsv' <<<"$node_json")"
        test "$preparing_taint_state" = $'1\t1'
        preserved_taints="$(jq -c '[.spec.taints[]? | select(
          .key != "node.kubernetes.io/unschedulable" and
          .key != "nook.nokey.sh/arc-build"
        )] | sort_by(.key, .effect, .value)' <<<"$node_json")"
        kubectl uncordon "$node" >/dev/null
        kubectl taint node "$node" \
          nook.nokey.sh/arc-build=preparing:NoSchedule- >/dev/null
        activated_json="$(kubectl get node "$node" -o json)"
        test "$(jq -r '.spec.unschedulable // false' <<<"$activated_json")" = false
        test -z "$(jq -r '.spec.taints[]? | select(
          .key == "node.kubernetes.io/unschedulable" or
          .key == "nook.nokey.sh/arc-build"
        ) | .key' <<<"$activated_json")"
        test "$(jq -c '[.spec.taints[]?] | sort_by(.key, .effect, .value)' \
          <<<"$activated_json")" = "$preserved_taints"
        printf 'k0s worker %s restored and schedulable\n' "$node"
        REMOTE

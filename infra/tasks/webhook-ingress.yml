version: '3'

vars:
  ARGO_EVENTS_VERSION: v1.9.11
  ARGO_EVENTS_INSTALL_SHA256: affaae84d8d5e5c967048815d8331b7a0b66bc0ae81f81bc47c7e0b2281ebc86
  NOOK_WEBHOOK_INGRESS_HOST: '{{default "webhooks.dev.nokey.sh" .NOOK_WEBHOOK_INGRESS_HOST}}'
  NOOK_WEBHOOK_INGRESS_CLUSTER_IP: '{{default "10.96.90.20" .NOOK_WEBHOOK_INGRESS_CLUSTER_IP}}'

tasks:
  webhook-ingress:sync:
    internal: true
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel)"
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        case "$remote_dir" in
          /home/*/.local/share/nook-infra) ;;
          *)
            echo "webhook ingress sync: refusing unexpected remote directory: $remote_dir" >&2
            exit 2
            ;;
        esac
        ssh -n -o BatchMode=yes "$ssh_target" \
          "install -d -m 0750 \
            '$remote_dir/infra/k0s/manifests/argo-events' \
            '$remote_dir/infra/k0s/manifests/webhook-ingress'"
        COPYFILE_DISABLE=1 tar --no-xattrs -C "$repo_root" -cf - \
          infra/k0s/manifests/argo-events \
          infra/k0s/manifests/webhook-ingress |
          ssh -o BatchMode=yes "$ssh_target" \
            "tar -xf - -C '$remote_dir'"
        BASH

  webhook-ingress:check:
    desc: Validate the pinned Argo Events webhook ingress contract.
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel)"
        platform="$repo_root/infra/k0s/manifests/argo-events/platform.yaml"
        storage="$repo_root/infra/k0s/manifests/argo-events/storage.yaml"
        jetstream_config="$repo_root/infra/k0s/manifests/argo-events/jetstream-config.yaml"
        jetstream_statefulset="$repo_root/infra/k0s/manifests/argo-events/jetstream-statefulset.yaml"
        ingress="$repo_root/infra/k0s/manifests/webhook-ingress/github.yaml"
        traefik="$repo_root/infra/traefik-dynamic.yaml"
        grep -F 'jetstreamExotic:' "$platform" >/dev/null
        grep -F 'url: nats://eventbus-default-js-svc.argo-events.svc:4222' "$platform" >/dev/null
        grep -F 'name: jetstream-argo-client' "$platform" >/dev/null
        grep -F 'maxAge: 24h' "$platform" >/dev/null
        grep -F 'name: jetstream-server' "$platform" >/dev/null
        grep -F 'provisioner: kubernetes.io/no-provisioner' "$storage" >/dev/null
        grep -F 'volumeBindingMode: WaitForFirstConsumer' "$storage" >/dev/null
        grep -F 'reclaimPolicy: Retain' "$storage" >/dev/null
        test "$(grep -c '^kind: PersistentVolume$' "$storage")" -eq 3
        test "$(grep -c '^  persistentVolumeReclaimPolicy: Retain$' "$storage")" -eq 3
        for ordinal in 0 1 2; do
          grep -F "name: argo-events-jetstream-default-$ordinal" "$storage" >/dev/null
          grep -F "name: eventbus-default-js-vol-eventbus-default-js-$ordinal" "$storage" >/dev/null
        done
        for node in bynull-servo nook-rise-s-1 ovh-us; do
          grep -F "values: [\"$node\"]" "$storage" >/dev/null
        done
        grep -F 'name: nook-jetstream-config' "$jetstream_config" >/dev/null
        grep -F 'port: 9222' "$jetstream_config" >/dev/null
        grep -F 'no_tls: true' "$jetstream_config" >/dev/null
        grep -F 'allowed_origins: ["https://events.dev.nokey.sh"]' "$jetstream_config" >/dev/null
        grep -F 'clusterIP: 10.96.90.30' "$jetstream_config" >/dev/null
        grep -F 'replicas: 3' "$jetstream_statefulset" >/dev/null
        grep -F 'storageClassName: argo-events-jetstream-local-retain' "$jetstream_statefulset" >/dev/null
        grep -F 'name: eventbus-default-js-vol' "$jetstream_statefulset" >/dev/null
        grep -F 'name: jetstream-server' "$jetstream_statefulset" >/dev/null
        grep -F 'fsGroup: 1000' "$jetstream_statefulset" >/dev/null
        grep -F 'fsGroupChangePolicy: OnRootMismatch' "$jetstream_statefulset" >/dev/null
        test "$(grep -c 'runAsNonRoot: true' "$jetstream_statefulset")" -eq 3
        grep -F 'runAsUser: 1000' "$jetstream_statefulset" >/dev/null
        grep -F 'runAsUser: 1001' "$jetstream_statefulset" >/dev/null
        test "$(grep -c 'name: JS_KEY' "$jetstream_statefulset")" -eq 1
        ! grep -F 'shareProcessNamespace:' "$jetstream_statefulset"
        ! grep -F 'name: reloader' "$jetstream_statefulset"
        test "$(grep -c 'mountPath: /etc/nats-config' "$jetstream_statefulset")" -eq 1
        grep -F 'kind: EventSource' "$ingress" >/dev/null
        grep -F 'replicas: 2' "$ingress" >/dev/null
        grep -F 'endpoint: /webhooks/github' "$ingress" >/dev/null
        grep -F 'method: POST' "$ingress" >/dev/null
        grep -F 'name: github-webhook-secret' "$ingress" >/dev/null
        grep -F 'key: secret' "$ingress" >/dev/null
        grep -F 'insecure: false' "$ingress" >/dev/null
        grep -F 'active: true' "$ingress" >/dev/null
        ruby -ryaml -e '
          expected = %w[
            ping
            pull_request
            pull_request_review
            pull_request_review_comment
            issue_comment
            check_run
            check_suite
            workflow_job
            workflow_run
            status
          ]
          document = YAML.load_stream(File.binread(ARGV.fetch(0))).find do |item|
            item.is_a?(Hash) && item["kind"] == "EventSource"
          end
          abort("missing EventSource") unless document
          github = document.dig("spec", "github")
          abort("expected only pr-lifecycle GitHub event source") unless github.keys == ["pr-lifecycle"]
          abort("unexpected GitHub event subscription") unless github.dig("pr-lifecycle", "events") == expected
        ' "$ingress"
        test "$(grep -c '^kind: EventSource$' "$ingress")" -eq 1
        ! grep -Eq '^kind: (Sensor|Workflow)$|websocket|hostPort:|type: (NodePort|LoadBalancer)' \
          "$platform" "$storage" "$ingress"
        ! grep -Eq 'hostPort:|type: (NodePort|LoadBalancer)' \
          "$jetstream_config" "$jetstream_statefulset"
        ! test -e "$repo_root/infra/k0s/manifests/argo-events/jetstream-consumer.yaml"
        grep -F 'Host(`{{.NOOK_WEBHOOK_INGRESS_HOST}}`) && Path(`/webhooks/github`) && Method(`POST`)' \
          "$traefik" >/dev/null
        grep -F 'url: http://{{.NOOK_WEBHOOK_INGRESS_CLUSTER_IP}}:12000' \
          "$traefik" >/dev/null
        grep -F 'Host(`events.dev.nokey.sh`)' "$traefik" >/dev/null
        grep -F 'url: http://10.96.90.30:9222' "$traefik" >/dev/null
        grep -F 'webhook-ingress:jetstream:pr-steward:sync:' "$repo_root/infra/tasks/webhook-ingress.yml" >/dev/null
        grep -F '${HOME}/.nook/events/pr-steward-client.yaml' "$repo_root/infra/tasks/webhook-ingress.yml" >/dev/null
        grep -F 'deny: [">"]' "$repo_root/infra/tasks/webhook-ingress.yml" >/dev/null
        grep -F 'allow: ["default.github-webhook.pr-lifecycle"]' "$repo_root/infra/tasks/webhook-ingress.yml" >/dev/null
        BASH

  webhook-ingress:jetstream:secrets:publish:
    internal: true
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes \
          -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=4 \
          "{{.INFRA_SSH_TARGET}}" \
          "REMOTE_DIR='{{.INFRA_REMOTE_DIR}}' ROTATE_PR_STEWARD='{{default "false" .ROTATE_PR_STEWARD}}' bash -s" <<'REMOTE'
        set -euo pipefail
        kubectl() { sudo -n k0s kubectl "$@"; }
        secret_dir="$REMOTE_DIR/secrets/jetstream"
        umask 077
        install -d -m 0700 "$REMOTE_DIR/secrets" "$secret_dir"
        kubectl create namespace argo-events --dry-run=client -o yaml |
          kubectl apply -f - >/dev/null

        preserve_key() {
          source_secret="$1"
          source_key="$2"
          destination="$3"
          if test -s "$destination"; then
            test "$(stat -c '%a' "$destination")" = 600
            return
          fi
          next="$(mktemp "$secret_dir/.preserve.XXXXXX")"
          kubectl get secret "$source_secret" --namespace argo-events \
            -o json |
            SOURCE_KEY="$source_key" ruby -rbase64 -rjson -e '
              secret = JSON.parse(STDIN.read)
              print Base64.strict_decode64(secret.fetch("data").fetch(ENV.fetch("SOURCE_KEY")))
            ' > "$next"
          test -s "$next"
          install -m 0600 "$next" "$destination"
          rm -f "$next"
        }

        preserve_key eventbus-default-js-client-auth client-auth "$secret_dir/argo-client.yaml"
        preserve_key eventbus-default-js-server encryption "$secret_dir/encryption"
        preserve_key eventbus-default-js-server private-key "$secret_dir/server-private-key.pem"
        preserve_key eventbus-default-js-server cert "$secret_dir/server-cert.pem"
        preserve_key eventbus-default-js-server ca-cert "$secret_dir/ca-cert.pem"
        preserve_key eventbus-default-js-server cluster-private-key "$secret_dir/cluster-private-key.pem"
        preserve_key eventbus-default-js-server cluster-cert "$secret_dir/cluster-cert.pem"
        preserve_key eventbus-default-js-server cluster-ca-cert "$secret_dir/cluster-ca-cert.pem"

        ruby -ryaml -e '
          auth = YAML.safe_load(File.binread(ARGV.fetch(0)))
          File.binwrite(ARGV.fetch(1), auth.fetch("username"))
          File.binwrite(ARGV.fetch(2), auth.fetch("password"))
        ' "$secret_dir/argo-client.yaml" \
          "$secret_dir/argo-username" "$secret_dir/argo-password"
        chmod 0600 "$secret_dir/argo-username" "$secret_dir/argo-password"

        if test "$ROTATE_PR_STEWARD" = true || ! test -s "$secret_dir/pr-steward-password"; then
          next="$(mktemp "$secret_dir/.pr-steward-password.XXXXXX")"
          openssl rand -hex 32 | tr -d '\n' > "$next"
          install -m 0600 "$next" "$secret_dir/pr-steward-password"
          rm -f "$next"
        fi
        printf 'pr-steward' > "$secret_dir/pr-steward-username"
        chmod 0600 "$secret_dir/pr-steward-username"
        if ! test -s "$secret_dir/system-password"; then
          next="$(mktemp "$secret_dir/.system-password.XXXXXX")"
          openssl rand -hex 32 | tr -d '\n' > "$next"
          install -m 0600 "$next" "$secret_dir/system-password"
          rm -f "$next"
        fi

        ruby -e '
          argo_user = File.binread(ARGV.fetch(0))
          argo_password = File.binread(ARGV.fetch(1))
          steward_user = File.binread(ARGV.fetch(2))
          steward_password = File.binread(ARGV.fetch(3))
          system_password = File.binread(ARGV.fetch(4))
          values = [argo_user, argo_password, steward_user, steward_password, system_password]
          abort("invalid credential material") unless values.all? { |value| value.match?(/\A[A-Za-z0-9_-]+\z/) }
          config = <<~CONF
            system_account: sys
            accounts: {
              "js": {
                jetstream: true
                users: [
                  {user: "#{argo_user}", pass: "#{argo_password}"},
                  {
                    user: "#{steward_user}", pass: "#{steward_password}"
                    permissions: {
                      publish: {
                        deny: [">"]
                      }
                      subscribe: {
                        allow: ["default.github-webhook.pr-lifecycle"]
                      }
                    }
                  }
                ]
              }
              "sys": {
                users: [{user: "sys", pass: "#{system_password}"}]
              }
            }
          CONF
          File.binwrite(ARGV.fetch(5), config)
          File.binwrite(
            ARGV.fetch(6),
            "username: #{steward_user}\npassword: #{steward_password}\n"
          )
        ' "$secret_dir/argo-username" "$secret_dir/argo-password" \
          "$secret_dir/pr-steward-username" "$secret_dir/pr-steward-password" \
          "$secret_dir/system-password" "$secret_dir/auth.conf" \
          "$secret_dir/pr-steward-client.yaml"
        chmod 0600 "$secret_dir/auth.conf" "$secret_dir/pr-steward-client.yaml"

        kubectl create secret generic jetstream-server --namespace argo-events \
          --from-file=auth="$secret_dir/auth.conf" \
          --from-file=encryption="$secret_dir/encryption" \
          --from-file=private-key="$secret_dir/server-private-key.pem" \
          --from-file=cert="$secret_dir/server-cert.pem" \
          --from-file=ca-cert="$secret_dir/ca-cert.pem" \
          --from-file=cluster-private-key="$secret_dir/cluster-private-key.pem" \
          --from-file=cluster-cert="$secret_dir/cluster-cert.pem" \
          --from-file=cluster-ca-cert="$secret_dir/cluster-ca-cert.pem" \
          --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        kubectl create secret generic jetstream-argo-client --namespace argo-events \
          --from-file=auth="$secret_dir/argo-client.yaml" \
          --from-file=username="$secret_dir/argo-username" \
          --from-file=password="$secret_dir/argo-password" \
          --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        kubectl create secret generic jetstream-pr-steward-client --namespace argo-events \
          --from-file=auth="$secret_dir/pr-steward-client.yaml" \
          --from-file=username="$secret_dir/pr-steward-username" \
          --from-file=password="$secret_dir/pr-steward-password" \
          --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        REMOTE

  webhook-ingress:platform:deploy:
    desc: Install Argo Events and adopt its retained JetStream into repository ownership.
    silent: true
    cmds:
      - task: webhook-ingress:check
      - task: webhook-ingress:sync
      - task: webhook-ingress:jetstream:secrets:publish
      - |
        ssh -o BatchMode=yes \
          -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=4 \
          "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        version="{{.ARGO_EVENTS_VERSION}}"
        install_sha="{{.ARGO_EVENTS_INSTALL_SHA256}}"
        download_dir="$remote_dir/downloads"
        install_file="$download_dir/argo-events-$version-install.yaml"
        install_next="$install_file.next"
        kubectl() { sudo -n k0s kubectl "$@"; }
        install -d -m 0750 "$download_dir"
        curl -fsSL --retry 3 -o "$install_next" \
          "https://github.com/argoproj/argo-events/releases/download/$version/install.yaml"
        printf '%s  %s\n' "$install_sha" "$install_next" | sha256sum -c -
        mv "$install_next" "$install_file"
        kubectl create namespace argo-events --dry-run=client -o yaml |
          kubectl apply -f - >/dev/null
        kubectl label namespace argo-events \
          nook.nokey.sh/role=webhook-events --overwrite >/dev/null
        kubectl apply -f "$install_file"
        kubectl rollout status deployment/controller-manager \
          --namespace argo-events --timeout=5m
        kubectl wait --for=condition=Established \
          crd/eventbus.argoproj.io \
          crd/eventsources.argoproj.io \
          crd/sensors.argoproj.io --timeout=2m
        prepare_storage_node() {
          ordinal="$1"
          node="$2"
          pod="argo-events-jetstream-storage-prep-$ordinal"
          kubectl delete pod "$pod" --namespace argo-events \
            --ignore-not-found --wait >/dev/null
          cat <<YAML | kubectl apply -f - >/dev/null
        apiVersion: v1
        kind: Pod
        metadata:
          name: $pod
          namespace: argo-events
        spec:
          automountServiceAccountToken: false
          nodeName: $node
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prepare
              image: registry.dev.nokey.sh/library/busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
              command: ["sh", "-ec", "mkdir -p /host/jetstream-default && chmod 0700 /host/jetstream-default"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: false
                runAsUser: 0
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
              volumeMounts:
                - name: storage-root
                  mountPath: /host
          volumes:
            - name: storage-root
              hostPath:
                path: /var/lib/nook/argo-events
                type: DirectoryOrCreate
        YAML
          kubectl wait pod "$pod" --namespace argo-events \
            --for=jsonpath='{.status.phase}'=Succeeded --timeout=2m
          kubectl delete pod "$pod" --namespace argo-events --wait >/dev/null
        }
        prepare_storage_node 0 bynull-servo
        prepare_storage_node 1 nook-rise-s-1
        prepare_storage_node 2 ovh-us
        kubectl apply \
          -f "$remote_dir/infra/k0s/manifests/argo-events/storage.yaml"
        statefulset=statefulset/eventbus-default-js
        eventbus_uid="$(kubectl get eventbus/default --namespace argo-events \
          -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
        managed_by_eventbus=false
        if kubectl get "$statefulset" --namespace argo-events >/dev/null 2>&1; then
          owner_uid="$(kubectl get "$statefulset" --namespace argo-events \
            -o jsonpath='{.metadata.ownerReferences[?(@.kind=="EventBus")].uid}')"
          if test -n "$eventbus_uid" && test "$owner_uid" = "$eventbus_uid"; then
            managed_by_eventbus=true
          elif test -n "$owner_uid"; then
            echo 'refusing JetStream StatefulSet with unexpected owner' >&2
            exit 2
          fi
        fi
        : > /tmp/nook-jetstream-claims-before
        for ordinal in 0 1 2; do
          claim="persistentvolumeclaim/eventbus-default-js-vol-eventbus-default-js-$ordinal"
          for attempt in $(seq 1 60); do
            if kubectl get "$claim" --namespace argo-events >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          kubectl get "$claim" --namespace argo-events >/dev/null
          kubectl wait --for=jsonpath='{.status.phase}'=Bound \
            "$claim" \
            --namespace argo-events --timeout=10m
          kubectl get "$claim" --namespace argo-events \
            -o jsonpath='{.metadata.uid}{"\t"}{.spec.volumeName}{"\n"}' \
            >> /tmp/nook-jetstream-claims-before
        done
        if test "$managed_by_eventbus" = true; then
          controller_replicas="$(kubectl get deployment/controller-manager \
            --namespace argo-events -o jsonpath='{.spec.replicas}')"
          restore_controller() {
            kubectl scale deployment/controller-manager --namespace argo-events \
              --replicas="$controller_replicas" >/dev/null || true
          }
          trap restore_controller EXIT
          kubectl scale deployment/controller-manager --namespace argo-events \
            --replicas=0
          kubectl rollout status deployment/controller-manager \
            --namespace argo-events --timeout=5m
          for resource in \
            "$statefulset" \
            service/eventbus-default-js-svc \
            configmap/eventbus-default-js-config \
            secret/eventbus-default-js-client-auth \
            secret/eventbus-default-js-server; do
            if kubectl get "$resource" --namespace argo-events >/dev/null 2>&1 &&
              test -n "$(kubectl get "$resource" --namespace argo-events \
                -o jsonpath='{.metadata.ownerReferences}')"; then
              kubectl patch "$resource" --namespace argo-events --type=json \
                -p='[{"op":"remove","path":"/metadata/ownerReferences"}]'
            fi
          done
          kubectl patch eventbus/default --namespace argo-events --type=json \
            -p='[{"op":"remove","path":"/metadata/finalizers"}]'
          kubectl delete eventbus/default --namespace argo-events \
            --cascade=orphan --wait
          kubectl delete "$statefulset" --namespace argo-events \
            --cascade=foreground --wait
          kubectl apply \
            -f "$remote_dir/infra/k0s/manifests/argo-events/jetstream-config.yaml"
          kubectl apply \
            -f "$remote_dir/infra/k0s/manifests/argo-events/jetstream-statefulset.yaml"
          kubectl rollout status "$statefulset" \
            --namespace argo-events --timeout=10m
          restore_controller
          trap - EXIT
          kubectl rollout status deployment/controller-manager \
            --namespace argo-events --timeout=5m
          kubectl apply \
            -f "$remote_dir/infra/k0s/manifests/argo-events/platform.yaml"
        else
          kubectl apply \
            -f "$remote_dir/infra/k0s/manifests/argo-events/jetstream-config.yaml"
          kubectl apply \
            -f "$remote_dir/infra/k0s/manifests/argo-events/jetstream-statefulset.yaml"
          kubectl apply \
            -f "$remote_dir/infra/k0s/manifests/argo-events/platform.yaml"
        fi
        kubectl rollout status "$statefulset" \
          --namespace argo-events --timeout=10m
        kubectl wait --for=condition=Deployed eventbus/default \
          --namespace argo-events --timeout=10m
        kubectl wait --for=condition=Configured eventbus/default \
          --namespace argo-events --timeout=10m
        test "$(kubectl get eventbus/default --namespace argo-events \
          -o jsonpath='{.status.config.jetstream.accessSecret.name}')" = \
          jetstream-argo-client
        test "$(kubectl get "$statefulset" --namespace argo-events \
          -o jsonpath='{.status.readyReplicas}')" = 3
        test -z "$(kubectl get "$statefulset" --namespace argo-events \
          -o jsonpath='{.metadata.ownerReferences}')"
        service_owner="$(kubectl get service/eventbus-default-js-svc \
          --namespace argo-events -o jsonpath='{.metadata.ownerReferences}')"
        if test -n "$service_owner"; then
          kubectl patch service/eventbus-default-js-svc --namespace argo-events \
            --type=json -p='[{"op":"remove","path":"/metadata/ownerReferences"}]'
        fi
        kubectl apply \
          -f "$remote_dir/infra/k0s/manifests/argo-events/jetstream-config.yaml"
        test -z "$(kubectl get service/eventbus-default-js-svc \
          --namespace argo-events -o jsonpath='{.metadata.ownerReferences}')"
        : > /tmp/nook-jetstream-claims-after
        for ordinal in 0 1 2; do
          claim="persistentvolumeclaim/eventbus-default-js-vol-eventbus-default-js-$ordinal"
          kubectl get "$claim" --namespace argo-events \
            -o jsonpath='{.metadata.uid}{"\t"}{.spec.volumeName}{"\n"}' \
            >> /tmp/nook-jetstream-claims-after
        done
        cmp /tmp/nook-jetstream-claims-before /tmp/nook-jetstream-claims-after
        if kubectl get deployment --namespace argo-events \
          --selector eventsource-name=github-webhook -o name | grep -q .; then
          kubectl rollout restart deployment --namespace argo-events \
            --selector eventsource-name=github-webhook
          kubectl rollout status deployment --namespace argo-events \
            --selector eventsource-name=github-webhook --timeout=10m
        fi
        kubectl delete configmap/eventbus-default-js-config \
          secret/eventbus-default-js-client-auth \
          secret/eventbus-default-js-server \
          --namespace argo-events --ignore-not-found
        rm -f /tmp/nook-jetstream-claims-before /tmp/nook-jetstream-claims-after
        REMOTE

  webhook-ingress:secret:publish:
    internal: true
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        remote_secret="$remote_dir/secrets/github-webhook-secret"
        ssh -o BatchMode=yes \
          -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=4 \
          "$ssh_target" "REMOTE_DIR='$remote_dir' bash -s" <<'REMOTE'
        set -euo pipefail
        secret_dir="$REMOTE_DIR/secrets"
        remote_secret="$secret_dir/github-webhook-secret"
        umask 077
        install -d -m 0700 "$secret_dir"
        if ! test -s "$remote_secret"; then
          secret_next="$(mktemp "$secret_dir/.github-webhook-secret.XXXXXX")"
          trap 'rm -f "$secret_next"' EXIT
          openssl rand -hex 32 | tr -d '\n' > "$secret_next"
          test "$(wc -c < "$secret_next" | tr -d ' ')" = 64
          install -m 0600 "$secret_next" "$remote_secret"
        fi
        test "$(stat -c '%a' "$remote_secret")" = 600
        sudo -n k0s kubectl create secret generic github-webhook-secret \
          --namespace argo-events \
          --from-file=secret="$remote_secret" \
          --dry-run=client -o yaml |
          sudo -n k0s kubectl apply --namespace argo-events -f - >/dev/null
        REMOTE
        BASH

  webhook-ingress:deploy:
    desc: Deploy the Argo Events endpoint with its infrastructure-owned secret.
    silent: true
    cmds:
      - task: webhook-ingress:platform:deploy
      - task: webhook-ingress:secret:publish
      - |
        bash <<'BASH'
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel)"
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        remote_traefik="$remote_dir/traefik-dynamic.yaml"
        remote_traefik_next="$remote_traefik.next"
        scp -q -o BatchMode=yes \
          "$repo_root/infra/traefik-dynamic.yaml" \
          "$ssh_target:$remote_traefik_next"
        ssh -o BatchMode=yes "$ssh_target" \
          "REMOTE_DIR='$remote_dir' REMOTE_TRAEFIK='$remote_traefik' REMOTE_TRAEFIK_NEXT='$remote_traefik_next' bash -s" <<'REMOTE'
        set -euo pipefail
        sudo -n k0s kubectl apply \
          -f "$REMOTE_DIR/infra/k0s/manifests/webhook-ingress/github.yaml"
        sudo -n k0s kubectl wait --for=condition=Deployed eventsource/github-webhook \
          --namespace argo-events --timeout=10m
        sudo -n k0s kubectl rollout status deployment \
          --selector eventsource-name=github-webhook \
          --namespace argo-events --timeout=10m
        sudo -n k0s kubectl wait --for=condition=Available deployment \
          --selector eventsource-name=github-webhook \
          --namespace argo-events --timeout=10m
        test "$(sudo -n k0s kubectl get service/github-webhook-eventsource \
          --namespace argo-events -o jsonpath='{.spec.clusterIP}')" = '{{.NOOK_WEBHOOK_INGRESS_CLUSTER_IP}}'
        cp "$REMOTE_TRAEFIK_NEXT" "$REMOTE_TRAEFIK"
        rm -f "$REMOTE_TRAEFIK_NEXT"
        docker compose -f "$REMOTE_DIR/compose.yaml" up -d --wait --force-recreate traefik
        ! docker logs nook-infra-traefik-1 --since 10s 2>&1 |
          grep -Ei 'error|invalid|failed'
        ! ss --tcp --listening --numeric --no-header |
          grep -E ':(12000|4222|6222|8222|9222)[[:space:]]' >/dev/null
        REMOTE
        BASH

  webhook-ingress:status:
    desc: Show the Argo Events webhook platform without secret material.
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        sudo -n k0s kubectl get deployment,statefulset,pod,service,eventbus,eventsource \
          --namespace argo-events -o wide
        sudo -n k0s kubectl get persistentvolumeclaim --namespace argo-events \
          -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,PV:.spec.volumeName
        REMOTE

  webhook-ingress:jetstream:pr-steward:rotate:
    desc: Rotate the external PR Steward credential and reconcile JetStream.
    silent: true
    cmds:
      - task: webhook-ingress:check
      - task: webhook-ingress:jetstream:secrets:publish
        vars:
          ROTATE_PR_STEWARD: 'true'
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        kubectl() { sudo -n k0s kubectl "$@"; }
        kubectl rollout restart statefulset/eventbus-default-js \
          --namespace argo-events
        kubectl rollout status statefulset/eventbus-default-js \
          --namespace argo-events --timeout=10m
        test "$(kubectl get statefulset/eventbus-default-js \
          --namespace argo-events -o jsonpath='{.status.readyReplicas}')" = 3
        printf '%s\n' \
          'PR Steward credential rotated; reload the infrastructure-owned handoff file.'
        REMOTE

  webhook-ingress:jetstream:pr-steward:sync:
    desc: Sync the scoped PR Steward credential to private local state.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        target="${NOOK_PR_STEWARD_CREDENTIAL_FILE:-${HOME}/.nook/events/pr-steward-client.yaml}"
        case "$target" in
          /*) ;;
          *)
            echo 'PR Steward credential destination must be an absolute path' >&2
            exit 2
            ;;
        esac
        target_dir="$(dirname "$target")"
        if test -e "$target_dir" || test -L "$target_dir"; then
          test -d "$target_dir"
          test ! -L "$target_dir"
        else
          install -d -m 0700 "$target_dir"
        fi
        TARGET_DIR="$target_dir" ruby -e '
          directory = File.stat(ENV.fetch("TARGET_DIR"))
          abort("credential directory owner mismatch") unless directory.uid == Process.uid
          abort("credential directory mode must be 0700") unless directory.mode & 0o777 == 0o700
        '
        if test -e "$target" || test -L "$target"; then
          test -f "$target"
          test ! -L "$target"
          TARGET="$target" ruby -e '
            file = File.stat(ENV.fetch("TARGET"))
            abort("credential file owner mismatch") unless file.uid == Process.uid
            abort("credential file mode must be 0600") unless file.mode & 0o777 == 0o600
          '
        fi
        next="$(mktemp "$target_dir/.pr-steward-client.XXXXXX")"
        trap 'rm -f "$next"' EXIT
        chmod 0600 "$next"
        ssh -o BatchMode=yes \
          -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=4 \
          "{{.INFRA_SSH_TARGET}}" \
          "REMOTE_DIR='{{.INFRA_REMOTE_DIR}}' bash -s" > "$next" <<'REMOTE'
        set -euo pipefail
        credential="$REMOTE_DIR/secrets/jetstream/pr-steward-client.yaml"
        test -f "$credential"
        test ! -L "$credential"
        test "$(stat -c '%a' "$credential")" = 600
        ruby -ryaml -e '
          credential = YAML.safe_load(File.binread(ARGV.fetch(0)))
          valid = credential.is_a?(Hash) &&
            credential.keys.sort == %w[password username] &&
            credential.fetch("username") == "pr-steward" &&
            credential.fetch("password").match?(/\A[0-9a-f]{64}\z/)
          abort("invalid PR Steward credential shape") unless valid
        ' "$credential"
        cat "$credential"
        REMOTE
        test -s "$next"
        NEXT="$next" ruby -ryaml -e '
          path = ENV.fetch("NEXT")
          file = File.stat(path)
          abort("staged credential mode must be 0600") unless file.mode & 0o777 == 0o600
          credential = YAML.safe_load(File.binread(path))
          valid = credential.is_a?(Hash) &&
            credential.keys.sort == %w[password username] &&
            credential.fetch("username") == "pr-steward" &&
            credential.fetch("password").match?(/\A[0-9a-f]{64}\z/)
          abort("invalid staged PR Steward credential shape") unless valid
        '
        mv -f "$next" "$target"
        trap - EXIT
        TARGET="$target" ruby -e '
          file = File.stat(ENV.fetch("TARGET"))
          abort("credential file owner mismatch") unless file.uid == Process.uid
          abort("credential file mode must be 0600") unless file.mode & 0o777 == 0o600
        '
        printf 'PR Steward credential synchronized to %s\n' "$target"
        BASH

  webhook-ingress:jetstream:wss:smoke:
    deps: [":tooling:install"]
    desc: Prove trusted WSS, scoped consumption, and authorization denials.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        endpoint=wss://events.dev.nokey.sh:443
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        work_dir="$(mktemp -d)"
        chmod 0700 "$work_dir"
        trap 'rm -rf "$work_dir"' EXIT
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
          "REMOTE_DIR='$remote_dir' bash -s" > "$work_dir/credentials" <<'REMOTE'
        set -euo pipefail
        credential="$REMOTE_DIR/secrets/jetstream/pr-steward-client.yaml"
        test "$(stat -c '%a' "$credential")" = 600
        cat "$credential"
        REMOTE
        chmod 0600 "$work_dir/credentials"
        ruby -ryaml -e '
          credential = YAML.safe_load(File.binread(ARGV.fetch(0)))
          File.binwrite(ARGV.fetch(1), credential.fetch("username"))
          File.binwrite(ARGV.fetch(2), credential.fetch("password"))
        ' "$work_dir/credentials" "$work_dir/user" "$work_dir/password"
        chmod 0600 "$work_dir/user" "$work_dir/password"
        bun infra/jetstream-wss-check.ts "$endpoint" "$work_dir" \
          >"$work_dir/client-output" 2>"$work_dir/client-error" &
        client_pid=$!
        for attempt in $(seq 1 100); do
          test -f "$work_dir/ready" && break
          kill -0 "$client_pid" 2>/dev/null || {
            cat "$work_dir/client-error" >&2
            exit 1
          }
          sleep 0.1
        done
        test -f "$work_dir/ready"
        task infra:webhook-ingress:hook:ping
        wait "$client_pid" || {
          cat "$work_dir/client-error" >&2
          exit 1
        }
        test -s "$work_dir/received"
        printf '%s\n' \
          'trusted WSS/auth -> accepted' \
          'missing/wrong auth -> rejected' \
          'application publish/unrelated subscribe -> denied' \
          'JetStream API -> denied' \
          'exact lifecycle subject -> received GitHub ping'
        BASH

  webhook-ingress:smoke:
    desc: Prove public TLS, signature rejection, and signed GitHub ping dispatch.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        endpoint="https://{{.NOOK_WEBHOOK_INGRESS_HOST}}/webhooks/github"
        remote_secret="{{.INFRA_REMOTE_DIR}}/secrets/github-webhook-secret"
        delivery_nonce="$(date +%s)-$$"
        ping_body='{"zen":"Keep it logically awesome.","hook_id":1}'
        ping_signature="$(printf '%s' "$ping_body" |
          ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
            "ruby -ropenssl -e 'print \"sha256=\", OpenSSL::HMAC.hexdigest(\"SHA256\", File.binread(ARGV.fetch(0)), STDIN.read)' '$remote_secret'")"
        before="$(ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
          "sudo -n k0s kubectl logs --selector eventsource-name=github-webhook \
            --namespace argo-events --since=1m 2>/dev/null | \
            grep -c 'successfully dispatched the request to the event bus' || true")"
        invalid_code="$(curl -sS -o /dev/null -w '%{http_code}' \
          --request POST \
          --header 'Content-Type: application/json' \
          --header 'X-GitHub-Event: ping' \
          --header "X-GitHub-Delivery: smoke-invalid-$delivery_nonce" \
          --header 'X-Hub-Signature-256: sha256=ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff' \
          --data-binary "$ping_body" "$endpoint")"
        test "$invalid_code" = 400
        ping_code="$(curl -sS -o /dev/null -w '%{http_code}' \
          --request POST \
          --header 'Content-Type: application/json' \
          --header 'X-GitHub-Event: ping' \
          --header "X-GitHub-Delivery: smoke-ping-$delivery_nonce" \
          --header "X-Hub-Signature-256: $ping_signature" \
          --data-binary "$ping_body" "$endpoint")"
        test "$ping_code" = 200
        sleep 2
        after="$(ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
          "sudo -n k0s kubectl logs --selector eventsource-name=github-webhook \
            --namespace argo-events --since=2m 2>/dev/null | \
            grep -c 'successfully dispatched the request to the event bus' || true")"
        test "$after" -gt "$before"
        printf 'invalid signature -> %s\nsigned GitHub ping -> %s\ndispatch observations -> %s to %s\n' \
          "$invalid_code" "$ping_code" "$before" "$after"
        BASH

  webhook-ingress:hook:register:
    desc: Idempotently register the bounded meta-secret/nook PR lifecycle webhook.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        endpoint="https://{{.NOOK_WEBHOOK_INGRESS_HOST}}/webhooks/github"
        remote_secret="{{.INFRA_REMOTE_DIR}}/secrets/github-webhook-secret"
        work_dir="$(mktemp -d)"
        chmod 0700 "$work_dir"
        trap 'rm -rf "$work_dir"' EXIT
        secret_file="$work_dir/secret"
        hooks_file="$work_dir/hooks.json"
        response_file="$work_dir/response.json"
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
          "REMOTE_SECRET='$remote_secret' bash -s" > "$secret_file" <<'REMOTE'
        set -euo pipefail
        test "$(stat -c '%a' "$REMOTE_SECRET")" = 600
        cat "$REMOTE_SECRET"
        REMOTE
        chmod 0600 "$secret_file"
        gh api repos/meta-secret/nook/hooks > "$hooks_file"
        hook_ids="$(ruby -rjson -e '
          endpoint = ARGV.fetch(0)
          hooks = JSON.parse(File.binread(ARGV.fetch(1)))
          puts hooks.filter { |hook| hook.dig("config", "url") == endpoint }.map { |hook| hook.fetch("id") }
        ' "$endpoint" "$hooks_file")"
        hook_count="$(printf '%s\n' "$hook_ids" | sed '/^$/d' | wc -l | tr -d ' ')"
        if test "$hook_count" -gt 1; then
          echo "refusing duplicate GitHub hooks for $endpoint" >&2
          exit 2
        fi
        request() {
          ruby -rjson -e '
            print JSON.generate({
              name: "web",
              active: true,
              events: %w[
                ping
                pull_request
                pull_request_review
                pull_request_review_comment
                issue_comment
                check_run
                check_suite
                workflow_job
                workflow_run
                status
              ],
              config: {
                url: ARGV.fetch(1),
                content_type: "json",
                insecure_ssl: "0",
                secret: File.binread(ARGV.fetch(0))
              }
            })
          ' "$secret_file" "$endpoint"
        }
        if test "$hook_count" = 0; then
          request | gh api --method POST repos/meta-secret/nook/hooks --input - > "$response_file"
        else
          request | gh api --method PATCH "repos/meta-secret/nook/hooks/$hook_ids" \
            --input - > "$response_file"
        fi
        hook_id="$(ruby -rjson -e 'print JSON.parse(File.binread(ARGV.fetch(0))).fetch("id")' \
          "$response_file")"
        test "$(ruby -rjson -e '
          hook = JSON.parse(File.binread(ARGV.fetch(0)))
          expected = %w[
            ping
            pull_request
            pull_request_review
            pull_request_review_comment
            issue_comment
            check_run
            check_suite
            workflow_job
            workflow_run
            status
          ]
          valid = hook.fetch("active") == true && hook.fetch("events").sort == expected.sort &&
            hook.dig("config", "url") == ARGV.fetch(1) &&
            hook.dig("config", "content_type") == "json" &&
            hook.dig("config", "insecure_ssl").to_s == "0"
          print valid ? "yes" : "no"
        ' "$response_file" "$endpoint")" = yes
        printf 'GitHub webhook %s is active with the exact bounded PR lifecycle event set\n' "$hook_id"
        BASH

  webhook-ingress:hook:ping:
    desc: Trigger GitHub's signed ping and wait for successful delivery.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        endpoint="https://{{.NOOK_WEBHOOK_INGRESS_HOST}}/webhooks/github"
        hooks_file="$(mktemp)"
        trap 'rm -f "$hooks_file"' EXIT
        chmod 0600 "$hooks_file"
        gh api repos/meta-secret/nook/hooks > "$hooks_file"
        hook_id="$(ruby -rjson -e '
          endpoint = ARGV.fetch(0)
          expected = %w[
            ping
            pull_request
            pull_request_review
            pull_request_review_comment
            issue_comment
            check_run
            check_suite
            workflow_job
            workflow_run
            status
          ]
          hooks = JSON.parse(File.binread(ARGV.fetch(1))).filter do |hook|
            hook.fetch("active") == true &&
              hook.fetch("events").sort == expected.sort &&
              hook.dig("config", "url") == endpoint &&
              hook.dig("config", "content_type") == "json" &&
              hook.dig("config", "insecure_ssl").to_s == "0"
          end
          abort("expected exactly one active bounded PR lifecycle hook") unless hooks.length == 1
          print hooks.first.fetch("id")
        ' "$endpoint" "$hooks_file")"
        gh api --method POST "repos/meta-secret/nook/hooks/$hook_id/pings" >/dev/null
        for attempt in $(seq 1 20); do
          delivery="$(gh api "repos/meta-secret/nook/hooks/$hook_id/deliveries?per_page=20" \
            --jq '[.[] | select(.event == "ping")][0] | [.status_code, .status] | @tsv')"
          if test "$delivery" = $'200\tOK'; then
            printf 'GitHub webhook %s ping delivery -> 200 OK (waited at most %ss)\n' \
              "$hook_id" "$((attempt * 3))"
            exit 0
          fi
          sleep 3
        done
        echo 'GitHub ping delivery did not reach 200 OK within 60s' >&2
        exit 1
        BASH

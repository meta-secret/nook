version: '3'

# SeaweedFS S3 sccache operations.
vars:
  NOOK_SCCACHE_HOST: '{{default "sccache.dev.nokey.sh" .NOOK_SCCACHE_HOST}}'
  NOOK_SCCACHE_BUCKET: '{{default "nook-sccache" .NOOK_SCCACHE_BUCKET}}'

tasks:
  sccache:credential:ensure:
    desc: Ensure SeaweedFS S3 credentials and config exist on the Borg host.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        secrets_dir="$remote_dir/secrets"
        access_file="$secrets_dir/sccache-access-key"
        secret_file="$secrets_dir/sccache-secret-key"
        remote_access_file="$secrets_dir/sccache-remote-access-key"
        remote_secret_file="$secrets_dir/sccache-remote-secret-key"
        admin_access_file="$secrets_dir/sccache-admin-access-key"
        admin_secret_file="$secrets_dir/sccache-admin-secret-key"
        s3_config="$secrets_dir/seaweedfs-s3.json"
        data_dir="/var/lib/nook/seaweedfs"
        bucket="{{.NOOK_SCCACHE_BUCKET}}"

        install -d -m 0700 "$secrets_dir"
        # The pinned SeaweedFS image drops from its root entrypoint to uid/gid
        # 1000. The bind-mount root itself must remain traversable after restart.
        sudo -n install -d -m 0750 -o 1000 -g 1000 "$data_dir"
        if test ! -s "$access_file"; then
          umask 077
          openssl rand -hex 20 > "$access_file"
        fi
        if test ! -s "$secret_file"; then
          umask 077
          openssl rand -hex 40 > "$secret_file"
        fi
        if test ! -s "$remote_access_file"; then
          umask 077
          openssl rand -hex 20 > "$remote_access_file"
        fi
        if test ! -s "$remote_secret_file"; then
          umask 077
          openssl rand -hex 40 > "$remote_secret_file"
        fi
        if test ! -s "$admin_access_file"; then
          umask 077
          openssl rand -hex 20 > "$admin_access_file"
        fi
        if test ! -s "$admin_secret_file"; then
          umask 077
          openssl rand -hex 40 > "$admin_secret_file"
        fi
        chmod 0600 \
          "$access_file" "$secret_file" \
          "$remote_access_file" "$remote_secret_file" \
          "$admin_access_file" "$admin_secret_file"
        access_key="$(cat "$access_file")"
        secret_key="$(cat "$secret_file")"
        remote_access_key="$(cat "$remote_access_file")"
        remote_secret_key="$(cat "$remote_secret_file")"
        admin_access_key="$(cat "$admin_access_file")"
        admin_secret_key="$(cat "$admin_secret_file")"
        umask 077
        printf '%s\n' "{
          \"identities\": [
            {
              \"name\": \"nook-sccache-build\",
              \"credentials\": [
                {
                  \"accessKey\": \"$access_key\",
                  \"secretKey\": \"$secret_key\"
                }
              ],
              \"actions\": [
                \"Read:$bucket\",
                \"Write:$bucket\",
                \"List:$bucket\",
                \"Tagging:$bucket\"
              ]
            },
            {
              \"name\": \"nook-sccache-remote-reader\",
              \"credentials\": [
                {
                  \"accessKey\": \"$remote_access_key\",
                  \"secretKey\": \"$remote_secret_key\"
                }
              ],
              \"actions\": [
                \"Read:$bucket\",
                \"List:$bucket\"
              ]
            },
            {
              \"name\": \"nook-sccache-admin\",
              \"credentials\": [
                {
                  \"accessKey\": \"$admin_access_key\",
                  \"secretKey\": \"$admin_secret_key\"
                }
              ],
              \"actions\": [\"Admin\", \"Read\", \"Write\", \"List\", \"Tagging\"]
            }
          ]
        }" > "$s3_config"
        chmod 0600 "$s3_config"
        REMOTE

  sccache:credential:sync:
    desc: Sync SeaweedFS S3 credentials to local cache and GitHub Actions secrets.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        host="{{.NOOK_SCCACHE_HOST}}"
        bucket="{{.NOOK_SCCACHE_BUCKET}}"
        home_cache="${HOME}/.nook/cache"
        install -d -m 0700 "$home_cache"
        umask 077
        ssh -n -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
          "cat '{{.INFRA_REMOTE_DIR}}/secrets/sccache-access-key'" \
          > "$home_cache/sccache-access-key"
        ssh -n -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
          "cat '{{.INFRA_REMOTE_DIR}}/secrets/sccache-secret-key'" \
          > "$home_cache/sccache-secret-key"
        printf '%s\n' "$host" > "$home_cache/sccache-host"
        printf '%s\n' "$bucket" > "$home_cache/sccache-bucket"
        chmod 0600 \
          "$home_cache/sccache-access-key" \
          "$home_cache/sccache-secret-key" \
          "$home_cache/sccache-host" \
          "$home_cache/sccache-bucket"
        gh secret set NOOK_SCCACHE_ENDPOINT --body "$host"
        gh secret set NOOK_SCCACHE_ACCESS_KEY \
          --body "$(cat "$home_cache/sccache-access-key")"
        gh secret set NOOK_SCCACHE_SECRET_KEY \
          --body "$(cat "$home_cache/sccache-secret-key")"
        gh secret set NOOK_SCCACHE_BUCKET --body "$bucket"
        gh secret set NOOK_SCCACHE_REMOTE_ACCESS_KEY \
          --body "$(ssh -n -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
            "cat '{{.INFRA_REMOTE_DIR}}/secrets/sccache-remote-access-key'")"
        gh secret set NOOK_SCCACHE_REMOTE_SECRET_KEY \
          --body "$(ssh -n -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
            "cat '{{.INFRA_REMOTE_DIR}}/secrets/sccache-remote-secret-key'")"
        gh secret set NOOK_SCCACHE_REMOTE_BUCKET --body "$bucket"
        echo "SeaweedFS sccache credentials synchronized to ~/.nook/cache"
        BASH

  sccache:bucket:ensure:
    desc: Ensure the nook-sccache S3 bucket exists on the Borg SeaweedFS endpoint.
    silent: true
    deps: ["sccache:credential:ensure"]
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        compose_file="$remote_dir/compose.yaml"
        docker compose -f "$compose_file" config --quiet
        # SeaweedFS loads the bind-mounted identity document at process start.
        # Always recreate it after credential:ensure so an upgraded live stack
        # recognizes newly generated admin credentials before bucket bootstrap.
        docker compose -f "$compose_file" up -d --wait --force-recreate seaweedfs
        docker compose -f "$compose_file" ps --services --filter status=running |
          grep -qx seaweedfs
        access_key="$(cat "$remote_dir/secrets/sccache-admin-access-key")"
        secret_key="$(cat "$remote_dir/secrets/sccache-admin-secret-key")"
        bucket="{{.NOOK_SCCACHE_BUCKET}}"
        # Create bucket via path-style PutBucket against loopback S3.
        docker run --rm --network host \
          -e AWS_ACCESS_KEY_ID="$access_key" \
          -e AWS_SECRET_ACCESS_KEY="$secret_key" \
          -e AWS_DEFAULT_REGION=auto \
          amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab \
          --endpoint-url http://127.0.0.1:8333 \
          s3api create-bucket --bucket "$bucket" >/dev/null 2>&1 || true
        docker run --rm --network host \
          -e AWS_ACCESS_KEY_ID="$access_key" \
          -e AWS_SECRET_ACCESS_KEY="$secret_key" \
          -e AWS_DEFAULT_REGION=auto \
          amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab \
          --endpoint-url http://127.0.0.1:8333 \
          s3api head-bucket --bucket "$bucket"
        REMOTE

  sccache:check:
    desc: Verify SeaweedFS S3 is authenticated on the public hostname.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        host="{{.NOOK_SCCACHE_HOST}}"
        bucket="{{.NOOK_SCCACHE_BUCKET}}"
        access_key="$(cat "$remote_dir/secrets/sccache-access-key")"
        secret_key="$(cat "$remote_dir/secrets/sccache-secret-key")"
        remote_access_key="$(cat "$remote_dir/secrets/sccache-remote-access-key")"
        remote_secret_key="$(cat "$remote_dir/secrets/sccache-remote-secret-key")"
        probe_file="$(mktemp)"
        trap 'rm -f "$probe_file"' EXIT

        if ss --tcp --listening --numeric --no-header 'sport = :6380' 2>/dev/null |
          grep -q .; then
          echo "Host must not listen on :6380 after Redis retirement" >&2
          exit 1
        fi
        if docker compose -f "$remote_dir/compose.yaml" ps --services 2>/dev/null |
          grep -qx redis; then
          echo "Redis compose service must be removed" >&2
          exit 1
        fi

        anon="$(curl -sS -o /dev/null -w '%{http_code}' \
          "https://$host/$bucket" || true)"
        case "$anon" in
          401|403) ;;
          *)
            echo "anonymous sccache access must be denied, got $anon" >&2
            exit 1
            ;;
        esac

        docker run --rm --network host \
          -e AWS_ACCESS_KEY_ID="$access_key" \
          -e AWS_SECRET_ACCESS_KEY="$secret_key" \
          -e AWS_DEFAULT_REGION=auto \
          amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab \
          --endpoint-url "https://$host" \
          s3api head-bucket --bucket "$bucket"
        probe_key="health/build-identity-write-probe-$(openssl rand -hex 12)"
        docker run --rm --network host \
          -e AWS_ACCESS_KEY_ID="$access_key" \
          -e AWS_SECRET_ACCESS_KEY="$secret_key" \
          -e AWS_DEFAULT_REGION=auto \
          -v "$probe_file:/tmp/empty:ro" \
          amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab \
          --endpoint-url "https://$host" \
          s3api put-object --bucket "$bucket" --key "$probe_key" --body /tmp/empty >/dev/null
        docker run --rm --network host \
          -e AWS_ACCESS_KEY_ID="$access_key" \
          -e AWS_SECRET_ACCESS_KEY="$secret_key" \
          -e AWS_DEFAULT_REGION=auto \
          amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab \
          --endpoint-url "https://$host" \
          s3api head-object --bucket "$bucket" --key "$probe_key" >/dev/null
        docker run --rm --network host \
          -e AWS_ACCESS_KEY_ID="$access_key" \
          -e AWS_SECRET_ACCESS_KEY="$secret_key" \
          -e AWS_DEFAULT_REGION=auto \
          amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab \
          --endpoint-url "https://$host" \
          s3api delete-object --bucket "$bucket" --key "$probe_key" >/dev/null

        docker run --rm --network host \
          -e AWS_ACCESS_KEY_ID="$remote_access_key" \
          -e AWS_SECRET_ACCESS_KEY="$remote_secret_key" \
          -e AWS_DEFAULT_REGION=auto \
          amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab \
          --endpoint-url "https://$host" \
          s3api head-bucket --bucket "$bucket" >/dev/null
        remote_probe_key="health/remote-build-identity-write-probe-$(openssl rand -hex 12)"
        if docker run --rm --network host \
          -e AWS_ACCESS_KEY_ID="$remote_access_key" \
          -e AWS_SECRET_ACCESS_KEY="$remote_secret_key" \
          -e AWS_DEFAULT_REGION=auto \
          -v "$probe_file:/tmp/empty:ro" \
          amazon/aws-cli:2.27.50@sha256:48c3d4212e2f5b0e24bdc6af7708f9412ce65425a79575e0f78b8f8c0dcd70ab \
          --endpoint-url "https://$host" \
          s3api put-object --bucket "$bucket" --key "$remote_probe_key" --body /tmp/empty >/dev/null 2>&1; then
          echo "Remote compiler identity must not write Main's bucket" >&2
          exit 1
        fi
        echo "sccache.dev.nokey.sh Main read/write and Remote read-only S3 checks passed"
        REMOTE

version: '3'

# host-services infrastructure operations.
tasks:
  services:ensure-edge-firewall:
    desc: Ensure host nftables accepts Traefik HTTPS on the public edge.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        # Host-network Traefik needs INPUT accepts for HTTPS. Drop legacy Redis
        # :6380 accepts after the SeaweedFS cutover.
        while true; do
          handle="$(sudo -n nft --handle list chain inet bynull_filter input |
            awk '/tcp dport \{ 22, 443, 6380 \}/ {
              for (i = 1; i <= NF; i++) if ($i == "handle") { print $(i + 1); exit }
            }')"
          if [ -z "$handle" ]; then
            break
          fi
          sudo -n nft delete rule inet bynull_filter input handle "$handle"
        done
        if ! sudo -n nft list chain inet bynull_filter input |
          grep -Fq 'tcp dport { 22, 443 }'; then
          sudo -n nft add rule inet bynull_filter input \
            tcp dport '{ 22, 443 }' accept
        fi
        cfg="$(mktemp)"
        sudo -n cat /etc/nftables.conf > "$cfg"
        if ! grep -Fq 'tcp dport { 22, 443 } accept' "$cfg"; then
          if ! grep -Fq 'iifname "lo" accept' "$cfg"; then
            echo "nftables.conf missing lo accept anchor" >&2
            exit 1
          fi
          awk '
            { print }
            $0 ~ /iifname "lo" accept/ && !done {
              print "    tcp dport { 22, 443 } accept"
              done = 1
            }
          ' "$cfg" > "$cfg.next"
          sudo -n install -m 0644 "$cfg.next" /etc/nftables.conf
          rm -f "$cfg.next"
        fi
        # Strip stale 6380 accepts from the persisted config.
        if grep -Fq 'tcp dport { 22, 443, 6380 } accept' "$cfg" 2>/dev/null ||
          grep -Fq 'tcp dport { 22, 443, 6380 } accept' /etc/nftables.conf
        then
          sudo -n sed -i \
            's/tcp dport { 22, 443, 6380 } accept/tcp dport { 22, 443 } accept/g' \
            /etc/nftables.conf
        fi
        rm -f "$cfg"
        sudo -n nft --check --file /etc/nftables.conf
        sudo -n nft list chain inet bynull_filter input |
          grep -Fq 'tcp dport { 22, 443 }'
        REMOTE

  services:repair-network:
    desc: Recreate only the Nook Compose network after an external firewall reload.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        compose_file="$remote_dir/compose.yaml"
        test -s "$compose_file"
        docker compose --file "$compose_file" config --quiet
        case "$(docker version --format '{{"{{.Server.Version}}"}}')" in
          26.*) ;;
          *)
            echo "Refusing chain recovery for an unverified Docker version" >&2
            exit 1
            ;;
        esac
        if ! sudo -n iptables --table nat --list DOCKER >/dev/null 2>&1; then
          sudo -n iptables --table nat --new-chain DOCKER
        fi
        for chain in \
          DOCKER \
          DOCKER-ISOLATION-STAGE-1 \
          DOCKER-ISOLATION-STAGE-2; do
          if ! sudo -n iptables --table filter --list "$chain" \
            >/dev/null 2>&1; then
            sudo -n iptables --table filter --new-chain "$chain"
          fi
        done
        for chain in \
          DOCKER-ISOLATION-STAGE-1 \
          DOCKER-ISOLATION-STAGE-2; do
          if ! sudo -n iptables --table filter \
            --check "$chain" --jump RETURN 2>/dev/null; then
            sudo -n iptables --table filter \
              --append "$chain" --jump RETURN
          fi
        done
        sudo -n iptables --table nat --list DOCKER >/dev/null
        sudo -n iptables --table filter --list DOCKER >/dev/null
        sudo -n iptables --table filter \
          --list DOCKER-ISOLATION-STAGE-1 >/dev/null
        sudo -n iptables --table filter \
          --list DOCKER-ISOLATION-STAGE-2 >/dev/null
        docker compose --file "$compose_file" down --remove-orphans
        docker compose --file "$compose_file" up --detach --wait
        docker compose --file "$compose_file" ps
        code="$(curl -sS -o /dev/null -w '%{http_code}' https://registry.dev.nokey.sh/v2/ || true)"
        test "$code" = 200
        REMOTE

  services:diagnose:
    desc: Show bounded Docker and Nook Compose network diagnostics.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -u
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        sudo -n systemctl status docker --no-pager --full || true
        sudo -n systemctl cat docker || true
        docker info --format '{{"{{json .}}"}}' |
          jq '{ServerVersion, Driver, FirewallBackend, DockerRootDir}' || true
        docker compose --file "$remote_dir/compose.yaml" ps --all || true
        sudo -n iptables --version || true
        sudo -n nft --handle list chain inet bynull_filter forward || true
        sudo -n iptables --table filter --verbose --numeric --list FORWARD || true
        sudo -n iptables-save |
          grep -E '(^\\*|^:DOCKER|DOCKER)' || true
        sudo -n nft list tables || true
        REMOTE

  deploy:
    desc: Deploy Nook services and the complete k0s/Kata/Neo4j/Hive platform.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail

        repo_root="$(git rev-parse --show-toplevel)"
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        compose_file="$repo_root/infra/compose.yaml"
        traefik_file="$repo_root/infra/traefik-dynamic.yaml"
        remote_next="$remote_dir/compose.yaml.next"
        remote_compose="$remote_dir/compose.yaml"
        remote_traefik_next="$remote_dir/traefik-dynamic.yaml.next"
        remote_traefik="$remote_dir/traefik-dynamic.yaml"
        remote_secrets="$remote_dir/secrets"

        case "$remote_dir" in
          /home/*/.local/share/nook-infra) ;;
          *)
            echo "infra deploy: refusing unexpected remote directory: $remote_dir" >&2
            exit 2
            ;;
        esac

        # Local compose validation needs the bind-mounted S3 config path to exist;
        # the authoritative credentials are generated on Borg by sccache:credential:ensure.
        local_s3_config="$repo_root/infra/secrets/seaweedfs-s3.json"
        install -d -m 0700 "$repo_root/infra/secrets"
        if test ! -s "$local_s3_config"; then
          umask 077
          printf '%s\n' '{"identities":[]}' > "$local_s3_config"
          chmod 0600 "$local_s3_config"
        fi
        docker compose -f "$compose_file" config --quiet
        ssh -n -o BatchMode=yes "$ssh_target" \
          "set -eu; \
           install -d -m 0750 '$remote_dir'; \
           install -d -m 0700 '$remote_secrets'; \
           sudo -n install -d -m 0750 -o 1000 -g 1000 /var/lib/nook/seaweedfs"
        BASH
      - task: sccache:credential:ensure
      - |
        bash <<'BASH'
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel)"
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        compose_file="$repo_root/infra/compose.yaml"
        traefik_file="$repo_root/infra/traefik-dynamic.yaml"
        remote_next="$remote_dir/compose.yaml.next"
        remote_compose="$remote_dir/compose.yaml"
        remote_traefik_next="$remote_dir/traefik-dynamic.yaml.next"
        remote_traefik="$remote_dir/traefik-dynamic.yaml"

        scp -q -o BatchMode=yes "$compose_file" "$ssh_target:$remote_next"
        scp -q -o BatchMode=yes "$traefik_file" "$ssh_target:$remote_traefik_next"

        ssh -n -o BatchMode=yes "$ssh_target" \
          "set -eu; \
           docker compose -f '$remote_next' config --quiet; \
           mv '$remote_traefik_next' '$remote_traefik'; \
           mv '$remote_next' '$remote_compose'; \
           docker compose -f '$remote_compose' pull; \
           docker compose -f '$remote_compose' up -d --wait --force-recreate seaweedfs; \
           docker compose -f '$remote_compose' up -d --wait --remove-orphans traefik; \
           docker compose -f '$remote_compose' ps --services --filter status=running | grep -qx seaweedfs; \
           docker compose -f '$remote_compose' ps --services --filter status=running | grep -qx traefik; \
           docker compose -f '$remote_compose' ps; \
           docker volume rm nook-infra_redis-data >/dev/null 2>&1 || true; \
           rm -f '$remote_dir/secrets/redis-password'"
        BASH
      - task: services:ensure-edge-firewall
      - task: sccache:bucket:ensure
      - task: k0s:install
      - task: k0s:worker-mesh:reconcile
      - task: services:ensure-edge-firewall
      - task: registry:deploy
      - task: kata:install
      - task: kata:verify
      - task: arc:deploy
      - task: neo4j:deploy
      - task: hive:deploy

  k0s:sync:
    internal: true
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel)"
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        case "$remote_dir" in
          /home/*/.local/share/nook-infra) ;;
          *)
            echo "infra k0s sync: refusing unexpected remote directory: $remote_dir" >&2
            exit 2
            ;;
        esac
        ssh -n -o BatchMode=yes "$ssh_target" \
          "install -d -m 0750 '$remote_dir'; \
           if test -d '$remote_dir/agentic-ai/minds'; then \
             find '$remote_dir/agentic-ai/minds' \
               -type d -name target -prune -exec rm -rf -- {} +; \
           fi"
        COPYFILE_DISABLE=1 tar --no-xattrs -C "$repo_root" \
          --exclude='agentic-ai/minds/target' \
          --exclude='agentic-ai/minds/*/target' \
          -cf - \
          infra/k0s \
          agentic-ai/minds \
          nook-app/nook-platform/docker/sccache-wrapper.sh \
          nook-app/nook-platform/docker/sccache-report.sh |
          ssh -o BatchMode=yes "$ssh_target" \
            "tar -xf - -C '$remote_dir'"
        IFS= read -r -d '' formatter_sync_program <<'FORMATTER_SYNC' || true
        set -euo pipefail
        remote_dir="${1:-}"
        validated_home="${2:-/home}"
        case "$remote_dir" in "$validated_home"/*/.local/share/nook-infra) ;; *) exit 2 ;; esac
        formatter_stage="$(mktemp -d "$remote_dir/.formatter-sync.XXXXXX")"
        formatter_sync_id="${formatter_stage##*.formatter-sync.}"
        formatter_next="$remote_dir/.github/.formatting.next.$formatter_sync_id"
        formatter_previous="$remote_dir/.github/.formatting.previous.$formatter_sync_id"
        cleanup_formatter_sync() {
          rm -rf -- "$formatter_stage" "$formatter_next"
          if test -d "$formatter_previous"; then
            if test -e "$remote_dir/.github/formatting"; then
              rm -rf -- "$formatter_previous"
            else
              mv -- "$formatter_previous" "$remote_dir/.github/formatting"
            fi
          fi
        }
        trap cleanup_formatter_sync EXIT
        tar -xf - -C "$formatter_stage"
        test -d "$formatter_stage/.github/formatting"
        install -d -m 0750 "$remote_dir/.github"
        mv -- "$formatter_stage/.github/formatting" "$formatter_next"
        if test -e "$remote_dir/.github/formatting"; then
          mv -- "$remote_dir/.github/formatting" "$formatter_previous"
        fi
        mv -- "$formatter_next" "$remote_dir/.github/formatting"
        rm -rf -- "$formatter_previous"
        FORMATTER_SYNC
        formatter_sync_command="$(printf 'bash -c %q -- %q' "$formatter_sync_program" "$remote_dir")"
        COPYFILE_DISABLE=1 tar --no-xattrs -C "$repo_root" \
          -cf - .github/formatting |
          ssh -o BatchMode=yes "$ssh_target" "$formatter_sync_command"
        BASH

version: '3'

# Public authenticated Zot registry operations.
vars:
  NOOK_REGISTRY_HOST: '{{default "registry.dev.nokey.sh" .NOOK_REGISTRY_HOST}}'
  NOOK_REGISTRY_USERNAME: '{{default "nook" .NOOK_REGISTRY_USERNAME}}'
  NOOK_REGISTRY_REMOTE_USERNAME: '{{default "nook-remote" .NOOK_REGISTRY_REMOTE_USERNAME}}'
  NOOK_REGISTRY_CLUSTER_IP: '{{default "10.96.90.10" .NOOK_REGISTRY_CLUSTER_IP}}'

tasks:
  registry:credential:ensure:
    desc: Ensure the Zot htpasswd secret exists on the Borg host and in the cluster.
    deps: [k0s:sync]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        secrets_dir="$remote_dir/secrets"
        password_file="$secrets_dir/registry-password"
        username_file="$secrets_dir/registry-username"
        remote_password_file="$secrets_dir/registry-remote-password"
        remote_username_file="$secrets_dir/registry-remote-username"
        htpasswd_file="$secrets_dir/registry-htpasswd"
        username="{{.NOOK_REGISTRY_USERNAME}}"
        remote_username="{{.NOOK_REGISTRY_REMOTE_USERNAME}}"
        kubectl() { sudo -n k0s kubectl "$@"; }

        if [ "$username" = "$remote_username" ]; then
          echo "Main and Remote Zot usernames must be distinct" >&2
          exit 1
        fi

        install -d -m 0700 "$secrets_dir"
        if test ! -s "$password_file"; then
          umask 077
          openssl rand -hex 32 > "$password_file"
        fi
        if test ! -s "$remote_password_file"; then
          umask 077
          openssl rand -hex 32 > "$remote_password_file"
        fi
        chmod 0600 "$password_file"
        chmod 0600 "$remote_password_file"
        printf '%s\n' "$username" > "$username_file"
        printf '%s\n' "$remote_username" > "$remote_username_file"
        chmod 0600 "$username_file"
        chmod 0600 "$remote_username_file"
        password="$(cat "$password_file")"
        remote_password="$(cat "$remote_password_file")"
        # Zot accepts only bcrypt htpasswd hashes (`htpasswd -B`).
        docker run --rm --entrypoint htpasswd \
          httpd:2.4.63-alpine3.21@sha256:4aec2953509e2d3aa5a8d73c580a381be44803fd2481875b15d9ad7d2810d7ca \
          -nbB "$username" "$password" > "$htpasswd_file"
        docker run --rm --entrypoint htpasswd \
          httpd:2.4.63-alpine3.21@sha256:4aec2953509e2d3aa5a8d73c580a381be44803fd2481875b15d9ad7d2810d7ca \
          -nbB "$remote_username" "$remote_password" >> "$htpasswd_file"
        chmod 0600 "$htpasswd_file"
        grep -Eq "^${username}"':\$2[ay]\$' "$htpasswd_file"
        grep -Eq "^${remote_username}"':\$2[ay]\$' "$htpasswd_file"

        kubectl create namespace hive-data --dry-run=client -o yaml |
          kubectl apply -f -
        kubectl -n hive-data create secret generic nook-zot-htpasswd \
          --from-file=htpasswd="$htpasswd_file" \
          --dry-run=client -o yaml |
          kubectl apply -f -

        docker_config="$secrets_dir/registry-docker-config.json"
        auth="$(printf '%s:%s' "$username" "$password" | base64 -w0 2>/dev/null || printf '%s:%s' "$username" "$password" | base64 | tr -d '\n')"
        umask 077
        printf '%s\n' "{
          \"auths\": {
            \"{{.NOOK_REGISTRY_HOST}}\": {
              \"username\": \"$username\",
              \"password\": \"$password\",
              \"auth\": \"$auth\"
            }
          }
        }" > "$docker_config"
        chmod 0600 "$docker_config"
        install -d -m 0700 "$HOME/.docker"
        install -m 0600 "$docker_config" "$HOME/.docker/config.json"

        REMOTE
      - task: registry:containerd-auth:reconcile

  registry:containerd-auth:reconcile:
    internal: true
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        auth_file=/etc/k0s/containerd.d/registry-auth.toml
        marker=/var/lib/k0s/nook-containerd-auth-clean-invocation
        kubectl() { sudo -n k0s kubectl "$@"; }
        sudo -n systemctl is-active --quiet k0scontroller.service
        controller_node="$(kubectl get nodes \
          -l node.k0sproject.io/role=control-plane \
          -o jsonpath='{.items[0].metadata.name}')"
        test -n "$controller_node"
        auth_existed=false
        if sudo -n test -e "$auth_file"; then
          auth_existed=true
        fi
        invocation="$(sudo -n systemctl show k0scontroller.service \
          --property=InvocationID --value)"
        [[ "$invocation" =~ ^[0-9a-f]{32}$ ]]
        previous_invocation="$invocation"
        marked_invocation="$(sudo -n cat "$marker" 2>/dev/null || true)"
        restart_required=false
        if test "$auth_existed" = true || test "$marked_invocation" != "$invocation"; then
          restart_required=true
          node="$(kubectl get "node/$controller_node" -o json)"
          arc_taint_count="$(printf '%s' "$node" | jq \
            '[.spec.taints[]? | select(.key == "nook.nokey.sh/arc-build")] | length')"
          quarantine_owner="$(printf '%s' "$node" | jq -r \
            '.metadata.annotations["nook.nokey.sh/containerd-auth-quarantine"] // ""')"
          case "$quarantine_owner" in
            ''|registry-controller-v1) ;;
            *)
              echo "Controller has a foreign containerd auth quarantine owner" >&2
              exit 1
              ;;
          esac
          quarantine_owned=false
          case "$arc_taint_count" in
            0)
              if test -z "$quarantine_owner"; then
                kubectl annotate "node/$controller_node" \
                  nook.nokey.sh/containerd-auth-quarantine=registry-controller-v1 \
                  >/dev/null
              fi
              kubectl taint "node/$controller_node" \
                nook.nokey.sh/arc-build=preparing:NoSchedule >/dev/null
              quarantine_owned=true
              ;;
            1)
              printf '%s' "$node" | jq -e '
                [.spec.taints[]? | select(.key == "nook.nokey.sh/arc-build")]
                == [{key: "nook.nokey.sh/arc-build", value: "preparing", effect: "NoSchedule"}]
              ' >/dev/null
              if test "$quarantine_owner" = registry-controller-v1; then
                quarantine_owned=true
              fi
              ;;
            *)
              echo "Controller has ambiguous ARC quarantine state" >&2
              exit 1
              ;;
          esac
          test "$(kubectl get "node/$controller_node" \
            -o jsonpath='{.spec.taints[?(@.key=="nook.nokey.sh/arc-build")].value}:{.spec.taints[?(@.key=="nook.nokey.sh/arc-build")].effect}')" = \
            preparing:NoSchedule
          rm -f "$remote_dir/infra/k0s/config/registry-auth.toml"
          sudo -n rm -f /etc/k0s/containerd.d/registry-auth.toml
          deadline="$(( $(date +%s) + 7200 ))"
          while :; do
            active_runners="$(kubectl get pods --namespace arc-runners \
              --field-selector "spec.nodeName=$controller_node" \
              -l actions.github.com/scale-set-name -o json | jq \
              '[.items[] | select(.status.phase == "Pending" or .status.phase == "Running")] | length')"
            if test "$active_runners" = 0; then
              break
            fi
            if test "$(date +%s)" -ge "$deadline"; then
              echo "Timed out waiting for $active_runners ARC runner(s) on $controller_node" >&2
              exit 1
            fi
            echo "Waiting for $active_runners ARC runner(s) to finish on $controller_node" >&2
            sleep 30
          done
          test "$(kubectl get "node/$controller_node" \
            -o jsonpath='{.spec.taints[?(@.key=="nook.nokey.sh/arc-build")].value}:{.spec.taints[?(@.key=="nook.nokey.sh/arc-build")].effect}')" = \
            preparing:NoSchedule
          sudo -n systemctl restart k0scontroller.service
        else
          quarantine_owned=false
          rm -f "$remote_dir/infra/k0s/config/registry-auth.toml"
          sudo -n rm -f /etc/k0s/containerd.d/registry-auth.toml
        fi
        sudo -n systemctl is-active --quiet k0scontroller.service
        for _ in $(seq 1 120); do
          if kubectl get --raw=/readyz >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        kubectl get --raw=/readyz >/dev/null
        kubectl wait "node/$controller_node" --for=condition=Ready --timeout=5m
        invocation="$(sudo -n systemctl show k0scontroller.service \
          --property=InvocationID --value)"
        [[ "$invocation" =~ ^[0-9a-f]{32}$ ]]
        if test "$restart_required" = true && test "$invocation" = "$previous_invocation"; then
          echo "k0s controller did not start a clean containerd invocation" >&2
          exit 1
        fi
        marker_next="$(mktemp)"
        trap 'rm -f "$marker_next"' EXIT
        printf '%s\n' "$invocation" > "$marker_next"
        sudo -n install -m 0600 "$marker_next" "$marker"
        sudo -n test ! -e "$auth_file"
        if test "$quarantine_owned" = true; then
          test "$(kubectl get "node/$controller_node" \
            -o jsonpath='{.metadata.annotations.nook\.nokey\.sh/containerd-auth-quarantine}')" = \
            registry-controller-v1
          kubectl taint "node/$controller_node" \
            nook.nokey.sh/arc-build:NoSchedule- >/dev/null
          kubectl annotate "node/$controller_node" \
            nook.nokey.sh/containerd-auth-quarantine- >/dev/null
          test -z "$(kubectl get "node/$controller_node" \
            -o jsonpath='{.spec.taints[?(@.key=="nook.nokey.sh/arc-build")].effect}')"
          test -z "$(kubectl get "node/$controller_node" \
            -o jsonpath='{.metadata.annotations.nook\.nokey\.sh/containerd-auth-quarantine}')"
        fi
        REMOTE

  registry:credential:sync:
    desc: Sync registry credentials to the local cache and GitHub Actions secrets.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        home_cache="${HOME}/.nook/cache"
        install -d -m 0700 "$home_cache"
        umask 077
        host="{{.NOOK_REGISTRY_HOST}}"
        username="$(
          ssh -n -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
            "cat '{{.INFRA_REMOTE_DIR}}/secrets/registry-username'"
        )"
        password="$(
          ssh -n -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
            "cat '{{.INFRA_REMOTE_DIR}}/secrets/registry-password'"
        )"
        remote_username="$(
          ssh -n -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
            "cat '{{.INFRA_REMOTE_DIR}}/secrets/registry-remote-username'"
        )"
        remote_password="$(
          ssh -n -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
            "cat '{{.INFRA_REMOTE_DIR}}/secrets/registry-remote-password'"
        )"
        test -n "$username"
        test -n "$password"
        test -n "$remote_username"
        test -n "$remote_password"
        printf '%s\n' "$host" > "$home_cache/registry-host"
        printf '%s\n' "$username" > "$home_cache/registry-username"
        printf '%s\n' "$password" > "$home_cache/registry-password"
        printf '%s\n' "$remote_username" > "$home_cache/registry-remote-username"
        printf '%s\n' "$remote_password" > "$home_cache/registry-remote-password"
        chmod 0600 \
          "$home_cache/registry-host" \
          "$home_cache/registry-username" \
          "$home_cache/registry-password" \
          "$home_cache/registry-remote-username" \
          "$home_cache/registry-remote-password"
        printf '%s\n' "$password" | docker login "$host" -u "$username" --password-stdin
        printf '%s\n' "$host" | gh secret set NOOK_REGISTRY_HOST --repo meta-secret/nook
        printf '%s\n' "$username" | gh secret set NOOK_REGISTRY_USERNAME --repo meta-secret/nook
        printf '%s\n' "$password" | gh secret set NOOK_REGISTRY_PASSWORD --repo meta-secret/nook
        printf '%s\n' "$remote_username" | gh secret set NOOK_REGISTRY_REMOTE_USERNAME --repo meta-secret/nook
        printf '%s\n' "$remote_password" | gh secret set NOOK_REGISTRY_REMOTE_PASSWORD --repo meta-secret/nook
        echo "Main and remote registry credentials synchronized to ~/.nook/cache, Docker, and GitHub Actions secrets"
        BASH

  registry:deploy:
    desc: Deploy authenticated Zot behind Traefik HTTPS with no host port-forward.
    deps: [k0s:sync, registry:credential:ensure]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        manifest="$remote_dir/infra/k0s/manifests/registry/zot.yaml"
        rendered_manifest="$(mktemp)"
        trap 'rm -f "$rendered_manifest"' EXIT
        unit=nook-zot-registry-loopback.service
        kubectl() { sudo -n k0s kubectl "$@"; }

        username="$(cat "$remote_dir/secrets/registry-username")"
        remote_username="$(cat "$remote_dir/secrets/registry-remote-username")"
        case "$username" in
          ''|*[!A-Za-z0-9._-]*) echo "Unsupported Zot Main username" >&2; exit 1 ;;
        esac
        case "$remote_username" in
          ''|*[!A-Za-z0-9._-]*) echo "Unsupported Zot Remote username" >&2; exit 1 ;;
        esac
        if [ "$username" = "$remote_username" ]; then
          echo "Main and Remote Zot usernames must be distinct" >&2
          exit 1
        fi
        sed \
          -e "s/__NOOK_REGISTRY_USERNAME__/$username/g" \
          -e "s/__NOOK_REGISTRY_REMOTE_USERNAME__/$remote_username/g" \
          "$manifest" > "$rendered_manifest"
        if grep -q '__NOOK_REGISTRY_.*USERNAME__' "$rendered_manifest"; then
          echo "Unresolved Zot authorization principal" >&2
          exit 1
        fi

        sudo -n systemctl disable --now "$unit" >/dev/null 2>&1 || true
        sudo -n rm -f "/etc/systemd/system/$unit"
        sudo -n systemctl daemon-reload || true
        sudo -n rm -rf /etc/k0s/containerd.d/certs.d/127.0.0.1:5000

        sudo -n install -d -m 0750 -o 10001 -g 10001 /var/lib/hive/zot
        sudo -n install -d -m 0755 /etc/k0s/containerd.d/certs.d/{{.NOOK_REGISTRY_HOST}}
        sudo -n install -m 0644 \
          "$remote_dir/infra/k0s/config/registry-hosts.toml" \
          /etc/k0s/containerd.d/certs.d/{{.NOOK_REGISTRY_HOST}}/hosts.toml
        test ! -e /etc/k0s/containerd.d/registry-auth.toml

        kubectl apply -f "$remote_dir/infra/k0s/manifests/namespaces.yaml"
        kubectl delete networkpolicy nook-zot-default-deny \
          --namespace hive-data \
          --ignore-not-found=true
        kubectl apply -f "$rendered_manifest"
        for namespace in hive-data hive-system; do
          kubectl -n "$namespace" create secret docker-registry nook-registry \
            --docker-server="{{.NOOK_REGISTRY_HOST}}" \
            --docker-username="$(cat "$remote_dir/secrets/registry-username")" \
            --docker-password="$(cat "$remote_dir/secrets/registry-password")" \
            --dry-run=client -o yaml |
            kubectl apply -f -
        done
        kubectl delete secret nook-registry \
          --namespace arc-runners \
          --ignore-not-found=true
        kubectl rollout restart deployment/nook-zot --namespace hive-data
        kubectl rollout status deployment/nook-zot \
          --namespace hive-data \
          --timeout=10m
        kubectl get svc nook-zot --namespace hive-data
        test "$(
          kubectl get svc nook-zot --namespace hive-data \
            -o jsonpath='{.spec.clusterIP}'
        )" = "{{.NOOK_REGISTRY_CLUSTER_IP}}"
        test "$(
          kubectl get pvc nook-zot-data --namespace hive-data \
            -o jsonpath='{.status.phase}'
        )" = Bound

        if ss --tcp --listening --numeric --no-header 'sport = :5000' 2>/dev/null |
          grep -q .; then
          echo "Host must not listen on :5000 after Zot public cutover" >&2
          ss --tcp --listening --numeric --processes 'sport = :5000' >&2 || true
          exit 1
        fi
        if pgrep -af 'kubectl.*port-forward.*nook-zot' >/dev/null 2>&1; then
          echo "kubectl port-forward for Zot must not run" >&2
          exit 1
        fi

        for _ in $(seq 1 60); do
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            http://{{.NOOK_REGISTRY_CLUSTER_IP}}:5000/v2/ || true)"
          if test "$code" = 200; then
            break
          fi
          sleep 2
        done
        code="$(curl -sS -o /dev/null -w '%{http_code}' \
          http://{{.NOOK_REGISTRY_CLUSTER_IP}}:5000/v2/ || true)"
        test "$code" = 200
        REMOTE

  registry:check:
    desc: Verify Zot mirror reads, cache authorization, and public HTTPS edge.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        unit=nook-zot-registry-loopback.service
        host="{{.NOOK_REGISTRY_HOST}}"
        username="$(cat "$remote_dir/secrets/registry-username")"
        password="$(cat "$remote_dir/secrets/registry-password")"
        remote_username="$(cat "$remote_dir/secrets/registry-remote-username")"
        remote_password="$(cat "$remote_dir/secrets/registry-remote-password")"

        if systemctl list-unit-files "$unit" 2>/dev/null | grep -q "$unit"; then
          if systemctl is-enabled --quiet "$unit" 2>/dev/null ||
            systemctl is-active --quiet "$unit" 2>/dev/null; then
            echo "Legacy loopback registry unit must be removed" >&2
            exit 1
          fi
        fi
        if ss --tcp --listening --numeric --no-header 'sport = :5000' 2>/dev/null |
          grep -q .; then
          echo "Host must not listen on :5000" >&2
          exit 1
        fi
        if pgrep -af 'kubectl.*port-forward.*nook-zot' >/dev/null 2>&1; then
          echo "kubectl port-forward for Zot must not run" >&2
          exit 1
        fi

        sudo -n k0s kubectl rollout status deployment/nook-zot \
          --namespace hive-data \
          --timeout=2m
        test "$(
          sudo -n k0s kubectl get pvc nook-zot-data \
            --namespace hive-data \
            -o jsonpath='{.status.phase}'
        )" = Bound
        test "$(
          sudo -n k0s kubectl get svc nook-zot \
            --namespace hive-data \
            -o jsonpath='{.spec.clusterIP}'
        )" = "{{.NOOK_REGISTRY_CLUSTER_IP}}"

        cluster_code="$(curl -sS -o /dev/null -w '%{http_code}' \
          http://{{.NOOK_REGISTRY_CLUSTER_IP}}:5000/v2/)"
        test "$cluster_code" = 200
        auth_code="$(curl -sS -o /dev/null -w '%{http_code}' \
          -u "$username:$password" \
          http://{{.NOOK_REGISTRY_CLUSTER_IP}}:5000/v2/)"
        test "$auth_code" = 200

        public_code="$(curl -sS -o /dev/null -w '%{http_code}' \
          "https://$host/v2/")"
        test "$public_code" = 200
        anonymous_private_read="$(curl -sS -o /dev/null -w '%{http_code}' \
          "https://$host/v2/nook/buildcache/nook-authz-probe/manifests/missing")"
        test "$anonymous_private_read" = 401
        anonymous_hive_read="$(curl -sS -o /dev/null -w '%{http_code}' \
          "https://$host/v2/nook-hive/manifests/missing")"
        test "$anonymous_hive_read" = 401
        anonymous_mirror_write="$(curl -sS -o /dev/null -w '%{http_code}' \
          -X POST \
          "https://$host/v2/library/nook-authz-probe/blobs/uploads/")"
        test "$anonymous_mirror_write" = 401
        public_auth="$(curl -sS -o /dev/null -w '%{http_code}' \
          -u "$username:$password" \
          "https://$host/v2/")"
        test "$public_auth" = 200

        remote_auth="$(curl -sS -o /dev/null -w '%{http_code}' \
          -u "$remote_username:$remote_password" \
          "https://$host/v2/")"
        test "$remote_auth" = 200
        remote_mirror_read="$(curl -sS -o /dev/null -w '%{http_code}' \
          -u "$remote_username:$remote_password" \
          -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
          "https://$host/v2/moby/buildkit/manifests/buildx-stable-1")"
        test "$remote_mirror_read" = 200
        remote_main_write="$(curl -sS -o /dev/null -w '%{http_code}' \
          -u "$remote_username:$remote_password" \
          -X POST \
          "https://$host/v2/nook/buildcache/nook-authz-probe/blobs/uploads/")"
        test "$remote_main_write" = 403

        headers="$(mktemp)"
        body="$(mktemp)"
        cleanup() { rm -f "$headers" "$body"; }
        trap cleanup EXIT
        remote_branch_write="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
          -u "$remote_username:$remote_password" \
          -X POST \
          "https://$host/v2/nook/remote-buildcache/nook-authz-probe/blobs/uploads/")"
        test "$remote_branch_write" = 202
        location="$(awk 'tolower($1) == "location:" { $1=""; sub(/^ /, ""); sub(/\r$/, ""); print; exit }' "$headers")"
        test -n "$location"
        case "$location" in
          "https://$host/"*) upload_url="$location" ;;
          /*) upload_url="https://$host$location" ;;
          *) echo "Unexpected Zot upload location: $location" >&2; exit 1 ;;
        esac
        cleanup_code="$(curl -sS -o /dev/null -w '%{http_code}' \
          -u "$username:$password" -X DELETE "$upload_url")"
        test "$cleanup_code" = 204
        REMOTE

  registry:diagnose:
    desc: Show bounded Zot workload, Service, Traefik, and recent log state.
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -u
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        sudo -n systemctl status nook-zot-registry-loopback.service \
          --no-pager \
          --full || true
        sudo -n ss --tcp --listening --numeric --processes \
          'sport = :5000' || true
        sudo -n ss --tcp --listening --numeric --processes \
          'sport = :443' || true
        docker compose -f "$remote_dir/compose.yaml" ps || true
        sudo -n k0s kubectl get deployment,pod,svc,pv,pvc \
          --namespace hive-data \
          -l app.kubernetes.io/name=nook-zot \
          -o wide || true
        sudo -n k0s kubectl logs deployment/nook-zot \
          --namespace hive-data \
          --tail=100 || true
        curl -sS -D- -o /dev/null "https://{{.NOOK_REGISTRY_HOST}}/v2/" || true
        REMOTE

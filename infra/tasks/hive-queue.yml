version: '3'

# hive operator queue and control-center inspection.
tasks:
  hive:queue:status:
    desc: Show bounded durable Hive task and latest-attempt state.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        sudo -n k0s kubectl exec deployment/hive-workbench-dispatcher \
          --namespace hive-system \
          --container dispatcher \
          -- /usr/local/bin/hive queue status
        REMOTE

  hive:dashboard:
    desc: Open the read-only Hive Control Center through an SSH tunnel.
    silent: true
    cmds:
      - |
        local_port="{{default "18080" .HIVE_DASHBOARD_PORT}}"
        case "$local_port" in
          *[!0-9]*|'')
            echo "HIVE_DASHBOARD_PORT must be numeric" >&2
            exit 1
            ;;
        esac
        url="http://127.0.0.1:$local_port"
        if command -v open >/dev/null 2>&1; then
          (sleep 2; open "$url") &
        fi
        echo "Hive Control Center: $url"
        exec ssh \
          -o BatchMode=yes \
          -L "$local_port:127.0.0.1:$local_port" \
          "{{.INFRA_SSH_TARGET}}" \
          "sudo -n k0s kubectl port-forward --namespace hive-system --address 127.0.0.1 service/hive-observer $local_port:8080"

  hive:queue:cancel:
    desc: Cancel one Hive task and exclusive descendants that no other live root still needs.
    silent: true
    cmds:
      - |
        task_id="{{.HIVE_TASK_ID}}"
        reason="{{.HIVE_CANCEL_REASON}}"
        if test -z "$task_id" || test "$task_id" = "<no value>"; then
          echo "HIVE_TASK_ID is required" >&2
          exit 1
        fi
        if test -z "$reason" || test "$reason" = "<no value>"; then
          echo "HIVE_CANCEL_REASON is required" >&2
          exit 1
        fi
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' -- "$task_id" "$reason" <<'REMOTE'
        set -euo pipefail
        task_id="$1"
        reason="$2"
        sudo -n k0s kubectl exec deployment/hive-workbench-dispatcher \
          --namespace hive-system \
          --container dispatcher \
          -- /usr/local/bin/hive queue cancel \
            --task-id "$task_id" \
            --reason "$reason"
        REMOTE

  hive:queue:retry:
    desc: Rearm one failed Main-repair chain once per deployed Hive release.
    silent: true
    cmds:
      - |
        task_id="{{.HIVE_TASK_ID}}"
        if test -z "$task_id" || test "$task_id" = "<no value>"; then
          echo "HIVE_TASK_ID is required" >&2
          exit 1
        fi
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' -- "$task_id" <<'REMOTE'
        set -euo pipefail
        task_id="$1"
        image="$(
          sudo -n k0s kubectl get deployment hive \
            --namespace hive-system \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="hive")].image}'
        )"
        release_id="${image##*@}"
        case "$release_id" in
          sha256:????????????????????????????????????????????????????????????????) ;;
          *)
            echo "Hive deployment is not pinned to a sha256 release" >&2
            exit 1
            ;;
        esac
        sudo -n k0s kubectl exec deployment/hive-workbench-dispatcher \
          --namespace hive-system \
          --container dispatcher \
          -- /usr/local/bin/hive queue retry-failed-main \
            --task-id "$task_id" \
            --release-id "$release_id"
        REMOTE

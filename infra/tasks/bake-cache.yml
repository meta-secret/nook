        bake_plain "$proof_log" leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"
        require_registry_ref "nook/remote-buildcache/nook-bake-sim-leaf-v1${wasm_pr_suffix}"

        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_LEAF_EXACT_AVAILABLE=1
        create_builder "nook-bake-sim-r-retry-${suffix}"
        bake_plain "$proof_log" leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"

        BAKE_SIM_CACHE_WRITE_ENABLED=1
        BAKE_SIM_NESTED_LEAF_EXACT_AVAILABLE=
        create_builder "nook-bake-sim-r-internal-producer-${suffix}"
        bake_plain "$proof_log" combined-leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"
        require_registry_ref "nook/remote-buildcache/nook-bake-sim-nested-leaf-v1${wasm_pr_suffix}"

        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_NESTED_LEAF_EXACT_AVAILABLE=1
        create_builder "nook-bake-sim-r-internal-retry-${suffix}"
        bake_plain "$proof_log" combined-leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario R ok"

        echo "== Scenario S: Kani-style full graph falls back once then replays exact =="
        # Kani cannot use ordinary rustc sccache. Its production target therefore
        # depends on this full-graph BuildKit behavior for both toolchain and proof.
        printf 'kani-proof-source\n' >"$leaf_input"
        kani_pr_suffix="-git-eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
        BAKE_SIM_CACHE_WRITE_ENABLED=1
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$kani_pr_suffix"
        BAKE_SIM_NESTED_LEAF_EXACT_AVAILABLE=
        create_builder "nook-bake-sim-s-producer-${suffix}"

        require_cached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_cached_step "$proof_log" "bake-sim-crate-a-expensive"
        require_cached_step "$proof_log" "bake-sim-crate-b-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario X ok"

        echo "== Scenario Y: concurrent Hive ARC jobs replay isolated Zot graphs =="
        # Main publishes the source-free Cargo lineage plus both dependency
        # branches. A changed PR source must restore cargo fetch and both
        # branches, publish only its exact-head graph, and replay every stage on
        # a distinct fresh builder.
        printf '%s\n' "$parent_input_orig" >"$parent_input"

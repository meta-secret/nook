        require_registry_ref "nook/remote-buildcache/nook-bake-sim-hive-v2${hive_pr_a_suffix}"

        # A concurrent PR gets only its own absent exact ref plus trusted Main.
        # PR A's source graph remains present but cannot satisfy PR B.
        printf '%s\n' "$hive_pr_b_source" >"$leaf_input"

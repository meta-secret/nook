        require_uncached_step "$proof_log" "bake-sim-parent-expensive"
        require_uncached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"
        require_uncached_step "$proof_log" "bake-sim-consumer-expensive"
        require_registry_ref "nook/buildcache/nook-bake-sim-consumer-v1"

        printf 'node-pr-source-edit\n' >"$leaf_input"
        node_pr_suffix="-git-8888888888888888888888888888888888888888"
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$node_pr_suffix"
        create_builder "nook-bake-sim-w-producer-${suffix}"
        bake_plain "$proof_log" combined-consumer
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"
        require_uncached_step "$proof_log" "bake-sim-consumer-expensive"
        require_registry_ref "nook/remote-buildcache/nook-bake-sim-consumer-v1${node_pr_suffix}"
        require_no_registry_ref "nook/remote-buildcache/nook-bake-sim-nested-leaf-v1${node_pr_suffix}"

        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CONSUMER_EXACT_AVAILABLE=1
        create_builder "nook-bake-sim-w-retry-${suffix}"
        bake_plain "$proof_log" combined-consumer
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        require_cached_step "$proof_log" "bake-sim-consumer-expensive"
        echo "scenario W ok"

        echo "== Scenario X: later crate edit keeps earlier crate CACHED =="
        # Model native/WASM per-crate COPY+RUN. Main seeds the full one-Dockerfile
        # leaf. A PR that edits only crate-b must restore crate-a from Main, compile
        # crate-b and the leaf, then replay the exact graph on a fresh builder.
        printf '%s\n' "$parent_input_orig" >"$parent_input"
        printf '%s\n' "$loom_input_orig" >"$loom_input"
        printf '%s\n' "$crate_a_input_orig" >"$crate_a_input"
        printf '%s\n' "$crate_b_input_orig" >"$crate_b_input"
        printf '%s\n' "$leaf_input_orig" >"$leaf_input"

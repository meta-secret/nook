        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_cached_step "$proof_log" "bake-sim-crate-a-expensive"
        require_cached_step "$proof_log" "bake-sim-crate-b-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        require_registry_ref "nook/buildcache/nook-bake-sim-nested-leaf-v1"

        printf 'crate-b-pr-source-edit\n' >"$crate_b_input"
        crate_pr_suffix="-git-7777777777777777777777777777777777777777"
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$crate_pr_suffix"
        create_builder "nook-bake-sim-x-producer-${suffix}"
        bake_plain "$proof_log" combined-leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_cached_step "$proof_log" "bake-sim-crate-a-expensive"
        require_uncached_step "$proof_log" "bake-sim-crate-b-expensive"
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"

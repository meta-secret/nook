        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_NESTED_LEAF_EXACT_AVAILABLE=1
        create_builder "nook-bake-sim-q-retry-${suffix}"
        bake_plain "$proof_log" combined-leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario Q ok"

        echo "== Scenario R: exact-only replay works across linked and internal parents =="
        # Scenario Q proved that merging exact and Main can orphan the exact
        # leaf. Prove the exact-only selection independently for both a
        # Bake-linked parent and the production internal-stage architecture.
        printf '%s\n' "$parent_input_orig" >"$parent_input"
        printf 'wasm-linked-leaf-source\n' >"$leaf_input"
        wasm_pr_suffix="-git-ffffffffffffffffffffffffffffffffffffffff"
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=1
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1

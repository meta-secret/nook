        printf '%s\n' "$crate_a_input_orig" >"$crate_a_input"
        printf '%s\n' "$crate_b_input_orig" >"$crate_b_input"
        printf '%s\n' "$leaf_input_orig" >"$leaf_input"
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=1
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX=
        BAKE_SIM_HIVE_EXACT_AVAILABLE=
        create_builder "nook-bake-sim-y-main-${suffix}"
        bake_plain "$proof_log" hive
        require_uncached_step "$proof_log" "bake-sim-hive-cargo-fetch"
        require_uncached_step "$proof_log" "bake-sim-hive-test-dependencies"
        require_uncached_step "$proof_log" "bake-sim-hive-clippy-dependencies"
        require_registry_ref "nook/buildcache/nook-bake-sim-hive-v2"

        hive_pr_a_source="hive-pr-a-source-edit"
        hive_pr_a_suffix="-git-6666666666666666666666666666666666666666"
        hive_pr_b_source="hive-pr-b-source-edit"
        hive_pr_b_suffix="-git-5555555555555555555555555555555555555555"

        printf '%s\n' "$hive_pr_a_source" >"$leaf_input"

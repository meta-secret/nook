        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"
        require_registry_ref "nook/remote-buildcache/nook-bake-sim-nested-leaf-v1${kani_pr_suffix}"

        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_NESTED_LEAF_EXACT_AVAILABLE=1
        create_builder "nook-bake-sim-s-retry-${suffix}"
        bake_plain "$proof_log" combined-leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario S ok"

        echo "== Scenario V: Main cfg-specific deps feed a changed PR source leaf =="
        # Model Loom's extra cfg(loom) release dependency graph as an explicit
        # source-free stage. A new PR source must restore that entire stage from
        # trusted Main, compile only its source leaf, and then replay the exact
        # leaf without executing either expensive step.
        printf '%s\n' "$parent_input_orig" >"$parent_input"
        printf '%s\n' "$loom_input_orig" >"$loom_input"
        printf 'loom-pr-source-edit\n' >"$leaf_input"
        loom_pr_suffix="-git-9999999999999999999999999999999999999999"
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=1
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$loom_pr_suffix"
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=
        BAKE_SIM_BASE_OWN_CACHE_ENABLED=
        BAKE_SIM_NESTED_LEAF_EXACT_AVAILABLE=
        create_builder "nook-bake-sim-v-producer-${suffix}"
        bake_plain "$proof_log" combined-leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"
        require_registry_ref "nook/remote-buildcache/nook-bake-sim-nested-leaf-v1${loom_pr_suffix}"

        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_NESTED_LEAF_EXACT_AVAILABLE=1
        create_builder "nook-bake-sim-v-retry-${suffix}"
        bake_plain "$proof_log" combined-leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario V ok"

        echo "== Scenario W: independent Node consumer owns and replays its exact leaf =="
        # Main owns the stable consumer scope. A changed PR source publishes a
        # separate exact consumer graph; it must not overwrite the parallel
        # source-leaf scope, and a fresh retry must execute no expensive stage.
        printf '%s\n' "$parent_input_orig" >"$parent_input"
        printf '%s\n' "$loom_input_orig" >"$loom_input"
        printf '%s\n' "$leaf_input_orig" >"$leaf_input"
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=1
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX=
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=

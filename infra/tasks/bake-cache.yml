version: '3'

# Runtime plain BuildKit+Zot cache proof. The simulator uses the Hive-shaped
# Rust graph so toolchain, Cargo fetch, and test/clippy dependency vertices are
# source-free; only the final source vertices consume inputs/leaf.txt.
# The pinned alpine fixture is mirrored through Zot as library/alpine.

vars:
  BAKE_CACHE_ZOT_IMAGE: 'ghcr.io/project-zot/zot-linux-amd64@sha256:95a837a0afacf5b7edc0c92493f04beee6891989b8d2fd50a00cf65a1e6d4fd5'

tasks:
  bake-cache:prove:
    desc: Prove native BuildKit warm replay and source-only Rust dependency reuse against ephemeral Zot.
    silent: true
    cmds:
      - |
        set -euo pipefail
        export PATH=/usr/bin:/bin
        if [ -x /usr/local/bin/docker ]; then docker_cli=/usr/local/bin/docker
        elif [ -x /usr/bin/docker ]; then docker_cli=/usr/bin/docker
        elif [ -x /opt/homebrew/bin/docker ]; then docker_cli=/opt/homebrew/bin/docker
        else
          echo "trusted Docker CLI is unavailable" >&2
          exit 127
        fi
        if [ -x /usr/local/lib/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/local/lib/docker/cli-plugins/docker-buildx
        elif [ -x /usr/local/libexec/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/local/libexec/docker/cli-plugins/docker-buildx
        elif [ -x /usr/lib/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/lib/docker/cli-plugins/docker-buildx
        elif [ -x /usr/libexec/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/libexec/docker/cli-plugins/docker-buildx
        elif [ -x /opt/homebrew/lib/docker/cli-plugins/docker-buildx ]; then buildx_cli=/opt/homebrew/lib/docker/cli-plugins/docker-buildx
        elif [ -x /Applications/Docker.app/Contents/Resources/cli-plugins/docker-buildx ]; then buildx_cli=/Applications/Docker.app/Contents/Resources/cli-plugins/docker-buildx
        else
          echo "trusted Docker Buildx plugin is unavailable" >&2
          exit 127
        fi

        docker_config_source="${DOCKER_CONFIG:-${HOME:?HOME is required when DOCKER_CONFIG is unset}/.docker}"
        case "$docker_config_source" in
          /*) ;;
          *)
            echo "Docker config path must be absolute" >&2
            exit 2
            ;;
        esac
        trusted_docker_config="$(mktemp -d "${TMPDIR:-/tmp}/nook-docker-config.XXXXXX")"
        chmod 700 "$trusted_docker_config"
        mkdir -m 700 "$trusted_docker_config/cli-plugins"
        /bin/ln -s "$buildx_cli" "$trusted_docker_config/cli-plugins/docker-buildx"
        cleanup_docker_config() {
          rm -rf -- "$trusted_docker_config"
        }
        trap cleanup_docker_config EXIT
        if [ -z "${GITHUB_ACTIONS:-}" ] && [ -e "$docker_config_source/contexts" ]; then
          cp -RP -- "$docker_config_source/contexts" "$trusted_docker_config/contexts"
          if find "$trusted_docker_config/contexts" -type l -print -quit | grep -q .; then
            echo "Docker contexts must not contain symlinks" >&2
            exit 2
          fi
        fi
        if [ -f "$docker_config_source/config.json" ]; then
          if [ -n "${GITHUB_ACTIONS:-}" ]; then
            if [ -x /usr/local/bin/jq ]; then jq_cli=/usr/local/bin/jq
            elif [ -x /usr/bin/jq ]; then jq_cli=/usr/bin/jq
            elif [ -x /opt/homebrew/bin/jq ]; then jq_cli=/opt/homebrew/bin/jq
            else
              echo "trusted jq is unavailable in GitHub Actions" >&2
              exit 127
            fi
            "$jq_cli" 'if any(keys[]; explode | any(. > 127)) then error("non-ASCII Docker config key") else with_entries(select((.key | ascii_downcase) != "currentcontext" and (.key | ascii_downcase) != "clipluginsextradirs" and (.key | ascii_downcase) != "credsstore" and (.key | ascii_downcase) != "credhelpers" and (.key | ascii_downcase) != "proxies")) end' \
              "$docker_config_source/config.json" >"$trusted_docker_config/config.json"
          else
            current_context="$(DOCKER_CONFIG="$docker_config_source" "$docker_cli" context show)"
            case "$current_context" in
              ''|default) printf '{}\n' >"$trusted_docker_config/config.json" ;;
              *[!a-zA-Z0-9_.-]*)
                echo "Docker context name contains unsupported characters" >&2
                exit 2
                ;;
              *) printf '{"currentContext":"%s"}\n' "$current_context" >"$trusted_docker_config/config.json" ;;
            esac
          fi
          chmod 600 "$trusted_docker_config/config.json"
        fi
        export DOCKER_CONFIG="$trusted_docker_config"
        export BUILDX_CONFIG="$trusted_docker_config/buildx"
        unset BUILDX_BUILDER
        if [ -n "${GITHUB_ACTIONS:-}" ]; then
          unset DOCKER_HOST DOCKER_CONTEXT BUILDKIT_HOST
        fi

        repo_root="$(git rev-parse --show-toplevel)"
        sim_dir="$repo_root/infra/sim/bake-cache"
        zot_image="{{.BAKE_CACHE_ZOT_IMAGE}}"
        registry_host="registry.dev.nokey.sh"
        registry_ref="${registry_host}:5000"
        stable_repository="nook/buildcache/nook-bake-sim-rust-deps-v1"
        stable_manifest="${registry_ref}/v2/${stable_repository}/manifests/buildcache"
        suffix="$(date +%s)-$(od -An -N2 -tu2 /dev/urandom | tr -d ' ')"
        network="nook-bake-sim-${suffix}"
        zot_name="nook-bake-sim-zot-${suffix}"
        builder=""
        buildkit_cfg=""
        proof_log=""
        leaf_input="$sim_dir/inputs/leaf.txt"
        leaf_input_orig="$(cat "$leaf_input")"

        cleanup() {
          set +e
          printf '%s\n' "$leaf_input_orig" >"$leaf_input"
          if [ -n "$builder" ]; then
            "$docker_cli" buildx rm -f "$builder" >/dev/null 2>&1
          fi
          "$docker_cli" rm -f "$zot_name" >/dev/null 2>&1
          "$docker_cli" network rm "$network" >/dev/null 2>&1
          if [ -n "$buildkit_cfg" ]; then
            rm -f "$buildkit_cfg"
          fi
          if [ -n "$proof_log" ]; then
            rm -f "$proof_log"
          fi
          rm -rf -- "$trusted_docker_config"
        }
        trap cleanup EXIT

        require_cached_step() {
          local log_file="$1"
          local marker="$2"
          local step
          step="$(awk -v marker="$marker" 'index($0, marker) { print $1; exit }' "$log_file")"
          test -n "$step"
          if grep -Fxq "$step CACHED" "$log_file"; then
            return 0
          fi
          if awk -v step="$step" -v marker="$marker" '
            $1 == step && $2 ~ /^[0-9]+\.[0-9]+$/ && index($0, marker) { found = 1 }
            END { exit found ? 0 : 1 }
          ' "$log_file"; then
            echo "expected cached step for marker: $marker (step $step executed)" >&2
            return 1
          fi
          # A fresh builder may restore the vertex from a registry manifest
          # without printing CACHED; absence of an executed duration is proof
          # that the RUN body did not execute.
        }

        require_uncached_step() {
          local log_file="$1"
          local marker="$2"
          local step
          step="$(awk -v marker="$marker" 'index($0, marker) { print $1; exit }' "$log_file")"
          test -n "$step"
          if grep -Fxq "$step CACHED" "$log_file"; then
            echo "expected uncached step for marker: $marker" >&2
            return 1
          fi
          awk -v step="$step" -v marker="$marker" '
            $1 == step && $2 ~ /^[0-9]+\.[0-9]+$/ && index($0, marker) { found = 1 }
            END { exit found ? 0 : 1 }
          ' "$log_file"
        }

        require_cache_write() {
          grep -Eq 'exporting cache to registry|writing cache manifest' "$1"
        }

        create_builder() {
          local name="$1"
          if [ -n "$builder" ]; then
            "$docker_cli" buildx rm -f "$builder" >/dev/null 2>&1 || true
          fi
          builder="$name"
          "$docker_cli" buildx create \
            --name "$builder" \
            --driver docker-container \
            --driver-opt "network=${network}" \
            --config "$buildkit_cfg" \
            --use \
            --bootstrap >/dev/null
        }

        bake_plain() {
          local log_file="$1"
          set +e
          env NOOK_REGISTRY_CACHE_HOST="$registry_ref" "$docker_cli" buildx bake \
            --progress=plain \
            -f "$sim_dir/rust-deps-replay.docker-bake.hcl" \
            --set "*.context=$sim_dir" \
            rust-deps-replay >"$log_file" 2>&1
          local bake_status=$?
          set -e
          cat "$log_file"
          if [ "$bake_status" -ne 0 ] && grep -Eq 'exporting cache to registry| CACHED$|bake-sim-' "$log_file"; then
            return 0
          fi
          return "$bake_status"
        }

        registry_ref_code() {
          "$docker_cli" run --rm --network "$network" curlimages/curl:8.12.1 \
            -sS -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
            "http://${stable_manifest}"
        }

        buildkit_cfg="$(mktemp)"
        printf '%s\n' \
          "[registry.\"docker.io\"]" \
          "  mirrors = [\"${registry_ref}\"]" \
          "" \
          "[registry.\"${registry_ref}\"]" \
          "  http = true" \
          "  insecure = true" \
          >"$buildkit_cfg"

        "$docker_cli" network create "$network" >/dev/null
        "$docker_cli" run -d \
          --name "$zot_name" \
          --platform linux/amd64 \
          --network "$network" \
          --network-alias "$registry_host" \
          -v "$sim_dir/zot-config.json:/etc/zot/config.json:ro" \
          "$zot_image" >/dev/null

        ready=0
        for _ in $(seq 1 60); do
          if "$docker_cli" run --rm --network "$network" curlimages/curl:8.12.1 \
            -fsS "http://${registry_ref}/v2/" >/dev/null 2>&1; then
            ready=1
            break
          fi
          sleep 1
        done
        test "$ready" -eq 1

        proof_log="$(mktemp)"

        echo "== Cold Rust dependency graph: stable registry write =="
        create_builder "nook-bake-sim-cold-${suffix}"
        bake_plain "$proof_log"
        for marker in \
          bake-sim-hive-toolchain \
          bake-sim-hive-cargo-fetch \
          bake-sim-hive-test-dependencies \
          bake-sim-hive-clippy-dependencies \
          bake-sim-hive-test-source \
          bake-sim-hive-clippy-source; do
          require_uncached_step "$proof_log" "$marker"
        done
        require_cache_write "$proof_log"
        test "$(registry_ref_code)" = 200
        echo "rust-deps cold: cached=0 uncached=6 writes=1 ref=${stable_repository}:buildcache"

        echo "== Source-only edit: dependency vertices replay from the same stable ref =="
        printf 'rust-source-only-edit\n' >"$leaf_input"
        create_builder "nook-bake-sim-source-${suffix}"
        bake_plain "$proof_log"
        for marker in \
          bake-sim-hive-toolchain \
          bake-sim-hive-cargo-fetch \
          bake-sim-hive-test-dependencies \
          bake-sim-hive-clippy-dependencies; do
          require_cached_step "$proof_log" "$marker"
        done
        for marker in bake-sim-hive-test-source bake-sim-hive-clippy-source; do
          require_uncached_step "$proof_log" "$marker"
        done
        require_cache_write "$proof_log"
        test "$(registry_ref_code)" = 200
        echo "rust-deps source-only: cached=4 uncached=2 writes=1 ref=${stable_repository}:buildcache"

        echo "== No-op replay: complete graph is native-warm on a fresh builder =="
        create_builder "nook-bake-sim-noop-${suffix}"
        bake_plain "$proof_log"
        for marker in \
          bake-sim-hive-toolchain \
          bake-sim-hive-cargo-fetch \
          bake-sim-hive-test-dependencies \
          bake-sim-hive-clippy-dependencies \
          bake-sim-hive-test-source \
          bake-sim-hive-clippy-source; do
          require_cached_step "$proof_log" "$marker"
        done
        require_cache_write "$proof_log"
        test "$(registry_ref_code)" = 200
        echo "rust-deps no-op: cached=6 uncached=0 writes=1 ref=${stable_repository}:buildcache"

        echo "bake-cache plain BuildKit proof passed"

version: '3'

# Runtime plain BuildKit+Zot cache proof. The simulator uses the Hive-shaped
# Rust graph so toolchain, Cargo fetch, and test/clippy dependency vertices are
# source-free; only the final source vertices consume inputs/leaf.txt.
# The pinned alpine fixture is mirrored through Zot as library/alpine.

vars:
  BAKE_CACHE_ZOT_IMAGE: 'ghcr.io/project-zot/zot-linux-amd64@sha256:95a837a0afacf5b7edc0c92493f04beee6891989b8d2fd50a00cf65a1e6d4fd5'

tasks:
  bake-cache:prove:
    desc: Prove native BuildKit warm replay and source-only Rust dependency reuse against ephemeral Zot.
    silent: true
    cmds:
      - |
        set -euo pipefail
        export PATH=/usr/bin:/bin
        if [ -x /usr/local/bin/docker ]; then docker_cli=/usr/local/bin/docker
        elif [ -x /usr/bin/docker ]; then docker_cli=/usr/bin/docker
        elif [ -x /opt/homebrew/bin/docker ]; then docker_cli=/opt/homebrew/bin/docker
        else
          echo "trusted Docker CLI is unavailable" >&2
          exit 127
        fi
        if [ -x /usr/local/lib/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/local/lib/docker/cli-plugins/docker-buildx
        elif [ -x /usr/local/libexec/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/local/libexec/docker/cli-plugins/docker-buildx
        elif [ -x /usr/lib/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/lib/docker/cli-plugins/docker-buildx
        elif [ -x /usr/libexec/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/libexec/docker/cli-plugins/docker-buildx
        elif [ -x /opt/homebrew/lib/docker/cli-plugins/docker-buildx ]; then buildx_cli=/opt/homebrew/lib/docker/cli-plugins/docker-buildx
        elif [ -x /Applications/Docker.app/Contents/Resources/cli-plugins/docker-buildx ]; then buildx_cli=/Applications/Docker.app/Contents/Resources/cli-plugins/docker-buildx
        else
          echo "trusted Docker Buildx plugin is unavailable" >&2
          exit 127
        fi

        docker_config_source="${DOCKER_CONFIG:-${HOME:?HOME is required when DOCKER_CONFIG is unset}/.docker}"
        case "$docker_config_source" in
          /*) ;;
          *)
            echo "Docker config path must be absolute" >&2
            exit 2
            ;;
        esac
        trusted_docker_config="$(mktemp -d "${TMPDIR:-/tmp}/nook-docker-config.XXXXXX")"
        chmod 700 "$trusted_docker_config"
        mkdir -m 700 "$trusted_docker_config/cli-plugins"
        /bin/ln -s "$buildx_cli" "$trusted_docker_config/cli-plugins/docker-buildx"
        cleanup_docker_config() {
          rm -rf -- "$trusted_docker_config"
        }
        trap cleanup_docker_config EXIT
        if [ -z "${GITHUB_ACTIONS:-}" ] && [ -e "$docker_config_source/contexts" ]; then
          cp -RP -- "$docker_config_source/contexts" "$trusted_docker_config/contexts"
          if find "$trusted_docker_config/contexts" -type l -print -quit | grep -q .; then
            echo "Docker contexts must not contain symlinks" >&2
            exit 2
          fi
        fi
        if [ -f "$docker_config_source/config.json" ]; then
          if [ -n "${GITHUB_ACTIONS:-}" ]; then
            if [ -x /usr/local/bin/jq ]; then jq_cli=/usr/local/bin/jq
            elif [ -x /usr/bin/jq ]; then jq_cli=/usr/bin/jq
            elif [ -x /opt/homebrew/bin/jq ]; then jq_cli=/opt/homebrew/bin/jq
            else
              echo "trusted jq is unavailable in GitHub Actions" >&2
              exit 127
            fi
            "$jq_cli" 'if any(keys[]; explode | any(. > 127)) then error("non-ASCII Docker config key") else with_entries(select((.key | ascii_downcase) != "currentcontext" and (.key | ascii_downcase) != "clipluginsextradirs" and (.key | ascii_downcase) != "credsstore" and (.key | ascii_downcase) != "credhelpers" and (.key | ascii_downcase) != "proxies")) end' \
              "$docker_config_source/config.json" >"$trusted_docker_config/config.json"
          else
            current_context="$(DOCKER_CONFIG="$docker_config_source" "$docker_cli" context show)"
            case "$current_context" in
              ''|default) printf '{}\n' >"$trusted_docker_config/config.json" ;;
              *[!a-zA-Z0-9_.-]*)
                echo "Docker context name contains unsupported characters" >&2
                exit 2
                ;;
              *) printf '{"currentContext":"%s"}\n' "$current_context" >"$trusted_docker_config/config.json" ;;
            esac
          fi
          chmod 600 "$trusted_docker_config/config.json"
        fi
        export DOCKER_CONFIG="$trusted_docker_config"
        export BUILDX_CONFIG="$trusted_docker_config/buildx"
        unset BUILDX_BUILDER
        if [ -n "${GITHUB_ACTIONS:-}" ]; then
          unset DOCKER_HOST DOCKER_CONTEXT BUILDKIT_HOST
        fi

        repo_root="$(git rev-parse --show-toplevel)"
        echo 'Sccache best-effort proof: inject startup, DNS/read, circuit, compiler, and publication faults'
        bash "$repo_root/infra/contracts/sccache-wrapper-fallback.test.sh"
        bash "$repo_root/infra/contracts/sccache-publication.test.sh"
        echo 'Sccache best-effort proof: complete'
        echo 'Compile registry probe proof: transient timeout continues cold; auth failure remains terminal'
        bash "$repo_root/infra/contracts/compile-cache-probe-classification.test.sh"
        sim_dir="$repo_root/infra/sim/bake-cache"
        zot_image="{{.BAKE_CACHE_ZOT_IMAGE}}"
        registry_host="registry.dev.nokey.sh"
        registry_ref="${registry_host}:5000"
        stable_repository="nook/buildcache/nook-bake-sim-rust-deps-v1"
        stable_manifest="${registry_ref}/v2/${stable_repository}/manifests/buildcache"
        compile_deps_repository="nook/remote-buildcache/nook-bake-sim-compile-deps-v3"
        compile_deps_manifest="${registry_ref}/v2/${compile_deps_repository}/manifests/fingerprint-lock-and-recipe-inputs"
        compile_source_repository="nook/remote-buildcache/nook-bake-sim-compile-v3"
        legacy_compile_source_repository="nook/remote-buildcache/nook-bake-sim-compile-v2"
        compile_source_a="git-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        compile_source_b="git-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        compile_source_c="git-cccccccccccccccccccccccccccccccccccccccc"
        compile_source_d="git-dddddddddddddddddddddddddddddddddddddddd"
        compile_source_e="git-eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
        suffix="$(date +%s)-$(od -An -N2 -tu2 /dev/urandom | tr -d ' ')"
        network="nook-bake-sim-${suffix}"
        zot_name="nook-bake-sim-zot-${suffix}"
        builder=""
        buildkit_cfg=""
        proof_log=""
        leaf_input="$sim_dir/inputs/leaf.txt"
        leaf_input_orig="$(cat "$leaf_input")"
        compile_nook_input="$sim_dir/inputs/compile-nook-wasm.txt"
        compile_nook_input_orig="$(cat "$compile_nook_input")"
        compile_hive_input="$sim_dir/inputs/compile-hive-source.txt"
        compile_hive_input_orig="$(cat "$compile_hive_input")"
        compile_web_input="$sim_dir/inputs/compile-web-source.txt"
        compile_web_input_orig="$(cat "$compile_web_input")"
        compile_web_legal_input="$sim_dir/inputs/compile-web-legal.txt"
        compile_web_legal_input_orig="$(cat "$compile_web_legal_input")"
        compile_policy_input="$sim_dir/inputs/compile-policy-catalog.txt"
        compile_policy_input_orig="$(cat "$compile_policy_input")"
        sccache_publish_mode="$(mktemp)"
        sccache_consumer_mode="$(mktemp)"
        printf '%s\n' READ_WRITE >"$sccache_publish_mode"
        printf '%s\n' READ_ONLY >"$sccache_consumer_mode"

        cleanup() {
          set +e
          printf '%s\n' "$leaf_input_orig" >"$leaf_input"
          printf '%s\n' "$compile_nook_input_orig" >"$compile_nook_input"
          printf '%s\n' "$compile_hive_input_orig" >"$compile_hive_input"
          printf '%s\n' "$compile_web_input_orig" >"$compile_web_input"
          printf '%s\n' "$compile_web_legal_input_orig" >"$compile_web_legal_input"
          printf '%s\n' "$compile_policy_input_orig" >"$compile_policy_input"
          if [ -n "$builder" ]; then
            "$docker_cli" buildx rm -f "$builder" >/dev/null 2>&1
          fi
          "$docker_cli" rm -f "$zot_name" >/dev/null 2>&1
          "$docker_cli" network rm "$network" >/dev/null 2>&1
          if [ -n "$buildkit_cfg" ]; then
            rm -f "$buildkit_cfg"
          fi
          if [ -n "$proof_log" ]; then
            rm -f "$proof_log"
          fi
          rm -f "$sccache_publish_mode" "$sccache_consumer_mode"
          rm -rf -- "$trusted_docker_config"
        }
        trap cleanup EXIT

        require_cached_step() {
          local log_file="$1"
          local marker="$2"
          local step
          step="$(awk -v marker="$marker" 'index($0, marker) { print $1; exit }' "$log_file")"
          test -n "$step"
          if grep -Fxq "$step CACHED" "$log_file"; then
            return 0
          fi
          if awk -v step="$step" -v marker="$marker" '
            $1 == step && $2 ~ /^[0-9]+\.[0-9]+$/ && index($0, marker) { found = 1 }
            END { exit found ? 0 : 1 }
          ' "$log_file"; then
            echo "expected cached step for marker: $marker (step $step executed)" >&2
            return 1
          fi
          # A fresh builder may restore the vertex from a registry manifest
          # without printing CACHED; absence of an executed duration is proof
          # that the RUN body did not execute.
        }

        require_uncached_step() {
          local log_file="$1"
          local marker="$2"
          local step
          step="$(awk -v marker="$marker" 'index($0, marker) { print $1; exit }' "$log_file")"
          test -n "$step"
          if grep -Fxq "$step CACHED" "$log_file"; then
            echo "expected uncached step for marker: $marker" >&2
            return 1
          fi
          awk -v step="$step" -v marker="$marker" '
            $1 == step && $2 ~ /^[0-9]+\.[0-9]+$/ && index($0, marker) { found = 1 }
            END { exit found ? 0 : 1 }
          ' "$log_file"
        }

        require_cache_write() {
          grep -Eq 'exporting cache to registry|writing cache manifest' "$1"
        }

        require_no_cache_write() {
          if grep -Eq 'exporting cache to registry|writing cache manifest' "$1"; then
            echo "read-only warm solve unexpectedly exported a registry cache" >&2
            return 1
          fi
        }

        create_builder() {
          local name="$1"
          if [ -n "$builder" ]; then
            "$docker_cli" buildx rm -f "$builder" >/dev/null 2>&1 || true
          fi
          builder="$name"
          "$docker_cli" buildx create \
            --name "$builder" \
            --driver docker-container \
            --driver-opt "network=${network}" \
            --config "$buildkit_cfg" \
            --use \
            --bootstrap >/dev/null
        }

        bake_plain() {
          local log_file="$1"
          set +e
          env NOOK_REGISTRY_CACHE_HOST="$registry_ref" "$docker_cli" buildx bake \
            --progress=plain \
            -f "$sim_dir/rust-deps-replay.docker-bake.hcl" \
            --set "*.context=$sim_dir" \
            rust-deps-replay >"$log_file" 2>&1
          local bake_status=$?
          set -e
          cat "$log_file"
          return "$bake_status"
        }

        bake_compile_source() {
          local log_file="$1"
          local source_scope="$2"
          local source_available="$3"
          local cache_write="$4"
          local runtime_mode="${5:-$sccache_consumer_mode}"
          local source_version="${6:-v3}"
          local extension_commit="${7:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}"
          local dependency_available="${8:-}"
          local client_side="${9:-1}"
          local error_log="${10:-}"
          local sanitizes_error_log="${11:-1}"
          local next_head_hits="${12:-1}"
          local -a compile_targets=(compile-warm)
          if [ -n "$cache_write" ] && [ -z "$dependency_available" ]; then
            compile_targets=(compile-dependency-cache compile-warm)
          fi
          set +e
          env NOOK_REGISTRY_CACHE_HOST="$registry_ref" \
            COMPILE_SOURCE_SCOPE="$source_scope" \
            COMPILE_SOURCE_CACHE_AVAILABLE="$source_available" \
            COMPILE_SOURCE_CACHE_WRITE_ENABLED="$cache_write" \
            COMPILE_SOURCE_CACHE_VERSION="$source_version" \
            SIMULATED_EXTENSION_COMMIT="$extension_commit" \
            SIMULATED_SCCACHE_CLIENT_SIDE="$client_side" \
            SIMULATED_SCCACHE_ERROR_LOG="$error_log" \
            SIMULATED_SCCACHE_SANITIZES_ERROR_LOG="$sanitizes_error_log" \
            SIMULATED_SCCACHE_NEXT_HEAD_HITS="$next_head_hits" \
            "$docker_cli" buildx bake \
            --progress=plain \
            -f "$sim_dir/compile-warm.docker-bake.hcl" \
            --set "*.context=$sim_dir" \
            --set "compile-warm.args.SIMULATED_BUILD_PROFILE=production" \
            --set "compile-warm.args.SIMULATED_EXTENSION_COMMIT=$extension_commit" \
            --set "*.args.SIMULATED_SCCACHE_CLIENT_SIDE=$client_side" \
            --set "*.args.SIMULATED_SCCACHE_ERROR_LOG=$error_log" \
            --set "*.args.SIMULATED_SCCACHE_SANITIZES_ERROR_LOG=$sanitizes_error_log" \
            --set "*.args.SIMULATED_SCCACHE_NEXT_HEAD_HITS=$next_head_hits" \
            --set "compile-warm.secrets=id=sccache_runtime_mode,src=$runtime_mode" \
            --set "compile-dependency-cache.secrets=id=sccache_runtime_mode,src=$runtime_mode" \
            "${compile_targets[@]}" >"$log_file" 2>&1
          local bake_status=$?
          set -e
          cat "$log_file"
          return "$bake_status"
        }

        bake_compile_missing_dependency_secret() {
          local log_file="$1"
          local runtime_mode="$2"
          set +e
          env NOOK_REGISTRY_CACHE_HOST="$registry_ref" \
            COMPILE_SOURCE_SCOPE="$compile_source_a" \
            COMPILE_SOURCE_CACHE_WRITE_ENABLED=1 \
            "$docker_cli" buildx bake \
            --progress=plain \
            -f "$sim_dir/compile-warm.docker-bake.hcl" \
            --set "*.context=$sim_dir" \
            --set "compile-warm.secrets=id=sccache_runtime_mode,src=$runtime_mode" \
            compile-dependency-cache compile-warm >"$log_file" 2>&1
          local bake_status=$?
          set -e
          cat "$log_file"
          return "$bake_status"
        }

        registry_ref_code() {
          "$docker_cli" run --rm --network "$network" curlimages/curl:8.12.1 \
            -sS -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
            "http://${stable_manifest}"
        }

        compile_registry_ref_code() {
          local manifest="$1"
          "$docker_cli" run --rm --network "$network" curlimages/curl:8.12.1 \
            -sS -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
            "http://${manifest}"
        }

        buildkit_cfg="$(mktemp)"
        printf '%s\n' \
          "[registry.\"docker.io\"]" \
          "  mirrors = [\"${registry_ref}\"]" \
          "" \
          "[registry.\"${registry_ref}\"]" \
          "  http = true" \
          "  insecure = true" \
          >"$buildkit_cfg"

        "$docker_cli" network create "$network" >/dev/null
        "$docker_cli" run -d \
          --name "$zot_name" \
          --platform linux/amd64 \
          --network "$network" \
          --network-alias "$registry_host" \
          -v "$sim_dir/zot-config.json:/etc/zot/config.json:ro" \
          "$zot_image" >/dev/null

        ready=0
        for _ in $(seq 1 60); do
          if "$docker_cli" run --rm --network "$network" curlimages/curl:8.12.1 \
            -fsS "http://${registry_ref}/v2/" >/dev/null 2>&1; then
            ready=1
            break
          fi
          sleep 1
        done
        test "$ready" -eq 1

        proof_log="$(mktemp)"

        echo "== Cold Rust dependency graph: stable registry write =="
        create_builder "nook-bake-sim-cold-${suffix}"
        bake_plain "$proof_log"
        for marker in \
          bake-sim-hive-toolchain \
          bake-sim-hive-cargo-fetch \
          bake-sim-hive-test-dependencies \
          bake-sim-hive-clippy-dependencies \
          bake-sim-hive-test-source \
          bake-sim-hive-clippy-source; do
          require_uncached_step "$proof_log" "$marker"
        done
        require_cache_write "$proof_log"
        test "$(registry_ref_code)" = 200
        echo "rust-deps cold: cached=0 uncached=6 writes=1 ref=${stable_repository}:buildcache"

        echo "== Source-only edit: dependency vertices replay from the same stable ref =="
        printf 'rust-source-only-edit\n' >"$leaf_input"
        create_builder "nook-bake-sim-source-${suffix}"
        bake_plain "$proof_log"
        for marker in \
          bake-sim-hive-toolchain \
          bake-sim-hive-cargo-fetch \
          bake-sim-hive-test-dependencies \
          bake-sim-hive-clippy-dependencies; do
          require_cached_step "$proof_log" "$marker"
        done
        for marker in bake-sim-hive-test-source bake-sim-hive-clippy-source; do
          require_uncached_step "$proof_log" "$marker"
        done
        require_cache_write "$proof_log"
        test "$(registry_ref_code)" = 200
        echo "rust-deps source-only: cached=4 uncached=2 writes=1 ref=${stable_repository}:buildcache"

        echo "== No-op replay: complete graph is native-warm on a fresh builder =="
        create_builder "nook-bake-sim-noop-${suffix}"
        bake_plain "$proof_log"
        for marker in \
          bake-sim-hive-toolchain \
          bake-sim-hive-cargo-fetch \
          bake-sim-hive-test-dependencies \
          bake-sim-hive-clippy-dependencies \
          bake-sim-hive-test-source \
          bake-sim-hive-clippy-source; do
          require_cached_step "$proof_log" "$marker"
        done
        require_cache_write "$proof_log"
        test "$(registry_ref_code)" = 200
        echo "rust-deps no-op: cached=6 uncached=0 writes=1 ref=${stable_repository}:buildcache"

        echo "== Client-side cold publication: zero errors plus zero writes is pending verification =="
        create_builder "nook-bake-sim-compile-zero-writes-${suffix}"
        bake_compile_source "$proof_log" "$compile_source_c" "" "1" "$sccache_publish_mode" "v3" \
          "cccccccccccccccccccccccccccccccccccccccc" "" "1"
        grep -Fq -- 'NOOK_SCCACHE_PUBLICATION_PENDING_VERIFICATION {"client_side":true,"counter_reliability":"backend_incomplete","cache_errors":0,"cache_writes":0}' "$proof_log"
        echo "compile cold publication: cache_errors=0 cache_writes=0 status=publication_pending_verification"

        echo "== Publication guard: inherited SCCACHE_ERROR_LOG disables unsanitized client-side completion =="
        create_builder "nook-bake-sim-compile-error-log-conflict-${suffix}"
        if bake_compile_source "$proof_log" "$compile_source_c" "" "1" "$sccache_publish_mode" "v3" \
          "cccccccccccccccccccccccccccccccccccccccc" "" "1" "/tmp/inherited-sccache-error.log" "0"; then
          echo "unsanitized SCCACHE_ERROR_LOG publication fault unexpectedly succeeded" >&2
          exit 1
        fi
        grep -Fq -- 'NOOK_SCCACHE_PUBLICATION_FAILURE {"cache_errors":0,"cache_misses":1,"cache_writes":0}' "$proof_log"
        echo "compile publication error-log conflict: cache_errors=0 cache_misses=1 cache_writes=0 status=failed"

        echo "== Cold normal publish: no seed prerequisite, sccache READ_WRITE =="
        echo "== Target-specific authority: a sibling without its secret fails distinctly =="
        create_builder "nook-bake-sim-compile-missing-sibling-secret-${suffix}"
        if bake_compile_missing_dependency_secret "$proof_log" "$sccache_publish_mode"; then
          echo "dependency-cache sibling without runtime authority unexpectedly succeeded" >&2
          exit 1
        fi
        grep -Fq -- 'secret sccache_runtime_mode: not found' "$proof_log"
        echo "compile target secret isolation: dependency-cache sibling status=failed reason=missing-runtime-authority"

        create_builder "nook-bake-sim-compile-source-a-${suffix}"
        compile_started="$(date +%s)"
        bake_compile_source "$proof_log" "$compile_source_a" "" "1" "$sccache_publish_mode" "v3" \
          "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" "" "1" "/tmp/inherited-sccache-error.log" "1"
        compile_elapsed=$(( $(date +%s) - compile_started ))
        grep -Fq -- 'bake-sim-sccache-write' "$proof_log"
        grep -Fq -- 'bake-sim-sccache-error-log-sanitized' "$proof_log"
        require_cache_write "$proof_log"
        test "$compile_elapsed" -lt 300
        test "$(compile_registry_ref_code "$compile_deps_manifest")" = 200
        compile_source_a_manifest="${registry_ref}/v2/${compile_source_repository}-${compile_source_a}/manifests/buildcache"
        test "$(compile_registry_ref_code "$compile_source_a_manifest")" = 200
        echo "compile cold publish: sccache_mode=READ_WRITE requests=present writes=present elapsed=${compile_elapsed}s limit=300s"

        echo "== Next unseeded head: dependency reuse plus cross-commit sccache hits =="
        printf 'nook-wasm-source-only-edit\n' >"$compile_nook_input"
        create_builder "nook-bake-sim-compile-source-b-${suffix}"
        compile_started="$(date +%s)"
        bake_compile_source "$proof_log" "$compile_source_b" "" "1" "$sccache_publish_mode" "v3" \
          "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" "1"
        compile_elapsed=$(( $(date +%s) - compile_started ))
        grep -Fq -- 'bake-sim-sccache-hit' "$proof_log"
        for marker in \
          bake-sim-compile-toolchain \
          bake-sim-compile-native-dependencies \
          bake-sim-compile-hive-dependencies \
          bake-sim-compile-wasm-dependencies \
          bake-sim-compile-hive-console-dependencies \
          bake-sim-compile-web-app-dependencies \
          bake-sim-compile-web-dependencies; do
          require_cached_step "$proof_log" "$marker"
        done
        require_cache_write "$proof_log"
        test "$compile_elapsed" -lt 300
        compile_source_b_manifest="${registry_ref}/v2/${compile_source_repository}-${compile_source_b}/manifests/buildcache"
        test "$(compile_registry_ref_code "$compile_source_b_manifest")" = 200
        echo "compile next-head publish: sccache_mode=READ_WRITE cache_hits=required writes=permitted elapsed=${compile_elapsed}s limit=300s"

        echo "== Repeated next-head zero hits: publication verification fails =="
        printf 'second-nook-wasm-source-only-edit\n' >"$compile_nook_input"
        create_builder "nook-bake-sim-compile-source-c-zero-hits-${suffix}"
        if bake_compile_source "$proof_log" "$compile_source_c" "" "1" "$sccache_publish_mode" "v3" \
          "cccccccccccccccccccccccccccccccccccccccc" "1" "1" "" "1" "0"; then
          echo "next-head zero-hit verification unexpectedly succeeded" >&2
          exit 1
        fi
        grep -Fq -- 'NOOK_SCCACHE_PUBLICATION_VERIFICATION_FAILURE {"cache_hits":0,"reason":"next_head_zero_hits"}' "$proof_log"
        echo "compile next-head verification: cache_hits=0 status=failed"

        echo "== Read-only replay: exact BuildKit reuse and zero writes =="
        create_builder "nook-bake-sim-compile-source-b-read-only-${suffix}"
        compile_started="$(date +%s)"
        bake_compile_source "$proof_log" "$compile_source_b" "1" "" "$sccache_consumer_mode" "v3" \
          "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        compile_elapsed=$(( $(date +%s) - compile_started ))
        require_no_cache_write "$proof_log"
        test "$compile_elapsed" -lt 300
        echo "compile read-only: sccache_mode=READ_ONLY cache_writes=0 registry_exports=0 elapsed=${compile_elapsed}s limit=300s"

        echo "== Legal document edit: invalidate only the web lineage =="
        printf 'legal-document-source-only-edit\n' >"$compile_web_legal_input"
        create_builder "nook-bake-sim-compile-source-e-${suffix}"
        bake_compile_source "$proof_log" "$compile_source_e" "" "1" "$sccache_publish_mode" "v3" \
          "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee" "1"
        for marker in \

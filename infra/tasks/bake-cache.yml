version: '3'

# Runtime Bake+Zot cache proof. Ephemeral Docker network + anonymous Zot.
# Fixtures live under infra/sim/bake-cache/.

vars:
  BAKE_CACHE_ZOT_IMAGE: 'ghcr.io/project-zot/zot-linux-amd64@sha256:95a837a0afacf5b7edc0c92493f04beee6891989b8d2fd50a00cf65a1e6d4fd5'

tasks:
  bake-cache:prove:
    desc: Prove Bake registry cache hits on a fresh BuildKit builder against ephemeral Zot.
    silent: true
    cmds:
      - |
        set -euo pipefail
        export PATH=/usr/bin:/bin
        if [ -x /usr/local/bin/docker ]; then docker_cli=/usr/local/bin/docker
        elif [ -x /usr/bin/docker ]; then docker_cli=/usr/bin/docker
        elif [ -x /opt/homebrew/bin/docker ]; then docker_cli=/opt/homebrew/bin/docker
        else
          echo "trusted Docker CLI is unavailable" >&2
          exit 127
        fi
        if [ -x /usr/local/lib/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/local/lib/docker/cli-plugins/docker-buildx
        elif [ -x /usr/local/libexec/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/local/libexec/docker/cli-plugins/docker-buildx
        elif [ -x /usr/lib/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/lib/docker/cli-plugins/docker-buildx
        elif [ -x /usr/libexec/docker/cli-plugins/docker-buildx ]; then buildx_cli=/usr/libexec/docker/cli-plugins/docker-buildx
        elif [ -x /opt/homebrew/lib/docker/cli-plugins/docker-buildx ]; then buildx_cli=/opt/homebrew/lib/docker/cli-plugins/docker-buildx
        elif [ -x /Applications/Docker.app/Contents/Resources/cli-plugins/docker-buildx ]; then buildx_cli=/Applications/Docker.app/Contents/Resources/cli-plugins/docker-buildx
        else
          echo "trusted Docker Buildx plugin is unavailable" >&2
          exit 127
        fi
        docker_config_source="${DOCKER_CONFIG:-${HOME:?HOME is required when DOCKER_CONFIG is unset}/.docker}"
        case "$docker_config_source" in
          /*) ;;
          *)
            echo "Docker config path must be absolute" >&2
            exit 2
            ;;
        esac
        trusted_docker_config="$(mktemp -d "${TMPDIR:-/tmp}/nook-docker-config.XXXXXX")"
        chmod 700 "$trusted_docker_config"
        mkdir -m 700 "$trusted_docker_config/cli-plugins"
        /bin/ln -s "$buildx_cli" "$trusted_docker_config/cli-plugins/docker-buildx"
        cleanup_docker_config() {
          rm -rf -- "$trusted_docker_config"
        }
        trap cleanup_docker_config EXIT
        if [ -z "${GITHUB_ACTIONS:-}" ] && [ -e "$docker_config_source/contexts" ]; then
          cp -RP -- "$docker_config_source/contexts" "$trusted_docker_config/contexts"
          if find "$trusted_docker_config/contexts" -type l -print -quit | grep -q .; then
            echo "Docker contexts must not contain symlinks" >&2
            exit 2
          fi
        fi
        if [ -f "$docker_config_source/config.json" ]; then
          if [ -n "${GITHUB_ACTIONS:-}" ]; then
            if [ -x /usr/local/bin/jq ]; then jq_cli=/usr/local/bin/jq
            elif [ -x /usr/bin/jq ]; then jq_cli=/usr/bin/jq
            elif [ -x /opt/homebrew/bin/jq ]; then jq_cli=/opt/homebrew/bin/jq
            else
              echo "trusted jq is unavailable in GitHub Actions" >&2
              exit 127
            fi
            "$jq_cli" 'if any(keys[]; explode | any(. > 127)) then error("non-ASCII Docker config key") else with_entries(select((.key | ascii_downcase) != "currentcontext" and (.key | ascii_downcase) != "clipluginsextradirs" and (.key | ascii_downcase) != "credsstore" and (.key | ascii_downcase) != "credhelpers" and (.key | ascii_downcase) != "proxies")) end' \
              "$docker_config_source/config.json" >"$trusted_docker_config/config.json"
          else
            current_context="$(DOCKER_CONFIG="$docker_config_source" "$docker_cli" context show)"
            case "$current_context" in
              ''|default) printf '{}\n' >"$trusted_docker_config/config.json" ;;
              *[!a-zA-Z0-9_.-]*)
                echo "Docker context name contains unsupported characters" >&2
                exit 2
                ;;
              *) printf '{"currentContext":"%s"}\n' "$current_context" >"$trusted_docker_config/config.json" ;;
            esac
          fi
          chmod 600 "$trusted_docker_config/config.json"
        fi
        export DOCKER_CONFIG="$trusted_docker_config"
        export BUILDX_CONFIG="$trusted_docker_config/buildx"
        unset BUILDX_BUILDER
        if [ -n "${GITHUB_ACTIONS:-}" ]; then
          unset DOCKER_HOST DOCKER_CONTEXT BUILDKIT_HOST
        fi
        repo_root="$(git rev-parse --show-toplevel)"
        sim_dir="$repo_root/infra/sim/bake-cache"
        zot_image="{{.BAKE_CACHE_ZOT_IMAGE}}"
        registry_host="registry.dev.nokey.sh"
        registry_ref="${registry_host}:5000"
        suffix="$(date +%s)-$(od -An -N2 -tu2 /dev/urandom | tr -d ' ')"
        network="nook-bake-sim-${suffix}"
        zot_name="nook-bake-sim-zot-${suffix}"
        builder=""
        buildkit_cfg=""
        proof_log=""
        rust_source_block=""
        parent_input="$sim_dir/inputs/parent.txt"
        parent_input_orig="$(cat "$parent_input")"
        leaf_input="$sim_dir/inputs/leaf.txt"
        leaf_input_orig="$(cat "$leaf_input")"
        loom_input="$sim_dir/inputs/loom.txt"
        loom_input_orig="$(cat "$loom_input")"
        crate_a_input="$sim_dir/inputs/crate-a.txt"
        crate_a_input_orig="$(cat "$crate_a_input")"
        crate_b_input="$sim_dir/inputs/crate-b.txt"
        crate_b_input_orig="$(cat "$crate_b_input")"
        pr1_suffix="-git-1111111111111111111111111111111111111111"
        pr2_suffix="-git-2222222222222222222222222222222222222222"
        cleanup() {
          set +e
          printf '%s\n' "$parent_input_orig" >"$parent_input"
          printf '%s\n' "$leaf_input_orig" >"$leaf_input"
          printf '%s\n' "$loom_input_orig" >"$loom_input"
          printf '%s\n' "$crate_a_input_orig" >"$crate_a_input"
          printf '%s\n' "$crate_b_input_orig" >"$crate_b_input"
          if [ -n "$builder" ]; then
            "$docker_cli" buildx rm -f "$builder" >/dev/null 2>&1
          fi
          "$docker_cli" rm -f "$zot_name" >/dev/null 2>&1
          "$docker_cli" network rm "$network" >/dev/null 2>&1
          if [ -n "$buildkit_cfg" ]; then
            rm -f "$buildkit_cfg"
          fi
          if [ -n "$proof_log" ]; then
            rm -f "$proof_log"
          fi
          if [ -n "$rust_source_block" ]; then
            rm -f "$rust_source_block"
          fi
          rm -rf -- "$trusted_docker_config"
        }
        trap cleanup EXIT

        # Cached means BuildKit did not execute the RUN body.
        # Fresh builders may restore remote layers without printing "CACHED".
        require_cached_step() {
          local log_file="$1"
          local marker="$2"
          local step
          step="$(awk -v marker="$marker" 'index($0, marker) { print $1; exit }' "$log_file")"
          test -n "$step"
          if grep -Fxq "$step CACHED" "$log_file"; then
            return 0
          fi
          if awk -v step="$step" -v marker="$marker" '
            $1 == step && $2 ~ /^[0-9]+\.[0-9]+$/ && index($0, marker) { found = 1 }
            END { exit found ? 0 : 1 }
          ' "$log_file"; then
            echo "expected cached step for marker: $marker (step $step executed)" >&2
            return 1
          fi
        }

        require_uncached_step() {
          local log_file="$1"
          local marker="$2"
          local step
          step="$(awk -v marker="$marker" 'index($0, marker) { print $1; exit }' "$log_file")"
          test -n "$step"
          if grep -Fxq "$step CACHED" "$log_file"; then
            echo "expected uncached step for marker: $marker" >&2
            return 1
          fi
          awk -v step="$step" -v marker="$marker" '
            $1 == step && $2 ~ /^[0-9]+\.[0-9]+$/ && index($0, marker) { found = 1 }
            END { exit found ? 0 : 1 }
          ' "$log_file"
        }

        create_builder() {
          local name="$1"
          if [ -n "$builder" ]; then
            "$docker_cli" buildx rm -f "$builder" >/dev/null 2>&1 || true
          fi
          builder="$name"
          "$docker_cli" buildx create \
            --name "$builder" \
            --driver docker-container \
            --driver-opt "network=${network}" \
            --config "$buildkit_cfg" \
            --use \
            --bootstrap >/dev/null
        }

        bake_plain() {
          local log_file="$1"
          shift
          set +e
          env \
            GHA_CACHE_ENABLED="${BAKE_SIM_CACHE_ENABLED}" \
            GHA_CACHE_WRITE_ENABLED="${BAKE_SIM_CACHE_WRITE_ENABLED}" \
            GHA_CACHE_FALLBACK_ENABLED="${BAKE_SIM_CACHE_FALLBACK_ENABLED}" \
            GHA_CACHE_SCOPE_SUFFIX="${BAKE_SIM_CACHE_SCOPE_SUFFIX}" \
            PARENT_OWN_CACHE_ENABLED="${BAKE_SIM_PARENT_OWN_CACHE_ENABLED}" \
            BASE_OWN_CACHE_ENABLED="${BAKE_SIM_BASE_OWN_CACHE_ENABLED}" \
            RUST_DEPS_INPUT_FINGERPRINT="${BAKE_SIM_RUST_DEPS_INPUT_FINGERPRINT:-}" \
            INPUT_CACHE_WRITE_ENABLED="${BAKE_SIM_INPUT_CACHE_WRITE_ENABLED:-}" \
            INPUT_CACHE_CANDIDATE="${BAKE_SIM_INPUT_CACHE_CANDIDATE:-}" \
            LEAF_EXACT_AVAILABLE="${BAKE_SIM_LEAF_EXACT_AVAILABLE:-}" \
            NESTED_LEAF_EXACT_AVAILABLE="${BAKE_SIM_NESTED_LEAF_EXACT_AVAILABLE:-}" \
            CONSUMER_EXACT_AVAILABLE="${BAKE_SIM_CONSUMER_EXACT_AVAILABLE:-}" \
            HIVE_EXACT_AVAILABLE="${BAKE_SIM_HIVE_EXACT_AVAILABLE:-}" \
            NOOK_REGISTRY_CACHE_HOST="$registry_ref" \
            "$docker_cli" buildx bake \
            --progress=plain \
            -f "$sim_dir/docker-bake.hcl" \
            --set "*.context=$sim_dir" \
            "$@" >"$log_file" 2>&1
          local bake_status=$?
          set -e
          cat "$log_file"
          # ignore-error cache misses can still exit non-zero after a successful bake.
          if [ "$bake_status" -ne 0 ] && grep -Eq 'exporting cache to registry| CACHED$|bake-sim-' "$log_file"; then
            return 0
          fi
          return "$bake_status"
        }

        # Probe Zot for a BuildKit cache manifest (Main vs remote-buildcache isolation).
        registry_ref_code() {
          local repository="$1"
          local tag="${2:-buildcache}"
          "$docker_cli" run --rm --network "$network" curlimages/curl:8.12.1 \
            -sS -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
            "http://${registry_ref}/v2/${repository}/manifests/${tag}"
        }

        require_registry_ref() {
          local repository="$1"
          local code
          code="$(registry_ref_code "$repository")"
          test "$code" = "200"
        }

        require_no_registry_ref() {
          local repository="$1"
          local code
          code="$(registry_ref_code "$repository")"
          test "$code" = "404"
        }

        promote_registry_tag() {
          local repository="$1"
          local source_tag="$2"
          local stable_tag="$3"
          "$docker_cli" run --rm --network "$network" curlimages/curl:8.12.1 \
            sh -euc '
              manifest="$(mktemp)"
              headers="$(mktemp)"
              trap '\''rm -f "$manifest" "$headers"'\'' EXIT
              curl -fsS -D "$headers" -o "$manifest" \
                -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
                "http://$1/v2/$2/manifests/$3"
              content_type="$(awk '\''tolower($1) == "content-type:" { gsub("\\r", "", $2); print $2; exit }'\'' "$headers")"
              test -n "$content_type"
              curl -fsS -X PUT -H "Content-Type: $content_type" --data-binary @"$manifest" \
                "http://$1/v2/$2/manifests/$4" >/dev/null
            ' sh "$registry_ref" "$repository" "$source_tag" "$stable_tag"
        }

        buildkit_cfg="$(mktemp)"
        printf '%s\n' \
          "[registry.\"docker.io\"]" \
          "  mirrors = [\"${registry_ref}\"]" \
          "" \
          "[registry.\"${registry_ref}\"]" \
          "  http = true" \
          "  insecure = true" \
          >"$buildkit_cfg"

        "$docker_cli" network create "$network" >/dev/null
        "$docker_cli" run -d \
          --name "$zot_name" \
          --platform linux/amd64 \
          --network "$network" \
          --network-alias "$registry_host" \
          -v "$sim_dir/zot-config.json:/etc/zot/config.json:ro" \
          "$zot_image" >/dev/null

        ready=0
        for _ in $(seq 1 60); do
          if "$docker_cli" run --rm --network "$network" curlimages/curl:8.12.1 \
            -fsS "http://${registry_ref}/v2/" >/dev/null 2>&1; then
            ready=1
            break
          fi
          sleep 1
        done
        test "$ready" -eq 1

        proof_log="$(mktemp)"

        echo "== Rust source-boundary cache proof =="
        product_dockerfile="$repo_root/nook-app/nook-platform/docker/rust/product.Dockerfile"
        nightly_dockerfile="$repo_root/nook-app/nook-platform/docker/rust/nightly.Dockerfile"
        rust_source_block="$(mktemp)"
        awk '
          /^FROM builder-wasm-deps AS builder-wasm-source$/ { capture = 1 }
          /^FROM builder-wasm-source AS builder-wasm-clippy$/ { capture = 0 }
          capture { print }
        ' "$product_dockerfile" >"$rust_source_block"
        test "$(grep -Fc 'cargo build --lib --release --target wasm32-unknown-unknown -p nook-wasm' "$rust_source_block")" -eq 8
        test "$(grep -Fc 'cargo build --lib --release --target wasm32-unknown-unknown -p nook-companion-wasm' "$rust_source_block")" -eq 8
        if grep -Fq -- '-p nook-wasm -p nook-companion-wasm' "$rust_source_block"; then
          echo "WASM source prewarm must not use a joint package feature graph" >&2
          exit 1
        fi
        awk '
          /COPY nook-app\/nook-platform\/dylint\/nook-domain-api\/ dylint\/nook-domain-api\// {
            lint_copy = NR
          }
          /nook-sccache-report rust-dylint-self-test/ { self_test = NR }
          /COPY nook-app\/nook-platform\/ nook-app\/nook-platform\// && !product_copy {
            product_copy = NR
          }
          /cargo dylint --all -- --all-targets/ { product_lint = NR }
          END {
            exit !(lint_copy < self_test && self_test < product_copy && product_copy < product_lint)
          }
        ' "$nightly_dockerfile"
        BAKE_SIM_CACHE_ENABLED=
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX=
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=
        BAKE_SIM_BASE_OWN_CACHE_ENABLED=
        create_builder "nook-bake-sim-rust-source-${suffix}"
        bake_plain "$proof_log" \
          --set "dylint-split.args.PRODUCT_SOURCE=${suffix}-first" \
          dylint-split
        bake_plain "$proof_log" \
          --set "dylint-split.args.PRODUCT_SOURCE=${suffix}-second" \
          dylint-split
        require_cached_step "$proof_log" "bake-sim-dylint-self-test-expensive"
        require_uncached_step "$proof_log" "bake-sim-dylint-product-expensive"
        echo "Rust source-boundary cache proof: ok"

        echo "== Scenario A: Main cold publish =="
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=1
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX=
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        # Context base has no cache-from (mirrors rust-base). Write short base
        # separately so Scenario L can prove short-base orphan vs fix.
        BAKE_SIM_BASE_OWN_CACHE_ENABLED=
        create_builder "nook-bake-sim-a-${suffix}"
        bake_plain "$proof_log" base-publish
        require_uncached_step "$proof_log" "bake-sim-base-layer"
        test "$(registry_ref_code \
          "library/alpine" \
          "sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b")" = 200
        bake_plain "$proof_log" parent-publish
        require_uncached_step "$proof_log" "bake-sim-parent-expensive"
        # Fat nested parent with bare base (no base cache-from) for Scenario L.
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=
        bake_plain "$proof_log" parent-nested-publish
        require_uncached_step "$proof_log" "bake-sim-parent-expensive"
        # Publish leaf with parent own-cache off so mode=max embeds a full parent chain.
        bake_plain "$proof_log" leaf
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario A ok"

        echo "== Scenario B: Main fresh restore (CACHED) =="
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX=
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        create_builder "nook-bake-sim-b-${suffix}"
        bake_plain "$proof_log" parent
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        # Leaf restore must not import a shorter parent scope (orphans leaf RUN).
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=
        create_builder "nook-bake-sim-b2-${suffix}"
        bake_plain "$proof_log" leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario B ok"

        echo "== Scenario C: short-chain orphan (leaf not CACHED) =="
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX=
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        create_builder "nook-bake-sim-c-${suffix}"
        bake_plain "$proof_log" leaf-short-chain
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario C ok"

        echo "== Scenario D: PR without Main parent fallback (cold) =="
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1
        BAKE_SIM_CACHE_SCOPE_SUFFIX=-git-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        create_builder "nook-bake-sim-d-${suffix}"
        bake_plain "$proof_log" parent-pr-cold
        require_uncached_step "$proof_log" "bake-sim-parent-expensive"
        echo "scenario D ok"

        echo "== Scenario E: PR with Main parent FALLBACK (CACHED) =="
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1
        BAKE_SIM_CACHE_SCOPE_SUFFIX=-git-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        create_builder "nook-bake-sim-e-${suffix}"
        bake_plain "$proof_log" parent
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        echo "scenario E ok"

        echo "== Scenario F: parallel PR1 isolated write (remote-buildcache) =="
        # Divergent PR fingerprint so PR1 layers are not the Main index content.
        printf 'pr1-divergent\n' >"$parent_input"
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=1
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$pr1_suffix"
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        create_builder "nook-bake-sim-f-${suffix}"
        bake_plain "$proof_log" parent-publish
        require_uncached_step "$proof_log" "bake-sim-parent-expensive"
        require_registry_ref "nook/remote-buildcache/nook-bake-sim-parent-v1${pr1_suffix}"
        require_registry_ref "nook/buildcache/nook-bake-sim-parent-v1"
        echo "scenario F ok"

        echo "== Scenario G: PR1 fresh restore from own git scope (CACHED) =="
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$pr1_suffix"
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        create_builder "nook-bake-sim-g-${suffix}"
        bake_plain "$proof_log" parent
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        echo "scenario G ok"

        echo "== Scenario H: parallel PR2 does not see PR1 git scope (cold) =="
        # Same divergent inputs as PR1, different -git- SHA → empty own scope, no Main FALLBACK.
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$pr2_suffix"
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        create_builder "nook-bake-sim-h-${suffix}"
        bake_plain "$proof_log" parent
        require_uncached_step "$proof_log" "bake-sim-parent-expensive"
        require_no_registry_ref "nook/remote-buildcache/nook-bake-sim-parent-v1${pr2_suffix}"
        require_registry_ref "nook/remote-buildcache/nook-bake-sim-parent-v1${pr1_suffix}"
        echo "scenario H ok"

        echo "== Scenario I: Main restore intact after PR1 write (CACHED) =="
        printf '%s\n' "$parent_input_orig" >"$parent_input"
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX=
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        create_builder "nook-bake-sim-i-${suffix}"
        bake_plain "$proof_log" parent
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_registry_ref "nook/buildcache/nook-bake-sim-parent-v1"
        echo "scenario I ok"

        echo "== Scenario J: PR2 FALLBACK uses Main, not PR1 (CACHED) =="
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$pr2_suffix"
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        create_builder "nook-bake-sim-j-${suffix}"
        bake_plain "$proof_log" parent
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_no_registry_ref "nook/remote-buildcache/nook-bake-sim-parent-v1${pr2_suffix}"
        echo "scenario J ok"

        echo "== Scenario K: leaf after Main FALLBACK, then git publish (CACHED) =="
        # Mirrors dylint: verify/materialize nested parent from Main before writing
        # git-scope. Leaf must stay CACHED after the post-leaf parent publish.
        pr_leaf_suffix="-git-cccccccccccccccccccccccccccccccccccccccc"
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$pr_leaf_suffix"
        BAKE_SIM_BASE_OWN_CACHE_ENABLED=
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=
        create_builder "nook-bake-sim-k-${suffix}"
        bake_plain "$proof_log" leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        BAKE_SIM_CACHE_WRITE_ENABLED=1
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        bake_plain "$proof_log" parent-publish
        require_registry_ref "nook/remote-buildcache/nook-bake-sim-parent-v1${pr_leaf_suffix}"
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=
        BAKE_SIM_BASE_OWN_CACHE_ENABLED=
        create_builder "nook-bake-sim-k2-${suffix}"
        bake_plain "$proof_log" leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario K ok"

        echo "== Scenario L: nested parent restore target is CACHED =="
        # Nested nightly FROM Bake-context base. The explicit restore target owns
        # nightly cache-from while the context target remains bare.
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX=
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        BAKE_SIM_BASE_OWN_CACHE_ENABLED=
        create_builder "nook-bake-sim-l-${suffix}"
        bake_plain "$proof_log" parent-nested-restore
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        echo "scenario L ok"

        echo "== Scenario M: extra linked source overlay reproduces nightly miss =="
        # Mirrors the rejected leaf -> rust-platform-nightly -> nightly -> base
        # graph. A standalone restore is warm, but re-importing that cache below
        # the extra linked source target changes the solve lineage and reruns the
        # expensive nightly step on a fresh builder.
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=
        BAKE_SIM_CACHE_SCOPE_SUFFIX=
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        BAKE_SIM_BASE_OWN_CACHE_ENABLED=
        create_builder "nook-bake-sim-m-${suffix}"
        bake_plain "$proof_log" parent-nested-restore
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        bake_plain "$proof_log" leaf-via-platform-broken
        require_uncached_step "$proof_log" "bake-sim-parent-expensive"
        echo "scenario M ok"

        echo "== Scenario N: one-Dockerfile leaf keeps nightly CACHED =="
        # Fixed graph: base, parent tools, and source leaf are stages in one Dockerfile.
        # One cold producer publishes the full mode=max leaf graph. Another fresh
        # builder must restore both parent and leaf from that single scope.
        create_builder "nook-bake-sim-n-${suffix}"
        BAKE_SIM_CACHE_WRITE_ENABLED=1
        bake_plain "$proof_log" combined-leaf
        require_uncached_step "$proof_log" "bake-sim-parent-expensive"
        require_uncached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"
        require_registry_ref "nook/buildcache/nook-bake-sim-nested-leaf-v1"
        BAKE_SIM_CACHE_WRITE_ENABLED=
        create_builder "nook-bake-sim-n2-${suffix}"
        bake_plain "$proof_log" combined-leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_cached_step "$proof_log" "bake-sim-crate-a-expensive"
        require_cached_step "$proof_log" "bake-sim-crate-b-expensive"
        require_cached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario N ok"

        echo "== Scenario O: source edit preserves cached nightly tools =="
        printf 'leaf-source-edit\n' >"$leaf_input"
        create_builder "nook-bake-sim-o-${suffix}"
        bake_plain "$proof_log" combined-leaf
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_cached_step "$proof_log" "bake-sim-loom-deps-expensive"
        require_cached_step "$proof_log" "bake-sim-crate-a-expensive"
        require_cached_step "$proof_log" "bake-sim-crate-b-expensive"
        require_uncached_step "$proof_log" "bake-sim-leaf-expensive"
        echo "scenario O ok"

        echo "== Scenario P: hosted-verified formatter deps feed fresh PR runner =="
        # The unavoidable local formatter and a PR can have different commit
        # SHAs while sharing identical source-free dependency inputs.
        printf 'local-pr-shared-head\n' >"$parent_input"
        deps_fingerprint="dddddddddddddddddddddddddddddddddddddddd"
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$pr1_suffix"
        BAKE_SIM_PARENT_OWN_CACHE_ENABLED=1
        BAKE_SIM_BASE_OWN_CACHE_ENABLED=
        BAKE_SIM_RUST_DEPS_INPUT_FINGERPRINT="$deps_fingerprint"
        BAKE_SIM_INPUT_CACHE_WRITE_ENABLED=1
        BAKE_SIM_INPUT_CACHE_CANDIDATE="local-good"
        create_builder "nook-bake-sim-p-local-${suffix}"
        bake_plain "$proof_log" parent-input-publish
        require_uncached_step "$proof_log" "bake-sim-parent-expensive"
        input_repository="nook/remote-buildcache/nook-bake-sim-parent-input-v2"
        candidate_tag="candidate-${deps_fingerprint}-local-good"
        stable_tag="fingerprint-${deps_fingerprint}"
        test "$(registry_ref_code "$input_repository" "$candidate_tag")" = "200"
        test "$(registry_ref_code "$input_repository" "$stable_tag")" = "404"
        require_no_registry_ref "nook/remote-buildcache/nook-bake-sim-parent-v1${pr2_suffix}"

        # A distinct hosted builder must consume the candidate before the
        # registry manifest is atomically tagged as PR-visible.
        BAKE_SIM_INPUT_CACHE_WRITE_ENABLED=
        create_builder "nook-bake-sim-p-hosted-verify-${suffix}"
        bake_plain "$proof_log" parent-input-verify
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        promote_registry_tag "$input_repository" "$candidate_tag" "$stable_tag"
        test "$(registry_ref_code "$input_repository" "$stable_tag")" = "200"

        BAKE_SIM_CACHE_SCOPE_SUFFIX="$pr2_suffix"
        create_builder "nook-bake-sim-p-pr-${suffix}"
        bake_plain "$proof_log" parent
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        require_registry_ref "nook/buildcache/nook-bake-sim-parent-v1"
        echo "scenario P ok"

        echo "== Scenario T: unverified local candidate cannot poison stable PR input =="
        printf 'unverified-local-candidate\n' >"$parent_input"
        BAKE_SIM_INPUT_CACHE_WRITE_ENABLED=1
        BAKE_SIM_INPUT_CACHE_CANDIDATE="local-rejected"
        create_builder "nook-bake-sim-t-local-${suffix}"
        bake_plain "$proof_log" parent-input-publish
        require_uncached_step "$proof_log" "bake-sim-parent-expensive"
        test "$(registry_ref_code "$input_repository" "candidate-${deps_fingerprint}-local-rejected")" = "200"

        # Do not promote the rejected candidate. A fresh PR solve sees only the
        # previously verified fingerprint tag and therefore retains the hit.
        printf 'local-pr-shared-head\n' >"$parent_input"
        BAKE_SIM_INPUT_CACHE_WRITE_ENABLED=
        BAKE_SIM_INPUT_CACHE_CANDIDATE=
        create_builder "nook-bake-sim-t-pr-${suffix}"
        bake_plain "$proof_log" parent
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        echo "scenario T ok"

        echo "== Scenario U: promoter setup failure leaves stable input intact =="
        # A workflow/action failure occurs before the promoter process runs.
        # Model that boundary by preserving the already verified tag while the
        # quarantined candidate remains unreachable from PR cache imports.
        test "$(registry_ref_code "$input_repository" "$stable_tag")" = "200"
        test "$(registry_ref_code "$input_repository" "candidate-${deps_fingerprint}-local-rejected")" = "200"
        create_builder "nook-bake-sim-u-pr-${suffix}"
        bake_plain "$proof_log" parent
        require_cached_step "$proof_log" "bake-sim-parent-expensive"
        echo "scenario U ok"

        echo "== Scenario Q: inline PR verification publishes a generic exact leaf =="
        # A standalone PR workflow first restores its unchanged dependency/tool
        # stages from trusted Main. The verified build writes only its isolated
        # exact-head scope. A fresh retry at that SHA must restore the source
        # leaf as well as the Main-seeded parent.
        printf '%s\n' "$parent_input_orig" >"$parent_input"
        printf 'hive-pr-source-edit\n' >"$leaf_input"
        exact_pr_suffix="-git-eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
        BAKE_SIM_CACHE_ENABLED=1
        BAKE_SIM_CACHE_WRITE_ENABLED=1
        BAKE_SIM_CACHE_FALLBACK_ENABLED=1
        BAKE_SIM_CACHE_SCOPE_SUFFIX="$exact_pr_suffix"

version: '3'

# k0s infrastructure operations.
tasks:
  k0s:install:
    desc: Idempotently install the pinned single-node k0s cluster.
    deps: [kvm:verify, k0s:sync, kubernetes:tools:install]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -Eeuo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        k0s_version="{{.K0S_VERSION}}"
        k0s_sha="{{.K0S_AMD64_SHA256}}"
        download_dir="$remote_dir/downloads"
        install -d -m 0750 "$download_dir"
        sudo -n apt-get update -qq
        sudo -n apt-get install -y -qq --no-install-recommends \
          acl jq ruby

        firewall_fragment="$(mktemp)"
        firewall_config="$(mktemp)"
        firewall_previous_config="$(mktemp)"
        firewall_previous_fragment="$(mktemp)"
        firewall_previous_live="$(mktemp)"
        firewall_live_next="$(mktemp)"
        firewall_fragment_existed=false
        firewall_rollback_armed=false
        encryption_config=""
        cni_config_next=""
        recovery_key=""
        encrypted_backup=""
        expected_mac=""
        sudo -n cat /etc/nftables.conf > "$firewall_previous_config"
        if sudo -n test -f /etc/nftables.d/nook-k0s.nft; then
          sudo -n cat /etc/nftables.d/nook-k0s.nft \
            > "$firewall_previous_fragment"
          firewall_fragment_existed=true
        fi
        : > "$firewall_previous_live"
        for chain in input forward; do
          printf 'flush chain inet bynull_filter %s\n' "$chain" \
            >> "$firewall_previous_live"
          sudo -n nft --handle list chain inet bynull_filter "$chain" |
            awk -v chain="$chain" '
              /^[[:space:]]*table / ||
              /^[[:space:]]*chain / ||
              /^[[:space:]]*type / ||
              /^[[:space:]]*policy / ||
              /^[[:space:]]*[{}][[:space:]]*$/ {
                next
              }
              {
                sub(/^[[:space:]]*/, "")
                sub(/[[:space:]]+# handle [0-9]+$/, "")
                if (length($0) > 0) {
                  print "add rule inet bynull_filter " chain " " $0
                }
              }
            ' >> "$firewall_previous_live"
        done
        rollback_k0s_firewall() {
          status=$?
          trap - ERR HUP INT TERM
          set +e
          if test "$firewall_rollback_armed" = true; then
            firewall_rollback_armed=false
            if test -s "$firewall_previous_live"; then
              sudo -n nft --file "$firewall_previous_live"
            fi
            sudo -n install -m 0644 \
              "$firewall_previous_config" \
              /etc/nftables.conf
            if test "$firewall_fragment_existed" = true; then
              sudo -n install -m 0644 \
                "$firewall_previous_fragment" \
                /etc/nftables.d/nook-k0s.nft
            else
              sudo -n rm -f /etc/nftables.d/nook-k0s.nft
            fi
          fi
          rm -f \
            "$firewall_fragment" \
            "$firewall_config" \
            "$firewall_previous_config" \
            "$firewall_previous_fragment" \
            "$firewall_previous_live" \
            "$firewall_live_next" \
            ${encryption_config:+"$encryption_config"} \
            ${cni_config_next:+"$cni_config_next"} \
            ${recovery_key:+"$recovery_key"} \
            ${encrypted_backup:+"$encrypted_backup"} \
            ${expected_mac:+"$expected_mac"}
          return "$status"
        }
        replace_k0s_firewall_rules() {
          phase="$1"
          case "$phase" in
            install)
              input_comment="nook k0s pod control plane install"
              forward_comment="nook k0s pod egress install"
              ;;
            committed)
              input_comment="nook k0s pod control plane v3"
              forward_comment="nook k0s pod egress v3"
              ;;
            *)
              echo "Unknown k0s firewall phase: $phase" >&2
              return 2
              ;;
          esac
          : > "$firewall_live_next"
          for chain in input forward; do
            case "$chain" in
              input)
                owner="nook k0s pod control plane"
                replacement='iifname "kube-bridge" ip saddr 10.244.0.0/16 tcp dport { 6443, 8132, 10250 } accept comment "'"$input_comment"'"'
                ;;
              forward)
                owner="nook k0s pod egress"
                replacement='iifname "kube-bridge" ip saddr 10.244.0.0/16 accept comment "'"$forward_comment"'"'
                ;;
            esac
            printf 'flush chain inet bynull_filter %s\n' "$chain" \
              >> "$firewall_live_next"
            sudo -n nft --handle list chain inet bynull_filter "$chain" |
              awk \
                -v chain="$chain" \
                -v owner="$owner" \
                -v replacement="$replacement" '
                /^[[:space:]]*table / ||
                /^[[:space:]]*chain / ||
                /^[[:space:]]*type / ||
                /^[[:space:]]*policy / ||
                /^[[:space:]]*[{}][[:space:]]*$/ {
                  next
                }
                {
                  sub(/^[[:space:]]*/, "")
                  sub(/[[:space:]]+# handle [0-9]+$/, "")
                  owned = "comment \"" owner "( v[0-9]+( next)?| install)?\""
                  if ($0 ~ owned) {
                    if (!replaced) {
                      print "add rule inet bynull_filter " chain " " replacement
                      replaced = 1
                    }
                    next
                  }
                  if (length($0) > 0) {
                    print "add rule inet bynull_filter " chain " " $0
                  }
                }
                END {
                  if (!replaced) {
                    print "add rule inet bynull_filter " chain " " replacement
                  }
                }
              ' >> "$firewall_live_next"
          done
          sudo -n nft --check --file "$firewall_live_next"
          sudo -n nft --file "$firewall_live_next"
        }
        trap rollback_k0s_firewall EXIT
        firewall_rollback_armed=true
        trap rollback_k0s_firewall ERR
        trap 'exit 129' HUP
        trap 'exit 130' INT
        trap 'exit 143' TERM
        sudo -n nft list chain inet bynull_filter input |
          grep -E "policy drop" >/dev/null
        sudo -n nft list chain inet bynull_filter forward |
          grep -E "policy drop" >/dev/null
        cat > "$firewall_fragment" <<'NFT'
        add rule inet bynull_filter input iifname "kube-bridge" ip saddr 10.244.0.0/16 tcp dport { 6443, 8132, 10250 } accept comment "nook k0s pod control plane v3"
        add rule inet bynull_filter forward iifname "kube-bridge" ip saddr 10.244.0.0/16 accept comment "nook k0s pod egress v3"
        NFT
        sudo -n install -d -m 0755 /etc/nftables.d
        sudo -n install -m 0644 \
          "$firewall_fragment" \
          /etc/nftables.d/nook-k0s.nft
        sudo -n cat /etc/nftables.conf > "$firewall_config"
        if ! grep -Eq \
          '^[[:space:]]*include[[:space:]]+"/etc/nftables.d/nook-k0s\.nft"([[:space:]]*(#.*)?)?$' \
          "$firewall_config"; then
          printf '\ninclude "/etc/nftables.d/nook-k0s.nft"\n' \
            >> "$firewall_config"
        fi
        sudo -n nft --check --file "$firewall_config"
        sudo -n install -m 0644 "$firewall_config" /etc/nftables.conf
        replace_k0s_firewall_rules install
        sudo -n nft list chain inet bynull_filter input |
          grep -F 'iifname "kube-bridge" ip saddr 10.244.0.0/16 tcp dport { 6443, 8132, 10250 } accept comment "nook k0s pod control plane install"' >/dev/null
        sudo -n nft list chain inet bynull_filter forward |
          grep -F 'iifname "kube-bridge" ip saddr 10.244.0.0/16 accept comment "nook k0s pod egress install"' >/dev/null

        k0s_asset="k0s-${k0s_version}-amd64"
        k0s_url="https://github.com/k0sproject/k0s/releases/download/${k0s_version//+/%2B}/$k0s_asset"
        curl -fsSL --retry 3 -o "$download_dir/$k0s_asset.next" "$k0s_url"
        printf '%s  %s\n' "$k0s_sha" "$download_dir/$k0s_asset.next" | sha256sum -c -
        chmod 0755 "$download_dir/$k0s_asset.next"
        sudo -n install -m 0755 "$download_dir/$k0s_asset.next" /usr/local/bin/k0s
        mv "$download_dir/$k0s_asset.next" "$download_dir/$k0s_asset"

        sudo -n install -d -m 0755 /etc/k0s/containerd.d/certs.d/registry.dev.nokey.sh
        sudo -n install -d -m 0700 /var/lib/hive/k0s-recovery
        if ! sudo -n test -s /var/lib/k0s/pki/hive-encryption-provider.yaml &&
          sudo -n test -s /var/lib/hive/k0s-recovery/encryption-provider.yaml; then
          sudo -n install -D -m 0600 \
            /var/lib/hive/k0s-recovery/encryption-provider.yaml \
            /var/lib/k0s/pki/hive-encryption-provider.yaml
        fi
        if ! sudo -n test -s /var/lib/k0s/pki/hive-encryption-provider.yaml; then
          encryption_key="$(openssl rand -base64 32)"
          encryption_config="$(mktemp)"
          umask 077
          cat > "$encryption_config" <<EOF
        apiVersion: apiserver.config.k8s.io/v1
        kind: EncryptionConfiguration
        resources:
          - resources:
              - secrets
            providers:
              - aesgcm:
                  keys:
                    - name: hive-key-1
                      secret: $encryption_key
              - identity: {}
        EOF
          sudo -n install -D -m 0600 \
            "$encryption_config" \
            /var/lib/k0s/pki/hive-encryption-provider.yaml
          rm -f "$encryption_config"
          encryption_config=""
        fi
        sudo -n install -m 0644 "$remote_dir/infra/k0s/config/k0s.yaml" /etc/k0s/k0s.yaml
        sudo -n install -m 0644 \
          "$remote_dir/infra/k0s/config/cri-registry.toml" \
          /etc/k0s/containerd.d/cri-registry.toml
        sudo -n install -m 0644 \
          "$remote_dir/infra/k0s/config/registry-hosts.toml" \
          /etc/k0s/containerd.d/certs.d/registry.dev.nokey.sh/hosts.toml
        sudo -n rm -rf /etc/k0s/containerd.d/certs.d/127.0.0.1:5000

        api_address_unit="$(mktemp)"
        cat > "$api_address_unit" <<'EOF'
        [Unit]
        Description=Nook k0s stable API loopback address
        Before=k0scontroller.service

        [Service]
        Type=oneshot
        ExecStart=/usr/sbin/ip address replace 10.201.0.1/32 dev lo
        RemainAfterExit=yes

        [Install]
        WantedBy=multi-user.target
        EOF
        sudo -n install -m 0644 \
          "$api_address_unit" \
          /etc/systemd/system/nook-k0s-api-address.service
        rm -f "$api_address_unit"
        sudo -n systemctl daemon-reload
        sudo -n systemctl enable nook-k0s-api-address.service
        sudo -n systemctl restart nook-k0s-api-address.service
        sudo -n systemctl is-enabled --quiet nook-k0s-api-address.service
        sudo -n systemctl is-active --quiet nook-k0s-api-address.service
        sudo -n ip -4 address show dev lo |
          grep -F '10.201.0.1/32' >/dev/null
        if sudo -n systemctl is-active --quiet k0scontroller; then
          if sudo -n k0s kubectl get deployment hive \
            --namespace hive-system >/dev/null 2>&1 &&
            ! sudo -n k0s kubectl get networkpolicy hive-worker-kubernetes-api \
              --namespace hive-system >/dev/null 2>&1; then
            cat <<'YAML' |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: hive-worker-kubernetes-api
          namespace: hive-system
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hive
          policyTypes: [Egress]
          egress:
            - to:
                - ipBlock:
                    cidr: 10.96.0.1/32
              ports:
                - protocol: TCP
                  port: 443
            - to:
                - ipBlock:
                    cidr: {{.K0S_API_ADDRESS}}/32
              ports:
                - protocol: TCP
                  port: 6443
        YAML
              sudo -n k0s kubectl apply -f -
          fi
          for policy in \
            hive-worker-kubernetes-api \
            hive-reaper-controller; do
            if ! sudo -n k0s kubectl get networkpolicy "$policy" \
              --namespace hive-system >/dev/null 2>&1; then
              continue
            fi
            policy_json="$(
              sudo -n k0s kubectl get networkpolicy "$policy" \
                --namespace hive-system \
                -o json
            )"
            if jq -e \
              --arg cidr "{{.K0S_API_ADDRESS}}/32" \
              '[.spec.egress[]?.to[]?.ipBlock.cidr] | index($cidr) != null' \
              <<<"$policy_json" >/dev/null; then
              continue
            fi
            egress_index="$(
              jq -r '
                .spec.egress
                | to_entries[]
                | select(any(.value.ports[]?; .port == 6443))
                | .key
              ' <<<"$policy_json"
            )"
            case "$egress_index" in
              '')
                patch="$(
                  jq -cn \
                    --arg cidr "{{.K0S_API_ADDRESS}}/32" \
                    '[{
                      op: "add",
                      path: "/spec/egress/-",
                      value: {
                        to: [{ipBlock: {cidr: $cidr}}],
                        ports: [{protocol: "TCP", port: 6443}]
                      }
                    }]'
                )"
                ;;
              *[!0-9]*)
                echo "Refusing ambiguous API egress rules in policy: $policy" >&2
                exit 1
                ;;
              *)
                patch="$(
                  jq -cn \
                    --arg path "/spec/egress/$egress_index/to/-" \
                    --arg cidr "{{.K0S_API_ADDRESS}}/32" \
                    '[{
                      op: "add",
                      path: $path,
                      value: {ipBlock: {cidr: $cidr}}
                    }]'
                )"
                ;;
            esac
            sudo -n k0s kubectl patch networkpolicy "$policy" \
              --namespace hive-system \
              --type=json \
              --patch "$patch"
          done
        fi

        if ! sudo -n test -f /etc/systemd/system/k0scontroller.service; then
          sudo -n k0s install controller \
            --enable-worker \
            --no-taints \
            --config /etc/k0s/k0s.yaml
        fi
        sudo -n test "$(id -u kube-apiserver)" -ge 1
        sudo -n chown root:root \
          /var/lib/k0s/pki/hive-encryption-provider.yaml
        sudo -n setfacl --remove-all \
          /var/lib/k0s/pki/hive-encryption-provider.yaml
        sudo -n chmod 0600 \
          /var/lib/k0s/pki/hive-encryption-provider.yaml
        sudo -n setfacl \
          --modify user:kube-apiserver:r--,mask::r-- \
          /var/lib/k0s/pki/hive-encryption-provider.yaml
        cni_config=/etc/cni/net.d/10-kuberouter.conflist
        cni_was_unmasqueraded=false
        if sudo -n test -s "$cni_config" &&
          ! sudo -n jq -e '
            .plugins[]
            | select(.type == "bridge")
            | .ipMasq == true
          ' "$cni_config" >/dev/null; then
          cni_was_unmasqueraded=true
        fi
        if sudo -n systemctl is-active --quiet k0scontroller; then
          sudo -n systemctl restart k0scontroller
        else
          sudo -n systemctl enable --now k0scontroller
        fi
        for _ in $(seq 1 120); do
          if sudo -n k0s kubectl get --raw=/readyz >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        sudo -n k0s kubectl get --raw=/readyz >/dev/null
        for _ in $(seq 1 150); do
          if sudo -n k0s kubectl get nodes -o name |
            grep -q '^node/'; then
            break
          fi
          sleep 2
        done
        sudo -n k0s kubectl get nodes -o name |
          grep -q '^node/'
        sudo -n k0s kubectl wait node --all --for=condition=Ready --timeout=5m
        for _ in $(seq 1 60); do
          if sudo -n test -s "$cni_config"; then
            break
          fi
          sleep 2
        done
        sudo -n test -s "$cni_config"
        cni_migrated="$cni_was_unmasqueraded"
        if ! sudo -n jq -e '
          .plugins[]
          | select(.type == "bridge")
          | .ipMasq == true
        ' "$cni_config" >/dev/null; then
          cni_config_next="$(mktemp)"
          sudo -n jq '
            .plugins |= map(
              if .type == "bridge"
              then .ipMasq = true
              else .
              end
            )
          ' "$cni_config" > "$cni_config_next"
          sudo -n install -m 0644 "$cni_config_next" "$cni_config"
          rm -f "$cni_config_next"
          cni_config_next=""
          cni_migrated=true
        fi
        sudo -n k0s kubectl rollout restart deployment/coredns \
          --namespace kube-system
        sudo -n k0s kubectl rollout status deployment/coredns \
          --namespace kube-system \
          --timeout=5m
        sudo -n k0s kubectl apply \
          -f "$remote_dir/infra/k0s/manifests/namespaces.yaml"
        if test "$cni_migrated" = true; then
          for deployment in \
            hive \
            hive-workbench-dispatcher \
            hive-reaper-controller; do
            if sudo -n k0s kubectl get "deployment/$deployment" \
              --namespace hive-system >/dev/null 2>&1; then
              sudo -n k0s kubectl rollout restart "deployment/$deployment" \
                --namespace hive-system
              sudo -n k0s kubectl rollout status "deployment/$deployment" \
                --namespace hive-system \
                --timeout=10m
            fi
          done
        fi
        if sudo -n test -e /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.enc; then
          sudo -n test -s /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.enc
          sudo -n test -s /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.hmac
          recovery_key="$(mktemp)"
          encrypted_backup="$(mktemp)"
          expected_mac="$(mktemp)"
          umask 077
          sudo -n awk '/secret:/ {print $2; exit}' \
            /var/lib/k0s/pki/hive-encryption-provider.yaml |
            tr -d '\r\n' > "$recovery_key"
          sudo -n cat /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.enc \
            > "$encrypted_backup"
          sudo -n cat /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.hmac \
            > "$expected_mac"
          test -s "$recovery_key"
          master_hex="$(od -An -vtx1 "$recovery_key" | tr -d ' \n')"
          mac_key_hex="$(
            printf '%s' 'nook-hive-recovery-hmac-v1' |
              openssl dgst -sha256 -mac HMAC -macopt "hexkey:$master_hex" -binary |
              od -An -vtx1 | tr -d ' \n'
          )"
          actual_mac="$(
            openssl dgst -sha256 -mac HMAC -macopt "hexkey:$mac_key_hex" \
              "$encrypted_backup" | awk '{print $NF}'
          )"
          expected_mac_value="$(tr -d '\r\n' < "$expected_mac")"
          test "$actual_mac" = "$expected_mac_value" || {
            printf '%s\n' 'Neo4j recovery snapshot authentication failed' >&2
            exit 1
          }
          sudo -n openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass "file:$recovery_key" \
            -in "$encrypted_backup" |
            sudo -n k0s kubectl apply -f -
          sudo -n rm -f \
            /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.enc \
            /var/lib/hive/k0s-recovery/neo4j-secrets.yaml.hmac
          rm -f "$recovery_key" "$encrypted_backup" "$expected_mac"
          recovery_key=""
          encrypted_backup=""
          expected_mac=""
        fi
        sudo -n k0s kubectl get secrets --all-namespaces -o json |
          sudo -n k0s kubectl replace -f -
        sudo -n k0s kubectl label node --all \
          hive.nook.sh/storage=local \
          hive.nook.sh/kata=enabled \
          --overwrite
        replace_k0s_firewall_rules committed
        sudo -n nft list chain inet bynull_filter input |
          grep -F 'iifname "kube-bridge" ip saddr 10.244.0.0/16 tcp dport { 6443, 8132, 10250 } accept comment "nook k0s pod control plane v3"' >/dev/null
        sudo -n nft list chain inet bynull_filter forward |
          grep -F 'iifname "kube-bridge" ip saddr 10.244.0.0/16 accept comment "nook k0s pod egress v3"' >/dev/null
        sudo -n k0s status
        sudo -n k0s kubectl get nodes -o wide
        firewall_rollback_armed=false
        trap - ERR HUP INT TERM EXIT
        rm -f \
          "$firewall_fragment" \
          "$firewall_config" \
          "$firewall_previous_config" \
          "$firewall_previous_fragment" \
          "$firewall_previous_live" \
          "$firewall_live_next"
        REMOTE
      - task: kubernetes:access:configure

  k0s:status:
    desc: Show k0s, node, runtime, storage, and Hive workload state.
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        persisted_firewall="$(mktemp)"
        trap 'rm -f "$persisted_firewall"' EXIT
        cat > "$persisted_firewall" <<'NFT'
        add rule inet bynull_filter input iifname "kube-bridge" ip saddr 10.244.0.0/16 tcp dport { 6443, 8132, 10250 } accept comment "nook k0s pod control plane v3"
        add rule inet bynull_filter forward iifname "kube-bridge" ip saddr 10.244.0.0/16 accept comment "nook k0s pod egress v3"
        NFT
        sudo -n k0s status
        sudo -n k0s kubectl get nodes -o wide
        sudo -n k0s kubectl get runtimeclasses
        sudo -n k0s kubectl get pv,pvc --all-namespaces
        sudo -n k0s kubectl get pods --all-namespaces -o wide
        sudo -n systemctl is-enabled --quiet nook-k0s-api-address.service
        sudo -n systemctl is-active --quiet nook-k0s-api-address.service
        sudo -n ip -4 address show dev lo |
          grep -F '{{.K0S_API_ADDRESS}}/32' >/dev/null
        sudo -n grep -Eq \
          '^[[:space:]]*include[[:space:]]+"/etc/nftables.d/nook-k0s\.nft"([[:space:]]*(#.*)?)?$' \
          /etc/nftables.conf
        sudo -n cmp --silent \
          "$persisted_firewall" \
          /etc/nftables.d/nook-k0s.nft
        sudo -n nft list chain inet bynull_filter input |
          grep -E "policy drop" >/dev/null
        sudo -n nft list chain inet bynull_filter forward |
          grep -E "policy drop" >/dev/null
        input_rules="$(sudo -n nft list chain inet bynull_filter input)"
        forward_rules="$(sudo -n nft list chain inet bynull_filter forward)"
        test "$(
          grep -Fc \
            'iifname "kube-bridge" ip saddr 10.244.0.0/16 tcp dport { 6443, 8132, 10250 } accept comment "nook k0s pod control plane v3"' \
            <<<"$input_rules"
        )" -eq 1
        test "$(
          grep -Ec \
            'comment "nook k0s pod control plane( v[0-9]+( next)?| install)?"' \
            <<<"$input_rules"
        )" -eq 1
        test "$(
          grep -Fc \
            'iifname "kube-bridge" ip saddr 10.244.0.0/16 accept comment "nook k0s pod egress v3"' \
            <<<"$forward_rules"
        )" -eq 1
        test "$(
          grep -Ec \
            'comment "nook k0s pod egress( v[0-9]+( next)?| install)?"' \
            <<<"$forward_rules"
        )" -eq 1
        REMOTE

  k0s:network:refresh:
    desc: Recreate egress-capable Pods after a k0s CNI configuration migration.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        kubectl() { sudo -n k0s kubectl "$@"; }
        kubectl rollout restart deployment/coredns \
          --namespace kube-system
        kubectl rollout status deployment/coredns \
          --namespace kube-system \
          --timeout=5m
        for deployment in hive hive-workbench-dispatcher hive-reaper-controller; do
          if kubectl get "deployment/$deployment" \
            --namespace hive-system >/dev/null 2>&1; then
            kubectl rollout restart "deployment/$deployment" \
              --namespace hive-system
            kubectl rollout status "deployment/$deployment" \
              --namespace hive-system \
              --timeout=10m
          fi
        done
        REMOTE

  k0s:diagnose:
    desc: Show bounded k0s controller diagnostics when the API is unavailable.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -u
        sudo -n systemctl status k0scontroller \
          --no-pager \
          --full || true
        sudo -n journalctl \
          --unit k0scontroller \
          --lines 200 \
          --no-pager || true
        sudo -n k0s status || true
        sudo -n ss -lntp \
          '( sport = :6443 )' || true
        sudo -n namei -l \
          /var/lib/k0s/pki/hive-encryption-provider.yaml || true
        sudo -n getfacl --absolute-names \
          /var/lib/k0s/pki/hive-encryption-provider.yaml || true
        id kube-apiserver || true
        ip -brief address || true
        sudo -n systemctl cat nftables || true
        sudo -n sed -n '1,240p' /etc/nftables.conf || true
        sudo -n nft list chain inet bynull_filter input || true
        sudo -n nft list chain inet bynull_filter forward || true
        sudo -n nft list ruleset |
          grep -E '10\.244|masquerade|CNI-' || true
        sudo -n nft list table ip nat || true
        ip route || true
        sudo -n k0s kubectl get daemonset kube-router \
          --namespace kube-system \
          -o json |
          jq '{
            initContainers: [
              .spec.template.spec.initContainers[]
              | {name, command, args, env}
            ],
            containers: [
              .spec.template.spec.containers[]
              | {name, command, args, env}
            ]
          }' || true
        sudo -n find /etc/cni /var/lib/k0s \
          -maxdepth 6 \
          -type f \
          \( -name '*.conf' -o -name '*.conflist' -o -name '*.json' \) \
          -path '*cni*' \
          -print \
          -exec sed -n '1,160p' {} \; || true
        for component in coredns metrics-server konnectivity-agent; do
          sudo -n k0s kubectl logs \
            --namespace kube-system \
            --selector "k8s-app=$component" \
            --all-containers \
            --prefix \
            --tail=100 || true
        done
        sudo -n find /var/lib/k0s/pki \
          -maxdepth 1 \
          -type f \
          -printf '%M %u %g %f\n' |
          sort || true
        ps -eo user,group,pid,args |
          grep -E '[k]ube-apiserver|[k]0s controller' || true
        REMOTE

  k0s:uninstall:
    desc: Uninstall k0s only when forced; preserve Neo4j and Zot data.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        if test "${K0S_UNINSTALL_FORCE:-}" != 1; then
          echo "Refusing destructive uninstall; set K0S_UNINSTALL_FORCE=1" >&2
          exit 64
        fi
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        recovery_dir=/var/lib/hive/k0s-recovery
        sudo -n install -d -m 0700 "$recovery_dir"
        sudo -n install -m 0600 \
          /var/lib/k0s/pki/hive-encryption-provider.yaml \
          "$recovery_dir/encryption-provider.yaml"
        secret_backup="$(mktemp)"
        trap 'rm -f "$secret_backup"' EXIT
        found_secret=false
        for secret in \
          hive-data/hive-neo4j-auth \
          hive-data/hive-neo4j-tls \
          hive-system/hive-neo4j-client \
          hive-system/hive-neo4j-ca \
          hive-system/hive-codex-auth \
          hive-system/hive-github-publication; do
          namespace="${secret%%/*}"
          name="${secret#*/}"
          if sudo -n k0s kubectl get secret "$name" \
            --namespace "$namespace" >/dev/null 2>&1; then
            if test "$found_secret" = true; then
              printf '%s\n' '---' >> "$secret_backup"
            fi
            sudo -n k0s kubectl get secret "$name" \
              --namespace "$namespace" \
              -o json |
              jq 'del(
                .metadata.uid,
                .metadata.resourceVersion,
                .metadata.creationTimestamp,
                .metadata.managedFields,
                .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"
              )' >> "$secret_backup"
            found_secret=true
          fi
        done
        if test "$found_secret" = true; then
          encrypted_backup="$(mktemp)"
          backup_mac="$(mktemp)"
          recovery_key="$(mktemp)"
          trap 'rm -f "$secret_backup" "$encrypted_backup" "$backup_mac" "$recovery_key"' EXIT
          umask 077
          sudo -n awk '/secret:/ {print $2; exit}' \
            /var/lib/k0s/pki/hive-encryption-provider.yaml > "$recovery_key"
          test -s "$recovery_key"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -pass "file:$recovery_key" \
            -in "$secret_backup" \
            -out "$encrypted_backup"
          master_hex="$(od -An -vtx1 "$recovery_key" | tr -d ' \n')"
          mac_key_hex="$(
            printf '%s' 'nook-hive-recovery-hmac-v1' |
              openssl dgst -sha256 -mac HMAC -macopt "hexkey:$master_hex" -binary |
              od -An -vtx1 | tr -d ' \n'
          )"
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$mac_key_hex" \
            "$encrypted_backup" | awk '{print $NF}' > "$backup_mac"
          sudo -n install -m 0600 \
            "$encrypted_backup" \
            "$recovery_dir/neo4j-secrets.yaml.enc"
          sudo -n install -m 0600 \
            "$backup_mac" \
            "$recovery_dir/neo4j-secrets.yaml.hmac"
        fi
        sudo -n systemctl disable --now nook-zot-registry-loopback.service \
          >/dev/null 2>&1 || true
        sudo -n rm -f \
          /etc/systemd/system/nook-zot-registry-loopback.service
        sudo -n systemctl daemon-reload
        sudo -n k0s stop
        sudo -n k0s reset
        sudo -n systemctl disable --now nook-k0s-api-address.service \
          >/dev/null 2>&1 || true
        sudo -n rm -f /etc/systemd/system/nook-k0s-api-address.service
        sudo -n systemctl daemon-reload
        sudo -n ip address del "{{.K0S_API_ADDRESS}}/32" dev lo \
          2>/dev/null || true
        sudo -n nft --handle list chain inet bynull_filter input |
          awk '/comment "nook k0s pod control plane( v[0-9]+( next)?| install)?"/ { print $NF }' |
          while read -r handle; do
            sudo -n nft delete rule inet bynull_filter input handle "$handle"
          done
        sudo -n nft --handle list chain inet bynull_filter forward |
          awk '/comment "nook k0s pod egress( v[0-9]+( next)?| install)?"/ { print $NF }' |
          while read -r handle; do
            sudo -n nft delete rule inet bynull_filter forward handle "$handle"
          done
        rm -f \
          "$secret_backup" \
          "${encrypted_backup:-}" \
          "${backup_mac:-}" \
          "${recovery_key:-}"
        trap - EXIT
        firewall_config="$(mktemp)"
        trap 'rm -f "$firewall_config"' EXIT
        sudo -n awk \
          '$0 !~ /^[[:space:]]*include[[:space:]]+"\/etc\/nftables.d\/nook-k0s\.nft"([[:space:]]*(#.*)?)?$/' \
          /etc/nftables.conf > "$firewall_config"
        sudo -n nft --check --file "$firewall_config"
        sudo -n install -m 0644 "$firewall_config" /etc/nftables.conf
        sudo -n rm -f /etc/nftables.d/nook-k0s.nft
        sudo -n nft --check --file /etc/nftables.conf
        if sudo -n nft list chain inet bynull_filter input |
          grep -F 'nook k0s pod control plane' >/dev/null; then
          echo "k0s input firewall exception survived uninstall" >&2
          exit 1
        fi
        if sudo -n nft list chain inet bynull_filter forward |
          grep -F 'nook k0s pod egress' >/dev/null; then
          echo "k0s forward firewall exception survived uninstall" >&2
          exit 1
        fi
        if sudo -n grep -E \
          '^[[:space:]]*include[[:space:]]+"/etc/nftables.d/nook-k0s\.nft"([[:space:]]*(#.*)?)?$' \
          /etc/nftables.conf >/dev/null; then
          echo "k0s firewall include survived uninstall" >&2
          exit 1
        fi
        rm -f "$firewall_config"
        trap - EXIT
        test -d /var/lib/hive/neo4j
        test -d /var/lib/hive/zot
        echo "k0s removed; retained /var/lib/hive/neo4j and /var/lib/hive/zot"
        REMOTE
        BASH

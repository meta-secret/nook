version: '3'

vars:
  ARC_CHART_VERSION: 0.14.2
  ARC_CONTROLLER_CHART: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
  ARC_RUNNER_CHART: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
  ARC_RUNNER_LABEL: nook-k0s

tasks:
  arc:auth:sync:
    internal: true
    deps: [k0s:sync]
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        token_file="${ARC_GITHUB_TOKEN_FILE:-}"
        if test -z "$token_file"; then
          ssh -o BatchMode=yes "$ssh_target" \
            "sudo -n k0s kubectl get secret nook-arc-github --namespace arc-runners >/dev/null"
          echo "Existing ARC repository credential retained; set ARC_GITHUB_TOKEN_FILE to rotate it"
          exit 0
        fi
        test -f "$token_file"
        test -s "$token_file"
        remote_command='set -euo pipefail
        remote_dir="$1"
        raw_credential_file="$(mktemp)"
        credential_file="$(mktemp)"
        cleanup() { rm -f "$raw_credential_file" "$credential_file"; }
        trap cleanup EXIT
        cat > "$raw_credential_file"
        tr -d "\r\n" < "$raw_credential_file" > "$credential_file"
        test -s "$credential_file"
        test "$(wc -c < "$credential_file" | tr -d " ")" -ge 20
        if grep -q "[[:space:]]" "$credential_file"; then
          echo "ARC GitHub credential contains whitespace" >&2
          exit 1
        fi
        sudo -n k0s kubectl apply -f "$remote_dir/infra/k0s/manifests/namespaces.yaml" >/dev/null
        sudo -n k0s kubectl create secret generic nook-arc-github \
          --namespace arc-runners \
          --from-file=github_token="$credential_file" \
          --dry-run=client -o yaml | sudo -n k0s kubectl apply -f - >/dev/null'
        encoded_program="$(printf '%s' "$remote_command" | base64 | tr -d '\n')"
        encoded_dir="$(printf '%s' "$remote_dir" | base64 | tr -d '\n')"
        printf -v ssh_command 'bash -c "$(printf %%s %s | base64 -d)" -- "$(printf %%s %s | base64 -d)"' \
          "$encoded_program" "$encoded_dir"
        ssh -o BatchMode=yes "$ssh_target" "$ssh_command" < "$token_file"
        echo "ARC repository credential synchronized to the encrypted k0s Secret"
        BASH

  arc:render:check:
    desc: Render pinned ARC and verify the private microVM-builder contract.
    deps: [k0s:sync]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        chart_version="{{.ARC_CHART_VERSION}}"
        controller_render="$(mktemp)"
        runner_render="$(mktemp)"
        cleanup() { rm -f "$controller_render" "$runner_render"; }
        trap cleanup EXIT

        helm template nook-arc \
          "{{.ARC_CONTROLLER_CHART}}" \
          --version "$chart_version" \
          --namespace arc-systems \
          --values "$remote_dir/infra/k0s/manifests/arc/controller-values.yaml" \
          > "$controller_render"
        helm template nook-k0s \
          "{{.ARC_RUNNER_CHART}}" \
          --version "$chart_version" \
          --namespace arc-runners \
          --values "$remote_dir/infra/k0s/manifests/arc/runner-scale-set-values.yaml" \
          > "$runner_render"

        grep -A1 'runtimeClassName:' "$runner_render" | grep -q 'kata-qemu-runtime-rs'
        grep -A1 'automountServiceAccountToken:' "$runner_render" | grep -q 'false'
        grep -q 'tcp://127.0.0.1:1234' "$runner_render"
        grep -q 'localhost/nook-arc-buildkit:0.32.2-ext4-v3' "$runner_render"
        grep -q 'imagePullPolicy: Never' "$runner_render"
        grep -q -- '--oci-worker-snapshotter' "$runner_render"
        grep -q -- '- overlayfs' "$runner_render"
        grep -q 'restartPolicy: Always' "$runner_render"
        grep -q 'privileged: true' "$runner_render"
        grep -q -- '- "80000"' "$runner_render"
        grep -q 'sizeLimit: 100Gi' "$runner_render"
        if grep -Eq 'docker:dind|dockerd|docker\.sock|hostPath:|sysbox|containerMode:' "$runner_render"; then
          echo "Rendered ARC runner violates the no-nested-engine contract" >&2
          exit 1
        fi
        grep -q 'kind: Deployment' "$controller_render"
        grep -q 'kind: AutoscalingRunnerSet' "$runner_render"
        echo "Pinned ARC render satisfies the private microVM-builder contract"
        REMOTE

  arc:buildkit:image:sync:
    internal: true
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        temp_dir="$(mktemp -d)"
        artifact="$temp_dir/nook-arc-buildkit.tar"
        cleanup() { rm -rf "$temp_dir"; }
        trap cleanup EXIT

        docker buildx build \
          --platform linux/amd64 \
          --provenance=false \
          --tag localhost/nook-arc-buildkit:0.32.2-ext4-v3 \
          --output "type=oci,dest=$artifact" \
          infra/k0s/images/arc-buildkit
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
          'sudo -n k0s ctr --namespace k8s.io images import -' \
          < "$artifact"
        echo "Imported the pinned ARC BuildKit wrapper into k0s containerd"
        BASH

  arc:deploy:
    desc: Install pinned ARC and the bounded Kata-backed Nook runner scale set.
    silent: true
    cmds:
      - task: arc:buildkit:image:sync
      - task: arc:render:check
      - task: arc:auth:sync
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        chart_version="{{.ARC_CHART_VERSION}}"
        controller_chart="{{.ARC_CONTROLLER_CHART}}"
        runner_chart="{{.ARC_RUNNER_CHART}}"
        kubeconfig="$(mktemp)"
        trap 'rm -f "$kubeconfig"' EXIT
        sudo -n k0s kubeconfig admin > "$kubeconfig"
        chmod 0600 "$kubeconfig"
        export KUBECONFIG="$kubeconfig"
        kubectl() { sudo -n k0s kubectl "$@"; }

        kubectl apply -f "$remote_dir/infra/k0s/manifests/namespaces.yaml"
        kubectl get runtimeclass kata-qemu-runtime-rs >/dev/null
        kubectl get secret nook-arc-github --namespace arc-runners >/dev/null

        helm upgrade --install nook-arc \
          "$controller_chart" \
          --version "$chart_version" \
          --namespace arc-systems \
          --values "$remote_dir/infra/k0s/manifests/arc/controller-values.yaml" \
          --wait \
          --timeout 10m

        # The controller caches its GitHub client. Restart after credential sync
        # so rotation cannot leave an old Authorization value in memory.
        kubectl rollout restart deployment/nook-arc-gha-rs-controller \
          --namespace arc-systems
        kubectl rollout status deployment/nook-arc-gha-rs-controller \
          --namespace arc-systems --timeout=10m

        kubectl apply -f "$remote_dir/infra/k0s/manifests/arc/network-policy.yaml"
        # Remove the superseded shared builder before installing the private
        # per-microVM sidecar topology.
        kubectl delete deployment nook-arc-buildkit \
          --namespace arc-runners --ignore-not-found
        kubectl delete service nook-arc-buildkit \
          --namespace arc-runners --ignore-not-found
        kubectl delete networkpolicy arc-runner-to-buildkit \
          --namespace arc-runners --ignore-not-found

        helm upgrade --install nook-k0s \
          "$runner_chart" \
          --version "$chart_version" \
          --namespace arc-runners \
          --values "$remote_dir/infra/k0s/manifests/arc/runner-scale-set-values.yaml" \
          --wait \
          --timeout 10m

        # Helm --wait covers the chart-owned AutoscalingRunnerSet, but not the
        # listener and EphemeralRunnerSet that ARC creates asynchronously. An
        # eventual update deliberately drains the old scale set first, so do
        # not return while GitHub jobs could still target that transition.
        # Require six consecutive samples so a transient Running phase cannot
        # pass the gate while reconciliation is still converging.
        arc_ready=false
        ready_samples=0
        for _ in $(seq 1 120); do
          phase="$(
            kubectl get autoscalingrunnerset nook-k0s \
              --namespace arc-runners \
              -o jsonpath='{.status.phase}' 2>/dev/null || true
          )"
          listener="$(
            kubectl get autoscalinglistener \
              --namespace arc-systems \
              -l actions.github.com/scale-set-name=nook-k0s \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true
          )"
          ephemeral_runner_set="$(
            kubectl get ephemeralrunnerset \
              --namespace arc-runners \
              -l actions.github.com/scale-set-name=nook-k0s \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true
          )"
          if test "$phase" = Running &&
             test -n "$listener" &&
             test -n "$ephemeral_runner_set" &&
             kubectl wait pod \
               --namespace arc-systems \
               -l actions.github.com/scale-set-name=nook-k0s,app.kubernetes.io/component=runner-scale-set-listener \
               --for=condition=Ready \
               --timeout=1s >/dev/null 2>&1; then
            ready_samples=$((ready_samples + 1))
            if test "$ready_samples" -ge 6; then
              arc_ready=true
              break
            fi
          else
            ready_samples=0
          fi
          sleep 5
        done
        if test "$arc_ready" != true; then
          echo "ARC scale set did not become dispatch-ready within 10 minutes" >&2
          kubectl get autoscalingrunnerset,ephemeralrunnerset \
            --namespace arc-runners -o wide >&2 || true
          kubectl get autoscalinglistener,pods \
            --namespace arc-systems -o wide >&2 || true
          exit 1
        fi

        kubectl get autoscalingrunnerset nook-k0s \
          --namespace arc-runners \
          -o jsonpath='{.metadata.name}{" max="}{.spec.maxRunners}{"\n"}'
        echo "ARC scale set is dispatch-ready"
        REMOTE

  arc:activate:
    desc: Route opted-in workflows to the Nook ARC scale set.
    preconditions:
      - sh: gh auth status >/dev/null 2>&1
        msg: GitHub CLI must be authenticated.
    cmds:
      - gh variable set NOOK_RUNS_ON --repo meta-secret/nook --body "{{.ARC_RUNNER_LABEL}}"
      - echo "Opted-in workflows now target {{.ARC_RUNNER_LABEL}}"

  arc:fallback:
    desc: Route opted-in workflows back to GitHub-hosted capacity.
    preconditions:
      - sh: gh auth status >/dev/null 2>&1
        msg: GitHub CLI must be authenticated.
    cmds:
      - gh variable set NOOK_RUNS_ON --repo meta-secret/nook --body ubuntu-latest
      - echo "Opted-in workflows now target ubuntu-latest"

  arc:status:
    desc: Show bounded ARC controller, listener, scale-set, and runner state.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        kubectl() { sudo -n k0s kubectl "$@"; }
        kubectl get deployment --namespace arc-systems -o wide
        kubectl get networkpolicy --namespace arc-runners -o wide
        kubectl get autoscalingrunnerset,ephemeralrunnerset \
          --namespace arc-runners -o wide
        kubectl get autoscalinglistener --namespace arc-systems -o wide
        kubectl get pods --namespace arc-systems -o wide
        kubectl get pods --namespace arc-runners -o wide
        REMOTE

  arc:diagnose:
    desc: Show bounded ARC events and recent controller/listener logs.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        kubectl() { sudo -n k0s kubectl "$@"; }
        kubectl get events --namespace arc-systems \
          --sort-by=.metadata.creationTimestamp | tail -n 40
        kubectl get events --namespace arc-runners \
          --sort-by=.metadata.creationTimestamp | tail -n 60
        kubectl logs deployment/nook-arc-gha-rs-controller \
          --namespace arc-systems --tail=120 || true
        listener="$(kubectl get pods --namespace arc-systems \
          -l app.kubernetes.io/component=runner-scale-set-listener \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
        if test -n "$listener"; then
          kubectl logs "$listener" --namespace arc-systems --tail=120 || true
        fi
        REMOTE

  arc:smoke:
    desc: Run repository preflight on the exact branch through ARC.
    cmds:
      - |
        selected_runner="$(
          gh variable get NOOK_RUNS_ON \
            --repo meta-secret/nook
        )"
        if test "$selected_runner" != "{{.ARC_RUNNER_LABEL}}"; then
          echo "ARC smoke requires NOOK_RUNS_ON={{.ARC_RUNNER_LABEL}}; got $selected_runner" >&2
          exit 2
        fi
      - |
        set -euo pipefail
        smoke_ref="$(git branch --show-current)"
        if test -z "$smoke_ref"; then
          echo "ARC smoke requires a named, pushed branch." >&2
          exit 2
        fi
        head_sha="$(git rev-parse HEAD)"
        remote_sha="$(
          git ls-remote --refs origin "refs/heads/$smoke_ref" |
            awk 'NR == 1 { print $1 }'
        )"
        if test "$remote_sha" != "$head_sha"; then
          echo "ARC smoke requires $smoke_ref to be pushed at the local HEAD." >&2
          echo "local:  $head_sha" >&2
          echo "remote: ${remote_sha:-missing}" >&2
          exit 2
        fi
        known_run_ids="$(
          gh run list \
            --repo meta-secret/nook \
            --workflow remote.yml \
            --branch "$smoke_ref" \
            --event workflow_dispatch \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId'
        )"
        gh workflow run remote.yml \
          --repo meta-secret/nook \
          --ref "$smoke_ref" \
          --raw-field "tasks=preflight"
        run_id=""
        for _ in $(seq 1 30); do
          while IFS= read -r candidate; do
            if test -n "$candidate" &&
               ! printf '%s\n' "$known_run_ids" | grep -Fxq "$candidate"; then
              run_id="$candidate"
              break
            fi
          done < <(
            gh run list \
              --repo meta-secret/nook \
              --workflow remote.yml \
              --branch "$smoke_ref" \
              --event workflow_dispatch \
              --limit 100 \
              --json databaseId \
              --jq '.[].databaseId'
          )
          test -n "$run_id" && break
          sleep 2
        done
        test -n "$run_id"
        dispatched_sha="$(
          gh run view "$run_id" \
            --repo meta-secret/nook \
            --json headSha \
            --jq .headSha
        )"
        if test "$dispatched_sha" != "$head_sha"; then
          echo "ARC smoke branch moved before dispatch: expected $head_sha, got $dispatched_sha" >&2
          gh api --method POST \
            "repos/meta-secret/nook/actions/runs/$run_id/force-cancel" \
            >/dev/null 2>&1 || true
          exit 1
        fi
        cancel_run() {
          gh api --method POST \
            "repos/meta-secret/nook/actions/runs/$run_id/force-cancel" \
            >/dev/null 2>&1 ||
            gh run cancel "$run_id" --repo meta-secret/nook || true
        }
        runner_name=""
        runner_uid=""
        missing_runner_samples=0
        for _ in $(seq 1 500); do
          run_state="$(
            gh run view "$run_id" \
              --repo meta-secret/nook \
              --json status,conclusion \
              --jq '[.status, (.conclusion // "")] | @tsv'
          )"
          status="${run_state%%$'\t'*}"
          conclusion="${run_state#*$'\t'}"
          if test "$status" = completed; then
            if test "$conclusion" != success; then
              echo "ARC smoke run $run_id completed with $conclusion" >&2
              exit 1
            fi
            break
          fi

          discovered_runner="$(
            gh api "repos/meta-secret/nook/actions/runs/$run_id/jobs" \
              --jq '.jobs[] | select(.name == "Remote / preflight") | .runner_name // empty'
          )"
          if test -n "$discovered_runner"; then
            runner_name="$discovered_runner"
            case "$runner_name" in
              nook-k0s-*) ;;
              *)
                echo "ARC smoke received an unexpected runner name: $runner_name" >&2
                cancel_run
                exit 1
                ;;
            esac
            pod_identity="$(
              ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
                "sudo -n k0s kubectl get pod --namespace arc-runners '$runner_name' -o jsonpath='{.metadata.uid}:{.status.phase}' 2>/dev/null" || true
            )"
            current_uid="${pod_identity%%:*}"
            pod_state="${pod_identity#*:}"
            if test -z "$pod_identity"; then
              missing_runner_samples=$((missing_runner_samples + 1))
            else
              missing_runner_samples=0
              if test -z "$runner_uid"; then
                runner_uid="$current_uid"
              elif test "$current_uid" != "$runner_uid"; then
                echo "ARC replaced assigned runner $runner_name during smoke run $run_id" >&2
                cancel_run
                ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
                  "sudo -n k0s kubectl delete ephemeralrunner --namespace arc-runners '$runner_name' --ignore-not-found" || true
                exit 1
              fi
            fi
            case "$pod_state" in
              Failed*)
                echo "ARC runner $runner_name failed after accepting smoke run $run_id" >&2
                cancel_run
                ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
                  "sudo -n k0s kubectl delete ephemeralrunner --namespace arc-runners '$runner_name' --ignore-not-found" || true
                exit 1
                ;;
            esac
            if ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
                 "sudo -n k0s kubectl logs --namespace arc-runners '$runner_name' --container runner --tail=80 2>/dev/null" |
               grep -Fq 'A session for this runner already exists.'; then
              echo "ARC runner $runner_name hit a stale JIT session during smoke run $run_id" >&2
              cancel_run
              ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
                "sudo -n k0s kubectl delete ephemeralrunner --namespace arc-runners '$runner_name' --ignore-not-found" || true
              exit 1
            fi
            if test "$missing_runner_samples" -ge 3; then
              echo "ARC runner $runner_name disappeared after accepting smoke run $run_id" >&2
              cancel_run
              ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" \
                "sudo -n k0s kubectl delete ephemeralrunner --namespace arc-runners '$runner_name' --ignore-not-found" || true
              exit 1
            fi
          fi
          sleep 3
        done
        final_status="$(
          gh run view "$run_id" --repo meta-secret/nook --json status --jq .status
        )"
        if test "$final_status" != completed; then
          echo "ARC smoke run $run_id did not complete within 25 minutes" >&2
          cancel_run
          exit 1
        fi
        if ! gh api \
          "repos/meta-secret/nook/actions/runs/$run_id/jobs" \
          --jq '.jobs[] | select(.name == "Remote / preflight") | .labels[]' |
          grep -Fxq "{{.ARC_RUNNER_LABEL}}"; then
          echo "Successful smoke run did not report the ARC scale-set label" >&2
          exit 1
        fi
        echo "ARC smoke run $run_id completed on {{.ARC_RUNNER_LABEL}}"

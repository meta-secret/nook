version: '3'

vars:
  ARC_CHART_VERSION: 0.14.2
  ARC_CONTROLLER_CHART: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
  ARC_RUNNER_CHART: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
  ARC_RUNNER_LABEL: nook-k0s
  ARC_HIVE_RUNNER_LABEL: nook-k0s-hive
  ARC_SMOKE_TASK: '{{default "preflight" .ARC_SMOKE_TASK}}'
  ARC_SMOKE_JOB_NAME: '{{default "Remote / preflight" .ARC_SMOKE_JOB_NAME}}'
  ARC_SMOKE_RUNNER_LABEL: '{{default "nook-k0s" .ARC_SMOKE_RUNNER_LABEL}}'

tasks:
  arc:controller-build:prepare:
    internal: true
    silent: true
    cmds:
      - |
        controller_target="{{.INFRA_SSH_TARGET}}"
        controller_ssh_user="$(ssh -n -o BatchMode=yes "$controller_target" 'id -un')"
        if ! [[ "$controller_ssh_user" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
          echo "ARC controller has an invalid SSH user" >&2
          exit 2
        fi
        ssh -o BatchMode=yes "$controller_target" bash -s -- \
          "$controller_ssh_user" <<'REMOTE'
        set -euo pipefail
        controller_ssh_user="$1"
        kubectl() { sudo -n k0s kubectl "$@"; }
        node="$(kubectl get nodes \
          -l nook.nokey.sh/node-role=control-storage \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
        if test "$(printf '%s\n' "$node" | sed '/^$/d' | wc -l | tr -d ' ')" != 1; then
          echo "ARC requires exactly one control-storage node" >&2
          exit 1
        fi
        node="$(printf '%s\n' "$node" | sed '/^$/d')"
        test "$(kubectl get node "$node" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')" = True
        internal_ip="$(kubectl get node "$node" \
          -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')"
        test -n "$internal_ip"
        kubectl taint node "$node" \
          nook.nokey.sh/arc-build=preparing:NoSchedule --overwrite
        kubectl label node "$node" \
          nook.nokey.sh/arc-build=true \
          nook.nokey.sh/arc-tier=overflow \
          --overwrite
        kubectl annotate node "$node" \
          "nook.nokey.sh/ssh-target=$controller_ssh_user@$internal_ip" \
          "nook.nokey.sh/infra-remote-dir={{.INFRA_REMOTE_DIR}}" \
          --overwrite
        echo "ARC controller build node $node is qualified and held for convergence"
        REMOTE

  arc:build-hosts:activate:
    internal: true
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        controller_target="{{.INFRA_SSH_TARGET}}"
        targets_file="$HOME/.nook/infra/arc-build-ssh-targets"
        expected_file="infra/k0s/config/arc-build-nodes"
        expected_count="$(awk 'NF { count += 1 } END { print count + 0 }' "$expected_file")"
        target_count="$(awk 'NF { count += 1 } END { print count + 0 }' "$targets_file")"
        if test "$target_count" != "$expected_count"; then
          echo "ARC requires exactly $expected_count build hosts; found $target_count" >&2
          exit 1
        fi
        while IFS=$'\t' read -r build_target build_remote_dir; do
          test -n "$build_target"
          test -n "$build_remote_dir"
          node="$(ssh -o BatchMode=yes "$controller_target" 'bash -s' -- "$build_target" <<'REMOTE'
        set -euo pipefail
        build_target="$1"
        sudo -n k0s kubectl get nodes -l nook.nokey.sh/arc-build=true -o json |
          jq -r --arg target "$build_target" \
            '.items[] | select(.metadata.annotations["nook.nokey.sh/ssh-target"] == $target) | .metadata.name'
        REMOTE
          )"
          test "$(printf '%s\n' "$node" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          node="$(printf '%s\n' "$node" | sed '/^$/d')"
          ssh -o BatchMode=yes "$controller_target" 'bash -s' -- "$node" <<'REMOTE'
        set -euo pipefail
        node="$1"
        sudo -n k0s kubectl taint node "$node" \
          nook.nokey.sh/arc-build=preparing:NoSchedule- >/dev/null 2>&1 || true
        test -z "$(sudo -n k0s kubectl get node "$node" \
          -o jsonpath='{.spec.taints[?(@.key=="nook.nokey.sh/arc-build")].effect}')"
        REMOTE
          echo "ARC build node $node is active"
        done < "$HOME/.nook/infra/arc-build-ssh-targets"
        BASH


  arc:build-host:resolve:
    desc: Resolve and persist every Kubernetes ARC build SSH target.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        controller_target="{{.INFRA_SSH_TARGET}}"
        inventory="$(ssh -o BatchMode=yes "$controller_target" 'bash -s' <<'REMOTE'
        set -euo pipefail
        kubectl() { sudo -n k0s kubectl "$@"; }
        build_nodes="$(kubectl get nodes -l nook.nokey.sh/arc-build=true -o json)"
        build_count="$(jq '.items | length' <<<"$build_nodes")"
        if test "$build_count" -lt 1; then
          echo "ARC has no qualified build node" >&2
          exit 1
        fi
        jq -r '.items | sort_by(.metadata.name)[] |
          [.metadata.name, .metadata.annotations["nook.nokey.sh/ssh-target"], ([.status.addresses[]? | select(.type == "InternalIP") | .address] | if length == 1 then .[0] else "" end), .metadata.annotations["nook.nokey.sh/infra-remote-dir"]] | @tsv' \
          <<<"$build_nodes"
        REMOTE
        )"
        test -n "$inventory"
        target_dir="$HOME/.nook/infra"
        inventory_file="$target_dir/arc-build-ssh-targets"
        install -d -m 0700 "$HOME/.nook" "$target_dir"
        umask 077
        inventory_next="$(mktemp "$inventory_file.next.XXXXXX")"
        cleanup() { rm -f "$inventory_next"; }
        trap cleanup EXIT
        : > "$inventory_next"
        while IFS=$'\t' read -r node target internal_ip remote_dir; do
          user="$(printf '%s' "$target" | cut -d@ -f1)"
          host="$(printf '%s' "$target" | cut -d@ -f2-)"
          if test "$user" = "$target" || test -z "$user" || test -z "$host"; then
            echo "ARC build node $node lacks a usable SSH target" >&2
            exit 1
          fi
          case "$user:$host" in
            *[!A-Za-z0-9_.:-]*|*:*@*)
              echo "ARC build node $node resolved an unsafe SSH target" >&2
              exit 1
              ;;
          esac
          if test -z "$internal_ip" || test "$host" != "$internal_ip"; then
            echo "ARC build node $node SSH host does not match its Kubernetes InternalIP" >&2
            exit 1
          fi
          if ! ssh -n -o BatchMode=yes -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=accept-new -J "$controller_target" "$target" true; then
            ssh -n -o BatchMode=yes "$controller_target" \
              "sudo -n k0s kubectl taint node '$node' 'nook.nokey.sh/arc-build=preparing:NoSchedule' --overwrite >/dev/null"
            echo "Deferred offline ARC node $node ($target)" >&2
            continue
          fi
          if test -z "$remote_dir"; then
            remote_dir="$(ssh -n -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -J "$controller_target" "$target" \
              'printf "%s\n" "$HOME/.local/share/nook-infra"')"
          fi
          if ! [[ "$remote_dir" =~ ^/[A-Za-z0-9_./-]+$ ]]; then
            echo "ARC build node $node lacks a safe remote infrastructure directory" >&2
            exit 1
          fi
          printf '%s\t%s\n' "$target" "$remote_dir" >> "$inventory_next"
          ssh -n -o BatchMode=yes "$controller_target" \
            "sudo -n k0s kubectl annotate node '$node' 'nook.nokey.sh/ssh-target=$target' 'nook.nokey.sh/infra-remote-dir=$remote_dir' --overwrite >/dev/null"
        done <<< "$inventory"
        test -s "$inventory_next"
        test "$(sort -u "$inventory_next" | wc -l | tr -d ' ')" = "$(wc -l < "$inventory_next" | tr -d ' ')"
        mv "$inventory_next" "$inventory_file"
        trap - EXIT
        chmod 0600 "$inventory_file"
        echo "ARC build SSH inventory persisted at $inventory_file"
        BASH
  arc:build-host:sync:
    internal: true
    deps: [k0s:sync, arc:build-host:resolve]
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        controller_target="{{.INFRA_SSH_TARGET}}"
        repo_root="$(git rev-parse --show-toplevel)"
        while IFS=$'\t' read -r build_target build_remote_dir; do
          test -n "$build_target"
          test -n "$build_remote_dir"
          ssh -n -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -J "$controller_target" "$build_target" \
            "install -d -m 0750 '$build_remote_dir'"
          COPYFILE_DISABLE=1 tar --no-xattrs -C "$repo_root" -cf - infra/k0s |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -J "$controller_target" "$build_target" \
              "tar -xf - -C '$build_remote_dir'"
        done < "$HOME/.nook/infra/arc-build-ssh-targets"
        BASH

  arc:auth:sync:
    internal: true
    deps: [k0s:sync]
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        credential_dir="$HOME/.nook/github"
        credential_store="$credential_dir/arc-controller-token"
        token_file="${ARC_GITHUB_TOKEN_FILE:-$credential_store}"
        install -d -m 0700 "$HOME/.nook" "$credential_dir"
        if test -n "${ARC_GITHUB_TOKEN_FILE:-}"; then
          test -s "$ARC_GITHUB_TOKEN_FILE"
          install -m 0600 "$ARC_GITHUB_TOKEN_FILE" "$credential_store"
          token_file="$credential_store"
        elif ! test -s "$credential_store"; then
          credential_temp="$(mktemp)"
          cleanup_local() { rm -f "$credential_temp"; }
          trap cleanup_local EXIT
          if ! ssh -o BatchMode=yes "$ssh_target" \
            "sudo -n k0s kubectl get secret nook-arc-github --namespace arc-runners -o jsonpath='{.data.github_token}'" \
            | base64 -d > "$credential_temp"; then
            echo "ARC repository credential is not installed; set ARC_GITHUB_TOKEN_FILE to bootstrap it" >&2
            exit 2
          fi
          test -s "$credential_temp"
          install -m 0600 "$credential_temp" "$credential_store"
          cleanup_local
          trap - EXIT
          token_file="$credential_store"
        fi
        test -f "$token_file"
        test -s "$token_file"
        remote_command='set -euo pipefail
        remote_dir="$1"
        raw_credential_file="$(mktemp)"
        credential_file="$(mktemp)"
        cleanup() { rm -f "$raw_credential_file" "$credential_file"; }
        trap cleanup EXIT
        cat > "$raw_credential_file"
        tr -d "\r\n" < "$raw_credential_file" > "$credential_file"
        test -s "$credential_file"
        test "$(wc -c < "$credential_file" | tr -d " ")" -ge 20
        if grep -q "[[:space:]]" "$credential_file"; then
          echo "ARC GitHub credential contains whitespace" >&2
          exit 1
        fi
        sudo -n k0s kubectl apply -f "$remote_dir/infra/k0s/manifests/namespaces.yaml" >/dev/null
        sudo -n k0s kubectl create secret generic nook-arc-github \
          --namespace arc-runners \
          --from-file=github_token="$credential_file" \
          --dry-run=client -o yaml | sudo -n k0s kubectl apply -f - >/dev/null'
        encoded_program="$(printf '%s' "$remote_command" | base64 | tr -d '\n')"
        encoded_dir="$(printf '%s' "$remote_dir" | base64 | tr -d '\n')"
        printf -v ssh_command 'bash -c "$(printf %%s %s | base64 -d)" -- "$(printf %%s %s | base64 -d)"' \
          "$encoded_program" "$encoded_dir"
        ssh -o BatchMode=yes "$ssh_target" "$ssh_command" < "$token_file"
        echo "ARC credential persisted under ~/.nook and synchronized to the encrypted k0s Secret"
        BASH


  arc:buildkit:storage:prepare:
    internal: true
    deps: [arc:build-host:sync]
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        controller_target="{{.INFRA_SSH_TARGET}}"
        targets_file="$HOME/.nook/infra/arc-build-ssh-targets"
        expected_file="infra/k0s/config/arc-build-nodes"
        expected_count="$(awk 'NF { count += 1 } END { print count + 0 }' "$expected_file")"
        target_count="$(awk 'NF { count += 1 } END { print count + 0 }' "$targets_file")"
        if test "$target_count" != "$expected_count"; then
          echo "ARC requires exactly $expected_count build hosts; found $target_count" >&2
          exit 1
        fi
        while IFS=$'\t' read -r build_target build_remote_dir; do
          test -n "$build_target"
          test -n "$build_remote_dir"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -J "$controller_target" "$build_target" 'bash -s' <<'REMOTE'
        set -euo pipefail
        pool_root=/var/lib/nook-arc-buildkit
        state_dir="$pool_root/state"
        legacy_pool="$pool_root/pool"
        legacy_image="$pool_root/pool.btrfs"
        legacy_image_next="$pool_root/pool.btrfs.next"
        legacy_mount_unit="$(systemd-escape --path --suffix=mount "$legacy_pool")"
        sudo -n install -d -o 1000 -g 1000 -m 0700 "$state_dir"
        filesystem_bytes="$(df --output=size -B1 "$state_dir" | tail -n 1 | tr -d ' ')"
        available_bytes="$(df --output=avail -B1 "$state_dir" | tail -n 1 | tr -d ' ')"
        # Active BuildKit GC can remove a snapshot between du's directory scan
        # and stat. du still prints the aggregate; do not turn that harmless
        # race into a failed cluster convergence.
        state_bytes="$(sudo -n du -s -B1 "$state_dir" 2>/dev/null | awk '{ print $1 }' || true)"
        state_bytes="${state_bytes:-0}"
        legacy_bytes=0
        for legacy_path in "$legacy_image" "$legacy_image_next"; do
          if sudo -n test -e "$legacy_path"; then
            path_bytes="$(sudo -n du -s -B1 "$legacy_path" | awk '{ print $1 }')"
            legacy_bytes=$((legacy_bytes + path_bytes))
          fi
        done
        usable_bytes=$((available_bytes + state_bytes + legacy_bytes))
        test "$filesystem_bytes" -ge 68719476736
        if test "$usable_bytes" -lt 68719476736; then
          echo "ARC BuildKit storage needs 64 GiB of free, retained-state, or reclaimable legacy bytes" >&2
          exit 1
        fi
        sudo -n systemctl disable --now nook-arc-buildkit-cloner.service \
          >/dev/null 2>&1 || true
        sudo -n systemctl disable --now "$legacy_mount_unit" \
          >/dev/null 2>&1 || true
        if sudo -n mountpoint -q "$legacy_pool"; then
          sudo -n umount "$legacy_pool"
        fi
        for legacy_loop in $(sudo -n losetup -j "$legacy_image" -O NAME --noheadings 2>/dev/null); do
          sudo -n losetup -d "$legacy_loop"
        done
        sudo -n rm -f -- \
          /etc/systemd/system/nook-arc-buildkit-cloner.service \
          "/etc/systemd/system/$legacy_mount_unit" \
          /usr/local/sbin/nook-arc-buildkit-cloner \
          /etc/nook/arc-cache-verifier-token \
          "$legacy_image" \
          "$legacy_image_next"
        sudo -n rmdir "$legacy_pool" 2>/dev/null || true
        sudo -n systemctl daemon-reload
        test "$(sudo -n stat -c %u "$state_dir")" = 1000
        test "$(sudo -n stat -c %g "$state_dir")" = 1000
        available_bytes="$(df --output=avail -B1 "$state_dir" | tail -n 1 | tr -d ' ')"
        state_bytes="$(sudo -n du -s -B1 "$state_dir" 2>/dev/null | awk '{ print $1 }' || true)"
        state_bytes="${state_bytes:-0}"
        test "$((available_bytes + state_bytes))" -ge 68719476736
        REMOTE
        done < "$targets_file"
        BASH

  arc:render:check:
    desc: Render ARC and verify the regular-runner persistent-BuildKit contract.
    deps: [k0s:sync]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        chart_version="{{.ARC_CHART_VERSION}}"
        controller_render="$(mktemp)"
        runner_render="$(mktemp)"
        container_render="$(mktemp)"
        hive_values="$(mktemp)"
        hive_render="$(mktemp)"
        trap 'rm -f "$controller_render" "$runner_render" "$container_render" "$hive_values" "$hive_render"' EXIT

        ruby "$remote_dir/infra/k0s/scripts/arc-hive-values.rb" \
          "$remote_dir/infra/k0s/manifests/arc/runner-scale-set-values.yaml" \
          "$hive_values"
        helm template nook-arc \
          "{{.ARC_CONTROLLER_CHART}}" \
          --version "$chart_version" \
          --namespace arc-systems \
          --values "$remote_dir/infra/k0s/manifests/arc/controller-values.yaml" \
          > "$controller_render"
        helm template nook-k0s \
          "{{.ARC_RUNNER_CHART}}" \
          --version "$chart_version" \
          --namespace arc-runners \
          --values "$remote_dir/infra/k0s/manifests/arc/runner-scale-set-values.yaml" \
          > "$runner_render"
        helm template nook-k0s-hive \
          "{{.ARC_RUNNER_CHART}}" \
          --version "$chart_version" \
          --namespace arc-runners \
          --values "$hive_values" \
          > "$hive_render"
        helm template nook-k0s-container \
          "{{.ARC_RUNNER_CHART}}" \
          --version "$chart_version" \
          --namespace arc-runners \
          --values "$remote_dir/infra/k0s/manifests/arc/container-runner-scale-set-values.yaml" \
          > "$container_render"
        grep -q 'kind: Deployment' "$controller_render"
        grep -q 'kind: AutoscalingRunnerSet' "$runner_render"
        grep -q 'kind: AutoscalingRunnerSet' "$hive_render"
        grep -q 'kind: AutoscalingRunnerSet' "$container_render"
        grep -q 'ACTIONS_RUNNER_CONTAINER_HOOKS' "$container_render"
        grep -q 'ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE' "$container_render"
        grep -q 'nook-k0s-container' "$container_render"
        grep -q 'tcp://nook-buildkit.arc-runners.svc.cluster.local:1234' "$runner_render"
        if grep -Eq 'runtimeClassName:|docker:dind|dockerd|docker\.sock|podman|privileged: true|hostPath:' "$runner_render" "$hive_render"; then
          echo "Rendered ARC runner violates the regular-pod rootless-BuildKit contract" >&2
          exit 1
        fi
        sudo -n k0s kubectl apply --dry-run=client \
          -f "$remote_dir/infra/k0s/manifests/arc/buildkit.yaml" >/dev/null
        sudo -n k0s kubectl apply --dry-run=client \
          -f "$remote_dir/infra/k0s/manifests/arc/container-hook.yaml" >/dev/null
        echo "Pinned ARC renders satisfy the regular-pod persistent-BuildKit contract"
        REMOTE

  arc:deploy:
    desc: Install ARC runners and one persistent rootless BuildKit shard per build node.
    silent: true
    cmds:
      - task: arc:auth:sync
      - task: arc:controller-build:prepare
      - task: arc:build-host:resolve
      - task: arc:buildkit:storage:prepare
      - task: arc:render:check
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        chart_version="{{.ARC_CHART_VERSION}}"
        controller_chart="{{.ARC_CONTROLLER_CHART}}"
        runner_chart="{{.ARC_RUNNER_CHART}}"
        kubeconfig="$(mktemp)"
        hive_values="$(mktemp)"
        trap 'rm -f "$kubeconfig" "$hive_values"' EXIT
        sudo -n k0s kubeconfig admin > "$kubeconfig"
        chmod 0600 "$kubeconfig"
        export KUBECONFIG="$kubeconfig"
        kubectl() { sudo -n k0s kubectl "$@"; }

        expected_build_nodes="$(sed '/^$/d' \
          "$remote_dir/infra/k0s/config/arc-build-nodes" | sort)"
        actual_build_nodes="$(kubectl get nodes -l nook.nokey.sh/arc-build=true \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | sort)"
        if test "$actual_build_nodes" != "$expected_build_nodes"; then
          echo "ARC BuildKit manifest does not match the declared build-node inventory" >&2
          printf 'Actual qualified nodes:\n%s\n' "$actual_build_nodes" >&2
          exit 1
        fi

        ruby "$remote_dir/infra/k0s/scripts/arc-hive-values.rb" \
          "$remote_dir/infra/k0s/manifests/arc/runner-scale-set-values.yaml" \
          "$hive_values"
        kubectl apply -f "$remote_dir/infra/k0s/manifests/namespaces.yaml"
        kubectl get secret nook-arc-github --namespace arc-runners >/dev/null
        kubectl create configmap nook-arc-hive-test-runtime \
          --namespace arc-runners \
          --from-file=run-hive-test-runtime="$remote_dir/infra/k0s/scripts/run-hive-test-runtime" \
          --dry-run=client -o yaml | kubectl apply -f -

        helm upgrade --install nook-arc \
          "$controller_chart" \
          --version "$chart_version" \
          --namespace arc-systems \
          --values "$remote_dir/infra/k0s/manifests/arc/controller-values.yaml" \
          --wait --timeout 10m
        kubectl rollout restart deployment/nook-arc-gha-rs-controller \
          --namespace arc-systems
        kubectl rollout status deployment/nook-arc-gha-rs-controller \
          --namespace arc-systems --timeout=10m

        kubectl apply -f "$remote_dir/infra/k0s/manifests/arc/network-policy.yaml"
        kubectl apply -f "$remote_dir/infra/k0s/manifests/arc/container-hook.yaml"
        kubectl apply -f "$remote_dir/infra/k0s/manifests/arc/buildkit.yaml"
        config_hash="$(kubectl get configmap nook-buildkit \
          --namespace arc-runners -o json | jq -cS '.data' | sha256sum | awk '{ print $1 }')"
        kubectl patch statefulset/nook-buildkit --namespace arc-runners \
          --type merge \
          -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"nook.nokey.sh/buildkit-config-sha256\":\"$config_hash\"}}}}}"
        kubectl rollout status statefulset/nook-buildkit \
          --namespace arc-runners --timeout=10m
        ready_nodes="$(kubectl get pods --namespace arc-runners \
          -l app.kubernetes.io/name=nook-buildkit \
          -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.spec.nodeName}{"\n"}{end}' | sort -u)"
        expected_build_count="$(printf '%s\n' "$expected_build_nodes" | sed '/^$/d' | wc -l | tr -d ' ')"
        test "$(printf '%s\n' "$ready_nodes" | sed '/^$/d' | wc -l | tr -d ' ')" = "$expected_build_count"

        helm upgrade --install nook-k0s \
          "$runner_chart" \
          --version "$chart_version" \
          --namespace arc-runners \
          --values "$remote_dir/infra/k0s/manifests/arc/runner-scale-set-values.yaml" \
          --wait --timeout 10m
        helm upgrade --install nook-k0s-hive \
          "$runner_chart" \
          --version "$chart_version" \
          --namespace arc-runners \
          --values "$hive_values" \
          --wait --timeout 10m
        helm upgrade --install nook-k0s-container \
          "$runner_chart" \
          --version "$chart_version" \
          --namespace arc-runners \
          --values "$remote_dir/infra/k0s/manifests/arc/container-runner-scale-set-values.yaml" \
          --wait --timeout 10m
        helm uninstall nook-k0s-cache --namespace arc-runners >/dev/null 2>&1 || true

        test "$(kubectl get autoscalingrunnerset/nook-k0s \
          --namespace arc-runners -o jsonpath='{.spec.maxRunners}')" = 35
        test "$(kubectl get autoscalingrunnerset/nook-k0s-hive \
          --namespace arc-runners -o jsonpath='{.spec.maxRunners}')" = 10
        test "$(kubectl get autoscalingrunnerset/nook-k0s-container \
          --namespace arc-runners -o jsonpath='{.spec.maxRunners}')" = 20
        for scale_set in nook-k0s nook-k0s-hive nook-k0s-container; do
          deadline="$(( $(date +%s) + 600 ))"
          until kubectl get pod --namespace arc-systems \
            -l "actions.github.com/scale-set-name=$scale_set" \
            -o name | grep -q .; do
            if test "$(date +%s)" -ge "$deadline"; then
              echo "Timed out waiting for $scale_set listener creation" >&2
              exit 1
            fi
            sleep 2
          done
          kubectl wait pod --namespace arc-systems \
            -l "actions.github.com/scale-set-name=$scale_set" \
            --for=condition=Ready --timeout=10m
        done
        echo "ARC scale sets are dispatch-ready"
        REMOTE
      - task: arc:build-hosts:activate
      - task: arc:status

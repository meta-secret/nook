version: "3"

# Real BuildKit proof for independent checks and the final publication join.
tasks:
  bake-cache:prove-pr:
    desc: Prove shared local BuildKit utility reuse and the PR publication barrier without Zot.
    preconditions:
      - sh: test "${NOOK_ARC_RUNNER:-}" != 1
        msg: This local Docker proof creates a disposable builder; never run it inside ARC.
    cmds:
      - |
        set -euo pipefail
        repo_root="$(git rev-parse --show-toplevel)"
        output="$(mktemp -d "${TMPDIR:-/tmp}/nook-pr-pipeline-proof.XXXXXX")"
        builder="nook-pr-proof-$(date +%s)-$$"
        trap 'docker buildx rm -f "$builder" >/dev/null 2>&1' EXIT
        docker buildx create --name "$builder" --driver docker-container --bootstrap
        context="$output/context"
        cp -R "$repo_root/infra/sim/bake-cache" "$context"
        fixture="$context/pr-pipeline.docker-bake.hcl"
        for temperature in cold warm; do
          phase=checks
          docker buildx bake --builder "$builder" --progress=plain \
            --metadata-file "$output/$temperature-$phase.json" \
            -f "$fixture" --set "*.context=$context" \
            --allow="fs.read=$context" \
            --allow="fs.write=$output" \
            --set "pr-proof-heavy.output=type=local,dest=$output/result" \
            "pr-proof-$phase" 2>&1 | tee "$output/$temperature-$phase.log"
        done
        test -s "$output/result/proof/verification"
        test -s "$output/result/proof/tests"
        test -s "$output/result/proof/heavy"
        grep -q 'exporting to image' "$output/cold-checks.log"
        grep -q 'pr-proof-coverage' "$output/cold-checks.log"
        grep -q 'pr-proof-browser' "$output/cold-checks.log"
        if grep -Eq '\[pr-proof-verification\] exporting cache' "$output/cold-checks.log"; then
          echo 'Dylint verification unexpectedly used a cache-only/export-cache result' >&2
          exit 1
        fi
        dylint_dependency_vertex="$(sed -n 's/^\(#[0-9][0-9]*\) \[[^]]*dylint-deps 3\/3\] RUN .*/\1/p' "$output/warm-checks.log" | head -n 1)"
        dependency_vertex="$(sed -n 's/^\(#[0-9][0-9]*\) \[[^]]*chef-deps 2\/2\] RUN .*/\1/p' "$output/warm-checks.log" | head -n 1)"
        test -n "$dylint_dependency_vertex"
        test -n "$dependency_vertex"
        grep -qx "$dylint_dependency_vertex CACHED" "$output/warm-checks.log"
        grep -qx "$dependency_vertex CACHED" "$output/warm-checks.log"
        if grep -Eq '^#[0-9]+ [0-9.]+ bake-sim-cargo-dylint-product-dependencies$' "$output/warm-checks.log"; then
          echo 'Warm verification unexpectedly rebuilt Dylint product dependencies' >&2
          exit 1
        fi
        if grep -Eq '^#[0-9]+ [0-9.]+ bake-sim-cargo-chef-wasm-release$' "$output/warm-checks.log"; then
          echo 'Warm verification unexpectedly recooked WASM dependencies' >&2
          exit 1
        fi
        grep -q ' CACHED' "$output/warm-checks.log"
        fuzz_dependency_vertex="$(sed -n 's/^\(#[0-9][0-9]*\) \[[^]]*rust-fuzz-deps 2\/2\] RUN .*/\1/p' "$output/warm-checks.log" | head -n 1)"
        test -n "$fuzz_dependency_vertex"
        grep -qx "$fuzz_dependency_vertex CACHED" "$output/warm-checks.log"
        if grep -Eq '^#[0-9]+ [0-9.]+ bake-sim-fuzz-dependencies$' "$output/warm-checks.log"; then
          echo 'Warm check solve unexpectedly reinstalled fuzz dependencies' >&2
          exit 1
        fi
        if grep -E 'importing cache manifest|exporting cache to registry' "$output/"*.log; then
          echo 'Unexpected registry cache transfer' >&2
          exit 1
        fi
        # A failing leaf must block publication even when sibling checks succeed.
        for failure in verification tests; do
          set +e
          if [ "$failure" = verification ]; then
            docker buildx bake --builder "$builder" --progress=plain -f "$fixture" \
              --set "*.context=$context" \
              --allow="fs.read=$context" \
              --set '*.args.FAIL_VERIFICATION=1' pr-proof-checks \
              >"$output/failure-$failure.log" 2>&1 \
              && printf 'unexpected downstream invocation\n' >"$output/$failure-downstream"
            status="$?"
          else
            docker buildx bake --builder "$builder" --progress=plain -f "$fixture" \
              --set "*.context=$context" \
              --allow="fs.read=$context" \
              --set '*.args.FAIL_TESTS=1' pr-proof-checks \
              >"$output/failure-$failure.log" 2>&1 \
              && printf 'unexpected downstream invocation\n' >"$output/$failure-downstream"
            status="$?"
          fi
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected the real BuildKit solve to fail' >&2
            exit 1
          fi
          test ! -e "$output/$failure-downstream"
        done
        printf 'PR pipeline proof artifacts: %s\n' "$output"

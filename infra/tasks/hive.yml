version: '3'

# hive infrastructure operations.
tasks:
  hive:image:
    desc: Build and publish the exact Hive source to registry.dev.nokey.sh.
    deps: [k0s:sync, registry:credential:ensure]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        registry_host=registry.dev.nokey.sh
        username="$(cat "$remote_dir/secrets/registry-username")"
        password="$(cat "$remote_dir/secrets/registry-password")"
        code="$(curl -sS -o /dev/null -w '%{http_code}' \
          -u "$username:$password" "https://$registry_host/v2/")"
        test "$code" = 200
        source_id="$(find \
          "$remote_dir/agentic-ai/minds/hive" \
          "$remote_dir/agentic-ai/minds/lace" \
          "$remote_dir/.github/formatting" \
          -type f -print0 |
          sort -z |
          xargs -0 sha256sum |
          sha256sum |
          cut -c1-16)"
        manifest_id="$(sha256sum \
          "$remote_dir/agentic-ai/minds/Cargo.lock" \
          "$remote_dir/agentic-ai/minds/Cargo.toml" |
          sha256sum |
          cut -c1-16)"
        image="$registry_host/nook-hive:$source_id-$manifest_id"
        access_file="$remote_dir/secrets/sccache-access-key"
        secret_file="$remote_dir/secrets/sccache-secret-key"
        secret_args=()
        if test -s "$access_file" && test -s "$secret_file"; then
          secret_args+=(--secret "id=sccache_s3_access_key,src=$access_file")
          secret_args+=(--secret "id=sccache_s3_secret_key,src=$secret_file")
        else
          echo "SeaweedFS sccache credentials unavailable; compiling without remote cache"
        fi
        docker build \
          --platform linux/amd64 \
          --network host \
          "${secret_args[@]}" \
          --tag "$image" \
          --build-context "nook-sccache-helpers=$remote_dir/nook-app/nook-platform/docker" \
          --build-context "nook-formatter=$remote_dir/.github/formatting" \
          --file "$remote_dir/agentic-ai/minds/hive/Dockerfile" \
          "$remote_dir/agentic-ai/minds"
        push_output="$(docker push "$image")"
        digest="$(printf '%s\n' "$push_output" |
          awk '{for (field = 1; field <= NF; field++) if ($field == "digest:") print $(field + 1)}' |
          tail -1)"
        case "$digest" in
          sha256:????????????????????????????????????????????????????????????????) ;;
          *)
            echo "Hive image push did not return a sha256 digest" >&2
            exit 1
            ;;
        esac
        printf '%s@%s\n' "${image%:*}" "$digest" > "$remote_dir/hive-image"
        chmod 0640 "$remote_dir/hive-image"
        cat "$remote_dir/hive-image"
        REMOTE
  hive:auth:rotate:
    desc: Explicitly replace Hive Codex authentication from a local bootstrap file.
    cmds:
      - task: hive:auth:publish
        vars: { HIVE_AUTH_PUBLICATION_MODE: replace }
  hive:auth:bootstrap:
    internal: true
    cmds:
      - task: hive:auth:publish
        vars: { HIVE_AUTH_PUBLICATION_MODE: bootstrap }
  hive:auth:publish:
    internal: true
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        publication_mode="{{.HIVE_AUTH_PUBLICATION_MODE}}"
        case "$publication_mode" in
          bootstrap|replace) ;;
          *)
            echo "Hive Codex authentication publication mode is invalid" >&2
            exit 2
            ;;
        esac
        auth_file="${HIVE_CODEX_AUTH_FILE:-}"
        if test -n "$auth_file"; then
          test -f "$auth_file"
          jq -e '
            type == "object" and
            .auth_mode == "chatgpt" and
            (.tokens.access_token | type == "string" and length > 0) and
            (.tokens.refresh_token | type == "string" and length > 0) and
            (.tokens.account_id | type == "string" and length > 0)
          ' "$auth_file" >/dev/null
          ssh -n -o BatchMode=yes "$ssh_target" \
            "install -d -m 0700 '$remote_dir/secrets'"
          # HIVE_AUTH_REMOTE_PROGRAM_BEGIN
          IFS= read -r -d '' remote_program <<'REMOTE' || true
        # HIVE_AUTH_REMOTE_BEGIN
        set -euo pipefail
        publication_mode="${1:-}"
        remote_dir="${2:-}"
        case "$publication_mode" in bootstrap|replace) ;; *) exit 2 ;; esac
        case "$remote_dir" in /*) ;; *) exit 2 ;; esac
        kubectl() { sudo -n k0s kubectl "$@"; }
        # HIVE_AUTH_ROTATION_BEGIN
        publish_hive_auth() {
          publication_mode="$1"
          # HIVE_AUTH_MUTATION_LOCK_BEGIN
          sudo -n install -d -m 0755 /run/lock/nook
          sudo -n touch /run/lock/nook/hive-mutation.lock
          sudo -n chmod 0666 /run/lock/nook/hive-mutation.lock
          exec 9>/run/lock/nook/hive-mutation.lock
          flock --exclusive --timeout 900 9
          # HIVE_AUTH_MUTATION_LOCK_END
          if test "$publication_mode" = bootstrap; then
            secret_ref="$(kubectl get secret hive-codex-auth --namespace hive-system \
              --ignore-not-found -o name)" || {
              echo "Hive Codex authentication bootstrap lookup failed" >&2
              return 1
            }
            case "$secret_ref" in
              secret/hive-codex-auth) return ;;
              '') ;;
              *) echo "Unexpected Hive Codex authentication bootstrap lookup: $secret_ref" >&2; return 1 ;;
            esac
          fi
          original_replicas=""; replica_annotation="nook.nokey.sh/hive-auth-desired-replicas"
          restore_hive_workers() {
            if test -n "$original_replicas"; then
              kubectl scale deployment/hive --namespace hive-system --replicas="$original_replicas"
              kubectl rollout status deployment/hive --namespace hive-system --timeout=10m
              kubectl annotate deployment/hive --namespace hive-system "$replica_annotation-"
              original_replicas=""
            fi
          }
          cleanup_rotation() { restore_hive_workers; }
          trap cleanup_rotation EXIT
          deployment_ref="$(kubectl get deployment hive --namespace hive-system --ignore-not-found -o name)"
          case "$deployment_ref" in
            deployment.apps/hive)
              original_replicas="$(kubectl get deployment hive --namespace hive-system \
                -o jsonpath='{.metadata.annotations.nook\.nokey\.sh/hive-auth-desired-replicas}')"
              if test -z "$original_replicas"; then
                original_replicas="$(kubectl get deployment hive --namespace hive-system -o jsonpath='{.spec.replicas}')"
              fi
              case "$original_replicas" in
                ''|*[!0-9]*) echo "Hive deployment has an invalid replica count" >&2; return 1 ;;
              esac
              kubectl annotate deployment/hive --namespace hive-system \
                "$replica_annotation=$original_replicas" --overwrite
              kubectl scale deployment/hive --namespace hive-system --replicas=0
              kubectl rollout status deployment/hive --namespace hive-system --timeout=10m
              ;;
            '') ;;
            *) echo "Unexpected Hive deployment lookup: $deployment_ref" >&2; return 1 ;;
          esac
          pod_refs="$(kubectl get pod --namespace hive-system --selector app.kubernetes.io/name=hive -o name)" || {
            echo "Hive Pod lookup failed while verifying worker quiescence" >&2
            return 1
          }
          if printf '%s\n' "$pod_refs" | grep -q .; then
            kubectl wait pod --namespace hive-system --selector app.kubernetes.io/name=hive --for=delete --timeout=10m
          fi
          jq -e '
            if type == "object" and .auth_mode == "chatgpt" and
              (.tokens.access_token | type == "string" and length > 0) and
              (.tokens.refresh_token | type == "string" and length > 0) and
              (.tokens.account_id | type == "string" and length > 0)
            then {
              apiVersion: "v1", kind: "Secret", type: "Opaque",
              metadata: {name: "hive-codex-auth", namespace: "hive-system"},
              data: {"auth.json": (tojson | @base64)}
            } else error("invalid Hive Codex authentication") end
          ' | kubectl apply -f -
          restore_hive_workers
          trap - EXIT
        }
        # HIVE_AUTH_ROTATION_END
        publish_hive_auth "$publication_mode"
        # HIVE_AUTH_REMOTE_END
        REMOTE
          # HIVE_AUTH_REMOTE_PROGRAM_END
          encoded_program="$(printf '%s' "$remote_program" | base64 | tr -d '\n')"
          encoded_mode="$(printf '%s' "$publication_mode" | base64 | tr -d '\n')"
          encoded_dir="$(printf '%s' "$remote_dir" | base64 | tr -d '\n')"
          printf -v remote_command 'bash -c "$(printf %%s %s | base64 -d)" -- "$(printf %%s %s | base64 -d)" "$(printf %%s %s | base64 -d)"' \
            "$encoded_program" "$encoded_mode" "$encoded_dir"
          ssh -o BatchMode=yes "$ssh_target" \
            "$remote_command" \
            <"$auth_file"
        else
          echo "HIVE_CODEX_AUTH_FILE is required for explicit Hive authentication publication" >&2
          exit 2
        fi
        BASH

  hive:auth:sync:
    internal: true
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        # HIVE_AUTH_SYNC_BEGIN
        sync_hive_auth() {
          ssh_target="{{.INFRA_SSH_TARGET}}"
          secret_ref="$(
            ssh -o BatchMode=yes "$ssh_target" \
              "sudo -n k0s kubectl get secret hive-codex-auth \
                --namespace hive-system \
                --ignore-not-found \
                -o name"
          )" || {
            echo "Hive Codex authentication lookup failed" >&2
            return 1
          }
          case "$secret_ref" in
            secret/hive-codex-auth)
              echo "Preserving cluster-persisted Hive Codex authentication"
              return
              ;;
            '')
              if test -z "${HIVE_CODEX_AUTH_FILE:-}"; then
                echo "Initial Hive deployment requires HIVE_CODEX_AUTH_FILE" >&2
                return 2
              fi
              task infra:hive:auth:bootstrap
              ;;
            *)
              echo "Unexpected Hive Codex authentication lookup: $secret_ref" >&2
              return 1
              ;;
          esac
        }
        # HIVE_AUTH_SYNC_END
        sync_hive_auth
        BASH

  hive:github:sync:
    internal: true
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        ssh_target="{{.INFRA_SSH_TARGET}}"
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        token_file="${HIVE_GITHUB_TOKEN_FILE:-}"
        if test -n "$token_file"; then
          test -s "$token_file"
          test "$(wc -l < "$token_file" | tr -d ' ')" = 1
          ssh -n -o BatchMode=yes "$ssh_target" \
            "install -d -m 0700 '$remote_dir/secrets'"
          remote_token_file="$remote_dir/secrets/github-token.next"
          cleanup_token() {
            ssh -n -o BatchMode=yes "$ssh_target" \
              "rm -f '$remote_token_file'" >/dev/null 2>&1 || true
          }
          trap cleanup_token EXIT
          scp -q -o BatchMode=yes "$token_file" \
            "$ssh_target:$remote_token_file"
          ssh -o BatchMode=yes "$ssh_target" 'bash -s' <<REMOTE
        set -euo pipefail
        remote_dir="$remote_dir"
        token_file="\$remote_dir/secrets/github-token.next"
        trap 'rm -f "\$token_file"' EXIT
        chmod 0600 "\$token_file"
        sudo -n k0s kubectl create secret generic hive-github-publication \
          --namespace hive-system \
          --from-file=token="\$token_file" \
          --dry-run=client \
          -o yaml |
          sudo -n k0s kubectl apply -f -
        REMOTE
          trap - EXIT
          cleanup_token
        else
          ssh -o BatchMode=yes "$ssh_target" \
            "sudo -n k0s kubectl get secret hive-github-publication --namespace hive-system >/dev/null"
        fi
        BASH

  hive:deploy:
    desc: Publish and deploy the four-replica Kata-backed Hive warm pool.
    deps: [k0s:sync]
    silent: true
    cmds:
      - task: kata:guest-seccomp:enable
      - task: hive:seccomp:install
      - task: hive:image
      - task: hive:auth:sync
      - task: hive:github:sync
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        kubectl() { sudo -n k0s kubectl "$@"; }
        # HIVE_DEPLOY_CONVERGENCE_HELPERS_BEGIN
        hive_active_graph_client_pods() { kubectl get pods --namespace hive-system \
            --selector "app.kubernetes.io/name=$1" --output json |
            jq -r '.items[] | select(.status.phase != "Succeeded" and .status.phase != "Failed") | .metadata.name'
        }
        hive_wait_for_graph_client_drain() { deployment="$1" attempts="$2" delay_seconds="$3"
          for attempt in $(seq 1 "$attempts"); do
            active_pods="$(hive_active_graph_client_pods "$deployment")"
            test -z "$active_pods" && return 0
            test "$attempt" -ne "$attempts" || {
              echo "Timed out draining active graph client deployment/$deployment: $active_pods" >&2
              return 1
            }
            sleep "$delay_seconds"
          done
        }
        hive_ready_worker_count() { kubectl get pods --namespace hive-system --selector "app.kubernetes.io/name=hive" --output json |
          jq '[.items[] | select(.metadata.deletionTimestamp == null) | select(.status.phase == "Running") | select(any(.status.containerStatuses[]?; .name == "hive" and .ready == true))] | length'
        }
        hive_wait_for_ready_pool() { attempts="$1" delay_seconds="$2" stable_samples="$3" consecutive_ready=0 ready_replicas=0
          for attempt in $(seq 1 "$attempts"); do
            ready_replicas="$(hive_ready_worker_count)"
            if test "$ready_replicas" = 4; then
              consecutive_ready=$((consecutive_ready + 1))
              test "$consecutive_ready" -ge "$stable_samples" && return 0
            else
              consecutive_ready=0
            fi
            test "$attempt" -ne "$attempts" || {
              echo "Hive pool did not stabilize at four ready workers; last count: ${ready_replicas:-0}" >&2
              return 1
            }
            sleep "$delay_seconds"
          done
        }
        # HIVE_DEPLOY_CONVERGENCE_HELPERS_END
        # HIVE_DEPLOY_MUTATION_LOCK_BEGIN
        sudo -n install -d -m 0755 /run/lock/nook
        sudo -n touch /run/lock/nook/hive-mutation.lock
        sudo -n chmod 0666 /run/lock/nook/hive-mutation.lock
        exec 9>/run/lock/nook/hive-mutation.lock
        flock --exclusive --timeout 900 9
        # HIVE_DEPLOY_MUTATION_LOCK_END
        kubectl apply -f "$remote_dir/infra/k0s/manifests/namespaces.yaml"
        if ! kubectl get secret hive-reaper-auth \
          --namespace hive-system >/dev/null 2>&1; then
          reaper_token="$(openssl rand -hex 32)"
          kubectl create secret generic hive-reaper-auth \
            --namespace hive-system \
            --from-literal=token="$reaper_token"
          unset reaper_token
        fi
        image="$(cat "$remote_dir/hive-image")"
        auth_data="$(kubectl get secret hive-codex-auth \
          --namespace hive-system -o jsonpath='{.data.auth\.json}')"
        test -n "$auth_data"
        auth_checksum="$(
          printf '%s' "$auth_data" |
            base64 --decode |
            sha256sum |
            cut -d' ' -f1
        )"
        github_data="$(kubectl get secret hive-github-publication \
          --namespace hive-system -o jsonpath='{.data.token}')"
        test -n "$github_data"
        github_checksum="$(
          printf '%s' "$github_data" |
            base64 --decode |
            sha256sum |
            cut -d' ' -f1
        )"
        neo4j_ca_data="$(
          kubectl get secret hive-neo4j-ca \
            --namespace hive-system \
            -o jsonpath='{.data.ca\.crt}'
        )"
        test -n "$neo4j_ca_data"
        neo4j_ca_checksum="$(
          printf '%s' "$neo4j_ca_data" |
            base64 --decode |
            sha256sum |
            cut -d' ' -f1
        )"
        neo4j_client_data="$(
          kubectl get secret hive-neo4j-client \
            --namespace hive-system \
            -o jsonpath='{.data.NEO4J_PASSWORD}'
        )"
        test -n "$neo4j_client_data"
        neo4j_client_checksum="$(
          printf '%s' "$neo4j_client_data" |
            base64 --decode |
            sha256sum |
            cut -d' ' -f1
        )"
        unset auth_data github_data neo4j_ca_data neo4j_client_data
        case "$auth_checksum" in
          ????????????????????????????????????????????????????????????????) ;;
          *)
            echo "Codex authentication checksum is invalid" >&2
            exit 1
            ;;
        esac
        case "$neo4j_ca_checksum" in
          ????????????????????????????????????????????????????????????????) ;;
          *)
            echo "Neo4j CA checksum is invalid" >&2
            exit 1
            ;;
        esac
        case "$neo4j_client_checksum" in
          ????????????????????????????????????????????????????????????????) ;;
          *)
            echo "Neo4j client checksum is invalid" >&2
            exit 1
            ;;
        esac
        case "$github_checksum" in
          ????????????????????????????????????????????????????????????????) ;;
          *)
            echo "GitHub credential checksum is invalid" >&2
            exit 1
            ;;
        esac
        case "$image" in
          registry.dev.nokey.sh/nook-hive@sha256:*) ;;
          *)
            echo "Refusing unpinned Hive image: $image" >&2
            exit 1
            ;;
        esac
        neo4j_service_ip="$(
          kubectl get service hive-neo4j \
            --namespace hive-data \
            -o jsonpath='{.spec.clusterIP}'
        )"
        neo4j_endpoint_ip="$(
          kubectl get endpoints hive-neo4j \
            --namespace hive-data \
            -o jsonpath='{.subsets[0].addresses[0].ip}'
        )"
        k0s_api_ip="{{.K0S_API_ADDRESS}}"
        for discovered_ip in \
          "$neo4j_service_ip" \
          "$neo4j_endpoint_ip" \
          "$k0s_api_ip"; do
          case "$discovered_ip" in
            *[!0-9.]*|'')
              echo "Refusing invalid discovered cluster endpoint: $discovered_ip" >&2
              exit 1
              ;;
          esac
        done
        rendered="$(mktemp)"
        trap 'rm -f "$rendered"' EXIT
        sed \
          -e "s|HIVE_IMAGE|$image|g" \
          -e "s|HIVE_AUTH_CHECKSUM|$auth_checksum|g" \
          -e "s|HIVE_GITHUB_CHECKSUM|$github_checksum|g" \
          -e "s|HIVE_NEO4J_CA_CHECKSUM|$neo4j_ca_checksum|g" \
          -e "s|HIVE_NEO4J_CLIENT_CHECKSUM|$neo4j_client_checksum|g" \
          "$remote_dir/infra/k0s/manifests/hive/deployment.yaml" > "$rendered"
        printf '%s\n' '---' >> "$rendered"
        sed \
          -e "s|HIVE_IMAGE|$image|g" \
          -e "s|HIVE_NEO4J_CA_CHECKSUM|$neo4j_ca_checksum|g" \
          -e "s|HIVE_NEO4J_CLIENT_CHECKSUM|$neo4j_client_checksum|g" \
          "$remote_dir/infra/k0s/manifests/hive/dispatcher.yaml" >> "$rendered"
        printf '%s\n' '---' >> "$rendered"
        sed \
          -e "s|HIVE_IMAGE|$image|g" \
          -e "s|HIVE_NEO4J_CA_CHECKSUM|$neo4j_ca_checksum|g" \
          -e "s|HIVE_NEO4J_CLIENT_CHECKSUM|$neo4j_client_checksum|g" \
          "$remote_dir/infra/k0s/manifests/hive/observer.yaml" >> "$rendered"
        printf '%s\n' '---' >> "$rendered"
        sed \
          -e "s|HIVE_IMAGE|$image|g" \
          "$remote_dir/infra/k0s/manifests/hive/reaper-controller.yaml" >> "$rendered"
        printf '%s\n' '---' >> "$rendered"
        sed \
          -e "s|HIVE_NEO4J_SERVICE_CIDR|$neo4j_service_ip/32|g" \
          -e "s|HIVE_NEO4J_ENDPOINT_CIDR|$neo4j_endpoint_ip/32|g" \
          -e "s|HIVE_K0S_API_CIDR|$k0s_api_ip/32|g" \
          "$remote_dir/infra/k0s/manifests/hive/network-policy.yaml" >> "$rendered"
        for deployment in hive hive-workbench-dispatcher hive-observer; do
          if kubectl get "deployment/$deployment" \
            --namespace hive-system >/dev/null 2>&1; then
            kubectl scale "deployment/$deployment" \
              --namespace hive-system \
              --replicas=0
            kubectl rollout status "deployment/$deployment" \
              --namespace hive-system \
              --timeout=5m
            hive_wait_for_graph_client_drain "$deployment" 60 2
          fi
        done
        kubectl apply -f "$remote_dir/infra/k0s/manifests/hive/lifecycle-rbac.yaml"
        kubectl apply -f "$rendered"
        kubectl rollout status deployment/hive \
          --namespace hive-system \
          --timeout=15m
        kubectl rollout status deployment/hive-workbench-dispatcher \
          --namespace hive-system \
          --timeout=15m
        kubectl rollout status deployment/hive-observer \
          --namespace hive-system \
          --timeout=15m
        kubectl rollout status deployment/hive-reaper-controller \
          --namespace hive-system \
          --timeout=15m
        for attempt in $(seq 1 60); do
          current_neo4j_endpoint_ip="$(
            kubectl get endpoints hive-neo4j \
              --namespace hive-data \
              -o jsonpath='{.subsets[0].addresses[0].ip}'
          )"
          case "$current_neo4j_endpoint_ip" in
            *[!0-9.]*)
              echo "Refusing invalid live Neo4j endpoint: $current_neo4j_endpoint_ip" >&2
              exit 1
              ;;
          esac
          expected_neo4j_cidrs="$(
            {
              printf '%s\n' "$neo4j_service_ip/32"
              if test -n "$current_neo4j_endpoint_ip"; then
                printf '%s\n' "$current_neo4j_endpoint_ip/32"
              fi
            } |
              sort |
              paste -sd, -
          )"
          live_neo4j_cidrs="$(
            kubectl get networkpolicy hive-worker-egress \
              --namespace hive-system \
              -o json |
              jq -r '
                .spec.egress[]
                | select(any(.ports[]?; .protocol == "TCP" and .port == 7687))
                | select(any(.to[]?; has("ipBlock")))
                | [.to[] | .ipBlock.cidr]
                | sort
                | join(",")
              '
          )"
          if test "$live_neo4j_cidrs" = "$expected_neo4j_cidrs"; then
            break
          fi
          if test "$attempt" -eq 60; then
            echo "Hive NetworkPolicy controller did not reconcile Neo4j endpoints" >&2
            exit 1
          fi
          sleep 2
        done
        desired_hive_replicas="$(kubectl get deployment hive \
          --namespace hive-system \
          -o jsonpath='{.spec.replicas}')"
        if test "$desired_hive_replicas" != 0; then
          hive_wait_for_ready_pool 60 2 3
        fi
        test "$(kubectl get deployment hive \
          --namespace hive-system \
          -o jsonpath='{.spec.template.spec.runtimeClassName}')" = kata-dragonball
        test "$(kubectl get deployment hive \
          --namespace hive-system \
          -o jsonpath='{.spec.template.spec.automountServiceAccountToken}')" = false
        deployment_json="$(kubectl get deployment hive --namespace hive-system -o json)"
        if printf '%s' "$deployment_json" | jq -e \
          '[
             .spec.template.spec.containers[],
             .spec.template.spec.initContainers[]
             | select(.securityContext.privileged == true)
           ] | length > 0' >/dev/null; then
          echo "Hive deployment contains a privileged container" >&2
          exit 1
        fi
        if printf '%s' "$deployment_json" | jq -e \
          '.spec.template.spec.volumes // [] | any(has("hostPath"))' >/dev/null; then
          echo "Hive deployment contains a hostPath volume" >&2
          exit 1
        fi
        test "$(
          printf '%s' "$deployment_json" |
            jq -r '.spec.template.spec.containers[]
              | select(.name == "coordinator")
              | .env[]
              | select(.name == "NEO4J_URI")
              | .value'
        )" = neo4j+s://hive-neo4j.hive-data.svc.cluster.local:7687
        test "$(
          printf '%s' "$deployment_json" |
            jq '[.spec.template.spec.containers[]
              | select(.name == "hive")
              | .env[]
              | select(.name | startswith("NEO4J_"))] | length'
        )" = 0

        if test "$desired_hive_replicas" = 0; then
          for deployment in \
            hive \
            hive-workbench-dispatcher \
            hive-observer \
            hive-reaper-controller; do
            test "$(kubectl get deployment "$deployment" \
              --namespace hive-system \
              -o jsonpath='{.spec.replicas}')" = 0
            test "$(kubectl get deployment "$deployment" \
              --namespace hive-system \
              -o json | jq '.status.readyReplicas // 0')" = 0
          done
          echo "Hive workloads are intentionally paused at zero replicas"
          exit 0
        fi

        old_pod="$(
          kubectl get pods \
            --namespace hive-system \
            -l app.kubernetes.io/name=hive \
            -o json |
            jq -r '
              .items[]
              | select(.metadata.deletionTimestamp == null)
              | select(
                  any(
                    .status.containerStatuses[]?;
                    .name == "hive" and .ready == true
                  )
                )
              | .metadata.name
            ' |
            head -1
        )"
        test -n "$old_pod"
        kubectl exec "$old_pod" \
          --namespace hive-system \
          --container hive \
          -- /usr/bin/setpriv --no-new-privs \
            /usr/bin/bwrap \
              --unshare-user \
              --unshare-pid \
              --unshare-net \
              --ro-bind / / \
              --dev /dev \
              --tmpfs /tmp \
              --bind /workspace /workspace \
              --chdir /workspace \
              /bin/bash -ceu \
                'touch .hive-sandbox-smoke && test ! -w /usr && rm .hive-sandbox-smoke'
        test "$(
          kubectl exec "$old_pod" \
            --namespace hive-system \
            --container hive \
            -- awk '/^Seccomp:/ {print $2}' /proc/self/status
        )" = 2
        old_uid="$(kubectl get pod "$old_pod" \
          --namespace hive-system \
          -o jsonpath='{.metadata.uid}')"
        kubectl exec "$old_pod" \
          --namespace hive-system \
          --container hive \
          -- /usr/bin/touch /workspace/.hive-task-finished
        kubectl wait "pod/$old_pod" \
          --namespace hive-system \
          --for=delete \
          --timeout=5m
        kubectl rollout status deployment/hive \
          --namespace hive-system \
          --timeout=10m
        hive_wait_for_ready_pool 60 2 3
        if kubectl get pods \
          --namespace hive-system \
          -l app.kubernetes.io/name=hive \
          -o jsonpath='{range .items[*]}{.metadata.uid}{"\n"}{end}' |
          grep -Fx "$old_uid"; then
          echo "Hive lifecycle verification reused the terminated Pod" >&2
          exit 1
        fi
        kubectl get pods --namespace hive-system \
          -l app.kubernetes.io/name=hive \
          -o wide
        REMOTE

  hive:seccomp:install:
    desc: Install the Restricted-compatible Hive Bubblewrap profile on every compute node.
    silent: true
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        controller_target="{{.INFRA_SSH_TARGET}}"
        source_profile="$(git rev-parse --show-toplevel)/infra/k0s/seccomp/hive-bubblewrap.json"
        test "$(jq -r '.defaultAction' "$source_profile")" = SCMP_ACT_ERRNO
        inventory="$(ssh -o BatchMode=yes "$controller_target" \
          'sudo -n k0s kubectl get nodes -l nook.nokey.sh/node-role=compute -o json' |
          jq -r '.items | sort_by(.metadata.name)[] |
            [.metadata.name, .metadata.annotations["nook.nokey.sh/ssh-target"]] | @tsv')"
        if test -z "$inventory"; then
          echo "No compute nodes require the Hive seccomp profile yet"
          exit 0
        fi
        while IFS=$'\t' read -r node target; do
          if test -z "$target" || test "$target" = null; then
            echo "Hive compute node $node lacks nook.nokey.sh/ssh-target" >&2
            exit 1
          fi
          ssh_user="${target%%@*}"
          ssh_host="${target#*@}"
          if test "$ssh_user" = "$target" ||
             ! [[ "$ssh_user" =~ ^[A-Za-z0-9_.-]+$ ]] ||
             ! [[ "$ssh_host" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo "Hive compute node $node has an unsafe SSH target" >&2
            exit 1
          fi
          if ! ssh -n -o BatchMode=yes -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=accept-new -J "$controller_target" "$target" true; then
            ssh -n -o BatchMode=yes "$controller_target" \
              "sudo -n k0s kubectl taint node '$node' 'nook.nokey.sh/arc-build=preparing:NoSchedule' --overwrite >/dev/null"
            echo "Deferred Hive seccomp on offline compute node $node ($target)" >&2
            continue
          fi
          echo "Installing Hive seccomp profile on $node"
          profile_temp="$(ssh -n -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -J "$controller_target" "$target" mktemp)"
          case "$profile_temp" in
            /tmp/tmp.*) ;;
            *) echo "Hive compute node $node returned an unsafe temporary path" >&2; exit 1 ;;
          esac
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ProxyJump="$controller_target" "$source_profile" "$target:$profile_temp"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -J "$controller_target" "$target" 'bash -s' -- "$profile_temp" <<'REMOTE'
        set -euo pipefail
        source_profile="$1"
        profile_dir=/var/lib/k0s/kubelet/seccomp/nook
        trap 'rm -f "$source_profile"' EXIT
        test "$(jq -r '.defaultAction' "$source_profile")" = SCMP_ACT_ERRNO
        sudo -n install -d -m 0755 "$profile_dir"
        sudo -n install -m 0644 "$source_profile" "$profile_dir/hive-bubblewrap.json"
        REMOTE
        done <<< "$inventory"
        BASH

  hive:diagnose:
    desc: Show bounded Hive worker and controller diagnostics.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -u
        kubectl() { sudo -n k0s kubectl "$@"; }
        kubectl get deployment,pod \
          --namespace hive-system \
          -o wide || true
        kubectl get pods \
          --namespace hive-system \
          -l app.kubernetes.io/name=hive \
          -o json |
          jq '[
            .items[]
            | {
                pod: .metadata.name,
                containers: [
                  .status.containerStatuses[]?
                  | {
                      name,
                      ready,
                      restartCount,
                      state,
                      lastState
                    }
                ]
              }
          ]' || true
        kubectl get service,endpoints kubernetes \
          --namespace default \
          -o wide || true
        kubectl get service,endpoints kube-dns \
          --namespace kube-system \
          -o wide || true
        kubectl get service,endpoints \
          --namespace hive-data \
          -o wide || true
        kubectl logs statefulset/hive-neo4j \
          --namespace hive-data \
          --tail=100 || true
        api_endpoint="$(
          kubectl get endpoints kubernetes \
            --namespace default \
            -o jsonpath='{.subsets[0].addresses[0].ip}' \
            2>/dev/null || true
        )"
        if test -n "$api_endpoint"; then
          kubectl exec -i deployment/hive-reaper-controller \
            --namespace hive-system \
            -- /bin/bash -c '
              for destination in "kubernetes.default.svc:443" "$1:6443"; do
                host="${destination%:*}"
                port="${destination##*:}"
                if timeout 5 bash -c "exec 3<>/dev/tcp/$host/$port"; then
                  printf "connected to %s:%s\n" "$host" "$port"
                else
                  printf "failed to connect to %s:%s\n" "$host" "$port"
                fi
              done
            ' diagnostic "$api_endpoint" || true
        fi
        probe_pod="$(
          kubectl get pods \
            --namespace hive-system \
            -l app.kubernetes.io/name=hive \
            -o json |
          jq -r '
            [.items[] | select(.metadata.deletionTimestamp == null)]
            | sort_by(.metadata.creationTimestamp)
            | last
            | .metadata.name
          '
        )"
        kubectl exec -i "$probe_pod" \
          --namespace hive-system \
          --container hive \
          -- /bin/bash -c '
            host=hive-neo4j.hive-data.svc.cluster.local
            port=7687
            if timeout 5 bash -c "exec 3<>/dev/tcp/$host/$port"; then
              printf "connected to %s:%s\n" "$host" "$port"
            else
              printf "failed to connect to %s:%s\n" "$host" "$port"
            fi
          ' || true
        kubectl exec deployment/hive-workbench-dispatcher \
          --namespace hive-system \
          --container dispatcher \
          -- cat /etc/resolv.conf || true
        kubectl logs deployment/coredns \
          --namespace kube-system \
          --tail=100 || true
        kubectl exec deployment/hive-workbench-dispatcher \
          --namespace hive-system \
          --container dispatcher \
          -- curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 15 \
            --output /dev/null \
            https://api.github.com/repos/meta-secret/nook-workbench/contents/issues/hive-isolated-agent-platform?ref=main ||
          true
        kubectl get pods \
          --namespace hive-system \
          -l app.kubernetes.io/name=hive \
          -o name |
        sort |
        while IFS= read -r pod; do
          kubectl logs "$pod" \
            --namespace hive-system \
            --all-containers \
            --prefix \
            --since=10m \
            --tail=200 || true
        done
        kubectl logs deployment/hive-workbench-dispatcher \
          --namespace hive-system \
          --all-containers \
          --prefix \
          --since=3m \
          --tail=100 || true
        kubectl logs deployment/hive-reaper-controller \
          --namespace hive-system \
          --all-containers \
          --prefix \
          --since=3m \
          --tail=100 || true
        kubectl logs deployment/hive-observer \
          --namespace hive-system \
          --all-containers \
          --prefix \
          --since=10m \
          --tail=200 || true
        unhealthy_pods="$(
          kubectl get pods \
            --namespace hive-system \
            -l app.kubernetes.io/name=hive \
            -o json 2>/dev/null |
          jq -r '
            .items[]
            | select(
                (.status.phase != "Running") or
                ([.status.containerStatuses[]? | select(.ready != true)] | length > 0)
              )
            | .metadata.name
          ' || true
        )"
        for pod in $unhealthy_pods; do
          kubectl logs "pod/$pod" \
            --namespace hive-system \
            --all-containers \
            --prefix \
            --tail=100 || true
          kubectl logs "pod/$pod" \
            --namespace hive-system \
            --all-containers \
            --prefix \
            --previous \
            --tail=100 || true
          kubectl describe "pod/$pod" \
            --namespace hive-system || true
        done
        kubectl get events \
          --namespace hive-system \
          --sort-by=.lastTimestamp |
          tail -100 || true
        REMOTE

  hive:sandbox:diagnose:
    desc: Probe the live Hive worker namespace and Bubblewrap prerequisites.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        kubectl() { sudo -n k0s kubectl "$@"; }
        config=/opt/kata/share/defaults/kata-containers/runtime-rs/runtimes/dragonball/configuration-dragonball.toml
        sudo -n grep -H '^disable_guest_seccomp' "$config"
        pod="$(
          kubectl get pods \
            --namespace hive-system \
            -l app.kubernetes.io/name=hive \
            -o json |
            jq -r '
              .items[]
              | select(.metadata.deletionTimestamp == null)
              | select(any(.status.containerStatuses[]?; .name == "hive" and .ready == true))
              | .metadata.name
            ' |
            head -1
        )"
        test -n "$pod"
        kubectl exec "$pod" \
          --namespace hive-system \
          --container hive \
          -- /bin/bash -ceu '
            probe() {
              label="$1"
              shift
              printf "== %s ==\n" "$label"
              output=""
              if output="$("$@" 2>&1)"; then
                test -z "$output" || printf "%s\n" "$output"
                printf "%s\n" "result=ok"
              else
                status="$?"
                test -z "$output" || printf "%s\n" "$output"
                printf "result=failed exit=%s\n" "$status"
              fi
            }
            id
            uname -a
            bwrap --version
            grep -E "^(Cap|NoNewPrivs|Seccomp)" /proc/self/status
            for setting in \
              /proc/sys/kernel/unprivileged_userns_clone \
              /proc/sys/user/max_user_namespaces; do
              if test -r "$setting"; then
                printf "%s=" "$setting"
                cat "$setting"
              fi
            done
            probe "Codex no-fresh-proc sandbox shape" bwrap \
              --unshare-user \
              --unshare-pid \
              --unshare-net \
              --ro-bind / / \
              --dev /dev \
              --tmpfs /tmp \
              --bind /workspace /workspace \
              --chdir /workspace \
              /bin/bash -ceu "test ! -w /usr; touch .hive-sandbox-diagnostic; rm .hive-sandbox-diagnostic"
          '
        REMOTE

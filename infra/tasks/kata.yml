version: '3'

# kata infrastructure operations.
tasks:
  kata:install:
    desc: Install the pinned Kata runtime-rs chart on k0s.
    deps: [kvm:verify, k0s:sync]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        version="{{.KATA_VERSION}}"
        chart="$remote_dir/downloads/kata-deploy-$version.tgz"
        curl -fsSL --retry 3 -o "$chart.next" \
          "https://github.com/kata-containers/kata-containers/releases/download/$version/kata-deploy-$version.tgz"
        printf '%s  %s\n' "{{.KATA_CHART_SHA256}}" "$chart.next" | sha256sum -c -
        mv "$chart.next" "$chart"
        kubeconfig="$(mktemp)"
        trap 'rm -f "$kubeconfig"' EXIT
        sudo -n k0s kubeconfig admin > "$kubeconfig"
        chmod 0600 "$kubeconfig"
        export KUBECONFIG="$kubeconfig"
        kubectl() { sudo -n k0s kubectl "$@"; }
        helm upgrade --install kata-deploy "$chart" \
          --namespace kube-system \
          --values "$remote_dir/infra/k0s/manifests/kata/values.yaml" \
          --wait \
          --timeout 15m
        kubectl rollout status daemonset/kata-deploy \
          --namespace kube-system \
          --timeout=10m
        kubectl get runtimeclasses
        kubectl get runtimeclass kata-dragonball
        REMOTE
      - task: kata:guest-seccomp:enable

  kata:guest-seccomp:enable:
    desc: Pass Kubernetes seccomp profiles into Dragonball guests.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        config=/opt/kata/share/defaults/kata-containers/runtime-rs/runtimes/dragonball/configuration-dragonball.toml
        sudo -n test -f "$config"
        current="$(
          sudo -n sed -n \
            's/^[[:space:]]*disable_guest_seccomp[[:space:]]*=[[:space:]]*//p' \
            "$config"
        )"
        case "$current" in
          false) ;;
          true)
            next="$(mktemp)"
            trap 'rm -f "$next"' EXIT
            sudo -n sed \
              's/^[[:space:]]*disable_guest_seccomp[[:space:]]*=[[:space:]]*true[[:space:]]*$/disable_guest_seccomp = false/' \
              "$config" > "$next"
            test "$(
              sed -n \
                's/^[[:space:]]*disable_guest_seccomp[[:space:]]*=[[:space:]]*//p' \
                "$next"
            )" = false
            sudo -n install -m 0644 "$next" "$config"
            ;;
          *)
            echo "Refusing ambiguous Dragonball guest seccomp setting: $current" >&2
            exit 1
            ;;
        esac
        test "$(
          sudo -n sed -n \
            's/^[[:space:]]*disable_guest_seccomp[[:space:]]*=[[:space:]]*//p' \
            "$config"
        )" = false
        REMOTE

  kata:diagnose:
    desc: Show bounded Kata installer diagnostics when its rollout fails.
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -u
        kubectl() { sudo -n k0s kubectl "$@"; }
        kubectl get daemonset,pod \
          --namespace kube-system \
          -l name=kata-deploy \
          -o wide || true
        kubectl logs daemonset/kata-deploy \
          --namespace kube-system \
          --all-containers \
          --prefix \
          --tail=200 || true
        kubectl logs daemonset/kata-deploy \
          --namespace kube-system \
          --all-containers \
          --prefix \
          --previous \
          --tail=200 || true
        crictl=/var/lib/k0s/bin/crictl
        if sudo -n test -x "$crictl"; then
          container_id="$(
            sudo -n "$crictl" \
              --runtime-endpoint unix:///run/k0s/containerd.sock \
              ps \
              --all \
              --name kata-deploy \
              --quiet |
              head -1
          )"
          if test -n "$container_id"; then
            sudo -n "$crictl" \
              --runtime-endpoint unix:///run/k0s/containerd.sock \
              logs \
              --tail=200 \
              "$container_id" || true
          fi
        fi
        kubectl describe daemonset/kata-deploy \
          --namespace kube-system || true
        kubectl get events \
          --namespace kube-system \
          --sort-by=.lastTimestamp |
          tail -100 || true
        REMOTE

  kata:verify:
    desc: Prove a smoke Pod uses the Kata guest kernel and never runc.
    deps: [k0s:sync]
    silent: true
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -euo pipefail
        remote_dir="{{.INFRA_REMOTE_DIR}}"
        kubectl() { sudo -n k0s kubectl "$@"; }
        kubectl apply -f "$remote_dir/infra/k0s/manifests/namespaces.yaml"
        kubectl get runtimeclass kata-dragonball
        kubectl delete pod hive-kata-smoke \
          --namespace hive-system \
          --ignore-not-found \
          --wait=true
        kubectl apply -f "$remote_dir/infra/k0s/manifests/kata/smoke-test.yaml"
        kubectl wait pod/hive-kata-smoke \
          --namespace hive-system \
          --for=jsonpath='{.status.phase}'=Succeeded \
          --timeout=5m
        runtime_class="$(kubectl get pod hive-kata-smoke \
          --namespace hive-system \
          -o jsonpath='{.spec.runtimeClassName}')"
        test "$runtime_class" = kata-dragonball
        host_kernel="$(uname -r)"
        guest_kernel="$(kubectl logs hive-kata-smoke --namespace hive-system)"
        test -n "$guest_kernel"
        test "$guest_kernel" != "$host_kernel"
        printf 'Kata guest kernel %s differs from host kernel %s\n' \
          "$guest_kernel" "$host_kernel"
        REMOTE

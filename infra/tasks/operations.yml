version: '3'

# operations infrastructure operations.
tasks:
  status:
    desc: Show the remote infrastructure service state.
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -u
        docker compose -f "{{.INFRA_REMOTE_DIR}}/compose.yaml" ps
        sudo -n k0s kubectl get deployment,pod,svc,pvc \
          --namespace hive-data \
          -l app.kubernetes.io/name=nook-zot \
          -o wide || true
        curl -sS -o /dev/null -w 'registry.dev.nokey.sh/v2/ -> %{http_code}\n' \
          https://registry.dev.nokey.sh/v2/ || true
        curl -sS -o /dev/null -w 'sccache.dev.nokey.sh/ -> %{http_code}\n' \
          https://sccache.dev.nokey.sh/ || true
        REMOTE

  logs:
    desc: Show recent remote infrastructure logs.
    cmds:
      - |
        ssh -o BatchMode=yes "{{.INFRA_SSH_TARGET}}" 'bash -s' <<'REMOTE'
        set -u
        docker compose -f "{{.INFRA_REMOTE_DIR}}/compose.yaml" logs --tail=100
        sudo -n k0s kubectl logs deployment/nook-zot \
          --namespace hive-data \
          --tail=100 || true
        REMOTE

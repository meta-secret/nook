comparison:
  baseline_prs:
  - 717
  baseline_quality: comparable
  baseline_note: 'Closest prior record is #717 (Facebook login detection + Tier-1 popular-site fixtures). Single strong baseline;
    #737/#729 are CI-build surfaces.'
  elapsed_seconds_change_percent: 74.7
  local_execution_seconds_change_percent: -8.6
  github_actions_seconds_change_percent: 115.0
  test_inventory_total_change: 18
  regression: true
  regression_reasons:
  - "Multiple head-push retriggers while refining fixture storage (100 copies \u2192 templates \u2192 template-only CI)."
  - Docker Hub timeout and a stuck failed-job WASM handoff wait forced cancel + empty-commit retrigger.
  - Prettier failure on facebook.json after a key-order normalization commit.
waste_assessment:
  wasteful: true
  findings:
  - Initial design committed 100 near-duplicate site JSON shells; should have started from shared templates.
  - Failed-job rerun after Docker Hub flake stuck on WASM handoff; a full cancel + fresh run (or empty commit) was required.
  - A post-dedupe Prettier-only facebook.json edit burned a Verify cycle.
  required_actions:
  - For popular-site coverage, add unique shell templates first and keep catalog entries as thin template pointers.
  - Prefer full workflow rerun over failed-job-only rerun when WASM/Rust handoff artifacts are involved.
  - Run extension format:check (via task format) after any hand-edited JSON fixture/template before push.

  local_execution_seconds_change_percent: -33.3
  github_actions_seconds_change_percent: 29.8
  test_inventory_total_change: 1
  regression: true
  regression_reasons:
    - Elapsed and GitHub Actions seconds both exceeded the adjacent full-e2e baseline median by more than 20% and 60s because the first head committed a short-circuit that treated CSS-hidden success markers as present, forcing a fix push, then ci:full-e2e plus an unrelated web-e2e flake rerun and a base update.
waste_assessment:
  wasteful: true
  findings:
    - First PR cycle failed in Record headless UI demo for the same saved-message assertion the change intended to stabilize; root cause was committing on a hidden soft-SPA success node before Verify.
    - Extension e2e passed on the first ci:full-e2e attempt; the failed Full browser e2e jobs were unrelated multi-vault/import flakes and correctly used a failed-job-only rerun.
    - Local work stayed format + pr:ready only; no unnecessary local full suites.
  required_actions: []

waste_assessment:
  wasteful: true
  findings:
  - Two base-update CI cycles after the cook-hit proof already landed on the first WASM job.
  - Merging the proof PR cancelled the in-flight Main #760 publish-cache job via cancel-in-progress before the DONE-assert green path could finish.
  - Human proof/ack issue comments initially blocked task pr:ready (status classifier only ignores bot templates).
  required_actions:
  - Prefer keeping measurement evidence in the PR body, not issue comments, when using task pr:ready.
  - Avoid merging follow-up PRs while Main publish-cache is still warming if that cancel races the cache publish under test.

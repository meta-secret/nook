waste_assessment:
  wasteful: true
  findings:
    - "ci:full-e2e forced repeated full browser suites on every main-sync push, multiplying Actions minutes while only stats/docs landed on main."
    - Repeated base_update loops against stats-only and adjacent CI fixes (#737/#740) kept the branch behind main after green heads."
    - Early rustfmt/clippy preflight failures burned three full PR cycles before the first green head."
  required_actions:
    - Watch the first post-merge Main run for wall-clock improvement from parallel producers/consumers and deferred publish-cache."
    - Prefer rebasing/syncing without retriggering full e2e when only .stats or unrelated docs land on main, or drop ci:full-e2e once Main-fix validation is proven once."

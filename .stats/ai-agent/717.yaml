waste_assessment:
  wasteful: true
  findings:
    - First push skipped host ui-demo-contract because HEAD had not yet included the demo file; CI correctly failed for extension/src UI changes.
    - tabs.sendMessage callback typing should have been narrowed before the first typed push; svelte-check caught it on GitHub Actions.
    - Main landed login-picker changes mid-flight; rebase conflicts in autofill/service-worker were expected but cost a cancelled plus green cycle.
  required_actions:
    - Always run ui-demo-contract against origin/main after staging UI/extension/shared edits and before the first push.
    - Prefer explicit unknown narrowing for chrome.* callbacks in extension TypeScript before opening the PR.

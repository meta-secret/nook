version: "3"

tasks:
  tooling:static:
    desc: Report every repository tooling and AI lint/typecheck group, failing if any group fails.
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        failed=0
        failed_installs="|"
        for directory in . agentic-ai/loom .cortex/teams/ai/dynamic-skills/*/scripts; do
          test -f "$directory/package.json" || continue
          bun install --cwd "$directory" --frozen-lockfile --ignore-scripts || {
            failed=1
            failed_installs="${failed_installs}${directory}|"
          }
        done
        for directory in . agentic-ai/loom .cortex/teams/ai/dynamic-skills/*/scripts; do
          test -f "$directory/package.json" || continue
          case "$failed_installs" in *"|${directory}|"*) continue ;; esac
          bun run --cwd "$directory" lint || failed=1
          bun run --cwd "$directory" check || failed=1
        done
        exit "$failed"

  tooling:static:prepared:
    desc: Run repository tooling checks after a cached image layer has installed dependencies.
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        failed=0
        for directory in . agentic-ai/loom .cortex/teams/ai/dynamic-skills/*/scripts; do
          test -f "$directory/package.json" || continue
          if [ ! -d "$directory/node_modules" ]; then
            printf 'missing prepared dependencies: %s/node_modules\n' "$directory" >&2
            failed=1
            continue
          fi
          bun run --cwd "$directory" lint || failed=1
          bun run --cwd "$directory" check || failed=1
        done
        exit "$failed"

  web:static:
    desc: Check every web surface after preparing the required WASM contracts, without production builds.
    deps: [setup:web:focused]
    cmds:
      - task: docker:task
        vars: { TASK: web:static:container }

  web:static:container:
    desc: Independently lint and typecheck all authored web sources inside the prepared web container.
    cmds:
      - task --parallel web:static:lint web:static:app web:static:extension web:static:research web:static:simple web:static:sentinel

  web:static:lint:
    dir: "{{.ROOT_DIR}}/nook-app/nook-web"
    cmds:
      - nook-web-app/node_modules/.bin/eslint --config eslint.config.js .

  web:static:app:
    cmds:
      - task: web:static:surface
        vars: { SURFACE: nook-web-app }

  web:static:extension:
    cmds:
      - task: web:static:surface
        vars: { SURFACE: nook-web-extension }

  web:static:research:
    cmds:
      - task: web:static:surface
        vars: { SURFACE: nook-web-research }

  web:static:simple:
    cmds:
      - task: web:static:surface
        vars: { SURFACE: nook-vault-simple }

  web:static:sentinel:
    cmds:
      - task: web:static:surface
        vars: { SURFACE: nook-vault-sentinel }

  web:static:surface:
    dir: "{{.ROOT_DIR}}/nook-app/nook-web"
    requires:
      vars: [SURFACE]
    env:
      SURFACE: "{{.SURFACE}}"
    cmds:
      - |
        failed=0
        directory="$SURFACE"
        for config in "$directory"/tsconfig*.json; do
          case "$config" in
            */tsconfig.json)
              if [ "$directory" = nook-web-app ]; then continue; fi
              ;;
          esac
          nook-web-app/node_modules/.bin/tsc --noEmit -p "$config" || failed=1
        done
        config="$directory/tsconfig.json"
        if [ "$directory" = nook-web-app ]; then config="$directory/tsconfig.app.json"; fi
        nook-web-app/node_modules/.bin/svelte-check --workspace "$directory" --tsconfig "${config#*/}" || failed=1
        exit "$failed"

  static:check:
    desc: Run every tooling and web static group and retain every failure.
    cmds:
      - |
        failed=0
        task tooling:static || failed=1
        task web:static || failed=1
        exit "$failed"

  type:check:
    desc: Run every repository typing/static type-safety group and retain every failure.
    preconditions:
      - sh: test "${GITHUB_ACTIONS:-}" = "true"
        msg: "type:check is hosted-only; invoke it through `task remote TASK_NAME=type:check`."
    cmds:
      - bash .github/scripts/type-check-report.sh

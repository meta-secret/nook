version: "3"

# Standalone native entry point: the root Taskfile owns POSIX/Docker setup.
tasks:
  web:e2e:windows:install:
    desc: Install native Windows dependencies without POSIX package scripts.
    dir: "{{.TASKFILE_DIR}}/../nook-app/nook-web/nook-web-app"
    platforms: [windows]
    cmds:
      - bun install --frozen-lockfile --ignore-scripts
      - >-
        pwsh -NoProfile -Command '$ErrorActionPreference = "Stop";
        $dependencies = Join-Path (Get-Location) node_modules;
        foreach ($location in @("../node_modules", "../nook-web-extension/node_modules", "../nook-vault-simple/node_modules", "../nook-vault-sentinel/node_modules")) {
          New-Item -ItemType Junction -Path $location -Target $dependencies | Out-Null
        }'
      - bun install --cwd ../nook-web-research --frozen-lockfile --ignore-scripts

  web:e2e:windows:
    desc: Run repository automated browser surfaces in native Microsoft Edge.
    dir: "{{.TASKFILE_DIR}}/../nook-app/nook-web/nook-web-app"
    platforms: [windows]
    cmds:
      - |
        pwsh -NoProfile -Command '$ErrorActionPreference = "Stop";
        $webApp = Get-Location;
        $failed = $false;
        switch ($env:E2E_SUITE) {
          "all" { $suites = @("stable", "unstable", "sync-live", "isolation", "extension", "research") }
          "stable" { $suites = @("stable") }
          "unstable" { $suites = @("unstable") }
          "sync-live" { $suites = @("sync-live") }
          "isolation" { $suites = @("isolation") }
          "extension" { $suites = @("extension") }
          "research" { $suites = @("research") }
          default { throw "Unsupported Windows suite: $env:E2E_SUITE" }
        };
        foreach ($suite in $suites) {
          Set-Location $webApp;
          if ($suite -eq "sync-live") { $env:NOOK_E2E_SKIP_GITHUB_CLEANUP = "0" }
          else { $env:NOOK_E2E_SKIP_GITHUB_CLEANUP = "1" };
          $arguments = @("x", "--no-install", "playwright", "test");
          switch ($suite) {
            "stable" { $arguments += @("--config=playwright.windows.config.ts", "--project=stable") }
            "unstable" { $arguments += @("--config=playwright.windows.config.ts", "--project=unstable") }
            "sync-live" { $arguments += @("--config=playwright.windows.config.ts", "--project=sync-live") }
            "isolation" { $arguments += "--config=playwright.isolation.windows.config.ts" }
            "extension" { Set-Location ../nook-web-extension; $arguments += "--config=playwright.windows.config.ts" }
            "research" { Set-Location ../nook-web-research; $arguments += "--config=playwright.windows.config.ts" }
          };
          if (!(Test-Path dist/index.html) -and $suite -ne "extension") { throw "Matching Linux production artifact is required for $suite" };
          if ($env:E2E_SPEC) { $arguments += $env:E2E_SPEC };
          $env:PLAYWRIGHT_HTML_OUTPUT_DIR = "playwright-report/$suite";
          $env:PLAYWRIGHT_JSON_OUTPUT_NAME = "test-results/$suite.json";
          $env:PLAYWRIGHT_OUTPUT_DIR = "test-results/$suite";
          & bun @arguments;
          if ($LASTEXITCODE -ne 0) { $failed = $true; Write-Output "Windows Edge suite failed: $suite" };
        };
        if ($failed) { exit 1 }'

version: '3'

tasks:
  remote:
    desc: Run allowlisted tasks in one configured remote job (TASK_NAMES=<a,b> or TASK_NAME=<a>).
    env:
      REQUESTED_REMOTE_TASKS: '{{.TASK_NAMES | default .TASK_NAME}}'
    preconditions:
      - sh: command -v gh >/dev/null 2>&1
        msg: GitHub CLI is required.
      - sh: gh auth status >/dev/null 2>&1
        msg: GitHub CLI must be authenticated.
    cmds:
      - |
        set -euo pipefail

        requested_tasks="$(.github/scripts/remote-task-batch.sh --validate "$REQUESTED_REMOTE_TASKS")"

        branch="$(git branch --show-current)"
        if [ -z "$branch" ] || [ "$branch" = "main" ]; then
          echo "Remote execution requires a pushed non-main branch." >&2
          exit 2
        fi
        if [ -n "$(git status --porcelain)" ]; then
          echo "Remote execution requires a clean worktree; commit the exact experiment first." >&2
          exit 2
        fi

        local_sha="$(git rev-parse HEAD)"
        remote_refs="$(git ls-remote --refs origin "refs/heads/$branch")"
        remote_sha="$(printf '%s\n' "$remote_refs" | awk 'NR == 1 { print $1 }')"
        if [ -z "$remote_sha" ]; then
          echo "Push $branch before requesting remote execution." >&2
          exit 2
        fi
        if [ "$remote_sha" != "$local_sha" ]; then
          echo "Remote branch is not at local HEAD." >&2
          echo "local:  $local_sha" >&2
          echo "remote: $remote_sha" >&2
          exit 2
        fi

        if .github/scripts/remote-task-batch.sh --requires-current-base "$requested_tasks"; then
          .github/scripts/require-current-base.sh origin main
        fi

        gh workflow run remote.yml \
          --ref "$branch" \
          --raw-field "tasks=$requested_tasks"

        echo "Dispatched '$requested_tasks' in one job for $branch at $local_sha."
        echo "Inspect it with:"
        echo "gh run list --workflow=remote.yml --branch=\"$branch\" --commit=\"$local_sha\" --event=workflow_dispatch"

  remote:list:
    desc: Print the allowlisted remote task catalog.
    silent: true
    cmds:
      - .github/scripts/remote-task-batch.sh --list

  pr:validate:
    desc: Trigger required PR validation immediately and optionally request concurrent exact-head Codex review (PR=<number>, CODEX_REVIEW=1 only for a final coherent head, FULL_E2E=1 for a Main-fix browser gate, REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED=1 after comprehensive stabilization).
    requires:
      vars: [PR]
    env:
      REQUESTED_PR: '{{.PR}}'
      REQUEST_FULL_E2E: '{{default "0" .FULL_E2E}}'
      REQUEST_CODEX_REVIEW: '{{default "0" .CODEX_REVIEW}}'
      REQUEST_REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED: '{{default "0" .REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED}}'
    preconditions:
      - sh: command -v gh >/dev/null 2>&1
        msg: GitHub CLI is required.
      - sh: gh auth status >/dev/null 2>&1
        msg: GitHub CLI must be authenticated.
    cmds:
      - |
        set -euo pipefail

        case "$REQUESTED_PR" in
          ''|*[!0-9]*|0)
            echo "PR must be a positive pull-request number." >&2
            exit 2
            ;;
        esac
        if [ "$REQUEST_FULL_E2E" != "0" ] && [ "$REQUEST_FULL_E2E" != "1" ]; then
          echo "FULL_E2E must be 0 or 1." >&2
          exit 2
        fi
        if [ "$REQUEST_CODEX_REVIEW" != "0" ] && [ "$REQUEST_CODEX_REVIEW" != "1" ]; then
          echo "CODEX_REVIEW must be 0 or 1." >&2
          exit 2
        fi
        if [ "$REQUEST_REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED" != "0" ] && [ "$REQUEST_REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED" != "1" ]; then
          echo "REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED must be 0 or 1." >&2
          exit 2
        fi

        local_sha="$(git rev-parse HEAD)"
        pr_state="$(gh pr view "$REQUESTED_PR" --json headRefOid,baseRefName --jq '.headRefOid + "|" + .baseRefName')"
        pr_sha="${pr_state%%|*}"
        base_ref="${pr_state#*|}"
        if [ "$local_sha" != "$pr_sha" ]; then
          echo "Local HEAD is not PR #$REQUESTED_PR's current head." >&2
          echo "local: $local_sha" >&2
          echo "PR:    $pr_sha" >&2
          exit 2
        fi
        if [ -n "$(git status --porcelain)" ]; then
          echo "Commit and push the complete change before requesting PR validation." >&2
          exit 2
        fi

        .github/scripts/require-current-base.sh origin "$base_ref"

        validation_label="ci:validate"
        stale_validation_label="ci:full-e2e"
        if [ "$REQUEST_FULL_E2E" = "1" ]; then
          validation_label="ci:full-e2e"
          stale_validation_label="ci:validate"
        fi

        current_labels="$(gh pr view "$REQUESTED_PR" --json labels --jq '.labels[].name')"
        if printf '%s\n' "$current_labels" | grep -Fxq "$stale_validation_label"; then
          gh pr edit "$REQUESTED_PR" --remove-label "$stale_validation_label"
        fi
        if printf '%s\n' "$current_labels" | grep -Fxq "$validation_label"; then
          gh pr edit "$REQUESTED_PR" --remove-label "$validation_label"
        fi
        gh pr edit "$REQUESTED_PR" --add-label "$validation_label"
        review_request_state="disabled"
        review_request_output=""
        if [ "$REQUEST_CODEX_REVIEW" = "1" ]; then
          review_request_state="not-requested"
          if review_request_output="$(task pr:review \
            PR="$REQUESTED_PR" \
            REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED="$REQUEST_REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED")"; then
            printf '%s\n' "$review_request_output"
            if printf '%s\n' "$review_request_output" | grep -Fq '"state": "requested"'; then
              review_request_state="requested"
            fi
          else
            printf '%s\n' "$review_request_output"
            echo "::warning::Hosted validation is active, but the exact-head review request did not complete. Keep this validation running; collect or retry review separately without restarting validation." >&2
          fi
        fi
        dispatched_pr_state="$(gh pr view "$REQUESTED_PR" --json headRefOid,baseRefName --jq '.headRefOid + "|" + .baseRefName')"
        dispatched_pr_sha="${dispatched_pr_state%%|*}"
        dispatched_base_ref="${dispatched_pr_state#*|}"
        dispatched_base_current="1"
        if ! .github/scripts/require-current-base.sh origin "$dispatched_base_ref"; then
          dispatched_base_current="0"
        fi
        if [ "$local_sha" != "$dispatched_pr_sha" ] || [ "$base_ref" != "$dispatched_base_ref" ] || [ "$dispatched_base_current" != "1" ]; then
          gh pr edit "$REQUESTED_PR" --remove-label "$validation_label"
          repository="$(gh repo view --json nameWithOwner --jq .nameWithOwner)"
          cancel_attempt=0
          cancelled_run_ids=""
          while [ "$cancel_attempt" -lt 6 ]; do
            run_ids="$(
              for run_status in requested waiting pending queued in_progress; do
                gh api --paginate \
                  "repos/$repository/actions/runs?head_sha=$dispatched_pr_sha&status=$run_status&per_page=100" \
                  --jq ".workflow_runs[] | select(.event == \"pull_request\") | select(any(.pull_requests[]?; .number == $REQUESTED_PR)) | select(.name == \"PR\" or .name == \"Rust ecosystem checks\") | .id"
              done | sort -u
            )"
            if [ -n "$run_ids" ]; then
              for run_id in $run_ids; do
                case " $cancelled_run_ids " in
                  *" $run_id "*) ;;
                  *)
                    if gh run cancel "$run_id"; then
                      cancelled_run_ids="$cancelled_run_ids $run_id"
                    elif latest_run_status="$(gh run view "$run_id" --json status --jq .status)"; then
                      if [ "$latest_run_status" = "completed" ]; then
                        cancelled_run_ids="$cancelled_run_ids $run_id"
                      else
                        echo "Could not cancel active replacement-state run $run_id; retrying within the bounded cleanup window." >&2
                      fi
                    else
                      echo "Could not cancel or recheck replacement-state run $run_id; retrying within the bounded cleanup window." >&2
                    fi
                    ;;
                esac
              done
            fi
            cancel_attempt=$((cancel_attempt + 1))
            if [ "$cancel_attempt" -lt 6 ]; then
              sleep 5
            fi
          done
          echo "PR #$REQUESTED_PR changed head or base while validation was dispatched; removed $validation_label from the replacement state." >&2
          exit 2
        fi
        echo "Triggered PR validation for $pr_sha with label $validation_label. Codex review opt-in: $REQUEST_CODEX_REVIEW. Exact-head review request state: $review_request_state."

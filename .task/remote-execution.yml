version: '3'

tasks:
  remote:
    desc: Run named tasks in one configured remote job (TASK_NAMES=<a,b> or TASK_NAME=<a>; PUBLISH_COMPILE_CACHE=false for read-only build:compile warm verification).
    env:
      REQUESTED_REMOTE_TASKS: '{{.TASK_NAMES | default .TASK_NAME}}'
      REQUESTED_PUBLISH_COMPILE_CACHE: '{{.PUBLISH_COMPILE_CACHE}}'
      REQUESTED_E2E_PROJECT: '{{.E2E_PROJECT}}'
      REQUESTED_E2E_SPECS: '{{.E2E_SPECS}}'
      REQUESTED_E2E_GREP: '{{.E2E_GREP}}'
    preconditions:
      - sh: command -v gh >/dev/null 2>&1
        msg: GitHub CLI is required.
      - sh: gh auth status >/dev/null 2>&1
        msg: GitHub CLI must be authenticated.
    cmds:
      - |
        set -euo pipefail

        requested_tasks="$REQUESTED_REMOTE_TASKS"

        branch="$(git branch --show-current)"
        if [ -z "$branch" ] || [ "$branch" = "main" ]; then
          echo "Remote execution requires a pushed non-main branch." >&2
          exit 2
        fi
        if [[ "$requested_tasks" == *build:compile* ]]; then
          if [ "$requested_tasks" != "build:compile" ]; then
            echo "build:compile must be dispatched as the only remote task." >&2
            exit 2
          fi
          if [ "$branch" = "dev" ]; then
            echo "build:compile is a feature-branch route and cannot run on dev." >&2
            exit 2
          fi
          publish_compile_cache="${REQUESTED_PUBLISH_COMPILE_CACHE:-true}"
          case "$publish_compile_cache" in
            true|false) ;;
            *)
              echo "PUBLISH_COMPILE_CACHE must be true or false." >&2
              exit 2
              ;;
          esac
        elif [ -n "${REQUESTED_PUBLISH_COMPILE_CACHE:-}" ]; then
          echo "PUBLISH_COMPILE_CACHE is valid only with TASK_NAME=build:compile." >&2
          exit 2
        fi
        if [ -n "$(git status --porcelain)" ]; then
          echo "Remote execution requires a clean worktree; commit the exact experiment first." >&2
          exit 2
        fi

        local_sha="$(git rev-parse HEAD)"
        remote_refs="$(git ls-remote --refs origin "refs/heads/$branch")"
        remote_sha="$(printf '%s\n' "$remote_refs" | awk 'NR == 1 { print $1 }')"
        if [ -z "$remote_sha" ]; then
          echo "Push $branch before requesting remote execution." >&2
          exit 2
        fi
        if [ "$remote_sha" != "$local_sha" ]; then
          echo "Remote branch is not at local HEAD." >&2
          echo "local:  $local_sha" >&2
          echo "remote: $remote_sha" >&2
          exit 2
        fi

        if [ "$requested_tasks" != "build:compile" ]; then
          .github/scripts/require-current-base.sh origin main
        fi

        workflow_args=(
          --ref "$branch"
          --raw-field "tasks=$requested_tasks"
          --raw-field "source_sha=$local_sha"
        )
        if [ "$requested_tasks" = "build:compile" ]; then
          workflow_args+=(--raw-field "publish_compile_cache=$publish_compile_cache")
        fi
        if [ "$requested_tasks" = "web:e2e:debug" ]; then
          workflow_args+=(
            --raw-field "e2e_project=$REQUESTED_E2E_PROJECT"
            --raw-field "e2e_specs=$REQUESTED_E2E_SPECS"
            --raw-field "e2e_grep=$REQUESTED_E2E_GREP"
          )
        fi
        gh workflow run remote.yml "${workflow_args[@]}"

        echo "Dispatched '$requested_tasks' in one job for $branch at $local_sha."
        echo "Inspect it with:"
        echo "gh run list --workflow=remote.yml --branch=\"$branch\" --commit=\"$local_sha\" --event=workflow_dispatch"

  pr:validate:
    desc: Trigger required PR validation immediately (PR=<number>, FULL_E2E=1 for a Main-fix browser gate).
    requires:
      vars: [PR]
    env:
      REQUESTED_PR: '{{.PR}}'
      REQUEST_FULL_E2E: '{{default "0" .FULL_E2E}}'
    preconditions:
      - sh: command -v gh >/dev/null 2>&1
        msg: GitHub CLI is required.
      - sh: gh auth status >/dev/null 2>&1
        msg: GitHub CLI must be authenticated.
    cmds:
      - |
        set -euo pipefail

        case "$REQUESTED_PR" in
          ''|*[!0-9]*|0)
            echo "PR must be a positive pull-request number." >&2
            exit 2
            ;;
        esac
        if [ "$REQUEST_FULL_E2E" != "0" ] && [ "$REQUEST_FULL_E2E" != "1" ]; then
          echo "FULL_E2E must be 0 or 1." >&2
          exit 2
        fi
        local_sha="$(git rev-parse HEAD)"
        pr_state="$(gh pr view "$REQUESTED_PR" --json headRefOid,baseRefName --jq '.headRefOid + "|" + .baseRefName')"
        pr_sha="${pr_state%%|*}"
        base_ref="${pr_state#*|}"
        if [ "$local_sha" != "$pr_sha" ]; then
          echo "Local HEAD is not PR #$REQUESTED_PR's current head." >&2
          echo "local: $local_sha" >&2
          echo "PR:    $pr_sha" >&2
          exit 2
        fi
        if [ -n "$(git status --porcelain)" ]; then
          echo "Commit and push the complete change before requesting PR validation." >&2
          exit 2
        fi

        .github/scripts/require-current-base.sh origin "$base_ref"

        validation_label="ci:validate"
        stale_validation_label="ci:full-e2e"
        if [ "$REQUEST_FULL_E2E" = "1" ]; then
          validation_label="ci:full-e2e"
          stale_validation_label="ci:validate"
        fi

        current_labels="$(gh pr view "$REQUESTED_PR" --json labels --jq '.labels[].name')"
        if printf '%s\n' "$current_labels" | grep -Fxq "$stale_validation_label"; then
          gh pr edit "$REQUESTED_PR" --remove-label "$stale_validation_label"
        fi
        if printf '%s\n' "$current_labels" | grep -Fxq "$validation_label"; then
          gh pr edit "$REQUESTED_PR" --remove-label "$validation_label"
        fi
        gh pr edit "$REQUESTED_PR" --add-label "$validation_label"
        dispatched_pr_state="$(gh pr view "$REQUESTED_PR" --json headRefOid,baseRefName --jq '.headRefOid + "|" + .baseRefName')"
        dispatched_pr_sha="${dispatched_pr_state%%|*}"
        dispatched_base_ref="${dispatched_pr_state#*|}"
        dispatched_base_current="1"
        if ! .github/scripts/require-current-base.sh origin "$dispatched_base_ref"; then
          dispatched_base_current="0"
        fi
        if [ "$local_sha" != "$dispatched_pr_sha" ] || [ "$base_ref" != "$dispatched_base_ref" ] || [ "$dispatched_base_current" != "1" ]; then
          gh pr edit "$REQUESTED_PR" --remove-label "$validation_label"
          echo "PR #$REQUESTED_PR changed head or base while validation was dispatched; removed $validation_label from the replacement state." >&2
          exit 2
        fi
        echo "Triggered PR validation for $pr_sha with label $validation_label."

version: "3"

vars:
  REPO_ROOT:
    sh: 'if [ -n "${REPO_ROOT:-}" ]; then printf "%s" "$REPO_ROOT"; else git rev-parse --show-toplevel; fi'

tasks:
  ci:repository-policy:trusted:
    desc: Enforce repository policy with trusted read-only BuildKit access.
    cmds:
      - task: preflight:repository-policy

  ci:repository-policy:untrusted:
    desc: Enforce the same Docker policy without private credentials or caches.
    env:
      GHA_CACHE_ENABLED: ""
      GHA_CACHE_WRITE_ENABLED: ""
    cmds:
      - task: preflight:repository-policy-untrusted

  ci:pr:deploy-and-verify-previews:
    desc: Deploy and verify Cloudflare Pages PR preview aliases.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-pr-deploy-and-verify-previews.sh"

  ci:main:deploy-development:
    desc: Deploy isolated development applications to Cloudflare Pages.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-main-deploy-development.sh"

  ci:main:configure-dev-domains:
    desc: Configure and verify isolated development custom domains.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-main-configure-dev-domains.sh"

  ci:release:write-metadata:
    desc: Write release.json metadata into production dist trees.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-release-write-metadata.sh"

  ci:release:deploy-vaults:
    desc: Deploy isolated Simple and Sentinel applications for release.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-release-deploy-vaults.sh"

  ci:release:attach-prod-domains:
    desc: Attach and verify isolated production vault domains.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-release-attach-prod-domains.sh"

  ci:release:verify-extension:
    desc: Verify production browser extension deployment for a release.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-release-verify-extension.sh"

  rust:deps:outdated:
    desc: Audit direct Cargo dependencies with cargo-outdated.
    dir: '{{.REPO_ROOT}}'
    cmds:
      - |
        set -euo pipefail
        output="$(mktemp -d)"
        trap 'rm -rf "$output"' EXIT
        docker buildx bake \
          --allow="fs.read={{.REPO_ROOT}}" --allow="fs.write=$output" \
          -f '{{.REPO_ROOT}}/nook-app/docker-bake.hcl' \
          -f '{{.REPO_ROOT}}/nook-app/nook-platform/docker/rust/docker-bake.hcl' \
          -f '{{.REPO_ROOT}}/.github/docker/rust-maintenance.hcl' \
          --set "rust-dependency-audit.output=type=local,dest=$output" \
          rust-dependency-audit
        grep -Ex 'outdated=(true|false)' "$output/result"
        test "$(wc -l < "$output/result")" -eq 1
        cat "$output/report.txt"
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          cat "$output/result" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "${RUST_DEPS_OUTDATED_REPORT:-}" ]; then
          cp "$output/report.txt" "$RUST_DEPS_OUTDATED_REPORT"
        fi

  docker:prune:stale:
    desc: Prune stale Docker data on self-hosted runners.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/docker-prune-stale.sh"

  ci:main:stage-coverage:
    desc: Stage commit-keyed nook-core/auth coverage artifacts.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-main-stage-coverage.sh"

  web:research:install:
    desc: Install web-research catalog dependencies.
    cmds:
      - bun install --cwd "{{.ROOT_DIR}}/nook-app/nook-web/nook-web-app" --frozen-lockfile
      - bun install --cwd "{{.ROOT_DIR}}/nook-app/nook-web/nook-web-research" --frozen-lockfile

  web:research:verify:
    desc: Format-check, check, build, and e2e the web-research catalog.
    dir: "{{.ROOT_DIR}}/nook-app/nook-web/nook-web-research"
    cmds:
      - bun run format:check
      - bun run check
      - bun run build
      - bun run test:e2e

  web:research:deploy:
    desc: Deploy the web-research catalog to Cloudflare Pages.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/web-research-deploy.sh"

  web:research:verify-live:
    desc: Verify the live web-research custom domain.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/web-research-verify-live.sh"

  infra:surface:check:
    desc: Validate the root Taskfile still exposes Hive infrastructure commands.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/infra-surface-check.sh"

  ci:format:implementation:
    desc: Format only the bounded implementation file list with trusted Docker tooling.
    dir: "{{.REPO_ROOT}}"
    requires:
      vars: [IMPLEMENTATION_REPO_ROOT, FORMAT_CHANGED_FILES]
    cmds:
      - |
        bash <<'FORMAT_BASH'
        set -euo pipefail
        inputs="$(mktemp -d)"
        output="$(mktemp -d)"
        trap 'rm -rf "$inputs" "$output"' EXIT
        cp "$FORMAT_CHANGED_FILES" "$inputs/files"
        implementation="$(realpath "$IMPLEMENTATION_REPO_ROOT")"
        # Stage only the reviewed changed-file list. Never upload the implementation
        # checkout, its Git configuration, or implementation-authored build tooling.
        mkdir "$inputs/source"
        while IFS= read -r -d '' path; do
          case "$path" in
            ''|/*|..|../*|*/../*|*/..|.git|.git/*) exit 1 ;;
          esac
          if [ ! -f "$implementation/$path" ] || [ -L "$implementation/$path" ]; then
            continue
          fi
          resolved="$(realpath "$implementation/$path")"
          case "$resolved" in "$implementation"/*) ;; *) exit 1 ;; esac
          mkdir -p "$inputs/source/$(dirname "$path")"
          cp -- "$implementation/$path" "$inputs/source/$path"
        done <"$inputs/files"
        docker buildx bake \
          --allow="fs.read={{.REPO_ROOT}}" \
          --allow="fs.read=$inputs" \
          --allow="fs.write=$output" \
          -f '{{.REPO_ROOT}}/.github/formatting/ci.hcl' \
          --set "formatter-tools.context={{.REPO_ROOT}}/.github/formatting" \
          --set "format-export.context={{.REPO_ROOT}}/.github/formatting" \
          --set "format-export.contexts.implementation-source=$inputs/source" \
          --set "format-export.contexts.format-input=$inputs" \
          --set "format-export.output=type=local,dest=$output" \
          format-export
        while IFS= read -r -d '' path; do
          case "$path" in
            ''|/*|..|../*|*/../*|*/..|.git|.git/*) exit 1 ;;
          esac
          if [ ! -f "$implementation/$path" ] || [ -L "$implementation/$path" ]; then
            test ! -e "$output/$path"
            continue
          fi
          resolved="$(realpath "$implementation/$path")"
          case "$resolved" in "$implementation"/*) ;; *) exit 1 ;; esac
          test -f "$output/$path" && test ! -L "$output/$path"
          cp -- "$output/$path" "$implementation/$path"
        done <"$inputs/files"
        FORMAT_BASH

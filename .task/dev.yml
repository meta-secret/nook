version: '3'

vars:
  REPO_ROOT:
    sh: 'if [ -n "${REPO_ROOT:-}" ]; then printf "%s" "$REPO_ROOT"; else git rev-parse --show-toplevel; fi'

tasks:
  land:
    desc: Land the current clean, remotely compiled feature commit into local dev.
    requires:
      vars: [FEATURE_BRANCH]
    env:
      FEATURE_BRANCH: '{{.FEATURE_BRANCH}}'
      LOCAL_BUILD_EVIDENCE_PATH: '{{default "" .LOCAL_BUILD_EVIDENCE_PATH}}'
      LOCAL_BUILD_EVIDENCE_AUTHORIZATION: '{{default "" .LOCAL_BUILD_EVIDENCE_AUTHORIZATION}}'
    cmds:
      - bun "{{.REPO_ROOT}}/agentic-ai/loom/src/dev-delivery/dev-land-cli.ts"

  local-build-evidence:
    desc: Generate one short-lived local build proof for an explicit dev:land exception.
    requires:
      vars: [FEATURE_BRANCH]
    env:
      FEATURE_BRANCH: '{{.FEATURE_BRANCH}}'
      LOCAL_BUILD_TASK: '{{default "app:build" .LOCAL_BUILD_TASK}}'
      LOCAL_BUILD_TASK_ID: '{{default "" .LOCAL_BUILD_TASK_ID}}'
      LOCAL_BUILD_ATTEMPT: '{{default "1" .LOCAL_BUILD_ATTEMPT}}'
      LOCAL_BUILD_EVIDENCE_PATH: '{{default "" .LOCAL_BUILD_EVIDENCE_PATH}}'
    cmds:
      - bun "{{.REPO_ROOT}}/agentic-ai/loom/src/dev-delivery/local-build-evidence-cli.ts"

  publish:
    desc: Manager-only snapshot and ordinary fast-forward publication of local dev to origin/dev.
    requires:
      vars: [EXPECTED_SHA]
    env:
      EXPECTED_SHA: '{{.EXPECTED_SHA}}'
    cmds:
      - bun "{{.REPO_ROOT}}/agentic-ai/loom/src/dev-delivery/dev-publish-cli.ts"

  pr-manager:
    desc: Manager-only creation or update of the single dev-to-main pull request for origin/dev.
    requires:
      vars: [EXPECTED_SHA]
    env:
      EXPECTED_SHA: '{{.EXPECTED_SHA}}'
    cmds:
      - bun "{{.REPO_ROOT}}/agentic-ai/loom/src/dev-delivery/dev-pr-manager-cli.ts"

  manager-gizmo:
    desc: On-demand Dev Manager snapshot inspection and safe next-state guidance.
    cmds:
      - bun "{{.REPO_ROOT}}/agentic-ai/loom/src/dev-delivery/dev-manager-gizmo-cli.ts"

  promote:
    desc: Manager-only guarded promotion of the exact tested origin/dev SHA to origin/main.
    requires:
      vars: [EXPECTED_SHA]
    env:
      EXPECTED_SHA: '{{.EXPECTED_SHA}}'
    cmds:
      - bun "{{.REPO_ROOT}}/agentic-ai/loom/src/dev-delivery/dev-promote-cli.ts"

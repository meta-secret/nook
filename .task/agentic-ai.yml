version: '3'

vars:
  REPO_ROOT:
    sh: 'if [ -n "${REPO_ROOT:-}" ]; then printf "%s" "$REPO_ROOT"; else git rev-parse --show-toplevel; fi'
  CI_AGENT_DIR: agentic-ai/ci-agent

tasks:
  skills:install:
    desc: Install the executable-skill workspace with its frozen lockfile.
    silent: true
    cmds:
      - bun "{{.REPO_ROOT}}/agentic-ai/loom/src/executable-skills/package-gate-cli.ts" install "{{.REPO_ROOT}}"

  skills:format:
    desc: Format every executable skill package.
    deps: [skills:install]
    cmds:
      - bun "{{.REPO_ROOT}}/agentic-ai/loom/src/executable-skills/package-gate-cli.ts" format "{{.REPO_ROOT}}"

  skills:verify:
    desc: Verify every executable skill package.
    deps: [skills:install]
    cmds:
      - bun "{{.REPO_ROOT}}/agentic-ai/loom/src/executable-skills/package-gate-cli.ts" verify "{{.REPO_ROOT}}"

  skills:run:
    desc: Run one executable skill action from strict YAML (REQUEST_YAML='<yaml>').
    deps: [skills:install]
    requires:
      vars: [REQUEST_YAML]
    env:
      NOOK_SKILL_REQUEST_YAML: '{{.REQUEST_YAML}}'
    cmds:
      - >-
        bun "{{.REPO_ROOT}}/.cortex/teams/ai/dynamic-skills/executable-skill-host/scripts/src/cli.ts"
        "--request-yaml=$NOOK_SKILL_REQUEST_YAML"

  skills:tools-list:
    desc: List executable skill actions, schemas, and resolved YAML examples.
    deps: [skills:install]
    cmds:
      - bun "{{.REPO_ROOT}}/.cortex/teams/ai/dynamic-skills/executable-skill-host/scripts/src/cli.ts" --tools-list

  loom:delegation-visualization:
    desc: >-
      Render one transient native Team Agent plan without installing project
      dependencies.
    requires:
      vars: [REQUEST_JSON]
    env:
      NOOK_DELEGATION_VISUALIZATION_REQUEST_JSON: '{{.REQUEST_JSON}}'
    cmds:
      - bun "{{.REPO_ROOT}}/.cortex/teams/ai/dynamic-skills/delegation-visualization/scripts/src/cli.ts"

  loom:install:
    desc: Install Loom Bun dependencies with a frozen lockfile.
    dir: agentic-ai/loom
    silent: true
    cmds:
      - bun install --frozen-lockfile 1>&2

  loom:format:
    desc: Format Loom TypeScript sources with Prettier.
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun run format

  loom:format:check:
    desc: Check Loom Prettier formatting.
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun run format:check

  loom:test:
    desc: Run Loom unit tests.
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun test

  loom:check:
    desc: Typecheck Loom.
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun run check

  loom:lint:
    desc: 'ESLint Loom (max-params, ban unknown, named call args).'
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun run lint

  loom:verify:
    desc: Audit Cortex, then format-check, lint, typecheck, and unit-test Loom.
    deps: [loom:install]
    cmds:
      - task: loom:cortex-audit
      - task: skills:verify
      - task: loom:format:check
      - task: loom:lint
      - task: loom:check
      - task: loom:test
      - task: loom:module-experts:validate
      - task: loom:structural-experts:validate

  loom:module-experts:validate:
    desc: Validate named read-only module experts and complete production-module routing.
    deps: [loom:install]
    cmds:
      - >-
        bun run --cwd agentic-ai/loom module-experts --
        validate --working-directory "{{.REPO_ROOT}}"

  loom:module-experts:invoke:
    desc: Invoke and journal one registered module expert through the isolated read-only Codex runtime.
    deps: [loom:install]
    requires:
      vars: [REQUEST]
    cmds:
      - >-
        bun agentic-ai/loom/src/module-experts/cli.ts
        invoke --request "{{.REQUEST}}" --working-directory "{{.REPO_ROOT}}"

  loom:structural-experts:validate:
    desc: Validate bounded read-only structural refactoring experts.
    deps: [loom:install]
    cmds:
      - >-
        bun run --cwd agentic-ai/loom structural-experts --
        validate --working-directory "{{.REPO_ROOT}}"

  loom:structural-experts:invoke:
    desc: Invoke and journal one authorized structural expert through the isolated runtime.
    deps: [loom:install]
    requires:
      vars: [REQUEST]
    cmds:
      - >-
        bun agentic-ai/loom/src/structural-experts/cli.ts
        invoke --request "{{.REQUEST}}" --working-directory "{{.REPO_ROOT}}"

  loom:run:
    desc: Run Loom with a domain YAML request (CONFIG=<request.yaml>).
    deps: [loom:install]
    vars:
      CONFIG: '{{.CONFIG}}'
    requires:
      vars: [CONFIG]
    cmds:
      # CONFIG paths are repo-root relative (or absolute). Resolve before --cwd so
      # bun does not look under agentic-ai/loom/<relative-config>.
      - |
        set -euo pipefail
        config="{{.CONFIG}}"
        case "$config" in
          /*) ;;
          *) config="{{.REPO_ROOT}}/$config" ;;
        esac
        bun run --cwd agentic-ai/loom loom -- "$config"

  loom:default:
    desc: Run a defaultable Loom family from in-code examples (FAMILY=prePush|toolsList|cortexAudit|cortexSessionClean|dependencyPopularity).
    deps: [loom:install]
    requires:
      vars: [FAMILY]
    cmds:
      - bun run --cwd agentic-ai/loom loom -- --default "{{.FAMILY}}"

  loom:pre-push:
    desc: Run the default pre-push request; its host formatter includes Loom.
    deps: [loom:install]
    vars:
      CONFIG: '{{default "" .CONFIG}}'
      PR: '{{default "" .PR}}'
    cmds:
      - bun .github/scripts/pr-authored-budget.ts "{{.PR}}" --stop-only
      - |
        set -euo pipefail
        if [ -n "{{.CONFIG}}" ]; then
          task loom:run CONFIG="{{.CONFIG}}"
        else
          task loom:default FAMILY=prePush
        fi
      - bun .github/scripts/pr-authored-budget.ts "{{.PR}}"

  loom:cortex-audit:
    desc: Audit .cortex via Loom (optional CONFIG YAML, otherwise in-code default).
    deps: [loom:install]
    vars:
      CONFIG: '{{default "" .CONFIG}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.CONFIG}}" ]; then
          task loom:run CONFIG="{{.CONFIG}}"
        else
          task loom:default FAMILY=cortexAudit
        fi

  loom:cortex-session-clean:
    desc: Assert that ignored Cortex session memory is absent.
    deps: [loom:install]
    cmds:
      - task loom:default FAMILY=cortexSessionClean

  loom:module-delivery:validate:
    desc: Validate and dry-run one reviewed module delivery plan (PLAN=<plan.json>).
    deps: [loom:install]
    requires:
      vars: [PLAN]
    cmds:
      - |
        set -euo pipefail
        plan="{{.PLAN}}"
        case "$plan" in
          /*) ;;
          *) plan="{{.REPO_ROOT}}/$plan" ;;
        esac
        bun run --cwd agentic-ai/loom module-delivery -- --plan "$plan"

  loom:agent-delegation:start:
    desc: Start one declared ordinary delegation run (PLAN=<plan.json>).
    deps: [loom:install]
    requires:
      vars: [PLAN]
    cmds:
      - |
        set -euo pipefail
        plan="{{.PLAN}}"
        case "$plan" in
          /*) ;;
          *) plan="{{.REPO_ROOT}}/$plan" ;;
        esac
        bun run --cwd agentic-ai/loom agent-delegation -- \
          start --plan "$plan" --working-directory "{{.REPO_ROOT}}"

  loom:agent-delegation:admit:
    desc: Admit one declared ordinary delegation attempt before dispatch (REQUEST=<request.json>).
    deps: [loom:install]
    requires:
      vars: [REQUEST]
    cmds:
      - |
        set -euo pipefail
        request="{{.REQUEST}}"
        case "$request" in
          /*) ;;
          *) request="{{.REPO_ROOT}}/$request" ;;
        esac
        bun run --cwd agentic-ai/loom agent-delegation -- \
          admit --request "$request" --working-directory "{{.REPO_ROOT}}"

  loom:agent-delegation:record:
    desc: Finalize one admitted ordinary delegated agent attempt (REQUEST=<request.json>).
    deps: [loom:install]
    requires:
      vars: [REQUEST]
    cmds:
      - |
        set -euo pipefail
        request="{{.REQUEST}}"
        case "$request" in
          /*) ;;
          *) request="{{.REPO_ROOT}}/$request" ;;
        esac
        bun run --cwd agentic-ai/loom agent-delegation -- \
          record --request "$request" --working-directory "{{.REPO_ROOT}}"

  loom:agent-delegation:finalize:
    desc: Verify and materialize one complete ordinary delegation run (REQUEST=<request.json>).
    deps: [loom:install]
    requires:
      vars: [REQUEST]
    cmds:
      - |
        set -euo pipefail
        request="{{.REQUEST}}"
        case "$request" in
          /*) ;;
          *) request="{{.REPO_ROOT}}/$request" ;;
        esac
        bun run --cwd agentic-ai/loom agent-delegation -- \
          finalize --request "$request" --working-directory "{{.REPO_ROOT}}"

  loom:skill-scaffold:
    desc: Scaffold a dynamic-skill card via Loom (CONFIG=<request.yaml>).
    deps: [loom:install]
    requires:
      vars: [CONFIG]
    cmds:
      - task: loom:run
        vars:
          CONFIG: '{{.CONFIG}}'

  loom:agent-stats:
    desc: Assemble, validate, or publish AI-agent stats via Loom (CONFIG=<request.yaml>).
    deps: [loom:install]
    requires:
      vars: [CONFIG]
    cmds:
      - task: loom:run
        vars:
          CONFIG: '{{.CONFIG}}'

  loom:pr-land:
    desc: PR land assist via Loom (CONFIG=<request.yaml>).
    deps: [loom:install]
    requires:
      vars: [CONFIG]
    cmds:
      - task: loom:run
        vars:
          CONFIG: '{{.CONFIG}}'

  loom:tools-list:
    desc: List Loom tools and schemas via YAML protocol.
    deps: [loom:install]
    vars:
      CONFIG: '{{default "" .CONFIG}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.CONFIG}}" ]; then
          task loom:run CONFIG="{{.CONFIG}}"
        else
          task loom:default FAMILY=toolsList
        fi

  loom:dependency-popularity:
    desc: Check npm/crates.io dependency popularity against thresholds.
    deps: [loom:install]
    vars:
      CONFIG: '{{default "" .CONFIG}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.CONFIG}}" ]; then
          task loom:run CONFIG="{{.CONFIG}}"
        else
          task loom:default FAMILY=dependencyPopularity
        fi

  hive:format:
    desc: Format the Hive Rust workspace.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml format

  hive:guest:format:changed:
    desc: Format canonical changed files with the tool bundle baked into a sealed Hive guest.
    dir: '{{.REPO_ROOT}}'
    preconditions:
      - sh: test "${HIVE_SEALED_GUEST:-}" = "1"
        msg: hive:guest:format:changed is available only inside a sealed Hive guest
      - sh: test -n "${FORMAT_CHANGED_FILES:-}" && test -r "$FORMAT_CHANGED_FILES"
        msg: hive:guest:format:changed requires the canonical changed-file list
    cmds:
      - |
        bash <<'FORMAT_CHANGED_BASH'
        set -euo pipefail
        formatter_root="${NOOK_FORMATTER_ROOT:-/opt/nook-formatter}"
        NOOK_FORMATTER_ROOT="$formatter_root" \
        NOOK_REPO_ROOT="$PWD" \
        FORMAT_CHANGED_FILES="$FORMAT_CHANGED_FILES" \
          bash "$formatter_root/format.sh"
        FORMAT_CHANGED_BASH

  hive:guest:format:
    desc: Apply the canonical changed-file formatter inside a sealed Hive Kata guest.
    preconditions:
      - sh: test "${HIVE_SEALED_GUEST:-}" = "1"
        msg: hive:guest:format is available only inside a sealed Hive guest
    cmds:
      - bash .github/scripts/format-host-apply.sh

  hive:guest:pr:ready:
    desc: Run the existing PR readiness audit natively inside a sealed Hive guest (PR=<number>).
    preconditions:
      - sh: test "${HIVE_SEALED_GUEST:-}" = "1"
        msg: hive:guest:pr:ready is available only inside a sealed Hive guest
    requires:
      vars: [PR]
    env:
      PR_NUMBER: '{{.PR}}'
    cmds:
      - task loom:cortex-session-clean
      - cd agentic-ai/ci-agent && npm ci
      - cd agentic-ai/ci-agent && npm run build
      - >-
        cd agentic-ai/ci-agent &&
        export GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}" &&
        node dist/main/main.js pr-ready

  hive:check:
    desc: Format-check and lint the Hive worker.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml check

  hive:verify:
    desc: Run Hive Clippy and behavior tests concurrently.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml verify

  hive:build:
    desc: Build the Hive worker.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml build

  hive:test:
    desc: Run Hive behavior tests.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml test

  hive:handoff:test:
    desc: Run the Main-to-Hive Workbench handoff behavior tests.
    cmds:
      - node --test .github/scripts/main-failure-handoff.test.cjs

  hive:cache:publish:
    desc: Publish the already-verified Hive BuildKit graph.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml cache:publish

  hive:image:
    desc: Build the linux/amd64 Hive worker image.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml image

  ci-agent:install:
    internal: true
    dir: '{{.CI_AGENT_DIR}}'
    cmds:
      - npm ci

  ci-agent:build:
    internal: true
    dir: '{{.CI_AGENT_DIR}}'
    deps:
      - ci-agent:install
    sources:
      - src/**/*
      - tsconfig.json
      - package.json
      - package-lock.json
    generates:
      - dist/main/main.js
    cmds:
      - npm run build

  ci-agent:test:
    desc: Install and unit-test ci-agent on the host.
    dir: '{{.CI_AGENT_DIR}}'
    cmds:
      - npm ci
      - npm test

  ci-agent:smoke:
    desc: Verify exitCiAgent terminates despite open handles.
    dir: '{{.CI_AGENT_DIR}}'
    deps:
      - ci-agent:build
    cmds:
      - node scripts/exit-smoke.mjs

  ci-agent:plan:
    desc: Run the task-planning agent in a detached worktree and copy the plan back.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-agent-plan.sh"

  ci-agent:prepare:
    desc: Install and build ci-agent on the provisioned host (Node 22.13+).
    cmds:
      - >-
        node -e "const [maj,min]=process.versions.node.split('.').map(Number);
        if(maj<22||(maj===22&&min<13)){console.error('ci-agent requires Node.js 22.13+ (have '+process.versions.node+')');process.exit(1)}"
      - task: ci-agent:build

  hive:console:install:
    desc: Install Hive Control Center dependencies.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bun install --frozen-lockfile

  hive:console:check:
    desc: Format-check, type-check, and build the Hive Control Center.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bun run format:check
      - bun run check
      - bun run build

  hive:console:e2e:prepare:
    desc: Install the Chromium browser for Hive Control Center Playwright e2e.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bunx playwright install --with-deps chromium

  hive:console:e2e:
    desc: Run Hive Control Center Playwright journeys.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bun run test:e2e

  hive:console:verify:
    desc: Install, check, and e2e-test the Hive Control Center.
    cmds:
      - task: hive:console:install
      - task: hive:console:check
      - task: hive:console:e2e:prepare
      - task: hive:console:e2e

  ci-agent:host:run:
    internal: true
    desc: Run a ci-agent command directly in the provisioned checkout.
    deps:
      - ci-agent:prepare
    vars:
      CI_AGENT_CMD: '{{.CI_AGENT_CMD}}'
    cmds:
      - node '{{.CI_AGENT_DIR}}/dist/main/main.js' '{{.CI_AGENT_CMD}}'

  ci-agent:run:
    desc: Run Cursor SDK agent directly in the provisioned checkout.
    deps:
      - setup
    cmds:
      - task: ci-agent:host:run
        vars:
          CI_AGENT_CMD: agent

  ci-agent:fix:
    desc: Run CI fix agent and open a PR for explicit review and merge authorization.
    deps:
      - setup
    cmds:
      - task: ci-agent:host:run
        vars:
          CI_AGENT_CMD: fix

  ci-agent:implement:
    desc: Implement issue/prompt and open a PR for explicit review and merge authorization.
    deps:
      - setup
    cmds:
      - task: ci-agent:host:run
        vars:
          CI_AGENT_CMD: implement

  pr:ci-agent:audit:
    internal: true
    requires:
      vars: [PR, CI_AGENT_CMD]
    deps:
      - ci-agent:prepare
    vars:
      PR_GH_TOKEN:
        sh: >-
          bash -c 'printf "%s" "${NOOK_GITHUB_PAT:-${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token)}}}"'
      PR_GITHUB_REPOSITORY:
        sh: >-
          bash -c 'if [ -n "${GITHUB_REPOSITORY:-}" ]; then
          printf "%s" "$GITHUB_REPOSITORY"; else
          remote="$(git remote get-url origin)";
          remote="${remote%.git}";
          case "$remote" in
          git@github.com:*) remote="${remote#git@github.com:}" ;;
          ssh://git@github.com/*) remote="${remote#ssh://git@github.com/}" ;;
          https://github.com/*) remote="${remote#https://github.com/}" ;;
          *) echo "Unsupported GitHub origin: $remote" >&2; exit 2 ;;
          esac;
          case "$remote" in */*/*|/*|*/|*:*|*@*) echo "Invalid GitHub repository: $remote" >&2; exit 2 ;;
          */*) printf "%s" "$remote" ;;
          *) echo "Could not derive GITHUB_REPOSITORY from origin: $remote" >&2; exit 2 ;;
          esac; fi'
    env:
      GH_TOKEN: '{{.PR_GH_TOKEN}}'
      GITHUB_REPOSITORY: '{{.PR_GITHUB_REPOSITORY}}'
      PR_NUMBER: '{{.PR}}'
      REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED: '{{default "0" .REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED}}'
      REVIEW_WAIT_SECONDS: '{{default "600" .REVIEW_WAIT_SECONDS}}'
    cmds:
      - node '{{.CI_AGENT_DIR}}/dist/main/main.js' '{{.CI_AGENT_CMD}}'

  pr:preflight:
    desc: Print a machine-readable PR audit before implementation or final validation (PR=<number>).
    requires:
      vars: [PR]
    cmds:
      - task: pr:ci-agent:audit
        vars:
          PR: '{{.PR}}'
          CI_AGENT_CMD: pr-preflight

  pr:ready:
    desc: Read-only assertion that the exact PR head is current, deployed, repository-green, and has no pending feedback (PR=<number>); never merges or waits for reviewers.
    requires:
      vars: [PR]
    cmds:
      - task loom:cortex-session-clean
      - task: pr:ci-agent:audit
        vars:
          PR: '{{.PR}}'
          CI_AGENT_CMD: pr-ready

  pr:review:
    desc: Request one circuit-breaker-guarded, idempotent exact-head Codex review (PR=<number>, REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED=1 after comprehensive stabilization); never waits and is not required for readiness.
    requires:
      vars: [PR]
    cmds:
      - task: pr:ci-agent:audit
        vars:
          PR: '{{.PR}}'
          CI_AGENT_CMD: pr-review
          REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED: '{{default "0" .REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED}}'

  pr:review:stabilize:
    desc: Collect exact-head Cloud review after hosted validation dispatch, allowing a bounded timeout (PR=<number>, REVIEW_WAIT_SECONDS defaults to 600, REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED=1 after comprehensive stabilization).
    requires:
      vars: [PR]
    cmds:
      - task: pr:ci-agent:audit
        vars:
          PR: '{{.PR}}'
          CI_AGENT_CMD: pr-review-stabilize
          REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED: '{{default "0" .REVIEW_CIRCUIT_BREAKER_ACKNOWLEDGED}}'
          REVIEW_WAIT_SECONDS: '{{default "600" .REVIEW_WAIT_SECONDS}}'

  pr:review-local:
    desc: Run an advisory local Codex review against origin/main; unavailable Codex access skips without blocking delivery.
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        if ! command -v codex >/dev/null 2>&1; then
          echo "Codex CLI is unavailable; skipping advisory local review.";
          echo "Cloud review remains Codex-only; hosted validation dispatch never waits for it.";
          exit 0;
        fi;
        if ! codex login status >/dev/null 2>&1; then
          echo "Codex CLI is not authenticated; skipping advisory local review.";
          echo "Cloud review remains Codex-only; hosted validation dispatch never waits for it.";
          exit 0;
        fi;
        git fetch origin main;
        if ! codex review --base origin/main; then
          echo "Codex local review was unavailable; continuing without blocking delivery.";
          echo "Cloud review remains Codex-only; hosted validation dispatch never waits for it.";
        fi'

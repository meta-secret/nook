version: '3'

vars:
  REPO_ROOT:
    sh: 'if [ -n "${REPO_ROOT:-}" ]; then printf "%s" "$REPO_ROOT"; else git rev-parse --show-toplevel; fi'
  CI_AGENT_DIR: agentic-ai/ci-agent
  CI_AGENT_IMAGE:
    sh: >-
      if [ -n "${CI_AGENT_IMAGE:-}" ]; then
        printf '%s\n' "$CI_AGENT_IMAGE";
      else
        repo_root="$(git rev-parse --show-toplevel)";
        worktree_id="$(printf '%s' "$repo_root" | cksum | awk '{print $1}')";
        printf 'nook-ci-agent:local-%s\n' "$worktree_id";
      fi
  # Host Docker socket (sibling containers via sock — not DinD). Override on unusual setups.
  DOCKER_SOCK: '{{default "/var/run/docker.sock" .DOCKER_SOCK}}'
  DOCKER: '{{default "docker" .DOCKER}}'
  DOCKER_NOFILE_LIMIT: '{{default "1048576" .DOCKER_NOFILE_LIMIT}}'

tasks:
  loom:install:
    desc: Install Loom Bun dependencies with a frozen lockfile.
    dir: agentic-ai/loom
    cmds:
      - bun install --frozen-lockfile

  loom:test:
    desc: Run Loom unit tests.
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun test

  loom:check:
    desc: Typecheck Loom.
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun run check

  loom:pre-push:
    desc: Host-apply task format and enforce the UI demo contract via Loom.
    deps: [loom:install]
    cmds:
      - bun run --cwd agentic-ai/loom loom -- pre-push {{.CLI_ARGS}}

  loom:cortex-audit:
    desc: Audit .cortex links and dynamic-skill index sync via Loom.
    deps: [loom:install]
    cmds:
      - bun run --cwd agentic-ai/loom loom -- cortex-audit {{.CLI_ARGS}}

  loom:skill-scaffold:
    desc: Scaffold a dynamic-skill card (SLUG=<kebab-case>; pass CLI_ARGS='--wrappers' when needed).
    deps: [loom:install]
    requires:
      vars: [SLUG]
    cmds:
      - bun run --cwd agentic-ai/loom loom -- skill-scaffold {{.SLUG}} {{.CLI_ARGS}}

  loom:agent-stats:
    desc: Assemble, validate, or publish AI-agent stats YAML (ARGS='assemble --pr N ...').
    deps: [loom:install]
    requires:
      vars: [ARGS]
    cmds:
      - bun run --cwd agentic-ai/loom loom -- agent-stats {{.ARGS}}

  loom:pr-land:
    desc: PR land assist via Loom (ARGS='status|validate|ready|merge-check --pr N').
    deps: [loom:install]
    requires:
      vars: [ARGS]
    cmds:
      - bun run --cwd agentic-ai/loom loom -- pr-land {{.ARGS}}

  hive:format:
    desc: Format the Hive Rust workspace.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml format

  hive:guest:format:
    desc: Format the repository natively inside a sealed Hive Kata guest.
    preconditions:
      - sh: test "${HIVE_SEALED_GUEST:-}" = "1"
        msg: hive:guest:format is available only inside a sealed Hive guest
    cmds:
      - cd nook-app/nook-platform && cargo fmt --all
      - cd nook-app/nook-web/nook-web-app && bun install --frozen-lockfile
      - cd nook-app/nook-web/nook-web-app && bun run format
      - cd nook-app/nook-web/nook-web-extension && bun run format
      - cd agentic-ai/minds && cargo fmt --all

  hive:guest:pr:ready:
    desc: Run the existing PR readiness audit natively inside a sealed Hive guest (PR=<number>).
    preconditions:
      - sh: test "${HIVE_SEALED_GUEST:-}" = "1"
        msg: hive:guest:pr:ready is available only inside a sealed Hive guest
    requires:
      vars: [PR]
    env:
      PR_NUMBER: '{{.PR}}'
    cmds:
      - cd agentic-ai/ci-agent && npm ci
      - cd agentic-ai/ci-agent && npm run build
      - >-
        cd agentic-ai/ci-agent &&
        export GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}" &&
        node dist/main/main.js pr-ready

  hive:check:
    desc: Format-check and lint the Hive worker.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml check

  hive:verify:
    desc: Run Hive Clippy and behavior tests concurrently.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml verify

  hive:build:
    desc: Build the Hive worker.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml build

  hive:test:
    desc: Run Hive behavior tests.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml test

  hive:handoff:test:
    desc: Run the Main-to-Hive Workbench handoff behavior tests.
    cmds:
      - node --test .github/scripts/main-failure-handoff.test.cjs

  hive:cache:publish:
    desc: Publish the already-verified Hive BuildKit graph.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml cache:publish

  hive:image:
    desc: Build the linux/amd64 Hive worker image.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml image

  ci-agent:install:
    internal: true
    dir: '{{.CI_AGENT_DIR}}'
    cmds:
      - npm ci

  ci-agent:build:
    internal: true
    dir: '{{.CI_AGENT_DIR}}'
    deps:
      - ci-agent:install
    sources:
      - src/**/*
      - tsconfig.json
      - package.json
      - package-lock.json
    generates:
      - dist/main/main.js
    cmds:
      - npm run build

  ci-agent:test:
    desc: Install and unit-test ci-agent on the host.
    dir: '{{.CI_AGENT_DIR}}'
    cmds:
      - npm ci
      - npm test

  ci-agent:smoke:
    desc: Verify exitCiAgent terminates despite open handles.
    dir: '{{.CI_AGENT_DIR}}'
    deps:
      - ci-agent:build
    cmds:
      - node scripts/exit-smoke.mjs

  ci-agent:plan:
    desc: Run the task-planning agent in a detached worktree and copy the plan back.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-agent-plan.sh"

  ci-agent:prepare:
    desc: Install and build ci-agent on the host (Node 22.13+). Prefer Docker tasks for CI.
    cmds:
      - >-
        node -e "const [maj,min]=process.versions.node.split('.').map(Number);
        if(maj<22||(maj===22&&min<13)){console.error('ci-agent requires Node.js 22.13+ (have '+process.versions.node+')');process.exit(1)}"
      - task: ci-agent:build

  hive:console:install:
    desc: Install Hive Control Center dependencies.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bun install --frozen-lockfile

  hive:console:check:
    desc: Format-check, type-check, and build the Hive Control Center.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bun run format:check
      - bun run check
      - bun run build

  hive:console:e2e:prepare:
    desc: Install the Chromium browser for Hive Control Center Playwright e2e.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bunx playwright install --with-deps chromium

  hive:console:e2e:
    desc: Run Hive Control Center Playwright journeys.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bun run test:e2e

  hive:console:verify:
    desc: Install, check, and e2e-test the Hive Control Center.
    cmds:
      - task: hive:console:install
      - task: hive:console:check
      - task: hive:console:e2e:prepare
      - task: hive:console:e2e

  ci-agent:docker:build:
    desc: Build the worktree-scoped nook-ci-agent image (Node + Docker CLI + task; no daemon).
    sources:
      - agentic-ai/ci-agent/Dockerfile
      - agentic-ai/ci-agent/.dockerignore
      - agentic-ai/ci-agent/package.json
      - agentic-ai/ci-agent/package-lock.json
      - agentic-ai/ci-agent/tsconfig.json
      - agentic-ai/ci-agent/src/**/*
    cmds:
      - >-
        {{.DOCKER}} build
        --platform linux/amd64
        -t {{.CI_AGENT_IMAGE}}
        -f {{.CI_AGENT_DIR}}/Dockerfile
        {{.CI_AGENT_DIR}}

  ci-agent:docker:run:
    desc: Run a ci-agent command in Docker with repo bind-mount and docker.sock.
    deps:
      - ci-agent:docker:build
    vars:
      REPO_ROOT:
        sh: 'echo "${REPO_ROOT:-$(git rev-parse --show-toplevel)}"'
      CI_AGENT_CMD: '{{.CI_AGENT_CMD}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        repo_root="{{.REPO_ROOT}}";
        if [ ! -e "$repo_root/.git" ]; then
          echo "ci-agent:docker:run: missing $repo_root/.git — refuse to start agent without a checkout" >&2;
          ls -la "$repo_root" >&2 || true;
          exit 1;
        fi;
        mounts=(-v "$repo_root:$repo_root");
        if [ -n "${RUNNER_WORKSPACE:-}" ]; then mounts+=(-v "$RUNNER_WORKSPACE:$RUNNER_WORKSPACE"); fi;
        if [ -n "${RUNNER_TEMP:-}" ]; then mounts+=(-v "$RUNNER_TEMP:$RUNNER_TEMP"); fi;
        {{.DOCKER}} run --rm
        --init
        --platform linux/amd64
        --ulimit nofile={{.DOCKER_NOFILE_LIMIT}}:{{.DOCKER_NOFILE_LIMIT}}
        "${mounts[@]}"
        -w "$repo_root"
        -v {{.DOCKER_SOCK}}:/var/run/docker.sock
        -e REPO_ROOT="$repo_root"
        -e CURSOR_API_KEY
        -e CURSOR_AGENT_MODEL
        -e NOOK_GITHUB_PAT
        -e GITHUB_TOKEN
        -e GH_TOKEN
        -e GITHUB_REPOSITORY
        -e GITHUB_RUN_ID
        -e FIX_BRANCH
        -e AGENT_BRANCH
        -e CI_AGENT_PROMPT_FILE
        -e CI_FIX_LABEL
        -e CI_AGENT_TIMEOUT_MS
        -e CI_AGENT_HEARTBEAT_MS
        -e CI_AGENT_LOG_LEVEL
        -e AGENT_PROMPT
        -e AGENT_PR_TITLE
        -e AGENT_PR_BODY
        -e AGENT_COMMIT_MESSAGE
        -e PR_NUMBER
        -e VITE_BASE
        -e VITE_VAULT_SYNC_INTERVAL_MS
        -e WASM_BUILD_MODE
        -e NOOK_GITHUB_E2E_REPO
        -e NOOK_GITHUB_POLL_MS
        -e NOOK_GITHUB_SYNC_TIMEOUT_MS
        -e NOOK_GITHUB_CONNECT_TIMEOUT_MS
        -e DOCKER={{.DOCKER}}
        -e DOCKER_IMAGE
        -e NOOK_ENV
        -e CI=1
        {{.CI_AGENT_IMAGE}}
        {{.CI_AGENT_CMD}}'

  ci-agent:run:
    desc: Run Cursor SDK agent only (in Docker; host docker.sock).
    deps:
      - setup
    cmds:
      - task: ci-agent:docker:run
        vars:
          CI_AGENT_CMD: agent

  ci-agent:fix:
    desc: Run CI fix agent and open a PR for explicit review and merge authorization.
    deps:
      - setup
    cmds:
      - task: ci-agent:docker:run
        vars:
          CI_AGENT_CMD: fix

  ci-agent:implement:
    desc: Implement issue/prompt and open a PR for explicit review and merge authorization.
    deps:
      - setup
    cmds:
      - task: ci-agent:docker:run
        vars:
          CI_AGENT_CMD: implement

  pr:preflight:
    desc: Print a machine-readable PR audit before implementation or final validation (PR=<number>).
    requires:
      vars: [PR]
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        export GH_TOKEN="${NOOK_GITHUB_PAT:-${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token)}}}";
        export GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}";
        export PR_NUMBER="{{.PR}}";
        task ci-agent:docker:run CI_AGENT_CMD=pr-preflight'

  pr:ready:
    desc: Read-only assertion that the exact PR head is current, deployed, repository-green, and has no pending feedback (PR=<number>); never merges or waits for reviewers.
    requires:
      vars: [PR]
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        export GH_TOKEN="${NOOK_GITHUB_PAT:-${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token)}}}";
        export GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}";
        export PR_NUMBER="{{.PR}}";
        task ci-agent:docker:run CI_AGENT_CMD=pr-ready'

  pr:review:
    desc: Optionally request a Codex review for the exact PR head, idempotently (PR=<number>); never required for readiness.
    requires:
      vars: [PR]
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        export GH_TOKEN="${NOOK_GITHUB_PAT:-${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token)}}}";
        export GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}";
        export PR_NUMBER="{{.PR}}";
        task ci-agent:docker:run CI_AGENT_CMD=pr-review'

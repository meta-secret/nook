version: '3'

vars:
  REPO_ROOT:
    sh: 'if [ -n "${REPO_ROOT:-}" ]; then printf "%s" "$REPO_ROOT"; else git rev-parse --show-toplevel; fi'
  CI_AGENT_DIR: agentic-ai/ci-agent

tasks:
  loom:install:
    desc: Install Loom Bun dependencies with a frozen lockfile.
    dir: agentic-ai/loom
    cmds:
      - bun install --frozen-lockfile

  loom:format:
    desc: Format Loom TypeScript sources with Prettier.
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun run format

  loom:format:check:
    desc: Check Loom Prettier formatting.
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun run format:check

  loom:test:
    desc: Run Loom unit tests.
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun test

  loom:check:
    desc: Typecheck Loom.
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun run check

  loom:lint:
    desc: 'ESLint Loom (max-params, ban unknown, named call args).'
    dir: agentic-ai/loom
    deps: [loom:install]
    cmds:
      - bun run lint

  loom:verify:
    desc: Format-check, lint, typecheck, and unit-test Loom.
    deps: [loom:install]
    cmds:
      - task: loom:format:check
      - task: loom:lint
      - task: loom:check
      - task: loom:test
      - task: loom:module-experts:validate
      - task: loom:structural-experts:validate

  loom:module-experts:validate:
    desc: Validate named read-only module experts and complete production-module routing.
    deps: [loom:install]
    cmds:
      - >-
        bun run --cwd agentic-ai/loom module-experts --
        validate --working-directory "{{.REPO_ROOT}}"

  loom:module-experts:invoke:
    desc: Invoke and journal one registered module expert through the isolated read-only Codex runtime.
    deps: [loom:install]
    requires:
      vars: [REQUEST]
    cmds:
      - >-
        bun agentic-ai/loom/src/module-experts/cli.ts
        invoke --request "{{.REQUEST}}" --working-directory "{{.REPO_ROOT}}"

  loom:structural-experts:validate:
    desc: Validate bounded read-only structural refactoring experts.
    deps: [loom:install]
    cmds:
      - >-
        bun run --cwd agentic-ai/loom structural-experts --
        validate --working-directory "{{.REPO_ROOT}}"

  loom:structural-experts:invoke:
    desc: Invoke and journal one authorized structural expert through the isolated runtime.
    deps: [loom:install]
    requires:
      vars: [REQUEST]
    cmds:
      - >-
        bun agentic-ai/loom/src/structural-experts/cli.ts
        invoke --request "{{.REQUEST}}" --working-directory "{{.REPO_ROOT}}"

  loom:run:
    desc: Run Loom with a domain YAML request (CONFIG=<request.yaml>).
    deps: [loom:install]
    vars:
      CONFIG: '{{.CONFIG}}'
    requires:
      vars: [CONFIG]
    cmds:
      # CONFIG paths are repo-root relative (or absolute). Resolve before --cwd so
      # bun does not look under agentic-ai/loom/<relative-config>.
      - |
        set -euo pipefail
        config="{{.CONFIG}}"
        case "$config" in
          /*) ;;
          *) config="{{.REPO_ROOT}}/$config" ;;
        esac
        bun run --cwd agentic-ai/loom loom -- "$config"

  loom:default:
    desc: Run a defaultable Loom family from in-code examples (FAMILY=prePush|toolsList|cortexAudit|cortexSessionClean|dependencyPopularity).
    deps: [loom:install]
    requires:
      vars: [FAMILY]
    cmds:
      - bun run --cwd agentic-ai/loom loom -- --default "{{.FAMILY}}"

  loom:pre-push:
    desc: Run the default pre-push request; its host formatter includes Loom.
    deps: [loom:install]
    vars:
      CONFIG: '{{default "" .CONFIG}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.CONFIG}}" ]; then
          task loom:run CONFIG="{{.CONFIG}}"
        else
          task loom:default FAMILY=prePush
        fi

  loom:cortex-audit:
    desc: Audit .cortex via Loom (optional CONFIG YAML, otherwise in-code default).
    deps: [loom:install]
    vars:
      CONFIG: '{{default "" .CONFIG}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.CONFIG}}" ]; then
          task loom:run CONFIG="{{.CONFIG}}"
        else
          task loom:default FAMILY=cortexAudit
        fi

  loom:cortex-session-clean:
    desc: Assert that ignored Cortex session memory is absent.
    deps: [loom:install]
    cmds:
      - task loom:default FAMILY=cortexSessionClean

  loom:agent-workflow:cortex-audit:
    desc: Run the event-sourced Cortex full-GC workflow under workflow/processing (BASELINE=<40-char-sha>, PLAN=1 for dry-run).
    deps: [loom:install]
    requires:
      vars: [BASELINE]
    env:
      LOOM_WORKFLOW_BASELINE: '{{.BASELINE}}'
      LOOM_WORKFLOW_PLAN: '{{default "0" .PLAN}}'
    cmds:
      - |
        set -euo pipefail
        if [ "$LOOM_WORKFLOW_PLAN" = "1" ]; then
          bun run --cwd agentic-ai/loom agent-workflow -- \
            cortex-full-garbage-collection \
            --baseline "$LOOM_WORKFLOW_BASELINE" \
            --working-directory "{{.REPO_ROOT}}" \
            --plan
        else
          bun run --cwd agentic-ai/loom agent-workflow -- \
            cortex-full-garbage-collection \
            --baseline "$LOOM_WORKFLOW_BASELINE" \
            --working-directory "{{.REPO_ROOT}}"
        fi

  loom:agent-delegation:record:
    desc: Finalize one ordinary delegated agent attempt (REQUEST=<request.json>).
    deps: [loom:install]
    requires:
      vars: [REQUEST]
    cmds:
      - |
        set -euo pipefail
        request="{{.REQUEST}}"
        case "$request" in
          /*) ;;
          *) request="{{.REPO_ROOT}}/$request" ;;
        esac
        bun run --cwd agentic-ai/loom agent-delegation -- \
          record --request "$request" --working-directory "{{.REPO_ROOT}}"

  loom:skill-scaffold:
    desc: Scaffold a dynamic-skill card via Loom (CONFIG=<request.yaml>).
    deps: [loom:install]
    requires:
      vars: [CONFIG]
    cmds:
      - task: loom:run
        vars:
          CONFIG: '{{.CONFIG}}'

  loom:agent-stats:
    desc: Assemble, validate, or publish AI-agent stats via Loom (CONFIG=<request.yaml>).
    deps: [loom:install]
    requires:
      vars: [CONFIG]
    cmds:
      - task: loom:run
        vars:
          CONFIG: '{{.CONFIG}}'

  loom:pr-land:
    desc: PR land assist via Loom (CONFIG=<request.yaml>).
    deps: [loom:install]
    requires:
      vars: [CONFIG]
    cmds:
      - task: loom:run
        vars:
          CONFIG: '{{.CONFIG}}'

  loom:tools-list:
    desc: List Loom tools and schemas via YAML protocol.
    deps: [loom:install]
    vars:
      CONFIG: '{{default "" .CONFIG}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.CONFIG}}" ]; then
          task loom:run CONFIG="{{.CONFIG}}"
        else
          task loom:default FAMILY=toolsList
        fi

  loom:dependency-popularity:
    desc: Check npm/crates.io dependency popularity against thresholds.
    deps: [loom:install]
    vars:
      CONFIG: '{{default "" .CONFIG}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.CONFIG}}" ]; then
          task loom:run CONFIG="{{.CONFIG}}"
        else
          task loom:default FAMILY=dependencyPopularity
        fi

  hive:format:
    desc: Format the Hive Rust workspace.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml format

  hive:guest:format:
    desc: Format the repository natively inside a sealed Hive Kata guest.
    preconditions:
      - sh: test "${HIVE_SEALED_GUEST:-}" = "1"
        msg: hive:guest:format is available only inside a sealed Hive guest
    cmds:
      - cd nook-app/nook-platform && cargo fmt --all
      - cd nook-app/nook-web/nook-web-app && bun install --frozen-lockfile
      - cd nook-app/nook-web/nook-web-app && bun run format
      - cd nook-app/nook-web/nook-web-extension && bun run format
      - cd agentic-ai/minds && cargo fmt --all

  hive:guest:pr:ready:
    desc: Run the existing PR readiness audit natively inside a sealed Hive guest (PR=<number>).
    preconditions:
      - sh: test "${HIVE_SEALED_GUEST:-}" = "1"
        msg: hive:guest:pr:ready is available only inside a sealed Hive guest
    requires:
      vars: [PR]
    env:
      PR_NUMBER: '{{.PR}}'
    cmds:
      - task loom:cortex-session-clean
      - cd agentic-ai/ci-agent && npm ci
      - cd agentic-ai/ci-agent && npm run build
      - >-
        cd agentic-ai/ci-agent &&
        export GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}" &&
        node dist/main/main.js pr-ready

  hive:check:
    desc: Format-check and lint the Hive worker.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml check

  hive:verify:
    desc: Run Hive Clippy and behavior tests concurrently.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml verify

  hive:build:
    desc: Build the Hive worker.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml build

  hive:test:
    desc: Run Hive behavior tests.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml test

  hive:handoff:test:
    desc: Run the Main-to-Hive Workbench handoff behavior tests.
    cmds:
      - node --test .github/scripts/main-failure-handoff.test.cjs

  hive:cache:publish:
    desc: Publish the already-verified Hive BuildKit graph.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml cache:publish

  hive:image:
    desc: Build the linux/amd64 Hive worker image.
    cmds:
      - task --taskfile agentic-ai/minds/hive/Taskfile.yml image

  ci-agent:install:
    internal: true
    dir: '{{.CI_AGENT_DIR}}'
    cmds:
      - npm ci

  ci-agent:build:
    internal: true
    dir: '{{.CI_AGENT_DIR}}'
    deps:
      - ci-agent:install
    sources:
      - src/**/*
      - tsconfig.json
      - package.json
      - package-lock.json
    generates:
      - dist/main/main.js
    cmds:
      - npm run build

  ci-agent:test:
    desc: Install and unit-test ci-agent on the host.
    dir: '{{.CI_AGENT_DIR}}'
    cmds:
      - npm ci
      - npm test

  ci-agent:smoke:
    desc: Verify exitCiAgent terminates despite open handles.
    dir: '{{.CI_AGENT_DIR}}'
    deps:
      - ci-agent:build
    cmds:
      - node scripts/exit-smoke.mjs

  ci-agent:plan:
    desc: Run the task-planning agent in a detached worktree and copy the plan back.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/ci-agent-plan.sh"

  ci-agent:prepare:
    desc: Install and build ci-agent on the provisioned host (Node 22.13+).
    cmds:
      - >-
        node -e "const [maj,min]=process.versions.node.split('.').map(Number);
        if(maj<22||(maj===22&&min<13)){console.error('ci-agent requires Node.js 22.13+ (have '+process.versions.node+')');process.exit(1)}"
      - task: ci-agent:build

  hive:console:install:
    desc: Install Hive Control Center dependencies.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bun install --frozen-lockfile

  hive:console:check:
    desc: Format-check, type-check, and build the Hive Control Center.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bun run format:check
      - bun run check
      - bun run build

  hive:console:e2e:prepare:
    desc: Install the Chromium browser for Hive Control Center Playwright e2e.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bunx playwright install --with-deps chromium

  hive:console:e2e:
    desc: Run Hive Control Center Playwright journeys.
    dir: '{{.ROOT_DIR}}/agentic-ai/minds/hive-console'
    cmds:
      - bun run test:e2e

  hive:console:verify:
    desc: Install, check, and e2e-test the Hive Control Center.
    cmds:
      - task: hive:console:install
      - task: hive:console:check
      - task: hive:console:e2e:prepare
      - task: hive:console:e2e

  ci-agent:host:run:
    internal: true
    desc: Run a ci-agent command directly in the provisioned checkout.
    deps:
      - ci-agent:prepare
    vars:
      CI_AGENT_CMD: '{{.CI_AGENT_CMD}}'
    cmds:
      - node '{{.CI_AGENT_DIR}}/dist/main/main.js' '{{.CI_AGENT_CMD}}'

  ci-agent:run:
    desc: Run Cursor SDK agent directly in the provisioned checkout.
    deps:
      - setup
    cmds:
      - task: ci-agent:host:run
        vars:
          CI_AGENT_CMD: agent

  ci-agent:fix:
    desc: Run CI fix agent and open a PR for explicit review and merge authorization.
    deps:
      - setup
    cmds:
      - task: ci-agent:host:run
        vars:
          CI_AGENT_CMD: fix

  ci-agent:implement:
    desc: Implement issue/prompt and open a PR for explicit review and merge authorization.
    deps:
      - setup
    cmds:
      - task: ci-agent:host:run
        vars:
          CI_AGENT_CMD: implement

  pr:preflight:
    desc: Print a machine-readable PR audit before implementation or final validation (PR=<number>).
    requires:
      vars: [PR]
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        export GH_TOKEN="${NOOK_GITHUB_PAT:-${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token)}}}";
        export GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}";
        export PR_NUMBER="{{.PR}}";
        task ci-agent:host:run CI_AGENT_CMD=pr-preflight'

  pr:ready:
    desc: Read-only assertion that the exact PR head is current, deployed, repository-green, and has no pending feedback (PR=<number>); never merges or waits for reviewers.
    requires:
      vars: [PR]
    cmds:
      - task loom:cortex-session-clean
      - >-
        bash -c 'set -euo pipefail;
        export GH_TOKEN="${NOOK_GITHUB_PAT:-${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token)}}}";
        export GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}";
        export PR_NUMBER="{{.PR}}";
        task ci-agent:host:run CI_AGENT_CMD=pr-ready'

  pr:review:
    desc: Request exact-head Codex review, or Cursor Bugbot when Codex is unavailable (PR=<number>); never waits and is not required for readiness.
    requires:
      vars: [PR]
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        export GH_TOKEN="${NOOK_GITHUB_PAT:-${GITHUB_TOKEN:-${GH_TOKEN:-$(gh auth token)}}}";
        export GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-$(gh repo view --json nameWithOwner --jq .nameWithOwner)}";
        export PR_NUMBER="{{.PR}}";
        task ci-agent:host:run CI_AGENT_CMD=pr-review'

  pr:review-local:
    desc: Run an advisory local Codex review against origin/main; unavailable Codex access skips without blocking delivery.
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        if ! command -v codex >/dev/null 2>&1; then
          echo "Codex CLI is unavailable; skipping advisory local review.";
          echo "Cloud review will request Cursor Bugbot if Codex reports a usage limit.";
          exit 0;
        fi;
        if ! codex login status >/dev/null 2>&1; then
          echo "Codex CLI is not authenticated; skipping advisory local review.";
          echo "Cloud review will request Cursor Bugbot if Codex reports a usage limit.";
          exit 0;
        fi;
        git fetch origin main;
        if ! codex review --base origin/main; then
          echo "Codex local review was unavailable; continuing without blocking delivery.";
          echo "Cloud review will request Cursor Bugbot if Codex reports a usage limit.";
        fi'

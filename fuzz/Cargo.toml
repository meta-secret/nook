[package]
name = "nook-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nook-auth2 = { path = "../nook-app/nook-auth2" }

[[bin]]
name = "wire-parsers"
path = "fuzz_targets/wire_parsers.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

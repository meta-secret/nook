version: "3"

# One job joins independent validation branches before publishing previews.
# BuildKit owns preparation dependencies and reuses the persistent local cache.
tasks:
  ci:pr:runner:publish:
    desc: Publish the source-free PR runner once per tooling revision (not a PR phase).
    vars:
      PR_RUNNER_IMAGE: '{{default "ghcr.io/meta-secret/nook-pr-runner:trixie-v1" .PR_RUNNER_IMAGE}}'
    env:
      GHA_CACHE_ENABLED: ""
      GHA_CACHE_WRITE_ENABLED: ""
    cmds:
      - '{{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --set "web-e2e-base.output=type=registry" --set "web-e2e-base.tags={{.PR_RUNNER_IMAGE}}" web-e2e-base'

  ci:arc:runner:publish:
    desc: Build, prove, and publish the ARC runner with the pinned container-hook repair.
    vars:
      ARC_RUNNER_IMAGE: '{{default "ghcr.io/meta-secret/nook-arc-runner:2.336.0-hooks-v2" .ARC_RUNNER_IMAGE}}'
    env:
      GHA_CACHE_ENABLED: ""
      GHA_CACHE_WRITE_ENABLED: ""
    cmds:
      - >-
        {{.DOCKER}} buildx bake
        --allow=fs.read={{.REPO_ROOT}}
        -f {{.REPO_ROOT}}/infra/k0s/images/arc-runner/docker-bake.hcl
        --set 'arc-runner.context={{.REPO_ROOT}}'
        --set 'arc-runner-hooks-proof.context={{.REPO_ROOT}}'
        --set 'arc-runner.output=type=registry'
        --set 'arc-runner.tags={{.ARC_RUNNER_IMAGE}}'
        arc-runner arc-runner-hooks-proof

  ci:pr:validate:
    desc: Join every required check and browser branch before preview deployment.
    deps:
      - ci:pr:verification:format
      - ci:pr:verification:tooling
      - docker:ecosystem:dependency-policy
      - ci:pr:checks
      - ci:pr:tests:policy
      - ci:pr:delivery-helpers
      - ci:pr:browser

  ci:pr:checks:
    desc: Run independent checks from their prepared BuildKit stages.
    cmds:
      - task: ci:pr:bake
        vars: { PR_BAKE_TARGET: pr-checks }

  ci:pr:verification:format:
    cmds:
      - '{{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --set "rust-format-check.output=type=cacheonly" rust-format-check'

  ci:pr:verification:tooling:
    cmds:
      - task: preflight:policy:run
        vars: { POLICY_STAGE: pr-verification }

  ci:pr:tests:policy:
    cmds:
      - task --taskfile "{{.REPO_ROOT}}/Taskfile.yml" preflight:repository-policy

  ci:pr:tests:policy-with-delivery-helpers:
    desc: Run policy-only tests and the local delivery contracts concurrently.
    cmds:
      - task --parallel ci:pr:tests:policy ci:pr:delivery-helpers

  ci:pr:delivery-helpers:
    desc: Run local workflow and artifact delivery contracts.
    cmds:
      - cd "{{.REPO_ROOT}}" && node --test .github/scripts/workbench-publish.test.cjs
      - cd "{{.REPO_ROOT}}" && node --test .github/workflows/lib/linear-ui-demo.test.cjs .github/workflows/lib/buildkit-cache-export-telemetry.test.mjs .github/workflows/lib/cache-telemetry-baseline.test.mjs .github/workflows/lib/cache-telemetry.test.mjs .github/workflows/lib/cache-telemetry-split-log.test.mjs .github/workflows/lib/compile-only-dockerfile.test.mjs .github/workflows/lib/pr-cache-health.test.mjs

  ci:pr:bake:
    internal: true
    requires:
      vars: [PR_BAKE_TARGET, PR_ARTIFACT_DIR]
    cmds:
      - |
        set -euo pipefail
        mkdir -p '{{.PR_ARTIFACT_DIR}}/browser'
        floor="$(jq -er '.package_lines_percent.nook_domain_api | numbers' '{{.REPO_ROOT}}/nook-app/nook-platform/nook-core/coverage-floor.json')"
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} \
          -f '{{.REPO_ROOT}}/nook-app/ci/pr.docker-bake.hcl' \
          --allow='fs.write={{.PR_ARTIFACT_DIR}}' \
          --set 'coverage-export.output=type=cacheonly' \
          --set 'pr-browser-artifacts.output=type=tar,dest={{.PR_ARTIFACT_DIR}}/browser.tar' \
          --set "rust-dylint.args.RUST_DYLINT_COVERAGE_FLOOR=$floor" \
          --set 'rust-ecosystem-deterministic.args.NATIVE_COVERAGE_PROVIDED=true' \
          --set 'builder-wasm.output=type=cacheonly' \
          '{{.PR_BAKE_TARGET}}'

  ci:pr:browser:
    desc: Run selected browser suites in an isolated artifact-backed workspace.
    cmds:
      - task: ci:pr:browser:prepare
      - |
        set -euo pipefail
        cd '{{.PR_ARTIFACT_DIR}}/runtime'
        export REPO_ROOT="$PWD"
        export GITHUB_WORKSPACE="$PWD"
        if [ "${PR_FULL_E2E:-false}" = true ]; then
          task --silent ci:pr:browser:full
        elif [ "${PR_AUTH_E2E:-false}" = true ]; then
          task --silent ci:pr:browser:auth
        fi
        if [ "${PR_RESEARCH:-false}" = true ]; then
          task --silent web:research:verify
        fi

  ci:pr:browser:prepare:
    desc: Export artifacts into a separate checkout while other BuildKit solves read the source.
    requires:
      vars: [PR_ARTIFACT_DIR]
    cmds:
      - task: ci:pr:bake
        vars: { PR_BAKE_TARGET: pr-browser-artifacts }
      - |
        set -euo pipefail
        tar -xf '{{.PR_ARTIFACT_DIR}}/browser.tar' -C '{{.PR_ARTIFACT_DIR}}/browser'
        git clone --quiet --shared --no-checkout '{{.REPO_ROOT}}' '{{.PR_ARTIFACT_DIR}}/runtime'
        git -C '{{.PR_ARTIFACT_DIR}}/runtime' checkout --quiet --detach "$(git -C '{{.REPO_ROOT}}' rev-parse HEAD)"
        cp -a '{{.PR_ARTIFACT_DIR}}/browser/nook-app/.' '{{.PR_ARTIFACT_DIR}}/runtime/nook-app/'
      - test -e '{{.PR_ARTIFACT_DIR}}/runtime/nook-app/nook-web/node_modules' || ln -s nook-web-app/node_modules '{{.PR_ARTIFACT_DIR}}/runtime/nook-app/nook-web/node_modules'
      - |
        revision="$(jq -er '.browsers[] | select(.name == "ffmpeg") | .revision' '{{.PR_ARTIFACT_DIR}}/runtime/nook-app/nook-web/nook-web-app/node_modules/playwright-core/browsers.json')"
        install -d "${PLAYWRIGHT_BROWSERS_PATH}/ffmpeg-${revision}"
        ln -sf /usr/bin/ffmpeg "${PLAYWRIGHT_BROWSERS_PATH}/ffmpeg-${revision}/ffmpeg-linux"

  ci:pr:browser:full:
    desc: Run web and extension suites sequentially on this runner.
    cmds:
      - task: _ci:main:web:e2e-only
      - task: _extension:test:e2e

  ci:pr:browser:auth:
    desc: Run the required focused real-extension authentication regression.
    env:
      E2E_SPEC: e2e/mock-auth-pilot-coverage.spec.ts
    cmds:
      - E2E_SPEC=e2e/mock-auth-pilot-coverage.spec.ts task --silent _extension:test:e2e:file

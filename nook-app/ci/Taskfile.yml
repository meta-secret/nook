version: "3"

tasks:
  ci:pr:
    desc: PR CI on job-scoped or daemon BuildKit — Rust/WASM validation, then one slim web container for format/verify/build.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:pr:host }

  ci:pr:rust:
    desc: Native Rust format, clippy, tests, and coverage for the split hosted PR pipeline.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:pr:rust:host }

  _ci:pr:rust:host:
    # Repository invariants must reject forbidden Dockerfile/cache changes before app setup begins.
    cmds:
      - task: preflight
      - task: docker:ci:rust:export
      - task: preflight:export
        vars:
          PREFLIGHT_OUTPUT_DIR: '{{.CI_ARTIFACT_DIR}}/tools'

  ci:pr:wasm:
    desc: WASM clippy and build for the split hosted PR pipeline.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:pr:wasm:host }

  _ci:pr:wasm:host:
    cmds:
      - task: docker:ci:wasm:export

  ci:wasm:node-test:
    desc: Finish the split hosted WASM gate while the exact package feeds web verification.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:wasm:node-test:host }

  _ci:wasm:node-test:host:
    cmds:
      - task: docker:ci:wasm:node-test

  ci:pr:web:
    desc: Build and verify web/extension code from downloaded split-CI artifacts.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:pr:web:host }

  _ci:pr:web:host:
    cmds:
      - task: docker:ci:web:build

  ci:pr:ui-demo:
    desc: Build the PR Chromium image and record selected UI demo videos.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:pr:ui-demo:host }

  _ci:pr:ui-demo:host:
    cmds:
      - task: docker:ci:web:e2e:build
      - task: ui:demo:ci

  _ci:pr:host:
    cmds:
      - task: preflight
      - task: setup
      - task: docker:task
        vars: { TASK: _ci:pr }

  _buildx:healthy:
    internal: true
    requires:
      vars: [BUILD_TASK]
    env:
      CI: '{{.CI}}'
      CI_ARTIFACT_DIR: '{{.CI_ARTIFACT_DIR}}'
      DOCKER_IMAGE: '{{.DOCKER_IMAGE}}'
      DOCKER_E2E_IMAGE: '{{.DOCKER_E2E_IMAGE}}'
      DOCKER_NOFILE_LIMIT: '{{.DOCKER_NOFILE_LIMIT}}'
      GIT_COMMIT_ID: '{{.GIT_COMMIT_ID}}'
      NOOK_ENV: '{{.NOOK_ENV}}'
      NOOK_EXTENSION_CHANNEL: '{{.NOOK_EXTENSION_CHANNEL}}'
      NOOK_EXTENSION_COMMIT: '{{.NOOK_EXTENSION_COMMIT}}'
      NOOK_EXTENSION_SITE_URL: '{{.NOOK_EXTENSION_SITE_URL}}'
      NOOK_EXTENSION_VERSION: '{{.NOOK_EXTENSION_VERSION}}'
      NOOK_SIMPLE_VAULT_URL: '{{.NOOK_SIMPLE_VAULT_URL}}'
      UI_DEMO_OUTPUT_DIR: '{{.UI_DEMO_OUTPUT_DIR}}'
      UI_DEMO_SPECS: '{{.UI_DEMO_SPECS}}'
      PREPARE_GROUP: '{{.PREPARE_GROUP}}'
      SETUP_TARGET: '{{.SETUP_TARGET}}'
      VITE_BASE: '{{.VITE_BASE}}'
      VITE_PUBLIC_APP_URL: '{{.VITE_PUBLIC_APP_URL}}'
      VITE_SENTINEL_APP_URL: '{{.VITE_SENTINEL_APP_URL}}'
      VITE_SIMPLE_APP_URL: '{{.VITE_SIMPLE_APP_URL}}'
      VITE_SITE_URL: '{{.VITE_SITE_URL}}'
      VITE_VAULT_SYNC_INTERVAL_MS: '{{.VITE_VAULT_SYNC_INTERVAL_MS}}'
      WASM_BUILD_MODE: '{{.WASM_BUILD_MODE}}'
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/with-healthy-buildkit.sh" task --dir "{{.REPO_ROOT}}" {{.BUILD_TASK}}

  ci:pr:e2e:
    desc: Full stub web Playwright e2e plus extension e2e on job-scoped or daemon BuildKit.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:pr:e2e:host }

  _ci:pr:e2e:host:
    cmds:
      - task: preflight
      - task: setup
        vars: { SETUP_TARGET: nook-web-e2e }
      - task: docker:e2e:run
        vars: { TASK: _ci:main }

  ci:pr:e2e:web:artifacts:
    desc: Hosted web e2e from the verified split-CI WASM artifact.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:pr:e2e:web:artifacts:host }

  _ci:pr:e2e:web:artifacts:host:
    cmds:
      - task: docker:ci:web:e2e:build
      - task: docker:e2e:run
        vars: { TASK: _ci:main:web:e2e-only }

  ci:pr:e2e:extension:artifacts:
    desc: Hosted extension e2e from the verified split-CI WASM artifact.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:pr:e2e:extension:artifacts:host }

  _ci:pr:e2e:extension:artifacts:host:
    cmds:
      - task: docker:ci:web:e2e:build
      - task: docker:e2e:run
        vars: { TASK: _extension:test:e2e }

  ci:pr:e2e:local:
    desc: Alias for ci:pr:e2e.
    cmds:
      - task: ci:pr:e2e

  ci:main:
    desc: Main/release CI on job-scoped or daemon BuildKit — Rust/WASM validation, then verify/build/e2e.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:main:host }

  ci:main:prepare-images:
    desc: Main preflight plus sealed nook-web / nook-web-e2e image bake (no browser suites).
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:main:prepare-images:host }

  ci:main:publish-native-cache:
    desc: Promote verified native ARC state locally or publish fallback cache scopes.
    cmds:
      - |
        if test "${NOOK_ARC_RUNNER:-}" = "1" &&
           test "${GITHUB_REF:-}" = "refs/heads/main" &&
           test -d "${NOOK_ARC_CACHE_PROMOTION_DIR:-}"; then
          task ci:arc:promote-buildkit-cache
        else
          task _buildx:healthy BUILD_TASK=_ci:main:publish-native-cache:host
        fi

  ci:main:publish-wasm-cache:
    desc: Promote verified WASM ARC state locally or publish fallback cache scopes.
    cmds:
      - |
        if test "${NOOK_ARC_RUNNER:-}" = "1" &&
           test "${GITHUB_REF:-}" = "refs/heads/main" &&
           test -d "${NOOK_ARC_CACHE_PROMOTION_DIR:-}"; then
          task ci:arc:promote-buildkit-cache
        else
          task _buildx:healthy BUILD_TASK=_ci:main:publish-wasm-cache:host
        fi

  ci:main:publish-web-cache:
    desc: Promote verified web ARC state locally or publish fallback cache scopes.
    cmds:
      - |
        if test "${NOOK_ARC_RUNNER:-}" = "1" &&
           test "${GITHUB_REF:-}" = "refs/heads/main" &&
           test -d "${NOOK_ARC_CACHE_PROMOTION_DIR:-}"; then
          task ci:arc:promote-buildkit-cache
        else
          task _buildx:healthy BUILD_TASK=_ci:main:publish-web-cache:host
        fi

  ci:main:publish-web-e2e-cache:
    desc: Promote verified browser ARC state locally or publish fallback cache scopes.
    cmds:
      - |
        if test "${NOOK_ARC_RUNNER:-}" = "1" &&
           test "${GITHUB_REF:-}" = "refs/heads/main" &&
           test -d "${NOOK_ARC_CACHE_PROMOTION_DIR:-}"; then
          task ci:arc:promote-buildkit-cache
        else
          task _buildx:healthy BUILD_TASK=_ci:main:publish-web-e2e-cache:host
        fi

  ci:arc:promote-buildkit-cache:
    desc: Ask the trusted ARC sidecar to promote this successful job's private BuildKit state.
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        test "${GITHUB_ACTIONS:-}" = "true"
        test "${GITHUB_EVENT_NAME:-}" = "push"
        test "${GITHUB_REF:-}" = "refs/heads/main"
        signal_dir="${NOOK_ARC_CACHE_PROMOTION_DIR:?missing ARC cache promotion directory}"
        test -d "$signal_dir"
        test ! -L "$signal_dir"
        umask 077
        printf '%s:%s:%s\n' \
          "${GITHUB_RUN_ID:?missing GitHub run ID}" \
          "${GITHUB_RUN_ATTEMPT:?missing GitHub run attempt}" \
          "${GITHUB_SHA:?missing GitHub head SHA}" > "$signal_dir/request.next"
        mv "$signal_dir/request.next" "$signal_dir/request"
        for _ in $(seq 1 100); do
          test -f "$signal_dir/accepted" && exit 0
          sleep 0.1
        done
        echo "ARC cache promotion sidecar did not accept the request" >&2
        exit 1
        BASH

  ci:main:web-e2e:
    desc: Main web gate without extension e2e — prepare images then run web e2e alone (manual/debug).
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:main:web-e2e:host }

  ci:main:web-e2e:ci:
    desc: Main web e2e from the already-built CI e2e image (no re-verify).
    cmds:
      - task: docker:e2e:run
        vars: { TASK: _ci:main:web:e2e-only }

  ci:main:web:artifacts:
    desc: Main browser-free web verify/build from the split WASM artifact.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:main:web:artifacts:host }

  _ci:main:web:artifacts:host:
    cmds:
      - task: docker:ci:web:build

  ci:main:e2e:web:artifacts:
    desc: Main local-provider web e2e from the split WASM artifact.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:main:e2e:web:artifacts:host }

  _ci:main:e2e:web:artifacts:host:
    cmds:
      - task: docker:ci:web:e2e:build
      - task: docker:e2e:run
        vars: { TASK: _ci:main:web:e2e-only }

  ci:main:e2e:extension:artifacts:
    desc: Main extension e2e from the split WASM artifact.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:main:e2e:extension:artifacts:host }

  _ci:main:e2e:extension:artifacts:host:
    cmds:
      - task: docker:ci:web:e2e:build
      - task: docker:e2e:run
        vars: { TASK: _extension:test:e2e }

  ci:main:ui-demo:artifacts:
    desc: Main headless UI demos from the split WASM artifact.
    cmds:
      - task: _buildx:healthy
        vars: { BUILD_TASK: _ci:main:ui-demo:artifacts:host }

  _ci:main:ui-demo:artifacts:host:
    cmds:
      - task: docker:ci:web:e2e:build
      - task: ui:demo:ci

  _ci:main:host:
    cmds:
      - task: preflight
      - task: setup
        vars: { SETUP_TARGET: nook-web-e2e }
      - task: docker:e2e:run
        vars: { TASK: _ci:main }

  _ci:main:prepare-images:host:
    cmds:
      - task: preflight
      - task: setup
        vars: { SETUP_TARGET: nook-web-e2e }

  _ci:main:publish-native-cache:host:
    cmds:
      - task: docker:ci:cache:publish:native

  _ci:main:publish-wasm-cache:host:
    cmds:
      - task: docker:ci:cache:publish:wasm

  _ci:main:publish-web-cache:host:
    cmds:
      - task: docker:ci:cache:publish:web

  _ci:main:publish-web-e2e-cache:host:
    cmds:
      - task: docker:ci:cache:publish:web-e2e

  _ci:main:web-e2e:host:
    cmds:
      - task: preflight
      - task: setup
        vars: { SETUP_TARGET: nook-web-e2e }
      - task: docker:e2e:run
        vars: { TASK: _ci:main:core }

  ci:main:prepare:
    desc: Format check and wasm build in one container (manual/debug only — prefer ci:main:build).
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _ci:pr:prepare }

  ci:main:parallel:
    desc: Verify ‖ web build in one container (manual/debug — wasm must exist on bind mount).
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _ci:pr:parallel }

  ci:main:finish:
    desc: Alias for ci:main (legacy parallel finish name).
    cmds:
      - task: ci:main

  ci:main:e2e:
    desc: Full stub web Playwright e2e plus extension e2e when wasm/dist already built.
    cmds:
      - task: web:test:e2e:parallel
      - task: extension:test:e2e

  ci:main:e2e:parallel:
    desc: Alias for ci:main:e2e.
    cmds:
      - task: ci:main:e2e

  ci:main:build:
    desc: Format, wasm, verify, and web build in one container (no e2e).
    cmds:
      - task: preflight
      - task: setup
      - task: docker:task
        vars: { TASK: _ci:main:build }

  ci:pr:deploy-preview:
    desc: Deploy the prepared PR image's dist to Cloudflare Pages (CI only; ci:pr must run first).
    cmds:
      - task: docker:task
        vars: { TASK: _deploy-preview }

  ci:cloudflare:deploy:
    desc: Deploy the prepared main image's dist to Cloudflare Pages (CI only; ci:main must run first).
    cmds:
      - task: docker:task
        vars: { TASK: _deploy-cloudflare }

  ci:pr:comment-preview:
    desc: Comment or update Cloudflare preview URL on the PR (runs in container; needs GITHUB_TOKEN + PR number).
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _comment-preview }

  ci:pr:prepare:
    desc: Format check and wasm build in one container (manual/debug only — prefer ci:pr).
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _ci:pr:prepare }

  ci:pr:parallel:
    desc: Verify ‖ web build in one container (manual/debug — wasm must exist on bind mount).
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _ci:pr:parallel }

  ci:verify:parallel:
    desc: Lint and test in Docker without rebuilding wasm.
    cmds:
      - task: docker:task
        vars: { TASK: _verify:parallel }

  ci:verify:
    desc: Format, lint, and test in Docker (no web production build).
    cmds:
      - task: preflight
      - task: setup
      - task: docker:task
        vars: { TASK: _verify }

  _ci:pr:
    desc: PR gate — format and verify the production dist already built into the sealed image.
    cmds:
      - task: _format:check
      - task: _ci:pr:parallel

  _ci:pr:parallel:
    desc: Lint/test the production web build already validated while sealing the image.
    deps:
      - _verify:parallel

  _ci:main:build:
    desc: Main verify/build track without e2e.
    cmds:
      - task: _format:check
      - task: _ci:pr:parallel

  _ci:main:core:
    desc: Main web gate — verify the sealed production build, create one e2e build, test, and restore prod dist.
    cmds:
      - task: _ci:main:build
      - cp -a "{{.WEB_ROOT}}/dist" "{{.WEB_ROOT}}/dist-prod"
      - task: _web:test:e2e:parallel
      - task: _web:test:e2e:isolation
      - task: _web:e2e:restore-prod-dist

  _ci:main:
    desc: Main gate — web e2e plus extension e2e in one container.
    cmds:
      - task: _ci:main:core
      - task: _extension:test:e2e

  _ci:main:web:e2e-only:
    desc: Main/PR web browser suites without format/verify (sealed image already proven).
    cmds:
      - task: _web:test:e2e:parallel
      - task: _web:test:e2e:isolation

  _ci:pr:prepare:
    desc: Format check only (split-container debug — prefer _ci:pr).
    cmds:
      - task: _format:check

  _deploy-preview:
    desc: Deploy nook-app/nook-web/dist to Cloudflare Pages; writes URL to .cloudflare-preview-url.
    cmds:
      - task: _deploy-cloudflare

  _deploy-cloudflare:
    desc: Deploy nook-app/nook-web/dist to Cloudflare Pages; writes URL to .cloudflare-deploy-url and .cloudflare-preview-url.
    cmds:
      # Cloudflare does NOT support running Wrangler under the Bun runtime: `bunx wrangler` crashes
      # (e.g. TypeError from node:timers/promises) and propagates an opaque non-zero exit (201 in CI).
      # Invoke the dependency-locked Wrangler binary with Node, the runtime Cloudflare supports.
      #
      # NOTE: this is a `>-` FOLDED scalar — every newline becomes a space, so the whole block runs
      # as ONE line. Do NOT put `#` comments inside the shell body below: a folded `#` comments out
      # the rest of the line (i.e. every following command) and breaks the deploy.
      - >-
        bash -c 'set -euo pipefail;
        test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && test -n "${CF_PAGES_BRANCH:-}";
        project="${CF_PAGES_PROJECT_NAME:-nook}";
        production_branch="${CF_PAGES_PRODUCTION_BRANCH:-main}";
        deploy_dir="${CF_PAGES_DIST_DIR:-{{.WEB_ROOT}}/dist}";
        case "$deploy_dir" in
          /*) ;;
          *) deploy_dir="{{.REPO_ROOT}}/$deploy_dir" ;;
        esac;
        if [ ! -d "$deploy_dir" ]; then
          echo "error: Cloudflare Pages deploy directory not found: $deploy_dir" >&2;
          exit 1;
        fi;
        wrangler() { node "{{.WEB_ROOT}}/node_modules/.bin/wrangler" "$@"; };
        wrangler pages project create "$project" --production-branch="$production_branch" >/dev/null 2>&1 || true;
        set +e;
        deploy_output="$(
          wrangler pages deploy "$deploy_dir" \
            --project-name="$project" \
            --branch="${CF_PAGES_BRANCH}" \
            --commit-dirty=true 2>&1
        )";
        deploy_status=$?;
        set -e;
        echo "$deploy_output";
        if [ "$deploy_status" -ne 0 ]; then
          log_dir="${HOME:-/root}/.config/.wrangler/logs";
          if [ -d "$log_dir" ]; then
            latest_log="$(ls -t "$log_dir"/wrangler-*.log 2>/dev/null | head -1 || true)";
            if [ -n "$latest_log" ]; then
              echo "wrangler log ($latest_log):" >&2;
              cat "$latest_log" >&2;
            fi;
          fi;
          exit "$deploy_status";
        fi;
        clean_output="$(printf "%s" "$deploy_output" | sed -E "s/\x1b\[[0-9;]*[a-zA-Z]//g")";
        deployment_url="$(
          printf "%s" "$clean_output" \
            | grep -oE "https://[a-zA-Z0-9.-]+\.pages\.dev[a-zA-Z0-9./_-]*" \
            | tail -1
        )";
        if [ -z "$deployment_url" ]; then
          echo "Could not parse Cloudflare deployment URL from wrangler output" >&2;
          exit 1;
        fi;
        echo "$deployment_url" > "{{.REPO_ROOT}}/.cloudflare-deploy-url";
        echo "$deployment_url" > "{{.REPO_ROOT}}/.cloudflare-preview-url";
        echo "NOOK_PREVIEW_URL=$deployment_url"'

  _comment-preview:
    desc: Comment or update Cloudflare preview URL on the PR.
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        export PREVIEW_URL="${PREVIEW_URL:-$(cat "{{.REPO_ROOT}}/.cloudflare-preview-url")}";
        bun run "{{.REPO_ROOT}}/.github/scripts/comment-preview-url.ts"'

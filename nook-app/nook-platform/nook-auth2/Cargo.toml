[package]
name = "nook-auth2"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
mock-passkey = []

[dependencies]
nook-app-common = { path = "../nook-app-common" }
nook-authenticator-domain = { path = "../nook-authenticator-domain" }
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"] }
age = { version = "0.12.1", features = ["armor"] }
base64 = "0.23.1"
bech32 = "0.12.0"
getrandom = "0.4.3"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hex = "0.4.3"
hkdf = "0.13.0"
pbkdf2 = { version = "0.13.0", features = ["sha2"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.18"
tracing = { version = "0.1.41", default-features = false, features = ["std", "attributes"] }
wasm-bindgen = "0.2.127"
zeroize = "1.9.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
anyhow = "1.0.104"

[lints]
workspace = true

version: "3"

tasks:
  registry-cache:ensure:
    desc: Log into the remote Zot cache registry for local Bake restore/publish.
    cmds:
      - |
        set -euo pipefail
        if [ -n "${GITHUB_ACTIONS:-}" ]; then exit 0; fi
        if [ "${NOOK_REGISTRY_CACHE:-1}" = "0" ]; then exit 0; fi
        cache="${HOME}/.nook/cache"
        user_file="$cache/registry-remote-username"
        pass_file="$cache/registry-remote-password"
        if [ ! -r "$user_file" ] || [ ! -r "$pass_file" ]; then
          if [ "${NOOK_REGISTRY_CACHE:-}" = "1" ]; then
            echo "registry-cache:ensure: missing $user_file / $pass_file" >&2
            exit 1
          fi
          echo "registry-cache:ensure: no remote registry credentials; Bake stays offline" >&2
          exit 0
        fi
        host="${NOOK_REGISTRY_CACHE_HOST:-registry.dev.nokey.sh}"
        user="$(tr -d '[:space:]' <"$user_file")"
        tr -d '\n' <"$pass_file" | {{.DOCKER}} login "$host" -u "$user" --password-stdin >/dev/null
        echo "registry-cache:ensure: local Bake uses remote-buildcache${GHA_CACHE_SCOPE_SUFFIX:-}" >&2

  registry-cache:publish:wasm:
    internal: true
    desc: Publish local WASM BuildKit layers to the git-commit remote-buildcache scope.
    cmds:
      - |
        set -euo pipefail
        if [ -n "${GITHUB_ACTIONS:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" != "1" ]; then exit 0; fi
        bash "{{.REPO_ROOT}}/.github/scripts/git-cache-scope-publish-guard.sh"
        task docker:ci:cache:publish:wasm

  registry-cache:publish:native:
    internal: true
    desc: Publish local native BuildKit layers to the git-commit remote-buildcache scope.
    cmds:
      - |
        set -euo pipefail
        if [ -n "${GITHUB_ACTIONS:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" != "1" ]; then exit 0; fi
        bash "{{.REPO_ROOT}}/.github/scripts/git-cache-scope-publish-guard.sh"
        task docker:ci:cache:publish:native

  registry-cache:publish:web:
    internal: true
    desc: Publish local web BuildKit layers to the git-commit remote-buildcache scope.
    cmds:
      - |
        set -euo pipefail
        if [ -n "${GITHUB_ACTIONS:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" != "1" ]; then exit 0; fi
        bash "{{.REPO_ROOT}}/.github/scripts/git-cache-scope-publish-guard.sh"
        task docker:ci:cache:publish:web

  docker:rust:task:
    internal: true
    desc: Run a Task target in the on-demand source-sealed Rust/WASM image.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        --ipc=host
        -e WASM_BUILD_MODE="{{.WASM_BUILD_MODE}}"
        -e CI=1
        -w /meta-secret/nook
        {{.DOCKER_RUST_IMAGE}}
        task {{.TASK}}

  docker:rust:browser:task:
    internal: true
    desc: Run a Task target in the on-demand Rust/WASM image with Chromium.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        --ipc=host
        -e WASM_BUILD_MODE="{{.WASM_BUILD_MODE}}"
        -e CI=1
        -w /meta-secret/nook
        {{.DOCKER_RUST_BROWSER_IMAGE}}
        task {{.TASK}}

  docker:wasm:test:browser:dev:
    desc: Run debug-profile WASM browser tests inside BuildKit.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        wasm-browser-dev

  docker:wasm:build:fast:
    internal: true
    # Mounted fast path uses a manifest-keyed image whose Cargo target lives outside the bind mount.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        -e REPO_ROOT=/meta-secret/nook
        -e GIT_COMMIT_ID="{{.GIT_COMMIT_ID}}"
        -e WASM_BUILD_MODE=dev
        -e CARGO_TARGET_DIR=/opt/nook/cargo-target
        -v "{{.REPO_ROOT}}:/meta-secret/nook"
        -w /meta-secret/nook
        {{.DOCKER_RUST_FAST_IMAGE}}
        task _wasm:build:fast

  docker:extract:coverage:
    desc: Copy portable Rust crate coverage artifacts from the sealed Docker image to the host.
    vars:
      COVERAGE_OUT_DIR: '{{default (printf "%s/coverage/nook-core" .REPO_ROOT) .COVERAGE_OUT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.COVERAGE_OUT_DIR}}";
        case "$out_dir" in
          /*) ;;
          *) out_dir="{{.REPO_ROOT}}/$out_dir" ;;
        esac;
        rm -rf "$out_dir";
        mkdir -p "$out_dir";
        cid="$({{.DOCKER}} create --platform linux/amd64 {{.DOCKER_IMAGE}})";
        cleanup() { {{.DOCKER}} rm -f "$cid" >/dev/null 2>&1 || true; };
        trap cleanup EXIT;
        {{.DOCKER}} cp "$cid:/opt/nook/coverage/nook-core/." "$out_dir/"'

  docker:coverage:export:
    desc: Run coverage-gated portable Rust unit tests and export their artifacts (no app image export).
    deps:
      - sccache:ensure
      - registry-cache:ensure
    vars:
      COVERAGE_OUT_DIR: '{{default (printf "%s/coverage/nook-core" .REPO_ROOT) .COVERAGE_OUT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.COVERAGE_OUT_DIR}}";
        case "$out_dir" in
          /*) ;;
          *) out_dir="{{.REPO_ROOT}}/$out_dir" ;;
        esac;
        rm -rf "$out_dir";
        mkdir -p "$out_dir";
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --allow="fs.write=$out_dir" --set "coverage-export.output=type=local,dest=$out_dir" coverage-export'

  docker:ci:rust:export:
    desc: Run native Rust formatting/coverage on one CI runner and export only coverage artifacts.
    deps: [sccache:ensure, registry-cache:ensure]
    vars:
      CI_ARTIFACT_DIR: '{{default (printf "%s/ci-artifacts/rust" .REPO_ROOT) .CI_ARTIFACT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.CI_ARTIFACT_DIR}}";
        case "$out_dir" in /*) ;; *) out_dir="{{.REPO_ROOT}}/$out_dir" ;; esac;
        rm -rf "$out_dir"; mkdir -p "$out_dir";
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --allow="fs.write=$out_dir" --set "coverage-export.output=type=local,dest=$out_dir" --set "rust-format-check.output=type=cacheonly" ci-rust'
      - task: registry-cache:publish:native

  docker:ci:rust:verify:
    desc: Run native Rust formatting and coverage floors without exporting report artifacts.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - >-
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}}
        --set "coverage-export.output=type=cacheonly"
        --set "rust-format-check.output=type=cacheonly"
        ci-rust
      - task: registry-cache:publish:native

  docker:ci:rust:native-test-evidence:
    desc: Export actual native JUnit, LLVM artifact sizes and combined coverage.
    deps: [sccache:ensure, registry-cache:ensure]
    requires:
      vars: [NATIVE_TEST_EVIDENCE_DIR]
    env:
      GHA_CACHE_WRITE_ENABLED: ""
    cmds:
      - >-
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}}
        -f '{{.REPO_ROOT}}/nook-app/ci/pr.docker-bake.hcl'
        --allow='fs.write={{.NATIVE_TEST_EVIDENCE_DIR}}'
        --set 'native-test-evidence.output=type=local,dest={{.NATIVE_TEST_EVIDENCE_DIR}}'
        native-test-evidence pr-rust-verify

  docker:ci:rust:native-test-reuse:solve:
    requires:
      vars: [NATIVE_TEST_CONTEXT, NATIVE_TEST_CASE_DIR, NATIVE_TEST_TARGET, NATIVE_TEST_VERIFY_TARGET]
    cmds:
      - |
        set -euo pipefail
        mkdir -p '{{.NATIVE_TEST_CASE_DIR}}/result'
        status=0
        GHA_CACHE_WRITE_ENABLED='{{default "" .NATIVE_TEST_CACHE_WRITE}}' \
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} \
          -f '{{.REPO_ROOT}}/nook-app/ci/pr.docker-bake.hcl' \
          -f '{{.REPO_ROOT}}/nook-app/nook-platform/docker/rust/native-test-proof.docker-bake.hcl' \
          --progress=plain \
          --metadata-file '{{.NATIVE_TEST_CASE_DIR}}/build-metadata.json' \
          --allow='fs.read={{.NATIVE_TEST_CONTEXT}}' \
          --allow='fs.write={{.NATIVE_TEST_CASE_DIR}}/result' \
          --set '*.context={{.NATIVE_TEST_CONTEXT}}' \
          --set '{{.NATIVE_TEST_TARGET}}.output=type=local,dest={{.NATIVE_TEST_CASE_DIR}}/result' \
          '{{.NATIVE_TEST_TARGET}}' '{{.NATIVE_TEST_VERIFY_TARGET}}' \
          2>&1 | tee '{{.NATIVE_TEST_CASE_DIR}}/build.log' || status=$?
        printf '%s\n' "$status" > '{{.NATIVE_TEST_CASE_DIR}}/exit-status'
        exit "$status"

  docker:ci:rust:native-test-reuse:prove:
    desc: Prove native test reuse and terminal failures with real BuildKit solves.
    deps: [sccache:ensure, registry-cache:ensure]
    requires:
      vars: [NATIVE_TEST_PROOF_DIR]
    cmds:
      - |
        set -euo pipefail
        proof_dir='{{.NATIVE_TEST_PROOF_DIR}}'
        evidence="$proof_dir/evidence"
        rm -rf -- "$evidence"
        mkdir -p "$evidence"
        context="$(mktemp -d "$proof_dir/context.XXXXXX")"
        trap 'rm -rf -- "$context"' EXIT
        # This ordinary checkout context is only mutated for actual solves.
        # BuildKit receives every real file and remains the only cache authority.
        git -C '{{.REPO_ROOT}}' archive HEAD | tar -x -C "$context"
        source_sha="$(git -C '{{.REPO_ROOT}}' rev-parse HEAD)"
        printf '%s\n' "$source_sha" > "$evidence/source-sha"
        case "${GHA_CACHE_SCOPE_SUFFIX:-}" in
          "-git-$source_sha") ;;
          *) echo 'Native proof requires the normal exact branch cache scope' >&2; exit 2 ;;
        esac
        registry_ref="${NOOK_REGISTRY_CACHE_HOST:-registry.dev.nokey.sh}/nook/remote-buildcache/nook-rust-native-source-v4${GHA_CACHE_SCOPE_SUFFIX}:buildcache"
        printf '%s\n' "$registry_ref" > "$evidence/cache-ref"
        platform="$context/nook-app/nook-platform"
        replication="$platform/nook-replication/src/lib.rs"
        floor="$platform/nook-core/coverage-floor.json"
        cp "$replication" "$proof_dir/replication-original.rs"
        cp "$floor" "$proof_dir/coverage-floor-original.json"
        export NATIVE_TEST_CONTEXT="$context"
        export NATIVE_TEST_TARGET=native-test-evidence
        export NATIVE_TEST_VERIFY_TARGET=pr-rust-verify
        task docker:ci:rust:native-test-reuse:solve \
          NATIVE_TEST_CASE_DIR="$evidence/cold" \
          NATIVE_TEST_TARGET=native-test-cold NATIVE_TEST_VERIFY_TARGET=pr-native-test-cold
        task docker:ci:rust:native-test-reuse:solve NATIVE_TEST_CASE_DIR="$evidence/warm"
        doc="$platform/nook-app-common/.cortex/native-test-reuse-proof.md"
        mkdir -p "$(dirname "$doc")"
        printf 'Actual excluded documentation input proof.\n' > "$doc"
        task docker:ci:rust:native-test-reuse:solve NATIVE_TEST_CASE_DIR="$evidence/documentation"
        rm "$doc"
        # Each invocation edits a distinct real source variant on persistent workers.
        source_change_invocation="${context##*/}"
        printf '\n// Actual native test reuse source-change proof: %s %s.\n' \
          "$source_sha" "$source_change_invocation" >> "$replication"
        git diff --no-index "$proof_dir/replication-original.rs" "$replication" \
          > "$evidence/replication-change.patch" || test "$?" -eq 1
        task docker:ci:rust:native-test-reuse:solve NATIVE_TEST_CASE_DIR="$evidence/replication"
        cp "$proof_dir/replication-original.rs" "$replication"
        # A real uncovered core line makes its package's 100% floor impossible.
        jq -e '.data[].files[] | select(.filename | contains("/nook-core/")) | select(.summary.lines.count > 0 and .summary.lines.percent < 100)' \
          "$evidence/warm/result/coverage/nook-core/summary.json" > "$evidence/uncovered-core-files.json"
        jq '.package_lines_percent["nook-core"] = 100' "$floor" > "$floor.tmp"
        mv "$floor.tmp" "$floor"
        cp "$floor" "$evidence/floor-100.json"
        if task docker:ci:rust:native-test-reuse:solve NATIVE_TEST_CASE_DIR="$evidence/floor-failure"; then
          echo 'Actual 100% coverage floor unexpectedly passed' >&2; exit 1
        fi
        cp "$proof_dir/coverage-floor-original.json" "$floor"
        failure_directory="$platform/nook-replication/tests"
        created_failure_directory=0
        if [ ! -d "$failure_directory" ]; then
          mkdir "$failure_directory"
          created_failure_directory=1
        fi
        failure_input="$failure_directory/native_test_reuse_failure.rs"
        cat > "$failure_input" <<'RUST_FAILURE'
        use std::hint::black_box;

        #[test]
        fn native_test_reuse_expected_failure() {
            let observed = black_box(true);
            assert!(!observed, "native-test-reuse expected test failure");
        }
        RUST_FAILURE
        git diff --no-index /dev/null "$failure_input" \
          > "$evidence/test-failure.patch" || test "$?" -eq 1
        if task docker:ci:rust:native-test-reuse:solve NATIVE_TEST_CASE_DIR="$evidence/test-failure"; then
          echo 'Actual failing native test unexpectedly passed' >&2; exit 1
        fi
        rm "$failure_input"
        if [ "$created_failure_directory" = 1 ]; then rmdir "$failure_directory"; fi
        # Only the restored source may publish its normal exact branch ref.
        cmp "$proof_dir/replication-original.rs" "$replication"
        cmp "$proof_dir/coverage-floor-original.json" "$floor"
        bun '{{.REPO_ROOT}}/.github/scripts/native-test-reuse-evidence.ts' "$evidence" verify
        GHA_CACHE_EXPORT_MODE=max task docker:ci:rust:native-test-reuse:solve \
          NATIVE_TEST_CASE_DIR="$evidence/registry-export" NATIVE_TEST_CACHE_WRITE=1
        {{.DOCKER}} buildx imagetools inspect --raw "$registry_ref" > "$evidence/cache-manifest.json"
        task docker:ci:rust:native-test-reuse:solve \
          NATIVE_TEST_CASE_DIR="$evidence/registry-import" \
          NATIVE_TEST_TARGET=native-test-import NATIVE_TEST_VERIFY_TARGET=pr-native-test-import
        bun '{{.REPO_ROOT}}/.github/scripts/native-test-reuse-evidence.ts' "$evidence" report

  docker:ci:wasm:export:
    desc: Run WASM clippy/build on a separate CI runner and export only the generated package.
    deps: [sccache:ensure, registry-cache:ensure]
    vars:
      CI_ARTIFACT_DIR: '{{default (printf "%s/ci-artifacts/wasm" .REPO_ROOT) .CI_ARTIFACT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.CI_ARTIFACT_DIR}}";
        case "$out_dir" in /*) ;; *) out_dir="{{.REPO_ROOT}}/$out_dir" ;; esac;
        rm -rf "$out_dir"; mkdir -p "$out_dir";
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --allow="fs.write=$out_dir" --set "wasm-export.output=type=local,dest=$out_dir" wasm-export'
      - task: registry-cache:publish:wasm

  docker:ci:wasm:node-test:
    desc: Run WASM Node tests after the exact generated package is available to parallel consumers.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "builder-wasm.output=type=cacheonly"
        builder-wasm

  docker:ci:cache:publish:rust-base:
    desc: Publish only the shared rust-base toolchain scope from this job's builder.
    env:
      GHA_CACHE_WRITE_ENABLED: "1"
    cmds:
      # rust-base-publish writes nook-rust-base-v2 under write_cache_repository
      # (Main: nook/buildcache; isolated: nook/remote-buildcache…-git-<sha>).
      - >-
        bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh"
        "docker:ci:cache:publish:rust-base"
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "*.output=type=cacheonly"
        rust-base-publish

  docker:ci:cache:publish:native:
    desc: Export the one complete verified native source graph from this job's builder.
    env:
      GHA_CACHE_WRITE_ENABLED: "1"
    cmds:
      # builder-debug's mode=max source scope embeds the verified dependency and
      # rust-base lineage for fresh-node/cross-node restore. Publishing those
      # overlapping complete graphs again only repeats cache preparation.
      - >-
        bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh"
        "cache-publish:native-debug"
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "*.output=type=cacheonly"
        builder-debug

  docker:ci:cache:publish:preflight:
    desc: Export the independently verified preflight graph from its Main job's builder.
    env:
      GHA_CACHE_WRITE_ENABLED: "1"
    cmds:
      - >-
        PREFLIGHT_SOURCE_CONTEXT="{{.REPO_ROOT}}"
        bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh"
        "cache-publish:preflight"
        {{.DOCKER}} buildx bake
        --allow=fs.read={{.REPO_ROOT}}
        {{.SCCACHE_S3_BUILD_SECRETS}}
        -f {{.REPO_ROOT}}/nook-app/docker-bake.hcl
        -f {{.REPO_ROOT}}/nook-app/nook-platform/docker/rust/docker-bake.hcl
        -f {{.REPO_ROOT}}/preflight/docker-bake.hcl
        --set '*.context={{.REPO_ROOT}}'
        --set "*.output=type=cacheonly"
        preflight-test

  docker:ci:cache:publish:wasm:
    desc: Export verified ARC-local WASM source state; hosted CI owns the portable dependency ref.
    env:
      GHA_CACHE_WRITE_ENABLED: "1"
    cmds:
      # ARC's persistent BuildKit keeps dependency layers node-local. Do not let
      # its worker-specific metadata overwrite the portable Main dependency ref;
      # the fresh hosted proof job is its sole writer and consumer verifier.
      - >-
        bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh"
        "docker:ci:cache:publish:wasm"
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "*.output=type=cacheonly"
        wasm-export
      - task: docker:ci:cache:publish:rust-base

  docker:rust-base:
    desc: Bake only rust-base (apt/mold/sccache). Read-only for Zot; never publishes.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      # Restore via rust-base-restore (has cache-from). Context target rust-base
      # omits cache-from so nested nightly/policy leaves are not orphaned.
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-base-restore.output=type=cacheonly"
        rust-base-restore

  docker:ecosystem:policy-tools:
    desc: Bake pinned deny/audit CLIs without exporting a runnable image.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - task: docker:rust-base
      # Restore/build first without publishing. A second cache-only Bake below
      # owns writes for trusted CI or explicitly enabled local publication.
      - >-
        GHA_CACHE_WRITE_ENABLED=
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        rust-ecosystem-policy-tools
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" = "1" ]; then
          GHA_CACHE_WRITE_ENABLED=1 {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            rust-ecosystem-policy-tools
        fi

  docker:ecosystem:dependency-policy:run:
    internal: true
    desc: Run cargo-deny and cargo-audit for one workspace inside BuildKit.
    requires:
      vars: [WORKSPACE]
    cmds:
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-ecosystem-dependency-policy.args.WORKSPACE={{.WORKSPACE}}"
        --set "rust-ecosystem-dependency-policy.args.POLICY_RUN_NONCE=$(od -An -N16 -tx1 /dev/urandom | tr -d '[:space:]')"
        rust-ecosystem-dependency-policy

  docker:ecosystem:dependency-policy:
    desc: Run cargo-deny and cargo-audit for every Rust workspace via its Taskfile.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - task: docker:ecosystem:policy-tools
      - task: dylint:dependency-policy
      - task: rust:dependency-policy
      # This aggregate is flattened through nested includes. Resolve the root
      # graph explicitly so the sibling preflight include is always visible.
      - task --taskfile "{{.REPO_ROOT}}/Taskfile.yml" preflight:dependency-policy
      - task: fuzz:dependency-policy

  docker:ecosystem:check:
    desc: Run all ecosystem check groups concurrently on one node-local BuildKit shard.
    cmds:
      - |
        log_dir="${RUNNER_TEMP:-/tmp}/nook-ecosystem-logs"
        mkdir -p "$log_dir"
        task docker:ecosystem:dependency-policy >"$log_dir/policy.log" 2>&1 & policy_pid=$!
        task docker:ecosystem:smoke >"$log_dir/smoke.log" 2>&1 & smoke_pid=$!
        task docker:ecosystem:dylint >"$log_dir/dylint.log" 2>&1 & dylint_pid=$!
        failed=0
        for group in policy smoke dylint; do
          case "$group" in
            policy) pid=$policy_pid ;;
            smoke) pid=$smoke_pid ;;
            dylint) pid=$dylint_pid ;;
          esac
          result=success
          if ! wait "$pid"; then
            result=failure
            failed=1
          fi
          echo "::group::Rust ecosystem: $group ($result)"
          cat "$log_dir/$group.log"
          echo "::endgroup::"
          if [ "$result" = failure ]; then
            echo "::error::Rust ecosystem $group failed"
          fi
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "$group=$result" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "- Rust ecosystem $group: $result" >> "$GITHUB_STEP_SUMMARY"
          fi
        done
        test "$failed" -eq 0

  docker:ecosystem:smoke:
    desc: Run deterministic tests, fuzz, and Kani concurrently on one runner.
    cmds:
      - |
        task docker:ecosystem:deterministic & deterministic_pid=$!
        task docker:ecosystem:fuzz & fuzz_pid=$!
        task docker:ecosystem:kani & kani_pid=$!
        failed=0
        if wait "$deterministic_pid"; then
          echo "Deterministic tests: success"
        else
          echo "::error::Deterministic tests failed"
          failed=1
        fi
        if wait "$fuzz_pid"; then
          echo "Fuzz smoke: success"
        else
          echo "::error::Fuzz smoke failed"
          failed=1
        fi
        if wait "$kani_pid"; then
          echo "Kani proofs: success"
        else
          echo "::error::Kani proofs failed"
          failed=1
        fi
        test "$failed" -eq 0

  docker:ecosystem:deterministic:
    desc: Bake Proptest, Insta, and Loom on the sealed Rust dependency graph.
    deps: [sccache:ensure, registry-cache:ensure]
    vars:
      NATIVE_COVERAGE_PROVIDED: '{{default "false" .NATIVE_COVERAGE_PROVIDED}}'
    cmds:
      # Context parents have no cache-to. Leaf writes only its own scoped ref when
      # publish enables GHA_CACHE_WRITE_ENABLED.
      - task: docker:rust-base
      - >-
        GHA_CACHE_WRITE_ENABLED=
        bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh"
        "docker:ecosystem:deterministic"
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-ecosystem-deterministic.args.NATIVE_COVERAGE_PROVIDED={{.NATIVE_COVERAGE_PROVIDED}}"
        rust-ecosystem-deterministic
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" = "1" ]; then
          GHA_CACHE_WRITE_ENABLED=1 {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "rust-ecosystem-deterministic.args.NATIVE_COVERAGE_PROVIDED={{.NATIVE_COVERAGE_PROVIDED}}" \
            rust-ecosystem-deterministic
        fi

  docker:ecosystem:kani:
    desc: Run Kani bounded proofs in a full-graph BuildKit cache scope.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - task: docker:rust-base
      - |
        # The leaf's proof RUN must succeed before BuildKit exports its cache.
        # Preserve the existing write admission without repeating the solve.
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" = "1" ]; then
          export GHA_CACHE_WRITE_ENABLED=1
        else
          export GHA_CACHE_WRITE_ENABLED=
        fi
        {{.DOCKER}} buildx bake \
          {{.NOOK_BAKE_FILES}} \
          rust-kani

  docker:ecosystem:fuzz:
    desc: Bake the cargo-fuzz smoke target with a bounded runtime.
    deps: [sccache:ensure, registry-cache:ensure]
    vars:
      FUZZ_SECONDS: '{{default "20" .FUZZ_SECONDS}}'
    cmds:
      - task: docker:rust-base
      - >-
        GHA_CACHE_WRITE_ENABLED=
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-fuzz-smoke.args.FUZZ_SECONDS={{.FUZZ_SECONDS}}"
        rust-fuzz-smoke
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" = "1" ]; then
          GHA_CACHE_WRITE_ENABLED=1 {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "rust-fuzz-smoke.args.FUZZ_SECONDS={{.FUZZ_SECONDS}}" \
            rust-fuzz-smoke
        fi

  docker:ecosystem:dylint:build:
    desc: Compile the custom Rust checker without running product checks or UI tests.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - task: docker:rust-base
      - "{{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} rust-dylint-build"

  docker:ecosystem:dylint:
    desc: Independently verify the custom checker and scan native and WASM product crates.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - |
        floor="$(jq -er '.package_lines_percent["nook_domain_api"] | numbers' "{{.REPO_ROOT}}/nook-app/nook-platform/nook-core/coverage-floor.json")" || exit 1
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} \
          --set "rust-dylint.args.RUST_DYLINT_COVERAGE_FLOOR=$floor" \
          rust-dylint

version: '3'

tasks:
  registry-cache:ensure:
    desc: Log into the remote Zot cache registry for local Bake restore/publish.
    cmds:
      - |
        set -euo pipefail
        if [ -n "${GITHUB_ACTIONS:-}" ]; then exit 0; fi
        if [ "${NOOK_REGISTRY_CACHE:-1}" = "0" ]; then exit 0; fi
        cache="${HOME}/.nook/cache"
        user_file="$cache/registry-remote-username"
        pass_file="$cache/registry-remote-password"
        if [ ! -r "$user_file" ] || [ ! -r "$pass_file" ]; then
          if [ "${NOOK_REGISTRY_CACHE:-}" = "1" ]; then
            echo "registry-cache:ensure: missing $user_file / $pass_file" >&2
            exit 1
          fi
          echo "registry-cache:ensure: no remote registry credentials; Bake stays offline" >&2
          exit 0
        fi
        host="${NOOK_REGISTRY_CACHE_HOST:-registry.dev.nokey.sh}"
        user="$(tr -d '[:space:]' <"$user_file")"
        tr -d '\n' <"$pass_file" | {{.DOCKER}} login "$host" -u "$user" --password-stdin >/dev/null
        echo "registry-cache:ensure: local Bake uses remote-buildcache${GHA_CACHE_SCOPE_SUFFIX:-}" >&2

  registry-cache:publish:wasm:
    internal: true
    desc: Publish local WASM BuildKit layers to the git-commit remote-buildcache scope.
    cmds:
      - |
        set -euo pipefail
        if [ -n "${GITHUB_ACTIONS:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" != "1" ]; then exit 0; fi
        bash "{{.REPO_ROOT}}/.github/scripts/git-cache-scope-publish-guard.sh"
        task docker:ci:cache:publish:wasm

  registry-cache:publish:native:
    internal: true
    desc: Publish local native BuildKit layers to the git-commit remote-buildcache scope.
    cmds:
      - |
        set -euo pipefail
        if [ -n "${GITHUB_ACTIONS:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" != "1" ]; then exit 0; fi
        bash "{{.REPO_ROOT}}/.github/scripts/git-cache-scope-publish-guard.sh"
        task docker:ci:cache:publish:native

  registry-cache:publish:web:
    internal: true
    desc: Publish local web BuildKit layers to the git-commit remote-buildcache scope.
    cmds:
      - |
        set -euo pipefail
        if [ -n "${GITHUB_ACTIONS:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" != "1" ]; then exit 0; fi
        bash "{{.REPO_ROOT}}/.github/scripts/git-cache-scope-publish-guard.sh"
        task docker:ci:cache:publish:web

  registry-cache:publish:local-format-deps:
    internal: true
    desc: Publish source-free Rust dependency graphs completed by sealed local formatting.
    cmds:
      - |
        set -euo pipefail
        if [ -n "${GITHUB_ACTIONS:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_DEPS_PUBLISH:-}" != "1" ]; then exit 0; fi
        if ! bash "{{.REPO_ROOT}}/.github/scripts/rust-deps-cache-publish-guard.sh"; then
          echo "registry-cache:publish:local-format-deps: unsafe cache recipe; publication skipped" >&2
          exit 0
        fi
        # Local writes are unique quarantine tags. PR jobs cannot import them.
        # A Main-defined hosted workflow reads every blob twice before it adds
        # the stable content-fingerprint tag.
        candidate="$(date -u +%Y%m%d%H%M%S)-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        fingerprint="${NOOK_RUST_DEPS_INPUT_FINGERPRINT:?missing Rust dependency fingerprint}"
        source_sha="$(git rev-parse HEAD)"
        if ! NOOK_RUST_DEPS_INPUT_WRITE_ENABLED=1 NOOK_RUST_DEPS_INPUT_CANDIDATE="$candidate" {{.DOCKER}} buildx bake \
          {{.NOOK_BAKE_FILES}} \
          --set "*.output=type=cacheonly" \
          builder-wasm-deps-input-publish; then
          echo "registry-cache:publish:local-format-deps: WASM candidate upload failed; stable cache unchanged" >&2
          exit 0
        fi
        if ! NOOK_RUST_DEPS_INPUT_WRITE_ENABLED=1 NOOK_RUST_DEPS_INPUT_CANDIDATE="$candidate" {{.DOCKER}} buildx bake \
          {{.NOOK_BAKE_FILES}} \
          --set "*.output=type=cacheonly" \
          builder-core-deps-input-publish; then
          echo "registry-cache:publish:local-format-deps: native candidate upload failed; stable cache unchanged" >&2
          exit 0
        fi
        if ! command -v gh >/dev/null 2>&1 || ! gh auth status >/dev/null 2>&1; then
          echo "registry-cache:publish:local-format-deps: candidate quarantined; GitHub dispatch unavailable" >&2
          exit 0
        fi
        if [ -n "$(git status --porcelain -- \
          .github/scripts/rust-deps-cache-fingerprint.sh \
          nook-app/nook-platform/Cargo.toml \
          nook-app/nook-platform/Cargo.lock \
          nook-app/nook-platform/clippy.toml \
          nook-app/nook-platform/docker/rust/product.Dockerfile \
          nook-app/nook-platform/docker/rust/product.Dockerfile.dockerignore \
          nook-app/nook-platform/docker/sccache-wrapper.sh \
          nook-app/nook-platform/docker/sccache-report.sh \
          ':(glob)nook-app/**/Cargo.toml' \
          ':(glob)nook-app/nook-platform/.cargo/**' \
          ':(glob)nook-app/nook-platform/.config/**')" ]; then
          echo "registry-cache:publish:local-format-deps: candidate quarantined; dependency inputs are not committed" >&2
          exit 0
        fi
        if ! gh workflow run remote.yml \
          --ref main \
          --raw-field "task=rust-cache:promote" \
          --raw-field "cache_fingerprint=$fingerprint" \
          --raw-field "cache_candidate=$candidate" \
          --raw-field "cache_source_sha=$source_sha"; then
          echo "registry-cache:publish:local-format-deps: candidate quarantined; hosted promotion dispatch failed" >&2
          exit 0
        fi
        echo "registry-cache:publish:local-format-deps: hosted promotion dispatched for $candidate"

  docker:rust:task:
    internal: true
    desc: Run a Task target in the on-demand source-sealed Rust/WASM image.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        --ipc=host
        -e WASM_BUILD_MODE="{{.WASM_BUILD_MODE}}"
        -e CI=1
        -w /meta-secret/nook
        {{.DOCKER_RUST_IMAGE}}
        task {{.TASK}}

  docker:rust:browser:task:
    internal: true
    desc: Run a Task target in the on-demand Rust/WASM image with Chromium.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        --ipc=host
        -e WASM_BUILD_MODE="{{.WASM_BUILD_MODE}}"
        -e CI=1
        -w /meta-secret/nook
        {{.DOCKER_RUST_BROWSER_IMAGE}}
        task {{.TASK}}

  docker:wasm:build:fast:
    internal: true
    # Mounted fast path uses a manifest-keyed image whose Cargo target lives outside the bind mount.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        -e REPO_ROOT=/meta-secret/nook
        -e GIT_COMMIT_ID="{{.GIT_COMMIT_ID}}"
        -e CI_AGENT_IMAGE=nook-ci-agent:local
        -e WASM_BUILD_MODE=dev
        -e CARGO_TARGET_DIR=/opt/nook/cargo-target
        -v "{{.REPO_ROOT}}:/meta-secret/nook"
        -w /meta-secret/nook
        {{.DOCKER_RUST_FAST_IMAGE}}
        task _wasm:build:fast

  docker:extract:coverage:
    desc: Copy portable Rust crate coverage artifacts from the sealed Docker image to the host.
    vars:
      COVERAGE_OUT_DIR: '{{default (printf "%s/coverage/nook-core" .REPO_ROOT) .COVERAGE_OUT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.COVERAGE_OUT_DIR}}";
        case "$out_dir" in
          /*) ;;
          *) out_dir="{{.REPO_ROOT}}/$out_dir" ;;
        esac;
        rm -rf "$out_dir";
        mkdir -p "$out_dir";
        cid="$({{.DOCKER}} create --platform linux/amd64 {{.DOCKER_IMAGE}})";
        cleanup() { {{.DOCKER}} rm -f "$cid" >/dev/null 2>&1 || true; };
        trap cleanup EXIT;
        {{.DOCKER}} cp "$cid:/opt/nook/coverage/nook-core/." "$out_dir/"'

  docker:coverage:export:
    desc: Run coverage-gated portable Rust unit tests and export their artifacts (no app image export).
    deps:
      - sccache:ensure
      - registry-cache:ensure
    vars:
      COVERAGE_OUT_DIR: '{{default (printf "%s/coverage/nook-core" .REPO_ROOT) .COVERAGE_OUT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.COVERAGE_OUT_DIR}}";
        case "$out_dir" in
          /*) ;;
          *) out_dir="{{.REPO_ROOT}}/$out_dir" ;;
        esac;
        rm -rf "$out_dir";
        mkdir -p "$out_dir";
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --allow="fs.write=$out_dir" --set "coverage-export.output=type=local,dest=$out_dir" coverage-export'

  docker:ci:rust:export:
    desc: Run native Rust formatting/coverage on one CI runner and export only coverage artifacts.
    deps: [sccache:ensure, registry-cache:ensure]
    vars:
      CI_ARTIFACT_DIR: '{{default (printf "%s/ci-artifacts/rust" .REPO_ROOT) .CI_ARTIFACT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.CI_ARTIFACT_DIR}}";
        case "$out_dir" in /*) ;; *) out_dir="{{.REPO_ROOT}}/$out_dir" ;; esac;
        rm -rf "$out_dir"; mkdir -p "$out_dir";
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --allow="fs.write=$out_dir" --set "coverage-export.output=type=local,dest=$out_dir" --set "rust-format-check.output=type=cacheonly" ci-rust'
      - task: registry-cache:publish:native

  docker:ci:wasm:export:
    desc: Run WASM clippy/build on a separate CI runner and export only the generated package.
    deps: [sccache:ensure, registry-cache:ensure]
    vars:
      CI_ARTIFACT_DIR: '{{default (printf "%s/ci-artifacts/wasm" .REPO_ROOT) .CI_ARTIFACT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.CI_ARTIFACT_DIR}}";
        case "$out_dir" in /*) ;; *) out_dir="{{.REPO_ROOT}}/$out_dir" ;; esac;
        rm -rf "$out_dir"; mkdir -p "$out_dir";
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --allow="fs.write=$out_dir" --set "wasm-export.output=type=local,dest=$out_dir" wasm-export'
      - task: registry-cache:publish:wasm

  docker:ci:wasm:node-test:
    desc: Run WASM Node tests after the exact generated package is available to parallel consumers.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "builder-wasm.output=type=cacheonly"
        builder-wasm

  docker:ci:cache:publish:rust-base:
    desc: Publish only the shared rust-base toolchain scope from this job's builder.
    env:
      GHA_CACHE_WRITE_ENABLED: "1"
    cmds:
      # rust-base-publish writes nook-rust-base-v1 under write_cache_repository
      # (Main: nook/buildcache; isolated: nook/remote-buildcache…-git-<sha>).
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "*.output=type=cacheonly"
        rust-base-publish

  docker:ci:cache:publish:native:
    desc: Export the already-verified native dependency/source graph from this job's builder.
    env:
      GHA_CACHE_WRITE_ENABLED: "1"
    cmds:
      # Stage scoped publishers alone. Context parents have no cache-to, so linked
      # leaves cannot thin-export another scope.
      - task: docker:ci:cache:publish:rust-base
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "*.output=type=cacheonly"
        builder-core-deps-publish
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "*.output=type=cacheonly"
        builder-debug
      - >-
        {{.DOCKER}} buildx bake
        --allow=fs.read={{.REPO_ROOT}}
        {{.SCCACHE_S3_BUILD_SECRETS}}
        -f {{.REPO_ROOT}}/nook-app/docker-bake.hcl
        -f {{.REPO_ROOT}}/nook-app/nook-platform/docker/rust/docker-bake.hcl
        -f {{.REPO_ROOT}}/preflight/docker-bake.hcl
        --set '*.context={{.REPO_ROOT}}'
        --set '*.args.SCCACHE_S3_MODE={{.SCCACHE_S3_MODE}}'
        --set '*.args.SCCACHE_ENDPOINT={{.SCCACHE_ENDPOINT}}'
        --set '*.args.SCCACHE_BUCKET={{.SCCACHE_BUCKET}}'
        --set "*.output=type=cacheonly"
        preflight-test

  docker:ci:cache:publish:wasm:
    desc: Export verified ARC-local WASM source state; hosted CI owns the portable dependency ref.
    env:
      GHA_CACHE_WRITE_ENABLED: "1"
    cmds:
      # ARC's persistent BuildKit keeps dependency layers node-local. Do not let
      # its worker-specific metadata overwrite the portable Main dependency ref;
      # the fresh hosted proof job is its sole writer and consumer verifier.
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "*.output=type=cacheonly"
        wasm-export
      - task: docker:ci:cache:publish:rust-base

  docker:rust-base:
    desc: Bake only rust-base (apt/mold/sccache). Read-only for Zot; never publishes.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      # Restore via rust-base-restore (has cache-from). Context target rust-base
      # omits cache-from so nested nightly/policy leaves are not orphaned.
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-base-restore.output=type=cacheonly"
        rust-base-restore

  docker:ecosystem:policy-tools:
    desc: Bake pinned deny/audit CLIs without exporting a runnable image.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - task: docker:rust-base
      # Restore/build first without publishing. A second cache-only Bake below
      # owns writes for trusted CI or explicitly enabled local publication.
      - >-
        GHA_CACHE_WRITE_ENABLED=
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        rust-ecosystem-policy-tools
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" = "1" ]; then
          GHA_CACHE_WRITE_ENABLED=1 {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            rust-ecosystem-policy-tools
        fi

  docker:ecosystem:dependency-policy:run:
    internal: true
    desc: Run cargo-deny and cargo-audit for one workspace inside BuildKit.
    requires:
      vars: [WORKSPACE]
    cmds:
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-ecosystem-dependency-policy.args.WORKSPACE={{.WORKSPACE}}"
        --set "rust-ecosystem-dependency-policy.args.POLICY_RUN_NONCE=$(od -An -N16 -tx1 /dev/urandom | tr -d '[:space:]')"
        rust-ecosystem-dependency-policy

  docker:ecosystem:dependency-policy:
    desc: Run cargo-deny and cargo-audit for every Rust workspace via its Taskfile.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - task: docker:ecosystem:policy-tools
      - task: rust:dependency-policy
      - task: preflight:dependency-policy
      - task: fuzz:dependency-policy
      - task: minds:dependency-policy

  docker:ecosystem:deterministic:
    desc: Bake Proptest, Insta, and Loom on the sealed Rust dependency graph.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      # Context parents have no cache-to. Leaf writes only its own scoped ref when
      # publish enables GHA_CACHE_WRITE_ENABLED.
      - task: docker:rust-base
      - >-
        GHA_CACHE_WRITE_ENABLED=
        bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh"
        "docker:ecosystem:deterministic"
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        rust-ecosystem-deterministic
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" = "1" ]; then
          GHA_CACHE_WRITE_ENABLED=1 {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            rust-ecosystem-deterministic
        fi

  docker:ecosystem:kani:
    desc: Run Kani bounded proofs in a full-graph BuildKit cache scope.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - task: docker:rust-base
      - >-
        GHA_CACHE_WRITE_ENABLED=
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        rust-kani
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" = "1" ]; then
          GHA_CACHE_WRITE_ENABLED=1 {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            rust-kani
        fi

  docker:ecosystem:fuzz:
    desc: Bake the cargo-fuzz smoke target with a bounded runtime.
    deps: [sccache:ensure, registry-cache:ensure]
    vars:
      FUZZ_SECONDS: '{{default "20" .FUZZ_SECONDS}}'
    cmds:
      - task: docker:rust-base
      - >-
        GHA_CACHE_WRITE_ENABLED=
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-fuzz-smoke.args.FUZZ_SECONDS={{.FUZZ_SECONDS}}"
        rust-fuzz-smoke
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" = "1" ]; then
          GHA_CACHE_WRITE_ENABLED=1 {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "rust-fuzz-smoke.args.FUZZ_SECONDS={{.FUZZ_SECONDS}}" \
            rust-fuzz-smoke
        fi

  docker:ecosystem:dylint:
    desc: Bake repository Dylint lints on the sealed nightly ecosystem image.
    deps: [sccache:ensure, registry-cache:ensure]
    cmds:
      - task: docker:rust-base
      - >-
        GHA_CACHE_WRITE_ENABLED=
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        rust-dylint
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ] || [ "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}" = "1" ]; then
          GHA_CACHE_WRITE_ENABLED=1 {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            rust-dylint
        fi

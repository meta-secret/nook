[package]
name = "nook_domain_api"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Nook lint enforcing domain types at public Rust API boundaries."

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "=6.0.1"

[dev-dependencies]
dylint_testing = "=6.0.1"

[workspace]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

[package.metadata.rust-analyzer]
rustc_private = true

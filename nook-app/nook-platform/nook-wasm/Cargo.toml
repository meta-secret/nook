[package]
name = "nook-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nook-page-policy = { path = "../nook-page-policy" }
derive_more = { version = "2.1.1", default-features = false, features = ["from"] }
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
nook-companion-core = { path = "../nook-companion-core" }
nook-core = { path = "../nook-core" }
nook-auth2 = { path = "../nook-auth2" }
coset = "0.4.2"
passkey-types = "0.6.0"
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
rexie = "0.6.2"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "AuthenticationExtensionsClientOutputs",
    "AuthenticatorAssertionResponse",
    "AuthenticatorAttestationResponse",
    "AuthenticatorResponse",
    "Credential",
    "CredentialCreationOptions",
    "CredentialRequestOptions",
    "CredentialsContainer",
    "Navigator",
    "PublicKeyCredential",
    "Window",
    "Storage",
] }
base64 = "0.23.1"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
thiserror = "2.0.21"
flume = "0.12.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
gloo-file = { version = "0.4.0", features = ["futures"] }
gloo-storage = "0.4.0"
gloo-utils = "0.3.0"
urlencoding = "2.1.3"
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "fmt", "std"] }
tracing-web = "0.1.3"
zeroize = "1.9.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# age 0.12 (via rand 0.8 and rand_core 0.6) still pulls getrandom 0.2, which
# builds for the browser only with its `js` feature; Nook's own crates use 0.4.
getrandom-legacy = { package = "getrandom", version = "0.2.17", features = ["js"] }

[dev-dependencies]
anyhow = "1.0.104"
wasm-bindgen-test = "0.3.79"
web-sys = { version = "0.3.106", features = ["Request", "Response", "ResponseInit"] }

[features]
default = []
browser-wasm-tests = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[lints]
workspace = true

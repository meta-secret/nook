[package]
name = "nook-companion-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tiny WASM package for auth-companion heuristics and host policy."
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nook-companion-core = { path = "../nook-companion-core" }
wasm-bindgen = "0.2.127"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-legacy = { package = "getrandom", version = "0.2.17", features = ["js"] }

[dev-dependencies]
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-test = "0.3.77"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[lints]
workspace = true

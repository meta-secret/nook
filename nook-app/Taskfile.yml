version: '3'

vars:
  REPO_ROOT:
    sh: 'if [ -n "${REPO_ROOT:-}" ]; then printf "%s" "$REPO_ROOT"; else git rev-parse --show-toplevel; fi'
  APP_ROOT: '{{.REPO_ROOT}}/nook-app'
  PLATFORM_ROOT: '{{.APP_ROOT}}/nook-platform'
  WEB_GROUP_ROOT: '{{.APP_ROOT}}/nook-web'
  WEB_ROOT: '{{.WEB_GROUP_ROOT}}/nook-web-app'
  RESEARCH_ROOT: '{{.WEB_GROUP_ROOT}}/nook-web-research'
  EXTENSION_ROOT: '{{.WEB_GROUP_ROOT}}/nook-web-extension'
  WEB_SHARED_ROOT: '{{.WEB_GROUP_ROOT}}/nook-web-shared'
  DOCKER: '{{default "docker" .DOCKER}}'
  # Keep runtime containers at Docker Desktop's 1 Mi open-file baseline. Kernel-wide inotify
  # limits are host prerequisites documented in README.md; they cannot be set per container.
  DOCKER_NOFILE_LIMIT: '{{default "1048576" .DOCKER_NOFILE_LIMIT}}'
  DOCKER_RUN_LIMITS: '--ulimit nofile={{.DOCKER_NOFILE_LIMIT}}:{{.DOCKER_NOFILE_LIMIT}}'
  # Bake never selects a Buildx instance by name. Hosted CI runs
  # `docker buildx use` before Task. Local Bake uses the active default.
  # The slim sealed web image is the common runtime. Heavy Rust images are loaded only by explicit
  # rust/wasm commands (and the browser variant only by manual browser-wasm tests).
  DOCKER_IMAGE: '{{default "nook-web:local" .DOCKER_IMAGE}}'
  DOCKER_RUST_IMAGE: '{{default "nook-rust:local" .DOCKER_RUST_IMAGE}}'
  DOCKER_RUST_FAST_IMAGE: '{{default "nook-rust-fast:local" .DOCKER_RUST_FAST_IMAGE}}'
  DOCKER_RUST_BROWSER_IMAGE: '{{default "nook-rust-browser:local" .DOCKER_RUST_BROWSER_IMAGE}}'
  DOCKER_POLICY_TOOLS_IMAGE: '{{default "nook-rust-policy-tools:local" .DOCKER_POLICY_TOOLS_IMAGE}}'
  DOCKER_E2E_IMAGE: '{{default "nook-web-e2e:local" .DOCKER_E2E_IMAGE}}'
  DOCKER_MKCERT_IMAGE: '{{default "nook-mkcert:local" .DOCKER_MKCERT_IMAGE}}'
  # Shared across git worktrees. Credentials and other machine-local config live under ~/.nook.
  LOCAL_HTTPS_DIR:
    sh: >-
      if [ -n "${LOCAL_HTTPS_DIR:-}" ]; then
        printf '%s' "$LOCAL_HTTPS_DIR";
      else
        printf '%s' "${HOME}/.nook/https";
      fi
  LOCAL_HTTPS_CONTAINER_DIR: '{{default "/run/nook/https" .LOCAL_HTTPS_CONTAINER_DIR}}'
  # Rust commands and cache-missed Docker compiler vertices use authenticated SeaweedFS S3
  # sccache. Stable BuildKit secret IDs keep credential values out of images and cache checksums.
  SCCACHE_S3_MODE: '{{default "external" .SCCACHE_S3_MODE}}'
  SCCACHE_ENDPOINT: '{{default "https://sccache.dev.nokey.sh" .SCCACHE_ENDPOINT}}'
  SCCACHE_BUCKET: '{{default "nook-sccache" .SCCACHE_BUCKET}}'
  SCCACHE_S3_ACCESS_KEY_FILE:
    sh: >-
      if [ -n "${SCCACHE_S3_ACCESS_KEY_FILE:-}" ]; then
        printf '%s' "$SCCACHE_S3_ACCESS_KEY_FILE";
      else
        printf '%s' "${HOME}/.nook/cache/sccache-access-key";
      fi
  SCCACHE_S3_SECRET_KEY_FILE:
    sh: >-
      if [ -n "${SCCACHE_S3_SECRET_KEY_FILE:-}" ]; then
        printf '%s' "$SCCACHE_S3_SECRET_KEY_FILE";
      else
        printf '%s' "${HOME}/.nook/cache/sccache-secret-key";
      fi
  SCCACHE_S3_CREDENTIAL_MOUNTS:
    sh: >-
      access_file="{{.SCCACHE_S3_ACCESS_KEY_FILE}}";
      secret_file="{{.SCCACHE_S3_SECRET_KEY_FILE}}";
      mounts="";
      if [ -n "$access_file" ] && [ -n "$secret_file" ]; then
        mounts="--mount type=bind,src=$access_file,dst=/run/secrets/sccache_s3_access_key,readonly";
        mounts="$mounts --mount type=bind,src=$secret_file,dst=/run/secrets/sccache_s3_secret_key,readonly";
      fi;
      printf '%s' "$mounts"
  SCCACHE_S3_BUILD_SECRETS:
    sh: >-
      access_file="{{.SCCACHE_S3_ACCESS_KEY_FILE}}";
      secret_file="{{.SCCACHE_S3_SECRET_KEY_FILE}}";
      secrets="";
      if [ -n "$access_file" ] && [ -r "$access_file" ] &&
         [ -n "$secret_file" ] && [ -r "$secret_file" ]; then
        secrets="--allow=fs.read=$access_file --allow=fs.read=$secret_file";
        secrets="$secrets --set '*.secrets=id=sccache_s3_access_key,src=$access_file'";
        secrets="$secrets --set '*.secrets+=id=sccache_s3_secret_key,src=$secret_file'";
      fi;
      printf '%s' "$secrets"
  GIT_COMMIT_ID:
    sh: 'if [ -n "${GIT_COMMIT_ID:-}" ]; then printf "%s" "$GIT_COMMIT_ID"; else repo="${REPO_ROOT:-$(git rev-parse --show-toplevel)}"; cd "$repo" && git rev-parse HEAD; fi'
  WASM_BUILD_MODE: '{{default "dev" .WASM_BUILD_MODE}}'
  PREPARE_GROUP: '{{default "prepare" .PREPARE_GROUP}}'
  SETUP_TARGET: '{{default "nook-web" .SETUP_TARGET}}'
  # buildx bake `-f` flags: app orchestration + one file per package (single source of truth).
  NOOK_BAKE_FILES: >-
    --allow=fs.read={{.REPO_ROOT}}
    {{.SCCACHE_S3_BUILD_SECRETS}}
    -f {{.REPO_ROOT}}/nook-app/docker-bake.hcl
    -f {{.REPO_ROOT}}/nook-app/nook-platform/docker/rust/docker-bake.hcl
    -f {{.REPO_ROOT}}/nook-app/nook-web/docker/web.docker-bake.hcl
    -f {{.REPO_ROOT}}/nook-app/nook-platform/nook-core/docker-bake.hcl
    -f {{.REPO_ROOT}}/nook-app/nook-platform/nook-wasm/docker-bake.hcl
    -f {{.REPO_ROOT}}/nook-app/nook-web/docker/toolchain.docker-bake.hcl
    -f {{.REPO_ROOT}}/nook-app/nook-web/nook-web-app/docker-bake.hcl
    --set '*.context={{.REPO_ROOT}}'
    --set '*.args.SCCACHE_S3_MODE={{.SCCACHE_S3_MODE}}'
    --set '*.args.SCCACHE_ENDPOINT={{.SCCACHE_ENDPOINT}}'
    --set '*.args.SCCACHE_BUCKET={{.SCCACHE_BUCKET}}'
    --set 'builder-wasm.args.WASM_BUILD_MODE={{.WASM_BUILD_MODE}}'
  NOOK_ENV: '{{default "dev" .NOOK_ENV}}'
  VITE_BASE: '{{default "/" .VITE_BASE}}'
  VITE_SITE_URL: '{{default "" .VITE_SITE_URL}}'
  VITE_PUBLIC_APP_URL: '{{default "" .VITE_PUBLIC_APP_URL}}'
  NOOK_SIMPLE_VAULT_URL: '{{default "https://simple.nokey.sh/" .NOOK_SIMPLE_VAULT_URL}}'
  NOOK_EXTENSION_CHANNEL: '{{default "production" .NOOK_EXTENSION_CHANNEL}}'
  NOOK_EXTENSION_VERSION: '{{default "1.0.0" .NOOK_EXTENSION_VERSION}}'
  NOOK_EXTENSION_COMMIT: '{{default .GIT_COMMIT_ID .NOOK_EXTENSION_COMMIT}}'
  NOOK_EXTENSION_SITE_URL: '{{default "https://nokey.sh/" .NOOK_EXTENSION_SITE_URL}}'
  VITE_SIMPLE_APP_URL: '{{default "" .VITE_SIMPLE_APP_URL}}'
  VITE_SENTINEL_APP_URL: '{{default "" .VITE_SENTINEL_APP_URL}}'
  VITE_VAULT_SYNC_INTERVAL_MS: '{{default "" .VITE_VAULT_SYNC_INTERVAL_MS}}'
  WEB_DEV_PORT: '{{default "5173" .WEB_DEV_PORT}}'

includes:
  platform:
    taskfile: nook-platform/Taskfile.yml
    dir: '{{.REPO_ROOT}}'
    flatten: true
  platform-docker:
    taskfile: nook-platform/docker/Taskfile.yml
    dir: '{{.REPO_ROOT}}'
    flatten: true
  wasm:
    taskfile: nook-platform/nook-wasm/Taskfile.yml
    dir: '{{.REPO_ROOT}}'
    flatten: true
  web:
    taskfile: nook-web/Taskfile.yml
    dir: '{{.REPO_ROOT}}'
    flatten: true
  web-docker:
    taskfile: nook-web/docker/Taskfile.yml
    dir: '{{.REPO_ROOT}}'
    flatten: true
  ci:
    taskfile: ci/Taskfile.yml
    dir: '{{.REPO_ROOT}}'
    flatten: true

tasks:
  build:
    desc: Build Rust crates, wasm package, and web app in Docker.
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _build }

  test:
    desc: Run all test suites in Docker.
    cmds:
      - task: preflight
      - task: setup
      - task: docker:task
        vars: { TASK: _test }

  lint:
    desc: Run all linters in Docker.
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _lint }

  check:
    desc: Run formatting, linting, tests, and builds in Docker.
    cmds:
      - task: preflight
      - task: setup
      - task: docker:task
        vars: { TASK: _check }

  format:
    desc: >-
      Format all projects in sealed Docker images and apply the diff to the host
      working tree. Always run before every commit/push — formatting is cheap and
      unconditional.
    cmds:
      - bash "{{.REPO_ROOT}}/.github/scripts/format-host-apply.sh"

  format:diff:
    desc: >-
      Format in sealed Docker images and print the unified diff without applying
      it to the host (debug only). Agents should use `task format` instead.
    cmds:
      - task: setup:rust
      - task: docker:rust:task
        vars: { TASK: _rust:format }
      - task: setup
        vars: { PREPARE_GROUP: prepare-with-unformatted-rust }
      - task: docker:task
        vars: { TASK: _format }

  format:check:
    desc: Check formatting for all projects in Docker.
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _format:check }

  _build:
    desc: Build web app and browser extension after Rust/WASM succeeded in the image build.
    cmds:
      - task: _web:build:parallel
      - task: _extension:build

  _test:
    desc: Run all test suites.
    cmds:
      # Native Rust coverage/tests and wasm-bindgen Node tests run in the Rust image-build branch.
      - task: _web:check
      - task: _web:test
      - task: _extension:check

  _lint:
    desc: Run web linters after Rust/WASM clippy succeeded in the image build.
    cmds:
      - task: _web:lint
      - task: _extension:format:check

  _check:
    desc: Run formatting, linting, tests, and builds.
    cmds:
      - task: _format:check
      - task: _lint
      - task: _test
      - task: _build

  _verify:
    desc: Format, lint, and test without production web build.
    cmds:
      - task: _format:check
      - task: _lint
      - task: _test

  _verify:parallel:
    desc: Lint ‖ tests when wasm is already built (ci:pr parallel track).
    deps:
      - _lint:parallel
      - _test:parallel

  _lint:parallel:
    desc: Web and extension linters only — Rust clippy already runs in the Rust image branch.
    cmds:
      - task: _web:lint:parallel
      - task: _extension:format:check

  _test:parallel:
    desc: Svelte check, Vitest, and extension type-check after Rust/WASM and web builds ran at image build.
    deps:
      - _web:check:parallel
      - _web:test:parallel
      - _extension:check

  _format:
    desc: Format web projects, then print a host-applicable git diff (sealed image).
    cmds:
      - cd "{{.WEB_ROOT}}" && bun run format
      - cd "{{.EXTENSION_ROOT}}" && bun run format
      - cd "{{.RESEARCH_ROOT}}" && bun run format
      - >-
        sh -c 'if git diff --quiet; then
          echo "==> Web/extension already formatted; no changes." >&2;
        else
          echo "==> Web/extension formatting changes (host apply via task format):" >&2;
          git --no-pager diff;
        fi'

  _format:check:
    desc: Check web formatting after Rust fmt succeeded in the image-build branch.
    cmds:
      - cd "{{.WEB_ROOT}}" && bun run format:check
      - cd "{{.EXTENSION_ROOT}}" && bun run format:check
      - cd "{{.RESEARCH_ROOT}}" && bun run format:check


  default:
    desc: Build every project.
    cmds:
      - task: build

  setup:
    desc: Build the slim linux/amd64 nook-web image via parallel Rust/WASM + web preparation.
    dir: '{{.REPO_ROOT}}'
    deps:
      - sccache:ensure
      - registry-cache:ensure
    # Phase one builds Rust/WASM validation and web dependencies concurrently, exporting only the
    # generated WASM package + coverage files to a commit-scoped, invocation-isolated host directory.
    # Phase two consumes that tiny directory to build the web image; builder-wasm is never a
    # parent/context of nook-web. Retry only that immediate final solve once for the known BuildKit
    # frontend flake; never repeat the multi-minute preparation graph.
    env:
      GIT_COMMIT_ID: '{{.GIT_COMMIT_ID}}'
      WASM_BUILD_MODE: '{{.WASM_BUILD_MODE}}'
      VITE_BASE: '{{.VITE_BASE}}'
      VITE_SITE_URL: '{{.VITE_SITE_URL}}'
      VITE_PUBLIC_APP_URL: '{{.VITE_PUBLIC_APP_URL}}'
      NOOK_SIMPLE_VAULT_URL: '{{.NOOK_SIMPLE_VAULT_URL}}'
      NOOK_EXTENSION_CHANNEL: '{{.NOOK_EXTENSION_CHANNEL}}'
      NOOK_EXTENSION_VERSION: '{{.NOOK_EXTENSION_VERSION}}'
      NOOK_EXTENSION_COMMIT: '{{.NOOK_EXTENSION_COMMIT}}'
      NOOK_EXTENSION_SITE_URL: '{{.NOOK_EXTENSION_SITE_URL}}'
      VITE_SIMPLE_APP_URL: '{{.VITE_SIMPLE_APP_URL}}'
      VITE_SENTINEL_APP_URL: '{{.VITE_SENTINEL_APP_URL}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        commit_id="${GIT_COMMIT_ID:?task setup requires GIT_COMMIT_ID}";
        setup_target="{{.SETUP_TARGET}}";
        case "$setup_target" in nook-web|nook-web-e2e) ;; *) echo "Unsupported SETUP_TARGET=$setup_target" >&2; exit 2 ;; esac;
        if [ "${#commit_id}" -ne 40 ] || [[ "$commit_id" == *[!0-9a-f]* ]]; then
          echo "task setup: GIT_COMMIT_ID must be a full lowercase git SHA" >&2;
          exit 1;
        fi;
        artifacts_parent="${TMPDIR:-/tmp}/nook-web-artifacts";
        artifacts_root="$artifacts_parent/$commit_id";
        mkdir -p "$artifacts_root";
        artifacts_dir="$(mktemp -d "$artifacts_root/invocation.XXXXXX")";
        cleanup() {
          rm -rf "$artifacts_dir";
          rmdir "$artifacts_root" 2>/dev/null || true;
          rmdir "$artifacts_parent" 2>/dev/null || true;
        };
        trap cleanup EXIT;
        rm -rf "$artifacts_dir";
        mkdir -p "$artifacts_dir";
        {{.DOCKER}} buildx bake --allow=fs.write="$artifacts_dir" {{.NOOK_BAKE_FILES}} --set "web-artifacts.output=type=local,dest=$artifacts_dir" --set "web-deps.output=type=cacheonly" --set "rust-format-check.output=type=cacheonly" --set "builder-wasm-deps.output=type=cacheonly" --set "builder-core-deps.output=type=cacheonly" --set "builder-debug.output=type=cacheonly" {{.PREPARE_GROUP}};
        artifact_kib="$(du -sk "$artifacts_dir" | cut -f1)";
        echo "task setup: commit-scoped host WASM/coverage handoff is ${artifact_kib} KiB";
        test "$artifact_kib" -le 262144 || { echo "task setup: refusing oversized Rust/web handoff (${artifact_kib} KiB)" >&2; exit 1; };
        WEB_ARTIFACTS_CONTEXT="$artifacts_dir" bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh" "setup: $setup_target" {{.DOCKER}} buildx bake --allow=fs.read="$artifacts_dir" {{.NOOK_BAKE_FILES}} "$setup_target"'
      - task: registry-cache:publish:local-format-deps

  setup:web:focused:
    desc: Build the narrow source-sealed web image for focused checks without full verification or production builds.
    dir: '{{.REPO_ROOT}}'
    deps:
      - sccache:ensure
      - registry-cache:ensure
    env:
      GIT_COMMIT_ID: '{{.GIT_COMMIT_ID}}'
      NOOK_EXTENSION_COMMIT: '{{.NOOK_EXTENSION_COMMIT}}'
      WASM_BUILD_MODE: '{{.WASM_BUILD_MODE}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        commit_id="${GIT_COMMIT_ID:?task setup:web:focused requires GIT_COMMIT_ID}";
        if [ "${#commit_id}" -ne 40 ] || [[ "$commit_id" == *[!0-9a-f]* ]]; then
          echo "task setup:web:focused: GIT_COMMIT_ID must be a full lowercase git SHA" >&2;
          exit 1;
        fi;
        artifacts_parent="${TMPDIR:-/tmp}/nook-focused-web-artifacts";
        artifacts_root="$artifacts_parent/$commit_id";
        mkdir -p "$artifacts_root";
        artifacts_dir="$(mktemp -d "$artifacts_root/invocation.XXXXXX")";
        cleanup() {
          rm -rf "$artifacts_dir";
          rmdir "$artifacts_root" 2>/dev/null || true;
          rmdir "$artifacts_parent" 2>/dev/null || true;
        };
        trap cleanup EXIT;
        {{.DOCKER}} buildx bake --allow=fs.write="$artifacts_dir" {{.NOOK_BAKE_FILES}} --set "focused-web-artifacts.output=type=local,dest=$artifacts_dir" --set "web-deps.output=type=cacheonly" focused-web-artifacts web-deps;
        artifact_kib="$(du -sk "$artifacts_dir" | cut -f1)";
        echo "task setup:web:focused: WASM handoff is ${artifact_kib} KiB";
        test "$artifact_kib" -le 262144 || {
          echo "task setup:web:focused: refusing oversized WASM handoff (${artifact_kib} KiB)" >&2;
          exit 1;
        };
        WEB_ARTIFACTS_CONTEXT="$artifacts_dir" {{.DOCKER}} buildx bake --allow=fs.read="$artifacts_dir" {{.NOOK_BAKE_FILES}} nook-web-focused'

version: '3'

tasks:
  extension:build:
    desc: >-
      Build the browser extension in Docker for one Simple vault:
      VAULT=nokey (default), meta-secret, localhost, or a Simple vault URL.
    cmds:
      # Start a fresh Task invocation so the root Taskfile resolves its environment-backed
      # NOOK_EXTENSION_VAULT before setup seals the Docker image.
      - >-
        NOOK_EXTENSION_VAULT='{{.VAULT}}'
        task --taskfile "{{.REPO_ROOT}}/Taskfile.yml" _extension:build:sealed

  _extension:build:sealed:
    desc: Build the browser extension in Docker for the vault in NOOK_EXTENSION_VAULT.
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _extension:build }

  extension:build:localhost:
    desc: Build the browser extension for the trusted local Simple Vault server (VAULT defaults to localhost).
    cmds:
      - >-
        NOOK_EXTENSION_CHANNEL=local
        task --taskfile "{{.REPO_ROOT}}/Taskfile.yml" extension:build
        VAULT='{{default "localhost" .VAULT}}'

  extension:scenario:
    desc: >-
      Drive a dev scenario (SCENARIO=<name> from scenarios/) in new Brave
      profiles, one per device it opens, against the running dev servers,
      then reopen each profile as an ordinary Brave window for a person to
      continue.
    deps:
      - extension:dev:bun
    vars:
      # The dev loop's pinned Bun, as extension:dev uses it.
      DEV_BUN_VERSION:
        sh: jq -r '.packageManager | sub("^bun@"; "")' "{{.EXTENSION_ROOT}}/package.json"
    cmds:
      - test -n "{{.SCENARIO}}" || (echo "SCENARIO is required (e.g. s3-paired-pin)" >&2; exit 1)
      # The vault and the extension both load this WASM, translations included;
      # it rebuilds only when its Rust or locale sources changed.
      - WASM_BUILD_MODE=dev task --taskfile "{{.REPO_ROOT}}/Taskfile.yml" _wasm:build
      - >-
        PATH="$HOME/.nook/bun/{{.DEV_BUN_VERSION}}/bin:$PATH"
        NOOK_EXTENSION_VAULT='{{default "localhost" .VAULT}}'
        NOOK_EXTENSION_CHANNEL=local
        task --taskfile "{{.REPO_ROOT}}/Taskfile.yml" _extension:build
      - |
        root="$HOME/Library/Application Support/Nook/browser-profiles/scenario-{{.SCENARIO}}-$(date +%Y%m%d-%H%M%S)"
        cd "{{.EXTENSION_ROOT}}"
        PATH="$HOME/.nook/bun/{{.DEV_BUN_VERSION}}/bin:$PATH" \
          NOOK_SCENARIO_ROOT="$root" NOOK_EXTENSION_VAULT='{{default "localhost" .VAULT}}' \
          bun x playwright test --config scenarios/playwright.config.ts "scenarios/{{.SCENARIO}}.scenario.ts"
        # One Brave window per device the scenario opened, each on its profile.
        for profile in "$root"/*/; do
          open -na "Brave Browser" --args --user-data-dir="$profile" \
            --load-extension="{{.EXTENSION_ROOT}}/dist" --no-first-run --no-default-browser-check \
            https://localhost:5173/app/
          echo "Scenario {{.SCENARIO}}: $(basename "$profile") is open in Brave on $profile"
        done

  extension:check:
    desc: Type-check the browser extension and verify the build sealed by setup.
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _extension:check }

  remote:extension:check:
    desc: Check the extension in the narrow source-sealed remote image.
    deps:
      - setup:web:focused
    cmds:
      - task: docker:task
        vars: { TASK: _extension:check }

  extension:check:fast:
    desc: Run host-cached extension format, unit/manifest, shell, and hosted-launcher checks without building WASM or Docker.
    preconditions:
      - sh: test -x "{{.WEB_ROOT}}/node_modules/.bin/tsc"
        msg: Run `cd nook-app/nook-web/nook-web-app && bun install --frozen-lockfile` once to seed host web dependencies.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bun run format:check
      - cd "{{.EXTENSION_ROOT}}" && bun test scripts src/lib
      - bash -n "{{.EXTENSION_ROOT}}/scripts/hosted-extension.sh" "{{.EXTENSION_ROOT}}/scripts/hosted-extension.test.sh" "{{.EXTENSION_ROOT}}/scripts/run-with-xvfb.sh" "{{.EXTENSION_ROOT}}/scripts/test-e2e.sh" "{{.EXTENSION_ROOT}}/scripts/test-hosted-smoke.sh" "{{.EXTENSION_ROOT}}/scripts/test-hosted-smoke.test.sh" "{{.EXTENSION_ROOT}}/scripts/setup-brave-vault.sh" "{{.EXTENSION_ROOT}}/scripts/setup-brave-vault.test.sh" "{{.EXTENSION_ROOT}}/scripts/verify-deployment.sh"
      - if command -v shellcheck >/dev/null 2>&1; then shellcheck "{{.EXTENSION_ROOT}}/scripts/hosted-extension.sh" "{{.EXTENSION_ROOT}}/scripts/hosted-extension.test.sh" "{{.EXTENSION_ROOT}}/scripts/run-with-xvfb.sh" "{{.EXTENSION_ROOT}}/scripts/test-e2e.sh" "{{.EXTENSION_ROOT}}/scripts/test-hosted-smoke.sh" "{{.EXTENSION_ROOT}}/scripts/test-hosted-smoke.test.sh" "{{.EXTENSION_ROOT}}/scripts/setup-brave-vault.sh" "{{.EXTENSION_ROOT}}/scripts/setup-brave-vault.test.sh" "{{.EXTENSION_ROOT}}/scripts/verify-deployment.sh"; fi
      - bash "{{.EXTENSION_ROOT}}/scripts/hosted-extension.test.sh"
      - bash "{{.EXTENSION_ROOT}}/scripts/test-hosted-smoke.test.sh"
      - bash "{{.EXTENSION_ROOT}}/scripts/setup-brave-vault.test.sh"

  extension:test:taskfile:
    desc: Test the focused Extension E2E Task and Docker Taskfile contracts in the E2E image without browser tests.
    deps:
      - task: setup:web:e2e:focused
    cmds:
      - task: docker:e2e:run
        vars: { TASK: _extension:test:taskfile }

  extension:test:e2e:
    desc: Run browser extension Playwright e2e in Docker.
    deps:
      - task: setup
        vars: { SETUP_TARGET: nook-web-e2e }
    cmds:
      - task: docker:e2e:run
        vars: { TASK: _extension:test:e2e }

  extension:test:e2e:ci:
    desc: Extension Playwright e2e from the already-built CI e2e image.
    cmds:
      - task: docker:e2e:run
        vars: { TASK: _extension:test:e2e }

  extension:test:e2e:file:
    desc: Run one browser extension Playwright E2E spec file or line (E2E_SPEC).
    vars:
      E2E_SPEC: '{{env "E2E_SPEC"}}'
    env:
      E2E_SPEC: '{{default "" .E2E_SPEC}}'
    preconditions:
      - sh: |
          case "${E2E_SPEC:-}" in
            ''|*[!A-Za-z0-9_.:-]*) exit 1 ;;
          esac
          case "$E2E_SPEC" in
            *.spec.ts) ;;
            *.spec.ts:*)
              spec_name="${E2E_SPEC%:*}"
              line_number="${E2E_SPEC##*:}"
              case "$spec_name" in
                *:*) exit 1 ;;
                *.spec.ts) ;;
                *) exit 1 ;;
              esac
              case "$line_number" in
                ''|*[!0-9]*) exit 1 ;;
                *[1-9]*) ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac
        msg: >-
          E2E_SPEC must be an Extension E2E spec basename ending in .spec.ts,
          optionally followed by :<positive line number>.
    cmds:
      - task: setup:web:e2e:focused
      - task: docker:e2e:run
        vars:
          TASK: _extension:test:e2e:file
          E2E_SPEC: '{{.E2E_SPEC}}'

  extension:smoke:hosted:
    desc: Download and verify a dev or PR extension, then run its disposable hosted Simple Vault smoke in Docker.
    deps:
      - task: setup
        vars: { SETUP_TARGET: nook-web-e2e }
    env:
      CHANNEL: '{{default "" .CHANNEL}}'
      PR: '{{default "" .PR}}'
    cmds:
      - task: docker:e2e:run
        vars: { TASK: _extension:smoke:hosted }

  extension:format:
    desc: >-
      Format the browser extension inside the sealed image only (does not write
      the host). Prefer `task format`, which formats Rust + web + extension and
      applies the sealed-image diff to the host working tree.
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _extension:format }

  extension:format:check:
    desc: Check browser extension formatting in Docker.
    deps:
      - setup
    cmds:
      - task: docker:task
        vars: { TASK: _extension:format:check }

  extension:package:
    desc: Build and zip the browser extension for distribution.
    cmds:
      - task: extension:build
      - task: docker:extract:extension
      - >-
        bash -c 'set -euo pipefail;
        version="$(jq -r ".version" "{{.EXTENSION_ROOT}}/package.json")";
        zip_name="nook-web-extension-${version}.zip";
        zip_path="{{.EXTENSION_ROOT}}/dist/${zip_name}";
        rm -f "$zip_path";
        cd "{{.EXTENSION_ROOT}}/dist";
        zip -r "$zip_name" . -x "$zip_name" >/dev/null;
        test "$(unzip -Z1 "$zip_name" | grep -c "^manifest.json$")" -eq 1;
        printf "Packaged %s\n" "$zip_path";'

  extension:install:local:
    desc: Copy the packaged extension to a stable local Nook install directory.
    cmds:
      - task: extension:package
      - >-
        bash -c 'set -euo pipefail;
        version="$(jq -r ".version" "{{.EXTENSION_ROOT}}/package.json")";
        zip_name="nook-web-extension-${version}.zip";
        release_root="${NOOK_EXTENSION_RELEASE_DIR:-$HOME/Library/Application Support/Nook/browser-extensions/nook-web-extension}";
        unpacked_dir="$release_root/current";
        releases_dir="$release_root/releases";
        rm -rf "$unpacked_dir";
        mkdir -p "$unpacked_dir" "$releases_dir";
        cp -R "{{.EXTENSION_ROOT}}/dist/." "$unpacked_dir/";
        rm -f "$unpacked_dir"/nook-web-extension-*.zip;
        cp "{{.EXTENSION_ROOT}}/dist/$zip_name" "$releases_dir/$zip_name";
        printf "Copied unpacked extension to %s\n" "$unpacked_dir";
        printf "Copied release zip to %s\n" "$releases_dir/$zip_name";'

  extension:install:localhost:
    desc: Install a local extension build targeting https://localhost:5173 (VAULT defaults to localhost).
    cmds:
      - >-
        NOOK_EXTENSION_CHANNEL=local
        task --taskfile "{{.REPO_ROOT}}/Taskfile.yml" extension:install:local
        VAULT='{{default "localhost" .VAULT}}'

  extension:install:hosted:
    desc: Download, verify, and atomically install a hosted extension (CHANNEL=dev|prod or PR=<number>).
    env:
      CHANNEL: '{{default "" .CHANNEL}}'
      PR: '{{default "" .PR}}'
    cmds:
      - bash "{{.EXTENSION_ROOT}}/scripts/hosted-extension.sh" install

  extension:test:hosted-launcher:
    desc: Test hosted extension resolution, validation, and atomic installation without launching a browser.
    cmds:
      - bash "{{.EXTENSION_ROOT}}/scripts/hosted-extension.test.sh"

  extension:run:chrome:
    desc: Launch Chrome with localhost by default, or a hosted build selected by CHANNEL=dev|prod or PR=<number>.
    env:
      CHANNEL: '{{default "" .CHANNEL}}'
      PR: '{{default "" .PR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        if [ -n "${CHANNEL:-}" ] || [ -n "${PR:-}" ]; then
          exec bash "{{.EXTENSION_ROOT}}/scripts/hosted-extension.sh" run chrome;
        fi;
        task --taskfile "{{.REPO_ROOT}}/Taskfile.yml" extension:install:localhost;
        extension_dir="${NOOK_EXTENSION_RELEASE_DIR:-$HOME/Library/Application Support/Nook/browser-extensions/nook-web-extension}/current";
        profile_dir="${NOOK_CHROME_EXTENSION_PROFILE_DIR:-$HOME/Library/Application Support/Nook/browser-profiles/chrome-extension-dev}";
        exec bash "{{.EXTENSION_ROOT}}/scripts/hosted-extension.sh" launch-local chrome "$extension_dir" "$profile_dir";'

  extension:run:brave:
    desc: Launch Brave with localhost by default, or a hosted build selected by CHANNEL=dev|prod or PR=<number>.
    env:
      CHANNEL: '{{default "" .CHANNEL}}'
      PR: '{{default "" .PR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        if [ -n "${CHANNEL:-}" ] || [ -n "${PR:-}" ]; then
          exec bash "{{.EXTENSION_ROOT}}/scripts/hosted-extension.sh" run brave;
        fi;
        task --taskfile "{{.REPO_ROOT}}/Taskfile.yml" extension:install:localhost;
        extension_dir="${NOOK_EXTENSION_RELEASE_DIR:-$HOME/Library/Application Support/Nook/browser-extensions/nook-web-extension}/current";
        profile_dir="${NOOK_BRAVE_EXTENSION_PROFILE_DIR:-$HOME/Library/Application Support/Nook/browser-profiles/brave-extension-dev}";
        exec bash "{{.EXTENSION_ROOT}}/scripts/hosted-extension.sh" launch-local brave "$extension_dir" "$profile_dir";'

  extension:dev:
    desc: >-
      Host-native fast loop: build dev WASM, serve https://localhost:5173 with Vite, run the local
      S3 server on http://127.0.0.1:8333, open Brave with the unpacked localhost extension, and
      rebuild/reload it on Rust or web source changes.
    interactive: true
    env:
      NOOK_DEV_FRESH_PROFILE: '{{default "" .FRESH}}'
      # The loop's WASM build, extension build, Vite and local S3 server inherit
      # these from the start: a dev WASM build, the local channel against the
      # HTTPS dev vault.
      WASM_BUILD_MODE: dev
      NOOK_EXTENSION_VAULT: '{{default "localhost" .VAULT}}'
      NOOK_EXTENSION_CHANNEL: local
      NOOK_LOCAL_HTTPS: '1'
      NOOK_LOCAL_HTTPS_CERT_PATH: '{{.LOCAL_HTTPS_DIR}}/localhost.pem'
      NOOK_LOCAL_HTTPS_KEY_PATH: '{{.LOCAL_HTTPS_DIR}}/localhost-key.pem'
    deps:
      - extension:dev:bun
      - s3:dev:install
    vars:
      DEV_BUN_VERSION: &dev-bun-version
        sh: jq -r '.packageManager | sub("^bun@"; "")' "{{.EXTENSION_ROOT}}/package.json"
      # The pinned SeaweedFS release; web.Dockerfile pins the same one for e2e.
      SEAWEEDFS_VERSION: &seaweedfs-version '4.48'
    preconditions:
      - sh: command -v wasm-pack >/dev/null && command -v cargo >/dev/null
        msg: The host loop needs cargo (with the wasm32-unknown-unknown target) and wasm-pack on PATH.
      - sh: test -x "{{.WEB_ROOT}}/node_modules/.bin/vite"
        msg: Run `cd nook-app/nook-web/nook-web-app && bun install --frozen-lockfile` once to seed host web dependencies.
      - sh: test -s "{{.LOCAL_HTTPS_DIR}}/localhost.pem"
        msg: Run `task web:https:setup` once to create and trust the localhost certificate.
    cmds:
      # The pinned Bun matches the Docker images; newer bundlers emit different content-script output.
      # The pinned weed serves the loop's local S3 server.
      - cd "{{.EXTENSION_ROOT}}" && PATH="$HOME/.nook/bun/{{.DEV_BUN_VERSION}}/bin:$HOME/.nook/seaweedfs/{{.SEAWEEDFS_VERSION}}:$PATH" bun scripts/dev-loop.ts

  extension:dev:fresh:
    desc: >-
      Run extension:dev from an empty Brave dev profile and an empty local S3 server, deleting
      its extension pairing, device key, localhost vault data, and S3 dev data first.
    interactive: true
    cmds:
      - task: s3:dev:reset
      - task: extension:dev
        vars: { FRESH: '1' }

  extension:dev:bun:
    desc: Install the repository-pinned Bun for host-native dev builds under ~/.nook/bun/<version>.
    internal: true
    vars:
      DEV_BUN_VERSION: *dev-bun-version
    status:
      - test -x "$HOME/.nook/bun/{{.DEV_BUN_VERSION}}/bin/bun"
    cmds:
      - curl -fsSL --create-dirs -o "$HOME/.nook/bun-install.sh" https://bun.sh/install
      - BUN_INSTALL="$HOME/.nook/bun/{{.DEV_BUN_VERSION}}" bash "$HOME/.nook/bun-install.sh" "bun-v{{.DEV_BUN_VERSION}}"

  s3:dev:
    desc: >-
      Run the pinned local S3 server (SeaweedFS weed mini) on http://127.0.0.1:8333 with bucket
      nook-dev and the TEST-ONLY keys in scripts/local-s3-identities.json until Ctrl+C. Its data
      persists until s3:dev:reset.
    interactive: true
    deps:
      - extension:dev:bun
      - s3:dev:install
    vars:
      DEV_BUN_VERSION: *dev-bun-version
      SEAWEEDFS_VERSION: *seaweedfs-version
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && PATH="$HOME/.nook/bun/{{.DEV_BUN_VERSION}}/bin:$HOME/.nook/seaweedfs/{{.SEAWEEDFS_VERSION}}:$PATH" bun scripts/local-s3.ts

  s3:dev:reset:
    desc: Delete the local S3 server's dev data; refuses while a server answers on 127.0.0.1:8333.
    deps:
      - extension:dev:bun
    vars:
      DEV_BUN_VERSION: *dev-bun-version
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && PATH="$HOME/.nook/bun/{{.DEV_BUN_VERSION}}/bin:$PATH" bun scripts/local-s3.ts reset

  s3:dev:install:
    desc: Install the pinned SeaweedFS weed binary under ~/.nook/seaweedfs/<version>, verifying its SHA-256.
    internal: true
    vars:
      SEAWEEDFS_VERSION: *seaweedfs-version
      HOST_PLATFORM:
        sh: uname -sm
    status:
      - test -x "$HOME/.nook/seaweedfs/{{.SEAWEEDFS_VERSION}}/weed"
    cmds:
      - |
        set -eu
        case "{{.HOST_PLATFORM}}" in
          'Darwin arm64')
            asset=darwin_arm64
            digest=faa194e72a346755dc4404288b0561eb3c260351702901d8363024d5099bdd7d
            verify='shasum -a 256 -c -'
            ;;
          'Linux x86_64')
            asset=linux_amd64
            digest=4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124
            verify='sha256sum -c -'
            ;;
          *)
            echo 'The local S3 server pins SeaweedFS for darwin-arm64 and linux-amd64 hosts only.' >&2
            exit 1
            ;;
        esac
        mkdir -p "$HOME/.nook/seaweedfs"
        staging="$(mktemp -d "$HOME/.nook/seaweedfs/.install.XXXXXX")"
        trap 'rm -rf "$staging"' EXIT
        curl -fsSL -o "$staging/weed.tar.gz" "https://github.com/seaweedfs/seaweedfs/releases/download/{{.SEAWEEDFS_VERSION}}/$asset.tar.gz"
        echo "$digest  $staging/weed.tar.gz" | $verify
        tar -xzf "$staging/weed.tar.gz" -C "$staging" weed
        mkdir -p "$HOME/.nook/seaweedfs/{{.SEAWEEDFS_VERSION}}"
        mv "$staging/weed" "$HOME/.nook/seaweedfs/{{.SEAWEEDFS_VERSION}}/weed"

  extension:setup:brave:
    desc: Install a hosted extension in Brave, PIN-protect the device, create a Simple Vault, approve pairing, and leave Brave open (CHANNEL=dev or PR=<number>).
    env:
      CHANNEL: '{{default "" .CHANNEL}}'
      PR: '{{default "" .PR}}'
      NOOK_EXTENSION_SETUP_PIN: '{{default "123456" .NOOK_EXTENSION_SETUP_PIN}}'
      NOOK_EXTENSION_SETUP_VAULT_NAME: '{{default "test" .NOOK_EXTENSION_SETUP_VAULT_NAME}}'
    cmds:
      - bash "{{.EXTENSION_ROOT}}/scripts/setup-brave-vault.sh"

  _extension:build:
    desc: Build the browser extension.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bun run build

  _extension:check:
    desc: Type-check the browser extension; setup already validated and sealed its build.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bun run check
      - bash "{{.EXTENSION_ROOT}}/scripts/hosted-extension.test.sh"

  _extension:lint:parallel:
    desc: Verify generated translation keys and lint the browser extension.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && node ../nook-web-app/scripts/generate-i18n-keys.mjs --check
      - cd "{{.EXTENSION_ROOT}}" && bun run lint

  _extension:typecheck:
    desc: Run only extension Svelte and TypeScript compilers.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bun run typecheck

  _extension:test:parallel:
    desc: Run extension unit and hosted-launcher contract tests after compilation succeeds.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bun run test:unit
      - bash "{{.EXTENSION_ROOT}}/scripts/hosted-extension.test.sh"

  _extension:test:e2e:
    desc: Run browser extension Playwright e2e.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bun run test:e2e

  _extension:test:taskfile:
    desc: Test focused Extension E2E Task and Docker Taskfile contracts without browser tests.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bun test scripts/extension-e2e-taskfile.test.ts ../docker/e2e-taskfile-contract.test.ts

  _extension:test:e2e:shard:
    desc: Run one isolated Main extension browser shard using all available logical CPUs.
    preconditions:
      - sh: test -n "${E2E_SHARD:-}"
        msg: E2E_SHARD is required.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bash scripts/test-e2e.sh --shard="$E2E_SHARD"

  _extension:test:e2e:file:
    desc: Run one browser extension Playwright e2e spec.
    preconditions:
      - sh: test -n "${E2E_SPEC:-}"
        msg: E2E_SPEC is required.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bash scripts/test-e2e.sh "$E2E_SPEC"

  _extension:smoke:hosted:
    desc: Run the disposable hosted extension smoke inside the e2e image.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bash scripts/test-hosted-smoke.sh

  _extension:format:
    desc: Format the browser extension.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bun run format

  _extension:format:check:
    desc: Check browser extension formatting.
    cmds:
      - cd "{{.EXTENSION_ROOT}}" && bun run format:check

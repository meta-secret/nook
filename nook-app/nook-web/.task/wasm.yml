version: '3'

tasks:
  wasm:test:
    desc: Run nook-wasm wasm-bindgen tests in Node.
    deps:
      - setup:rust
    cmds:
      - task: docker:rust:task
        vars: { TASK: _wasm:test }

  wasm:build:
    desc: Build nook-wasm and nook-companion-wasm for the web app in Docker.
    deps:
      - setup:rust
    cmds:
      - task: docker:rust:task
        vars: { TASK: _wasm:build }

  wasm:build:fast:
    desc: Build WASM packages for the mounted web app without wasm-opt (local iteration).
    deps:
      - setup:rust:fast
    cmds:
      - task: docker:wasm:build:fast

  wasm:build:prod:
    desc: Build WASM packages for the web app with optimized production wasm.
    cmds:
      - task setup:rust WASM_BUILD_MODE=prod
      - task: docker:rust:task
        vars:
          TASK: _wasm:build
          WASM_BUILD_MODE: prod

  _wasm:build:
    desc: Build WASM packages for the web app when sources changed (skips if image-seeded pkgs are current).
    cmds:
      - task: _wasm:build:run

  _wasm:build:fast:
    desc: Alias for _wasm:build (default dev mode skips wasm-opt).
    cmds:
      - task: _wasm:build

  _wasm:build:run:
    internal: true
    cmds:
      - >-
        sh -c '
        current="$(cd "{{.APP_ROOT}}" && find "Cargo.toml" "Cargo.lock" \
          "nook-wasm/Cargo.toml" "nook-wasm/src" \
          "nook-companion-wasm/Cargo.toml" "nook-companion-wasm/src" \
          "nook-companion-core/Cargo.toml" "nook-companion-core/src" \
          "nook-app-common/Cargo.toml" "nook-app-common/src" "nook-app-common/locales" \
          "nook-core/Cargo.toml" "nook-core/src" \
          "nook-auth2/Cargo.toml" "nook-auth2/src" \
          "nook-replication/Cargo.toml" "nook-replication/src" \
          "nook-event-log/Cargo.toml" "nook-event-log/src" \
          \( -name "*.rs" -o -name "*.json" -o -name "Cargo.toml" -o -name "Cargo.lock" \) -print0 \
          | LC_ALL=C sort -z \
          | xargs -0 sha256sum \
          | sha256sum \
          | cut -d" " -f1)";
        case "${WASM_BUILD_MODE:-{{.WASM_BUILD_MODE}}}" in
          prod) wasm_opt_flag="" ; stamp_mode="optimized" ;;
          dev) wasm_opt_flag="--no-opt" ; stamp_mode="no-opt" ;;
          *) echo "Unsupported WASM_BUILD_MODE=${WASM_BUILD_MODE:-{{.WASM_BUILD_MODE}}} (expected dev or prod)" >&2; exit 1 ;;
        esac;
        vault_output="{{.WEB_SHARED_ROOT}}/src/vault-app/lib/nook-wasm/nook_wasm_bg.wasm";
        vault_stamp="{{.WEB_SHARED_ROOT}}/src/vault-app/lib/nook-wasm/.wasm-source-sha256";
        companion_output="{{.WEB_SHARED_ROOT}}/src/extension/nook-companion-wasm/nook_companion_wasm_bg.wasm";
        companion_stamp="{{.WEB_SHARED_ROOT}}/src/extension/nook-companion-wasm/.wasm-source-sha256";
        desired="$current $stamp_mode";
        vault_stored=""; companion_stored="";
        if [ -f "$vault_stamp" ]; then vault_stored="$(cat "$vault_stamp")"; fi;
        if [ -f "$companion_stamp" ]; then companion_stored="$(cat "$companion_stamp")"; fi;
        if [ ! -f "$vault_output" ] || [ ! -f "$companion_output" ] || [ "$desired" != "$vault_stored" ] || [ "$desired" != "$companion_stored" ]; then
          cd "{{.APP_ROOT}}" && wasm-pack build nook-wasm --target web --out-dir "../nook-web/nook-web-shared/src/vault-app/lib/nook-wasm" --out-name nook_wasm $wasm_opt_flag;
          cd "{{.APP_ROOT}}" && wasm-pack build nook-companion-wasm --target web --out-dir "../nook-web/nook-web-shared/src/extension/nook-companion-wasm" --out-name nook_companion_wasm $wasm_opt_flag;
          echo "$desired" > "$vault_stamp";
          echo "$desired" > "$companion_stamp";
        fi'

  _wasm:test:
    desc: Run release-profile nook-wasm wasm-bindgen tests in Node.
    cmds:
      - cd "{{.APP_ROOT}}" && wasm-pack test --node --release nook-wasm

  wasm:test:browser:
    desc: Run nook-wasm wasm-bindgen tests in headless Chrome (manual/debug).
    deps:
      - setup:rust:browser
    cmds:
      - task: docker:rust:browser:task
        vars: { TASK: _wasm:test:browser }

  _wasm:test:browser:
    desc: Run nook-wasm wasm-bindgen tests in headless Chrome (manual/debug).
    cmds:
      - cd "{{.APP_ROOT}}" && wasm-pack test --chrome --headless nook-wasm --features browser-wasm-tests

version: '3'

tasks:
  docker:build:
    desc: Alias for setup (build the linux/amd64 nook-web image).
    cmds:
      - task: setup

  docker:task:
    internal: true
    # The nook-web image already contains the workspace source. Hosted browser
    # jobs may add test-results-only mounts so failure diagnostics survive.
    env:
      VITE_BASE: '{{.VITE_BASE}}'
      VITE_SITE_URL: '{{.VITE_SITE_URL}}'
      VITE_PUBLIC_APP_URL: '{{.VITE_PUBLIC_APP_URL}}'
      NOOK_SIMPLE_VAULT_URL: '{{.NOOK_SIMPLE_VAULT_URL}}'
      NOOK_EXTENSION_CHANNEL: '{{.NOOK_EXTENSION_CHANNEL}}'
      NOOK_EXTENSION_VERSION: '{{.NOOK_EXTENSION_VERSION}}'
      NOOK_EXTENSION_COMMIT: '{{.NOOK_EXTENSION_COMMIT}}'
      NOOK_EXTENSION_SITE_URL: '{{.NOOK_EXTENSION_SITE_URL}}'
      VITE_SIMPLE_APP_URL: '{{.VITE_SIMPLE_APP_URL}}'
      VITE_SENTINEL_APP_URL: '{{.VITE_SENTINEL_APP_URL}}'
      VITE_VAULT_SYNC_INTERVAL_MS: '{{.VITE_VAULT_SYNC_INTERVAL_MS}}'
      WASM_BUILD_MODE: '{{.WASM_BUILD_MODE}}'
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.DOCKER_RUN_LIMITS}}
        --ipc=host
        -e WASM_BUILD_MODE="{{.WASM_BUILD_MODE}}"
        -e VITE_BASE="{{.VITE_BASE}}"
        -e VITE_SITE_URL="{{.VITE_SITE_URL}}"
        -e VITE_PUBLIC_APP_URL="{{.VITE_PUBLIC_APP_URL}}"
        -e NOOK_SIMPLE_VAULT_URL="{{.NOOK_SIMPLE_VAULT_URL}}"
        -e NOOK_EXTENSION_CHANNEL="{{.NOOK_EXTENSION_CHANNEL}}"
        -e NOOK_EXTENSION_VERSION="{{.NOOK_EXTENSION_VERSION}}"
        -e NOOK_EXTENSION_COMMIT="{{.NOOK_EXTENSION_COMMIT}}"
        -e NOOK_EXTENSION_SITE_URL="{{.NOOK_EXTENSION_SITE_URL}}"
        -e VITE_SIMPLE_APP_URL="{{.VITE_SIMPLE_APP_URL}}"
        -e VITE_SENTINEL_APP_URL="{{.VITE_SENTINEL_APP_URL}}"
        -e VITE_VAULT_SYNC_INTERVAL_MS="{{.VITE_VAULT_SYNC_INTERVAL_MS}}"
        -e NOOK_GITHUB_PAT
        -e CI=1
        -e NOOK_GITHUB_E2E_REPO
        -e NOOK_GITHUB_POLL_MS
        -e NOOK_GITHUB_SYNC_TIMEOUT_MS
        -e NOOK_GITHUB_CONNECT_TIMEOUT_MS
        -e CLOUDFLARE_API_TOKEN
        -e CLOUDFLARE_ACCOUNT_ID
        -e CF_PAGES_BRANCH
        -e CF_PAGES_DIST_DIR
        -e CF_PAGES_PROJECT_NAME
        -e CF_PAGES_PRODUCTION_BRANCH
        -e GITHUB_TOKEN
        -e GITHUB_REPOSITORY
        -e PR_NUMBER
        -e PREVIEW_URL
        -w /meta-secret/nook
        {{.DOCKER_IMAGE}}
        task {{.TASK}}

  docker:rust:task:
    internal: true
    desc: Run a Task target in the on-demand source-sealed Rust/WASM image.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        --ipc=host
        -e WASM_BUILD_MODE="{{.WASM_BUILD_MODE}}"
        -e CI=1
        -w /meta-secret/nook
        {{.DOCKER_RUST_IMAGE}}
        task {{.TASK}}

  docker:rust:browser:task:
    internal: true
    desc: Run a Task target in the on-demand Rust/WASM image with Chromium.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        --ipc=host
        -e WASM_BUILD_MODE="{{.WASM_BUILD_MODE}}"
        -e CI=1
        -w /meta-secret/nook
        {{.DOCKER_RUST_BROWSER_IMAGE}}
        task {{.TASK}}

  docker:wasm:build:fast:
    internal: true
    # Mounted fast path uses a manifest-keyed image whose Cargo target lives outside the bind mount.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        -e REPO_ROOT=/meta-secret/nook
        -e GIT_COMMIT_ID="{{.GIT_COMMIT_ID}}"
        -e CI_AGENT_IMAGE=nook-ci-agent:local
        -e WASM_BUILD_MODE=dev
        -e CARGO_TARGET_DIR=/opt/nook/cargo-target
        -v "{{.REPO_ROOT}}:/meta-secret/nook"
        -w /meta-secret/nook
        {{.DOCKER_RUST_FAST_IMAGE}}
        task _wasm:build:fast

  docker:e2e:run:
    desc: Run Playwright in Docker — Vite dev server stays on 127.0.0.1:5173 inside the container (no -p publish).
    internal: true
    # No bind mount: the nook-web image already contains the workspace source (nook-app/nook-web/nook-web-app/Dockerfile).
    vars:
      E2E_ARTIFACT_DIR: '{{default "" .E2E_ARTIFACT_DIR}}'
    env:
      VITE_BASE: '{{.VITE_BASE}}'
      NOOK_SIMPLE_VAULT_URL: '{{.NOOK_SIMPLE_VAULT_URL}}'
      NOOK_EXTENSION_CHANNEL: '{{.NOOK_EXTENSION_CHANNEL}}'
      NOOK_EXTENSION_VERSION: '{{.NOOK_EXTENSION_VERSION}}'
      NOOK_EXTENSION_COMMIT: '{{.NOOK_EXTENSION_COMMIT}}'
      NOOK_EXTENSION_SITE_URL: '{{.NOOK_EXTENSION_SITE_URL}}'
      VITE_SITE_URL: '{{.VITE_SITE_URL}}'
      VITE_SIMPLE_APP_URL: '{{.VITE_SIMPLE_APP_URL}}'
      VITE_SENTINEL_APP_URL: '{{.VITE_SENTINEL_APP_URL}}'
      VITE_VAULT_SYNC_INTERVAL_MS: '{{.VITE_VAULT_SYNC_INTERVAL_MS}}'
      E2E_SPEC: '{{.E2E_SPEC}}'
      CHANNEL: '{{default "" .CHANNEL}}'
      PR: '{{default "" .PR}}'
      WASM_BUILD_MODE: '{{.WASM_BUILD_MODE}}'
    cmds:
      - |
        set -eu
        set --
        if [ -n "{{.E2E_ARTIFACT_DIR}}" ]; then
          artifact_root="{{.E2E_ARTIFACT_DIR}}"
          case "$artifact_root" in
            /*) ;;
            *) artifact_root="{{.REPO_ROOT}}/$artifact_root" ;;
          esac
          mkdir -p "$artifact_root/web" "$artifact_root/extension"
          set -- \
            -v "$artifact_root/web:/meta-secret/nook/nook-app/nook-web/nook-web-app/test-results" \
            -v "$artifact_root/extension:/meta-secret/nook/nook-app/nook-web/nook-web-extension/test-results"
        fi
        {{.DOCKER}} run --rm \
        --platform linux/amd64 \
        {{.DOCKER_RUN_LIMITS}} \
        --ipc=host \
        "$@" \
        -e WASM_BUILD_MODE="{{.WASM_BUILD_MODE}}" \
        -e VITE_BASE="{{.VITE_BASE}}" \
        -e NOOK_SIMPLE_VAULT_URL="{{.NOOK_SIMPLE_VAULT_URL}}" \
        -e NOOK_EXTENSION_CHANNEL="{{.NOOK_EXTENSION_CHANNEL}}" \
        -e NOOK_EXTENSION_VERSION="{{.NOOK_EXTENSION_VERSION}}" \
        -e NOOK_EXTENSION_COMMIT="{{.NOOK_EXTENSION_COMMIT}}" \
        -e NOOK_EXTENSION_SITE_URL="{{.NOOK_EXTENSION_SITE_URL}}" \
        -e VITE_SITE_URL="{{.VITE_SITE_URL}}" \
        -e VITE_SIMPLE_APP_URL="{{.VITE_SIMPLE_APP_URL}}" \
        -e VITE_SENTINEL_APP_URL="{{.VITE_SENTINEL_APP_URL}}" \
        -e VITE_VAULT_SYNC_INTERVAL_MS="{{.VITE_VAULT_SYNC_INTERVAL_MS}}" \
        -e NOOK_GITHUB_PAT \
        -e CI=1 \
        -e NOOK_GITHUB_E2E_REPO \
        -e NOOK_GITHUB_POLL_MS \
        -e NOOK_GITHUB_SYNC_TIMEOUT_MS \
        -e NOOK_GITHUB_CONNECT_TIMEOUT_MS \
        -e NOOK_E2E_SKIP_GITHUB_CLEANUP \
        -e NOOK_E2E_SYNC_PROVIDER \
        -e NOOK_GOOGLE_E2E_ACCESS_TOKEN \
        -e E2E_SPEC \
        -e CHANNEL \
        -e PR \
        -w /meta-secret/nook \
        {{.DOCKER_E2E_IMAGE}} \
        task {{.TASK}}

  docker:ui-demo:run:
    desc: Record Playwright demo videos into a host-mounted artifact directory.
    internal: true
    vars:
      UI_DEMO_OUTPUT_DIR: '{{default (printf "%s/ui-demo-results" .REPO_ROOT) .UI_DEMO_OUTPUT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.UI_DEMO_OUTPUT_DIR}}";
        case "$out_dir" in /*) ;; *) out_dir="{{.REPO_ROOT}}/$out_dir" ;; esac;
        test "$out_dir" != "/";
        mkdir -p "$out_dir";
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.DOCKER_RUN_LIMITS}}
        --ipc=host
        -e CI=1
        -e PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
        -e NOOK_UI_DEMO_OUTPUT_DIR=/ui-demo-results
        -e UI_DEMO_SPECS="{{.UI_DEMO_SPECS}}"
        -v "$out_dir:/ui-demo-results"
        -w /meta-secret/nook
        {{.DOCKER_E2E_IMAGE}}
        task _web:test:ui-demo;
        find "$out_dir" -type f -name "*.webm" -print -quit | grep -q . || {
          echo "task ui:demo: no Playwright video was produced" >&2;
          exit 1;
        }'

  docker:extract:dist:
    desc: Copy the landing, Simple Vault, and Sentinel Vault web artifacts to the host.
    cmds:
      - >-
        sh -c 'rm -rf "{{.WEB_ROOT}}/dist" "{{.WEB_GROUP_ROOT}}/nook-vault-simple/dist" "{{.WEB_GROUP_ROOT}}/nook-vault-sentinel/dist";
        cid="$({{.DOCKER}} create --platform linux/amd64 {{.DOCKER_IMAGE}})";
        trap "{{.DOCKER}} rm -f \"$cid\" >/dev/null 2>&1 || true" EXIT;
        {{.DOCKER}} cp "$cid:/meta-secret/nook/nook-app/nook-web/nook-web-app/dist" "{{.WEB_ROOT}}/dist";
        {{.DOCKER}} cp "$cid:/meta-secret/nook/nook-app/nook-web/nook-vault-simple/dist" "{{.WEB_GROUP_ROOT}}/nook-vault-simple/dist";
        {{.DOCKER}} cp "$cid:/meta-secret/nook/nook-app/nook-web/nook-vault-sentinel/dist" "{{.WEB_GROUP_ROOT}}/nook-vault-sentinel/dist"'

  docker:extract:extension:
    desc: Copy the nook-web image's built nook-app/nook-web/nook-web-extension/dist to the host (for manual browser loading).
    cmds:
      - >-
        sh -c 'rm -rf "{{.EXTENSION_ROOT}}/dist";
        cid="$({{.DOCKER}} create --platform linux/amd64 {{.DOCKER_IMAGE}})";
        trap "{{.DOCKER}} rm -f \"$cid\" >/dev/null 2>&1 || true" EXIT;
        {{.DOCKER}} cp "$cid:/meta-secret/nook/nook-app/nook-web/nook-web-extension/dist" "{{.EXTENSION_ROOT}}/dist"'

  docker:extract:coverage:
    desc: Copy portable Rust crate coverage artifacts from the sealed Docker image to the host.
    vars:
      COVERAGE_OUT_DIR: '{{default (printf "%s/coverage/nook-core" .REPO_ROOT) .COVERAGE_OUT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.COVERAGE_OUT_DIR}}";
        case "$out_dir" in
          /*) ;;
          *) out_dir="{{.REPO_ROOT}}/$out_dir" ;;
        esac;
        rm -rf "$out_dir";
        mkdir -p "$out_dir";
        cid="$({{.DOCKER}} create --platform linux/amd64 {{.DOCKER_IMAGE}})";
        cleanup() { {{.DOCKER}} rm -f "$cid" >/dev/null 2>&1 || true; };
        trap cleanup EXIT;
        {{.DOCKER}} cp "$cid:/opt/nook/coverage/nook-core/." "$out_dir/"'

  docker:coverage:export:
    desc: Run coverage-gated portable Rust unit tests and export their artifacts (no app image export).
    deps:
      - sccache:ensure
    vars:
      COVERAGE_OUT_DIR: '{{default (printf "%s/coverage/nook-core" .REPO_ROOT) .COVERAGE_OUT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.COVERAGE_OUT_DIR}}";
        case "$out_dir" in
          /*) ;;
          *) out_dir="{{.REPO_ROOT}}/$out_dir" ;;
        esac;
        rm -rf "$out_dir";
        mkdir -p "$out_dir";
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --allow="fs.write=$out_dir" --set "coverage-export.output=type=local,dest=$out_dir" coverage-export'

  docker:ci:rust:export:
    desc: Run native Rust formatting/coverage on one CI runner and export only coverage artifacts.
    deps: [sccache:ensure]
    vars:
      CI_ARTIFACT_DIR: '{{default (printf "%s/ci-artifacts/rust" .REPO_ROOT) .CI_ARTIFACT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.CI_ARTIFACT_DIR}}";
        case "$out_dir" in /*) ;; *) out_dir="{{.REPO_ROOT}}/$out_dir" ;; esac;
        rm -rf "$out_dir"; mkdir -p "$out_dir";
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --allow="fs.write=$out_dir" --set "coverage-export.output=type=local,dest=$out_dir" --set "rust-format-check.output=type=cacheonly" --set "builder-core-deps.output=type=cacheonly" --set "rust-base.output=type=cacheonly" ci-rust builder-core-deps rust-base'

  docker:ci:wasm:export:
    desc: Run WASM clippy/build on a separate CI runner and export only the generated package.
    deps: [sccache:ensure]
    vars:
      CI_ARTIFACT_DIR: '{{default (printf "%s/ci-artifacts/wasm" .REPO_ROOT) .CI_ARTIFACT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        out_dir="{{.CI_ARTIFACT_DIR}}";
        case "$out_dir" in /*) ;; *) out_dir="{{.REPO_ROOT}}/$out_dir" ;; esac;
        rm -rf "$out_dir"; mkdir -p "$out_dir";
        {{.DOCKER}} buildx bake {{.NOOK_BAKE_FILES}} --allow="fs.write=$out_dir" --set "wasm-export.output=type=local,dest=$out_dir" --set "builder-wasm-deps.output=type=cacheonly" wasm-export builder-wasm-deps'

  docker:ci:wasm:node-test:
    desc: Run WASM Node tests after the exact generated package is available to parallel consumers.
    deps: [sccache:ensure]
    cmds:
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "builder-wasm.output=type=cacheonly"
        builder-wasm

  docker:ci:cache:publish:rust-base:
    desc: Publish only the shared rust-base toolchain scope from this job's builder.
    cmds:
      - |
        set -euo pipefail
        if [ -n "${GHA_CACHE_SCOPE_SUFFIX:-}" ]; then
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "*.output=type=cacheonly" \
            rust-base
        else
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "*.output=type=cacheonly" \
            --set "rust-base.cache-from=" \
            rust-base
        fi

  docker:ci:cache:publish:native:
    desc: Export the already-verified native dependency/source graph from this job's builder.
    cmds:
      # Stage rust-base alone, then deps/debug. Avoids one Bake rewriting parents
      # while cooking chef leaves.
      # Main clears cache-from so export uses fully local layers. PR/Remote keep
      # cache-from so remote hits re-export without cold chef cooks.
      - task: docker:ci:cache:publish:rust-base
      - |
        set -euo pipefail
        if [ -n "${GHA_CACHE_SCOPE_SUFFIX:-}" ]; then
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "*.output=type=cacheonly" \
            --set "rust-base.cache-to=" \
            builder-core-deps builder-debug
        else
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "*.output=type=cacheonly" \
            --set "rust-base.cache-to=" \
            --set "rust-base.cache-from=" \
            --set "builder-core-deps.cache-from=" \
            --set "builder-debug.cache-from=" \
            builder-core-deps builder-debug
        fi
      # Preflight has its own Bake files and Zot scope; export it with product native.
      # Clear rust-base.cache-to: native already published rust-base, and a second
      # writer during the linked contexts bake can thin-export that parent scope.
      - >-
        {{.DOCKER}} buildx bake
        --allow=fs.read={{.REPO_ROOT}}
        {{.SCCACHE_S3_BUILD_SECRETS}}
        -f {{.REPO_ROOT}}/nook-app/docker-bake.hcl
        -f {{.REPO_ROOT}}/nook-app/docker/rust.docker-bake.hcl
        -f {{.REPO_ROOT}}/preflight/docker-bake.hcl
        --set '*.context={{.REPO_ROOT}}'
        --set '*.args.SCCACHE_S3_MODE={{.SCCACHE_S3_MODE}}'
        --set '*.args.SCCACHE_ENDPOINT={{.SCCACHE_ENDPOINT}}'
        --set '*.args.SCCACHE_BUCKET={{.SCCACHE_BUCKET}}'
        --set "*.output=type=cacheonly"
        --set "rust-base.cache-to="
        preflight-test

  docker:ci:cache:publish:wasm:
    desc: Export verified WASM scopes from local layers without reimporting a thin hosted index.
    cmds:
      # Stage rust-base, then wasm-deps, then source export. Keeps each Zot scope
      # on its own Bake so one miss cannot cold-rebuild the whole chain.
      # PR/Remote: keep cache-from (wasm scopes only) so remote CACHED verifies
      # re-export without cold apt/chef. Clearing cache-from after a fully remote
      # hit rebuilds rust-base from scratch.
      # Main: clear cache-from for a fat trusted fingerprint export, then verify.
      - task: docker:ci:cache:publish:rust-base
      - |
        set -euo pipefail
        if [ -n "${GHA_CACHE_SCOPE_SUFFIX:-}" ]; then
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "*.output=type=cacheonly" \
            --set "rust-base.cache-to=" \
            builder-wasm-deps
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "*.output=type=cacheonly" \
            --set "rust-base.cache-to=" \
            --set "builder-wasm-deps.cache-to=" \
            wasm-export
        else
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "*.output=type=cacheonly" \
            --set "rust-base.cache-to=" \
            --set "rust-base.cache-from=" \
            --set "builder-wasm-deps.cache-from=" \
            --set "builder-wasm-deps.cache-to=type=registry,ref=${NOOK_REGISTRY_CACHE_HOST:-registry.dev.nokey.sh}/nook/buildcache/${GHA_RUST_WASM_DEPS_SCOPE:?missing GHA_RUST_WASM_DEPS_SCOPE}:buildcache,mode=max,timeout=10m" \
            builder-wasm-deps
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "*.output=type=cacheonly" \
            --set "rust-base.cache-to=" \
            --set "rust-base.cache-from=" \
            --set "builder-wasm-deps.cache-to=" \
            --set "wasm-export.cache-from=" \
            wasm-export
          bash "{{.REPO_ROOT}}/.github/scripts/verify-wasm-gha-cache.sh"
        fi

  docker:ci:cache:publish:web:
    desc: Export the already-verified web dependency graph from this job's builder.
    cmds:
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "*.output=type=cacheonly"
        --set "web-deps.cache-from="
        web-deps

  docker:ci:web:build:
    desc: Build the sealed web image from the same-runner CI WASM artifact.
    vars:
      CI_ARTIFACT_DIR: '{{default (printf "%s/ci-artifacts/joined" .REPO_ROOT) .CI_ARTIFACT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        artifacts="{{.CI_ARTIFACT_DIR}}";
        case "$artifacts" in /*) ;; *) artifacts="{{.REPO_ROOT}}/$artifacts" ;; esac;
        test -s "$artifacts/nook-wasm/nook_wasm.js";
        test -s "$artifacts/nook-wasm/nook-companion-wasm/nook_companion_wasm.js";
        mkdir -p "$artifacts/coverage/nook-core";
        : > "$artifacts/coverage/nook-core/.web-only";
        WEB_ARTIFACTS_CONTEXT="$artifacts" bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh" "docker:ci:web:build" {{.DOCKER}} buildx bake --allow="fs.read=$artifacts" {{.NOOK_BAKE_FILES}} --set "web-deps.output=type=cacheonly" nook-web-ci web-deps'

  docker:ci:web:e2e:build:
    desc: Build the Chromium web image from the same-runner CI WASM artifact.
    vars:
      CI_ARTIFACT_DIR: '{{default (printf "%s/ci-artifacts/joined" .REPO_ROOT) .CI_ARTIFACT_DIR}}'
    cmds:
      - >-
        bash -c 'set -euo pipefail;
        artifacts="{{.CI_ARTIFACT_DIR}}";
        case "$artifacts" in /*) ;; *) artifacts="{{.REPO_ROOT}}/$artifacts" ;; esac;
        test -s "$artifacts/nook-wasm/nook_wasm.js";
        test -s "$artifacts/nook-wasm/nook-companion-wasm/nook_companion_wasm.js";
        mkdir -p "$artifacts/coverage/nook-core";
        : > "$artifacts/coverage/nook-core/.web-only";
        WEB_ARTIFACTS_CONTEXT="$artifacts" bash "{{.REPO_ROOT}}/.github/scripts/bake-with-frontend-flake-retry.sh" "docker:ci:web:e2e:build" {{.DOCKER}} buildx bake --allow="fs.read=$artifacts" {{.NOOK_BAKE_FILES}} nook-web-e2e'

  # Precise Bake stages. Warm parents alone before leaves so a leaf miss cannot
  # cold-rebuild apt/nightly. Composites below call these in order.
  # Ecosystem/preflight callers never write rust-base (clear cache-to).
  # After a parent warm, clear that parent's cache-from on the next Bake: the
  # context target:PARENT still imports PARENT's Zot scope, and that shorter
  # index steals mode=max leaf layers (policy-tools/nightly RUNs go cold).

  docker:rust-base:
    desc: Bake only rust-base (apt/mold/sccache). Read-only for Zot; never publishes.
    deps: [sccache:ensure]
    cmds:
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-base.output=type=cacheonly"
        --set "rust-base.cache-to="
        rust-base

  docker:ecosystem:policy-tools:
    desc: Bake only rust-ecosystem-policy-tools (pinned deny/audit CLIs).
    deps: [sccache:ensure]
    cmds:
      - task: docker:rust-base
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-ecosystem-policy-tools.cache-to="
        --set "rust-base.cache-to="
        --set "rust-base.cache-from="
        rust-ecosystem-policy-tools
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ]; then
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "rust-base.cache-to=" \
            --set "rust-base.cache-from=" \
            rust-ecosystem-policy-tools
        fi

  docker:ecosystem:nightly:verify:
    desc: Warm rust-ecosystem-nightly without writing its Zot scope.
    deps: [sccache:ensure]
    cmds:
      - task: docker:rust-base
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-ecosystem-nightly.cache-to="
        --set "rust-base.cache-to="
        --set "rust-base.cache-from="
        rust-ecosystem-nightly

  docker:ecosystem:nightly:
    desc: Bake only rust-ecosystem-nightly. Sole shared nightly Zot writer when writes are enabled.
    deps: [sccache:ensure]
    cmds:
      - task: docker:ecosystem:nightly:verify
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ]; then
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "rust-base.cache-to=" \
            --set "rust-base.cache-from=" \
            rust-ecosystem-nightly
        fi

  docker:ecosystem:dependency-policy:
    desc: Bake cargo-deny and cargo-audit on the sealed ecosystem policy image.
    deps: [sccache:ensure]
    cmds:
      # tools → leaf. Each stage verifies with cache-to off, then publishes with
      # cache-from kept so remote hits re-export without cold tool installs.
      - task: docker:ecosystem:policy-tools
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-dependency-policy.cache-to="
        --set "rust-base.cache-to="
        --set "rust-base.cache-from="
        rust-dependency-policy
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ]; then
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "rust-base.cache-to=" \
            --set "rust-base.cache-from=" \
            rust-dependency-policy
        fi

  docker:ecosystem:deterministic:
    desc: Bake Proptest, Insta, and Loom on the sealed Rust dependency graph.
    deps: [sccache:ensure]
    cmds:
      - task: docker:rust-base
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-ecosystem-deterministic.cache-to="
        --set "rust-base.cache-to="
        --set "rust-base.cache-from="
        rust-ecosystem-deterministic
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ]; then
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "rust-base.cache-to=" \
            --set "rust-base.cache-from=" \
            rust-ecosystem-deterministic
        fi

  docker:ecosystem:fuzz:
    desc: Bake the cargo-fuzz smoke target with a bounded runtime.
    deps: [sccache:ensure]
    vars:
      FUZZ_SECONDS: '{{default "20" .FUZZ_SECONDS}}'
    cmds:
      # Warm nightly read-only first. Fuzz never rewrites nightly/rust-base.
      # Clear parent cache-from: context target:nightly would re-import the
      # shorter nightly Zot index and orphan the fuzz leaf RUN.
      - task: docker:ecosystem:nightly:verify
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-fuzz-smoke.args.FUZZ_SECONDS={{.FUZZ_SECONDS}}"
        --set "rust-fuzz-smoke.cache-to="
        --set "rust-ecosystem-nightly.cache-to="
        --set "rust-ecosystem-nightly.cache-from="
        --set "rust-base.cache-to="
        --set "rust-base.cache-from="
        rust-fuzz-smoke
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ]; then
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "rust-fuzz-smoke.args.FUZZ_SECONDS={{.FUZZ_SECONDS}}" \
            --set "rust-ecosystem-nightly.cache-to=" \
            --set "rust-ecosystem-nightly.cache-from=" \
            --set "rust-base.cache-to=" \
            --set "rust-base.cache-from=" \
            rust-fuzz-smoke
        fi

  docker:ecosystem:dylint:
    desc: Bake repository Dylint lints on the sealed nightly ecosystem image.
    deps: [sccache:ensure]
    cmds:
      # Warm/publish nightly first (sole nightly writer), then the dylint leaf.
      - task: docker:ecosystem:nightly
      - >-
        {{.DOCKER}} buildx bake
        {{.NOOK_BAKE_FILES}}
        --set "rust-dylint.cache-to="
        --set "rust-ecosystem-nightly.cache-to="
        --set "rust-ecosystem-nightly.cache-from="
        --set "rust-base.cache-to="
        --set "rust-base.cache-from="
        rust-dylint
      - |
        if [ -n "${GHA_CACHE_WRITE_ENABLED:-}" ]; then
          {{.DOCKER}} buildx bake \
            {{.NOOK_BAKE_FILES}} \
            --set "rust-ecosystem-nightly.cache-to=" \
            --set "rust-ecosystem-nightly.cache-from=" \
            --set "rust-base.cache-to=" \
            --set "rust-base.cache-from=" \
            rust-dylint
        fi

  docker:web:dev:
    internal: true
    # Mounted for Vite hot-reload. The on-demand browser/Rust image contains both toolchains;
    # node_modules is an anonymous volume and Bun installs current dependencies before startup.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        -e REPO_ROOT=/meta-secret/nook
        -e GIT_COMMIT_ID="{{.GIT_COMMIT_ID}}"
        -e WASM_BUILD_MODE="{{.WASM_BUILD_MODE}}"
        -e VITE_BASE="{{.VITE_BASE}}"
        -e NOOK_LOCAL_HTTPS=1
        -e NOOK_LOCAL_HTTPS_CERT_PATH={{.LOCAL_HTTPS_CONTAINER_DIR}}/localhost.pem
        -e NOOK_LOCAL_HTTPS_KEY_PATH={{.LOCAL_HTTPS_CONTAINER_DIR}}/localhost-key.pem
        -p "{{.WEB_DEV_PORT}}:5173"
        -v "{{.REPO_ROOT}}:/meta-secret/nook"
        -v "{{.LOCAL_HTTPS_DIR}}:{{.LOCAL_HTTPS_CONTAINER_DIR}}:ro"
        -v /meta-secret/nook/nook-app/nook-web/nook-web-app/node_modules
        -w /meta-secret/nook
        {{.DOCKER_RUST_BROWSER_IMAGE}}
        sh -c "(cd nook-app/nook-web/nook-web-app && bun install) && task _web:dev"

  docker:web:dev:fast:
    internal: true
    # Fast mounted dev path: same as docker:web:dev, but skips wasm-opt during the initial wasm build.
    cmds:
      - >-
        {{.DOCKER}} run --rm
        --platform linux/amd64
        {{.SCCACHE_S3_CREDENTIAL_MOUNTS}}
        {{.DOCKER_RUN_LIMITS}}
        -e REPO_ROOT=/meta-secret/nook
        -e GIT_COMMIT_ID="{{.GIT_COMMIT_ID}}"
        -e WASM_BUILD_MODE=dev
        -e VITE_BASE="{{.VITE_BASE}}"
        -e NOOK_LOCAL_HTTPS=1
        -e NOOK_LOCAL_HTTPS_CERT_PATH={{.LOCAL_HTTPS_CONTAINER_DIR}}/localhost.pem
        -e NOOK_LOCAL_HTTPS_KEY_PATH={{.LOCAL_HTTPS_CONTAINER_DIR}}/localhost-key.pem
        -p "{{.WEB_DEV_PORT}}:5173"
        -v "{{.REPO_ROOT}}:/meta-secret/nook"
        -v "{{.LOCAL_HTTPS_DIR}}:{{.LOCAL_HTTPS_CONTAINER_DIR}}:ro"
        -v /meta-secret/nook/nook-app/nook-web/nook-web-app/node_modules
        -w /meta-secret/nook
        {{.DOCKER_RUST_BROWSER_IMAGE}}
        sh -c "(cd nook-app/nook-web/nook-web-app && bun install) && task _web:dev:fast"

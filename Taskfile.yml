version: "3"

vars:
  DOCKER_NOFILE_LIMIT: '{{default "1048576" .DOCKER_NOFILE_LIMIT}}'

# Local Bake restores/publishes git-commit-scoped Zot caches when remote registry
# credentials exist under ~/.nook/cache. CI leaves workflow-owned GHA_CACHE_*.
# Opt out: NOOK_REGISTRY_CACHE=0. Local publish requires a clean worktree.
env:
  NOOK_REGISTRY_CACHE_HOST:
    sh: >-
      if [ -n "${GITHUB_ACTIONS:-}" ]; then printf '%s' "${NOOK_REGISTRY_CACHE_HOST:-registry.dev.nokey.sh}";
      elif [ -r "${HOME}/.nook/cache/registry-host" ]; then tr -d '[:space:]' <"${HOME}/.nook/cache/registry-host";
      else printf 'registry.dev.nokey.sh'; fi
  GHA_CACHE_ENABLED:
    sh: >-
      if [ -n "${GITHUB_ACTIONS:-}" ]; then printf '%s' "${GHA_CACHE_ENABLED:-}";
      elif [ "${NOOK_REGISTRY_CACHE:-1}" != "0" ] && [ -r "${HOME}/.nook/cache/registry-remote-password" ]; then printf '1'; fi
  GHA_CACHE_WRITE_ENABLED:
    sh: >-
      if [ -n "${GITHUB_ACTIONS:-}" ]; then printf '%s' "${GHA_CACHE_WRITE_ENABLED:-}"; fi
  GHA_CACHE_SCOPE_SUFFIX:
    sh: >-
      if [ -n "${GITHUB_ACTIONS:-}" ]; then printf '%s' "${GHA_CACHE_SCOPE_SUFFIX:-}";
      elif [ "${NOOK_REGISTRY_CACHE:-1}" != "0" ] && [ -r "${HOME}/.nook/cache/registry-remote-password" ]; then
        bash "{{.ROOT_DIR}}/.github/scripts/git-cache-scope.sh";
      fi
  NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:
    sh: >-
      if [ -n "${GITHUB_ACTIONS:-}" ]; then printf '%s' "${NOOK_REGISTRY_CACHE_LOCAL_PUBLISH:-}";
      elif [ "${NOOK_REGISTRY_CACHE:-1}" != "0" ] && [ -r "${HOME}/.nook/cache/registry-remote-password" ] && [ -z "$(git status --porcelain)" ]; then printf '1'; fi

includes:
  build:
    taskfile: .task/build.yml
  dev:
    taskfile: .task/dev.yml
  static-checks:
    taskfile: .task/static-checks.yml
    flatten: true
  preflight:
    taskfile: preflight/Taskfile.yml
    flatten: true
  app:
    taskfile: nook-app/Taskfile.yml
    flatten: true
  agentic-ai:
    taskfile: .task/agentic-ai.yml
    flatten: true
  ai-debug:
    taskfile: .task/ai-debug.yml
    flatten: true
  remote-execution:
    taskfile: .task/remote-execution.yml
    flatten: true
  ci-workflows:
    taskfile: .task/ci-workflows.yml
    flatten: true
  infra:
    taskfile: infra/Taskfile.yml
    dir: .

tasks:
  tooling:install:
    desc: Install pinned repository script runtime dependencies.
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun install --frozen-lockfile --ignore-scripts

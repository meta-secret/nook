# Cursor SDK agent: claim an explicitly ready Markdown issue from
# meta-secret/nook-workbench (or accept a manual prompt), implement it, and open
# a Nook PR. The bounded worker publishes its interpreted task plan before
# implementation, records its worklog afterward, and exits; a continuing
# task-owning GitHub collaborator is assigned and notified to own validation
# and merge.

name: Agent implement

on:
  workflow_dispatch:
    inputs:
      issue_path:
        description: Required unless prompt is supplied (issues/<feature>/<issue>.md)
        required: false
        type: string
      prompt:
        description: Required unless issue_path is supplied
        required: false
        type: string
      continuing_owner:
        description: Required GitHub login for the prompt-backed continuing owner
        required: false
        type: string
      major_change_authorized:
        description: User explicitly selected and requested this major architectural solution
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  agent-implement:
    name: Implement and open PR
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 360
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      CI_AGENT_PROMPT_FILE: .github/prompts/agent-implement.md
      # Leave one hour of the job budget for setup plus result publication so
      # a timed-out worker cannot strand an issue in progress.
      CI_AGENT_TIMEOUT_MS: "18000000"
      WORKBENCH_REPOSITORY: meta-secret/nook-workbench
      WORKBENCH_PLAN_FILE: .nook-workbench-plan.md
      WORKBENCH_SUMMARY_FILE: .nook-workbench-worklog.md
    steps:
      - name: Validate dispatch inputs
        env:
          CONTINUING_OWNER: ${{ inputs.continuing_owner }}
          ISSUE_PATH: ${{ inputs.issue_path }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          if { [ -z "$PROMPT" ] && [ -z "$ISSUE_PATH" ]; } || { [ -n "$PROMPT" ] && [ -n "$ISSUE_PATH" ]; }; then
            echo "::error::Supply exactly one of issue_path or prompt."
            exit 1
          fi
          if [ -n "$PROMPT" ] && [ -z "$CONTINUING_OWNER" ]; then
            echo "::error::A prompt-backed run requires continuing_owner."
            exit 1
          fi
          if [ -n "$CONTINUING_OWNER" ] && ! printf '%s' "$CONTINUING_OWNER" | grep -Eq '^[a-z0-9][a-z0-9._-]*$'; then
            echo "::error::continuing_owner must be a lowercase GitHub login."
            exit 1
          fi

      - name: Checkout trusted workflow tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          token: ${{ secrets.NOOK_GITHUB_PAT }}

      - name: Claim ready Workbench issue
        id: workbench
        if: inputs.prompt == ''
        uses: actions/github-script@v9
        env:
          REQUESTED_PATH: ${{ inputs.issue_path }}
          WORKBENCH_REPOSITORY: ${{ env.WORKBENCH_REPOSITORY }}
        with:
          github-token: ${{ secrets.NOOK_GITHUB_PAT }}
          retries: 3
          script: |
            const [owner, repo] = process.env.WORKBENCH_REPOSITORY.split('/')
            const requestedPath = process.env.REQUESTED_PATH.trim()
            const decode = (data) => Buffer.from(data.content, 'base64').toString('utf8')
            const value = (body, key) => {
              const match = body.match(new RegExp(`^${key}:\\s*(.+)$`, 'm'))
              if (!match) return ''
              const raw = match[1].trim()
              try { return JSON.parse(raw) } catch { return raw }
            }

            if (!/^issues\/[a-z0-9-]+\/[a-z0-9-]+\.md$/.test(requestedPath)) {
              core.setFailed(`Invalid Workbench issue path: ${requestedPath}`)
              return
            }

            const path = requestedPath
            const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' })
            if (Array.isArray(data) || data.type !== 'file') {
              core.setFailed(`Workbench issue is not a file: ${path}`)
              return
            }
            const body = decode(data)
            if (value(body, 'status') !== 'ready' || value(body, 'automation') !== 'agent') {
              core.setFailed(`${path} must have status: ready and automation: agent`)
              return
            }
            const frontmatter = body.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/)?.[1] || ''
            const gizmoIdRows = [...frontmatter.matchAll(/^gizmo_id:\s*(.*)$/gm)]
            if (gizmoIdRows.length > 1) {
              core.setFailed(`${path} has duplicate canonical gizmo_id fields`)
              return
            }
            const rawGizmoId = gizmoIdRows[0]?.[1].trim() || ''
            const assignedGizmoId = rawGizmoId === 'null' ? '' : rawGizmoId
            if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(assignedGizmoId)) {
              core.setFailed(`${path} must have a valid canonical gizmo_id before PR publication`)
              return
            }
            const issueTitle = String(value(body, 'title')).trim()
            if (!/^[\p{L}\p{N}][\p{L}\p{N} .,:()'’\/&+_-]{2,119}$/u.test(issueTitle)) {
              core.setFailed(`${path} must have a trusted capability-oriented title before PR publication`)
              return
            }
            if (
              /^stack_branch:/m.test(frontmatter) ||
              /^stack_predecessor_branch:/m.test(frontmatter)
            ) {
              core.setFailed(`${path} uses unsupported stacked-PR metadata`)
              return
            }
            const now = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z')
            const continuingOwner = String(value(body, 'owner')).trim()
            if (!/^[a-z0-9][a-z0-9._-]*$/.test(continuingOwner) || continuingOwner === 'unassigned') {
              core.setFailed(`${path} must name a continuing GitHub owner before automation can claim it`)
              return
            }
            const response = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: continuingOwner,
            })
            if (!['admin', 'maintain', 'write'].includes(response.data.permission)) {
              core.setFailed(`${path} owner ${continuingOwner} must have write access to Nook`)
              return
            }
            const claimed = body
              .replace(/^status:\s*ready$/m, 'status: in_progress')
              .replace(/^updated_at:\s*.+$/m, `updated_at: ${now}`)
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              sha: data.sha,
              message: `claim: ${path}`,
              content: Buffer.from(claimed).toString('base64'),
            })

            core.setOutput('found', 'true')
            core.setOutput('path', path)
            core.setOutput('title', issueTitle)
            core.setOutput('body', body)
            core.setOutput('url', `https://github.com/${owner}/${repo}/blob/main/${path}`)
            core.setOutput('slug', path.replace(/^issues\//, '').replace(/\.md$/, '').replaceAll('/', '-'))
            core.setOutput('continuing_owner', continuingOwner)
            core.setOutput('gizmo_id', assignedGizmoId)

      - name: Configure agent task
        id: task
        if: inputs.prompt != '' || steps.workbench.outputs.found == 'true'
        env:
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          ISSUE_BODY: ${{ steps.workbench.outputs.body }}
          ISSUE_PATH: ${{ steps.workbench.outputs.path }}
          ISSUE_TITLE: ${{ steps.workbench.outputs.title }}
          ISSUE_URL: ${{ steps.workbench.outputs.url }}
          ISSUE_CONTINUING_OWNER: ${{ steps.workbench.outputs.continuing_owner }}
          MANUAL_CONTINUING_OWNER: ${{ inputs.continuing_owner }}
          MAJOR_CHANGE_AUTHORIZED: ${{ inputs.major_change_authorized }}
          RUN_ID: ${{ github.run_id }}
          WORKBENCH_SLUG: ${{ steps.workbench.outputs.slug }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_PROMPT" ]; then
            branch="agent/prompt-${RUN_ID}"
            base_branch="main"
            checkout_ref="main"
            target_kind="standalone"
            title="Manual agent implementation"
            task="$DISPATCH_PROMPT"
            continuing_owner="$MANUAL_CONTINUING_OWNER"
          else
            branch="agent/workbench-${WORKBENCH_SLUG}-${RUN_ID}"
            base_branch="main"
            checkout_ref="main"
            target_kind="standalone"
            title="$ISSUE_TITLE"
            task="$(printf 'Nook Workbench issue `%s`: %s\nURL: %s\n\n%s' "$ISSUE_PATH" "$ISSUE_TITLE" "$ISSUE_URL" "$ISSUE_BODY")"
            continuing_owner="$ISSUE_CONTINUING_OWNER"
          fi
          feature="${ISSUE_PATH:-issues/unplanned/task.md}"
          feature="$(printf '%s' "$feature" | cut -d/ -f2)"
          plan_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          plan_timestamp="$(printf '%s' "$plan_started_at" | tr ':' '-')"
          plan_path="plans/${feature}/${plan_timestamp}-run-${RUN_ID}.md"
          while :; do
            random_suffix="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
            test "${#random_suffix}" -eq 64
            delim="AGENT_EOF_${random_suffix}"
            collision=false
            for value in "$task" "$title"; do
              if printf '%s\n' "$value" | grep -Fqx -- "$delim"; then
                collision=true
                break
              fi
            done
            [ "$collision" = false ] && break
          done
          emit_multiline_env() {
            printf '%s<<%s\n%s\n%s\n' "$1" "$delim" "$2" "$delim"
          }
          {
            echo "AGENT_BRANCH=$branch"
            echo "FIX_BRANCH=$branch"
            echo "AGENT_PR_BASE_BRANCH=$base_branch"
            echo "AGENT_PR_TARGET_KIND=$target_kind"
            emit_multiline_env "AGENT_PROMPT" "$task"
            echo "TASK_FEATURE=$feature"
            echo "TASK_PLAN_PATH=$plan_path"
            echo "TASK_PLAN_STARTED_AT=$plan_started_at"
            emit_multiline_env "TASK_TITLE" "$title"
            echo "CONTINUING_AGENT_OWNER=$continuing_owner"
            echo "MAJOR_CHANGE_AUTHORIZED=$MAJOR_CHANGE_AUTHORIZED"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"

      - name: Resolve standalone prompt rerun
        id: rerun
        if: steps.task.outputs.ready == 'true' && inputs.prompt != ''
        uses: actions/github-script@v9
        env:
          AGENT_BRANCH: ${{ env.AGENT_BRANCH }}
        with:
          github-token: ${{ secrets.NOOK_GITHUB_PAT }}
          retries: 3
          script: |
            const pulls = await github.rest.pulls.list({
              ...context.repo,
              state: 'all',
              head: `${context.repo.owner}:${process.env.AGENT_BRANCH}`,
              per_page: 2,
            })
            if (pulls.data.length > 1) {
              core.setFailed(`Multiple open PRs use standalone branch ${process.env.AGENT_BRANCH}`)
              return
            }
            const candidate = pulls.data[0]
            if (candidate && (candidate.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` || candidate.base.ref !== 'main')) {
              core.setFailed('Existing standalone implementation PR has an unexpected repository or base')
              return
            }
            if (candidate) {
              const { data: pull } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: candidate.number,
              })
              if (pull.state === 'open') {
                core.setOutput('terminal', 'true')
                core.setOutput('terminal_reason', 'open')
                return
              }
              if (pull.merged) {
                core.setOutput('terminal', 'true')
                core.setOutput('terminal_reason', 'merged')
                return
              }
              core.setFailed(`Standalone implementation PR #${pull.number} was closed without merge; preserve it for explicit recovery`)
              return
            }
            try {
              await github.rest.repos.getBranch({
                ...context.repo,
                branch: process.env.AGENT_BRANCH,
              })
              core.setFailed(`Standalone implementation branch ${process.env.AGENT_BRANCH} exists without a PR; preserve it for explicit recovery`)
              return
            } catch (error) {
              if (error.status !== 404) throw error
            }
            core.setOutput('terminal', 'false')

      - name: Prepare isolated implementation worktree
        if: steps.task.outputs.ready == 'true' && steps.rerun.outputs.terminal != 'true'
        env:
          IMPLEMENTATION_REF: ${{ steps.task.outputs.checkout_ref }}
          NOOK_TOKEN: ${{ secrets.NOOK_GITHUB_PAT }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          trusted_head="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          if [ "$trusted_head" != "$TRUSTED_WORKFLOW_SHA" ]; then
            echo "::error::Trusted tooling checkout moved away from the workflow SHA."
            exit 1
          fi
          implementation_root="$RUNNER_TEMP/nook-implementation-${GITHUB_RUN_ID}"
          if [ -e "$implementation_root" ]; then
            echo "::error::Implementation worktree path already exists."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$NOOK_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "refs/heads/${IMPLEMENTATION_REF}:refs/remotes/origin/${IMPLEMENTATION_REF}"
          implementation_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse "refs/remotes/origin/${IMPLEMENTATION_REF}")"
          unset auth NOOK_TOKEN
          git -C "$GITHUB_WORKSPACE" worktree add --detach "$implementation_root" \
            "refs/remotes/origin/${IMPLEMENTATION_REF}"
          echo "IMPLEMENTATION_REPO_ROOT=$implementation_root" >> "$GITHUB_ENV"

      - name: Validate continuing GitHub owner
        if: steps.task.outputs.ready == 'true' && steps.rerun.outputs.terminal != 'true'
        uses: actions/github-script@v9
        env:
          CONTINUING_AGENT_OWNER: ${{ env.CONTINUING_AGENT_OWNER }}
        with:
          github-token: ${{ secrets.NOOK_GITHUB_PAT }}
          retries: 3
          script: |
            const username = process.env.CONTINUING_AGENT_OWNER
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username,
            })
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed(`${username} must be an assignable Nook collaborator with write access`)
            }

      - name: Expose Actions Node.js runtime
        if: steps.task.outputs.ready == 'true' && steps.rerun.outputs.terminal != 'true'
        uses: ./.github/actions/nook-node-setup

      - name: Install pinned Bun formatter runtime
        if: steps.task.outputs.ready == 'true' && steps.rerun.outputs.terminal != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install pinned rustfmt
        if: steps.task.outputs.ready == 'true' && steps.rerun.outputs.terminal != 'true'
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt

      - name: Prepare direct host tooling
        if: steps.task.outputs.ready == 'true' && steps.rerun.outputs.terminal != 'true'
        run: |
          set -euo pipefail
          node -e "const [major,minor]=process.versions.node.split('.').map(Number); if(major<22||(major===22&&minor<13)) process.exit(1)"
          npm ci --ignore-scripts --include=dev --prefix "$GITHUB_WORKSPACE/agentic-ai/ci-agent"
          npm run build --prefix "$GITHUB_WORKSPACE/agentic-ai/ci-agent"
          bun install --cwd "$GITHUB_WORKSPACE/.github/formatting" --frozen-lockfile --ignore-scripts
          rustfmt --version

      - name: Verify trusted tooling and implementation worktree
        if: steps.task.outputs.ready == 'true' && steps.rerun.outputs.terminal != 'true'
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
          test "$IMPLEMENTATION_REPO_ROOT" != "$GITHUB_WORKSPACE"
          git -C "$IMPLEMENTATION_REPO_ROOT" rev-parse --git-dir
          git -C "$IMPLEMENTATION_REPO_ROOT" status -sb

      - name: Run task-planning agent
        id: planning
        if: steps.task.outputs.ready == 'true' && steps.rerun.outputs.terminal != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CI_AGENT_PROMPT_FILE: .github/prompts/agent-plan.md
          CI_AGENT_TIMEOUT_MS: "600000"
          ASSIGNED_GIZMO_ID: ${{ steps.workbench.outputs.gizmo_id }}
          IMPLEMENTATION_REPO_ROOT: ${{ env.IMPLEMENTATION_REPO_ROOT }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-agent-plan.sh"

      - name: Validate and publish Workbench task plan
        id: plan
        if: steps.planning.outcome == 'success' && steps.rerun.outputs.terminal != 'true'
        uses: actions/github-script@v9
        env:
          ISSUE_PATH: ${{ steps.workbench.outputs.path }}
          ISSUE_TITLE: ${{ steps.workbench.outputs.title }}
          CONTINUING_AGENT_OWNER: ${{ env.CONTINUING_AGENT_OWNER }}
          TASK_FEATURE: ${{ env.TASK_FEATURE }}
          TASK_PLAN_PATH: ${{ env.TASK_PLAN_PATH }}
          TASK_PLAN_STARTED_AT: ${{ env.TASK_PLAN_STARTED_AT }}
          TASK_TITLE: ${{ env.TASK_TITLE }}
          WORKBENCH_PLAN_FILE: ${{ env.WORKBENCH_PLAN_FILE }}
          WORKBENCH_SUMMARY_FILE: ${{ env.WORKBENCH_SUMMARY_FILE }}
          WORKBENCH_REPOSITORY: ${{ env.WORKBENCH_REPOSITORY }}
          CURSOR_SECRET: ${{ secrets.CURSOR_API_KEY }}
          ASSIGNED_GIZMO_ID: ${{ steps.workbench.outputs.gizmo_id }}
        with:
          github-token: ${{ secrets.NOOK_GITHUB_PAT }}
          retries: 3
          script: |
            const crypto = require('node:crypto')
            const fs = require('node:fs')
            const { validateAgentRecord } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/workbench-records.cjs`)
            const [owner, repo] = process.env.WORKBENCH_REPOSITORY.split('/')
            const planPath = process.env.TASK_PLAN_PATH
            const localPath = `${process.env.GITHUB_WORKSPACE}/${process.env.WORKBENCH_PLAN_FILE}`
            const summaryPath = `${process.env.GITHUB_WORKSPACE}/${process.env.WORKBENCH_SUMMARY_FILE}`
            const secrets = [process.env.CURSOR_SECRET]
            const claimedIssuePath = process.env.ISSUE_PATH.trim()
            const claimedIssueTitle = process.env.ISSUE_TITLE.trim()
            core.setOutput('issue_path', claimedIssuePath)
            core.setOutput('issue_title', claimedIssueTitle)
            if (!fs.existsSync(localPath)) {
              if (!fs.existsSync(summaryPath)) {
                core.setFailed('Planning produced neither a plan nor a planning blocker.')
                return
              }
              const blocker = fs.readFileSync(summaryPath, 'utf8').trim()
              const rejection = validateAgentRecord(blocker, 'worklog', secrets, process.env.AGENT_PROMPT)
              if (rejection) {
                core.setFailed(`Rejected planning blocker: ${rejection}.`)
                return
              }
              core.setOutput('planning_blocked', 'true')
              return
            }
            const candidate = fs.readFileSync(localPath, 'utf8').trim()
            const sourceTask = process.env.AGENT_PROMPT
            const rejection = validateAgentRecord(candidate, 'plan', secrets, sourceTask, {
              assignedGizmoId: process.env.ASSIGNED_GIZMO_ID,
            })
            if (rejection) {
              core.setFailed(`Rejected agent-authored Workbench task plan: ${rejection}.`)
              return
            }
            const validatedPlan = `${candidate}\n`
            fs.writeFileSync(localPath, validatedPlan, { encoding: 'utf8', mode: 0o600 })
            core.setOutput('sha256', crypto.createHash('sha256').update(validatedPlan).digest('hex'))
            const currentGizmoIdMatch = /^- Current Gizmo ID:\s*([a-z0-9]+(?:-[a-z0-9]+)*)\s*$/m.exec(candidate)
            const currentGizmoId = currentGizmoIdMatch?.[1]
            if (!currentGizmoId) {
              core.setFailed('Validated Workbench task plan is missing its Current Gizmo ID.')
              return
            }
            const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            const gizmoNamePattern = new RegExp(
              `^1\\.\\s+Gizmo ID:\\s*${escapeRegExp(currentGizmoId)}\\s*;\\s*Gizmo name:\\s*(.+?)\\s*;\\s*Predecessor Gizmo ID:`,
              'im',
            )
            const gizmoName = gizmoNamePattern.exec(candidate)?.[1].trim() || ''
            const trustedTitle = claimedIssuePath ? claimedIssueTitle : gizmoName
            if (trustedTitle.length < 3 || trustedTitle.length > 120 || /[\u0000-\u001f\u007f]/u.test(trustedTitle)) {
              core.setFailed('Validated task context is missing a safe capability-oriented PR title.')
              return
            }
            const markdownTitle = trustedTitle.replace(/([\\`*_[\]<>])/g, '\\$1')
            const bindingRejection = validateAgentRecord(candidate, 'plan', secrets, sourceTask, {
              assignedGizmoId: currentGizmoId,
            })
            if (bindingRejection) {
              core.setFailed(`Rejected plan binding for canonical Gizmo ID: ${bindingRejection}.`)
              return
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            let issuePath = claimedIssuePath
            if (!issuePath) {
              issuePath = `issues/unplanned/run-${context.runId}.md`
              const now = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z')
              const issue = [
                '---',
                `title: ${JSON.stringify(trustedTitle)}`,
                'status: in_progress',
                'priority: p2',
                'automation: agent',
                `owner: ${process.env.CONTINUING_AGENT_OWNER}`,
                `created_at: ${now}`,
                `updated_at: ${now}`,
                'source_issues: []',
                'related_prs: []',
                'depends_on: []',
                `gizmo_id: ${currentGizmoId}`,
                '---',
                '',
                `# ${markdownTitle}`,
                '',
                '## Context',
                '',
                'This focused issue is the public lifecycle authority for a manual Agent implement dispatch.',
                '',
                '## Outcome',
                '',
                `Deliver ${markdownTitle} through one bounded Nook pull request.`,
                '',
                '## Scope',
                '',
                '- Implement the capability and acceptance evidence defined by the linked immutable task plan.',
                '- Preserve repository ownership, security, validation, and exact-head delivery boundaries.',
                '',
                '## Acceptance criteria',
                '',
                '- [ ] The implementation satisfies the immutable plan and repository-owned validation.',
                '- [ ] The resulting PR remains assigned to the named continuing owner through merge.',
                '',
                '## Progress',
                '',
                `<!-- agent-implement-run:${context.runId} -->`,
                `- ${now}: [Agent implement run ${context.runId}](${runUrl}) established this focused issue and canonical Gizmo ID.`,
                '',
                '## Findings and decisions',
                '',
                '- The private dispatch prompt is not published; the validated plan owns the public task interpretation.',
                '',
              ].join('\n')
              try {
                const { data: existing } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: issuePath,
                  ref: 'main',
                })
                if (Array.isArray(existing) || existing.type !== 'file') {
                  core.setFailed(`Manual focused issue is not a file: ${issuePath}`)
                  return
                }
                const existingBody = Buffer.from(existing.content, 'base64').toString('utf8')
                const existingFrontmatter = existingBody.match(
                  /^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/,
                )?.[1] || ''
                if (
                  !existingBody.includes(`<!-- agent-implement-run:${context.runId} -->`) ||
                  !/^status:\s*in_progress$/m.test(existingFrontmatter) ||
                  !/^automation:\s*agent$/m.test(existingFrontmatter) ||
                  !new RegExp(`^owner:\\s*${escapeRegExp(process.env.CONTINUING_AGENT_OWNER)}$`, 'm')
                    .test(existingFrontmatter) ||
                  !new RegExp(`^gizmo_id:\\s*${escapeRegExp(currentGizmoId)}$`, 'm')
                    .test(existingFrontmatter) ||
                  !new RegExp(`^title:\\s*${escapeRegExp(JSON.stringify(trustedTitle))}$`, 'm')
                    .test(existingFrontmatter)
                ) {
                  core.setFailed(`Existing manual focused issue does not match this trusted run: ${issuePath}`)
                  return
                }
              } catch (error) {
                if (error.status !== 404) throw error
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: issuePath,
                  branch: 'main',
                  message: `issues: establish agent run ${context.runId}`,
                  content: Buffer.from(issue).toString('base64'),
                })
              }
            }
            const issueUrl = `https://github.com/${owner}/${repo}/blob/main/${issuePath}`
            if (!issuePath || !issueUrl || !currentGizmoId) {
              core.setFailed('Trusted PR publication requires a focused issue URL and canonical Gizmo ID.')
              return
            }
            const plan = [
              '---',
              `title: ${JSON.stringify(trustedTitle)}`,
              `feature: ${issuePath.split('/')[1]}`,
              `issue: ${issuePath}`,
              `gizmo_id: ${currentGizmoId}`,
              `started_at: ${process.env.TASK_PLAN_STARTED_AT}`,
              'agent: cursor',
              '---',
              '',
              candidate,
              '',
            ].join('\n')
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: planPath,
              branch: 'main',
              message: `plan: agent run ${context.runId}`,
              content: Buffer.from(plan).toString('base64'),
            })
            const planUrl = `https://github.com/${owner}/${repo}/blob/main/${planPath}`
            const prBody = [
              '## Summary',
              '',
              `Automated implementation of ${markdownTitle}.`,
              '',
              '## Agent-task provenance',
              '',
              '- Harness: GitHub Actions `Agent implement`',
              `- Task: ${markdownTitle}`,
              `- Opaque task ID: [workflow run ${context.runId}](${runUrl})`,
              `- Gizmo ID: \`${currentGizmoId}\``,
              '',
              '## Workbench authority',
              '',
              `- Focused issue: [\`${issuePath}\`](${issueUrl})`,
              `- Immutable plan: [\`${planPath}\`](${planUrl})`,
              '',
              '## Ownership',
              '',
              `Continuing agent: \`${process.env.CONTINUING_AGENT_OWNER}\``,
              '',
              '## Test plan',
              '',
              '- [ ] CI green on this PR',
            ].join('\n')
            const delimiter = `AGENT_METADATA_${crypto.randomBytes(32).toString('hex')}`
            if ([trustedTitle, prBody].some((value) => value.split('\n').includes(delimiter))) {
              core.setFailed('Failed to construct collision-safe PR metadata.')
              return
            }
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              [
                `AGENT_PR_TITLE<<${delimiter}`,
                trustedTitle,
                delimiter,
                `AGENT_COMMIT_MESSAGE<<${delimiter}`,
                trustedTitle,
                delimiter,
                `AGENT_PR_BODY<<${delimiter}`,
                prBody,
                delimiter,
                '',
              ].join('\n'),
            )
            core.setOutput('path', planPath)
            core.setOutput('url', planUrl)
            core.setOutput('issue_path', issuePath)
            core.setOutput('issue_url', issueUrl)
            core.setOutput('issue_title', trustedTitle)
            core.setOutput('gizmo_id', currentGizmoId)

      - name: Materialize validated implementation plan
        if: steps.plan.outcome == 'success' && steps.plan.outputs.planning_blocked != 'true' && steps.rerun.outputs.terminal != 'true'
        env:
          EXPECTED_PLAN_SHA256: ${{ steps.plan.outputs.sha256 }}
        run: |
          set -euo pipefail
          source_plan="$GITHUB_WORKSPACE/$WORKBENCH_PLAN_FILE"
          implementation_plan="$IMPLEMENTATION_REPO_ROOT/$WORKBENCH_PLAN_FILE"
          test -f "$source_plan" && test ! -L "$source_plan"
          test "$(wc -c < "$source_plan")" -le 65536
          test ! -e "$implementation_plan" && test ! -L "$implementation_plan"
          test "$(sha256sum "$source_plan" | cut -d' ' -f1)" = "$EXPECTED_PLAN_SHA256"
          install -m 0444 "$source_plan" "$implementation_plan"
          test "$(sha256sum "$implementation_plan" | cut -d' ' -f1)" = "$EXPECTED_PLAN_SHA256"
          echo "VALIDATED_PLAN_SHA256=$EXPECTED_PLAN_SHA256" >> "$GITHUB_ENV"

      - name: Run sandboxed implementation agent
        id: agent_edit
        if: steps.rerun.outputs.terminal == 'true' || (steps.plan.outcome == 'success' && steps.plan.outputs.planning_blocked != 'true')
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          IMPLEMENTATION_TERMINAL: ${{ steps.rerun.outputs.terminal }}
          IMPLEMENTATION_TERMINAL_REASON: ${{ steps.rerun.outputs.terminal_reason }}
          REPO_ROOT: ${{ env.IMPLEMENTATION_REPO_ROOT }}
          WASM_BUILD_MODE: prod
        run: |
          set -euo pipefail
          if [ "$IMPLEMENTATION_TERMINAL" = true ]; then
            echo "Standalone implementation PR is $IMPLEMENTATION_TERMINAL_REASON; skipping rerun."
            exit 0
          fi
          plan="$REPO_ROOT/$WORKBENCH_PLAN_FILE"
          test -f "$plan" && test ! -L "$plan"
          test "$(wc -c < "$plan")" -le 65536
          test "$(sha256sum "$plan" | cut -d' ' -f1)" = "$VALIDATED_PLAN_SHA256"
          CI_AGENT_TOOLING_ROOT="$GITHUB_WORKSPACE" \
            node "$GITHUB_WORKSPACE/agentic-ai/ci-agent/dist/main/main.js" edit
          bash "$GITHUB_WORKSPACE/.github/scripts/ci-agent-change-detect.sh"

      - name: Format implementation on trusted host
        id: format
        if: steps.agent_edit.outputs.changed == 'true' && steps.rerun.outputs.terminal != 'true'
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
          test "$IMPLEMENTATION_REPO_ROOT" != "$GITHUB_WORKSPACE"
          changed_files="$RUNNER_TEMP/nook-format-${GITHUB_RUN_ID}.files"
          git -C "$IMPLEMENTATION_REPO_ROOT" diff --name-only -z HEAD > "$changed_files"
          git -C "$IMPLEMENTATION_REPO_ROOT" ls-files --others --exclude-standard -z >> "$changed_files"
          NOOK_REPO_ROOT="$IMPLEMENTATION_REPO_ROOT" \
          NOOK_FORMATTER_ROOT="$GITHUB_WORKSPACE/.github/formatting" \
          FORMAT_CHANGED_FILES="$changed_files" \
            bash "$GITHUB_WORKSPACE/.github/formatting/format.sh"

      - name: Validate, commit, and publish implementation
        id: implement
        if: steps.rerun.outputs.terminal == 'true' || (steps.agent_edit.outputs.changed == 'true' && steps.format.outcome == 'success')
        env:
          IMPLEMENTATION_TERMINAL: ${{ steps.rerun.outputs.terminal }}
          IMPLEMENTATION_TERMINAL_REASON: ${{ steps.rerun.outputs.terminal_reason }}
          NOOK_GITHUB_PAT: ${{ secrets.NOOK_GITHUB_PAT }}
          REPO_ROOT: ${{ env.IMPLEMENTATION_REPO_ROOT }}
        run: |
          if [ "$IMPLEMENTATION_TERMINAL" = true ]; then
            echo "Standalone implementation PR is $IMPLEMENTATION_TERMINAL_REASON; delivery is idempotently complete."
            exit 0
          fi
          CI_AGENT_TOOLING_ROOT="$GITHUB_WORKSPACE" \
            node "$GITHUB_WORKSPACE/agentic-ai/ci-agent/dist/main/main.js" deliver

      - name: Publish Workbench result
        if: >-
          always() &&
          steps.rerun.outputs.terminal != 'true' &&
          (steps.task.outputs.ready == 'true' ||
           steps.workbench.outputs.found == 'true')
        uses: actions/github-script@v9
        env:
          AGENT_BRANCH: ${{ env.AGENT_BRANCH }}
          AGENT_PROMPT: ${{ env.AGENT_PROMPT }}
          IMPLEMENT_OUTCOME: ${{ steps.implement.outcome }}
          BUDGET_BLOCKER_B64: ${{ steps.implement.outputs.budget_blocker_b64 }}
          ISSUE_PATH: ${{ steps.plan.outputs.issue_path }}
          ISSUE_TITLE: ${{ steps.plan.outputs.issue_title }}
          PLAN_PATH: ${{ steps.plan.outputs.path }}
          WORKBENCH_REPOSITORY: ${{ env.WORKBENCH_REPOSITORY }}
          WORKBENCH_SUMMARY_FILE: ${{ env.WORKBENCH_SUMMARY_FILE }}
          CURSOR_SECRET: ${{ secrets.CURSOR_API_KEY }}
          NOOK_SECRET: ${{ secrets.NOOK_GITHUB_PAT }}
          CONTINUING_AGENT_OWNER: ${{ env.CONTINUING_AGENT_OWNER }}
          IMPLEMENTATION_REPO_ROOT: ${{ env.IMPLEMENTATION_REPO_ROOT }}
        with:
          github-token: ${{ secrets.NOOK_GITHUB_PAT }}
          retries: 3
          script: |
            const fs = require('node:fs')
            const { validateAgentRecord } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/workbench-records.cjs`)
            const [owner, repo] = process.env.WORKBENCH_REPOSITORY.split('/')
            const issuePath = process.env.ISSUE_PATH.trim()
            const feature = issuePath ? issuePath.split('/')[1] : 'unplanned'
            const now = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z')
            const timestamp = now.replaceAll('-', '').replaceAll(':', '')
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const pulls = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${process.env.AGENT_BRANCH}`,
            })
            const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            })
            const pull = pulls.data[0]
            const success = process.env.IMPLEMENT_OUTCOME === 'success' && Boolean(pull)
            if (success) {
              const continuingOwner = process.env.CONTINUING_AGENT_OWNER
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number: pull.number,
                assignees: [continuingOwner],
              })
              const { data: assignedPull } = await github.rest.issues.get({
                ...context.repo,
                issue_number: pull.number,
              })
              const ownerWasAssigned = assignedPull.assignees?.some(
                ({ login }) => login.toLowerCase() === continuingOwner.toLowerCase(),
              ) ?? false
              if (!ownerWasAssigned) {
                core.setFailed(`Failed to assign PR #${pull.number} to ${continuingOwner}`)
                return
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pull.number,
                body: `@${continuingOwner} this workflow assigned you PR #${pull.number}. Continue only this PR's recorded scope through review, exact-head validation, and squash merge.`,
              })
            }
            const implementationSummaryPath = `${process.env.IMPLEMENTATION_REPO_ROOT}/${process.env.WORKBENCH_SUMMARY_FILE}`
            const planningSummaryPath = `${process.env.GITHUB_WORKSPACE}/${process.env.WORKBENCH_SUMMARY_FILE}`
            const implementationSummaryExists = fs.existsSync(implementationSummaryPath)
            if (implementationSummaryExists) {
              const artifact = fs.lstatSync(implementationSummaryPath)
              if (!artifact.isFile() || artifact.isSymbolicLink() || artifact.size > 65536) {
                core.setFailed('Rejected unsafe implementation worklog artifact.')
                return
              }
            }
            const summaryPath = implementationSummaryExists
              ? implementationSummaryPath
              : planningSummaryPath
            const fallbackSummary = [
                  '# Automated agent work summary',
                  '',
                  '## Outcome',
                  '',
                  success ? `Opened Nook PR [#${pull.number}](${pull.html_url}).` : 'The bounded implementation run did not open a pull request.',
                  '',
                  '## Progress',
                  '',
                  '- See the linked workflow run for the execution boundary.',
                  '',
                  '## Implementation problems',
                  '',
                  success ? '- No problem summary was emitted by the bounded worker.' : '- The workflow or agent stopped before a pull request was opened.',
                  '',
                  '## Decisions',
                  '',
                  '- None recorded.',
                  '',
                  '## Validation',
                  '',
                  `- [Agent implement run ${context.runId}](${runUrl})`,
                  '',
                  '## Remaining work',
                  '',
                  success ? `- GitHub assigned and notified continuing owner \`${process.env.CONTINUING_AGENT_OWNER}\` for validation and merge of the Nook PR.` : '- Inspect the workflow failure and return the issue to ready after correcting the blocker.',
                ].join('\n')
            let summary = fallbackSummary
            if (fs.existsSync(summaryPath)) {
              const candidate = fs.readFileSync(summaryPath, 'utf8').trim()
              const secrets = [process.env.CURSOR_SECRET, process.env.NOOK_SECRET]
              const rejection = validateAgentRecord(candidate, 'worklog', secrets, process.env.AGENT_PROMPT)
              if (rejection) {
                core.warning(`Rejected agent-authored Workbench summary: ${rejection}; publishing trusted fallback metadata.`)
              } else {
                summary = candidate
              }
            }
            const budgetBlocker = process.env.BUDGET_BLOCKER_B64
              ? Buffer.from(process.env.BUDGET_BLOCKER_B64, 'base64').toString('utf8')
              : ''
            const budgetMatch = budgetBlocker.match(/^Implemented diff exceeds the 2000 authored-addition budget: (\d+)$/)
            if (budgetMatch) {
              summary = [
                '# Automated agent work summary',
                '',
                '## Outcome',
                '',
                `Blocked before publication: the trusted formatter measured ${budgetMatch[1]} authored changed lines, above the 2,000-line PR creation limit.`,
                '',
                '## Progress',
                '',
                '- The bounded agent completed editing and trusted formatting, but no implementation branch or PR was published.',
                '',
                '## Implementation problems',
                '',
                `- ${budgetBlocker}. The accepted plan underestimated the final formatted diff.`,
                '',
                '## Decisions',
                '',
                '- Delivery stopped at the trusted authored-line budget; no split or successor PR was created.',
                '',
                '## Validation',
                '',
                `- [Agent implement run ${context.runId}](${runUrl})`,
                '',
                '## Remaining work',
                '',
                '- Re-scope or simplify the task before returning it to ready.',
              ].join('\n')
            }
            const worklogPath = `worklogs/${feature}/${timestamp}-run-${context.runId}.md`
            const worklog = [
              '---',
              `title: ${JSON.stringify(process.env.ISSUE_TITLE || `Manual agent run ${context.runId}`)}`,
              `feature: ${feature}`,
              `issue: ${issuePath || 'null'}`,
              `plan: ${process.env.PLAN_PATH || 'null'}`,
              `nook_pr: ${pull?.html_url || 'null'}`,
              `status: ${success ? 'in_progress' : 'blocked'}`,
              `started_at: ${workflowRun.created_at || now}`,
              `finished_at: ${now}`,
              'agent: cursor',
              '---',
              '',
              summary,
              '',
            ].join('\n')
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: worklogPath,
              branch: 'main',
              message: `worklog: agent run ${context.runId}`,
              content: Buffer.from(worklog).toString('base64'),
            })
            const worklogUrl = `https://github.com/${owner}/${repo}/blob/main/${worklogPath}`
            if (pull) {
              const { data: currentPull } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pull.number,
              })
              const currentPrBody = currentPull.body || ''
              const issueUrl = `https://github.com/${owner}/${repo}/blob/main/${issuePath}`
              const planUrl = `https://github.com/${owner}/${repo}/blob/main/${process.env.PLAN_PATH}`
              if (
                !currentPrBody.includes('## Agent-task provenance') ||
                !currentPrBody.includes('## Workbench authority') ||
                !currentPrBody.includes(issueUrl) ||
                !currentPrBody.includes(planUrl)
              ) {
                core.setFailed(`PR #${pull.number} is missing required trusted publication metadata`)
                return
              }
              if (!currentPrBody.includes(worklogUrl)) {
                const worklogLine = `- Immutable worklog: [\`${worklogPath}\`](${worklogUrl})`
                const updatedPrBody = currentPrBody.replace(
                  /^## Workbench authority\s*$/m,
                  (heading) => `${heading}\n\n${worklogLine}`,
                )
                await github.rest.pulls.update({
                  ...context.repo,
                  pull_number: pull.number,
                  body: updatedPrBody,
                })
              }
            }

            if (!issuePath) return
            const { data } = await github.rest.repos.getContent({ owner, repo, path: issuePath, ref: 'main' })
            if (Array.isArray(data) || data.type !== 'file') {
              core.setFailed(`Workbench issue is not a file: ${issuePath}`)
              return
            }
            let body = Buffer.from(data.content, 'base64').toString('utf8')
              .replace(/^updated_at:\s*.+$/m, `updated_at: ${now}`)
            if (!success) body = body.replace(/^status:\s*in_progress$/m, 'status: blocked')
            if (pull) {
              body = body.replace(
                /^related_prs:\s*\[(.*)\]$/m,
                (_line, entries) => {
                  const current = entries.trim()
                  if (current.includes(pull.html_url)) return _line
                  const separator = current ? ', ' : ''
                  return `related_prs: [${current}${separator}${JSON.stringify(pull.html_url)}]`
                },
              )
            }
            const progressOutcome = success
              ? `opened [Nook PR #${pull.number}](${pull.html_url})`
              : 'stopped before opening a PR'
            const progress = `- ${now}: [Agent run ${context.runId}](${runUrl}) ${progressOutcome}; [worklog](/${owner}/${repo}/blob/main/${worklogPath}).`
            body = body.replace(/^## Progress\s*$/m, `## Progress\n\n${progress}`)
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: issuePath,
              branch: 'main',
              sha: data.sha,
              message: `${success ? 'progress' : 'block'}: ${issuePath}`,
              content: Buffer.from(body).toString('base64'),
            })

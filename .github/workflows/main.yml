# Main runs native and WASM/web producers concurrently, each checking preflight before building.
# The WASM/web producer overlaps Node and web checks, then verified WASM cache publication with image publication
# on its own builder. Web and two isolated extension shards consume one verified image.
# All validation and cache gates join before development deployment.
# Each browser solve is read-only. Deploy the fast, unoptimized development channel to Cloudflare
# Pages only after web verify, both browser e2e suites, and the portable WASM cache proof succeed.
# Immutable releases remain
# responsible for production wasm optimization.
# Research-only changes are handled by web-research.yml. Cortex, Cursor,
# Vale-policy, repository-policy-only, and agentic-AI-only changes do not need
# this workflow.
#
# E2e on main uses the unified stub `e2e` project (no GitHub API). Live sync
# provider tests remain available through the manually dispatched e2e-pr.yml.
#
# Playwright browsers are pre-installed in the web e2e base image.
# Main's trusted Rust/WASM producers receive fixed-ID SeaweedFS sccache secret mounts. ARC reuses
# the persistent BuildKit shard on the selected node and publishes verified portable layers to Zot.
# PR, release, and browser-only jobs remain secret-free.

name: Main

on:
  workflow_call:
    inputs:
      product_changed:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      product_changed:
        description: Run the complete Main product validation and development deployment
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

env:
  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
  DOCKER_IMAGE: nook-web:run-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_E2E_IMAGE: nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
  CI_MAIN_DEV_DOMAIN: dev.nokey.sh
  CI_MAIN_DEV_URL: https://dev.nokey.sh
  CI_MAIN_SIMPLE_DOMAIN: simple.dev.nokey.sh
  CI_MAIN_SIMPLE_URL: https://simple.dev.nokey.sh
  CI_MAIN_SENTINEL_DOMAIN: sentinel.dev.nokey.sh
  CI_MAIN_SENTINEL_URL: https://sentinel.dev.nokey.sh
  CI_MAIN_VITE_BASE: /
  CI_MAIN_VITE_VAULT_SYNC_INTERVAL_MS: "500"

jobs:
  rust-ecosystem:
    name: Rust ecosystem
    uses: ./.github/workflows/rust-ecosystem-checks.yml
    secrets: inherit
    with:
      fuzz_seconds: "20"
      isolated_cache_write: "false"

  rust:
    name: Native Rust verification
    if: ${{ !cancelled() && inputs.product_changed }}
    # Publish only from the verified job's node-local BuildKit shard.
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          monitor-buildkit-storage: "true"
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          require-sccache: "true"
      - name: Repository invariant validation
        run: task preflight
        env:
          CI: true
          GHA_CACHE_WRITE_ENABLED: ""

      - name: Native Rust format, tests, and coverage
        run: task ci:main:rust
        env:
          CI: true
          # Verify the complete native graph before refreshing any shared Main cache scope.
          GHA_CACHE_WRITE_ENABLED: ""
          GIT_COMMIT_ID: ${{ github.sha }}
          NOOK_SIMPLE_VAULT_URL: ${{ env.CI_MAIN_SIMPLE_URL }}/
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}
          NOOK_EXTENSION_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}/
          WASM_BUILD_MODE: dev

      - name: Publish verified native BuildKit cache
        id: publish_native_cache
        continue-on-error: true
        run: task ci:main:publish-native-cache
        env:
          CI: true
          GHA_CACHE_WRITE_ENABLED: "1"
          WASM_BUILD_MODE: dev

      - name: Require successful native cache publication
        if: ${{ !cancelled() }}
        env:
          CACHE_PUBLICATION_OUTCOME: ${{ steps.publish_native_cache.outcome }}
        run: |
          if [ "$CACHE_PUBLICATION_OUTCOME" != "success" ]; then
            echo "Native cache publication failed in the verified producer: $CACHE_PUBLICATION_OUTCOME" >&2
            exit 1
          fi

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  web:
    name: WASM and web verification
    if: ${{ !cancelled() && inputs.product_changed }}
    outputs:
      cache_publication_outcome: ${{ steps.prepare_web.outputs.cache_publication_outcome }}
      verification_outcome: ${{ steps.upload_web.outcome }}
      # The attempt that built the e2e image. Re-running only a failed consumer
      # bumps run_attempt, so consumers pull this attempt's tag. Only the number
      # crosses jobs: GitHub drops outputs that contain a masked value.
      e2e_image_attempt: ${{ github.run_attempt }}
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: ${{ startsWith(vars.NOOK_RUNS_ON || 'nook-k0s', 'nook-k0s') && 15 || 60 }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          require-sccache: "true"
      - name: Verify preflight and private web producer, then publish verified artifacts
        id: prepare_web
        shell: bash
        run: |
          set -eo pipefail
          set -m
          owned_pids=()
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            for pid in "${owned_pids[@]}"; do kill -- "-$pid" 2>/dev/null || true; done
            for pid in "${owned_pids[@]}"; do wait "$pid" 2>/dev/null || true; done
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          (
            set +m
            (
              set +m
              trap - EXIT INT TERM
              set +e
              task preflight 2>&1 | tee "$RUNNER_TEMP/main-preflight.log"
              statuses=("${PIPESTATUS[@]}")
              if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
              exit "${statuses[1]}"
            )
          ) &
          preflight_pid=$!
          owned_pids+=("$preflight_pid")
          (
            set -m
            private_pids=()
            cleanup_private() {
              status=$?
              trap - EXIT INT TERM
              for pid in "${private_pids[@]}"; do kill -- "-$pid" 2>/dev/null || true; done
              for pid in "${private_pids[@]}"; do wait "$pid" 2>/dev/null || true; done
              exit "$status"
            }
            trap cleanup_private EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            (
              set +m
              trap - EXIT INT TERM
              set +e
              task ci:pr:wasm \
                CI_ARTIFACT_DIR="${{ runner.temp }}/nook-ci-artifacts/joined" 2>&1 | tee "$RUNNER_TEMP/main-wasm-build.log"
              statuses=("${PIPESTATUS[@]}")
              if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
              exit "${statuses[1]}"
            ) &
            wasm_pid=$!
            private_pids+=("$wasm_pid")
            wait "$wasm_pid" || exit $?
            private_pids=()
            echo "$GITHUB_RUN_ATTEMPT" > "${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm/nook-run-attempt"
            (
              set +m
              trap - EXIT INT TERM
              set +e
              task ci:main:web:artifacts \
                CI_ARTIFACT_DIR="${{ runner.temp }}/nook-ci-artifacts/joined" \
                VITE_BASE="$CI_MAIN_VITE_BASE" \
                VITE_SITE_URL="$CI_MAIN_DEV_URL" \
                VITE_PUBLIC_APP_URL="$CI_MAIN_DEV_URL" \
                VITE_SIMPLE_APP_URL="$CI_MAIN_SIMPLE_URL" \
                VITE_SENTINEL_APP_URL="$CI_MAIN_SENTINEL_URL" \
                WASM_BUILD_MODE=dev 2>&1 | tee "$RUNNER_TEMP/main-web-artifacts.log"
              statuses=("${PIPESTATUS[@]}")
              if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
              exit "${statuses[1]}"
            ) &
            web_pid=$!
            private_pids+=("$web_pid")
            (
              set +m
              trap - EXIT INT TERM
              set +e
              env E2E_OUTPUT=type=cacheonly \
                task web:e2e:kubernetes-image:artifacts \
                CI_ARTIFACT_DIR="${{ runner.temp }}/nook-ci-artifacts/joined" 2>&1 | tee "$RUNNER_TEMP/main-browser-construction.log"
              statuses=("${PIPESTATUS[@]}")
              if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
              exit "${statuses[1]}"
            ) &
            browser_pid=$!
            private_pids+=("$browser_pid")
            (
              set +m
              trap - EXIT INT TERM
              set +e
              task ci:main:wasm-node-test 2>&1 | tee "$RUNNER_TEMP/main-node.log"
              statuses=("${PIPESTATUS[@]}")
              if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
              exit "${statuses[1]}"
            ) &
            node_pid=$!
            private_pids+=("$node_pid")
            wait "$node_pid" || exit $?
            wait "$web_pid" || exit $?
            wait "$browser_pid" || exit $?
            private_pids=()
          ) &
          private_pid=$!
          owned_pids+=("$private_pid")
          wait "$preflight_pid"
          wait "$private_pid"
          owned_pids=()
          (
            set +m
            (
              set +m
              trap - EXIT INT TERM
              set +e
              env GHA_CACHE_WRITE_ENABLED=1 \
                task ci:main:publish-preflight-cache 2>&1 | tee "$RUNNER_TEMP/main-preflight-cache.log"
              statuses=("${PIPESTATUS[@]}")
              if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
              exit "${statuses[1]}"
            )
          ) &
          preflight_cache_pid=$!
          owned_pids+=("$preflight_cache_pid")
          (
            set +m
            (
              set +m
              trap - EXIT INT TERM
              set +e
              env GHA_CACHE_WRITE_ENABLED=1 \
                task ci:main:publish-wasm-cache 2>&1 | tee "$RUNNER_TEMP/main-wasm-cache.log"
              statuses=("${PIPESTATUS[@]}")
              if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
              exit "${statuses[1]}"
            )
          ) &
          cache_pid=$!
          owned_pids+=("$cache_pid")
          image_status=0
          task web:e2e:kubernetes-image:artifacts \
            CI_ARTIFACT_DIR="${{ runner.temp }}/nook-ci-artifacts/joined" || image_status=$?
          preflight_cache_outcome=success
          wait "$preflight_cache_pid" || preflight_cache_outcome=failure
          cache_outcome=success
          wait "$cache_pid" || cache_outcome=failure
          owned_pids=()
          echo "preflight_cache_publication_outcome=$preflight_cache_outcome" >> "$GITHUB_OUTPUT"
          echo "cache_publication_outcome=$cache_outcome" >> "$GITHUB_OUTPUT"
          exit "$image_status"
        env:
          CI: true
          # Shared publication starts only after every private task and logger succeeds.
          GHA_CACHE_WRITE_ENABLED: ""
          GIT_COMMIT_ID: ${{ github.sha }}
          DOCKER_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-main-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
          DOCKER_E2E_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-main-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
          VITE_BASE: ${{ env.CI_MAIN_VITE_BASE }}
          VITE_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}
          VITE_PUBLIC_APP_URL: ${{ env.CI_MAIN_DEV_URL }}
          VITE_SIMPLE_APP_URL: ${{ env.CI_MAIN_SIMPLE_URL }}
          VITE_SENTINEL_APP_URL: ${{ env.CI_MAIN_SENTINEL_URL }}
          NOOK_SIMPLE_VAULT_URL: ${{ env.CI_MAIN_SIMPLE_URL }}/
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}
          NOOK_EXTENSION_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}/
          WASM_BUILD_MODE: dev
          WEB_DEPLOY_ARTIFACT_DIR: ${{ runner.temp }}/nook-ci-artifacts/web-deploy

      - name: Upload WASM handoff
        uses: actions/upload-artifact@v7
        with:
          name: main-wasm-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload verified development deployment handoff
        id: upload_web
        uses: actions/upload-artifact@v7
        with:
          name: main-web-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/web-deploy/nook-app
          if-no-files-found: error
          retention-days: 1

      - name: Publish verified web BuildKit cache
        if: success()
        run: task ci:main:publish-web-cache
        env:
          CI: true
          GHA_CACHE_WRITE_ENABLED: "1"
          WASM_BUILD_MODE: dev

      - name: Require successful preflight cache publication
        if: ${{ !cancelled() }}
        env:
          CACHE_PUBLICATION_OUTCOME: ${{ steps.prepare_web.outputs.preflight_cache_publication_outcome }}
        run: |
          if [ "$CACHE_PUBLICATION_OUTCOME" != "success" ]; then
            echo "Preflight cache publication failed in the verified producer: $CACHE_PUBLICATION_OUTCOME" >&2
            exit 1
          fi

      - name: Require successful WASM cache publication
        if: ${{ !cancelled() }}
        env:
          CACHE_PUBLICATION_OUTCOME: ${{ steps.prepare_web.outputs.cache_publication_outcome }}
        run: |
          if [ "$CACHE_PUBLICATION_OUTCOME" != "success" ]; then
            echo "WASM cache publication failed in the verified producer: $CACHE_PUBLICATION_OUTCOME" >&2
            exit 1
          fi

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  wasm-cache-proof:
    name: Portable WASM cache publication proof
    needs: [web]
    if: ${{ !cancelled() && needs.web.outputs.verification_outcome == 'success' && needs.web.outputs.cache_publication_outcome == 'success' }}
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}

      - name: Install Bun for registry cache audit
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Publish and prove portable WASM dependency cache
        run: bash .github/scripts/verify-wasm-gha-cache.sh
        env:
          NOOK_WASM_CACHE_PROMOTION_ENABLED: "1"
          NOOK_REGISTRY_USERNAME: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          NOOK_REGISTRY_PASSWORD: ${{ secrets.NOOK_REGISTRY_PASSWORD }}

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  web-e2e:
    name: Web e2e
    needs: [web]
    if: ${{ !cancelled() && needs.web.outputs.verification_outcome == 'success' }}
    runs-on: ${{ vars.NOOK_BROWSER_RUNS_ON || 'nook-k0s-browser' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 180
    container:
      image: registry.dev.nokey.sh/nook/remote-buildcache/nook-main-e2e:run-${{ github.run_id }}-${{ needs.web.outputs.e2e_image_attempt }}
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Local-provider web e2e
        run: |
          cp -R /meta-secret/nook/.github "$GITHUB_WORKSPACE/.github"
          cd /meta-secret/nook
          task _ci:main:web:e2e-only
        env:
          CI: true
          # The e2e image also serves live-sync jobs and may carry a GitHub
          # provider default. Main covers the local file-provider stub suite.
          NOOK_E2E_SYNC_PROVIDER: file
          VITE_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}
          VITE_SIMPLE_APP_URL: ${{ env.CI_MAIN_SIMPLE_URL }}
          VITE_SENTINEL_APP_URL: ${{ env.CI_MAIN_SENTINEL_URL }}

      - name: Preserve existing web failure context
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: main-web-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /meta-secret/nook/nook-app/nook-web/nook-web-app/test-results/**/error-context.md
            /meta-secret/nook/nook-app/nook-web/nook-web-app/test-results/**/test-failed-*.png
          retention-days: 1
          if-no-files-found: ignore

  extension-e2e:
    name: Extension e2e (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    needs: [web]
    if: ${{ !cancelled() && needs.web.outputs.verification_outcome == 'success' }}
    runs-on: ${{ vars.NOOK_BROWSER_RUNS_ON || 'nook-k0s-browser' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 180
    container:
      image: registry.dev.nokey.sh/nook/remote-buildcache/nook-main-e2e:run-${{ github.run_id }}-${{ needs.web.outputs.e2e_image_attempt }}
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Extension e2e
        run: |
          cp -R /meta-secret/nook/.github "$GITHUB_WORKSPACE/.github"
          cd /meta-secret/nook
          task _extension:test:e2e:shard
        env:
          CI: true
          E2E_SHARD: ${{ matrix.shard }}/2
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}

      - name: Preserve existing extension failure context
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: main-extension-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            /meta-secret/nook/nook-app/nook-web/nook-web-extension/test-results/**/error-context.md
            /meta-secret/nook/nook-app/nook-web/nook-web-extension/test-results/**/test-failed-*.png
          retention-days: 1
          if-no-files-found: ignore

  deploy:
    name: Deploy development
    if: github.ref == 'refs/heads/main'
    needs: [rust, rust-ecosystem, web, web-e2e, extension-e2e, wasm-cache-proof]
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 10
    environment:
      name: development
      url: https://dev.nokey.sh/
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download verified development deployment handoff
        uses: actions/download-artifact@v8
        with:
          name: main-web-deploy-${{ github.run_id }}
          path: nook-app

      - name: Setup Node for host Pages deploy
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Deploy isolated development applications to Cloudflare Pages
        id: deploy-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          CI_MAIN_VITE_BASE: ${{ env.CI_MAIN_VITE_BASE }}
          CI_MAIN_VITE_VAULT_SYNC_INTERVAL_MS: ${{ env.CI_MAIN_VITE_VAULT_SYNC_INTERVAL_MS }}
          NOOK_WRANGLER_VERSION: "4.120.0"
        run: bash .github/scripts/ci-main-deploy-development.sh

      - name: Configure and verify isolated development domains
        id: configure-dev-domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          DEV_DOMAIN: ${{ env.CI_MAIN_DEV_DOMAIN }}
          SIMPLE_DOMAIN: ${{ env.CI_MAIN_SIMPLE_DOMAIN }}
          SENTINEL_DOMAIN: ${{ env.CI_MAIN_SENTINEL_DOMAIN }}
          SITE_PAGES_URL: ${{ steps.deploy-dev.outputs.site_pages_url }}
          SIMPLE_PAGES_URL: ${{ steps.deploy-dev.outputs.simple_pages_url }}
          SENTINEL_PAGES_URL: ${{ steps.deploy-dev.outputs.sentinel_pages_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash .github/scripts/ci-main-configure-dev-domains.sh

      - name: Record development deployment
        uses: actions/github-script@v9
        env:
          DEV_URL: ${{ steps.configure-dev-domain.outputs.dev_url }}
          SIMPLE_URL: ${{ steps.configure-dev-domain.outputs.simple_url }}
          SENTINEL_URL: ${{ steps.configure-dev-domain.outputs.sentinel_url }}
          EXTENSION_URL: ${{ steps.configure-dev-domain.outputs.extension_url }}
          SITE_PAGES_URL: ${{ steps.deploy-dev.outputs.site_pages_url }}
          SIMPLE_PAGES_URL: ${{ steps.deploy-dev.outputs.simple_pages_url }}
          SENTINEL_PAGES_URL: ${{ steps.deploy-dev.outputs.sentinel_pages_url }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'development',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: false,
              description: 'Development channel',
              payload: {
                dev_url: process.env.DEV_URL,
                simple_url: process.env.SIMPLE_URL,
                sentinel_url: process.env.SENTINEL_URL,
                extension_url: process.env.EXTENSION_URL,
                site_pages_url: process.env.SITE_PAGES_URL,
                simple_pages_url: process.env.SIMPLE_PAGES_URL,
                sentinel_pages_url: process.env.SENTINEL_PAGES_URL,
              },
            })

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'development',
              environment_url: process.env.DEV_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Development channel deployed to Cloudflare Pages',
              auto_inactive: false,
            })

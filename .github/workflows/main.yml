# Main branch: keep one active run plus only the newest pending revision, then serialize the
# native, WASM, and web cache-writing lanes so each verifies read-only and exports its
# already-solved local graph without competing uploads. After the verified
# WASM handoff, local-provider web e2e, extension e2e, and headless UI demos overlap on separate
# read-only hosted runners. Deploy the fast, unoptimized development channel to Cloudflare
# Pages only after web verify and web e2e succeed; extension e2e and UI demos remain required
# for the workflow but do not gate the development deploy. Immutable releases remain
# responsible for production wasm optimization.
# Research-only changes are handled by web-research.yml. Cortex, Cursor, and
# agentic-AI-only changes do not need the product pipeline. A trusted
# workflow_run collector records each attempt in meta-secret/nook-workbench.
#
# E2e on main uses the unified stub `e2e` project (no GitHub API). Live sync
# provider tests remain available through the manually dispatched e2e-pr.yml.
#
# Playwright browsers are pre-installed in the web e2e base image.
# Main's trusted Rust/WASM producers receive fixed-ID SeaweedFS sccache secret mounts and publish
# verified BuildKit layers to private Zot. PR, release, and browser-only jobs remain secret-free.

name: Main

on:
  push:
    branches: [main]
    paths-ignore:
      - .cortex/**
      - .cursor/**
      - .github/workflows/web-research.yml
      - agentic-ai/**
      - nook-app/nook-web/nook-web-research/**

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main
  # Finish the active cache-writing run. GitHub keeps only the newest pending Main revision,
  # coalescing a burst of agent merges without interrupting verified cache publication.
  cancel-in-progress: false

env:
  DOCKER_IMAGE: nook-web:run-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_E2E_IMAGE: nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
  CI_MAIN_DEV_DOMAIN: dev.nokey.sh
  CI_MAIN_DEV_URL: https://dev.nokey.sh
  CI_MAIN_SIMPLE_DOMAIN: simple.dev.nokey.sh
  CI_MAIN_SIMPLE_URL: https://simple.dev.nokey.sh
  CI_MAIN_SENTINEL_DOMAIN: sentinel.dev.nokey.sh
  CI_MAIN_SENTINEL_URL: https://sentinel.dev.nokey.sh
  CI_MAIN_VITE_BASE: /
  CI_MAIN_VITE_VAULT_SYNC_INTERVAL_MS: "500"
  LINEAR_UI_DEMO_LABEL_ID: 3d5eaced-687d-4d93-a046-92f5008f584d
  LINEAR_UI_DEMO_PROJECT_ID: 07e407b4-3dca-4caa-8c1f-479b6b065503
  LINEAR_UI_DEMO_TEAM_ID: fb81b5b7-ce24-447e-8673-63ec37c64983

jobs:
  rust:
    name: Native Rust verification
    # Main refreshes the default-branch GHA native cache that new PRs are allowed to restore.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
      - name: Native Rust format, tests, and coverage
        run: task ci:pr:rust CI_ARTIFACT_DIR=${{ runner.temp }}/nook-ci-artifacts/rust
        env:
          CI: true
          # Verify the complete native graph before refreshing any shared Main cache scope.
          GHA_CACHE_WRITE_ENABLED: ""
          GIT_COMMIT_ID: ${{ github.sha }}
          NOOK_SIMPLE_VAULT_URL: ${{ env.CI_MAIN_SIMPLE_URL }}/
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}
          NOOK_EXTENSION_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}/
          WASM_BUILD_MODE: dev

      - name: Export commit-keyed nook-core/auth coverage
        env:
          COVERAGE_SOURCE_DIR: ${{ runner.temp }}/nook-ci-artifacts/rust
          COMMIT_SHA: ${{ github.sha }}
        run: task ci:main:stage-coverage

      - name: Upload commit-keyed nook-core/auth coverage
        uses: actions/upload-artifact@v7
        with:
          name: nook-core-auth-coverage-${{ github.sha }}
          path: coverage/main
          retention-days: 90
          if-no-files-found: error

      - name: Publish verified native BuildKit cache
        run: task ci:main:publish-native-cache
        env:
          CI: true
          GHA_CACHE_WRITE_ENABLED: "1"
          WASM_BUILD_MODE: dev

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  wasm:
    name: WASM verification and artifact
    # Serialize hosted cache uploads after native verification while retaining the producer's
    # job-scoped builder for a no-rebuild export.
    needs: [rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
      - name: WASM clippy, build, and package export
        run: task ci:pr:wasm CI_ARTIFACT_DIR=${{ runner.temp }}/nook-ci-artifacts/joined
        env:
          CI: true
          # Node verification below must succeed before this builder may publish shared scopes.
          GHA_CACHE_WRITE_ENABLED: ""
          GIT_COMMIT_ID: ${{ github.sha }}
          NOOK_SIMPLE_VAULT_URL: ${{ env.CI_MAIN_SIMPLE_URL }}/
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}
          NOOK_EXTENSION_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}/
          WASM_BUILD_MODE: dev

      - name: Stamp WASM run attempt
        run: echo "$GITHUB_RUN_ATTEMPT" > "${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm/nook-run-attempt"

      - name: Upload WASM handoff
        uses: actions/upload-artifact@v7
        with:
          name: main-wasm-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: WASM Node tests
        run: task ci:wasm:node-test
        env:
          CI: true
          GHA_CACHE_WRITE_ENABLED: ""
          GIT_COMMIT_ID: ${{ github.sha }}
          NOOK_SIMPLE_VAULT_URL: ${{ env.CI_MAIN_SIMPLE_URL }}/
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}
          NOOK_EXTENSION_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}/
          WASM_BUILD_MODE: dev

      - name: Publish verified WASM BuildKit cache
        run: task ci:main:publish-wasm-cache
        env:
          CI: true
          GHA_CACHE_WRITE_ENABLED: "1"
          WASM_BUILD_MODE: dev

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  web:
    name: Verify web build
    needs: [wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
      - name: Download verified WASM handoff
        uses: actions/download-artifact@v8
        with:
          name: main-wasm-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm

      - name: Svelte checks, JS unit tests, lint, and web build
        run: >-
          task ci:main:web:artifacts
          CI_ARTIFACT_DIR=${{ runner.temp }}/nook-ci-artifacts/joined
          VITE_BASE=${{ env.CI_MAIN_VITE_BASE }}
          VITE_SITE_URL=${{ env.CI_MAIN_DEV_URL }}
          VITE_PUBLIC_APP_URL=${{ env.CI_MAIN_DEV_URL }}
          VITE_SIMPLE_APP_URL=${{ env.CI_MAIN_SIMPLE_URL }}
          VITE_SENTINEL_APP_URL=${{ env.CI_MAIN_SENTINEL_URL }}
          WASM_BUILD_MODE=dev
        env:
          CI: true
          # Keep verification read-only; publish the already-solved dependency graph afterward.
          GHA_CACHE_WRITE_ENABLED: ""
          GIT_COMMIT_ID: ${{ github.sha }}
          NOOK_SIMPLE_VAULT_URL: ${{ env.CI_MAIN_SIMPLE_URL }}/
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}
          NOOK_EXTENSION_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}/

      - name: Publish verified web BuildKit cache
        run: task ci:main:publish-web-cache
        env:
          CI: true
          GHA_CACHE_WRITE_ENABLED: "1"
          WASM_BUILD_MODE: dev

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  web-e2e:
    name: Web e2e
    needs: [wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
      - name: Download verified WASM handoff
        uses: actions/download-artifact@v8
        with:
          name: main-wasm-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm

      - name: Local-provider web e2e
        run: >-
          task ci:main:e2e:web:artifacts
          CI_ARTIFACT_DIR=${{ runner.temp }}/nook-ci-artifacts/joined
          VITE_VAULT_SYNC_INTERVAL_MS=${{ env.CI_MAIN_VITE_VAULT_SYNC_INTERVAL_MS }}
          VITE_BASE=${{ env.CI_MAIN_VITE_BASE }}
          VITE_SITE_URL=${{ env.CI_MAIN_DEV_URL }}
          VITE_PUBLIC_APP_URL=${{ env.CI_MAIN_DEV_URL }}
          VITE_SIMPLE_APP_URL=${{ env.CI_MAIN_SIMPLE_URL }}
          VITE_SENTINEL_APP_URL=${{ env.CI_MAIN_SENTINEL_URL }}
          WASM_BUILD_MODE=dev
        env:
          CI: true
          GHA_CACHE_WRITE_ENABLED: ""
          GIT_COMMIT_ID: ${{ github.sha }}
          NOOK_SIMPLE_VAULT_URL: ${{ env.CI_MAIN_SIMPLE_URL }}/
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}
          NOOK_EXTENSION_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}/

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  extension-e2e:
    name: Extension e2e
    needs: [wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          cache-write: "false"

      - name: Download verified WASM handoff
        uses: actions/download-artifact@v8
        with:
          name: main-wasm-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm

      - name: Extension e2e
        run: >-
          task ci:main:e2e:extension:artifacts
          CI_ARTIFACT_DIR=${{ runner.temp }}/nook-ci-artifacts/joined
          VITE_VAULT_SYNC_INTERVAL_MS=${{ env.CI_MAIN_VITE_VAULT_SYNC_INTERVAL_MS }}
          VITE_BASE=${{ env.CI_MAIN_VITE_BASE }}
          VITE_SITE_URL=${{ env.CI_MAIN_DEV_URL }}
          VITE_PUBLIC_APP_URL=${{ env.CI_MAIN_DEV_URL }}
          VITE_SIMPLE_APP_URL=${{ env.CI_MAIN_SIMPLE_URL }}
          VITE_SENTINEL_APP_URL=${{ env.CI_MAIN_SENTINEL_URL }}
          WASM_BUILD_MODE=dev
        env:
          CI: true
          GIT_COMMIT_ID: ${{ github.sha }}
          NOOK_SIMPLE_VAULT_URL: ${{ env.CI_MAIN_SIMPLE_URL }}/
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}
          NOOK_EXTENSION_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}/

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  ui-demos:
    name: UI demos
    needs: [wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          cache-write: "false"

      - name: Download verified WASM handoff
        uses: actions/download-artifact@v8
        with:
          name: main-wasm-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm

      - name: Headless UI demos
        id: record-ui-demo
        env:
          UI_DEMO_OUTPUT_DIR: ${{ runner.temp }}/nook-ui-demo

          CI: true
          GIT_COMMIT_ID: ${{ github.sha }}
          NOOK_SIMPLE_VAULT_URL: ${{ env.CI_MAIN_SIMPLE_URL }}/
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}
          NOOK_EXTENSION_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}/
        run: >-
          task ci:main:ui-demo:artifacts
          CI_ARTIFACT_DIR=${{ runner.temp }}/nook-ci-artifacts/joined
          UI_DEMO_OUTPUT_DIR=${{ runner.temp }}/nook-ui-demo
          VITE_BASE=${{ env.CI_MAIN_VITE_BASE }}
          VITE_SITE_URL=${{ env.CI_MAIN_DEV_URL }}
          VITE_PUBLIC_APP_URL=${{ env.CI_MAIN_DEV_URL }}
          VITE_SIMPLE_APP_URL=${{ env.CI_MAIN_SIMPLE_URL }}
          VITE_SENTINEL_APP_URL=${{ env.CI_MAIN_SENTINEL_URL }}
          WASM_BUILD_MODE=dev

      - name: Upload complete Main UI demo artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-demo-main-${{ github.sha }}
          path: ${{ runner.temp }}/nook-ui-demo
          retention-days: 90
          if-no-files-found: warn
          overwrite: true

      - name: Publish largest Main UI demos to the merged PR issue
        if: steps.record-ui-demo.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          UI_DEMO_OUTPUT_DIR: ${{ runner.temp }}/nook-ui-demo
        with:
          retries: 3
          script: |
            if (!process.env.LINEAR_API_KEY) {
              core.warning('LINEAR_API_KEY is unavailable; keeping the GitHub Actions artifact only')
              return
            }

            const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: context.sha,
            })
            const pullRequest =
              pulls.data.find((candidate) => candidate.merge_commit_sha === context.sha) ??
              pulls.data.find((candidate) => candidate.merged_at)
            if (!pullRequest) {
              core.warning('No merged pull request is associated with this Main commit')
              return
            }

            const { syncUiDemoIssue, transitionUiDemoIssue } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/linear-ui-demo.cjs`,
            )
            const config = {
              labelId: process.env.LINEAR_UI_DEMO_LABEL_ID,
              projectId: process.env.LINEAR_UI_DEMO_PROJECT_ID,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              teamId: process.env.LINEAR_UI_DEMO_TEAM_ID,
            }
            const issue = await syncUiDemoIssue({
              apiKey: process.env.LINEAR_API_KEY,
              config,
              demoDir: process.env.UI_DEMO_OUTPUT_DIR,
              maxVideos: 10,
              pullRequest: {
                headSha: context.sha,
                number: pullRequest.number,
                runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                specs: 'all UI demo specs on Main',
                title: pullRequest.title,
                url: pullRequest.html_url,
              },
            })
            await transitionUiDemoIssue({
              apiKey: process.env.LINEAR_API_KEY,
              config,
              merged: true,
              prNumber: pullRequest.number,
            })
            core.info(`Published Main UI demos to ${issue.identifier}: ${issue.url}`)

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  deploy:
    name: Deploy development
    needs: [web, web-e2e]
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.nokey.sh/
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          cache-write: "false"

      - name: Download verified WASM handoff
        uses: actions/download-artifact@v8
        with:
          name: main-wasm-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm

      - name: Build sealed web image for development deploy
        run: >-
          task ci:main:web:artifacts
          CI_ARTIFACT_DIR=${{ runner.temp }}/nook-ci-artifacts/joined
          VITE_BASE=${{ env.CI_MAIN_VITE_BASE }}
          VITE_SITE_URL=${{ env.CI_MAIN_DEV_URL }}
          VITE_PUBLIC_APP_URL=${{ env.CI_MAIN_DEV_URL }}
          VITE_SIMPLE_APP_URL=${{ env.CI_MAIN_SIMPLE_URL }}
          VITE_SENTINEL_APP_URL=${{ env.CI_MAIN_SENTINEL_URL }}
          WASM_BUILD_MODE=dev
        env:
          CI: true
          GIT_COMMIT_ID: ${{ github.sha }}
          NOOK_SIMPLE_VAULT_URL: ${{ env.CI_MAIN_SIMPLE_URL }}/
          NOOK_EXTENSION_CHANNEL: development
          NOOK_EXTENSION_COMMIT: ${{ github.sha }}
          NOOK_EXTENSION_SITE_URL: ${{ env.CI_MAIN_DEV_URL }}/

      - name: Deploy isolated development applications to Cloudflare Pages
        id: deploy-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          CI_MAIN_VITE_BASE: ${{ env.CI_MAIN_VITE_BASE }}
          CI_MAIN_VITE_VAULT_SYNC_INTERVAL_MS: ${{ env.CI_MAIN_VITE_VAULT_SYNC_INTERVAL_MS }}
        run: task ci:main:deploy-development

      - name: Configure and verify isolated development domains
        id: configure-dev-domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          DEV_DOMAIN: ${{ env.CI_MAIN_DEV_DOMAIN }}
          SIMPLE_DOMAIN: ${{ env.CI_MAIN_SIMPLE_DOMAIN }}
          SENTINEL_DOMAIN: ${{ env.CI_MAIN_SENTINEL_DOMAIN }}
          SITE_PAGES_URL: ${{ steps.deploy-dev.outputs.site_pages_url }}
          SIMPLE_PAGES_URL: ${{ steps.deploy-dev.outputs.simple_pages_url }}
          SENTINEL_PAGES_URL: ${{ steps.deploy-dev.outputs.sentinel_pages_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: task ci:main:configure-dev-domains

      - name: Record development deployment
        uses: actions/github-script@v9
        env:
          DEV_URL: ${{ steps.configure-dev-domain.outputs.dev_url }}
          SIMPLE_URL: ${{ steps.configure-dev-domain.outputs.simple_url }}
          SENTINEL_URL: ${{ steps.configure-dev-domain.outputs.sentinel_url }}
          EXTENSION_URL: ${{ steps.configure-dev-domain.outputs.extension_url }}
          SITE_PAGES_URL: ${{ steps.deploy-dev.outputs.site_pages_url }}
          SIMPLE_PAGES_URL: ${{ steps.deploy-dev.outputs.simple_pages_url }}
          SENTINEL_PAGES_URL: ${{ steps.deploy-dev.outputs.sentinel_pages_url }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'development',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: false,
              description: 'Development channel',
              payload: {
                dev_url: process.env.DEV_URL,
                simple_url: process.env.SIMPLE_URL,
                sentinel_url: process.env.SENTINEL_URL,
                extension_url: process.env.EXTENSION_URL,
                site_pages_url: process.env.SITE_PAGES_URL,
                simple_pages_url: process.env.SIMPLE_PAGES_URL,
                sentinel_pages_url: process.env.SENTINEL_PAGES_URL,
              },
            })

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'development',
              environment_url: process.env.DEV_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Development channel deployed to Cloudflare Pages',
              auto_inactive: false,
            })
      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

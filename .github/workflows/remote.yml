# Focused, manually dispatched development tasks on the configured runner pool.
#
# This workflow is an allowlisted remote execution surface, not an arbitrary
# credential-bearing shell. Complete merge validation remains in pr.yml and is
# explicitly requested with task pr:validate.

name: Remote task
run-name: Remote / ${{ inputs.tasks || inputs.task }} / ${{ inputs.dispatch_nonce || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated allowlisted Taskfile commands
        required: false
        type: string
      task:
        description: Legacy single task or internal cache promotion selector
        required: false
        type: string
      cache_fingerprint:
        description: Rust dependency candidate fingerprint (promotion task only)
        required: false
        type: string
      cache_candidate:
        description: Rust dependency candidate nonce (promotion task only)
        required: false
        type: string
      cache_source_sha:
        description: Exact committed source for fingerprint verification (promotion task only)
        required: false
        type: string
      dispatch_nonce:
        description: Caller correlation nonce for an exact workflow dispatch
        required: false
        type: string
      runner_label:
        description: Optional exact ARC runner route for operator smoke validation
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: remote-${{ github.ref }}-${{ inputs.tasks || inputs.task }}-${{ inputs.dispatch_nonce || 'default' }}
  cancel-in-progress: false

env:
  CI: true
  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
  DOCKER_IMAGE: nook-web:remote-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_E2E_IMAGE: nook-web-e2e:remote-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  batch:
    if: >-
      (inputs.tasks != '' && inputs.task != '') ||
      ((inputs.task != 'rust-cache:promote' || inputs.tasks != '') &&
      (inputs.tasks || inputs.task) != 'web:build' &&
      (inputs.tasks || inputs.task) != 'web:e2e' &&
      (inputs.tasks || inputs.task) != 'extension:check:fast' &&
      (inputs.tasks || inputs.task) != 'extension:e2e' &&
      (inputs.tasks || inputs.task) != 'check' &&
      (inputs.tasks || inputs.task) != 'ci:pr' &&
      (inputs.tasks || inputs.task) != 'ci:pr:e2e')
    name: Remote / ${{ inputs.tasks || inputs.task }}
    # Focused ARC selections use the persistent BuildKit shard on their node.
    runs-on: ${{ (inputs.runner_label == 'nook-k0s-hive' || contains(format(',{0},', inputs.tasks || inputs.task), ',hive:verify,')) && (vars.NOOK_HIVE_RUNS_ON || 'nook-k0s-hive') || (vars.NOOK_RUNS_ON || 'nook-k0s') }}
    timeout-minutes: 360
    env:
      REQUESTED_REMOTE_BATCH: ${{ inputs.tasks }}
      REQUESTED_REMOTE_TASK: ${{ inputs.task }}
      REQUESTED_REMOTE_TASKS: ${{ inputs.tasks || inputs.task }}
      REQUESTED_RUNNER_LABEL: ${{ inputs.runner_label }}
      REQUEST_INCLUDES_HIVE: ${{ contains(format(',{0},', inputs.tasks || inputs.task), ',hive:verify,') && 'true' || 'false' }}
      HIVE_CACHE_FROM: ${{ contains(format(',{0},', inputs.tasks || inputs.task), ',hive:verify,') && 'type=registry,ref=registry.dev.nokey.sh/nook/buildcache/nook-hive-linux-amd64-v2:buildcache' || '' }}
      HIVE_NEO4J_TEST_URI: ${{ contains(format(',{0},', inputs.tasks || inputs.task), ',hive:verify,') && '127.0.0.1:7687' || '' }}
      HIVE_NEO4J_TEST_USERNAME: ${{ contains(format(',{0},', inputs.tasks || inputs.task), ',hive:verify,') && 'neo4j' || '' }}
      HIVE_NEO4J_TEST_PASSWORD: ${{ contains(format(',{0},', inputs.tasks || inputs.task), ',hive:verify,') && 'hive-integration-password' || '' }}
    steps:
      - name: Report Kubernetes worker node
        shell: bash
        run: |
          set -euo pipefail
          : "${KUBERNETES_NODE_NAME:?KUBERNETES_NODE_NAME is required}"
          printf '::notice title=Kubernetes worker::%s\n' "$KUBERNETES_NODE_NAME"
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ contains(format(',{0},', inputs.tasks || inputs.task), ',loom:verify,') && '0' || '1' }}
      - name: Validate batch request
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_REMOTE_BATCH" && -n "$REQUESTED_REMOTE_TASK" ]]; then
            echo "Set either tasks or task, not both." >&2
            exit 2
          fi
          case "$REQUESTED_RUNNER_LABEL" in
            ""|nook-k0s|nook-k0s-hive) ;;
            *) echo "Unsupported remote runner label: $REQUESTED_RUNNER_LABEL" >&2; exit 2 ;;
          esac
          case "$REQUESTED_RUNNER_LABEL:$REQUESTED_REMOTE_TASKS" in
            :*) ;;
            nook-k0s:preflight|nook-k0s:rust:ci|nook-k0s:loom:verify|nook-k0s:arc:runtime) ;;
            nook-k0s-hive:hive:verify) ;;
            *)
              echo "Remote runner label is incompatible with the requested task" >&2
              exit 2
              ;;
          esac
          .github/scripts/remote-task-batch.sh --validate "$REQUESTED_REMOTE_TASKS"
      - name: Install Task for Loom-only verification
        if: ${{ (inputs.tasks || inputs.task) == 'loom:verify' }}
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0
      - name: Install Rust for Loom verification
        if: ${{ contains(format(',{0},', inputs.tasks || inputs.task), ',loom:verify,') || (inputs.tasks || inputs.task) == 'agent-stats:inventory' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Bun for Loom verification
        if: ${{ contains(format(',{0},', inputs.tasks || inputs.task), ',loom:verify,') || (inputs.tasks || inputs.task) == 'agent-stats:inventory' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: taiki-e/install-action@nextest
        if: ${{ (inputs.tasks || inputs.task) == 'agent-stats:inventory' }}
      - if: ${{ (inputs.tasks || inputs.task) == 'agent-stats:inventory' }}
        run: sudo -n apt-get update -qq && sudo -n apt-get install -y -qq --no-install-recommends build-essential mold && bun install --cwd agentic-ai/loom --frozen-lockfile && bun install --cwd nook-app/nook-web/nook-web-app --frozen-lockfile
      - uses: ./.github/actions/nook-docker-setup
        if: ${{ (inputs.tasks || inputs.task) != 'loom:verify' && (inputs.tasks || inputs.task) != 'agent-stats:inventory' }}
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_REMOTE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_REMOTE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_REMOTE_BUCKET }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: ${{ (inputs.tasks || inputs.task) == 'hive:verify' && 'false' || 'true' }}
      - name: Verify Loom command tools
        if: ${{ contains(format(',{0},', inputs.tasks || inputs.task), ',loom:verify,') }}
        run: |
          command -v task
          command -v bun
          command -v cargo
      - name: Wait for private Neo4j sidecar
        if: ${{ env.REQUEST_INCLUDES_HIVE == 'true' }}
        run: .github/scripts/wait-hive-neo4j.sh
      - name: Run allowlisted task batch
        shell: bash
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/nook-e2e-artifacts
        run: .github/scripts/remote-task-batch.sh --run "$REQUESTED_REMOTE_TASKS"
      - uses: actions/upload-artifact@v7
        if: ${{ (inputs.tasks || inputs.task) == 'agent-stats:inventory' }}
        with:
          name: test-inventory-${{ github.sha }}
          path: test-inventory.json
      - name: Preserve Playwright diagnostics
        if: always() && (contains(inputs.tasks, 'e2e') || contains(inputs.task, 'e2e'))
        uses: actions/upload-artifact@v7
        with:
          name: remote-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nook-e2e-artifacts
          if-no-files-found: warn
          retention-days: 15
  web-e2e-image:
    if: >-
      (inputs.tasks == '' || inputs.task == '') &&
      ((inputs.tasks || inputs.task) == 'web:build' ||
      (inputs.tasks || inputs.task) == 'web:e2e' ||
      (inputs.tasks || inputs.task) == 'extension:check:fast' ||
      (inputs.tasks || inputs.task) == 'extension:e2e' ||
      (inputs.tasks || inputs.task) == 'check' ||
      (inputs.tasks || inputs.task) == 'ci:pr' ||
      (inputs.tasks || inputs.task) == 'ci:pr:e2e')
    name: Remote / browser image
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 30
    env:
      DOCKER_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_E2E_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_REMOTE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_REMOTE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_REMOTE_BUCKET }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: "true"
      - name: Run repository invariant preflight
        if: >-
          (inputs.tasks || inputs.task) == 'check' ||
          (inputs.tasks || inputs.task) == 'ci:pr' ||
          (inputs.tasks || inputs.task) == 'ci:pr:e2e'
        run: task preflight
      - name: Build exact-source Kubernetes job image
        run: task web:e2e:kubernetes-image

  web-e2e:
    if: >-
      (inputs.tasks == '' || inputs.task == '') &&
      ((inputs.tasks || inputs.task) == 'web:build' ||
      (inputs.tasks || inputs.task) == 'web:e2e' ||
      (inputs.tasks || inputs.task) == 'extension:check:fast' ||
      (inputs.tasks || inputs.task) == 'extension:e2e' ||
      (inputs.tasks || inputs.task) == 'check' ||
      (inputs.tasks || inputs.task) == 'ci:pr' ||
      (inputs.tasks || inputs.task) == 'ci:pr:e2e')
    needs: web-e2e-image
    name: Remote / web:e2e
    runs-on: nook-k0s-container
    timeout-minutes: 30
    container:
      image: registry.dev.nokey.sh/nook/remote-buildcache/nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
    env:
      CI: "1"
    steps:
      - name: Run selected task without a nested container runtime
        working-directory: /meta-secret/nook
        env:
          REMOTE_CONTAINER_TASK: ${{ inputs.tasks || inputs.task }}
        run: |
          set -euo pipefail
          case "$REMOTE_CONTAINER_TASK" in
            web:build) task _web:build ;;
            web:e2e) task _web:test:e2e ;;
            extension:check:fast) task extension:check:fast ;;
            extension:e2e) task _extension:test:e2e ;;
            check) task _check ;;
            ci:pr) task _ci:pr ;;
            ci:pr:e2e) task _ci:main ;;
            *) echo "Unsupported Kubernetes container task: $REMOTE_CONTAINER_TASK" >&2; exit 2 ;;
          esac

      - name: Collect Playwright diagnostics
        if: always()
        working-directory: /meta-secret/nook
        run: |
          artifact_dir="$GITHUB_WORKSPACE/e2e-artifacts"
          mkdir -p "$artifact_dir/web" "$artifact_dir/extension"
          cp -R nook-app/nook-web/nook-web-app/test-results/. "$artifact_dir/web/" 2>/dev/null || true
          cp -R nook-app/nook-web/nook-web-extension/test-results/. "$artifact_dir/extension/" 2>/dev/null || true
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 15

  rust-cache-promote:
    if: inputs.task == 'rust-cache:promote' && inputs.tasks == ''
    name: Remote / rust-cache:promote
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.cache_source_sha }}
          path: candidate-source
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.3
      - uses: docker/login-action@v3
        with:
          registry: registry.dev.nokey.sh
          username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
      - name: Validate and promote candidate
        env:
          NOOK_REGISTRY_CACHE_HOST: registry.dev.nokey.sh
          PROMOTION_FINGERPRINT: ${{ inputs.cache_fingerprint }}
          PROMOTION_CANDIDATE: ${{ inputs.cache_candidate }}
          PROMOTION_SOURCE_SHA: ${{ inputs.cache_source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate-source rev-parse HEAD)" = "$PROMOTION_SOURCE_SHA"
          committed_fingerprint="$(
            NOOK_RUST_DEPS_FINGERPRINT_ROOT="$GITHUB_WORKSPACE/candidate-source" \
              bash .github/scripts/rust-deps-cache-fingerprint.sh
          )"
          test "$committed_fingerprint" = "$PROMOTION_FINGERPRINT"
          bash .github/scripts/rust-deps-cache-promote.sh "$PROMOTION_FINGERPRINT" "$PROMOTION_CANDIDATE"

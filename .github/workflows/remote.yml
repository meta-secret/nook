# Focused, manually dispatched development tasks on GitHub-hosted runners.
#
# This workflow is an allowlisted remote execution surface, not an arbitrary
# credential-bearing shell. Complete merge validation remains in pr.yml and is
# explicitly requested with task pr:validate.

name: Remote task

on:
  workflow_dispatch:
    inputs:
      task:
        description: Allowlisted Taskfile command
        required: true
        type: choice
        options:
          - preflight
          - rust:test
          - rust:lint
          - rust:coverage
          - wasm:build
          - wasm:test
          - wasm:test:browser
          - web:check
          - web:test
          - web:build
          - web:e2e
          - extension:check
          - extension:e2e
          - hive:verify
          - check
          - ci:pr
          - ci:pr:e2e

permissions:
  actions: read
  contents: read

concurrency:
  # Dependency refs are shared by a branch while source-sensitive refs are additionally
  # task-scoped. Serialize writers so compatible dependency exports cannot race.
  group: remote-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOCKER_IMAGE: nook-web:remote-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_E2E_IMAGE: nook-web-e2e:remote-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  preflight:
    if: inputs.task == 'preflight'
    name: Remote / preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_REMOTE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_REMOTE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_REMOTE_BUCKET }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: "true"
      - run: task preflight

  rust-test:
    if: inputs.task == 'rust:test'
    name: Remote / rust:test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

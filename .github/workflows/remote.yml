# Focused, manually dispatched development tasks on the configured runner pool.
#
# This workflow executes named Task targets on the configured remote runner
# pool. Complete merge validation remains in pr.yml and is explicitly
# requested with task pr:validate.

name: Remote task
run-name: Remote / ${{ inputs.tasks || inputs.task }} @ ${{ inputs.source_sha || github.sha }} / compile-cache=${{ inputs.publish_compile_cache && 'publish' || 'read-only' }} / ${{ inputs.dispatch_nonce || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated Task targets
        required: false
        type: string
      task:
        description: Legacy single task or internal cache promotion selector
        required: false
        type: string
      source_sha:
        description: Exact committed source to compile; required for the feature build:compile route
        required: false
        type: string
      deployment_tag:
        description: Safe Cloudflare Pages preview deployment tag (only for ci:pr:deploy-and-verify-previews)
        required: false
        type: string
      publish_compile_cache:
        description: Publish build:compile BuildKit caches (sccache remains enabled when secrets are available)
        required: false
        type: boolean
        default: true
      dispatch_nonce:
        description: Caller correlation nonce for an exact workflow dispatch
        required: false
        type: string
      runner_label:
        description: Optional exact ARC runner route for operator smoke validation
        required: false
        type: string
      e2e_project:
        description: Playwright project for web:e2e:debug
        required: false
        type: string
      e2e_specs:
        description: Comma-separated Playwright spec files for web:e2e:debug
        required: false
        type: string
      e2e_grep:
        description: Optional Playwright title regular expression for web:e2e:debug
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: remote-${{ github.ref }}-${{ inputs.tasks || inputs.task }}-${{ inputs.dispatch_nonce || 'default' }}
  cancel-in-progress: false

env:
  CI: true
  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
  DOCKER_IMAGE: nook-web:remote-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_E2E_IMAGE: nook-web-e2e:remote-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  batch:
    if: >-
      (inputs.publish_compile_cache == false &&
      (inputs.tasks || inputs.task) != 'build:compile') ||
      (inputs.tasks != '' && inputs.task != '') ||
      ((inputs.tasks || inputs.task) != 'web:verify' &&
      (inputs.tasks || inputs.task) != 'web:build' &&
      (inputs.tasks || inputs.task) != 'web:e2e' &&
      (inputs.tasks || inputs.task) != 'web:e2e:debug' &&
      (inputs.tasks || inputs.task) != 'extension:e2e' &&
      (inputs.tasks || inputs.task) != 'check' &&
      (inputs.tasks || inputs.task) != 'ci:pr' &&
      (inputs.tasks || inputs.task) != 'ci:pr:e2e' &&
      (inputs.tasks || inputs.task) != 'ci:pr:deploy-and-verify-previews')
    name: Remote / ${{ inputs.tasks || inputs.task }}
    # Focused ARC selections use the persistent BuildKit shard on their node.
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: ${{ (inputs.tasks || inputs.task) == 'build:compile' && 5 || 360 }}
    env:
      REQUESTED_REMOTE_BATCH: ${{ inputs.tasks }}
      REQUESTED_REMOTE_TASK: ${{ inputs.task }}
      REQUESTED_REMOTE_TASKS: ${{ inputs.tasks || inputs.task }}
      REQUESTED_RUNNER_LABEL: ${{ inputs.runner_label }}
      REQUESTED_PUBLISH_COMPILE_CACHE: ${{ inputs.publish_compile_cache }}
      SCCACHE_S3_RW_MODE: READ_WRITE
    steps:
      - name: Report Kubernetes worker node
        shell: bash
        run: |
          set -euo pipefail
          : "${KUBERNETES_NODE_NAME:?KUBERNETES_NODE_NAME is required}"
          printf '::notice title=Kubernetes worker::%s\n' "$KUBERNETES_NODE_NAME"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact remote source
        env:
          REQUESTED_SOURCE_INPUT: ${{ inputs.source_sha }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          REQUESTED_REMOTE_TASKS: ${{ inputs.tasks || inputs.task }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Remote execution requires a 40-character exact source SHA." >&2
            exit 2
          fi
          if [ "$(git rev-parse HEAD)" != "$REQUESTED_SOURCE_SHA" ]; then
            echo "Remote checkout drifted from the requested source SHA." >&2
            exit 2
          fi
          if [[ "$REQUESTED_REMOTE_TASKS" == *build:compile* ]]; then
            if [ -z "$REQUESTED_SOURCE_INPUT" ]; then
              echo "build:compile requires source_sha from the pushed feature dispatch." >&2
              exit 2
            fi
            if [ "$REQUESTED_REMOTE_TASKS" != "build:compile" ]; then
              echo "build:compile must be dispatched as the only remote task." >&2
              exit 2
            fi
            if [ "${GITHUB_REF_NAME:-}" = "main" ] || [ "${GITHUB_REF_NAME:-}" = "dev" ]; then
              echo "build:compile is allowed only from a feature branch, never main or dev." >&2
              exit 2
            fi
            case "$REQUESTED_PUBLISH_COMPILE_CACHE" in
              true|false) ;;
              *)
                echo "build:compile requires publish_compile_cache=true or false." >&2
                exit 2
                ;;
            esac
          elif [ "$REQUESTED_PUBLISH_COMPILE_CACHE" != "true" ]; then
            echo "publish_compile_cache=false requires the build:compile task." >&2
            exit 2
          fi
      - name: Report task request
        shell: bash
        run: |
          set -euo pipefail
          printf 'Remote task name: %s\n' "$REQUESTED_REMOTE_TASKS"
      - uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          require-sccache: "true"
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: "true"
          publish-compile-cache: ${{ inputs.publish_compile_cache }}
      - name: Confirm prepared build-only environment
        if: (inputs.tasks || inputs.task) == 'build:compile'
        run: |
          set -euo pipefail
          [ "${GITHUB_ACTIONS:-}" = "true" ]
          : "${NOOK_PR_BUILDX_BUILDER:?Buildx builder was not prepared}"
          : "${NOOK_REGISTRY_CACHE_HOST:?Registry cache environment was not prepared}"
          : "${GHA_CACHE_ENABLED:?Cache environment was not prepared}"
          : "${NOOK_COMPILE_CACHE_MODE:?Compile cache mode was not prepared}"
          echo "Build-only route prepared Buildx=$NOOK_PR_BUILDX_BUILDER registry=$NOOK_REGISTRY_CACHE_HOST compile-cache=$NOOK_COMPILE_CACHE_MODE cache-write=${GHA_CACHE_WRITE_ENABLED:-disabled}"
      - name: Run task batch
        shell: bash
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/nook-e2e-artifacts
          DEPLOYMENT_TAG: ${{ (inputs.tasks || inputs.task) == 'ci:pr:deploy-and-verify-previews' && inputs.deployment_tag || '' }}
          HEAD_SHA: ${{ (inputs.tasks || inputs.task) == 'ci:pr:deploy-and-verify-previews' && (inputs.source_sha || github.sha) || '' }}
          CLOUDFLARE_API_TOKEN: ${{ (inputs.tasks || inputs.task) == 'ci:pr:deploy-and-verify-previews' && secrets.CLOUD_FLARE_PAGES_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ (inputs.tasks || inputs.task) == 'ci:pr:deploy-and-verify-previews' && secrets.CLOUD_FLARE_ACCOUNT_ID || '' }}
        run: .github/scripts/remote-task-batch.sh --run "$REQUESTED_REMOTE_TASKS"
      - name: Preserve compile cache telemetry
        if: always() && (inputs.tasks || inputs.task) == 'build:compile'
        uses: ./.github/actions/nook-cache-telemetry
        with:
          artifact-suffix: ${{ inputs.publish_compile_cache && 'compile-publish' || 'compile-no-buildkit-export' }}
      - name: Preserve Playwright diagnostics
        if: always() && (contains(inputs.tasks, 'e2e') || contains(inputs.task, 'e2e'))
        uses: actions/upload-artifact@v7
        with:
          name: remote-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nook-e2e-artifacts
          if-no-files-found: warn
          retention-days: 15

  pages-preview:
    if: >-
      inputs.publish_compile_cache != false &&
      (inputs.tasks == '' || inputs.task == '') &&
      (inputs.tasks || inputs.task) == 'ci:pr:deploy-and-verify-previews'
    name: Remote / Pages preview
    runs-on: nook-k0s-container
    timeout-minutes: 45
    container:
      # Keep the preview's native Rust toolchain on the repository-proxied,
      # digest-pinned Rust lineage used by product.Dockerfile. The ARC job
      # container owns rustc, cc/ar, and archive extraction on the Kubernetes
      # Pod; it does not require a nested runtime or host toolchain installs.
      image: registry.dev.nokey.sh/library/rust:1.97-trixie@sha256:3382bd20aa942806c533e9a73cd000474fb3ef173f71e684cc9b942675781769
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
    defaults:
      run:
        shell: bash
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust exact Actions workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Expose Actions Node.js runtime
        run: |
          set -euo pipefail
          if command -v node >/dev/null 2>&1; then
            node --version
            exit 0
          fi
          node_bin=/home/runner/externals/node24/bin/node
          test -x "$node_bin"
          echo "$(dirname "$node_bin")" >> "$GITHUB_PATH"
          "$node_bin" --version
      - name: Validate exact remote source
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Remote execution requires a 40-character exact source SHA." >&2
            exit 2
          fi
          if [ "$(git rev-parse HEAD)" != "$REQUESTED_SOURCE_SHA" ]; then
            echo "Remote checkout drifted from the requested source SHA." >&2
            exit 2
          fi
      - name: Connect host sccache
        env:
          INPUT_SCCACHE-ACCESS-KEY: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          INPUT_SCCACHE-SECRET-KEY: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          INPUT_SCCACHE-ENDPOINT: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          INPUT_SCCACHE-BUCKET: ${{ secrets.NOOK_SCCACHE_BUCKET }}
        run: node .github/actions/nook-cache-connect/main.js
      - name: Setup Bun for host Pages build
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Prepare writable host Rust directories
        run: |
          set -euo pipefail
          cargo_home="$RUNNER_TEMP/nook-cargo-home"
          cargo_target_dir="$RUNNER_TEMP/nook-cargo-target"
          wasm_pack_root="$RUNNER_TEMP/nook-wasm-pack"
          install -d -m 0755 "$cargo_home" "$cargo_target_dir" "$wasm_pack_root"
          {
            printf 'CARGO_HOME=%s\n' "$cargo_home"
            printf 'CARGO_TARGET_DIR=%s\n' "$cargo_target_dir"
            printf 'NOOK_WASM_PACK_ROOT=%s\n' "$wasm_pack_root"
          } >> "$GITHUB_ENV"
      - name: Prepare host sccache before Rust tooling install
        run: bash .github/scripts/ci-pr-native-pages-build.sh --prepare
      - name: Install pinned host WASM tooling
        run: |
          set -euo pipefail
          cargo install wasm-pack --version 0.15.0 --locked --root "$NOOK_WASM_PACK_ROOT"
          printf '%s/bin\n' "$NOOK_WASM_PACK_ROOT" >> "$GITHUB_PATH"
      - name: Install host WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Prepare native Pages preview artifacts
        env:
          DEPLOYMENT_TAG: ${{ inputs.deployment_tag }}
          HEAD_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          export CI=1
          export GIT_COMMIT_ID="$HEAD_SHA"
          export NOOK_EXTENSION_COMMIT="$HEAD_SHA"
          export NOOK_EXTENSION_CHANNEL="pr-$DEPLOYMENT_TAG"
          export NOOK_EXTENSION_SITE_URL="https://pr-$DEPLOYMENT_TAG.nokey-sh.pages.dev/"
          export NOOK_SIMPLE_VAULT_URL="https://pr-$DEPLOYMENT_TAG.nokey-simple.pages.dev/"
          export VITE_BASE=/
          export VITE_SITE_URL="https://pr-$DEPLOYMENT_TAG.nokey-sh.pages.dev"
          export VITE_PUBLIC_APP_URL="https://pr-$DEPLOYMENT_TAG.nook-1n8.pages.dev"
          export VITE_SIMPLE_APP_URL="https://pr-$DEPLOYMENT_TAG.nokey-simple.pages.dev"
          export VITE_SENTINEL_APP_URL="https://pr-$DEPLOYMENT_TAG.nokey-sentinel.pages.dev"
          export WASM_BUILD_MODE=dev

          bash .github/scripts/ci-pr-native-pages-build.sh

          for required in \
            "nook-app/nook-web/nook-web-app/dist" \
            "nook-app/nook-web/nook-web-app/dist/site" \
            "nook-app/nook-web/nook-vault-simple/dist" \
            "nook-app/nook-web/nook-vault-sentinel/dist"; do
            test -d "$required"
          done
      - name: Deploy and verify Pages previews
        id: deploy-all
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          DEPLOYMENT_TAG: ${{ inputs.deployment_tag }}
          HEAD_SHA: ${{ inputs.source_sha || github.sha }}
          NOOK_HOST_PAGES_DEPLOY: "1"
          NOOK_WRANGLER_VERSION: "4.114.0"
        run: bash .github/scripts/ci-pr-deploy-and-verify-previews.sh
      - name: Preserve preview sccache telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-preview-sccache-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nook-sccache-reports
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

  web-verify:
    if: >-
      inputs.publish_compile_cache != false &&
      (inputs.tasks == '' || inputs.task == '') &&
      (inputs.tasks || inputs.task) == 'web:verify'
    name: Remote / web:verify
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          require-sccache: "true"
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: "true"
      - name: Run web verification and production builds
        run: task web:verify

  web-e2e-image:
    if: >-
      inputs.publish_compile_cache != false &&
      (inputs.tasks == '' || inputs.task == '') &&
      ((inputs.tasks || inputs.task) == 'web:build' ||
      (inputs.tasks || inputs.task) == 'web:e2e' ||
      (inputs.tasks || inputs.task) == 'web:e2e:debug' ||
      (inputs.tasks || inputs.task) == 'extension:e2e' ||
      (inputs.tasks || inputs.task) == 'check' ||
      (inputs.tasks || inputs.task) == 'ci:pr' ||
      (inputs.tasks || inputs.task) == 'ci:pr:e2e')
    name: Remote / browser image
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 30
    env:
      DOCKER_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_E2E_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          require-sccache: "true"
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: "true"
      - name: Run repository invariant preflight
        if: >-
          (inputs.tasks || inputs.task) == 'check' ||
          (inputs.tasks || inputs.task) == 'ci:pr' ||
          (inputs.tasks || inputs.task) == 'ci:pr:e2e'
        run: task preflight
      - name: Build exact-source Kubernetes job image
        run: task web:e2e:kubernetes-image

  web-e2e:
    if: >-
      inputs.publish_compile_cache != false &&
      (inputs.tasks == '' || inputs.task == '') &&
      ((inputs.tasks || inputs.task) == 'web:build' ||
      (inputs.tasks || inputs.task) == 'web:e2e' ||
      (inputs.tasks || inputs.task) == 'web:e2e:debug' ||
      (inputs.tasks || inputs.task) == 'extension:e2e' ||
      (inputs.tasks || inputs.task) == 'check' ||
      (inputs.tasks || inputs.task) == 'ci:pr')
    needs: web-e2e-image
    name: Remote / web:e2e
    runs-on: nook-k0s-container
    timeout-minutes: 180
    container:
      image: registry.dev.nokey.sh/nook/remote-buildcache/nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
    env:
      CI: "1"
      E2E_PROJECT: ${{ inputs.e2e_project }}
      E2E_SPECS: ${{ inputs.e2e_specs }}
      E2E_GREP: ${{ inputs.e2e_grep }}
    steps:
      - name: Run selected task without a nested container runtime
        working-directory: /meta-secret/nook
        env:
          REMOTE_CONTAINER_TASK: ${{ inputs.tasks || inputs.task }}
        run: |
          set -euo pipefail
          case "$REMOTE_CONTAINER_TASK" in
            web:build) task _web:build ;;
            web:e2e) task _ci:main:web:e2e-only ;;
            web:e2e:debug) NOOK_REMOTE_E2E_DEBUG=1 task _web:test:e2e:debug ;;
            extension:e2e) task _extension:test:e2e ;;
            check) task _check ;;
            ci:pr) task _ci:pr ;;
            *) task "$REMOTE_CONTAINER_TASK" ;;
          esac

      - name: Collect Playwright diagnostics
        if: always()
        working-directory: /meta-secret/nook
        run: |
          artifact_dir="$GITHUB_WORKSPACE/e2e-artifacts"
          mkdir -p "$artifact_dir/web" "$artifact_dir/extension"
          cp -R nook-app/nook-web/nook-web-app/test-results/. "$artifact_dir/web/" 2>/dev/null || true
          cp -R nook-app/nook-web/nook-web-extension/test-results/. "$artifact_dir/extension/" 2>/dev/null || true
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 15

  ci-pr-e2e-suite:
    if: >-
      inputs.publish_compile_cache != false &&
      (inputs.tasks == '' || inputs.task == '') &&
      (inputs.tasks || inputs.task) == 'ci:pr:e2e'
    needs: web-e2e-image
    name: Remote / ci:pr:e2e / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [stable, unstable, isolation, extension]
    runs-on: nook-k0s-container
    timeout-minutes: 180
    container:
      image: registry.dev.nokey.sh/nook/remote-buildcache/nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
    env:
      CI: "1"
    steps:
      - name: Run complete E2E suite member
        working-directory: /meta-secret/nook
        env:
          E2E_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "$E2E_SUITE" in
            stable) task _web:test:e2e:stable ;;
            unstable) task _web:test:e2e:unstable ;;
            isolation) task _web:test:e2e:isolation ;;
            extension) task _extension:test:e2e ;;
            *) exit 2 ;;
          esac

      - name: Collect Playwright diagnostics
        if: always()
        working-directory: /meta-secret/nook
        run: |
          artifact_dir="$GITHUB_WORKSPACE/e2e-artifacts"
          mkdir -p "$artifact_dir/web" "$artifact_dir/extension"
          cp -R nook-app/nook-web/nook-web-app/test-results/. "$artifact_dir/web/" 2>/dev/null || true
          cp -R nook-app/nook-web/nook-web-extension/test-results/. "$artifact_dir/extension/" 2>/dev/null || true
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 15

  ci-pr-e2e:
    if: >-
      always() &&
      inputs.publish_compile_cache != false &&
      (inputs.tasks == '' || inputs.task == '') &&
      (inputs.tasks || inputs.task) == 'ci:pr:e2e'
    needs: ci-pr-e2e-suite
    name: Remote / ci:pr:e2e
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 10
    steps:
      - name: Require every E2E suite
        env:
          SUITE_RESULT: ${{ needs.ci-pr-e2e-suite.result }}
        run: test "$SUITE_RESULT" = "success"

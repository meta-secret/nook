# Shared Rust ecosystem gates (dependency policy, deterministic tests, fuzz,
# Kani, Dylint). Called from the labeled PR workflow and from the thin
# Main and specialist scheduled and manual entry points.
# One runner shares its node-local BuildKit cache across concurrent check groups.
# Each group retains its result; every group finishes even if another fails.

name: Rust ecosystem checks

on:
  workflow_call:
    outputs:
      dependency-policy-result:
        description: Terminal result of the dependency policy check group.
        value: ${{ jobs.checks.outputs.dependency-policy-result }}
      deterministic-tests-result:
        description: Terminal result of the deterministic tests check group.
        value: ${{ jobs.checks.outputs.deterministic-tests-result }}
      dylint-result:
        description: Terminal result of the Dylint check group.
        value: ${{ jobs.checks.outputs.dylint-result }}
    inputs:
      native_coverage_provided:
        description: Required sibling native gate covers replication unit tests.
        type: boolean
        default: false
      fuzz_seconds:
        description: Seconds for the cargo-fuzz smoke campaign.
        type: string
        required: true
      isolated_cache_write:
        description: Whether Docker setup may write PR-scoped isolated cache.
        type: string
        required: true
      source_sha:
        description: Exact pull-request head SHA for source-pinned checkouts.
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  # Forks and Dependabot intentionally run without private compiler-cache access.
  SCCACHE_OPTIONAL: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && '1' || '' }}

jobs:
  checks:
    name: Rust ecosystem verification
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      dependency-policy-result: ${{ steps.checks.outputs.policy }}
      deterministic-tests-result: ${{ steps.checks.outputs.smoke }}
      dylint-result: ${{ steps.checks.outputs.dylint }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@v2
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')
        with:
          version: 3.52.0
      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')
      - uses: ./.github/actions/nook-docker-setup
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        with:
          registry-host: registry.dev.nokey.sh
          # Main push must use the trusted writer for nook/buildcache/**.
          # PRs/schedule keep the remote identity for isolated/read-only access.
          registry-username: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.NOOK_REGISTRY_USERNAME || secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.NOOK_REGISTRY_PASSWORD || secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          require-sccache: "true"
          # Main push seeds trusted ecosystem caches; PRs write isolated remote
          # refs with Main fallback. Schedule/dispatch stay read-only consumers.
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          main-cache-only: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'false' || 'true' }}
          isolated-cache-write: ${{ inputs.isolated_cache_write }}
      - name: Run dependency policy, deterministic tests, fuzz, Kani, and Dylint in parallel
        id: checks
        env:
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
          NATIVE_COVERAGE_PROVIDED: ${{ inputs.native_coverage_provided }}
        run: task docker:ecosystem:check

      - name: Preserve ecosystem group logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecosystem-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/nook-ecosystem-logs
          retention-days: 3
          if-no-files-found: warn

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry
        with:
          artifact-suffix: ecosystem

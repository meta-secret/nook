# Deploy an immutable semantic-version tag to the stable production site.

name: Release production

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (for example 1.2.0 or v1.2.0-rc.1)"
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit to release"
        required: true
        default: main
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: production-release
  # Production publication is stateful; serialize releases without interrupting one mid-deploy.
  cancel-in-progress: false

env:
  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
  DOCKER_IMAGE: nook-web:run-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_E2E_IMAGE: nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
  CI_RELEASE_URL: https://nokey.sh
  CI_RELEASE_VITE_BASE: /
  CI_RELEASE_VITE_VAULT_SYNC_INTERVAL_MS: "500"

jobs:
  prepare:
    name: Prepare production browser image
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    outputs:
      release-sha: ${{ steps.release.outputs.sha }}
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      # Keep current workflow tooling beside the immutable requested source. This
      # prevents historical manual refs from reviving retired ARC/cache logic.
      - name: Checkout release workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .nook/release-workflow

      - name: Docker setup
        uses: ./.nook/release-workflow/.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}

      - name: Resolve release version
        id: release
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected a semantic version; received: $REQUESTED_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run repository invariant preflight
        run: >-
          REPO_ROOT="$GITHUB_WORKSPACE/.nook/release-workflow"
          PREFLIGHT_SOURCE_ROOT="$GITHUB_WORKSPACE"
          task --taskfile "$GITHUB_WORKSPACE/.nook/release-workflow/Taskfile.yml"
          preflight

      - name: Publish exact-source production browser image
        run: >-
          REPO_ROOT="$GITHUB_WORKSPACE"
          task --taskfile "$GITHUB_WORKSPACE/.nook/release-workflow/Taskfile.yml"
          web:e2e:kubernetes-image
        env:
          DOCKER_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-release-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
          DOCKER_E2E_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-release-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
          VITE_BASE: ${{ env.CI_RELEASE_VITE_BASE }}
          VITE_SITE_URL: ${{ env.CI_RELEASE_URL }}
          VITE_PUBLIC_APP_URL: ${{ env.CI_RELEASE_URL }}
          VITE_SIMPLE_APP_URL: https://simple.nokey.sh
          VITE_SENTINEL_APP_URL: https://sentinel.nokey.sh
          VITE_VAULT_SYNC_INTERVAL_MS: ${{ env.CI_RELEASE_VITE_VAULT_SYNC_INTERVAL_MS }}
          WASM_BUILD_MODE: prod
          NOOK_SIMPLE_VAULT_URL: https://simple.nokey.sh/
          NOOK_EXTENSION_CHANNEL: production
          NOOK_EXTENSION_VERSION: ${{ steps.release.outputs.version }}
          NOOK_EXTENSION_COMMIT: ${{ steps.release.outputs.sha }}
          NOOK_EXTENSION_SITE_URL: https://nokey.sh/

  deploy:
    name: Verify and deploy production
    needs: prepare
    runs-on: nook-k0s-container
    container:
      image: registry.dev.nokey.sh/nook/remote-buildcache/nook-release-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
          fetch-depth: 0

      - name: Trust exact Actions workspace for Git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve and validate release
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ needs.prepare.outputs.release-version }}
          PREPARED_RELEASE_SHA: ${{ needs.prepare.outputs.release-sha }}
          RELEASE_EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail

          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected a semantic version such as 1.2.0 or 1.2.0-rc.1; received: $REQUESTED_VERSION" >&2
            exit 1
          fi

          tag="v$version"
          sha="$(git rev-parse HEAD)"
          if [[ "$sha" != "$PREPARED_RELEASE_SHA" ]]; then
            echo "Prepared release SHA $PREPARED_RELEASE_SHA does not match checkout $sha" >&2
            exit 1
          fi
          git fetch --force --tags origin

          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [[ "$tagged_sha" != "$sha" ]]; then
              echo "$tag already points to $tagged_sha and cannot be moved to $sha" >&2
              exit 1
            fi
            tag_exists=true
          elif [[ "$RELEASE_EVENT" != "workflow_dispatch" ]]; then
            echo "Tag-triggered release could not resolve refs/tags/$tag" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "prerelease=$prerelease"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Production release"
            echo
            echo "- Version: \`$version\`"
            echo "- Tag: \`$tag\`"
            echo "- Commit: \`$sha\`"
            echo "- Source: \`$SOURCE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight, check, build once, and e2e
        working-directory: /meta-secret/nook
        run: task _ci:main
        env:
          CI: true
          GIT_COMMIT_ID: ${{ steps.release.outputs.sha }}
          NOOK_SIMPLE_VAULT_URL: https://simple.nokey.sh/
          NOOK_EXTENSION_CHANNEL: production
          NOOK_EXTENSION_VERSION: ${{ steps.release.outputs.version }}
          NOOK_EXTENSION_COMMIT: ${{ steps.release.outputs.sha }}
          NOOK_EXTENSION_SITE_URL: https://nokey.sh/

      - name: Create immutable release tag
        if: steps.release.outputs.tag_exists != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "Nook $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Copy verified release artifacts into the Actions workspace
        run: |
          set -euo pipefail
          rm -rf nook-app/nook-web/nook-web-app/dist nook-app/nook-web/nook-vault-simple/dist nook-app/nook-web/nook-vault-sentinel/dist
          cp -R /meta-secret/nook/nook-app/nook-web/nook-web-app/dist nook-app/nook-web/nook-web-app/dist
          cp -R /meta-secret/nook/nook-app/nook-web/nook-vault-simple/dist nook-app/nook-web/nook-vault-simple/dist
          cp -R /meta-secret/nook/nook-app/nook-web/nook-vault-sentinel/dist nook-app/nook-web/nook-vault-sentinel/dist

      - name: Add release metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: task ci:release:write-metadata

      - name: Deploy isolated Simple and Sentinel applications
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
        run: task ci:release:deploy-vaults

      - name: Attach and verify isolated production domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: task ci:release:attach-prod-domains

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: nook-app/nook-web/nook-web-app/dist/site

      - name: Deploy stable to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify production browser extension deployment
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: task ci:release:verify-extension

      - name: Publish GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const crypto = require('node:crypto')
            const tag = process.env.RELEASE_TAG
            const sha = process.env.RELEASE_SHA
            const prerelease = process.env.IS_PRERELEASE === 'true'

            let release
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data
              core.info(`GitHub Release ${tag} already exists; verifying immutable assets.`)
            } catch (error) {
              if (error.status !== 404) throw error
              // Fail instead of silently creating a release from a missing/movable tag.
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })
              release = (await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                target_commitish: sha,
                name: tag,
                generate_release_notes: true,
                prerelease,
                make_latest: prerelease ? 'false' : 'true',
              })).data
            }

            const downloads = path.join(
              process.cwd(),
              'nook-app/nook-web/nook-web-app/dist/site/downloads',
            )
            const metadata = JSON.parse(
              fs.readFileSync(path.join(downloads, 'extension.json'), 'utf8'),
            )
            const assetPaths = [
              path.join(downloads, metadata.archive),
              path.join(downloads, 'extension.json'),
              path.join(downloads, `${metadata.archive}.sha256`),
            ]
            const assets = (await github.rest.repos.listReleaseAssets({
              ...context.repo,
              release_id: release.id,
              per_page: 100,
            })).data

            for (const assetPath of assetPaths) {
              const name = path.basename(assetPath)
              const data = fs.readFileSync(assetPath)
              const digest = crypto.createHash('sha256').update(data).digest('hex')
              const existing = assets.find((asset) => asset.name === name)
              if (existing) {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                  {
                    ...context.repo,
                    asset_id: existing.id,
                    headers: { accept: 'application/octet-stream' },
                  },
                )
                const existingDigest = crypto
                  .createHash('sha256')
                  .update(Buffer.from(response.data))
                  .digest('hex')
                if (existingDigest !== digest) {
                  throw new Error(`Immutable release asset ${name} differs from the tested build.`)
                }
                core.info(`Verified existing release asset ${name}.`)
                continue
              }
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  'content-type': name.endsWith('.zip')
                    ? 'application/zip'
                    : name.endsWith('.json')
                      ? 'application/json'
                      : 'text/plain',
                  'content-length': data.length,
                },
              })
              core.info(`Uploaded release asset ${name}.`)
            }

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited, closed]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'main' ||
    (github.event_name == 'pull_request' &&
    github.event.pull_request.head.repo.full_name == github.repository &&
    github.event.pull_request.head.ref == 'dev' &&
    github.event.pull_request.base.ref == 'main' &&
    (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
    (github.event.action == 'edited' && github.event.changes.base.ref.from != '') ||
    (github.event.action == 'labeled' && github.event.label.name == 'ci:full-e2e')) &&
    'dev-pr') ||
    (github.event_name == 'pull_request' &&
    github.event.pull_request.head.repo.full_name == github.repository &&
    github.event.pull_request.head.ref == 'dev' &&
    github.event.pull_request.base.ref == 'main' &&
    format('dev-pr-event-{0}', github.run_id)) ||
    (github.event_name == 'pull_request' &&
    (github.event.action != 'labeled' && github.event.action != 'edited' ||
    github.event.label.name == 'ci:validate' || github.event.label.name == 'ci:full-e2e' ||
    github.event.changes.base.ref.from != '') && format('pr-{0}', github.event.pull_request.number)) ||
    format('ci-{0}', github.run_id) }}
  # A newer PR event supersedes its queued/running validation wave; push and
  # scheduled delivery retain serialized completion semantics.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Classify CI paths
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      validation-requested: ${{ steps.paths.outputs.validation-requested }}
      full-e2e-requested: ${{ steps.paths.outputs.full-e2e-requested }}
      product: ${{ steps.paths.outputs.product }}
      research: ${{ steps.paths.outputs.research }}
      dev-pr: ${{ steps.paths.outputs.dev-pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths without executing source
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEV_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main' && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_paths"
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --root --no-commit-id --name-only -r -z "$HEAD_SHA" > "$changed_paths"
          else
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
          fi
          validation_requested=false
          full_e2e_requested=false
          dev_pr="$DEV_PR"
          if [ "$EVENT_NAME" = pull_request ]; then
            label_scope="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | [any(. == "ci:validate" or . == "ci:full-e2e"), any(. == "ci:full-e2e")] | @tsv')"
            IFS=$'\t' read -r validation_requested full_e2e_requested <<< "$label_scope"
            if [ "$DEV_PR" = "true" ]; then
              # Dev PRs always run ordinary validation, while full browser e2e
              # remains an explicit ci:full-e2e opt-in.
              validation_requested=true
            fi
          fi
          echo "validation-requested=$validation_requested" >> "$GITHUB_OUTPUT"
          echo "full-e2e-requested=$full_e2e_requested" >> "$GITHUB_OUTPUT"
          echo "dev-pr=$dev_pr" >> "$GITHUB_OUTPUT"
          product=false
          research=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .cortex/* | .cursor/* | .vale.ini | .vale/* | .github/workflows/repository-policy.yml | .github/workflows/web-research.yml | agentic-ai/* | nook-app/nook-web/nook-web-research/*) ;;
              *) product=true ;;
            esac
            case "$path" in .github/workflows/web-research.yml | .github/scripts/web-research-deploy.sh | .github/scripts/web-research-verify-live.sh | .task/ci-workflows.yml | nook-app/nook-web/nook-web-research/*) research=true ;; esac
          done < "$changed_paths"
          if [ "$DEV_PR" = "true" ]; then
            product=true
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "research=$research" >> "$GITHUB_OUTPUT"

  policy:
    name: Repository policy
    if: github.event_name == 'push'
    needs: scope
    uses: ./.github/workflows/repository-policy.yml
    secrets: inherit
    with:
      source_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  pr:
    name: PR validation
    if: >-
      github.event_name == 'pull_request' &&
      (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) ||
      (github.event.action == 'edited' && github.event.changes.base.ref.from != '') ||
      github.event.label.name == 'ci:validate' || github.event.label.name == 'ci:full-e2e')
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/pr.yml
    secrets: inherit
    with:
      validation_requested: ${{ github.event.pull_request.head.ref == 'dev' || contains(github.event.pull_request.labels.*.name, 'ci:validate') || contains(github.event.pull_request.labels.*.name, 'ci:full-e2e') }}
      full_e2e_requested: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full-e2e') }}
      source_sha: ${{ github.event.pull_request.head.sha }}

  main:
    name: Main validation
    needs: scope
    if: github.event_name == 'push' && needs.scope.outputs.product == 'true'
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      product_changed: ${{ needs.scope.outputs.product == 'true' }}

  research:
    name: Web research
    needs: scope
    if: github.event_name == 'push' && needs.scope.outputs.research == 'true'
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    uses: ./.github/workflows/web-research.yml
    secrets: inherit

  ecosystem:
    name: Rust ecosystem
    needs: scope
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/rust-ecosystem-checks.yml
    secrets: inherit
    with:
      fuzz_seconds: "20"
      isolated_cache_write: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

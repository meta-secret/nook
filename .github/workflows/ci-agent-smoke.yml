# Tiny smoke for agentic-ai/ci-agent exit behavior.
# Triggered manually. GitHub Issues are not used for Nook development work.

name: CI agent smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-agent-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Exit and unit smoke
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentic-ai/ci-agent/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0

      - name: Install and unit-test ci-agent
        run: task ci-agent:test

      - name: Verify exitCiAgent kills open handles
        run: task ci-agent:smoke

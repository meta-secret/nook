name: E2E (Windows Edge)
run-name: "Windows Edge · ${{ inputs.pr_number || inputs.source_ref }} · ${{ inputs.suite }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR number (choose PR or source ref)
        type: string
        required: false
      source_ref:
        description: Branch, tag, or commit (choose PR or source ref)
        type: string
        required: false
      suite:
        description: Automated browser surface (all excludes demonstration videos)
        type: choice
        required: true
        default: all
        options:
          [all, stable, unstable, sync-live, isolation, extension, research]
      spec:
        description: Optional Playwright spec path filter
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: windows-edge-${{ inputs.pr_number || inputs.source_ref }}-${{ inputs.suite }}-${{ inputs.spec }}
  cancel-in-progress: true

jobs:
  source:
    name: Resolve source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve selected PR or ref
        id: ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ] && [ -z "$SOURCE_REF" ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid PR number' >&2; exit 1; }
            pr="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
            [ "$(jq -r '.head.repo.full_name' <<< "$pr")" = "$GH_REPO" ] || { echo 'Fork PRs cannot use the private artifact producer' >&2; exit 1; }
            [ "$(jq -r '.user.login' <<< "$pr")" != 'dependabot[bot]' ] || { echo 'Dependabot cannot use the private artifact producer' >&2; exit 1; }
            ref="$(jq -r '.head.sha' <<< "$pr")"
          elif [ -n "$SOURCE_REF" ] && [ -z "$PR_NUMBER" ]; then
            ref="$SOURCE_REF"
          else
            echo 'Supply exactly one of pr_number or source_ref' >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
      - name: Record immutable source
        id: sha
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Test source: $sha" >> "$GITHUB_STEP_SUMMARY"

  artifact:
    name: Build production browser artifact (Linux)
    needs: source
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          cache-write: "false"
      - name: Export production preview and WASM
        run: task web:e2e:windows:artifact
        env:
          WASM_BUILD_MODE: prod
          WINDOWS_E2E_ARTIFACT_DIR: ${{ runner.temp }}/windows-edge-web
      - uses: actions/upload-artifact@v7
        with:
          name: windows-edge-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-edge-web/nook-app
          if-no-files-found: error
          retention-days: 3

  edge:
    name: Native Windows Edge (${{ matrix.surface.label }})
    needs: [source, artifact]
    strategy:
      fail-fast: false
      matrix:
        surface: ${{ inputs.suite == 'all' && fromJSON('[{"suite":"stable","provider":"file","label":"stable"},{"suite":"unstable","provider":"file","label":"unstable-file"},{"suite":"unstable","provider":"github","label":"unstable-github"},{"suite":"sync-live","provider":"github","label":"sync-live"},{"suite":"isolation","provider":"file","label":"isolation"},{"suite":"extension","provider":"file","label":"extension"},{"suite":"research","provider":"file","label":"research"}]') || inputs.suite == 'unstable' && fromJSON('[{"suite":"unstable","provider":"file","label":"unstable-file"},{"suite":"unstable","provider":"github","label":"unstable-github"}]') || fromJSON(format('[{{"suite":"{0}","provider":"{1}","label":"{0}"}}]', inputs.suite, inputs.suite == 'sync-live' && 'github' || 'file')) }}
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      E2E_SUITE: ${{ matrix.surface.suite }}
      E2E_SPEC: ${{ inputs.spec }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: arduino/setup-task@v2
        with:
          version: 3.52.0
          repo-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: windows-edge-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: nook-app
      - name: Install native web dependencies
        run: task --taskfile .task/e2e-windows.yml web:e2e:windows:install
      - name: Select installed Microsoft Edge for persistent extension contexts
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe")) { throw 'Installed Microsoft Edge is required' }
          Write-Output "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe" >> $env:GITHUB_ENV
      - name: Run shared specs on installed Microsoft Edge
        run: task --taskfile .task/e2e-windows.yml web:e2e:windows
        env:
          NOOK_E2E_SYNC_PROVIDER: ${{ matrix.surface.provider }}
          NOOK_GITHUB_PAT: ${{ matrix.surface.suite == 'sync-live' && secrets.NOOK_GITHUB_PAT || '' }}
          NOOK_GITHUB_E2E_REPO: nook-e2e-windows-${{ github.run_id }}-${{ github.run_attempt }}
          NOOK_GITHUB_POLL_MS: "3000"
          NOOK_GITHUB_SYNC_TIMEOUT_MS: "15000"
          NOOK_GITHUB_CONNECT_TIMEOUT_MS: "30000"
          NOOK_GOOGLE_E2E_ACCESS_TOKEN: ${{ matrix.surface.suite == 'sync-live' && secrets.NOOK_GOOGLE_E2E_ACCESS_TOKEN || '' }}
          NOOK_GOOGLE_E2E_JOINER_EMAIL: ${{ matrix.surface.suite == 'sync-live' && secrets.NOOK_GOOGLE_E2E_JOINER_EMAIL || '' }}
          NOOK_GOOGLE_E2E_JOINER_ACCESS_TOKEN: ${{ matrix.surface.suite == 'sync-live' && secrets.NOOK_GOOGLE_E2E_JOINER_ACCESS_TOKEN || '' }}
      - name: Clean up live-sync test repository
        if: always() && matrix.surface.suite == 'sync-live'
        uses: actions/github-script@v9
        env:
          NOOK_GITHUB_E2E_REPO: nook-e2e-windows-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          github-token: ${{ secrets.NOOK_GITHUB_PAT }}
          script: |
            const repo = process.env.NOOK_GITHUB_E2E_REPO
            const { data: user } = await github.rest.users.getAuthenticated()
            try {
              await github.rest.repos.delete({ owner: user.login, repo })
              core.info(`Deleted live-sync test repository: ${user.login}/${repo}`)
            } catch (error) {
              if (error.status !== 404) throw error
              core.info(`Live-sync test repository already absent: ${user.login}/${repo}`)
            }
      - name: Preserve Playwright reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-edge-playwright-${{ matrix.surface.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nook-app/nook-web/nook-web-app/playwright-report
            nook-app/nook-web/nook-web-app/test-results
            nook-app/nook-web/nook-web-extension/playwright-report
            nook-app/nook-web/nook-web-extension/test-results
            nook-app/nook-web/nook-web-research/playwright-report
            nook-app/nook-web/nook-web-research/test-results
          if-no-files-found: warn
          retention-days: 15
      - name: Record tested source
        if: always()
        run: |
          Write-Output "Windows Edge source: ${{ needs.source.outputs.sha }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Suite: $env:E2E_SUITE; spec filter: $env:E2E_SPEC" >> $env:GITHUB_STEP_SUMMARY

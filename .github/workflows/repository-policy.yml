name: Repository policy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - .agents/skills/**
      - .cortex/**/dynamic-skills/*/scripts/**
      - .claude/skills/**
      - .codex/hooks.json
      - .cortex/**
      - .cursor/rules.md
      - .cursor/skills/**
      - .github/formatting/**
      - .github/prompts/**
      - .github/scripts/format-host-apply.sh
      - .github/scripts/format-host-apply.test.sh
      - .github/scripts/arc-manifest-contract.ts
      - .github/workflows/**
      - .task/agentic-ai.yml
      - AGENTS.md
      - CODEX.md
      - README.md
      - agentic-ai/loom/**
      - preflight/**

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Enforce repository policy
    runs-on: ${{ (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch pull-request registry baseline
        if: github.event_name == 'pull_request'
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASELINE_SHA"

      - name: Fetch pre-push registry baseline
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASELINE_SHA: ${{ github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BASELINE_SHA"

      - name: Classify policy paths
        id: policy-paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "loom=true" >> "$GITHUB_OUTPUT"
            echo "runner_placement=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          loom_changed=false
          runner_placement_changed=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              .agents/skills/* | .claude/skills/* | .codex/hooks.json | .cortex/* | .cursor/rules.md | .cursor/skills/* | .github/formatting/* | .github/prompts/* | .github/scripts/format-host-apply.sh | .github/scripts/format-host-apply.test.sh | .github/workflows/repository-policy.yml | .task/agentic-ai.yml | AGENTS.md | CODEX.md | README.md | agentic-ai/loom/* | .cortex/*/dynamic-skills/*/scripts/* | preflight/*)
                loom_changed=true
                ;;
            esac
            case "$changed_file" in
              .github/scripts/arc-manifest-contract.ts | .github/workflows/*)
                runner_placement_changed=true
                ;;
            esac
          done < <(git diff --no-renames --name-only HEAD^1 HEAD^2)
          echo "loom=$loom_changed" >> "$GITHUB_OUTPUT"
          echo "runner_placement=$runner_placement_changed" >> "$GITHUB_OUTPUT"

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0

      - name: Install Rust for repository policy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore hosted preflight Rust dependencies
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-preflight
          workspaces: preflight -> target

      - name: Enforce shared source formatter contract
        run: task preflight:format-contract

      - name: Connect private ARC BuildKit
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

      - name: Enforce source architecture on hosted runners
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')
        run: task preflight:source-architecture

      - name: Enforce repository invariants through cached BuildKit
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        run: task preflight:test

      - name: Install Bun
        if: steps.policy-paths.outputs.loom == 'true' || steps.policy-paths.outputs.runner_placement == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Ruby for the legacy Hive values renderer
        if: steps.policy-paths.outputs.runner_placement == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Enforce Actions runner placement inventory
        if: steps.policy-paths.outputs.runner_placement == 'true'
        run: bun .github/scripts/arc-manifest-contract.ts

      - name: Verify Loom package quality
        if: steps.policy-paths.outputs.loom == 'true'
        run: task loom:verify

      - name: Audit Cortex document structure
        if: steps.policy-paths.outputs.loom == 'true'
        run: task loom:cortex-audit

      - name: Enforce authored TypeScript state invariants
        if: >-
          steps.policy-paths.outputs.loom == 'true' &&
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')
        run: task preflight:typescript-state

      - name: Enforce Loom single-parameter contract
        if: >-
          steps.policy-paths.outputs.loom == 'true' &&
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')
        run: task preflight:loom-contracts

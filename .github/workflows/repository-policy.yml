name: Repository policy

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact pull-request head SHA for source-pinned checkouts.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  static-types:
    name: Tooling and AI type safety
    runs-on: ${{ (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      LOOM_OWNERSHIP_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: go-task/setup-task@v2
        with:
          version: "3.52.0"
      - name: Install rootless Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          zig_version="0.15.2"
          zig_archive="${RUNNER_TEMP}/zig-x86_64-linux-${zig_version}.tar.xz"
          zig_tar="${RUNNER_TEMP}/zig-x86_64-linux-${zig_version}.tar"
          zig_dir="${RUNNER_TEMP}/zig-x86_64-linux-${zig_version}"
          xz_decoder="${RUNNER_TEMP}/nook-native-toolchain/unxz"
          mkdir -p "${RUNNER_TEMP}/nook-native-toolchain"

          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$zig_archive" \
            "https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz"
          printf '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  %s\n' "$zig_archive" |
            sha256sum -c -

          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$xz_decoder" \
            "https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox_UNXZ"
          printf 'c70d2b5e2828f4c90c36a3b9185b5d4405b0751e9fc7c43231c78711e047a306  %s\n' "$xz_decoder" |
            sha256sum -c -
          chmod 0755 "$xz_decoder"

          "$xz_decoder" -c "$zig_archive" > "$zig_tar"
          mkdir -p "$zig_dir"
          tar -xf "$zig_tar" -C "$RUNNER_TEMP"
          test -x "$zig_dir/zig"
          echo "$zig_dir" >> "$GITHUB_PATH"
      - name: Configure rootless native compiler
        shell: bash
        run: |
          toolchain_dir="$RUNNER_TEMP/nook-native-toolchain"
          mkdir -p "$toolchain_dir"
          cat > "$toolchain_dir/cc" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          args=("$@")
          exec zig cc "${args[@]}"
          EOF
          cat > "$toolchain_dir/c++" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          args=("$@")
          exec zig c++ "${args[@]}"
          EOF
          cat > "$toolchain_dir/ar" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec zig ar "$@"
          EOF
          chmod 0755 "$toolchain_dir/cc" "$toolchain_dir/c++" "$toolchain_dir/ar"
          echo "$toolchain_dir" >> "$GITHUB_PATH"
          {
            echo "CC=$toolchain_dir/cc"
            echo "CXX=$toolchain_dir/c++"
            echo "AR=$toolchain_dir/ar"
          } >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: task tooling:static

  verify:
    name: Enforce repository policy
    runs-on: ${{ (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0

      - name: Connect private ARC BuildKit
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

      - name: Setup secret-free hosted BuildKit
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')
        uses: docker/setup-buildx-action@v4

      - name: Enforce trusted repository policy
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        run: task ci:repository-policy:trusted

      - name: Enforce untrusted repository policy
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')
        run: task ci:repository-policy:untrusted

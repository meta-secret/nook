name: Repository policy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - .cortex/**
      - .github/workflows/repository-policy.yml
      - .task/agentic-ai.yml
      - agentic-ai/loom/**
      - preflight/**

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Enforce repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify policy paths
        id: policy-paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "loom=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          loom_changed=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              .cortex/* | .github/workflows/repository-policy.yml | .task/agentic-ai.yml | agentic-ai/loom/* | preflight/*)
                loom_changed=true
                break
                ;;
            esac
          done < <(git diff --no-renames --name-only HEAD^1 HEAD^2)
          echo "loom=$loom_changed" >> "$GITHUB_OUTPUT"

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore preflight Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-preflight
          workspaces: preflight -> target

      - name: Enforce source limits and Rust unit-test colocation
        if: github.event_name == 'pull_request'
        run: task preflight:source-architecture

      - name: Install Bun
        if: steps.policy-paths.outputs.loom == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify Loom package quality
        if: steps.policy-paths.outputs.loom == 'true'
        run: task loom:verify

      - name: Audit Cortex document structure
        if: steps.policy-paths.outputs.loom == 'true'
        run: task loom:cortex-audit

      - name: Enforce authored TypeScript state invariants
        if: steps.policy-paths.outputs.loom == 'true'
        run: task preflight:typescript-state

      - name: Enforce Loom single-parameter contract
        if: steps.policy-paths.outputs.loom == 'true'
        run: task preflight:loom-contracts

name: PR

on:
  workflow_call:
    inputs:
      full_e2e_requested:
        required: true
        type: boolean
      validation_requested:
        required: true
        type: boolean
      source_sha:
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  packages: read
  deployments: write
  pull-requests: write
  issues: write

jobs:
  validation:
    name: Verify and preview
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && 'nook-k0s-container' || 'ubuntu-latest' }}
    # Source-free Debian Trixie browser base, published only when tooling changes.
    # Configure an immutable digest; the scoped Actions token can read its repository package.
    container:
      image: ${{ vars.NOOK_PR_RUNNER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      # Keep Bake vertices visible while high-volume tool output is summarized
      # at its source (for example, jscpd prints only its final table).
      BUILDKIT_PROGRESS: plain
      LOOM_OWNERSHIP_FROM: ${{ github.event.pull_request.base.sha }}
      SCCACHE_OPTIONAL: ${{ (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && '1' || '' }}
      WASM_BUILD_MODE: dev
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      VITE_BASE: /
      VITE_SITE_URL: https://pr-${{ github.event.pull_request.number }}.nokey-sh.pages.dev
      VITE_PUBLIC_APP_URL: https://pr-${{ github.event.pull_request.number }}.nook-1n8.pages.dev
      VITE_SIMPLE_APP_URL: https://pr-${{ github.event.pull_request.number }}.nokey-simple.pages.dev
      VITE_SENTINEL_APP_URL: https://pr-${{ github.event.pull_request.number }}.nokey-sentinel.pages.dev
      NOOK_SIMPLE_VAULT_URL: https://pr-${{ github.event.pull_request.number }}.nokey-simple.pages.dev/
      NOOK_EXTENSION_CHANNEL: pr-${{ github.event.pull_request.number }}
      NOOK_EXTENSION_COMMIT: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
      NOOK_EXTENSION_SITE_URL: https://pr-${{ github.event.pull_request.number }}.nokey-sh.pages.dev/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize event metadata for the ARC job container
        env:
          PR_EVENT_JSON: ${{ toJSON(github.event) }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf '%s\n' "$PR_EVENT_JSON" > "$RUNNER_TEMP/pr-event.json"
          echo "NOOK_GITHUB_EVENT_PATH=$RUNNER_TEMP/pr-event.json" >> "$GITHUB_ENV"
          echo "PR_ARTIFACT_DIR=$RUNNER_TEMP/nook-pr-artifacts" >> "$GITHUB_ENV"
      - name: Connect trusted persistent BuildKit
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: ./.github/actions/nook-docker-setup
        with:
          preinstalled-tooling: "true"
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          require-sccache: "true"
          cache-write: "false"
          main-cache-only: "true"
      - name: Install Task for secret-free hosted validation
        if: github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]'
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0
      - name: Install Docker client in hosted job container
        if: github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends docker.io
          # Use the GitHub-hosted runner socket; do not start another daemon.
      - name: Connect secret-free hosted BuildKit
        if: github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]'
        uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/nook-node-setup
      - name: Use the builder's local cache throughout this job
        run: |
          echo 'GHA_CACHE_ENABLED=' >> "$GITHUB_ENV"
          echo 'GHA_CACHE_WRITE_ENABLED=' >> "$GITHUB_ENV"
          echo 'NOOK_REGISTRY_CACHE_LOCAL_PUBLISH=0' >> "$GITHUB_ENV"
      - name: Detect required validation and browser regressions
        id: browser-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATION_REQUESTED: ${{ inputs.validation_requested }}
        run: |
          set -euo pipefail
          auth=false
          validation="$VALIDATION_REQUESTED"
          research=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .cortex/*|.meta-cortex/*|.cursor/*|.vale.ini|.vale/*|.github/workflows/repository-policy.yml|.github/workflows/web-research.yml|agentic-ai/*|nook-app/nook-web/nook-web-research/*) ;;
              *) validation=true ;;
            esac
            case "$path" in
              nook-app/nook-web/nook-web-shared/src/extension/password-form*|nook-app/nook-web/nook-web-extension/src/content/autofill.ts|nook-app/nook-web/nook-web-extension/src/content/autofill/*|nook-app/nook-web/nook-web-extension/e2e/mock-auth-provider-scenarios.ts|nook-app/nook-web/nook-web-extension/e2e/mock-auth/src/pages/DetectionHiddenHeaderLogin.svelte|nook-app/nook-web/nook-web-extension/e2e/mock-auth-pilot-coverage.spec.ts) auth=true ;;
            esac
            case "$path" in .github/workflows/web-research.yml|.github/scripts/web-research-deploy.sh|.github/scripts/web-research-verify-live.sh|.task/ci-workflows.yml|nook-app/nook-web/nook-web-research/*) research=true; validation=true ;; esac
          done < <(git diff --name-only -z "$BASE_SHA" HEAD)
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          echo "validation=$validation" >> "$GITHUB_OUTPUT"
          echo "research=$research" >> "$GITHUB_OUTPUT"
      - name: Enforce UI demo contract
        if: steps.browser-scope.outputs.validation == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/ui-demo-contract.sh "$BASE_SHA"
      - name: Verification — formatting, tooling, Rust, WASM and web
        if: steps.browser-scope.outputs.validation == 'true'
        run: task --silent ci:pr:verification
      - name: Verification — policy-only PR
        if: steps.browser-scope.outputs.validation != 'true'
        run: task --silent ci:pr:verification:tooling
      - name: Tests and coverage — Rust, WASM, web, Loom, preflight and delivery contracts
        if: steps.browser-scope.outputs.validation == 'true'
        run: task --silent ci:pr:tests
      - name: Tests — policy-only PR
        if: steps.browser-scope.outputs.validation != 'true'
        run: task --silent ci:pr:tests:policy-with-delivery-helpers
      - name: Post-test verification and artifact preparation
        if: steps.browser-scope.outputs.validation == 'true'
        run: task --silent ci:pr:post-tests
      - name: Full browser and extension suites
        if: steps.browser-scope.outputs.validation == 'true' && inputs.full_e2e_requested
        run: task --silent ci:pr:browser:full
      - name: Report failed extension browser context
        if: failure() && inputs.full_e2e_requested
        run: |
          find nook-app/nook-web/nook-web-extension/test-results \
            -name error-context.md -type f -print -exec cat {} \; || true
      - name: Upload failed extension browser traces
        if: failure() && inputs.full_e2e_requested
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-failure-${{ github.run_id }}
          path: nook-app/nook-web/nook-web-extension/test-results
          if-no-files-found: ignore
          retention-days: 1
      - name: Authentication-sensitive extension regression
        if: steps.browser-scope.outputs.validation == 'true' && !inputs.full_e2e_requested && steps.browser-scope.outputs.auth == 'true'
        run: task --silent ci:pr:browser:auth
      - name: Web research verification and browser tests
        if: steps.browser-scope.outputs.validation == 'true' && steps.browser-scope.outputs.research == 'true'
        run: task --silent web:research:verify
      - name: Restore verified production artifacts after browser tests
        if: steps.browser-scope.outputs.validation == 'true'
        run: |
          # These are generated trees in this ephemeral checkout, never sources.
          rm -rf nook-app/nook-web/nook-web-app/dist nook-app/nook-web/nook-vault-simple/dist nook-app/nook-web/nook-vault-sentinel/dist nook-app/nook-web/nook-web-extension/dist
          cp -a "$PR_ARTIFACT_DIR/browser/nook-app/." nook-app/
      - name: Deploy and report preview
        if: steps.browser-scope.outputs.validation == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: ./.github/actions/nook-pr-preview
        with:
          cloudflare-token: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          cloudflare-account: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          source-sha: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
      - name: Deploy and report research preview
        if: steps.browser-scope.outputs.research == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: ./.github/actions/nook-pr-research-preview
        with:
          cloudflare-token: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          cloudflare-account: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}

name: PR

on:
  workflow_call:
    inputs:
      full_e2e_requested:
        required: true
        type: boolean
      validation_requested:
        required: true
        type: boolean
      source_sha:
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  packages: read
  deployments: write
  pull-requests: write
  issues: write

jobs:
  validation:
    name: Verify and prepare
    outputs:
      validation: ${{ steps.browser-scope.outputs.validation }}
      research: ${{ steps.browser-scope.outputs.research }}
      source-sha: ${{ steps.source.outputs.sha }}
      browser-artifact-id: ${{ steps.browser-handoff.outputs.artifact-id }}
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (vars.NOOK_CONTAINER_RUNS_ON || 'nook-k0s-container') || 'ubuntu-latest' }}
    # Source-free Debian Trixie browser base, published only when tooling changes.
    # Configure an immutable digest; the scoped Actions token can read its repository package.
    container:
      image: ${{ vars.NOOK_PR_RUNNER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      # Keep Bake vertices visible while high-volume tool output is summarized
      # at its source (for example, jscpd prints only its final table).
      BUILDKIT_PROGRESS: plain
      LOOM_OWNERSHIP_FROM: ${{ github.event.pull_request.base.sha }}
      SCCACHE_OPTIONAL: ${{ (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && '1' || '' }}
      VITEST_MAX_WORKERS: ${{ vars.VITEST_MAX_WORKERS }}
      WASM_BUILD_MODE: dev
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      VITE_BASE: /
      VITE_SITE_URL: https://pr-${{ github.event.pull_request.number }}.nokey-sh.pages.dev
      VITE_PUBLIC_APP_URL: https://pr-${{ github.event.pull_request.number }}.nook-1n8.pages.dev
      VITE_SIMPLE_APP_URL: https://pr-${{ github.event.pull_request.number }}.nokey-simple.pages.dev
      VITE_SENTINEL_APP_URL: https://pr-${{ github.event.pull_request.number }}.nokey-sentinel.pages.dev
      NOOK_SIMPLE_VAULT_URL: https://pr-${{ github.event.pull_request.number }}.nokey-simple.pages.dev/
      NOOK_EXTENSION_CHANNEL: pr-${{ github.event.pull_request.number }}
      NOOK_EXTENSION_COMMIT: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
      NOOK_EXTENSION_SITE_URL: https://pr-${{ github.event.pull_request.number }}.nokey-sh.pages.dev/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record checked-out source
        id: source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # GitHub-hosted job containers (forks, and trusted PRs while ARC is in
      # fallback) reach the runner's Docker socket through this client.
      - name: Install Docker client in hosted job container
        if: ${{ !startsWith(runner.name, 'nook-k0s-') }}
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends docker-cli
          # Use the GitHub-hosted runner socket; do not start another daemon.
      - name: Connect trusted persistent BuildKit
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: ./.github/actions/nook-docker-setup
        with:
          preinstalled-tooling: "true"
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          require-sccache: "true"
          cache-write: "false"
          main-cache-only: "true"
      - name: Install Task for secret-free hosted validation
        if: github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]'
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0
      - name: Connect secret-free hosted BuildKit
        if: github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]'
        uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/nook-node-setup
      - name: Prepare job metadata, cache policy, and validation scope
        id: browser-scope
        env:
          PR_EVENT_JSON: ${{ toJSON(github.event) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VALIDATION_REQUESTED: ${{ inputs.validation_requested }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf '%s\n' "$PR_EVENT_JSON" > "$RUNNER_TEMP/pr-event.json"
          echo "NOOK_GITHUB_EVENT_PATH=$RUNNER_TEMP/pr-event.json" >> "$GITHUB_ENV"
          echo "PR_ARTIFACT_DIR=$RUNNER_TEMP/nook-pr-artifacts" >> "$GITHUB_ENV"
          echo 'GHA_CACHE_ENABLED=' >> "$GITHUB_ENV"
          echo 'GHA_CACHE_WRITE_ENABLED=' >> "$GITHUB_ENV"
          echo 'NOOK_REGISTRY_CACHE_LOCAL_PUBLISH=0' >> "$GITHUB_ENV"
          auth=false
          validation="$VALIDATION_REQUESTED"
          research=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .cortex/*|.meta-cortex/*|.cursor/*|.vale.ini|.vale/*|.github/workflows/repository-policy.yml|.github/workflows/web-research.yml|agentic-ai/*|nook-app/nook-web/nook-web-research/*) ;;
              *) validation=true ;;
            esac
            case "$path" in
              nook-app/nook-web/nook-web-shared/src/extension/password-form*|nook-app/nook-web/nook-web-extension/src/content/autofill.ts|nook-app/nook-web/nook-web-extension/src/content/autofill/*|nook-app/nook-web/nook-web-extension/e2e/mock-auth-provider-scenarios.ts|nook-app/nook-web/nook-web-extension/e2e/mock-auth/src/pages/DetectionHiddenHeaderLogin.svelte|nook-app/nook-web/nook-web-extension/e2e/mock-auth-pilot-coverage.spec.ts|nook-app/nook-web/nook-web-extension/e2e/mock-auth-pilot-session-lifecycle.spec.ts) auth=true ;;
            esac
            case "$path" in .github/workflows/pr.yml|.github/workflows/web-research.yml|.github/scripts/web-research-deploy.sh|.github/scripts/web-research-verify-live.sh|.task/ci-workflows.yml|nook-app/ci/pr.yml|nook-app/ci/pr.docker-bake.hcl|nook-app/nook-web/nook-web-app/Dockerfile|nook-app/nook-web/nook-web-research/*) research=true; validation=true ;; esac
          done < <(git diff --name-only -z "$BASE_SHA" HEAD)
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          echo "validation=$validation" >> "$GITHUB_OUTPUT"
          echo "research=$research" >> "$GITHUB_OUTPUT"
          if [ "$validation" = true ]; then
            bash .github/scripts/ui-demo-contract.sh "$BASE_SHA"
          fi
      - name: Parallel validation and browser tests
        if: steps.browser-scope.outputs.validation == 'true'
        env:
          PR_FULL_E2E: ${{ inputs.full_e2e_requested }}
          PR_AUTH_E2E: ${{ steps.browser-scope.outputs.auth }}
          PR_RESEARCH: ${{ steps.browser-scope.outputs.research }}
          PR_BROWSER_JOBS: ${{ inputs.full_e2e_requested }}
        run: task --silent ci:pr:validate
      - name: Verification — policy-only PR
        if: steps.browser-scope.outputs.validation != 'true'
        run: task --silent ci:pr:verification:tooling
      - name: Tests — policy-only PR
        if: steps.browser-scope.outputs.validation != 'true'
        run: task --silent ci:pr:tests:policy-with-delivery-helpers
      - name: Report failed extension browser context
        if: failure() && inputs.full_e2e_requested
        run: |
          shopt -s globstar nullglob
          for context in "$PR_ARTIFACT_DIR"/runtime/nook-app/nook-web/nook-web-extension/test-results/**/error-context.md; do
            printf '%s\n' "$context"
            cat "$context"
          done
      - name: Preserve failed extension Playwright diagnostics
        if: always() && (inputs.full_e2e_requested || steps.browser-scope.outputs.auth == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: pr-extension-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nook-pr-artifacts/runtime/nook-app/nook-web/nook-web-extension/test-results/**/trace.zip
            ${{ runner.temp }}/nook-pr-artifacts/runtime/nook-app/nook-web/nook-web-extension/test-results/**/error-context.md
            ${{ runner.temp }}/nook-pr-artifacts/runtime/nook-app/nook-web/nook-web-extension/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 15
      - name: Import production artifacts after all validation succeeds
        if: steps.browser-scope.outputs.validation == 'true'
        run: |
          # These are generated trees in this ephemeral checkout, never sources.
          rm -rf nook-app/nook-web/nook-web-app/dist nook-app/nook-web/nook-vault-simple/dist nook-app/nook-web/nook-vault-sentinel/dist nook-app/nook-web/nook-web-extension/dist
          cp -a "$PR_ARTIFACT_DIR/browser/nook-app/." nook-app/
          test -e nook-app/nook-web/node_modules || ln -s nook-web-app/node_modules nook-app/nook-web/node_modules
          if [ '${{ steps.browser-scope.outputs.research }}' = true ]; then
            cp -a "$PR_ARTIFACT_DIR/runtime/nook-app/nook-web/nook-web-research/dist" nook-app/nook-web/nook-web-research/
          fi
      - name: Deploy and report preview
        id: previews
        if: ${{ !inputs.full_e2e_requested && steps.browser-scope.outputs.validation == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: ./.github/actions/nook-pr-preview
        with:
          cloudflare-token: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          cloudflare-account: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          source-sha: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
          research-requested: ${{ steps.browser-scope.outputs.research }}
      - name: Report research preview
        if: ${{ !inputs.full_e2e_requested && steps.browser-scope.outputs.research == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: ./.github/actions/nook-pr-research-preview
        with:
          deployment-url: ${{ steps.previews.outputs.research-url }}
          deploy-branch: ${{ steps.previews.outputs.research-branch }}
      - name: Include verified research in full browser handoff
        if: inputs.full_e2e_requested && steps.browser-scope.outputs.research == 'true'
        run: tar -rf "$PR_ARTIFACT_DIR/browser.tar" -C "$PR_ARTIFACT_DIR/runtime" nook-app/nook-web/nook-web-research/dist
      - name: Upload full browser handoff
        id: browser-handoff
        if: inputs.full_e2e_requested && steps.browser-scope.outputs.validation == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nook-pr-artifacts/browser.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 1

  browsers:
    name: Full browser tests (${{ matrix.suite }})
    needs: [validation]
    if: inputs.full_e2e_requested && needs.validation.outputs.validation == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: web
            task: _ci:main:web:e2e-only
            shard: ""
          - suite: extension-1
            task: _extension:test:e2e:shard
            shard: 1/2
          - suite: extension-2
            task: _extension:test:e2e:shard
            shard: 2/2
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (vars.NOOK_CONTAINER_RUNS_ON || 'nook-k0s-container') || 'ubuntu-latest' }}
    container:
      image: ${{ vars.NOOK_PR_RUNNER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      NOOK_E2E_SYNC_PROVIDER: file
      NOOK_EXTENSION_CHANNEL: pr-${{ github.event.pull_request.number }}
      NOOK_EXTENSION_COMMIT: ${{ needs.validation.outputs.source-sha }}
      VITE_SITE_URL: https://pr-${{ github.event.pull_request.number }}.nokey-sh.pages.dev
      VITE_SIMPLE_APP_URL: https://pr-${{ github.event.pull_request.number }}.nokey-simple.pages.dev
      VITE_SENTINEL_APP_URL: https://pr-${{ github.event.pull_request.number }}.nokey-sentinel.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.validation.outputs.browser-artifact-id }}
          path: ${{ runner.temp }}/browser-handoff
          merge-multiple: true
      - name: Restore prepared browser artifacts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tar -xf "$RUNNER_TEMP/browser-handoff/browser.tar"
          task --silent ci:pr:browser:runtime
      - name: Run isolated browser suite
        env:
          BROWSER_TASK: ${{ matrix.task }}
          E2E_SHARD: ${{ matrix.shard }}
        run: task --silent "$BROWSER_TASK"
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-playwright-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nook-app/nook-web/nook-web-app/test-results/
            nook-app/nook-web/nook-web-app/playwright-report/
            nook-app/nook-web/nook-web-extension/test-results/
          if-no-files-found: warn
          retention-days: 15

  completion:
    # Keep the required check name attached to the complete validation join.
    name: Verify and preview
    needs: [validation, browsers]
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (vars.NOOK_CONTAINER_RUNS_ON || 'nook-k0s-container') || 'ubuntu-latest' }}
    container:
      image: ${{ vars.NOOK_PR_RUNNER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Require every selected validation result
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
          FULL_E2E: ${{ inputs.full_e2e_requested }}
          PRODUCT_VALIDATION: ${{ needs.validation.outputs.validation }}
        run: |
          test "$VALIDATION_RESULT" = success
          if [ "$FULL_E2E" = true ] && [ "$PRODUCT_VALIDATION" = true ]; then
            test "$BROWSER_RESULT" = success
          else
            test "$BROWSER_RESULT" = skipped
          fi
      - uses: actions/checkout@v7
        if: inputs.full_e2e_requested && needs.validation.outputs.validation == 'true'
        with:
          ref: ${{ needs.validation.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: inputs.full_e2e_requested && needs.validation.outputs.validation == 'true'
        with:
          artifact-ids: ${{ needs.validation.outputs.browser-artifact-id }}
          path: ${{ runner.temp }}/browser-handoff
          merge-multiple: true
      - name: Restore verified production artifacts
        if: inputs.full_e2e_requested && needs.validation.outputs.validation == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tar -xf "$RUNNER_TEMP/browser-handoff/browser.tar"
          task --silent ci:pr:browser:runtime
      - name: Deploy full-suite preview
        id: previews
        if: inputs.full_e2e_requested && needs.validation.outputs.validation == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: ./.github/actions/nook-pr-preview
        with:
          cloudflare-token: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          cloudflare-account: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          source-sha: ${{ needs.validation.outputs.source-sha }}
          research-requested: ${{ needs.validation.outputs.research }}
      - name: Report full-suite research preview
        if: inputs.full_e2e_requested && needs.validation.outputs.research == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: ./.github/actions/nook-pr-research-preview
        with:
          deployment-url: ${{ steps.previews.outputs.research-url }}
          deploy-branch: ${{ steps.previews.outputs.research-branch }}

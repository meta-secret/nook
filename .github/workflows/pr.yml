# Pull requests: run Rust/WASM/JS unit tests, Svelte/type/lint/format checks, build no-opt WASM,
# build and deploy the preview, and the shared Rust ecosystem gates. Full browser regression e2e
# is opt-in through the `ci:full-e2e` label for PRs that repair a Main failure; UI-changing PRs
# otherwise run only their dedicated headless demo specs and retain the resulting videos on the
# PR workflow run. Main also runs the full local-provider and extension suites. Live-provider
# sync checks remain available through the manually dispatched e2e-pr.yml workflow.
# Research-only changes are handled by web-research.yml. Cortex, Cursor, and
# agentic-AI-only changes do not need the product pipeline. Agent statistics
# live in meta-secret/nook-workbench.
# Validation is requested explicitly by adding a label. Ordinary pushes do not
# spend hosted workers. A later push invalidates the prior head's checks, so the
# label must be toggled again before merge. The trusted Linear close workflow
# claims the same concurrency group to cancel in-flight validation on PR close.
# Schedule, manual, and minds-only PR ecosystem entry points stay in rust-ecosystem.yml.

name: PR

on:
  pull_request:
    types: [labeled]
    paths-ignore:
      - .cortex/**
      - .cursor/**
      - .github/workflows/web-research.yml
      - agentic-ai/**
      - nook-app/nook-web/nook-web-research/**

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
  DOCKER_IMAGE: nook-web:run-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_E2E_IMAGE: nook-web-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validation-request:
    name: Validate explicit CI request
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: Reject unsupported label events
        env:
          REQUESTED_LABEL: ${{ github.event.label.name }}
        run: |
          case "$REQUESTED_LABEL" in
            ci:validate|ci:full-e2e) ;;
            *)
              echo "Unsupported PR validation label: $REQUESTED_LABEL" >&2
              exit 1
              ;;
          esac

  rust-ecosystem:
    name: Rust ecosystem
    if: >-
      (github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e')
    needs: validation-request
    uses: ./.github/workflows/rust-ecosystem-checks.yml
    secrets: inherit
    with:
      fuzz_seconds: "20"
      isolated_cache_write: "true"

  rust:
    name: Native Rust verification
    if: >-
      (github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e')
    needs: validation-request
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: "true"

      - name: Derive native validation key
        id: native-key
        run: |
          echo "value=nook-trusted-native-validation-v2-${{ hashFiles('.dockerignore', '.github/workflows/pr.yml', '.github/workflows/pr-validation-handoff.yml', '.github/actions/nook-cache-connect/**', '.github/actions/nook-docker-setup/**', 'Taskfile.yml', 'preflight/**', 'nook-app/Taskfile.yml', 'nook-app/ci/Taskfile.yml', 'nook-app/nook-platform/docker/**', 'nook-app/nook-web/docker/**', 'nook-app/nook-platform/docker/Taskfile.yml', 'nook-app/docker-bake.hcl', 'nook-app/nook-platform/nook-app-common/**', 'nook-app/nook-platform/nook-core/**', 'nook-app/nook-platform/nook-auth2/**', 'nook-app/nook-platform/nook-replication/**', 'nook-app/nook-platform/nook-event-log/**', 'nook-app/nook-platform/nook-companion-core/**', 'nook-app/nook-platform/nook-companion-wasm/**', 'nook-app/nook-platform/nook-wasm/**', 'nook-app/nook-platform/Cargo.toml', 'nook-app/nook-platform/Cargo.lock', 'nook-app/nook-platform/.cargo/**', 'nook-app/nook-platform/.config/**') }}" >> "$GITHUB_OUTPUT"

      - name: Locate trusted native handoff
        id: trusted-native
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: ${{ steps.native-key.outputs.value }}
        with:
          retries: 3
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo,
              name: process.env.ARTIFACT_NAME,
              per_page: 100,
            })
            for (const artifact of artifacts.sort((a, b) => b.id - a.id)) {
              if (artifact.expired || !artifact.workflow_run?.id) continue
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: artifact.workflow_run.id,
              })
              const workflowPath = run.path?.replace(/@[^@]+$/, '')
              if (
                run.name === 'PR validation handoff' &&
                workflowPath === '.github/workflows/pr-validation-handoff.yml' &&
                run.head_branch === context.payload.repository.default_branch &&
                run.status === 'completed' &&
                run.conclusion === 'success' &&
                run.event === 'workflow_run'
              ) {
                core.setOutput('found', 'true')
                core.setOutput('artifact-id', String(artifact.id))
                core.setOutput('run-id', String(run.id))
                return
              }
            }
            core.setOutput('found', 'false')

      - name: Download trusted native handoff
        if: steps.trusted-native.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.trusted-native.outputs.artifact-id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/rust
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.trusted-native.outputs.run-id }}

      - name: Validate trusted native handoff
        if: steps.trusted-native.outputs.found == 'true'
        env:
          EXPECTED_KEY: ${{ steps.native-key.outputs.value }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/nook-ci-artifacts/rust"
          jq -e --arg key "$EXPECTED_KEY" \
            '.schema_version == 1 and
             .kind == "native" and
             .input_key == $key and
             .source_workflow == ".github/workflows/pr.yml" and
             .producer_jobs_verified == true' \
            "$dir/nook-validation-manifest.json" >/dev/null
          for file in summary.txt summary.json lcov.info coverage-floor.json; do
            test -s "$dir/$file"
          done
          chmod +x "$dir/tools/nook-preflight"
          test -x "$dir/tools/nook-preflight"

      # A producer miss runs preflight inside task ci:pr:rust. Exact trusted handoffs still need
      # repository invariants checked on this PR head, but must not run the same Docker build twice.
      - name: Repository invariant preflight
        if: steps.trusted-native.outputs.found == 'true'
        run: task preflight

      - name: Rust format, clippy, tests, and coverage
        if: steps.trusted-native.outputs.found != 'true'
        run: >-
          GHA_CACHE_WRITE_ENABLED=""
          task ci:pr:rust
          CI_ARTIFACT_DIR=${{ runner.temp }}/nook-ci-artifacts/rust
        env:
          CI: true

      - name: Publish git-scoped native BuildKit cache
        if: steps.trusted-native.outputs.found != 'true'
        run: |
          if [ "${NOOK_ARC_RUNNER:-}" = "1" ]; then
            echo "ARC keeps the verified native graph local; Main and sccache remain reusable"
            exit 0
          fi
          task ci:main:publish-native-cache
        env:
          GHA_CACHE_WRITE_ENABLED: "1"

      - name: Upload Rust coverage handoff
        uses: actions/upload-artifact@v7
        with:
          name: pr-rust-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/rust
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  wasm:
    name: WASM build and artifact
    if: >-
      (github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e')
    needs: validation-request
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    outputs:
      run-node-tests: ${{ steps.decide-node-tests.outputs.run-node-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: "true"

      - name: Derive WASM validation key
        id: wasm-key
        run: |
          echo "value=nook-trusted-wasm-validation-v2-${{ hashFiles('.dockerignore', '.github/workflows/pr.yml', '.github/workflows/pr-validation-handoff.yml', '.github/actions/nook-cache-connect/**', '.github/actions/nook-docker-setup/**', 'Taskfile.yml', 'nook-app/Taskfile.yml', 'nook-app/ci/Taskfile.yml', 'nook-app/nook-platform/docker/**', 'nook-app/nook-web/docker/**', 'nook-app/nook-platform/docker/Taskfile.yml', 'nook-app/docker-bake.hcl', 'nook-app/nook-platform/nook-app-common/**', 'nook-app/nook-platform/nook-core/**', 'nook-app/nook-platform/nook-auth2/**', 'nook-app/nook-platform/nook-replication/**', 'nook-app/nook-platform/nook-event-log/**', 'nook-app/nook-platform/nook-companion-core/**', 'nook-app/nook-platform/nook-companion-wasm/**', 'nook-app/nook-platform/nook-wasm/**', 'nook-app/nook-platform/Cargo.toml', 'nook-app/nook-platform/Cargo.lock', 'nook-app/nook-platform/.cargo/**', 'nook-app/nook-platform/.config/**') }}" >> "$GITHUB_OUTPUT"

      - name: Locate trusted WASM handoff
        id: trusted-wasm
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: ${{ steps.wasm-key.outputs.value }}
        with:
          retries: 3
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo,
              name: process.env.ARTIFACT_NAME,
              per_page: 100,
            })
            for (const artifact of artifacts.sort((a, b) => b.id - a.id)) {
              if (artifact.expired || !artifact.workflow_run?.id) continue
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: artifact.workflow_run.id,
              })
              const workflowPath = run.path?.replace(/@[^@]+$/, '')
              if (
                run.name === 'PR validation handoff' &&
                workflowPath === '.github/workflows/pr-validation-handoff.yml' &&
                run.head_branch === context.payload.repository.default_branch &&
                run.status === 'completed' &&
                run.conclusion === 'success' &&
                run.event === 'workflow_run'
              ) {
                core.setOutput('found', 'true')
                core.setOutput('artifact-id', String(artifact.id))
                core.setOutput('run-id', String(run.id))
                return
              }
            }
            core.setOutput('found', 'false')

      - name: Download trusted WASM handoff
        if: steps.trusted-wasm.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.trusted-wasm.outputs.artifact-id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.trusted-wasm.outputs.run-id }}

      - name: Validate trusted WASM handoff
        if: steps.trusted-wasm.outputs.found == 'true'
        env:
          EXPECTED_KEY: ${{ steps.wasm-key.outputs.value }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/nook-ci-artifacts/joined/nook-wasm"
          jq -e --arg key "$EXPECTED_KEY" \
            '.schema_version == 1 and
             .kind == "wasm" and
             .input_key == $key and
             .source_workflow == ".github/workflows/pr.yml" and
             .producer_jobs_verified == true' \
            "$dir/nook-validation-manifest.json" >/dev/null
          for file in package.json nook_wasm.js nook_wasm.d.ts nook_wasm_bg.wasm nook_wasm_bg.wasm.d.ts nook-wasm-build-mode; do
            test -s "$dir/$file"
          done
          for file in package.json nook_companion_wasm.js nook_companion_wasm.d.ts nook_companion_wasm_bg.wasm nook_companion_wasm_bg.wasm.d.ts; do
            test -s "$dir/nook-companion-wasm/$file"
          done

      - name: Decide whether Node tests must run
        id: decide-node-tests
        run: |
          if [ "${{ steps.trusted-wasm.outputs.found }}" = "true" ]; then
            echo "run-node-tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "run-node-tests=true" >> "$GITHUB_OUTPUT"
          fi

      - name: WASM clippy and build
        if: steps.trusted-wasm.outputs.found != 'true'
        run: task ci:pr:wasm CI_ARTIFACT_DIR=${{ runner.temp }}/nook-ci-artifacts/joined
        env:
          CI: true
          WASM_BUILD_MODE: dev
          GHA_CACHE_WRITE_ENABLED: ""

      - name: Publish git-scoped WASM BuildKit cache
        if: steps.trusted-wasm.outputs.found != 'true'
        run: |
          if [ "${NOOK_ARC_RUNNER:-}" = "1" ]; then
            echo "ARC keeps the verified WASM graph local; Main and sccache remain reusable"
            exit 0
          fi
          task ci:main:publish-wasm-cache
        env:
          GHA_CACHE_WRITE_ENABLED: "1"
          WASM_BUILD_MODE: dev

      - name: Stamp WASM handoff attempt
        run: echo "$GITHUB_RUN_ATTEMPT" > "${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm/nook-run-attempt"

      # Publish as soon as build succeeds so web verification can start through needs.
      - name: Upload built WASM handoff
        uses: actions/upload-artifact@v7
        with:
          name: pr-wasm-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  wasm-node-test:
    name: WASM Node tests
    if: >-
      (github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e')
    needs: wasm
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        if: needs.wasm.outputs.run-node-tests == 'true'
        uses: actions/checkout@v7

      - name: Docker setup
        if: needs.wasm.outputs.run-node-tests == 'true'
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: "true"

      - name: WASM Node tests
        if: needs.wasm.outputs.run-node-tests == 'true'
        run: |
          if [ "${NOOK_ARC_RUNNER:-}" = "1" ]; then
            GHA_CACHE_WRITE_ENABLED="" task ci:wasm:node-test
          else
            GHA_CACHE_WRITE_ENABLED=1 task ci:wasm:node-test
          fi
        env:
          CI: true
          WASM_BUILD_MODE: dev

      - name: Trusted handoff already covered Node tests
        if: needs.wasm.outputs.run-node-tests != 'true'
        run: echo "Exact trusted WASM handoff already proved Node tests"

      - name: Preserve cache telemetry
        if: always() && needs.wasm.outputs.run-node-tests == 'true'
        uses: ./.github/actions/nook-cache-telemetry

  verify:
    name: Web verification
    if: >-
      (github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e')
    needs: [validation-request, wasm]
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Expose Actions Node.js runtime
        uses: ./.github/actions/nook-node-setup

      - name: Test Linear UI demo publishing helper
        run: node --test .github/scripts/linear-ui-demo.test.cjs

      - name: Test Main build statistics collector
        run: node --test .github/scripts/main-build-stats.test.cjs

      - name: Test Main failure handoff
        run: node --test .github/scripts/main-failure-handoff.test.cjs

      - name: Test Workbench agent records
        run: node --test .github/scripts/workbench-records.test.cjs

      - name: Test cache telemetry collector
        run: node --test .github/scripts/cache-telemetry.test.cjs

      - name: Install Bun for registry cache descriptor tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Test registry cache descriptor integrity
        run: bun test ./.github/scripts/registry-cache-descriptor.test.ts

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: "true"

      - name: Download built WASM handoff
        uses: actions/download-artifact@v8
        with:
          name: pr-wasm-${{ github.run_id }}
          path: ${{ runner.temp }}/nook-ci-artifacts/joined/nook-wasm

      - name: Confirm WASM handoff shape
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/nook-ci-artifacts/joined/nook-wasm"
          test -s "$dir/nook_wasm.js"
          test -s "$dir/nook_wasm_bg.wasm"
          test -s "$dir/nook-companion-wasm/nook_companion_wasm.js"
          test -s "$dir/nook-companion-wasm/nook_companion_wasm_bg.wasm"
          test -s "$dir/nook-run-attempt"

      - name: Svelte checks, JS unit tests, lint, and preview build (no browser e2e)
        run: |
          set -euo pipefail
          task ci:pr:web CI_ARTIFACT_DIR=${{ runner.temp }}/nook-ci-artifacts/joined \
            VITE_BASE=/ \
            VITE_SITE_URL=https://pr-${{ github.event.pull_request.number }}.nokey-sh.pages.dev \
            VITE_PUBLIC_APP_URL=https://pr-${{ github.event.pull_request.number }}.nook-1n8.pages.dev \
            VITE_SIMPLE_APP_URL=https://pr-${{ github.event.pull_request.number }}.nokey-simple.pages.dev \
            VITE_SENTINEL_APP_URL=https://pr-${{ github.event.pull_request.number }}.nokey-sentinel.pages.dev \
            WASM_BUILD_MODE=dev
        env:
          CI: true
          GHA_CACHE_WRITE_ENABLED: ""
          NOOK_SIMPLE_VAULT_URL: https://pr-${{ github.event.pull_request.number }}.nokey-simple.pages.dev/
          NOOK_EXTENSION_CHANNEL: pr-${{ github.event.pull_request.number }}
          NOOK_EXTENSION_COMMIT: ${{ github.event.pull_request.head.sha }}
          NOOK_EXTENSION_SITE_URL: https://pr-${{ github.event.pull_request.number }}.nokey-sh.pages.dev/
          WEB_DEPLOY_ARTIFACT_DIR: ${{ runner.temp }}/nook-ci-artifacts/pr-web-dist

      - name: Publish git-scoped web BuildKit cache
        run: |
          if [ "${NOOK_ARC_RUNNER:-}" = "1" ]; then
            echo "ARC keeps the verified web graph local; Main remains reusable"
            exit 0
          fi
          task ci:main:publish-web-cache
        env:
          GHA_CACHE_WRITE_ENABLED: "1"

      - name: Publish exact-source PR browser job image
        run: task web:e2e:kubernetes-image
        env:
          DOCKER_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-pr-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
          DOCKER_E2E_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-pr-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload preview dist handoff
        uses: actions/upload-artifact@v7
        with:
          name: pr-web-dist-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nook-ci-artifacts/pr-web-dist/nook-app/nook-web/nook-web-app/dist
            ${{ runner.temp }}/nook-ci-artifacts/pr-web-dist/nook-app/nook-web/nook-vault-simple/dist
            ${{ runner.temp }}/nook-ci-artifacts/pr-web-dist/nook-app/nook-web/nook-vault-sentinel/dist
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Preserve cache telemetry
        if: always()
        uses: ./.github/actions/nook-cache-telemetry

  ui-demo:
    name: Headless UI demo
    if: >-
      (github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e')
    needs: [validation-request, verify]
    runs-on: nook-k0s-container
    container:
      image: registry.dev.nokey.sh/nook/remote-buildcache/nook-pr-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
    steps:
      - name: Enforce the UI demo contract
        id: ui-demo-contract
        working-directory: /meta-secret/nook
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch "https://github.com/${{ github.repository }}.git" "$BASE_SHA" --depth=1
          bash .github/scripts/ui-demo-contract.sh "$BASE_SHA"

      - name: Record headless UI demo
        id: record-ui-demo
        if: steps.ui-demo-contract.outputs.required == 'true'
        working-directory: /meta-secret/nook
        run: task _web:test:ui-demo
        env:
          CI: true
          NOOK_UI_DEMO_OUTPUT_DIR: ${{ github.workspace }}/ui-demo
          UI_DEMO_SPECS: ${{ steps.ui-demo-contract.outputs.specs }}

      - name: Upload UI demo video
        if: always() && steps.ui-demo-contract.outputs.required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-demo-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ui-demo
          retention-days: 90
          if-no-files-found: warn
          overwrite: true

      - name: Link UI demo from the pull request
        if: always() && steps.ui-demo-contract.outputs.required == 'true'
        uses: actions/github-script@v9
        env:
          DEMO_OUTCOME: ${{ steps.record-ui-demo.outcome }}
          DEMO_SPECS: ${{ steps.ui-demo-contract.outputs.specs }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          retries: 3
          script: |
            const marker = '<!-- nook-ui-demo -->'
            const issueNumber = Number(process.env.PR_NUMBER)
            const artifactName = `ui-demo-pr-${issueNumber}-${process.env.PR_HEAD_SHA}`
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '### UI demo',
              '',
              `- Result: **${process.env.DEMO_OUTCOME}**`,
              `- Video artifact: [${artifactName}](${runUrl}#artifacts)`,
              '- Linear archive: publishing from the trusted post-workflow',
              `- Demo spec: \`${process.env.DEMO_SPECS}\``,
              '',
              'The demo runs in headless Chromium. Playwright assertions are authoritative; the video is a review aid for humans and AI.',
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body?.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              })
            }

  preview:
    name: Verify and preview
    if: >-
      always() &&
      (github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e')
    # Native must succeed before the merge gate check can go green. A green
    # preview with a failed Native job previously allowed false readiness.
    needs: [rust, wasm, verify, wasm-node-test, ui-demo]
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    steps:
      - name: Enforce required verification results
        env:
          NATIVE_RESULT: ${{ needs.rust.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
          WEB_RESULT: ${{ needs.verify.result }}
          WASM_NODE_RESULT: ${{ needs.wasm-node-test.result }}
          UI_DEMO_RESULT: ${{ needs.ui-demo.result }}
        run: |
          set -euo pipefail
          failed=0
          for dependency in \
            "Native Rust=$NATIVE_RESULT" \
            "WASM build=$WASM_RESULT" \
            "Web verification=$WEB_RESULT" \
            "WASM Node tests=$WASM_NODE_RESULT" \
            "Headless UI demo=$UI_DEMO_RESULT"
          do
            name="${dependency%%=*}"
            result="${dependency#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::$name finished with $result"
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node for host Pages deploy
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download preview dist handoff
        uses: actions/download-artifact@v8
        with:
          name: pr-web-dist-${{ github.run_id }}
          # upload-artifact roots at the least common ancestor of the dist paths
          # (nook-app/nook-web), so restore into that directory.
          path: nook-app/nook-web

      - name: Confirm preview dist handoff
        run: |
          set -euo pipefail
          test -d nook-app/nook-web/nook-web-app/dist
          test -d nook-app/nook-web/nook-web-app/dist/site
          test -d nook-app/nook-web/nook-vault-simple/dist
          test -d nook-app/nook-web/nook-vault-sentinel/dist

      - name: Deploy and verify Pages previews
        id: deploy-all
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
          CF_PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NOOK_HOST_PAGES_DEPLOY: "1"
        run: bash .github/scripts/ci-pr-deploy-and-verify-previews.sh

      - name: Comment preview URL on PR
        if: steps.deploy-all.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy-all.outputs.preview_url }}
          SITE_PREVIEW_URL: ${{ steps.deploy-all.outputs.site_url }}
          SIMPLE_PREVIEW_URL: ${{ steps.deploy-all.outputs.simple_url }}
          SENTINEL_PREVIEW_URL: ${{ steps.deploy-all.outputs.sentinel_url }}
          EXTENSION_PREVIEW_URL: ${{ steps.deploy-all.outputs.extension_url }}
        with:
          retries: 3
          script: |
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds))
            const withBackoff = async (label, request) => {
              let lastError
              for (let attempt = 1; attempt <= 5; attempt += 1) {
                try {
                  return await request()
                } catch (error) {
                  lastError = error
                  if (attempt === 5) break
                  const delaySeconds = attempt * 15
                  core.warning(`${label} failed on attempt ${attempt}; retrying in ${delaySeconds}s`)
                  await sleep(delaySeconds * 1000)
                }
              }
              throw lastError
            }
            const marker = '### Preview deployed'
            const root = process.env.PREVIEW_URL.replace(/\/$/, '')
            const site = process.env.SITE_PREVIEW_URL.replace(/\/$/, '')
            const simple = process.env.SIMPLE_PREVIEW_URL.replace(/\/$/, '')
            const sentinel = process.env.SENTINEL_PREVIEW_URL.replace(/\/$/, '')
            const extension = process.env.EXTENSION_PREVIEW_URL
            const body = `${marker}\n\n- Unified internal test harness: ${root}/\n- Site: ${site}/\n- Simple Vault: ${simple}/\n- Sentinel Vault: ${sentinel}/\n- Browser extension: ${extension}`
            const commentQuery = await withBackoff('Listing preview comments', () => github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    comments(last: 100) {
                      nodes { id body }
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.payload.pull_request.number,
            }))
            const pullRequest = commentQuery.repository.pullRequest
            const existing = pullRequest.comments.nodes.find((comment) => comment.body?.startsWith(marker))
            if (existing) {
              await withBackoff('Updating the preview comment', () => github.graphql(`
                mutation($id: ID!, $body: String!) {
                  updateIssueComment(input: { id: $id, body: $body }) {
                    issueComment { id }
                  }
                }
              `, { id: existing.id, body }))
            } else {
              await withBackoff('Creating the preview comment', () => github.graphql(`
                mutation($subjectId: ID!, $body: String!) {
                  addComment(input: { subjectId: $subjectId, body: $body }) {
                    commentEdge { node { id } }
                  }
                }
              `, { subjectId: pullRequest.id, body }))
            }

      - name: Record github-pages deployment
        if: steps.deploy-all.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy-all.outputs.site_url }}
          UNIFIED_PREVIEW_URL: ${{ steps.deploy-all.outputs.preview_url }}
          SIMPLE_PREVIEW_URL: ${{ steps.deploy-all.outputs.simple_url }}
          SENTINEL_PREVIEW_URL: ${{ steps.deploy-all.outputs.sentinel_url }}
          EXTENSION_PREVIEW_URL: ${{ steps.deploy-all.outputs.extension_url }}
        with:
          retries: 3
          script: |
            const previewUrl = process.env.PREVIEW_URL
            if (!previewUrl) {
              throw new Error('Cloudflare preview deploy succeeded but did not emit preview_url')
            }

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'github-pages',
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              description: `PR #${context.payload.pull_request.number} preview`,
              payload: {
                pull_request: context.payload.pull_request.number,
                preview_url: previewUrl,
                unified_preview_url: process.env.UNIFIED_PREVIEW_URL,
                simple_preview_url: process.env.SIMPLE_PREVIEW_URL,
                sentinel_preview_url: process.env.SENTINEL_PREVIEW_URL,
                extension_preview_url: process.env.EXTENSION_PREVIEW_URL,
              },
            })

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'github-pages',
              environment_url: previewUrl,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Cloudflare Pages preview deployed',
              auto_inactive: false,
            })

  coverage:
    name: Rust coverage report
    if: >-
      (github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e')
    needs: rust
    uses: ./.github/workflows/pr-coverage.yml
    secrets: inherit

  full-e2e-shard:
    name: Full browser e2e shard (${{ matrix.shard }}/2)
    if: contains(github.event.pull_request.labels.*.name, 'ci:full-e2e')
    needs: [verify, wasm-node-test]
    runs-on: nook-k0s-container
    container:
      image: registry.dev.nokey.sh/nook/remote-buildcache/nook-pr-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Local-provider web e2e from verified WASM
        working-directory: /meta-secret/nook
        run: task _ci:main:web:e2e-only
        env:
          CI: true
          NOOK_E2E_SHARD: ${{ matrix.shard }}/2

  full-e2e:
    name: Full browser e2e (main fix)
    if: >-
      always() &&
      contains(github.event.pull_request.labels.*.name, 'ci:full-e2e')
    needs: [full-e2e-shard, wasm]
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    steps:
      - name: Require both browser shards
        env:
          SHARD_RESULT: ${{ needs.full-e2e-shard.result }}
        run: test "$SHARD_RESULT" = "success"

  full-extension-e2e:
    name: Full extension e2e (main fix)
    if: contains(github.event.pull_request.labels.*.name, 'ci:full-e2e')
    needs: [verify, wasm-node-test]
    runs-on: nook-k0s-container
    container:
      image: registry.dev.nokey.sh/nook/remote-buildcache/nook-pr-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
    steps:
      - name: Extension e2e from verified WASM
        working-directory: /meta-secret/nook
        run: task _extension:test:e2e
        env:
          CI: true

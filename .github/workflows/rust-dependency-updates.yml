# Weekly direct Rust dependency audit. Outdated dependency reports are retained
# as workflow artifacts for manual triage.
name: Rust dependency updates

on:
  schedule:
    # GitHub cron is UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-dependency-updates
  # An agent may have already pushed a branch or opened a PR.
  cancel-in-progress: false

jobs:
  audit:
    name: Audit direct Cargo dependencies
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Connect Docker Rust audit tooling
        uses: ./.github/actions/nook-docker-setup
        with:
          cache-selection: connection-only
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          cache-write: "false"
          main-cache-only: "true"

      - name: Check every direct Cargo dependency
        id: audit
        env:
          RUST_DEPS_OUTDATED_REPORT: ${{ runner.temp }}/rust-deps-outdated.txt
        run: task rust:deps:outdated
      - if: steps.audit.outputs.outdated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-deps-outdated
          path: ${{ runner.temp }}/rust-deps-outdated.txt

# Weekly direct Rust dependency audit. When Cargo manifests are behind crates.io,
# the existing CI agent updates them in a PR and validates the full deterministic
# test suite before opening a PR for explicit review and merge authorization.
name: Rust dependency updates

on:
  schedule:
    # GitHub cron is UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-dependency-updates
  # An agent may have already pushed a branch or opened a PR.
  cancel-in-progress: false

jobs:
  audit:
    name: Audit direct Cargo dependencies
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    outputs:
      outdated: ${{ steps.audit.outputs.outdated }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # cargo-outdated is an orchestration-only tool; application builds and
      # validation remain inside the repository Docker Task targets.
      - name: Install cargo-outdated
        run: cargo install cargo-outdated --version 0.19.0 --locked

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0

      - name: Check every direct Cargo dependency
        id: audit
        env:
          RUST_DEPS_OUTDATED_REPORT: ${{ runner.temp }}/rust-deps-outdated.txt
        run: task rust:deps:outdated
      - if: steps.audit.outputs.outdated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-deps-outdated
          path: ${{ runner.temp }}/rust-deps-outdated.txt

  update:
    name: AI update, full test, and PR
    needs: audit
    if: needs.audit.outputs.outdated == 'true'
    runs-on: ${{ vars.NOOK_HIVE_RUNS_ON || 'nook-k0s-hive' }}
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      FIX_BRANCH: fix/rust-dependencies-${{ github.run_id }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      CI_AGENT_FIX_PROFILE: rust-dependency-update
      CI_AGENT_PROMPT_FILE: .github/prompts/rust-dependency-update-agent.md
      CI_FIX_LABEL: Rust dependency update
      CI_AGENT_TIMEOUT_MS: '10800000'
      AGENT_PR_TITLE: "chore(rust): update direct dependencies"
      AGENT_PR_BODY: |
        ## Summary

        - Update the audited direct Rust dependencies included in this PR.

        ## Agent task provenance

        - Harness: GitHub Actions workflow `rust-dependency-updates.yml`
        - Task name: Weekly direct Rust dependency update
        - Task ID: [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

        ## Nook Workbench

        - Focused issue: unavailable — scheduled maintenance has no focused Workbench issue
        - Immutable plan: unavailable — this fixed-scope workflow does not publish a Workbench plan
        - Worklog: unavailable — the workflow run records the result

        ## Validation

        - Repository dependency-update validation: passed before publication
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.audit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rust-deps-outdated
          path: ${{ runner.temp }}

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0

      - name: Expose Actions Node.js runtime
        uses: ./.github/actions/nook-node-setup

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
      - name: Build split Rust/WASM and web images
        run: task setup WASM_BUILD_MODE=prod

      - name: Run dependency-update agent directly on ARC
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          NOOK_GITHUB_PAT: ${{ secrets.NOOK_GITHUB_PAT }}
          REPO_ROOT: ${{ github.workspace }}
          RUST_DEPS_OUTDATED_REPORT: ${{ runner.temp }}/rust-deps-outdated.txt
          VITE_BASE: /
          WASM_BUILD_MODE: prod
          VITE_VAULT_SYNC_INTERVAL_MS: '1000'
        run: task ci-agent:fix

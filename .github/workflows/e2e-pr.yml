# Manually run Playwright e2e against a pull request branch.
#
# PR CI intentionally omits browser e2e. Main runs the full suite after merge.
# Use this workflow for explicit pre-merge validation or debugging on a PR branch,
# including live-provider sync checks.
# Inputs:
#   pr_number — PR to checkout (refs/pull/<n>/head)
#   suite     — e2e-pr, e2e, sync-live, or all

name: E2E (PR)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test
        required: true
        type: string
      suite:
        description: Playwright project(s) to run
        required: true
        type: choice
        default: all
        options:
          - all
          - e2e-pr
          - e2e
          - sync-live
          - local
          - sync-stub

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-pr-${{ inputs.pr_number }}-${{ inputs.suite }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium

jobs:
  image:
    name: Build PR browser image
    runs-on: ${{ vars.NOOK_RUNS_ON || 'nook-k0s' }}
    steps:
      - name: Resolve PR head SHA
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number('${{ inputs.pr_number }}')
            if (!Number.isFinite(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pr_number: ${'${{ inputs.pr_number }}'}`)
              return
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })
            core.setOutput('ref', pr.head.sha)
            core.setOutput('branch', pr.head.ref)
            core.info(`PR #${prNumber}: ${pr.head.ref} @ ${pr.head.sha}`)

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: Docker setup
        uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          # This workflow run belongs to the dispatch ref while the checkout is an arbitrary PR
          # head. Restore shared layers, but never replace the default-branch cache scopes.
          cache-write: "false"

      - name: Publish exact-source browser job image
        run: task web:e2e:kubernetes-image
        env:
          DOCKER_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-manual-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
          DOCKER_E2E_IMAGE: registry.dev.nokey.sh/nook/remote-buildcache/nook-manual-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}

  e2e:
    name: Playwright (${{ inputs.suite }})
    needs: image
    runs-on: nook-k0s-container
    container:
      image: registry.dev.nokey.sh/nook/remote-buildcache/nook-manual-e2e:run-${{ github.run_id }}-${{ github.run_attempt }}
      credentials:
        username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
        password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
    defaults:
      run:
        working-directory: /meta-secret/nook
    steps:

      - name: E2e (e2e-pr)
        if: inputs.suite == 'e2e-pr' || inputs.suite == 'local'
        run: task _web:test:e2e:pr:parallel
        env:
          CI: true

      - name: E2e (e2e)
        if: >-
          inputs.suite == 'all' || inputs.suite == 'e2e' ||
          inputs.suite == 'sync-stub'
        run: task _web:test:e2e:parallel
        env:
          CI: true

      - name: E2e (sync-live)
        if: inputs.suite == 'all' || inputs.suite == 'sync-live'
        run: task _web:test:e2e:sync-live:parallel
        env:
          CI: true
          NOOK_E2E_SYNC_PROVIDER: github
          NOOK_GITHUB_PAT: ${{ secrets.NOOK_GITHUB_PAT }}
          NOOK_GITHUB_E2E_REPO: nook-e2e-pr-${{ inputs.pr_number }}-${{ github.run_id }}
          NOOK_GITHUB_POLL_MS: "3000"
          NOOK_GITHUB_SYNC_TIMEOUT_MS: "15000"
          NOOK_GITHUB_CONNECT_TIMEOUT_MS: "30000"

      # Cancellation can interrupt Playwright and Task deferred cleanup after
      # the disposable repository is created. Keep cleanup in a separate
      # always-run step so superseded manual runs cannot leak live test state.
      - name: Clean up live-sync test repository
        if: >-
          always() &&
          (inputs.suite == 'all' || inputs.suite == 'sync-live')
        uses: actions/github-script@v9
        env:
          NOOK_GITHUB_E2E_REPO: nook-e2e-pr-${{ inputs.pr_number }}-${{ github.run_id }}
        with:
          github-token: ${{ secrets.NOOK_GITHUB_PAT }}
          script: |
            const repo = process.env.NOOK_GITHUB_E2E_REPO
            const { data: user } = await github.rest.users.getAuthenticated()
            try {
              await github.rest.repos.delete({ owner: user.login, repo })
              core.info(`Deleted live-sync test repository: ${user.login}/${repo}`)
            } catch (error) {
              if (error.status !== 404) throw error
              core.info(
                `Live-sync test repository already absent: ${user.login}/${repo}`,
              )
            }

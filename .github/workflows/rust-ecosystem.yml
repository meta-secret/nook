# Scheduled and manual specialist entry points for Rust ecosystem gates.
# Every labeled PR, including minds changes, runs these jobs inside pr.yml so
# one exact-head request cannot reserve two copies of the expensive suite.

name: Rust ecosystem checks

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    rust-ecosystem-specialist-${{ github.event_name }}-
    ${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  ecosystem:
    name: Rust ecosystem
    uses: ./.github/workflows/rust-ecosystem-checks.yml
    secrets: inherit
    with:
      fuzz_seconds: "900"
      isolated_cache_write: "false"

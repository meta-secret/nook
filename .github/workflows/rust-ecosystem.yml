# Specialist entry points for Rust ecosystem gates.
# Labeled product PRs run the same jobs inside pr.yml so every exact-head gate
# appears on one Actions run page. Ordinary PR pushes never start these checks.
# Main runs the same jobs inside main.yml for every merged-head verification.
# Canonical AI-only PRs with a minds source or destination use this workflow;
# the product PR workflow instantiates only its cheap classifier for them.

name: Rust ecosystem checks

on:
  pull_request:
    types: [labeled, edited]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    rust-ecosystem-specialist-${{ github.event_name }}-
    ${{ github.event.pull_request.number || github.ref }}-
    ${{ github.event_name != 'pull_request' && github.run_id || (github.event.action == 'labeled' && (github.event.label.name == 'ci:validate' || github.event.label.name == 'ci:full-e2e') && 'validation' || github.run_id) }}
  cancel-in-progress: true

jobs:
  validation-request:
    name: Validate explicit ecosystem request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-run: ${{ steps.pr-scope.outputs.result }}
    steps:
      - name: Classify minds specialist scope
        id: pr-scope
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            if (context.eventName !== 'pull_request') return 'true'
            if (context.payload.action === 'edited') {
              const previousBaseRef = context.payload.changes?.base?.ref?.from
              if (typeof previousBaseRef !== 'string') return 'false'
            } else if (
              context.payload.label?.name !== 'ci:validate' &&
              context.payload.label?.name !== 'ci:full-e2e'
            ) return 'false'
            const PullRequestFileInventoryState = Object.freeze({
              Available: 'available', Unavailable: 'unavailable',
            })
            let inventory = { state: PullRequestFileInventoryState.Unavailable }
            try {
              inventory = {
                files: await github.paginate(github.rest.pulls.listFiles, {
                  ...context.repo,
                  pull_number: context.issue.number,
                  per_page: 100,
                }),
                state: PullRequestFileInventoryState.Available,
              }
            } catch (error) {
              core.warning(`Failed to classify minds paths: ${error}`)
              return 'true'
            }
            if (inventory.state !== PullRequestFileInventoryState.Available) {
              return 'true'
            }
            const files = inventory.files
            const expectedChangedFiles = Number(
              context.payload.pull_request.changed_files,
            )
            if (
              !Number.isSafeInteger(expectedChangedFiles) ||
              expectedChangedFiles <= 0 ||
              files.length !== expectedChangedFiles ||
              files.length >= 3000
            ) {
              core.warning(
                `Pull-request file inventory is incomplete: expected ${expectedChangedFiles}, received ${files.length}`,
              )
              return 'true'
            }
            const PullRequestFileStatus = Object.freeze({
              Added: 'added', Removed: 'removed', Modified: 'modified',
              Renamed: 'renamed', Copied: 'copied', Changed: 'changed',
              Unchanged: 'unchanged',
            })
            const supportedStatuses = new Set(Object.values(PullRequestFileStatus))
            if (
              files.some(
                (file) =>
                  typeof file.filename !== 'string' ||
                  file.filename.length === 0 ||
                  !supportedStatuses.has(file.status) ||
                  (file.status === PullRequestFileStatus.Renamed &&
                    !file.previous_filename),
              )
            ) {
              core.warning('Pull-request file inventory has an unsupported entry')
              return 'true'
            }
            const isCanonicalAiOnlyPath = (path) =>
              path.startsWith('.agents/skills/') ||
              path.startsWith('.claude/skills/') ||
              path.startsWith('.codex/') ||
              path.startsWith('.cortex/') ||
              path.startsWith('.cursor/') ||
              path.startsWith('.github/prompts/') ||
              path === '.github/workflows/agent-implement.yml' ||
              path === '.github/workflows/ci-agent-smoke.yml' ||
              path === '.github/workflows/repository-policy.yml' ||
              path === '.task/agentic-ai.yml' ||
              path === 'AGENTS.md' ||
              path === 'CODEX.md' ||
              path.startsWith('agentic-ai/')
            if (files.some((file) => file.status === PullRequestFileStatus.Renamed)) {
              return 'false'
            }
            const changedPaths = files.flatMap((file) =>
              file.status === PullRequestFileStatus.Renamed
                ? [file.previous_filename, file.filename]
                : [file.filename],
            )
            return String(
              changedPaths.some((path) => path.startsWith('agentic-ai/minds/')) &&
              changedPaths.every(isCanonicalAiOnlyPath),
            )

  ecosystem:
    name: Rust ecosystem
    needs: validation-request
    if: >-
      github.event_name != 'pull_request' ||
      needs.validation-request.outputs.should-run == 'true'
    uses: ./.github/workflows/rust-ecosystem-checks.yml
    secrets: inherit
    with:
      fuzz_seconds: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '900' || '20' }}
      isolated_cache_write: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

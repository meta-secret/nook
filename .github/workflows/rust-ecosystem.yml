# Non-product entry points for Rust ecosystem gates.
# Labeled product PRs run the same jobs inside pr.yml so every exact-head gate
# appears on one Actions run page. Ordinary PR pushes never start these checks.
# agentic-ai/minds-only PRs still use this workflow because pr.yml ignores
# agentic-ai/** and must not run the product preview pipeline for those changes.

name: Rust ecosystem checks

on:
  pull_request:
    types: [labeled]
    paths:
      - agentic-ai/minds/**
  push:
    branches: [main]
    paths:
      - .github/workflows/rust-ecosystem.yml
      - .github/workflows/rust-ecosystem-checks.yml
      - deny.toml
      - nook-app/nook-platform/.insta.yaml
      - nook-app/nook-platform/.cargo/**
      - nook-app/nook-platform/docker/rust/**
      - nook-app/nook-platform/docker/Taskfile.yml
      - nook-app/docker-bake.hcl
      - nook-app/Taskfile.yml
      - nook-app/nook-platform/fuzz/**
      - preflight/**
      - agentic-ai/minds/**
      - nook-app/**/*.rs
      - nook-app/**/Cargo.toml
      - nook-app/nook-platform/Cargo.lock
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    rust-ecosystem-${{ github.event_name }}-
    ${{ github.event.pull_request.number || github.ref }}-
    ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'shared' }}
  cancel-in-progress: true

jobs:
  validation-request:
    name: Validate explicit ecosystem request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject unsupported label events
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_LABEL: ${{ github.event.label.name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            exit 0
          fi
          case "$REQUESTED_LABEL" in
            ci:validate|ci:full-e2e) ;;
            *)
              echo "Unsupported Rust ecosystem validation label: $REQUESTED_LABEL" >&2
              exit 1
              ;;
          esac

  ecosystem:
    name: Rust ecosystem
    needs: validation-request
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e'
    uses: ./.github/workflows/rust-ecosystem-checks.yml
    secrets: inherit
    with:
      fuzz_seconds: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '900' || '20' }}
      isolated_cache_write: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

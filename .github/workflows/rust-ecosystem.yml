name: Rust ecosystem checks

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main]
    paths:
      - .github/workflows/rust-ecosystem.yml
      - deny.toml
      - nook-app/.insta.yaml
      - nook-app/.cargo/**
      - nook-app/docker/rust.Dockerfile
      - nook-app/docker/rust.docker-bake.hcl
      - nook-app/docker/Taskfile.yml
      - nook-app/docker-bake.hcl
      - nook-app/Taskfile.yml
      - fuzz/**
      - preflight/**
      - agentic-ai/minds/**
      - nook-app/**/*.rs
      - nook-app/**/Cargo.toml
      - nook-app/Cargo.lock
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    rust-ecosystem-${{ github.event_name }}-
    ${{ github.event.pull_request.number || github.ref }}-
    ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'shared' }}
  cancel-in-progress: true

jobs:
  validation-request:
    name: Validate explicit ecosystem request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject unsupported label events
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_LABEL: ${{ github.event.label.name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            exit 0
          fi
          case "$REQUESTED_LABEL" in
            ci:validate|ci:full-e2e) ;;
            *)
              echo "Unsupported Rust ecosystem validation label: $REQUESTED_LABEL" >&2
              exit 1
              ;;
          esac

  dependency-policy:
    needs: validation-request
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e'
    name: Dependency policy and RustSec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      - name: Bake rust-dependency-policy
        run: task docker:ecosystem:dependency-policy

  deterministic-tests:
    needs: validation-request
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e'
    name: Proptest, Insta, and Loom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          cache-write: "false"
          main-cache-only: "true"
          isolated-cache-write: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      - name: Bake rust-ecosystem-deterministic
        run: task docker:ecosystem:deterministic

  fuzz-smoke:
    needs: validation-request
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e'
    name: Cargo fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          # Main push seeds trusted nightly cache; PRs write isolated remote refs
          # with Main fallback. Schedule/dispatch stay read-only consumers.
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          main-cache-only: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'false' || 'true' }}
          isolated-cache-write: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      - name: Bake rust-fuzz-smoke
        env:
          FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '900' || '20' }}
        run: task docker:ecosystem:fuzz FUZZ_SECONDS="$FUZZ_SECONDS"

  kani:
    needs: validation-request
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e'
    name: Kani bounded proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: model-checking/kani-github-action@v1.1
        with:
          working-directory: nook-app
          args: --package nook-replication

  dylint:
    needs: validation-request
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'ci:validate' ||
      github.event.label.name == 'ci:full-e2e'
    name: Dylint repository lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nook-docker-setup
        with:
          registry-host: registry.dev.nokey.sh
          registry-username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}
          # Same write policy as fuzz-smoke: seed Main, isolate PR writes.
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          main-cache-only: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'false' || 'true' }}
          isolated-cache-write: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      - name: Bake rust-dylint
        run: task docker:ecosystem:dylint

name: Cancel obsolete PR validation

on:
  # This workflow never checks out or executes PR code. pull_request_target
  # preserves actions:write for safe cancellation of fork and Dependabot runs.
  pull_request_target:
    types: [edited, opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing open pull request to backfill
        required: true
        type: number
      head_sha:
        description: Expected pull request head SHA
        required: true
        type: string
      base_sha:
        description: Expected pull request base SHA
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  head-boundary:
    name: Record exact PR head boundary
    concurrency:
      group: pr-head-boundary-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the exact PR head boundary
        uses: actions/github-script@v9
        with:
          script: |
            const previousBaseRef = context.payload.changes?.base?.ref?.from;
            const baseRetargeted =
              context.payload.action === "edited" &&
              typeof previousBaseRef === "string";
            if (context.payload.action === "edited" && !baseRetargeted) {
              core.info("Ignoring PR edit without a base-ref change.");
              return;
            }
            const dispatchedPrNumber = Number(context.payload.inputs?.pr_number ?? 0);
            const eventPullRequest = context.payload.pull_request;
            const prNumber = eventPullRequest?.number ?? dispatchedPrNumber;
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed("A positive pull request number is required.");
              return;
            }
            const { data: livePullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            if (!eventPullRequest && (
              livePullRequest.head.sha !== context.payload.inputs.head_sha ||
              livePullRequest.base.sha !== context.payload.inputs.base_sha
            )) {
              core.info("Skipping obsolete head-boundary backfill.");
              return;
            }
            if (eventPullRequest && (
              livePullRequest.head.sha !== eventPullRequest.head.sha ||
              livePullRequest.base.ref !== eventPullRequest.base.ref
            )) {
              core.info("Skipping obsolete head-boundary event.");
              return;
            }
            const transitionAt = eventPullRequest
              ? eventPullRequest.updated_at
              : (await github.rest.actions.getWorkflowRun({
                  ...context.repo,
                  run_id: context.runId,
                })).data.created_at;
            const markerPrefix = "<!-- nook-head-transition:";
            const marker = `${markerPrefix}${livePullRequest.head.sha}:${livePullRequest.base.ref}:${transitionAt} -->`;
            const body = `${marker}\nExact-head delivery boundary (automated).`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                ...context.repo,
                issue_number: prNumber,
                per_page: 100,
              }
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.trimStart().startsWith(markerPrefix)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }

  obsolete-heads:
    name: Cancel obsolete validation heads
    if: github.event.action == 'synchronize' || github.event.action == 'edited'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (vars.NOOK_RUNS_ON || 'nook-k0s') || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: Cancel active validation for replaced heads
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const eventHeadSha = context.payload.pull_request.head.sha;
            const eventBaseRef = context.payload.pull_request.base.ref;
            const previousBaseRef = context.payload.changes?.base?.ref?.from;
            const baseRetargeted =
              context.payload.action === "edited" &&
              typeof previousBaseRef === "string";
            if (context.payload.action === "edited" && !baseRetargeted) {
              core.info("Ignoring PR edit without a base-ref change.");
              return;
            }
            const validationWorkflows = [
              { file: "pr.yml", name: "PR" },
              { file: "rust-ecosystem.yml", name: "Rust ecosystem checks" },
              { file: "web-research.yml", name: "Web research" },
            ];
            const activeStatuses = new Set([
              "queued", "in_progress", "requested", "waiting", "pending",
            ]);
            const inspectionDeadline = Date.now() + 45_000;
            const inspectedRunIds = new Set();
            let obsoleteRunCount = 0;
            let liveHeadSha = context.payload.pull_request.head.sha;
            do {
              const { data: currentPr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: prNumber,
              });
              liveHeadSha = currentPr.head.sha;
              let runs;
              try {
                runs = (await Promise.all(
                  validationWorkflows.map((workflow) =>
                    github.rest.actions.listWorkflowRuns({
                      ...context.repo,
                      workflow_id: workflow.file,
                      branch: currentPr.head.ref,
                      event: "pull_request",
                      per_page: 100,
                    })
                  )
                )).flatMap((response) => response.data.workflow_runs)
                  .filter((run) => activeStatuses.has(run.status));
              } catch (error) {
                core.warning(
                  `Could not enumerate active validation runs; retrying within the registration window: ${String(error)}`
                );
                if (Date.now() < inspectionDeadline) {
                  await new Promise((resolve) => setTimeout(resolve, 5_000));
                  continue;
                }
                break;
              }
              const obsoleteRuns = runs.filter((run) => {
                const associatedPullRequest = run.pull_requests.find(
                  (pullRequest) => pullRequest.number === prNumber
                );
                const predatesBaseRetarget =
                  baseRetargeted &&
                  run.name !== "Web research" &&
                  associatedPullRequest?.base?.sha !== currentPr.base.sha;
                return (
                  !inspectedRunIds.has(run.id) &&
                  (run.head_sha !== currentPr.head.sha || predatesBaseRetarget) &&
                  validationWorkflows.some((workflow) => workflow.name === run.name) &&
                  associatedPullRequest
                );
              });
              for (const run of obsoleteRuns) {
                obsoleteRunCount += 1;
                let latestPr;
                try {
                  ({ data: latestPr } = await github.rest.pulls.get({
                    ...context.repo,
                    pull_number: prNumber,
                  }));
                } catch (error) {
                  core.warning(
                    `Could not recheck PR state before cancelling ${run.name} run ${run.id}; retrying within the registration window: ${String(error)}`
                  );
                  continue;
                }
                liveHeadSha = latestPr.head.sha;
                const associatedPullRequest = run.pull_requests.find(
                  (pullRequest) => pullRequest.number === prNumber
                );
                const staleForBaseRetarget =
                  baseRetargeted &&
                  run.name !== "Web research" &&
                  latestPr.head.sha === eventHeadSha &&
                  latestPr.base.ref === eventBaseRef &&
                  associatedPullRequest?.base?.sha !== latestPr.base.sha;
                if (
                  run.head_sha === latestPr.head.sha &&
                  !staleForBaseRetarget
                ) {
                  inspectedRunIds.add(run.id);
                  core.info(`Keeping current-head ${run.name} run ${run.id}.`);
                  continue;
                }
                core.info(
                  `Cancelling obsolete ${run.name} run ${run.id} at ${run.head_sha}` +
                    (staleForBaseRetarget
                      ? ` after base retarget ${previousBaseRef} -> ${eventBaseRef}`
                      : "")
                );
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  inspectedRunIds.add(run.id);
                } catch (error) {
                  let latestRun;
                  try {
                    ({ data: latestRun } =
                      await github.rest.actions.getWorkflowRun({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        run_id: run.id,
                      }));
                  } catch (lookupError) {
                    core.warning(
                      `Could not cancel or recheck obsolete ${run.name} run ${run.id}: ${String(lookupError)}`
                    );
                    continue;
                  }
                  if (latestRun.status === "completed") {
                    inspectedRunIds.add(run.id);
                    core.info(
                      `${run.name} run ${run.id} completed before cancellation.`
                    );
                  } else {
                    core.warning(
                      `Could not cancel obsolete ${run.name} run ${run.id}: ${String(error)}`
                    );
                  }
                }
              }
              if (Date.now() < inspectionDeadline) {
                await new Promise((resolve) => setTimeout(resolve, 5_000));
              }
            } while (Date.now() < inspectionDeadline);
            core.info(
              `Inspected ${obsoleteRunCount} obsolete validation run(s) for PR #${prNumber}; live head is ${liveHeadSha}.`
            );

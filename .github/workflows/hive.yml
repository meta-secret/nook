name: Hive
run-name: >-
  Hive verification · ${{ github.event_name == 'pull_request'
  && format('PR #{0}', github.event.pull_request.number)
  || format('Main {0}', github.sha) }}

on:
  pull_request:
    paths:
      - .github/workflows/hive.yml
      - .github/actions/nook-cache-connect/**
      - .github/actions/nook-docker-setup/**
      - .github/scripts/rust-deps-cache-fingerprint.sh
      - .github/scripts/hive-manifest-contract.rb
      - agentic-ai/minds/hive/controller/reaper.ts
      - agentic-ai/minds/hive/controller/reaper.test.ts
      - .github/scripts/k0s-firewall-rollback-test.ts
      - .github/scripts/k0s-cni-migration-test.ts
      - .github/scripts/services-network-repair-test.ts
      - .github/scripts/zot-registry-public-contract-test.ts
      - .github/scripts/wait-hive-neo4j.sh
      - .task/agentic-ai.yml
      - .task/ci-workflows.yml
      - .github/scripts/infra-surface-check.sh
      - Taskfile.yml
      - agentic-ai/minds/**
      - infra/compose.yaml
      - infra/k0s/**
      - infra/tasks/**
      - infra/Taskfile.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/hive.yml
      - .github/actions/nook-cache-connect/**
      - .github/actions/nook-docker-setup/**
      - .github/scripts/rust-deps-cache-fingerprint.sh
      - .github/scripts/hive-manifest-contract.rb
      - agentic-ai/minds/hive/controller/reaper.ts
      - agentic-ai/minds/hive/controller/reaper.test.ts
      - .github/scripts/k0s-firewall-rollback-test.ts
      - .github/scripts/k0s-cni-migration-test.ts
      - .github/scripts/services-network-repair-test.ts
      - .github/scripts/zot-registry-public-contract-test.ts
      - .github/scripts/wait-hive-neo4j.sh
      - .task/agentic-ai.yml
      - .task/ci-workflows.yml
      - .github/scripts/infra-surface-check.sh
      - Taskfile.yml
      - agentic-ai/minds/**
      - infra/compose.yaml
      - infra/k0s/**
      - infra/tasks/**
      - infra/Taskfile.yml

permissions:
  contents: read

env:
  # Pull requests restore the trusted Main lineage read-only. Only Main
  # publishes the shared dependency graph, so parallel PRs cannot evict it.
  HIVE_CACHE_FROM: type=registry,ref=registry.dev.nokey.sh/nook/buildcache/nook-hive-linux-amd64-v1:buildcache

concurrency:
  group: hive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    name: Hive Control Center verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate Taskfile command surface
        run: task infra:surface:check

      - name: Install Hive Control Center dependencies
        run: task hive:console:install

      - name: Verify Hive Control Center source
        run: task hive:console:check

      - name: Install Hive Control Center browser
        run: task hive:console:e2e:prepare

      - name: Verify Hive Control Center journeys
        run: task hive:console:e2e

  verify:
    name: Hive Rust and infrastructure verification
    if: >-
      vars.NOOK_HIVE_RUNS_ON == 'nook-k0s-hive' &&
      (github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: nook-k0s-hive
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0

      - name: Connect private ARC BuildKit
        uses: ./.github/actions/nook-docker-setup
        with:
          cache-write: ${{ github.event_name == 'push' && 'true' || 'false' }}
          main-cache-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          isolated-cache-write: "false"
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}

      - name: Report Rust compiler cache selection
        run: >-
          echo "Hive compiler cache:
          ${NOOK_SCCACHE_BACKEND}
          (${NOOK_SCCACHE_BACKEND_REASON})"

      - name: Wait for private Neo4j sidecar
        run: .github/scripts/wait-hive-neo4j.sh

      - name: Hive Rust verification
        env:
          HIVE_NEO4J_TEST_URI: 127.0.0.1:7687
          HIVE_NEO4J_TEST_USERNAME: neo4j
          HIVE_NEO4J_TEST_PASSWORD: hive-integration-password
        run: task hive:verify

      - name: Publish verified Hive cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HIVE_CACHE_TO: type=registry,ref=registry.dev.nokey.sh/nook/buildcache/nook-hive-linux-amd64-v1:buildcache,mode=max,timeout=15m
        run: task hive:cache:publish

  verify-hosted:
    name: Hive Rust and infrastructure verification
    if: >-
      vars.NOOK_HIVE_RUNS_ON != 'nook-k0s-hive' &&
      (github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.06.0-community@sha256:ba2b859bdbe7017a9baa1a7b5681ac9732198753719b0a502e3645feddfdec72
        env:
          NEO4J_AUTH: neo4j/hive-integration-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p hive-integration-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Connect hosted BuildKit cache
        uses: ./.github/actions/nook-docker-setup
        with:
          cache-write: ${{ github.event_name == 'push' && 'true' || 'false' }}
          main-cache-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          isolated-cache-write: "false"
          registry-username: ${{ secrets.NOOK_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.NOOK_REGISTRY_PASSWORD }}
          sccache-access-key: ${{ secrets.NOOK_SCCACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.NOOK_SCCACHE_SECRET_KEY }}
          sccache-endpoint: ${{ secrets.NOOK_SCCACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.NOOK_SCCACHE_BUCKET }}

      - name: Validate Taskfile command surface
        run: task infra:surface:check

      - name: Hive Rust verification
        env:
          HIVE_NEO4J_TEST_URI: 127.0.0.1:7687
          HIVE_NEO4J_TEST_USERNAME: neo4j
          HIVE_NEO4J_TEST_PASSWORD: hive-integration-password
        run: task hive:verify

      - name: Publish verified Hive cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HIVE_CACHE_TO: type=registry,ref=registry.dev.nokey.sh/nook/buildcache/nook-hive-linux-amd64-v1:buildcache,mode=max,timeout=15m
        run: task hive:cache:publish

  verify-fork:
    name: Hive Rust and infrastructure verification
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.06.0-community@sha256:ba2b859bdbe7017a9baa1a7b5681ac9732198753719b0a502e3645feddfdec72
        env:
          NEO4J_AUTH: neo4j/hive-integration-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p hive-integration-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.52.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up untrusted cache-free BuildKit
        uses: docker/setup-buildx-action@v4

      - name: Validate Taskfile command surface
        run: task infra:surface:check

      - name: Hive Rust verification
        env:
          HIVE_CACHE_FROM: ""
          HIVE_NEO4J_TEST_URI: 127.0.0.1:7687
          HIVE_NEO4J_TEST_USERNAME: neo4j
          HIVE_NEO4J_TEST_PASSWORD: hive-integration-password
        run: task hive:verify

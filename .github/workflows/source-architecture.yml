name: Source architecture

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: source-architecture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce:
    name: Enforce source architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore preflight Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-preflight
          workspaces: preflight -> target

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Enforce source limits and Rust unit-test colocation
        run: task preflight:source-architecture

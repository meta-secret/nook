name: Promote local Rust dependency cache

on:
  workflow_dispatch:
    inputs:
      fingerprint:
        description: Content fingerprint produced by rust-deps-cache-fingerprint.sh
        required: true
        type: string
      candidate:
        description: Unique quarantined local formatter candidate
        required: true
        type: string
      source_sha:
        description: Committed source whose cook inputs must match the fingerprint
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rust-deps-cache-promote-${{ inputs.fingerprint }}
  cancel-in-progress: false

jobs:
  promote:
    name: Validate every blob and atomically promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate-source
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.2
      - uses: docker/login-action@v3
        with:
          registry: registry.dev.nokey.sh
          username: ${{ secrets.NOOK_REGISTRY_REMOTE_USERNAME }}
          password: ${{ secrets.NOOK_REGISTRY_REMOTE_PASSWORD }}
      - name: Validate and promote candidate
        env:
          NOOK_REGISTRY_CACHE_HOST: registry.dev.nokey.sh
          PROMOTION_FINGERPRINT: ${{ inputs.fingerprint }}
          PROMOTION_CANDIDATE: ${{ inputs.candidate }}
          PROMOTION_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate-source rev-parse HEAD)" = "$PROMOTION_SOURCE_SHA"
          committed_fingerprint="$(
            NOOK_RUST_DEPS_FINGERPRINT_ROOT="$GITHUB_WORKSPACE/candidate-source" \
              bash .github/scripts/rust-deps-cache-fingerprint.sh
          )"
          test "$committed_fingerprint" = "$PROMOTION_FINGERPRINT"
          bash .github/scripts/rust-deps-cache-promote.sh "$PROMOTION_FINGERPRINT" "$PROMOTION_CANDIDATE"

name: Collect Nook cache telemetry
description: Record the selected sccache backend plus sccache and BuildKit cache hit rates.

inputs:
  artifact-suffix:
    description: Optional unique suffix for matrix-job telemetry artifacts.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Collect cache telemetry
      continue-on-error: true
      shell: bash
      env:
        NOOK_CACHE_TELEMETRY_SUFFIX: ${{ inputs.artifact-suffix }}
      run: |
        set -euo pipefail
        node_bin="$(command -v node || true)"
        if [ -z "$node_bin" ] && [ -x /home/runner/externals/node24/bin/node ]; then
          node_bin=/home/runner/externals/node24/bin/node
        fi
        if [ -z "$node_bin" ]; then
          echo "Actions Node.js runtime is unavailable; skipping cache telemetry."
          exit 0
        fi
        baseline="${NOOK_CACHE_TELEMETRY_BASELINE:-$RUNNER_TEMP/nook-cache-telemetry-baseline.json}"
        if [ ! -f "$baseline" ]; then
          timeout 15s "$node_bin" .github/scripts/cache-telemetry.cjs start --output "$baseline"
        fi
        suffix="${NOOK_CACHE_TELEMETRY_SUFFIX:+-$NOOK_CACHE_TELEMETRY_SUFFIX}"
        output="$RUNNER_TEMP/nook-cache-telemetry/$GITHUB_JOB$suffix.json"
        timeout 30s "$node_bin" .github/scripts/cache-telemetry.cjs collect \
          --baseline "$baseline" \
          --output "$output"

    - name: Upload cache telemetry
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: cache-telemetry-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}${{ inputs.artifact-suffix && format('-{0}', inputs.artifact-suffix) || '' }}
        path: ${{ runner.temp }}/nook-cache-telemetry/${{ github.job }}${{ inputs.artifact-suffix && format('-{0}', inputs.artifact-suffix) || '' }}.json
        retention-days: 30
        if-no-files-found: error
        overwrite: true

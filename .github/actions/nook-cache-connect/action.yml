name: Connect Nook Rust cache
description: Materialize SeaweedFS S3 sccache credentials as runner-local files.

inputs:
  sccache-access-key:
    description: SeaweedFS S3 access key for the persistent remote Rust compiler cache.
    required: false
    default: ""
  sccache-secret-key:
    description: SeaweedFS S3 secret key for the persistent remote Rust compiler cache.
    required: false
    default: ""
  sccache-endpoint:
    description: Public HTTPS hostname for the SeaweedFS S3 endpoint (no scheme).
    required: false
    default: "sccache.dev.nokey.sh"
  sccache-bucket:
    description: S3 bucket name used by sccache.
    required: false
    default: "nook-sccache"
  sccache-capability-probe:
    description: Verify the selected S3 compiler-cache capability before compilation (none, write_capable, or read_only).
    required: false
    default: "none"
  sccache-credential-class:
    description: Sanitized identity classification for cache telemetry.
    required: false
    default: "unspecified"
runs:
  using: node24
  main: main.js

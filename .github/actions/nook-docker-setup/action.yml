name: Nook Docker setup
description: Task, Buildx, and authenticated registry BuildKit cache setup.

inputs:
  cache-selection:
    description: >-
      Closed cache probe set: general selects every shared Bake lineage independently; native,
      wasm, preflight, and web-e2e probe only the named consumer graph;
      ecosystem-dylint, ecosystem-fuzz, ecosystem-policy-tools,
      ecosystem-deterministic, and ecosystem-kani probe only their named lane;
      ecosystem-smoke probes deterministic, fuzz, and Kani together;
      wasm-proof computes its dependency fingerprint without probing;
      compile probes its exact head and immutable first-parent candidates in
      one bounded batch; all non-compile immutable lineage candidates are
      probed concurrently within the same bounded discovery window;
      web-research-deps probes only the research Bun dependency lineage;
      web-research-image probes the exact research browser graph;
      connection-only performs no registry cache probes.
    required: false
    default: general
  cache-write:
    description: Allow this workflow source to update the shared hosted BuildKit cache refs.
    required: false
    default: "true"
  main-cache-only:
    description: Restore only the trusted default-branch cache and disable cache writes.
    required: false
    default: "false"
  isolated-cache-write:
    description: >-
      Allow hosted runners to publish only an immutable remote-buildcache ref keyed by
      commit (-git-<sha>) while restoring the nearest bounded first-parent candidate
      or Main. Concurrent heads never replace one another, including on ARC. The
      authorized remote build:compile publication handoff writes only its
      exact-commit source ref; dependency inputs retain a separate fingerprinted
      boundary. A read-only build:compile verification never exports a registry cache.
      Other jobs never write Main's protected refs.
    required: false
    default: "false"
  publish-compile-cache:
    description: >-
      Build-only compile cache contract: true publishes the exact-head source cache;
      false imports caches without exporting them. This input is valid only for
      the remote build:compile task.
    required: false
    default: "true"
  require-e2e-cache:
    description: Require the browser-image cache lineage for this job.
    required: false
    default: "false"
  monitor-buildkit-storage:
    description: Warn when the selected ARC BuildKit shard approaches its GC ceiling.
    required: false
    default: "false"
  registry-host:
    description: OCI registry hostname for BuildKit cache and image login.
    required: false
    default: registry.dev.nokey.sh
  registry-username:
    description: OCI registry username.
    required: false
    default: ""
  registry-password:
    description: OCI registry password or token.
    required: false
    default: ""
  sccache-access-key:
    description: SeaweedFS S3 access key for Rust compiler objects.
    required: false
    default: ""
  sccache-secret-key:
    description: SeaweedFS S3 secret key for Rust compiler objects.
    required: false
    default: ""
  sccache-endpoint:
    description: Public HTTPS hostname for the SeaweedFS S3 endpoint.
    required: false
    default: "sccache.dev.nokey.sh"
  sccache-bucket:
    description: SeaweedFS S3 bucket used by this trust domain.
    required: false
    default: "nook-sccache"

runs:
  using: composite
  steps:
    - name: Setup Task
      uses: go-task/setup-task@v2
      with:
        version: 3.52.0

    - name: Raise Linux filesystem watcher limits
      shell: bash
      run: |
        ensure_minimum() {
          local key="$1"
          local minimum="$2"
          local current
          current="$(sysctl -n "$key")"
          if (( current < minimum )); then
            if sudo -n true 2>/dev/null; then
              sudo sysctl -w "$key=$minimum"
            else
              echo "::warning::$key = $current (< $minimum); runner cannot raise it without interactive sudo"
            fi
          else
            echo "$key = $current (already >= $minimum)"
          fi
        }
        ensure_minimum fs.inotify.max_user_instances 2500
        ensure_minimum fs.inotify.max_user_watches 10485760

    - name: Login to Nook OCI registry
      if: ${{ inputs.registry-username != '' && inputs.registry-password != '' }}
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry-host }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Preload hosted BuildKit from Zot
      if: ${{ !startsWith(runner.name, 'nook-k0s-') && inputs.registry-username != '' && inputs.registry-password != '' }}
      shell: bash
      run: docker pull "${{ inputs.registry-host }}/moby/buildkit:buildx-stable-1"

    # GitHub-hosted VMs use their job-scoped BuildKit container. ARC runners
    # use the persistent rootless BuildKit shard on their Kubernetes node.
    # The runner carries only client tooling and never receives a Docker daemon
    # or host runtime socket.
    # Taskfiles never pass --builder; the health wrapper selects it.
    - name: Setup authenticated hosted Buildx
      id: hosted-buildx
      if: ${{ !startsWith(runner.name, 'nook-k0s-') && inputs.registry-username != '' && inputs.registry-password != '' }}
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: image=${{ inputs.registry-host }}/moby/buildkit:buildx-stable-1

    - name: Setup secret-free hosted Buildx
      id: hosted-buildx-direct
      if: ${{ !startsWith(runner.name, 'nook-k0s-') && (inputs.registry-username == '' || inputs.registry-password == '') }}
      uses: docker/setup-buildx-action@v4

    - name: Connect ARC Buildx to the node-local BuildKit shard
      id: arc-buildx
      if: ${{ startsWith(runner.name, 'nook-k0s-') }}
      shell: bash
      run: |
        set -euo pipefail
        case "${NOOK_BUILDKIT_ADDR:-}" in
          tcp://nook-buildkit.arc-runners.svc.cluster.local:1234) ;;
          *)
            echo "ARC BuildKit must use the node-local Kubernetes service" >&2
            exit 2
            ;;
        esac
        builder="nook-arc-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
        builder="$(printf '%s' "$builder" | tr -c 'a-zA-Z0-9_.-' '-')"
        docker buildx create \
          --name "$builder" \
          --driver remote \
          --use \
          "$NOOK_BUILDKIT_ADDR"
        docker buildx inspect "$builder" --bootstrap
        echo "name=$builder" >> "$GITHUB_OUTPUT"
        echo "NOOK_BUILDKIT_REMOTE=1" >> "$GITHUB_ENV"

    - name: Connect SeaweedFS compiler cache
      uses: ./.github/actions/nook-cache-connect
      with:
        sccache-access-key: ${{ inputs.sccache-access-key }}
        sccache-secret-key: ${{ inputs.sccache-secret-key }}
        sccache-endpoint: ${{ inputs.sccache-endpoint }}
        sccache-bucket: ${{ inputs.sccache-bucket }}

    - name: Select hosted BuildKit cache
      shell: bash
      env:
        NOOK_CACHE_EVENT_NAME: ${{ github.event_name }}
        NOOK_CACHE_GIT_REF: ${{ github.ref }}
        NOOK_CACHE_PR_NUMBER: ${{ github.event.pull_request.number }}
        NOOK_CACHE_ACTION_PATH: ${{ github.action_path }}
        NOOK_CACHE_SELECTION: ${{ inputs.cache-selection }}
        NOOK_CACHE_REGISTRY_HOST: ${{ inputs.registry-host }}
        NOOK_CACHE_WRITE_REQUESTED: ${{ inputs.cache-write }}
        NOOK_CACHE_MAIN_ONLY: ${{ inputs.main-cache-only }}
        NOOK_CACHE_ISOLATED_WRITE: ${{ inputs.isolated-cache-write }}
        NOOK_CACHE_PUBLISH_COMPILE: ${{ inputs.publish-compile-cache }}
        NOOK_REMOTE_TASK_SELECTION: ${{ github.event.inputs.tasks || github.event.inputs.task }}
        NOOK_SELECTED_BUILDER: ${{ steps.arc-buildx.outputs.name || steps.hosted-buildx.outputs.name || steps.hosted-buildx-direct.outputs.name }}
        NOOK_REGISTRY_USERNAME: ${{ inputs.registry-username }}
        NOOK_REGISTRY_PASSWORD: ${{ inputs.registry-password }}
      run: bash "${{ github.action_path }}/../../scripts/select-hosted-buildkit-cache.sh"
    - name: Set CI environment
      shell: bash
      run: |
        echo "NOOK_ENV=ci" >> "$GITHUB_ENV"

    - name: Check ARC BuildKit storage pressure
      if: ${{ inputs.monitor-buildkit-storage == 'true' && startsWith(runner.name, 'nook-k0s-') }}
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        usage="$(mktemp)"
        trap 'rm -f "$usage"' EXIT
        if ! timeout 8s docker buildx du >"$usage"; then
          echo "::warning::BuildKit storage usage check did not finish within 8 seconds"
          exit 0
        fi
        total="$(sed -n 's/^Total:[[:space:]]*//p' "$usage" | tail -1)"
        case "$total" in
          *GB) whole="${total%GB}"; whole="${whole%%.*}" ;;
          *GiB) whole="${total%GiB}"; whole="${whole%%.*}" ;;
          *) echo "::warning::BuildKit storage total was not parseable: ${total:-missing}"; exit 0 ;;
        esac
        if [ "$whole" -ge 100 ]; then
          echo "::warning title=BuildKit cache near GC ceiling::Shard usage is $total; investigate GC before the 112 GB max-use target is crossed"
        else
          echo "BuildKit shard usage: $total (below the 100 GB warning threshold)"
        fi

    - name: Start cache telemetry
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        node_bin="$(command -v node || true)"
        if [ -z "$node_bin" ] && [ -x /home/runner/externals/node24/bin/node ]; then
          node_bin=/home/runner/externals/node24/bin/node
        fi
        if [ -z "$node_bin" ]; then
          echo "Actions Node.js runtime is unavailable; skipping cache telemetry on this runner."
          exit 0
        fi
        baseline="$RUNNER_TEMP/nook-cache-telemetry-baseline.json"
        timeout 15s "$node_bin" "${{ github.action_path }}/../../workflows/lib/cache-telemetry.mjs" start --output "$baseline"
        echo "NOOK_CACHE_TELEMETRY_BASELINE=$baseline" >> "$GITHUB_ENV"

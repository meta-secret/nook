name: Nook Docker setup
description: Task, Buildx, and authenticated registry BuildKit cache setup.

inputs:
  cache-write:
    description: Allow this workflow source to update the shared hosted BuildKit cache refs.
    required: false
    default: "true"
  main-cache-only:
    description: Restore only the trusted default-branch cache and disable cache writes.
    required: false
    default: "false"
  isolated-cache-write:
    description: >-
      Publish only an isolated remote-buildcache ref keyed by git commit SHA
      (-git-<sha>) while using Main when that exact ref is absent. Never writes Main's
      nook/buildcache refs.
    required: false
    default: "false"
  require-e2e-cache:
    description: Require the browser-image cache lineage for this job.
    required: false
    default: "false"
  registry-host:
    description: OCI registry hostname for BuildKit cache and image login.
    required: false
    default: registry.dev.nokey.sh
  registry-username:
    description: OCI registry username.
    required: true
  registry-password:
    description: OCI registry password or token.
    required: true
  sccache-access-key:
    description: SeaweedFS S3 access key for Rust compiler objects.
    required: false
    default: ""
  sccache-secret-key:
    description: SeaweedFS S3 secret key for Rust compiler objects.
    required: false
    default: ""
  sccache-endpoint:
    description: Public HTTPS hostname for the SeaweedFS S3 endpoint.
    required: false
    default: "sccache.dev.nokey.sh"
  sccache-bucket:
    description: SeaweedFS S3 bucket used by this trust domain.
    required: false
    default: "nook-sccache"

runs:
  using: composite
  steps:
    - name: Setup Task
      uses: go-task/setup-task@v2
      with:
        version: 3.52.0

    - name: Raise Linux filesystem watcher limits
      shell: bash
      run: |
        ensure_minimum() {
          local key="$1"
          local minimum="$2"
          local current
          current="$(sysctl -n "$key")"
          if (( current < minimum )); then
            if sudo -n true 2>/dev/null; then
              sudo sysctl -w "$key=$minimum"
            else
              echo "::warning::$key = $current (< $minimum); runner cannot raise it without interactive sudo"
            fi
          else
            echo "$key = $current (already >= $minimum)"
          fi
        }
        ensure_minimum fs.inotify.max_user_instances 2500
        ensure_minimum fs.inotify.max_user_watches 10485760

    # GitHub-hosted VMs use their job-scoped BuildKit container. Each ARC
    # microVM has its own native BuildKit sidecar on Pod loopback. The runner
    # carries only Docker client tooling and never receives a daemon socket.
    # Taskfiles never pass --builder; the health wrapper selects it.
    - name: Setup hosted Buildx
      id: hosted-buildx
      if: ${{ !startsWith(runner.name, 'nook-k0s-') }}
      uses: docker/setup-buildx-action@v4

    - name: Connect ARC Buildx to the private BuildKit sidecar
      id: arc-buildx
      if: ${{ startsWith(runner.name, 'nook-k0s-') }}
      shell: bash
      run: |
        set -euo pipefail
        case "${NOOK_BUILDKIT_ADDR:-}" in
          tcp://127.0.0.1:1234) ;;
          *)
            echo "ARC BuildKit must use the private Pod loopback endpoint" >&2
            exit 2
            ;;
        esac
        builder="nook-arc-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
        builder="$(printf '%s' "$builder" | tr -c 'a-zA-Z0-9_.-' '-')"
        docker buildx create \
          --name "$builder" \
          --driver remote \
          --use \
          "$NOOK_BUILDKIT_ADDR"
        docker buildx inspect "$builder" --bootstrap
        echo "name=$builder" >> "$GITHUB_OUTPUT"

    - name: Login to Nook OCI registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry-host }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Connect SeaweedFS compiler cache
      uses: ./.github/actions/nook-cache-connect
      with:
        sccache-access-key: ${{ inputs.sccache-access-key }}
        sccache-secret-key: ${{ inputs.sccache-secret-key }}
        sccache-endpoint: ${{ inputs.sccache-endpoint }}
        sccache-bucket: ${{ inputs.sccache-bucket }}

    - name: Select hosted BuildKit cache
      shell: bash
      env:
        NOOK_REMOTE_TASK_SELECTION: ${{ github.event.inputs.tasks || github.event.inputs.task }}
        NOOK_SELECTED_BUILDER: ${{ steps.arc-buildx.outputs.name || steps.hosted-buildx.outputs.name }}
      run: |
        set -euo pipefail

        pr_number="${{ github.event.pull_request.number }}"
        event_name="${{ github.event_name }}"
        git_ref="${{ github.ref }}"
        test -n "$NOOK_SELECTED_BUILDER"
        echo "NOOK_PR_BUILDX_BUILDER=$NOOK_SELECTED_BUILDER" >> "$GITHUB_ENV"
        echo "GHA_CACHE_ENABLED=1" >> "$GITHUB_ENV"
        echo "NOOK_REGISTRY_CACHE_HOST=${{ inputs.registry-host }}" >> "$GITHUB_ENV"

        read_only=""
        if [ "$event_name" != "push" ] || [ "$git_ref" != "refs/heads/main" ]; then
          read_only=1
          if [[ "$pr_number" =~ ^[0-9]+$ ]] && [ "${{ inputs.cache-write }}" != "false" ]; then
            echo "::warning::Pull-request jobs are forced to restore Main's cache read-only"
          fi
        fi
        isolated_cache_write="${{ inputs.isolated-cache-write }}"
        if [ "$isolated_cache_write" = "true" ]; then
          if [ "${{ inputs.main-cache-only }}" != "true" ] \
            || [ "${{ inputs.cache-write }}" != "false" ]; then
            echo "isolated-cache-write requires main-cache-only=true and cache-write=false" >&2
            exit 1
          fi
          case "$event_name" in
            workflow_dispatch)
              case "$git_ref" in
                refs/heads/*) ;;
                *)
                  echo "isolated-cache-write requires a repository branch ref" >&2
                  exit 1
                  ;;
              esac
              ;;
            pull_request)
              if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
                echo "isolated-cache-write on pull_request requires a PR number" >&2
                exit 1
              fi
              ;;
            *)
              echo "isolated-cache-write requires workflow_dispatch or pull_request" >&2
              exit 1
              ;;
          esac
        elif [ "${{ inputs.main-cache-only }}" = "true" ]; then
          if [ "${{ inputs.cache-write }}" != "false" ]; then
            echo "main-cache-only requires cache-write=false" >&2
            exit 1
          fi
          read_only=1
        fi

        scope_suffix=""
        fallback_enabled=""
        hive_remote_ref=""
        if [ "$isolated_cache_write" = "true" ]; then
          fallback_enabled=1
          if [ "$event_name" = "pull_request" ]; then
            # Key by PR head SHA (not the merge GITHUB_SHA) so local HEAD publish matches.
            scope_sha="${{ github.event.pull_request.head.sha }}"
          else
            if [ -z "$NOOK_REMOTE_TASK_SELECTION" ]; then
              echo "isolated-cache-write requires a dispatched task selection" >&2
              exit 1
            fi
            scope_sha="$(git rev-parse HEAD)"
          fi
          if [[ ! "$scope_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "isolated-cache-write requires a 40-char lowercase git SHA (got: ${scope_sha:-empty})" >&2
            exit 1
          fi
          scope_suffix="-git-$scope_sha"
          hive_remote_ref="type=registry,ref=${{ inputs.registry-host }}/nook/remote-buildcache/nook-hive-linux-amd64-v1$scope_suffix:buildcache"
          echo "Isolated cache writes use $scope_suffix with trusted Main fallback"
        fi
        echo "GHA_CACHE_SCOPE_SUFFIX=$scope_suffix" >> "$GITHUB_ENV"
        echo "GHA_CACHE_FALLBACK_ENABLED=$fallback_enabled" >> "$GITHUB_ENV"
        echo "GHA_CACHE_SEED_SCOPE_SUFFIX=" >> "$GITHUB_ENV"
        # Use the same worktree-content fingerprint as local sealed formatting.
        # Bake cache wiring and source files do not rotate this dependency scope.
        rust_deps_fingerprint="$(bash .github/scripts/rust-deps-cache-fingerprint.sh)"
        if [[ ! "$rust_deps_fingerprint" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Could not fingerprint the hosted Rust dependency graph" >&2
          exit 1
        fi
        echo "NOOK_RUST_DEPS_INPUT_FINGERPRINT=$rust_deps_fingerprint" >> "$GITHUB_ENV"
        echo "GHA_RUST_WASM_DEPS_SCOPE=nook-rust-wasm-deps-v5-$rust_deps_fingerprint" >> "$GITHUB_ENV"

        # cache-from entries are merged, not ordered. Importing exact and Main
        # together can select Main's parent and orphan an exact source leaf.
        # Probe each full-graph ref and use Main only while that exact ref is absent.
        registry_host="${{ inputs.registry-host }}"
        exact_repository="nook/buildcache"
        if [ -n "$scope_suffix" ]; then
          exact_repository="nook/remote-buildcache"
        fi
        cache_ref_status() {
          local ref="$1"
          local probe_output
          probe_output="$(mktemp)"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>"$probe_output"; then
            rm -f "$probe_output"
            return 0
          fi
          if grep -Eqi 'not found|manifest unknown|name unknown' "$probe_output"; then
            rm -f "$probe_output"
            return 1
          fi
          echo "Registry cache probe was inconclusive: $ref" >&2
          cat "$probe_output" >&2
          rm -f "$probe_output"
          return 2
        }
        publish_exact_availability() {
          local env_name="$1"
          local scope="$2"
          local ref="$registry_host/$exact_repository/$scope:buildcache"
          local available=""
          local probe_status=0
          cache_ref_status "$ref" || probe_status=$?
          case "$probe_status" in
            0)
              available=1
              echo "Exact cache available: $scope"
              ;;
            1)
              echo "Exact cache absent; Main/fingerprint fallback enabled: $scope"
              ;;
            *) return "$probe_status" ;;
          esac
          echo "$env_name=$available" >> "$GITHUB_ENV"
        }
        publish_main_availability() {
          local env_name="$1"
          local scope="$2"
          local ref="$registry_host/nook/buildcache/$scope:buildcache"
          local available=""
          local probe_status=0
          cache_ref_status "$ref" || probe_status=$?
          case "$probe_status" in
            0)
              available=1
              echo "Main cache available: $scope"
              ;;
            1)
              echo "Main cache absent; source-free dependency fallback enabled: $scope"
              ;;
            *) return "$probe_status" ;;
          esac
          echo "$env_name=$available" >> "$GITHUB_ENV"
        }

        wasm_deps_exact_scope="nook-rust-wasm-deps-v5-$rust_deps_fingerprint"
        if [ -n "$scope_suffix" ]; then
          wasm_deps_exact_scope="nook-rust-wasm-deps-v5$scope_suffix"
        fi
        publish_exact_availability GHA_CACHE_EXACT_RUST_BASE_AVAILABLE "nook-rust-base-v1$scope_suffix"
        publish_exact_availability GHA_CACHE_EXACT_RUST_DYLINT_AVAILABLE "nook-rust-ecosystem-dylint-v3$scope_suffix"
        publish_exact_availability GHA_CACHE_EXACT_RUST_FUZZ_AVAILABLE "nook-rust-ecosystem-fuzz-v3$scope_suffix"
        publish_exact_availability GHA_CACHE_EXACT_RUST_POLICY_TOOLS_AVAILABLE "nook-rust-ecosystem-policy-tools-v4$scope_suffix"
        publish_exact_availability GHA_CACHE_EXACT_RUST_DETERMINISTIC_AVAILABLE "nook-rust-ecosystem-deterministic-v1$scope_suffix"
        publish_exact_availability GHA_CACHE_EXACT_RUST_KANI_AVAILABLE "nook-rust-ecosystem-kani-v1$scope_suffix"
        publish_exact_availability GHA_CACHE_EXACT_RUST_DEPS_AVAILABLE "nook-rust-deps-v3$scope_suffix"
        publish_exact_availability GHA_CACHE_EXACT_RUST_WASM_DEPS_AVAILABLE "$wasm_deps_exact_scope"
        publish_exact_availability GHA_CACHE_EXACT_RUST_NATIVE_SOURCE_AVAILABLE "nook-rust-native-source-v3$scope_suffix"
        publish_main_availability GHA_CACHE_MAIN_RUST_NATIVE_SOURCE_AVAILABLE "nook-rust-native-source-v3"
        publish_exact_availability GHA_CACHE_EXACT_RUST_WASM_SOURCE_AVAILABLE "nook-rust-wasm-source-v2$scope_suffix"
        publish_main_availability GHA_CACHE_MAIN_RUST_WASM_SOURCE_AVAILABLE "nook-rust-wasm-source-v2"
        publish_exact_availability GHA_CACHE_EXACT_RUST_WASM_NODE_AVAILABLE "nook-rust-wasm-node-v1$scope_suffix"
        publish_exact_availability GHA_CACHE_EXACT_PREFLIGHT_AVAILABLE "nook-preflight-v1$scope_suffix"
        publish_exact_availability GHA_CACHE_EXACT_WEB_E2E_AVAILABLE "nook-web-e2e-v1$scope_suffix"
        echo "GHA_CACHE_EXACT_PROBES_COMPLETE=1" >> "$GITHUB_ENV"

        if [ -n "$hive_remote_ref" ]; then
          hive_ref="${hive_remote_ref#type=registry,ref=}"
          hive_seed="type=registry,ref=$registry_host/nook/buildcache/nook-hive-linux-amd64-v1:buildcache"
          hive_probe_status=0
          cache_ref_status "$hive_ref" || hive_probe_status=$?
          case "$hive_probe_status" in
            0)
              hive_seed=""
              echo "Exact Hive cache available; Main seed suppressed"
              ;;
            1)
              echo "Exact Hive cache absent; trusted Main seed enabled"
              ;;
            *) exit "$hive_probe_status" ;;
          esac
          echo "HIVE_CACHE_FROM=$hive_remote_ref" >> "$GITHUB_ENV"
          echo "HIVE_CACHE_SEED_FROM=$hive_seed" >> "$GITHUB_ENV"
          echo "HIVE_CACHE_TO=$hive_remote_ref,mode=max,timeout=15m" >> "$GITHUB_ENV"
        fi
        cache_write_enabled=""
        if [ "$isolated_cache_write" = "true" ]; then
          if [ "${NOOK_ARC_RUNNER:-}" = "1" ]; then
            echo "ARC persistent BuildKit state suppresses isolated registry cache export"
          else
            cache_write_enabled=1
          fi
        elif [ -z "$read_only" ] && [ "${{ inputs.cache-write }}" = "true" ]; then
          cache_write_enabled=1
        fi
        echo "GHA_CACHE_WRITE_ENABLED=$cache_write_enabled" >> "$GITHUB_ENV"

    - name: Set CI environment
      shell: bash
      run: |
        echo "NOOK_ENV=ci" >> "$GITHUB_ENV"

    - name: Start cache telemetry
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v node >/dev/null 2>&1; then
          echo "Host Node.js is unavailable; skipping cache telemetry on this runner."
          exit 0
        fi
        baseline="$RUNNER_TEMP/nook-cache-telemetry-baseline.json"
        node .github/scripts/cache-telemetry.cjs start --output "$baseline"
        echo "NOOK_CACHE_TELEMETRY_BASELINE=$baseline" >> "$GITHUB_ENV"

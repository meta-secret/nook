name: Nook Docker setup
description: Task, Buildx, and authenticated registry BuildKit cache setup.

inputs:
  cache-write:
    description: Allow this workflow source to update the shared hosted BuildKit cache refs.
    required: false
    default: "true"
  main-cache-only:
    description: Restore only trusted registry caches and disable cache writes.
    required: false
    default: "false"
  isolated-cache-write:
    description: >-
      Allow hosted runners to publish only an isolated remote-buildcache ref keyed by
      git commit SHA (-git-<sha>). ARC keeps ordinary large graphs in its node-local
      persistent shard. The authorized remote build:compile publication handoff writes
      only its exact-commit source ref. A read-only build:compile verification never
      exports a registry cache. Other jobs never write Main's protected refs.
    required: false
    default: "false"
  publish-compile-cache:
    description: >-
      Build-only compile cache contract: true publishes the Phase A dependency
      foundation to the exact-head source cache; false runs both phases without
      registry export. This input is valid only for remote build:compile.
    required: false
    default: "true"
  monitor-buildkit-storage:
    description: Warn when the selected ARC BuildKit shard approaches its GC ceiling.
    required: false
    default: "false"
  registry-host:
    description: OCI registry hostname for BuildKit cache and image login.
    required: false
    default: registry.dev.nokey.sh
  registry-username:
    description: OCI registry username.
    required: true
  registry-password:
    description: OCI registry password or token.
    required: true
  sccache-access-key:
    description: SeaweedFS S3 access key for Rust compiler objects.
    required: false
    default: ""
  sccache-secret-key:
    description: SeaweedFS S3 secret key for Rust compiler objects.
    required: false
    default: ""
  sccache-endpoint:
    description: Public HTTPS hostname for the SeaweedFS S3 endpoint.
    required: false
    default: "sccache.dev.nokey.sh"
  sccache-bucket:
    description: SeaweedFS S3 bucket used by this trust domain.
    required: false
    default: "nook-sccache"
  require-sccache:
    description: Fail closed unless the trusted job has the complete writable SCCache pair.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Provision Node.js for cache telemetry
      uses: actions/setup-node@v7
      with:
        node-version: "24.19.0"

    - name: Setup Task
      uses: go-task/setup-task@v2
      with:
        version: 3.52.0

    - name: Raise Linux filesystem watcher limits
      shell: bash
      run: |
        ensure_minimum() {
          local key="$1"
          local minimum="$2"
          local current
          current="$(sysctl -n "$key")"
          if (( current < minimum )); then
            if sudo -n true 2>/dev/null; then
              sudo sysctl -w "$key=$minimum"
            else
              echo "::warning::$key = $current (< $minimum); runner cannot raise it without interactive sudo"
            fi
          else
            echo "$key = $current (already >= $minimum)"
          fi
        }
        ensure_minimum fs.inotify.max_user_instances 2500
        ensure_minimum fs.inotify.max_user_watches 10485760

    - name: Login to Nook OCI registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry-host }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Preload hosted BuildKit from Zot
      if: ${{ !startsWith(runner.name, 'nook-k0s-') }}
      shell: bash
      run: docker pull "${{ inputs.registry-host }}/moby/buildkit:buildx-stable-1"

    # GitHub-hosted VMs use their job-scoped BuildKit container. ARC runners
    # use the persistent rootless BuildKit shard on their Kubernetes node.
    # The runner carries only client tooling and never receives a Docker daemon
    # or host runtime socket.
    # Taskfiles never pass --builder; the health wrapper selects it.
    - name: Setup hosted Buildx
      id: hosted-buildx
      if: ${{ !startsWith(runner.name, 'nook-k0s-') }}
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: image=${{ inputs.registry-host }}/moby/buildkit:buildx-stable-1

    - name: Connect ARC Buildx to the node-local BuildKit shard
      id: arc-buildx
      if: ${{ startsWith(runner.name, 'nook-k0s-') }}
      shell: bash
      run: |
        set -euo pipefail
        case "${NOOK_BUILDKIT_ADDR:-}" in
          tcp://nook-buildkit.arc-runners.svc.cluster.local:1234) ;;
          *)
            echo "ARC BuildKit must use the node-local Kubernetes service" >&2
            exit 2
            ;;
        esac
        builder="nook-arc-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
        builder="$(printf '%s' "$builder" | tr -c 'a-zA-Z0-9_.-' '-')"
        docker buildx create \
          --name "$builder" \
          --driver remote \
          --use \
          "$NOOK_BUILDKIT_ADDR"
        docker buildx inspect "$builder" --bootstrap
        echo "name=$builder" >> "$GITHUB_OUTPUT"
        echo "NOOK_BUILDKIT_REMOTE=1" >> "$GITHUB_ENV"

    - name: Connect SeaweedFS compiler cache
      uses: ./.github/actions/nook-cache-connect
      with:
        sccache-access-key: ${{ inputs.sccache-access-key }}
        sccache-secret-key: ${{ inputs.sccache-secret-key }}
        sccache-endpoint: ${{ inputs.sccache-endpoint }}
        sccache-bucket: ${{ inputs.sccache-bucket }}

    - name: Configure hosted BuildKit cache
      shell: bash
      env:
        NOOK_REMOTE_TASK_SELECTION: ${{ github.event.inputs.tasks || github.event.inputs.task }}
        NOOK_SELECTED_BUILDER: ${{ steps.arc-buildx.outputs.name || steps.hosted-buildx.outputs.name }}
      run: |
        set -euo pipefail

        if [ "${{ inputs.require-sccache }}" = "true" ]; then
          if [ "${NOOK_SCCACHE_BACKEND:-}" != "remote" ] ||
             [ "${SCCACHE_S3_RW_MODE:-}" != "READ_WRITE" ]; then
            echo "trusted cache job requires a writable READ_WRITE SCCache backend" >&2
            exit 1
          fi
        fi

        pr_number="${{ github.event.pull_request.number }}"
        event_name="${{ github.event_name }}"
        git_ref="${{ github.ref }}"
        test -n "$NOOK_SELECTED_BUILDER"
        echo "NOOK_PR_BUILDX_BUILDER=$NOOK_SELECTED_BUILDER" >> "$GITHUB_ENV"
        echo "GHA_CACHE_ENABLED=1" >> "$GITHUB_ENV"
        echo "NOOK_REGISTRY_CACHE_HOST=${{ inputs.registry-host }}" >> "$GITHUB_ENV"

        read_only=""
        if [ "$event_name" != "push" ] || [ "$git_ref" != "refs/heads/main" ]; then
          read_only=1
          if [[ "$pr_number" =~ ^[0-9]+$ ]] && [ "${{ inputs.cache-write }}" != "false" ]; then
            echo "::warning::Pull-request jobs are forced to restore Main's cache read-only"
          fi
        fi
        isolated_cache_write="${{ inputs.isolated-cache-write }}"
        isolated_scope_requested="$isolated_cache_write"
        publish_compile_cache="${{ inputs.publish-compile-cache }}"
        case "$publish_compile_cache" in
          true|false) ;;
          *)
            echo "publish-compile-cache must be true or false (got: ${publish_compile_cache:-empty})" >&2
            exit 1
            ;;
        esac
        remote_compile_cache_write=""
        remote_compile_scope=""
        if [ "$event_name" = "workflow_dispatch" ] \
          && [ "$NOOK_REMOTE_TASK_SELECTION" = "build:compile" ]; then
          remote_compile_scope=1
          echo "NOOK_REMOTE_TASK_SELECTION=$NOOK_REMOTE_TASK_SELECTION" >> "$GITHUB_ENV"
          echo "NOOK_BUILD_COMPILE_CACHE_IMPORTS_VERIFIED=0" >> "$GITHUB_ENV"
          echo "NOOK_BUILD_COMPILE_FOUNDATION_STATUS=not_started" >> "$GITHUB_ENV"
          echo "NOOK_BUILD_COMPILE_SOURCE_STATUS=not_started" >> "$GITHUB_ENV"
          # Feature source output is exact-head scoped.
          if [ "$NOOK_REMOTE_TASK_SELECTION" = "build:compile" ] \
            && [ "$publish_compile_cache" = "true" ]; then
            remote_compile_cache_write=1
            echo "build:compile publication mode enables the Phase A exact-head foundation export"
          else
            echo "build:compile read-only verification imports caches in both phases without registry export"
          fi
        elif [ "$publish_compile_cache" != "true" ]; then
          echo "publish-compile-cache=false requires the remote build:compile task" >&2
          exit 1
        fi
        if [ "$publish_compile_cache" = "true" ]; then
          echo "NOOK_COMPILE_CACHE_MODE=publish" >> "$GITHUB_ENV"
        else
          echo "NOOK_COMPILE_CACHE_MODE=read-only" >> "$GITHUB_ENV"
        fi
        if [ "$isolated_cache_write" = "true" ] || [ -n "$remote_compile_scope" ]; then
          if [ "${{ inputs.main-cache-only }}" != "true" ] \
            || [ "${{ inputs.cache-write }}" != "false" ]; then
            echo "isolated-cache-write requires main-cache-only=true and cache-write=false" >&2
            exit 1
          fi
          case "$event_name" in
            workflow_dispatch)
              case "$git_ref" in
                refs/heads/*) ;;
                *)
                  echo "isolated-cache-write requires a repository branch ref" >&2
                  exit 1
                  ;;
              esac
              ;;
            pull_request)
              if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
                echo "isolated-cache-write on pull_request requires a PR number" >&2
                exit 1
              fi
              ;;
            *)
              echo "isolated-cache-write requires workflow_dispatch or pull_request" >&2
              exit 1
              ;;
          esac
        elif [ "${{ inputs.main-cache-only }}" = "true" ]; then
          if [ "${{ inputs.cache-write }}" != "false" ]; then
            echo "main-cache-only requires cache-write=false" >&2
            exit 1
          fi
          read_only=1
        fi

        # ARC retains its solved graph in the persistent shard for ordinary PR and
        # validation jobs. Keep that node-local behavior everywhere except the
        # explicitly authorized remote build:compile handoff above.
        if [ "${NOOK_ARC_RUNNER:-}" = "1" ] \
          && [ -z "$remote_compile_cache_write" ]; then
          isolated_cache_write=false
          echo "ARC skips general exact-SHA registry export; Main and sccache remain reusable"
        fi

        scope_suffix=""
        # Exact source identity is required for both publication and read-only
        # verification. ARC may disable write authorization above, but that must
        # not erase the scope exported to the later task step.
        if [ "$isolated_scope_requested" = "true" ] || [ -n "$remote_compile_scope" ]; then
          if [ "$event_name" = "pull_request" ]; then
            # Key by PR head SHA (not the merge GITHUB_SHA) so local HEAD publish matches.
            scope_sha="${{ github.event.pull_request.head.sha }}"
          else
            if [ -z "$NOOK_REMOTE_TASK_SELECTION" ]; then
              echo "isolated-cache-write requires a dispatched task selection" >&2
              exit 1
            fi
            scope_sha="$(git rev-parse HEAD)"
          fi
          if [[ ! "$scope_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "isolated-cache-write requires a 40-char lowercase git SHA (got: ${scope_sha:-empty})" >&2
            exit 1
          fi
          scope_suffix="-git-$scope_sha"
          if [ "$isolated_cache_write" = "true" ]; then
            echo "Isolated cache writes use $scope_suffix"
          else
            echo "Remote compile read-only verification uses exact source scope $scope_suffix"
          fi
        fi
        parent_scope_suffix=""
        if [ -n "$remote_compile_scope" ]; then
          if parent_scope_sha="$(git rev-parse --verify HEAD^1 2>/dev/null)"; then
            if [[ "$parent_scope_sha" =~ ^[0-9a-f]{40}$ ]]; then
              parent_scope_suffix="-git-$parent_scope_sha"
              echo "Remote compile cache lineage includes the first-parent scope $parent_scope_suffix"
            else
              echo "first-parent commit is not a 40-character lowercase Git SHA" >&2
              exit 1
            fi
          else
            echo "Remote compile cache lineage has no first-parent scope to import"
          fi
        fi
        echo "GHA_CACHE_SCOPE_SUFFIX=$scope_suffix" >> "$GITHUB_ENV"
        echo "GHA_CACHE_PARENT_SCOPE_SUFFIX=$parent_scope_suffix" >> "$GITHUB_ENV"
        # BuildKit does not replay cached RUN stdout. Compiler stages persist
        # their reports in-layer; this per-job value reruns only the terminal
        # read that emits the persisted, authoritative JSON marker.
        echo "NOOK_SCCACHE_TELEMETRY_REPLAY=${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-local}" >> "$GITHUB_ENV"

        cache_write_enabled=""
        if [ -n "$remote_compile_cache_write" ]; then
          cache_write_enabled=1
        elif [ "$isolated_cache_write" = "true" ]; then
          cache_write_enabled=1
        elif [ -z "$read_only" ] && [ "${{ inputs.cache-write }}" = "true" ]; then
          cache_write_enabled=1
        fi
        # The Delivery-owned read-only compile handoff is an explicit no-op for
        # registry publication. Keep this guard next to the generic cache flag
        # so a future cache-write path cannot accidentally re-enable export.
        if [ "$NOOK_REMOTE_TASK_SELECTION" = "build:compile" ] \
          && [ "$publish_compile_cache" = "false" ]; then
          cache_write_enabled=""
        fi
        echo "GHA_CACHE_WRITE_ENABLED=$cache_write_enabled" >> "$GITHUB_ENV"

    - name: Verify Docker cache refs and blobs
      if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tasks || github.event.inputs.task) == 'build:compile' }}
      shell: bash
      env:
        REGISTRY_HOST: ${{ inputs.registry-host }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
      run: |
        set -euo pipefail
        timeout 60s node --input-type=module <<'NODE'
        class BuildKitCacheAccessVerifier {
          constructor(environment, fetcher) {
            this.environment = environment;
            this.fetcher = fetcher;
          }

          async verify() {
            this.registryHost = this.requireValue("REGISTRY_HOST");
            const username = this.requireValue("REGISTRY_USERNAME");
            const password = this.requireValue("REGISTRY_PASSWORD");
            this.authorization = `Basic ${Buffer.from(`${username}:${password}`).toString("base64")}`;

            await this.verifyRegistryAvailability();
            const currentScope = this.environment.GHA_CACHE_SCOPE_SUFFIX;
            if (typeof currentScope !== "string" || currentScope.length === 0) {
              throw new Error("remote compile current cache scope is missing");
            }
            const scopeSuffixes = [currentScope];
            const parentScope = this.environment.GHA_CACHE_PARENT_SCOPE_SUFFIX;
            if (
              typeof parentScope === "string" &&
              parentScope.length > 0 &&
              parentScope !== currentScope
            ) {
              scopeSuffixes.push(parentScope);
            }

            for (const scopeSuffix of scopeSuffixes) {
              await this.verifyCacheRef(scopeSuffix);
            }
            console.log("Registry transport and every present Phase A cache manifest/blob are accessible; absent exact refs remain expected misses");
          }

          async verifyRegistryAvailability() {
            const response = await this.request(`https://${this.registryHost}/v2/`, "GET");
            if (!response.ok) {
              throw new Error(`registry returned HTTP ${response.status} for the authenticated API check`);
            }
          }

          requireValue(name) {
            const value = this.environment[name];
            if (typeof value !== "string" || value.length === 0) {
              throw new Error(`required registry setting ${name} is missing`);
            }
            return value;
          }

          async request(url, method) {
            return await this.fetcher(url, {
              method,
              headers: {
                authorization: this.authorization,
                accept: [
                  "application/vnd.oci.image.index.v1+json",
                  "application/vnd.oci.image.manifest.v1+json",
                  "application/vnd.docker.distribution.manifest.list.v2+json",
                  "application/vnd.docker.distribution.manifest.v2+json",
                ].join(", "),
              },
              signal: AbortSignal.timeout(10_000),
            });
          }

          async verifyCacheRef(scopeSuffix) {
            // This checks access only; Phase A gives both refs to BuildKit, which owns reuse/validity.
            const repository = `nook/remote-buildcache/nook-build-compile${scopeSuffix}`;
            const visitedManifests = new Set();
            const blobDigests = new Set();
            await this.visitManifest(repository, "buildcache", true, visitedManifests, blobDigests);
            const digests = Array.from(blobDigests);
            for (let offset = 0; offset < digests.length; offset += 16) {
              await Promise.all(
                digests
                  .slice(offset, offset + 16)
                  .map((digest) => this.verifyBlob(repository, digest)),
              );
            }
          }

          async visitManifest(repository, reference, root, visitedManifests, blobDigests) {
            if (visitedManifests.has(reference)) return;
            visitedManifests.add(reference);
            const url = `https://${this.registryHost}/v2/${repository}/manifests/${reference}`;
            const response = await this.request(url, "GET");
            if (root && response.status === 404) {
              console.log(`BuildKit cache ref is absent; BuildKit may treat it as a cache miss: ${repository}:buildcache`);
              return;
            }
            if (!response.ok) {
              throw new Error(`registry returned HTTP ${response.status} for cache manifest ${repository}:${reference}`);
            }

            let manifest;
            try {
              manifest = await response.json();
            } catch {
              throw new Error(`registry returned invalid JSON for cache manifest ${repository}:${reference}`);
            }
            if (typeof manifest !== "object" || Array.isArray(manifest) || !Object.hasOwn(manifest, "schemaVersion")) {
              throw new Error(`registry returned an invalid cache manifest ${repository}:${reference}`);
            }

            if (Object.hasOwn(manifest, "manifests")) {
              if (!Array.isArray(manifest.manifests)) {
                throw new Error(`cache manifest list is invalid for ${repository}:${reference}`);
              }
              for (const descriptor of manifest.manifests) {
                await this.visitManifest(
                  repository,
                  this.digestFrom(descriptor),
                  false,
                  visitedManifests,
                  blobDigests,
                );
              }
            }

            if (Object.hasOwn(manifest, "config")) {
              blobDigests.add(this.digestFrom(manifest.config));
            }
            if (Object.hasOwn(manifest, "layers")) {
              if (!Array.isArray(manifest.layers)) {
                throw new Error(`cache manifest layers are invalid for ${repository}:${reference}`);
              }
              for (const descriptor of manifest.layers) {
                blobDigests.add(this.digestFrom(descriptor));
              }
            }
            if (
              !Object.hasOwn(manifest, "manifests") &&
              (!Object.hasOwn(manifest, "config") || !Object.hasOwn(manifest, "layers"))
            ) {
              throw new Error(`cache manifest has no referenced content: ${repository}:${reference}`);
            }
          }

          digestFrom(descriptor) {
            const digest = descriptor.digest;
            if (typeof digest !== "string" || !/^sha256:[0-9a-f]{64}$/.test(digest)) {
              throw new Error("registry cache manifest contains an invalid blob digest");
            }
            return digest;
          }

          async verifyBlob(repository, digest) {
            const url = `https://${this.registryHost}/v2/${repository}/blobs/${digest}`;
            const response = await this.request(url, "HEAD");
            if (!response.ok) {
              throw new Error(`registry returned HTTP ${response.status} for referenced cache blob ${digest}`);
            }
          }
        }

        const verifier = new BuildKitCacheAccessVerifier(process.env, fetch);
        await verifier.verify();
        NODE
        {
          echo "NOOK_BUILD_COMPILE_CACHE_IMPORTS_VERIFIED=1"
          echo "GHA_CACHE_EXACT_PROBES_COMPLETE=1"
          echo "GHA_CACHE_EXACT_PROBE_FAILURE_CLASS=none"
        } >> "$GITHUB_ENV"

    - name: Set CI environment
      shell: bash
      run: |
        echo "NOOK_ENV=ci" >> "$GITHUB_ENV"

    - name: Check ARC BuildKit storage pressure
      if: ${{ inputs.monitor-buildkit-storage == 'true' && startsWith(runner.name, 'nook-k0s-') }}
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        usage="$(mktemp)"
        trap 'rm -f "$usage"' EXIT
        if ! timeout 8s docker buildx du >"$usage"; then
          echo "::warning::BuildKit storage usage check did not finish within 8 seconds"
          exit 0
        fi
        total="$(sed -n 's/^Total:[[:space:]]*//p' "$usage" | tail -1)"
        case "$total" in
          *GB) whole="${total%GB}"; whole="${whole%%.*}" ;;
          *GiB) whole="${total%GiB}"; whole="${whole%%.*}" ;;
          *) echo "::warning::BuildKit storage total was not parseable: ${total:-missing}"; exit 0 ;;
        esac
        if [ "$whole" -ge 100 ]; then
          echo "::warning title=BuildKit cache near GC ceiling::Shard usage is $total; investigate GC before the 112 GB max-use target is crossed"
        else
          echo "BuildKit shard usage: $total (below the 100 GB warning threshold)"
        fi

    - name: Start cache telemetry
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        node_bin="$(command -v node || true)"
        if [ -z "$node_bin" ] && [ -x /home/runner/externals/node24/bin/node ]; then
          node_bin=/home/runner/externals/node24/bin/node
        fi
        if [ -z "$node_bin" ]; then
          echo "Actions Node.js runtime is required for complete cache telemetry." >&2
          exit 1
        fi
        baseline="$RUNNER_TEMP/nook-cache-telemetry-baseline.json"
        timeout 15s "$node_bin" "${{ github.action_path }}/../../workflows/lib/cache-telemetry.mjs" start --output "$baseline"
        echo "NOOK_CACHE_TELEMETRY_BASELINE=$baseline" >> "$GITHUB_ENV"

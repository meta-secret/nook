[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]

[advisories]
ignore = [
  # RUSTSEC-2026-0387: crypto-bigint 0.5.5 timing variability (pinned age graph).
  { id = "RUSTSEC-2026-0387", reason = "Review by 2027-01-24. crypto-bigint 0.5.5 only enters via age 0.12.1 (latest release) -> p256 0.13 / hpke 0.12 -> elliptic-curve 0.13; no patched 0.5.x exists and the 0.7.x copy is upgraded to 0.7.6. Remove when age ships on p256 0.14 / crypto-bigint >=0.7.6." },
]
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/helix-editor/nucleo",
  "https://github.com/helix-editor/nucleo.git",
  "https://github.com/openai-oss-forks/tokio-tungstenite",
  "https://github.com/openai-oss-forks/tokio-tungstenite.git",
  "https://github.com/openai-oss-forks/tungstenite-rs",
  "https://github.com/openai-oss-forks/tungstenite-rs.git",
  "https://github.com/rust-lang/rust-clippy",
  "https://github.com/meta-secret/codex",
  "https://github.com/meta-secret/codex.git",
  "https://github.com/meta-secret/hickory-dns",
  "https://github.com/meta-secret/hickory-dns.git",
]

graph:
  architecture:
    architecture_task:
      attrs:
        id: "architecture"
        description: "Design the architecture of the system."
      depends_on:
      output: architecture_output

    architecture_output:
      attrs:
        - design_doc

  backend:
    backend_task:
      attrs:
        id: "backend"
        description: "Implement backend services based on architecture design."
      depends_on:
        - architecture_task
      output: backend_output

    backend_output:
      attrs:
        - source_code

  unit_test:
    unit_test_task:
      attrs:
        id: "unit_test"
        description: "Run unit test suite against backend code."
      depends_on:
        - backend_task
      retries: 3
      output: unit_test_output
      error: unit_test_error

    unit_test_output:
      attrs:
        - test_logs
        - passed

    unit_test_error:
      attrs:
        - failed_test_count
        - error_log

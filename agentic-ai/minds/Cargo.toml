[workspace]
members = [
    "hive",
    "lace",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minds: AI Agent Team Orchestration and Task Management"
repository = "https://github.com/meta-secret/nook"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[patch.crates-io]
arrayref = { path = "vendor/arrayref" }
# Preserve Rama 0.3 alpha compatibility while resolving patched Hickory Proto.
hickory-resolver = { git = "https://github.com/meta-secret/hickory-dns.git", rev = "5279616c4d7d3368e23bc8dbed7dbf354b132173" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

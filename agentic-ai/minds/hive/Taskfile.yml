version: '3'

vars:
  HIVE_DIR: ..
  HIVE_TASK_DIR:
    sh: 'cd "{{.TASKFILE_DIR}}" && pwd'
  NOOK_FORMATTER_CONTEXT:
    sh: 'cd "{{.TASKFILE_DIR}}/../../../.github/formatting" && pwd'
  HIVE_IMAGE: '{{default "nook-hive:local" .HIVE_IMAGE}}'
  HIVE_FORMAT_IMAGE: '{{default "nook-hive-format:local" .HIVE_FORMAT_IMAGE}}'
  HIVE_RUST_VERSION: '1.97'
  HIVE_DEBIAN_RELEASE: trixie
  HIVE_RUST_DIGEST: sha256:3382bd20aa942806c533e9a73cd000474fb3ef173f71e684cc9b942675781769
  HIVE_TEST_RUNTIME_IMAGE: rust:{{.HIVE_RUST_VERSION}}-{{.HIVE_DEBIAN_RELEASE}}@{{.HIVE_RUST_DIGEST}}
  SCCACHE_S3_ACCESS_KEY_FILE:
    sh: >-
      if [ -n "${SCCACHE_S3_ACCESS_KEY_FILE:-}" ]; then
        printf '%s' "$SCCACHE_S3_ACCESS_KEY_FILE";
      else
        printf '%s' "${HOME}/.nook/cache/sccache-access-key";
      fi
  SCCACHE_S3_SECRET_KEY_FILE:
    sh: >-
      if [ -n "${SCCACHE_S3_SECRET_KEY_FILE:-}" ]; then
        printf '%s' "$SCCACHE_S3_SECRET_KEY_FILE";
      else
        printf '%s' "${HOME}/.nook/cache/sccache-secret-key";
      fi

tasks:
  format:
    desc: Format the Hive workspace in the pinned builder and apply formatted sources.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - |
        HIVE_TASK_DIR='{{.HIVE_TASK_DIR}}' \
        HIVE_FORMAT_IMAGE='{{.HIVE_FORMAT_IMAGE}}' \
        bash <<'BASH'
        set -euo pipefail
        # shellcheck source=prepare-sccache-context.sh
        . "$HIVE_TASK_DIR/prepare-sccache-context.sh"
        prepare_nook_sccache_helpers_context
        image="$HIVE_FORMAT_IMAGE"
        docker build \
          --platform linux/amd64 \
          --target formatter \
          --tag "$image" \
          --build-context "nook-sccache-helpers=$NOOK_SCCACHE_HELPERS_CONTEXT" \
          --build-context "nook-formatter={{.NOOK_FORMATTER_CONTEXT}}" \
          --file hive/Dockerfile \
          .
        container="$(docker create "$image")"
        formatted="$(mktemp -d)"
        cleanup() {
          docker rm "$container" >/dev/null 2>&1 || true
          rm -rf "$formatted"
          cleanup_nook_sccache_helpers_context
        }
        trap cleanup EXIT
        docker cp "$container:/build/hive/src" "$formatted/hive-src"
        cp -R "$formatted/hive-src/." "hive/src/"
        docker cp "$container:/build/hive/tests" "$formatted/hive-tests"
        cp -R "$formatted/hive-tests/." "hive/tests/"
        console_image="${image}-console"
        docker build \
          --platform linux/amd64 \
          --target console-formatter \
          --tag "$console_image" \
          --build-context "nook-sccache-helpers=$NOOK_SCCACHE_HELPERS_CONTEXT" \
          --build-context "nook-formatter={{.NOOK_FORMATTER_CONTEXT}}" \
          --file hive/Dockerfile \
          .
        console_container="$(docker create "$console_image")"
        docker cp "$console_container:/console/." "$formatted/hive-console"
        docker rm "$console_container" >/dev/null
        for path in src e2e locales index.html svelte.config.js tsconfig.json vite.config.ts playwright.config.ts .prettierrc PRODUCT.md DESIGN.md package.json; do
          rm -rf "hive-console/$path"
           cp -R "$formatted/hive-console/$path" "hive-console/$path"
         done
        BASH

  check:
    desc: Format-check and lint the Hive worker in its pinned builder image.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - |
        HIVE_TASK_DIR='{{.HIVE_TASK_DIR}}' \
        SCCACHE_S3_ACCESS_KEY_FILE='{{.SCCACHE_S3_ACCESS_KEY_FILE}}' \
        SCCACHE_S3_SECRET_KEY_FILE='{{.SCCACHE_S3_SECRET_KEY_FILE}}' \
        bash <<'BASH'
        set -euo pipefail
        # shellcheck source=prepare-sccache-context.sh
        . "$HIVE_TASK_DIR/prepare-sccache-context.sh"
        prepare_nook_sccache_helpers_context
        trap cleanup_nook_sccache_helpers_context EXIT
        command=(docker buildx build
          --platform linux/amd64
          --target check
          --build-arg "SCCACHE_ENDPOINT=${SCCACHE_ENDPOINT:-https://sccache.dev.nokey.sh}"
          --build-arg "SCCACHE_BUCKET=${SCCACHE_BUCKET:-nook-sccache}"
          --output type=cacheonly)
        if [ -n "${HIVE_CACHE_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_FROM")
        fi
        if [ -n "${HIVE_CACHE_SEED_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_SEED_FROM")
        fi
        if [ -n "${HIVE_CACHE_TO:-}" ]; then
          command+=(--cache-to "$HIVE_CACHE_TO")
        fi
        access_file="$SCCACHE_S3_ACCESS_KEY_FILE"
        secret_file="$SCCACHE_S3_SECRET_KEY_FILE"
        if [ -r "$access_file" ] && [ -r "$secret_file" ]; then
          command+=(--secret "id=sccache_s3_access_key,src=$access_file")
          command+=(--secret "id=sccache_s3_secret_key,src=$secret_file")
        else
          echo "Hive S3 sccache credentials unavailable" >&2
        fi
        command+=(
          --build-context "nook-sccache-helpers=$NOOK_SCCACHE_HELPERS_CONTEXT"
          --build-context "nook-formatter={{.NOOK_FORMATTER_CONTEXT}}"
          --file hive/Dockerfile
          .)
        "${command[@]}"
        BASH

  verify:
    desc: Run Hive Clippy and behavior tests concurrently inside BuildKit.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - |
        HIVE_TASK_DIR='{{.HIVE_TASK_DIR}}' \
        SCCACHE_S3_ACCESS_KEY_FILE='{{.SCCACHE_S3_ACCESS_KEY_FILE}}' \
        SCCACHE_S3_SECRET_KEY_FILE='{{.SCCACHE_S3_SECRET_KEY_FILE}}' \
        HIVE_TEST_RUNTIME_IMAGE='{{.HIVE_TEST_RUNTIME_IMAGE}}' \
        bash <<'BASH'
        set -euo pipefail
        # shellcheck source=prepare-sccache-context.sh
        . "$HIVE_TASK_DIR/prepare-sccache-context.sh"
        prepare_nook_sccache_helpers_context
        verified="$(mktemp -d)"
        profiles="$(mktemp -d)"
        coverage="$(mktemp -d)"
        cleanup() {
          rm -rf "$verified" "$profiles" "$coverage"
          cleanup_nook_sccache_helpers_context
        }
        trap cleanup EXIT
        command=(docker buildx build
          --platform linux/amd64
          --build-arg "SCCACHE_ENDPOINT=${SCCACHE_ENDPOINT:-https://sccache.dev.nokey.sh}"
          --build-arg "SCCACHE_BUCKET=${SCCACHE_BUCKET:-nook-sccache}" --build-arg "HIVE_RUST_COVERAGE_FLOOR=$(jq -er '.package_lines_percent.hive | numbers' "$HIVE_TASK_DIR/../../../nook-app/nook-platform/nook-core/coverage-floor.json")")
        if [ -n "${HIVE_CACHE_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_FROM")
        fi
        if [ -n "${HIVE_CACHE_SEED_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_SEED_FROM")
        fi
        if [ -n "${HIVE_CACHE_TO:-}" ]; then
          command+=(--cache-to "$HIVE_CACHE_TO")
        fi
        access_file="$SCCACHE_S3_ACCESS_KEY_FILE"
        secret_file="$SCCACHE_S3_SECRET_KEY_FILE"
        if [ -r "$access_file" ] && [ -r "$secret_file" ]; then
          command+=(--secret "id=sccache_s3_access_key,src=$access_file")
          command+=(--secret "id=sccache_s3_secret_key,src=$secret_file")
        else
          echo "Hive S3 sccache credentials unavailable" >&2
        fi
        command+=(
          --build-context "nook-sccache-helpers=$NOOK_SCCACHE_HELPERS_CONTEXT"
          --build-context "nook-formatter={{.NOOK_FORMATTER_CONTEXT}}"
          --file hive/Dockerfile)
        "${command[@]}" --target verify-export --output "type=local,dest=$verified" .
        test -f "$verified/hive-check-passed"
        test -f "$verified/hive-sandbox-package-passed"
        test -f "$verified/hive-login-shell-toolchain-passed"
        test -n "$(find "$verified/hive-tests" -type f -print -quit)"
        test_kib="$(du -sk "$verified/hive-tests" | awk '{print $1}')"
        if [ "$test_kib" -gt 524288 ]; then
          echo "Refusing oversized Hive test export: ${test_kib} KiB" >&2
          exit 1
        fi
        test_environment=(-e "RUST_BACKTRACE=1")
        if [ -n "${HIVE_NEO4J_TEST_URI:-}" ]; then
          : "${HIVE_NEO4J_TEST_PASSWORD:?HIVE_NEO4J_TEST_PASSWORD is required with HIVE_NEO4J_TEST_URI}"
          test_environment+=(
            -e "HIVE_NEO4J_TEST_URI"
            -e "HIVE_NEO4J_TEST_USERNAME=${HIVE_NEO4J_TEST_USERNAME:-neo4j}"
            -e "HIVE_NEO4J_TEST_PASSWORD")
        fi
        if [ "${NOOK_ARC_HIVE:-}" = "1" ]; then
          "$HIVE_TASK_DIR/run-arc-tests.sh" "$verified/hive-tests" "$profiles"
        else
          docker run --rm \
            --platform linux/amd64 \
            --network host \
            --mount "type=bind,src=$verified/hive-tests,dst=/tests,readonly" \
            --mount "type=bind,src=$profiles,dst=/profiles" \
            -e 'LLVM_PROFILE_FILE=/profiles/%m-%p.profraw' \
            "${test_environment[@]}" \
            "$HIVE_TEST_RUNTIME_IMAGE" \
            bash -ec 'for test_binary in /tests/*; do "$test_binary"; done'
        fi
        test -n "$(find "$profiles" -name '*.profraw' -print -quit)"
        "${command[@]}" --target coverage-export \
          --build-context "hive-coverage-profiles=$profiles" \
          --output "type=local,dest=$coverage" .
        test -f "$coverage/hive-coverage-passed"
        BASH

  build:
    desc: Build the Hive worker in its pinned builder image.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - |
        HIVE_TASK_DIR='{{.HIVE_TASK_DIR}}' \
        bash <<'BASH'
        set -euo pipefail
        # shellcheck source=prepare-sccache-context.sh
        . "$HIVE_TASK_DIR/prepare-sccache-context.sh"
        prepare_nook_sccache_helpers_context
        trap cleanup_nook_sccache_helpers_context EXIT
        docker buildx build \
          --platform linux/amd64 \
          --target builder \
          --output type=cacheonly \
          --build-context "nook-sccache-helpers=$NOOK_SCCACHE_HELPERS_CONTEXT" \
          --build-context "nook-formatter={{.NOOK_FORMATTER_CONTEXT}}" \
          --file hive/Dockerfile \
          .
        BASH

  test:
    desc: Run Hive behavior tests in its pinned builder image.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - |
        HIVE_TASK_DIR='{{.HIVE_TASK_DIR}}' \
        SCCACHE_S3_ACCESS_KEY_FILE='{{.SCCACHE_S3_ACCESS_KEY_FILE}}' \
        SCCACHE_S3_SECRET_KEY_FILE='{{.SCCACHE_S3_SECRET_KEY_FILE}}' \
        HIVE_TEST_RUNTIME_IMAGE='{{.HIVE_TEST_RUNTIME_IMAGE}}' \
        bash <<'BASH'
        set -euo pipefail
        # shellcheck source=prepare-sccache-context.sh
        . "$HIVE_TASK_DIR/prepare-sccache-context.sh"
        prepare_nook_sccache_helpers_context
        compiled="$(mktemp -d)"
        profiles="$(mktemp -d)"
        cleanup() {
          rm -rf "$compiled" "$profiles"
          cleanup_nook_sccache_helpers_context
        }
        trap cleanup EXIT
        command=(docker buildx build
          --platform linux/amd64
          --target test-export
          --build-arg "SCCACHE_ENDPOINT=${SCCACHE_ENDPOINT:-https://sccache.dev.nokey.sh}"
          --build-arg "SCCACHE_BUCKET=${SCCACHE_BUCKET:-nook-sccache}"
          --output "type=local,dest=$compiled")
        if [ -n "${HIVE_CACHE_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_FROM")
        fi
        if [ -n "${HIVE_CACHE_SEED_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_SEED_FROM")
        fi
        if [ -n "${HIVE_CACHE_TO:-}" ]; then
          command+=(--cache-to "$HIVE_CACHE_TO")
        fi
        access_file="$SCCACHE_S3_ACCESS_KEY_FILE"
        secret_file="$SCCACHE_S3_SECRET_KEY_FILE"
        if [ -r "$access_file" ] && [ -r "$secret_file" ]; then
          command+=(--secret "id=sccache_s3_access_key,src=$access_file")
          command+=(--secret "id=sccache_s3_secret_key,src=$secret_file")
        else
          echo "Hive S3 sccache credentials unavailable" >&2
        fi
        command+=(
          --build-context "nook-sccache-helpers=$NOOK_SCCACHE_HELPERS_CONTEXT"
          --build-context "nook-formatter={{.NOOK_FORMATTER_CONTEXT}}"
          --file hive/Dockerfile
          .)
        "${command[@]}"
        test -n "$(find "$compiled/hive-tests" -type f -print -quit)"
        test_kib="$(du -sk "$compiled/hive-tests" | awk '{print $1}')"
        if [ "$test_kib" -gt 524288 ]; then
          echo "Refusing oversized Hive test export: ${test_kib} KiB" >&2
          exit 1
        fi
        test_environment=(-e "RUST_BACKTRACE=1")
        if [ -n "${HIVE_NEO4J_TEST_URI:-}" ]; then
          : "${HIVE_NEO4J_TEST_PASSWORD:?HIVE_NEO4J_TEST_PASSWORD is required with HIVE_NEO4J_TEST_URI}"
          test_environment+=(
            -e "HIVE_NEO4J_TEST_URI"
            -e "HIVE_NEO4J_TEST_USERNAME=${HIVE_NEO4J_TEST_USERNAME:-neo4j}"
            -e "HIVE_NEO4J_TEST_PASSWORD")
        fi
        if [ "${NOOK_ARC_HIVE:-}" = "1" ]; then
          "$HIVE_TASK_DIR/run-arc-tests.sh" "$compiled/hive-tests" "$profiles"
        else
          docker run --rm \
            --platform linux/amd64 \
            --network host \
            --mount "type=bind,src=$compiled/hive-tests,dst=/tests,readonly" \
            --mount "type=bind,src=$profiles,dst=/profiles" \
            -e 'LLVM_PROFILE_FILE=/profiles/%m-%p.profraw' \
            "${test_environment[@]}" \
            "$HIVE_TEST_RUNTIME_IMAGE" \
            bash -ec 'for test_binary in /tests/*; do "$test_binary"; done'
        fi
        BASH

  cache:publish:
    desc: Publish the manifest-keyed release and verification dependency graphs.
    dir: '{{.HIVE_DIR}}'
    preconditions:
      - sh: test -n "${HIVE_CACHE_TO:-}"
        msg: HIVE_CACHE_TO is required for cache publication.
    cmds:
      - |
        HIVE_TASK_DIR='{{.HIVE_TASK_DIR}}' \
        SCCACHE_S3_ACCESS_KEY_FILE='{{.SCCACHE_S3_ACCESS_KEY_FILE}}' \
        SCCACHE_S3_SECRET_KEY_FILE='{{.SCCACHE_S3_SECRET_KEY_FILE}}' \
        bash <<'BASH'
        set -euo pipefail
        # shellcheck source=prepare-sccache-context.sh
        . "$HIVE_TASK_DIR/prepare-sccache-context.sh"
        prepare_nook_sccache_helpers_context
        trap cleanup_nook_sccache_helpers_context EXIT
        command=(docker buildx build
          --platform linux/amd64
          --target cache-publish
          --build-arg "SCCACHE_ENDPOINT=${SCCACHE_ENDPOINT:-https://sccache.dev.nokey.sh}"
          --build-arg "SCCACHE_BUCKET=${SCCACHE_BUCKET:-nook-sccache}"
          --output type=cacheonly
          --cache-to "$HIVE_CACHE_TO")
        if [ -n "${HIVE_CACHE_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_FROM")
        fi
        if [ -n "${HIVE_CACHE_SEED_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_SEED_FROM")
        fi
        access_file="$SCCACHE_S3_ACCESS_KEY_FILE"
        secret_file="$SCCACHE_S3_SECRET_KEY_FILE"
        if [ -r "$access_file" ] && [ -r "$secret_file" ]; then
          command+=(--secret "id=sccache_s3_access_key,src=$access_file")
          command+=(--secret "id=sccache_s3_secret_key,src=$secret_file")
        else
          echo "Hive S3 sccache credentials unavailable" >&2
        fi
        command+=(
          --build-context "nook-sccache-helpers=$NOOK_SCCACHE_HELPERS_CONTEXT"
          --build-context "nook-formatter={{.NOOK_FORMATTER_CONTEXT}}"
          --file hive/Dockerfile
          .)
        "${command[@]}"
        BASH

  image:
    desc: Build the linux/amd64 Hive worker image.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - |
        HIVE_TASK_DIR='{{.HIVE_TASK_DIR}}' \
        HIVE_IMAGE='{{.HIVE_IMAGE}}' \
        bash <<'BASH'
        set -euo pipefail
        # shellcheck source=prepare-sccache-context.sh
        . "$HIVE_TASK_DIR/prepare-sccache-context.sh"
        prepare_nook_sccache_helpers_context
        trap cleanup_nook_sccache_helpers_context EXIT
        docker build \
          --platform linux/amd64 \
          --tag "$HIVE_IMAGE" \
          --build-context "nook-sccache-helpers=$NOOK_SCCACHE_HELPERS_CONTEXT" \
          --build-context "nook-formatter={{.NOOK_FORMATTER_CONTEXT}}" \
          --file hive/Dockerfile \
          .
        BASH

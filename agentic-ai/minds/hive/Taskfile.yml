version: '3'

vars:
  HIVE_DIR: ..
  HIVE_IMAGE: '{{default "nook-hive:local" .HIVE_IMAGE}}'
  HIVE_FORMAT_IMAGE: '{{default "nook-hive-format:local" .HIVE_FORMAT_IMAGE}}'
  HIVE_TEST_RUNTIME_IMAGE: rust:1.96-trixie@sha256:1f0dbad1df66647807e6952d1db85d0b2bda7606cb2139d82517e4f009967376
  NOOK_APP_CONTEXT: ../../nook-app
  SCCACHE_S3_ACCESS_KEY_FILE: '{{default "../../.nook/cache/sccache-access-key" .SCCACHE_S3_ACCESS_KEY_FILE}}'
  SCCACHE_S3_SECRET_KEY_FILE: '{{default "../../.nook/cache/sccache-secret-key" .SCCACHE_S3_SECRET_KEY_FILE}}'

tasks:
  format:
    desc: Format the Hive workspace in the pinned builder and apply formatted sources.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        image="{{.HIVE_FORMAT_IMAGE}}"
        docker build \
          --platform linux/amd64 \
          --target formatter \
          --tag "$image" \
          --build-context "nook-app={{.NOOK_APP_CONTEXT}}" \
          --file hive/Dockerfile \
          .
        container="$(docker create "$image")"
        formatted="$(mktemp -d)"
        cleanup() {
          docker rm "$container" >/dev/null 2>&1 || true
          rm -rf "$formatted"
        }
        trap cleanup EXIT
        for crate in hive lace; do
          docker cp "$container:/build/$crate/src" "$formatted/$crate-src"
          cp -R "$formatted/$crate-src/." "$crate/src/"
        done
        docker cp "$container:/build/hive/tests" "$formatted/hive-tests"
        cp -R "$formatted/hive-tests/." "hive/tests/"
        console_image="${image}-console"
        docker build \
          --platform linux/amd64 \
          --target console-formatter \
          --tag "$console_image" \
          --build-context "nook-app={{.NOOK_APP_CONTEXT}}" \
          --file hive/Dockerfile \
          .
        console_container="$(docker create "$console_image")"
        docker cp "$console_container:/console/." "$formatted/hive-console"
        docker rm "$console_container" >/dev/null
        for path in src e2e locales index.html svelte.config.js tsconfig.json vite.config.ts playwright.config.ts .prettierrc PRODUCT.md DESIGN.md package.json; do
          rm -rf "hive-console/$path"
           cp -R "$formatted/hive-console/$path" "hive-console/$path"
         done
        BASH

  check:
    desc: Format-check and lint the Hive worker in its pinned builder image.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        command=(docker buildx build
          --platform linux/amd64
          --target check
          --output type=cacheonly)
        if [ -n "${HIVE_CACHE_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_FROM")
        fi
        if [ -n "${HIVE_CACHE_TO:-}" ]; then
          command+=(--cache-to "$HIVE_CACHE_TO")
        fi
        access_file="{{.SCCACHE_S3_ACCESS_KEY_FILE}}"
        secret_file="{{.SCCACHE_S3_SECRET_KEY_FILE}}"
        if [ -r "$access_file" ] && [ -r "$secret_file" ]; then
          command+=(--secret "id=sccache_s3_access_key,src=$access_file")
          command+=(--secret "id=sccache_s3_secret_key,src=$secret_file")
        else
          echo "Hive S3 sccache credentials unavailable" >&2
        fi
        command+=(
          --build-context "nook-app={{.NOOK_APP_CONTEXT}}"
          --file hive/Dockerfile
          .)
        "${command[@]}"
        BASH

  verify:
    desc: Run Hive Clippy and behavior tests concurrently inside BuildKit.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        verified="$(mktemp -d)"
        cleanup() {
          rm -rf "$verified"
        }
        trap cleanup EXIT
        command=(docker buildx build
          --platform linux/amd64
          --target verify-export
          --output "type=local,dest=$verified")
        if [ -n "${HIVE_CACHE_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_FROM")
        fi
        if [ -n "${HIVE_CACHE_TO:-}" ]; then
          command+=(--cache-to "$HIVE_CACHE_TO")
        fi
        access_file="{{.SCCACHE_S3_ACCESS_KEY_FILE}}"
        secret_file="{{.SCCACHE_S3_SECRET_KEY_FILE}}"
        if [ -r "$access_file" ] && [ -r "$secret_file" ]; then
          command+=(--secret "id=sccache_s3_access_key,src=$access_file")
          command+=(--secret "id=sccache_s3_secret_key,src=$secret_file")
        else
          echo "Hive S3 sccache credentials unavailable" >&2
        fi
        command+=(
          --build-context "nook-app={{.NOOK_APP_CONTEXT}}"
          --file hive/Dockerfile
          .)
        "${command[@]}"
        test -f "$verified/hive-check-passed"
        test -f "$verified/hive-sandbox-package-passed"
        test -n "$(find "$verified/hive-tests" -type f -print -quit)"
        test_kib="$(du -sk "$verified/hive-tests" | awk '{print $1}')"
        if [ "$test_kib" -gt 524288 ]; then
          echo "Refusing oversized Hive test export: ${test_kib} KiB" >&2
          exit 1
        fi
        test_environment=(-e "RUST_BACKTRACE=1")
        if [ -n "${HIVE_NEO4J_TEST_URI:-}" ]; then
          : "${HIVE_NEO4J_TEST_PASSWORD:?HIVE_NEO4J_TEST_PASSWORD is required with HIVE_NEO4J_TEST_URI}"
          test_environment+=(
            -e "HIVE_NEO4J_TEST_URI"
            -e "HIVE_NEO4J_TEST_USERNAME=${HIVE_NEO4J_TEST_USERNAME:-neo4j}"
            -e "HIVE_NEO4J_TEST_PASSWORD")
        fi
        docker run --rm \
          --platform linux/amd64 \
          --network host \
          --mount "type=bind,src=$verified/hive-tests,dst=/tests,readonly" \
          "${test_environment[@]}" \
          "{{.HIVE_TEST_RUNTIME_IMAGE}}" \
          bash -ec 'for test_binary in /tests/*; do "$test_binary"; done'
        BASH

  build:
    desc: Build the Hive worker in its pinned builder image.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - >-
        docker buildx build
        --platform linux/amd64
        --target builder
        --output type=cacheonly
        --build-context nook-app={{.NOOK_APP_CONTEXT}}
        --file hive/Dockerfile
        .

  test:
    desc: Run Hive behavior tests in its pinned builder image.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        compiled="$(mktemp -d)"
        cleanup() {
          rm -rf "$compiled"
        }
        trap cleanup EXIT
        command=(docker buildx build
          --platform linux/amd64
          --target test-export
          --output "type=local,dest=$compiled")
        if [ -n "${HIVE_CACHE_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_FROM")
        fi
        if [ -n "${HIVE_CACHE_TO:-}" ]; then
          command+=(--cache-to "$HIVE_CACHE_TO")
        fi
        access_file="{{.SCCACHE_S3_ACCESS_KEY_FILE}}"
        secret_file="{{.SCCACHE_S3_SECRET_KEY_FILE}}"
        if [ -r "$access_file" ] && [ -r "$secret_file" ]; then
          command+=(--secret "id=sccache_s3_access_key,src=$access_file")
          command+=(--secret "id=sccache_s3_secret_key,src=$secret_file")
        else
          echo "Hive S3 sccache credentials unavailable" >&2
        fi
        command+=(
          --build-context "nook-app={{.NOOK_APP_CONTEXT}}"
          --file hive/Dockerfile
          .)
        "${command[@]}"
        test -n "$(find "$compiled/hive-tests" -type f -print -quit)"
        test_kib="$(du -sk "$compiled/hive-tests" | awk '{print $1}')"
        if [ "$test_kib" -gt 524288 ]; then
          echo "Refusing oversized Hive test export: ${test_kib} KiB" >&2
          exit 1
        fi
        test_environment=(-e "RUST_BACKTRACE=1")
        if [ -n "${HIVE_NEO4J_TEST_URI:-}" ]; then
          : "${HIVE_NEO4J_TEST_PASSWORD:?HIVE_NEO4J_TEST_PASSWORD is required with HIVE_NEO4J_TEST_URI}"
          test_environment+=(
            -e "HIVE_NEO4J_TEST_URI"
            -e "HIVE_NEO4J_TEST_USERNAME=${HIVE_NEO4J_TEST_USERNAME:-neo4j}"
            -e "HIVE_NEO4J_TEST_PASSWORD")
        fi
        docker run --rm \
          --platform linux/amd64 \
          --network host \
          --mount "type=bind,src=$compiled/hive-tests,dst=/tests,readonly" \
          "${test_environment[@]}" \
          "{{.HIVE_TEST_RUNTIME_IMAGE}}" \
          bash -ec 'for test_binary in /tests/*; do "$test_binary"; done'
        BASH

  cache:publish:
    desc: Publish the manifest-keyed release and verification dependency graphs.
    dir: '{{.HIVE_DIR}}'
    preconditions:
      - sh: test -n "${HIVE_CACHE_TO:-}"
        msg: HIVE_CACHE_TO is required for cache publication.
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail
        command=(docker buildx build
          --platform linux/amd64
          --target cache-publish
          --output type=cacheonly
          --cache-to "$HIVE_CACHE_TO")
        if [ -n "${HIVE_CACHE_FROM:-}" ]; then
          command+=(--cache-from "$HIVE_CACHE_FROM")
        fi
        access_file="{{.SCCACHE_S3_ACCESS_KEY_FILE}}"
        secret_file="{{.SCCACHE_S3_SECRET_KEY_FILE}}"
        if [ -r "$access_file" ] && [ -r "$secret_file" ]; then
          command+=(--secret "id=sccache_s3_access_key,src=$access_file")
          command+=(--secret "id=sccache_s3_secret_key,src=$secret_file")
        else
          echo "Hive S3 sccache credentials unavailable" >&2
        fi
        command+=(
          --build-context "nook-app={{.NOOK_APP_CONTEXT}}"
          --file hive/Dockerfile
          .)
        "${command[@]}"
        BASH

  image:
    desc: Build the linux/amd64 Hive worker image.
    dir: '{{.HIVE_DIR}}'
    cmds:
      - >-
        docker build
        --platform linux/amd64
        --tag {{.HIVE_IMAGE}}
        --build-context nook-app={{.NOOK_APP_CONTEXT}}
        --file hive/Dockerfile
        .
